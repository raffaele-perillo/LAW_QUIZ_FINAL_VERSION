const LABELS = ['A','B','C','D'];
let selectedTopic = 'ALL';
let selectedMode = 10;
let sessionQ = [], cur = 0, score = 0, answered = false, wrongs = [];
let sessions = 0, bestScore = null;

function buildTopics() {
  const grid = document.getElementById('topic-grid');
  const allBtn = document.createElement('div');
  allBtn.className = 'topic-btn active';
  allBtn.innerHTML = '<div class="tb-num">ALL</div><div class="tb-name">All Topics Mixed</div>';
  allBtn.onclick = () => selectTopic(allBtn, 'ALL');
  grid.appendChild(allBtn);
  Object.keys(TOPICS).forEach(key => {
    const btn = document.createElement('div');
    btn.className = 'topic-btn';
    const parts = key.split(' — ');
    btn.innerHTML = '<div class="tb-num">'+parts[0]+'</div><div class="tb-name">'+(parts[1]||'')+'</div>';
    btn.onclick = () => selectTopic(btn, key);
    grid.appendChild(btn);
  });
  const total = Object.values(TOPICS).reduce((s,v)=>s+v.length,0);
  document.getElementById('stat-total').textContent = total;
}

function selectTopic(el, topic) {
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedTopic = topic;
}

function selectMode(el, n) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedMode = n;
}

function getPool() {
  if (selectedTopic === 'ALL') return Object.values(TOPICS).flat();
  return TOPICS[selectedTopic] || [];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = getPool();
  if (!pool.length) return;
  sessionQ = shuffle(pool).slice(0, Math.min(selectedMode, pool.length));
  cur = 0; score = 0; answered = false; wrongs = [];
  show('quiz-card'); hide('home-card'); hide('score-card');
  renderQ();
}

function renderQ() {
  const q = sessionQ[cur];
  const pct = Math.round((cur/sessionQ.length)*100);
  document.getElementById('q-num').textContent = 'Question '+(cur+1)+' of '+sessionQ.length;
  document.getElementById('q-score').textContent = '✅ '+score+' correct';
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('q-topic').textContent = q.slide ? '📖 '+q.slide : '';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('next-wrap').style.display = 'none';
  document.getElementById('next-btn').textContent = (cur+1<sessionQ.length) ? 'Next question →' : 'See results →';
  document.getElementById('opts').innerHTML = q.opts.map((o,i) =>
    '<button class="ob" id="ob'+i+'" onclick="answer('+i+')">'
        +'<span class="ol">'+LABELS[i]+'.</span>'
        +'<div style="flex:1"><div>'+o+'</div><div class="opt-exp" id="exp'+i+'"></div></div>'
        +'</button>'
  ).join('');
  answered = false;
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const q = sessionQ[cur];
  for (let i=0; i<q.opts.length; i++) {
    const b = document.getElementById('ob'+i);
    const e = document.getElementById('exp'+i);
    b.disabled = true;
    e.textContent = q.exps[i];
    if (i===q.correct) b.classList.add(idx===q.correct?'correct':'reveal');
    else if (i===idx && idx!==q.correct) b.classList.add('wrong');
    else b.classList.add('neutral');
  }
  if (idx===q.correct) score++;
  else wrongs.push(cur);
  document.getElementById('q-score').textContent = '✅ '+score+' correct';
  document.getElementById('next-wrap').style.display = 'block';
}

function nextQ() {
  cur++;
  if (cur>=sessionQ.length) showScore();
  else renderQ();
}

function showScore() {
  hide('quiz-card'); show('score-card');
  sessions++;
  const pct = Math.round(score/sessionQ.length*100);
  if (bestScore===null || pct>bestScore) bestScore = pct;
  document.getElementById('stat-done').textContent = sessions;
  document.getElementById('stat-best').textContent = bestScore+'%';
  const msg = pct>=80 ? '🎯 Excellent! You are ready for the exam.'
             : pct>=60 ? '📚 Good result — review the topics you missed.'
             : '💪 Keep studying and try again!';
  document.getElementById('score-big').textContent = score+'/'+sessionQ.length;
  document.getElementById('score-pct').textContent = pct+'% correct';
  document.getElementById('score-msg').textContent = msg;
  document.getElementById('miss-section').innerHTML = wrongs.length>0
    ? '<div class="miss-title">📌 Topics to review:</div>'+wrongs.map(i=>'<div class="miss-item">'+sessionQ[i].q+'</div>').join('')
    : '<p style="color:#388e3c;font-size:14px">🎉 Perfect score! No topics to review.</p>';
}

function retryQuiz() { startQuiz(); }
function goHome() { hide('quiz-card'); hide('score-card'); show('home-card'); }
function show(id) { document.getElementById(id).style.display='block'; }
function hide(id) { document.getElementById(id).style.display='none'; }

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', buildTopics);
} else {
  buildTopics();
}
</script>
</body>
</html>
