{q:"Under the UCITS Directive, Money Market Funds (MMFs) are best described as:",opts:["Funds which invest only in other currencies", "A kind of investment vehicle that primarily invests in listed companies", "Collective investment undertakings which operate as short-term cash management tools", "Investment funds that guarantee capital protection and a minimum rate of return"],exps:["❌ MMFs do not invest in currencies as such; they invest in short-term, highly liquid financial assets.", "❌ MMFs do not primarily invest in listed companies; that describes equity funds.", "✅ Correct — Money Market Funds (MMFs) are collective investment undertakings which operate as short-term cash management tools, investing in short-term financial assets aiming to provide returns aligned with money market rates and/or preserve investment value.", "❌ MMFs do not guarantee capital protection or a minimum rate of return — in fact, the MMF Regulation prohibits sponsor support that would guarantee NAV stability."],correct:2,slide:"Slide 08"}
,
{q:"Under the UCITS Directive, the 5/10/40 rule provides that:",opts:["A UCITS must hold at least 5% of its assets in cash, may invest up to 10% in derivative instruments, and must allocate at least 40% of its portfolio to sovereign debt", "A UCITS may not invest more than 5% of its assets in securities issued by the same issuer — although this limit may be raised to 10% — provided that the aggregate exposure to issuers above the 5% threshold does not exceed 40% of total assets", "A UCITS may invest a maximum of 5% in equity instruments, 10% in money market instruments, and 40% in units of other UCITS", "A UCITS must invest at least 5% in SMEs, maintain at most 10% in illiquid assets, and limit derivatives exposure to 40% of NAV"],exps:["❌ This misrepresents the 5/10/40 rule; it is an issuer concentration rule, not an asset class allocation requirement.", "✅ Correct — the 5/10/40 rule means: maximum 5% of UCITS assets in securities from a single issuer (raisable to 10%); but aggregate exposure above the 5% threshold cannot exceed 40% of total assets. This prevents excessive concentration in a small number of issuers.", "❌ The 5/10/40 rule concerns issuer concentration limits, not asset class percentages (equity vs money market vs other UCITS).", "❌ The 5/10/40 rule is not about SME investment, illiquid assets, or derivatives limits."],correct:1,slide:"Slide 08"}
,
{q:"In the UCITS Directive, the depositary bank:",opts:["Ensures that the management company complies with the investment strategy it declared in its prospectus", "Enables subscribers to deposit their assets so that the management company can manage those portfolios", "Ensures that the value of the fund units is calculated in accordance with the law and the fund rules", "Drafts periodic reports on the fund's performance"],exps:["❌ While the depositary exercises oversight over management company compliance, its primary specific function regarding valuation is described in option 3.", "❌ The depositary holds the fund's assets in custody — it does not hold subscriber assets for individual portfolio management.", "✅ Correct — under the UCITS Directive, the depositary ensures that the value of fund units is calculated in accordance with the law and the fund rules, acting as custodian and exercising oversight over management company compliance.", "❌ Drafting periodic reports on fund performance is the management company's responsibility, not the depositary's."],correct:2,slide:"Slide 08"}
,
{q:"Which statement correctly describes the differences between AIFs and UCITS regarding their structure?",opts:["AIFs are necessarily open-ended, while UCITS can be either open-ended or closed-ended", "UCITS funds are necessarily open-ended, while AIFs can be either open-ended or closed-ended. Only UCITS — as opposed to AIFs — are subject to prudential requirements to maintain a stable NAV and sufficient liquidity", "UCITS funds are necessarily open-ended, while AIFs are necessarily closed-ended", "Both AIFs and UCITS must be open-ended to ensure investor liquidity"],exps:["❌ This reverses the correct description — UCITS must be open-ended; AIFs may be either.", "✅ Correct — UCITS are necessarily open-ended funds (with mandatory redemption at least twice monthly); AIFs can be either open-ended or closed-ended. Only for UCITS is the principle of risk-spreading mandatory.", "❌ AIFs are not necessarily closed-ended; many hedge funds operate as open-ended AIFs.", "❌ Only UCITS must be open-ended; AIFs may be closed-ended."],correct:1,slide:"Slide 08"}
,
{q:"Under the AIFMD, what is the legal definition of an AIF?",opts:["Any fund investing in equity securities listed on regulated markets","Any collective investment undertaking that is not a UCITS, regardless of legal structure or jurisdiction","A fund that raises capital from the general public and invests in transferable securities","Only closed-ended funds investing in real assets and infrastructure"],exps:["❌ AIFs are defined residually — any non-UCITS collective investment undertaking, not limited to listed equities.","✅ Correct — an AIF is defined residually as any collective investment undertaking that does not require UCITS Directive authorisation. This negative definition ensures broad coverage across hedge funds, private equity, real estate, and infrastructure.","❌ The requirement to raise from the 'general public' and invest in 'transferable securities' describes UCITS, not AIFs.","❌ Closed-ended real assets funds are one type of AIF, but the definition is far broader."],correct:1,slide:"Slide 08"},
{q:"The UCITS 5/10/40 diversification rule means that:",opts:["A UCITS must invest at least 40% in sovereign bonds and 10% in money market instruments","Maximum 5% of assets may be in securities from one issuer (extendable to 10%), but aggregate exposures above 5% cannot exceed 40% of total assets","A UCITS must have at least 5 investments, 10 different asset classes, and invest globally in 40 countries","Maximum 40% in equities, 10% in alternatives, and 5% in derivatives"],exps:["❌ The 5/10/40 rule concerns concentration limits per issuer, not asset class allocation.","✅ Correct — the 5/10/40 rule limits concentration: maximum 5% in securities from one issuer (can be raised to 10%), but aggregate exposure above 5% to single issuers cannot exceed 40% of total assets.","❌ The rule concerns per-issuer concentration limits, not the number of investments or geographic spread.","❌ The rule is a concentration limit per issuer, not an asset class allocation rule."],correct:1,slide:"Slide 08"},
{q:"What is the minimum frequency with which a UCITS must offer unitholders the right to have units repurchased or redeemed?",opts:["At least annually","At least quarterly","At least twice monthly","At any time, with immediate effect"],exps:["❌ Annual redemption is too infrequent for a UCITS open-ended structure.","❌ Quarterly is less frequent than the required standard.","✅ Correct — UCITS must offer redemptions at least twice monthly (usually daily in practice), reflecting their open-ended nature and liquidity obligations.","❌ Immediate redemption at any time is not required; the minimum standard is twice monthly."],correct:2,slide:"Slide 08"},
{q:"Under AIFMD II (2024), the leverage cap for open-ended loan origination AIFs is:",opts:["100%","175%","300%","500%"],exps:["❌ 100% is too low; it applies to retail ELTIFs for borrowing limits.","✅ Correct — AIFMD II sets a 175% leverage cap for open-ended loan origination AIFs and a higher 300% cap for closed-ended loan origination AIFs.","❌ 300% is the cap for closed-ended loan origination AIFs, not open-ended.","❌ 500% is not a leverage cap found in AIFMD II."],correct:1,slide:"Slide 08"},
{q:"EuVECA funds must invest at least what percentage of their aggregate capital commitments in qualifying portfolio undertakings?",opts:["50%","60%","70%","85%"],exps:["❌ 50% is too low for the EuVECA qualifying investment threshold.","❌ 60% is not the correct threshold.","✅ Correct — EuVECA funds must invest at least 70% of aggregate capital and uncalled commitments in qualifying portfolio undertakings (equity, quasi-equity, loans, etc. in eligible SMEs).","❌ 85% is the master-feeder threshold for UCITS feeder funds, not the EuVECA requirement."],correct:2,slide:"Slide 08"},
{q:"ELTIF 2.0 (Regulation (EU) 2023/606) modified the original ELTIF structure primarily by:",opts:["Removing retail investor access and restricting ELTIFs to professional investors only","Allowing limited early redemptions under specified conditions, creating a 'semi-closed' structure","Abolishing the minimum 55% qualifying asset threshold","Reducing the marketing passport to domestic markets only"],exps:["❌ ELTIF 2.0 maintained and enhanced retail investor access — it did not restrict it.","✅ Correct — a key ELTIF 2.0 innovation was allowing limited early redemptions under specified conditions, creating a semi-closed structure that makes ELTIFs more attractive to retail investors.","❌ ELTIF 2.0 retained the 55% qualifying asset requirement.","❌ ELTIF 2.0 maintained the EU-wide marketing passport."],correct:1,slide:"Slide 08"},
{q:"Which EU fund label requires portfolio undertakings to be NOT listed on a regulated market and to have achieving measurable positive social impact as their primary objective?",opts:["EuVECA","ELTIF","EuSEF","MMF"],exps:["❌ EuVECA focuses on venture capital and innovation in SMEs, not primarily on social impact.","❌ ELTIFs focus on long-term infrastructure and real economy assets, not specifically social enterprises.","✅ Correct — EuSEF (European Social Entrepreneurship Funds) requires qualifying portfolio undertakings to not be listed on regulated markets or MTFs and to have achieving measurable positive social impact embedded as their primary objective.","❌ MMFs (Money Market Funds) invest in short-term financial assets, not social enterprises."],correct:2,slide:"Slide 08"},
{q:"The prohibition on sponsor support in Money Market Fund regulation means:",opts:["MMF managers cannot invest in instruments issued by their parent company","MMFs cannot receive direct or indirect assistance from third parties aimed at guaranteeing liquidity or stabilizing NAV","Sponsors of MMFs cannot market their funds to retail investors","MMFs may not invest more than 10% of assets in instruments from a single sponsor"],exps:["❌ Issuer concentration limits address the single-issuer rule, not sponsor support.","✅ Correct — the sponsor support prohibition prevents any direct or indirect financial assistance (including cash injections or unit purchases) from sponsors aimed at guaranteeing MMF liquidity or stabilising NAV, reducing moral hazard.","❌ The prohibition concerns financial support, not marketing restrictions.","❌ Single-issuer limits and sponsor support are separate provisions."],correct:1,slide:"Slide 08"},
{q:"Under the AIFMD, the 'defined investment policy' requirement for AIFs is the most critical definitional element because:",opts:["It requires AIFs to publish their strategy in a regulated market prospectus","It must be established when investors commit, be stable over time, and be legally binding and enforceable — it is what distinguishes AIFs from general holding companies","It limits AIFs to a single asset class or geography","It requires prior ESMA approval of the investment strategy"],exps:["❌ AIFs do not require a regulated market prospectus for their strategy.","✅ Correct — the defined investment policy is the most critical element: it must be established when investors commit, remain stable over time, and be legally binding and enforceable, distinguishing AIFs from corporate entities with general commercial purposes.","❌ A defined investment policy does not limit asset class or geography — it describes the predetermined strategy, which can be diverse.","❌ Prior ESMA approval is not required for AIFM investment strategies."],correct:1,slide:"Slide 08"},
{q:"The pre-marketing regime under the CBFD framework requires that within what time frame must an AIFM notify its home authority after commencing pre-marketing?",opts:["Immediately, before commencing pre-marketing","Within 5 business days","Within 2 weeks (14 days)","Within 1 month"],exps:["❌ Pre-notification before commencing is not required; notification is after the fact.","❌ 5 business days is not the correct deadline.","✅ Correct — within 2 weeks (14 days) of commencing pre-marketing, the AIFM must send a letter to its home competent authority identifying the Member States involved, relevant periods, strategies presented, and AIFs involved.","❌ One month is too long; the 2-week notification requirement enables timely supervisory oversight."],correct:2,slide:"Slide 08"}],
"09 — Prudential Regulation":[
{q:"The IFD/IFR framework consists of which two instruments?",opts:["Regulation (EU) 2019/2033 (IFR) and Directive 2019/2034 (IFD)","Directive 2019/2033 (IFD) and Regulation 2019/2034 (IFR)","CRR and CRD IV, adapted for investment firms","MiFID II and MiFIR, supplemented by prudential provisions"],exps:["✅ Correct — the framework consists of Regulation (EU) 2019/2033 (IFR) and Directive 2019/2034 (IFD).","❌ This reverses the Regulation/Directive designations.","❌ CRR and CRD IV were the previous ill-fitting framework for investment firms.","❌ MiFID II and MiFIR are conduct rules, not the IFD/IFR prudential framework."],correct:0,slide:"Slide 09"},
{q:"The IFD/IFR framework replaced which previous regime for investment firms?",opts:["MiFID II/MiFIR conduct rules","The CRR/CRD IV prudential regime designed for credit institutions — ill-suited for most investment firm activities as it addressed banking risks like credit risk and deposit withdrawal liquidity","The UCITS Directive for UCITS management companies","The AIFMD for alternative investment fund managers"],exps:["❌ MiFID II/MiFIR are conduct rules that continue to apply alongside IFD/IFR.","✅ Correct — investment firms were previously subject to the CRR/CRD IV regime designed for credit institutions, which was ill-suited as it addressed banking risks like credit risk and deposit withdrawal liquidity.","❌ The UCITS Directive remains the framework for UCITS management companies.","❌ The AIFMD remains the framework for AIFMs."],correct:1,slide:"Slide 09"},
{q:"Class 1 investment firms under the IFD/IFR framework are:",opts:["Firms authorised to hold client assets, subject to the new IFR/IFD regime","Small non-interconnected firms with the lightest prudential regime","Large entities (assets ≥€30 billion) engaged in high-risk activities like proprietary trading or underwriting — must seek authorisation as credit institutions and follow the CRR/CRD regime","Medium-sized firms subject to K-factor requirements"],exps:["❌ Firms holding client assets subject to the new IFR/IFD describes Class 2.","❌ Small non-interconnected firms with the lightest regime describes Class 3.","✅ Correct — Class 1 firms are large entities (assets ≥€30 billion) engaged in high-risk activities like proprietary trading or underwriting; they must seek credit institution authorisation.","❌ Medium-sized firms subject to K-factors describes Class 2."],correct:2,slide:"Slide 09"},
{q:"Class 2 investment firms are best described as:",opts:["Class 1 firms that have voluntarily chosen the IFD/IFR regime","Firms authorised to hold client assets that exceed thresholds like €1.2B AuM or €30M annual turnover, subject to the new IFR/IFD regime including K-factor requirements","Small non-interconnected firms below Class 2 thresholds with a lighter prudential regime","Firms engaged exclusively in investment advice with no client asset-holding"],exps:["❌ Class 1 firms must follow CRR/CRD; they cannot simply choose IFD/IFR.","✅ Correct — Class 2 firms are authorised to hold client assets and exceed specific thresholds (€1.2B AuM, €30M turnover); they are subject to the new IFR/IFD regime including K-factor requirements.","❌ Firms below Class 2 thresholds describe Class 3.","❌ Firms providing only investment advice that don't hold client assets would fall into Class 3."],correct:1,slide:"Slide 09"},
{q:"The minimum initial capital for firms engaged in proprietary trading, underwriting, or guaranteed placement services is:",opts:["€75,000","€150,000","€750,000","€1,000,000"],exps:["❌ €75,000 is the minimum for basic services (order reception, execution, portfolio management, and advice without holding client assets).","❌ €150,000 is the minimum for MTF/OTF operators.","✅ Correct — €750,000 is required for high-risk activities: proprietary trading, underwriting, or guaranteed placement services.","❌ €1,000,000 is not the regulatory threshold set by IFR."],correct:2,slide:"Slide 09"},
{q:"Class 2 investment firms must maintain own funds equal to the greatest of three requirements. Which are they?",opts:["Base capital requirement, tier 1 capital requirement, and leverage ratio requirement","Fixed overhead requirement, permanent minimum capital, and K-factor requirement (risk-based)","Initial capital requirement, solvency capital requirement, and minimum capital guarantee","Pillar 1 capital, Pillar 2 guidance, and capital conservation buffer"],exps:["❌ These are banking/insurance capital concepts, not IFD/IFR for Class 2 firms.","✅ Correct — Class 2 firms must hold own funds equal to the greatest of: fixed overhead requirement, permanent minimum capital, and K-factor requirement.","❌ Solvency capital requirement applies to insurance undertakings (Solvency II), not investment firms.","❌ Pillar 1/2 and capital conservation buffers are banking concepts under CRR/CRD."],correct:1,slide:"Slide 09"},
{q:"The K-factor methodology for Class 2 investment firms measures which risk categories?",opts:["Credit risk, market risk, and operational risk (as in Basel framework)","Customer risk (client money and instruments), market risk (trading exposure), and business risk (operational risks from business model)","Counterparty risk, settlement risk, and concentration risk","Liquidity risk, interest rate risk, and reputational risk"],exps:["❌ The Basel framework risk categories are banking-focused; K-factors are designed specifically for investment firms.","✅ Correct — K-factors measure: customer risk (AuM, client orders handled), market risk (trading positions), and business risk (fixed costs, revenue volatility).","❌ Counterparty, settlement, and concentration risk are related but not the three K-factor categories.","❌ Liquidity, interest rate, and reputational risk are not the three K-factor categories."],correct:1,slide:"Slide 09"},
{q:"Tier 1 capital must represent at least what percentage of total capital requirements for Class 2 and 3 investment firms?",opts:["25%","33%","56%","75%"],exps:["❌ 25% is the fixed overhead buffer requirement, not the Tier 1 minimum.","❌ 33% is not the regulatory minimum for Tier 1 capital for investment firms.","✅ Correct — Tier 1 capital must represent at least 56% of total capital requirements for Class 2 and 3 investment firms.","❌ 75% is not the regulatory minimum cited."],correct:2,slide:"Slide 09"},
{q:"Article 43 IFR requires investment firms to hold liquid assets equivalent to at least:",opts:["10% of their annual fixed overheads","One-third of their general expense requirement","50% of their minimum initial capital","One-quarter of their previous year's fixed overheads"],exps:["❌ 10% of annual fixed overheads is not the IFR liquidity requirement.","✅ Correct — Article 43 IFR requires most investment firms to hold liquid assets equivalent to at least one-third of their general expense requirement.","❌ 50% of minimum initial capital is not the IFR liquidity requirement.","❌ One-quarter of previous year's fixed overheads describes part of the capital requirement, not the liquidity requirement."],correct:1,slide:"Slide 09"},
{q:"The concentration risk limit for Class 2 investment firms per client or group of connected clients is:",opts:["10% of own funds","20% of own funds","25% of own funds","50% of own funds"],exps:["❌ 10% is below the IFR concentration limit.","❌ 20% is not the concentration limit set by IFR.","✅ Correct — the concentration risk limit is 25% of own funds per client or group of connected clients.","❌ 50% exceeds the IFR concentration limit."],correct:2,slide:"Slide 09"},
{q:"UCITS management company capital requirements follow which structure?",opts:["Base capital of €125,000; 0.02% of AuM above €250 million; combined cap of €10 million","Base capital of €730,000; 0.04% of AuM above €500 million; combined cap of €50 million","Base capital of €50,000; 0.01% of AuM above €100 million; combined cap of €5 million","Base capital of €300,000; 0.05% of AuM above €1 billion; combined cap of €20 million"],exps:["✅ Correct — UCITS management companies: base capital €125,000; additional 0.02% of AuM above €250 million threshold; combined initial capital plus additional amount cannot exceed €10 million.","❌ These figures do not match the UCITS Directive capital requirements.","❌ These figures do not match the UCITS Directive capital requirements.","❌ These figures do not match the UCITS Directive capital requirements."],correct:0,slide:"Slide 09"},
{q:"AIFMs must have initial capital of at least €125,000. When portfolios exceed €250 million, which additional requirement applies?",opts:["Own funds must double to €250,000","Additional own funds of 0.02% of the excess amount are required, capped at €10 million; at all times own funds must equal at least one quarter of the preceding year's fixed overheads","Additional own funds of 0.1% of the total portfolio value are required","The AIFM must convert to a credit institution and apply for banking authorisation"],exps:["❌ Doubling to €250,000 is not the AIFMD requirement.","✅ Correct — when portfolios exceed €250 million, additional own funds of 0.02% of the excess are required, capped at €10 million; own funds must always equal at least one quarter of the preceding year's fixed overheads.","❌ 0.1% of total portfolio value is not the AIFMD requirement.","❌ AIFMs are not required to become credit institutions."],correct:1,slide:"Slide 09"},
{q:"The key difference between prudential requirements for investment firms versus fund managers is:",opts:["Investment firms require no capital; fund managers require substantial capital buffers","Investment firms face risk-based K-factors and substantial own funds for loss absorption; fund managers have lower baseline capital requirements reflecting asset segregation and diversification as primary protections","Investment firms and fund managers have identical capital requirements under CRR","Fund managers require more capital than investment firms because they manage systemic risk"],exps:["❌ Investment firms do require capital; the IFD/IFR framework sets out their requirements.","✅ Correct — investment firms face risk-based K-factors and direct position risks requiring substantial own funds; fund managers have lower baseline capital requirements as risks are concentrated in segregated asset pools protected by diversification.","❌ The IFD/IFR framework specifically replaced the ill-fitting CRR framework for investment firms.","❌ Fund managers generally have lower, not higher, capital requirements than investment firms."],correct:1,slide:"Slide 09"},
{q:"Class 3 investment firms must hold own funds equal to the higher of:",opts:["Fixed overhead requirement and K-factor requirement","General minimum capital requirement and 25% of previous year's fixed overheads (cost requirement)","Base capital and tier 1 capital requirement","Initial capital requirement and solvency capital requirement"],exps:["❌ K-factor requirement applies to Class 2 firms, not Class 3.","✅ Correct — Class 3 firms must hold own funds equal to the higher of: the general minimum capital requirement and the cost requirement (25% of previous year's fixed overheads).","❌ Base capital and tier 1 capital are banking concepts under CRR/CRD.","❌ Solvency capital requirement applies to insurance undertakings."],correct:1,slide:"Slide 09"},
{q:"Professional indemnity insurance for AIFMs covers risks of:",opts:["Market losses suffered by fund investors","Professional negligence — AIFMs must hold PI insurance OR provide additional own funds equal to 0.01% of portfolio value","Depositary losses from custodial failures","Systemic risk arising from interconnected fund exposures"],exps:["❌ Market losses are borne by fund investors as part of normal investment risk.","✅ Correct — AIFMs must hold professional indemnity insurance (or equivalent additional own funds equal to 0.01% of portfolio value) to cover risks of professional negligence.","❌ Depositary losses from custodial failures are the depositary's responsibility under the AIFMD strict liability regime.","❌ Systemic risk is not what PI insurance covers."],correct:1,slide:"Slide 09"},
{q:"Member States may allow UCITS management companies to replace up to what percentage of the additional capital (above €250M AuM) with a guarantee?",opts:["25%","33%","50%","75%"],exps:["❌ 25% is not the percentage that may be replaced by a guarantee.","❌ 33% is not the percentage that may be replaced by a guarantee.","✅ Correct — Member States may allow up to 50% of the additional capital to be replaced by a guarantee from a qualifying credit institution or insurance company.","❌ 75% is not the percentage that may be replaced by a guarantee."],correct:2,slide:"Slide 09"}
,
{q:"Class 1-minus investment firms under IFD/IFR are firms with:",opts:["Consolidated business ≥€30 billion — must seek credit institution authorisation", "Consolidated business ≥€15 billion or group assets ≥€15 billion — some CRD IV/CRR rules apply, but no credit institution authorisation required", "AuM ≥€1.2 billion or annual turnover ≥€30M — subject to full IFR/IFD regime including K-factors", "No client assets, no proprietary trading, below Class 2 thresholds — subject to a lighter prudential regime"],exps:["❌ Firms with assets ≥€30 billion are Class 1.", "✅ Correct — Class 1-minus firms have consolidated business ≥€15 billion or group assets ≥€15 billion; some CRD IV/CRR rules apply but no credit institution authorisation is required.", "❌ AuM ≥€1.2 billion describes Class 2 thresholds.", "❌ No client assets, no proprietary trading, below Class 2 thresholds describes Class 3."],correct:1,slide:"Slide 09"},
{q:"Class 3 investment firms are defined as firms that:",opts:["Are authorised to hold client assets and exceed Class 2 thresholds", "Cannot hold client assets, don't engage in proprietary trading, and fall below Class 2 thresholds — subject to a lighter prudential regime", "Have assets under management exceeding €30 billion", "Provide only investment advice to retail clients without holding client assets"],exps:["❌ Holding client assets and exceeding thresholds describes Class 2.", "✅ Correct — Class 3 firms cannot hold client assets, don't engage in proprietary trading, and fall below Class 2 thresholds; they benefit from a lighter prudential regime.", "❌ Assets exceeding €30 billion would make a firm Class 1.", "❌ Providing only investment advice is one example of a Class 3 firm but the definition is broader."],correct:1,slide:"Slide 09"},
{q:"The SREP (Supervisory Review and Evaluation Process) under IFD applies:",opts:["To all investment firms regardless of class", "Mandatorily to Class 2 investment firms; competent authorities may require it for Class 3 firms", "Only to Class 1 and 1-minus firms subject to CRR/CRD", "Only to firms with AuM above €10 billion"],exps:["❌ The SREP is not mandatory for all investment firm classes.", "✅ Correct — the SREP with defined powers and instruments is mandatory for Class 2 investment firms; competent authorities may require it for Class 3 firms.", "❌ Class 1 and 1-minus firms are subject to the banking SREP under CRR/CRD.", "❌ The €10 billion AuM threshold is not the SREP applicability criterion."],correct:1,slide:"Slide 09"},
{q:"Article 43 IFR explicitly excludes from 'liquid assets' the following:",opts:["Government bonds with remaining maturity over 1 year", "Client money and financial instruments, even if held in the investment firm's name", "Fixed assets and real estate owned by the investment firm", "Receivables from other group entities"],exps:["❌ Government bonds with short maturity would generally qualify as liquid assets.", "✅ Correct — Article 43 IFR explicitly excludes client money and financial instruments from the liquid assets calculation, even if held in the investment firm's name.", "❌ Fixed assets and real estate are not the specific exclusion cited.", "❌ Group receivables are not the specific exclusion cited."],correct:1,slide:"Slide 09"},
{q:"Consolidated supervision under IFD applies to:",opts:["Only Class 1 investment firms that must seek credit institution authorisation", "Holding companies and financial subsidiaries within investment firm groups, ensuring group-level capital adequacy and risk management", "Only cross-border groups with subsidiaries in more than three Member States", "All investment firms regardless of whether they belong to a group"],exps:["❌ Consolidated supervision applies beyond Class 1 firms.", "✅ Correct — consolidated supervision applies to holding companies and financial subsidiaries, ensuring group-level capital adequacy and risk management.", "❌ Consolidated supervision applies to all qualifying investment firm groups.", "❌ Consolidated supervision applies to groups, not all individual investment firms."],correct:1,slide:"Slide 09"}
,
{q:"Which of the following plans is NOT adopted in the 'preparation' phase of crisis management under the BRRD?",opts:["Recovery plans", "Liquidation plans", "Resolution plans", "All the above answers are correct"],exps:["❌ Recovery plans ARE part of the preparation phase — institutions must prepare recovery plans identifying measures to restore financial position.", "❌ Liquidation plans ARE part of the preparation phase — authorities plan for orderly wind-down if resolution is not in the public interest.", "✅ Correct — resolution plans are NOT part of the preparation phase; they are adopted by resolution authorities as part of the resolution planning phase, distinct from the preparation measures adopted by institutions themselves.", "❌ Not all of the above are correct — resolution plans are not adopted in the preparation phase."],correct:2,slide:"Slide 09"}
,
{q:"The purpose of the Net Stable Funding Ratio (NSFR) is to:",opts:["Ensure that banks hold sufficient liquid assets to survive a 30-day stress scenario", "Ensure that banks are able to appropriately handle cash outflows", "Limit the maximum leverage that banks can take on their balance sheet", "Ensure that credit institutions maintain a minimum level of own funds"],exps:["❌ Surviving a 30-day stress scenario describes the purpose of the Liquidity Coverage Ratio (LCR), not the NSFR.", "✅ Correct — the NSFR requires banks to maintain a stable funding profile over a one-year horizon, ensuring they are able to appropriately handle cash outflows. It complements the short-term LCR.", "❌ Limiting maximum leverage describes the Leverage Ratio under CRR, not the NSFR.", "❌ Minimum own funds requirements are set by CRR capital requirements (CET1, Tier 1, Total Capital), not the NSFR."],correct:1,slide:"Slide 09"}
,
{q:"Which of the following issues fall in the scope of the Solvency II Directive?",opts:["Governance requirements, with the exclusion of fit and proper requirements", "Only fit and proper requirements", "Governance requirements as well as fit and proper requirements", "Neither governance requirements nor fit and proper requirements"],exps:["❌ Solvency II Pillar 2 includes BOTH governance requirements AND fit and proper requirements — they cannot be separated.", "❌ Fit and proper requirements are part of Solvency II, but so are comprehensive governance requirements.", "✅ Correct — Solvency II Pillar 2 covers governance requirements (including board structures, risk management, internal control, audit, actuarial, and outsourcing) as well as fit and proper requirements for persons running the undertaking.", "❌ Both governance and fit and proper requirements are expressly within Solvency II's scope."],correct:2,slide:"Slide 09"}
,
{q:"Which of the following is NOT a requirement for authorisation to carry out banking activity?",opts:["Adequacy of the structural organisation", "Qualification and competence of individuals performing administrative and managerial functions", "Preliminary authorisation to carry out investment services pursuant to MiFID II", "Feasibility of the envisaged programme"],exps:["❌ Adequacy of the structural organisation IS a requirement for banking authorisation under CRD IV.", "❌ Qualification and competence of individuals performing administrative and managerial functions IS a requirement under CRD IV (fit and proper requirements).", "✅ Correct — a preliminary MiFID II authorisation to provide investment services is NOT a requirement for banking authorisation. Credit institutions may provide investment services under their banking authorisation without a separate MiFID II licence.", "❌ Feasibility of the envisaged programme IS a requirement for banking authorisation under CRD IV."],correct:2,slide:"Slide 09"}
,
{q:"Under the IFD/IFR framework, a Class 1 investment firm (systemically important) is defined by which threshold?",opts:["Assets under management exceeding €5 billion","Consolidated assets of at least €30 billion, requiring authorisation as a credit institution","Annual turnover exceeding €1 billion","Client assets held exceeding €100 million"],exps:["❌ AuM thresholds define Class 2 firms, not Class 1.","✅ Correct — Class 1 investment firms are large entities with assets of at least €30 billion engaged in high-risk activities; they must seek authorisation as credit institutions and follow the CRR/CRD regime.","❌ Turnover thresholds apply to Class 2 firms (€30M annual turnover threshold).","❌ Class 1 classification is based on balance sheet size, not client asset custody levels."],correct:1,slide:"Slide 09"},
{q:"The minimum initial capital requirement for an investment firm wishing to provide proprietary trading, underwriting, or guaranteed placement services is:",opts:["€75,000","€150,000","€500,000","€750,000"],exps:["❌ €75,000 is the minimum for basic services (order reception, execution, portfolio management, advice) without holding client assets.","❌ €150,000 is the minimum for MTF/OTF operators.","❌ €500,000 is not a standard MiFID threshold.","✅ Correct — €750,000 is the minimum initial capital for high-risk activities including proprietary trading, underwriting, or guaranteed placement services."],correct:3,slide:"Slide 09"},
{q:"The K-factor methodology under IFR is designed to:",opts:["Replace all capital requirements with a single fixed percentage of assets","Calculate risk-based capital requirements for Class 2 investment firms based on customer risk, market risk, and business risk","Provide a simplified flat-fee capital assessment for Class 3 firms only","Set leverage limits for investment firms engaging in algorithmic trading"],exps:["❌ K-factors provide a tailored risk-based approach, not a single fixed percentage.","✅ Correct — K-factors measure different risk categories (customer risk: AuM and client orders handled; market risk: trading positions; business risk: operational factors) to calculate capital requirements for Class 2 investment firms.","❌ K-factors apply to Class 2 firms; Class 3 firms use a simpler approach.","❌ K-factors are about capital requirements, not leverage limits."],correct:1,slide:"Slide 09"},
{q:"Under Article 43 IFR, what assets are explicitly excluded from counting as liquid assets for investment firm liquidity requirements?",opts:["Government bonds and treasury bills","Short-term deposits at credit institutions","Client money and financial instruments, even if held in the firm's name","Long-term corporate bonds"],exps:["❌ Government bonds and treasury bills count as liquid assets.","❌ Short-term deposits count as liquid assets.","✅ Correct — client money and financial instruments are explicitly excluded from the liquid asset calculation, even if held in the firm's name, because they are client assets and not available to the firm.","❌ Long-term corporate bonds may qualify depending on their liquidity; they are not explicitly excluded."],correct:2,slide:"Slide 09"},
{q:"For UCITS management companies, at what level of AuM does the additional capital requirement of 0.02% begin to apply?",opts:["€50 million","€125 million","€250 million","€500 million"],exps:["❌ €50 million is not the threshold.","❌ €125,000 is the base capital requirement for UCITS managers, not an AuM threshold.","✅ Correct — UCITS management companies must pay an additional 0.02% of assets under management exceeding €250 million, subject to a €10 million total cap.","❌ €500 million is not the correct threshold."],correct:2,slide:"Slide 09"},
{q:"The IFD/IFR framework replaced the prior CRR/CRD IV regime for most investment firms because:",opts:["The CRR/CRD IV regime was too light for investment firm risks","CRR/CRD IV was designed for credit institution risks (credit risk, liquidity from deposit withdrawals) and was ill-suited to most investment firm activities","Investment firms became too large to be supervised by national authorities","Investment firms lobbied successfully for lighter regulation after the financial crisis"],exps:["❌ The CRR/CRD IV regime was considered too heavy and ill-fitting for investment firms, not too light.","✅ Correct — CRR/CRD IV was designed to address banking risks (credit risk, liquidity from deposit withdrawals) and was inappropriate for investment firm activities; IFD/IFR provides a proportionate, tailored framework.","❌ Supervisory competence issues were not the reason for the regime change.","❌ The change reflected regulatory design logic, not lobbying outcomes."],correct:1,slide:"Slide 09"},
{q:"Class 2 investment firms must hold own funds equal to the greatest of which three requirements?",opts:["Fixed overhead requirement, permanent minimum capital, and K-factor requirement","Tier 1 capital, Tier 2 capital, and Tier 3 capital amounts","Client asset protection buffer, market risk buffer, and operational risk buffer","The higher of 56% of total capital and 25% of fixed overheads"],exps:["✅ Correct — Class 2 investment firms must hold own funds equal to the greatest of: the fixed overhead requirement (25% of prior year fixed costs), the permanent minimum capital, and the K-factor requirement.","❌ Tiers of capital describe capital quality, not the three-part test for capital level.","❌ These buffer types do not describe the IFR three-part test.","❌ These describe capital quality ratios, not the three-part level test."],correct:0,slide:"Slide 09"},
{q:"Under IFR, what is the concentration risk limit for a Class 2 investment firm's exposure to a single client or group of connected clients, as a percentage of own funds?",opts:["10%","15%","25%","40%"],exps:["❌ 10% is too low; it would unduly restrict normal business operations.","❌ 15% is not the correct limit.","✅ Correct — the concentration risk limit under IFR is 25% of own funds per client or group of connected clients.","❌ 40% exceeds the regulatory limit."],correct:2,slide:"Slide 09"},
{q:"The Tier 1 capital requirement for Class 2 and 3 investment firms under IFR must represent at least what percentage of total capital requirements?",opts:["25%","33%","56%","75%"],exps:["❌ 25% is the fixed overhead buffer requirement, not the Tier 1 minimum ratio.","❌ 33% is not the correct Tier 1 minimum for investment firms.","✅ Correct — for Class 2 and 3 investment firms, primary Tier 1 capital must represent at least 56% of total capital requirements.","❌ 75% is too high; it is not the standard Tier 1 minimum ratio for investment firms."],correct:2,slide:"Slide 09"},
{q:"Member States may allow UCITS management companies to replace up to what percentage of additional capital (above base) with a guarantee from a qualifying credit institution or insurer?",opts:["25%","33%","50%","75%"],exps:["❌ 25% is not the correct replacement percentage.","❌ 33% is not the correct replacement percentage.","✅ Correct — Member States may allow UCITS management companies to replace up to 50% of the additional capital (the 0.02% of AuM above €250M) with a guarantee from a qualifying credit institution or insurance company.","❌ 75% exceeds the permitted replacement percentage."],correct:2,slide:"Slide 09"}],
"10 — EMIR, CSDR and SFTR":[
{q:"EMIR (2012), CSDR (2014), and SFTR (2015) all emerged from:",opts:["The 2015 Capital Markets Union initiative","The G20 commitments and the 2008 financial crisis, translating commitments into binding EU law to secure post-trading processes from clearing through settlement","The Lamfalussy process level 3 convergence initiatives","The ECB's 2010 review of Target2-Securities infrastructure"],exps:["❌ The CMU initiative came later (2015); the three regulations emerged from the financial crisis.","✅ Correct — all three regulations emerged from the 2008 financial crisis, translating G20 commitments into binding EU law to secure post-trading processes.","❌ Lamfalussy level 3 involves ESA soft law; EMIR, CSDR, and SFTR are Level 1 legislation.","❌ Target2-Securities is separate ECB infrastructure; the three regulations are distinct."],correct:1,slide:"Slide 10"},
{q:"The 2009 G20 commitment regarding OTC derivatives required that:",opts:["All derivatives trading be moved from OTC to exchange-based trading immediately","All standardised OTC derivatives be cleared through CCPs, reported to trade repositories, and traded on organised platforms where appropriate","All derivative contracts be governed by ISDA Master Agreements","OTC derivatives markets be abolished and replaced by regulated markets only"],exps:["❌ Not all derivatives were moved to exchange trading; clearing and reporting were the primary mandates.","✅ Correct — the G20 committed that all standardised OTC derivatives be cleared through CCPs, reported to trade repositories, and traded on organised platforms where appropriate.","❌ ISDA Master Agreements existed before 2009; they were not mandated by G20.","❌ OTC derivatives markets were not abolished; they were reformed with new requirements."],correct:1,slide:"Slide 10"},
{q:"The CCP 'default waterfall' under EMIR must meet which standard?",opts:["Cover 1 standard — sufficient resources to cover the default of the largest clearing member","Cover 2 standard — sufficient resources to cover the simultaneous default of the two clearing members with the largest exposures","Cover 3 standard — sufficient for the simultaneous default of the three largest clearing members","Cover All standard — sufficient for the default of all clearing members simultaneously"],exps:["❌ Cover 1 is below the EMIR requirement.","✅ Correct — the Cover 2 standard requires CCPs to hold sufficient financial resources to cover the simultaneous default of the two clearing members with the largest exposures.","❌ Cover 3 exceeds the EMIR minimum requirement.","❌ Cover All is not the EMIR standard."],correct:1,slide:"Slide 10"},
{q:"The EMIR default waterfall applies resources in which order?",opts:["Mutualized default fund first, then CCP's own resources, then defaulter's margin","Defaulter's initial margin and default fund contribution first, then CCP's own 'skin-in-the-game' resources, then mutualized default fund from non-defaulting members","CCP's own resources first, then defaulter's margin, then mutualized default fund","Non-defaulting members' contributions first, then defaulter's margin, then CCP's own resources"],exps:["❌ The defaulter's resources are applied first, not the mutualized fund.","✅ Correct — the waterfall starts with the defaulter's initial margin and default fund contribution, then CCP's own 'skin-in-the-game' dedicated resources, then the mutualized default fund from non-defaulting members.","❌ CCP's own resources are not applied first.","❌ Non-defaulting members' contributions are applied after the defaulter's resources and CCP's own resources."],correct:1,slide:"Slide 10"},
{q:"EMIR 3.0 (effective December 24, 2024) introduced the Active Account Obligation, which requires:",opts:["All EU derivatives clearing to move exclusively to EU CCPs immediately","Financial counterparties above clearing threshold (FC+) and NFC+ entities above EUR 3 billion in specified IR OTC derivatives to maintain permanently functional active accounts with EU CCPs and clear at least five trades annually per subcategory","All clearing to cease at UK CCPs from January 1, 2025","Investment firms to convert all OTC derivatives to exchange-traded instruments"],exps:["❌ The active account obligation does not require exclusive EU CCP clearing immediately.","✅ Correct — FC+ and qualifying NFC+ entities must maintain permanently functional active accounts with EU CCPs and clear at least five trades annually per subcategory.","❌ UK CCPs continue under time-limited equivalence until June 30, 2028.","❌ EMIR 3.0 does not require conversion of OTC derivatives to exchange-traded instruments."],correct:1,slide:"Slide 10"},
{q:"CSDR harmonised securities settlement by requiring transactions in transferable securities executed on trading venues to settle no later than:",opts:["T+1 (one business day after trade date)","T+2 (two business days after trade date)","T+3 (three business days after trade date)","T+5 (five business days after trade date)"],exps:["❌ T+1 is the target being discussed for future reform but not yet the CSDR standard.","✅ Correct — CSDR requires transactions in transferable securities to settle no later than T+2.","❌ T+3 was the pre-CSDR standard in many jurisdictions; CSDR reduced it to T+2.","❌ T+5 is not the CSDR standard."],correct:1,slide:"Slide 10"},
{q:"A Central Securities Depository (CSD) must provide at least which core services?",opts:["Securities settlement only","Settlement service (operating a securities settlement system) PLUS at least one of: notary service (initial recording in book-entry form) or central maintenance service (maintaining securities accounts at top-tier level)","Only the notary service of recording new security issuances","Only custody services for investors' securities"],exps:["❌ CSDs must provide settlement and at least one of the other two core services.","✅ Correct — a CSD must operate a securities settlement system AND provide at least one of two additional core functions: notary service or central maintenance.","❌ The notary service alone does not constitute a CSD.","❌ Custody is an ancillary service; the core services are settlement, notary, and central maintenance."],correct:1,slide:"Slide 10"},
{q:"SFTR (Securities Financing Transactions Regulation, 2015) was adopted in response to:",opts:["The need to regulate crypto-asset financing transactions","FSB recommendations addressing risks in the shadow banking sector — SFTs contributed to excessive leverage, pro-cyclicality, and systemic interconnectedness before and during the financial crisis","The European Commission's CMU initiative requiring greater transparency in securities lending","The ESRB's concerns about sovereign debt repo markets"],exps:["❌ SFTR was not adopted for crypto-asset financing.","✅ Correct — SFTR responds to FSB recommendations addressing shadow banking risks; SFTs contributed to excessive leverage, pro-cyclicality, and systemic interconnectedness during the crisis.","❌ While CMU transparency is a broader objective, SFTR specifically responds to FSB shadow banking recommendations.","❌ SFTR covers all SFT types, not specifically sovereign debt repos."],correct:1,slide:"Slide 10"},
{q:"Under SFTR, which types of securities financing transactions must be reported?",opts:["Only repurchase transactions (repos)","Only securities lending and borrowing transactions","Repurchase transactions, securities lending/borrowing, buy-sell back/sell-buy back, and margin lending — all new SFTs and lifecycle events must be reported within one working day","Only transactions above €100 million notional value"],exps:["❌ SFTR covers all SFT types, not only repos.","❌ SFTR covers all SFT types, not only securities lending.","✅ Correct — SFTR covers repurchase transactions, securities lending/borrowing, buy-sell back/sell-buy back, and margin lending; all new SFTs and lifecycle events must be reported to trade repositories within one working day.","❌ There is no €100 million notional threshold for SFTR reporting."],correct:2,slide:"Slide 10"},
{q:"Under SFTR, collateral reuse requires which conditions?",opts:["No conditions — reuse is freely permitted without restriction","Prior written information to the collateral provider about risks and consequences, AND prior express written consent from the collateral provider, AND financial instruments transferred from the collateral provider's account","Only written consent from the collateral provider, with no other conditions","Approval from the relevant NCA and notification to ESMA"],exps:["❌ Collateral reuse is subject to specific conditions under SFTR.","✅ Correct — three conditions: (1) prior written information to collateral provider about risks; (2) prior express written consent (evidenced by signature); (3) financial instruments transferred from collateral provider's account.","❌ Written consent alone is insufficient; prior written information is also required.","❌ NCA approval is not required for collateral reuse."],correct:1,slide:"Slide 10"},
{q:"EMIR counterparties are classified as Financial Counterparties (FC) and Non-Financial Counterparties (NFC). FC+ and NFC+ designation depends on:",opts:["Whether the counterparty is registered in an EU Member State","Whether OTC derivatives positions exceed clearing thresholds — FC+ and NFC+ are subject to the clearing obligation","Whether the counterparty is supervised by a national central bank","Whether the counterparty holds more than €1 billion in total derivatives exposure"],exps:["❌ EU registration alone does not determine FC+/NFC+ status.","✅ Correct — FC+ and NFC+ are designated based on whether OTC derivatives positions exceed clearing thresholds; these entities are subject to the clearing obligation.","❌ National central bank supervision does not determine clearing threshold status.","❌ A specific €1 billion threshold is not the universal EMIR clearing threshold."],correct:1,slide:"Slide 10"},
{q:"CCP authorisation under Article 17 EMIR requires which consultation process?",opts:["Only the home competent authority reviews and approves without external consultation","The home competent authority consults the college (including ESMA, NCAs, and ESCB members) — authorisation is refused if two-thirds of college members (excluding home authority) reach a joint negative opinion","ESMA directly grants CCP authorisation after consulting the ECB","The Commission approves CCP authorisation based on the home NCA's recommendation"],exps:["❌ External consultation through a college of supervisors is required.","✅ Correct — the home competent authority consults the college; authorisation is refused if two-thirds of college members (excluding home authority) reach a joint negative opinion.","❌ ESMA does not directly grant CCP authorisation (except for third-country Tier 2 CCPs under direct supervision).","❌ The Commission is not involved in CCP authorisation under Article 17 EMIR."],correct:1,slide:"Slide 10"},
{q:"The settlement discipline regime under CSDR includes which mechanisms?",opts:["Mandatory settlement within T+1 and criminal penalties for settlement failures","Cash penalties for settlement fails and mandatory buy-in processes for persistent failures","Only voluntary buy-in processes as agreed between parties","Only cash penalties with no mandatory buy-in requirement"],exps:["❌ The CSDR standard is T+2, not T+1, and penalties are administrative rather than criminal.","✅ Correct — CSDR settlement discipline includes cash penalties for settlement fails and mandatory buy-in processes for persistent failures.","❌ Buy-in processes are mandatory, not voluntary.","❌ CSDR includes both cash penalties AND mandatory buy-in processes."],correct:1,slide:"Slide 10"},
{q:"All data reported under SFTR must be retained for a minimum of:",opts:["One year","Three years","Five years","Ten years"],exps:["❌ One year is below the SFTR minimum retention period.","❌ Three years is below the SFTR minimum retention period.","✅ Correct — all SFTR data must be retained for a minimum of five years. A Legal Entity Identifier (LEI) is required for all legal entities involved in SFT reporting.","❌ Ten years is the CSDR data retention requirement for CSDs, not SFTR."],correct:2,slide:"Slide 10"},
{q:"The CSDR book-entry requirement means:",opts:["All financial instruments must be held in physical certificate form and stored in registered vaults","Securities admitted to trading or traded on venues must be represented in book-entry form through immobilisation or dematerialised issuance","Securities must be held exclusively by authorised custodians with minimum €1 billion capital","Only government bonds are required to be held in book-entry form"],exps:["❌ Physical certificate form is the opposite of the book-entry requirement.","✅ Correct — CSDR requires securities admitted to trading or traded on venues to be represented in book-entry form through immobilisation or dematerialised issuance.","❌ The €1 billion capital requirement for custodians is not what the book-entry requirement means.","❌ The book-entry requirement applies to all securities admitted to trading, not only government bonds."],correct:1,slide:"Slide 10"}
,
{q:"The EMIR reporting obligation requires reporting all derivatives transactions to trade repositories within:",opts:["One hour of execution", "One business day after the transaction", "One week of execution", "One month, in consolidated monthly reports"],exps:["❌ One hour is too short; the EMIR reporting deadline is one business day.", "✅ Correct — all derivatives transactions (OTC and exchange-traded) must be reported to registered trade repositories within one business day after the transaction.", "❌ One week is far too long.", "❌ Monthly consolidated reports are insufficient."],correct:1,slide:"Slide 10"},
{q:"Under EMIR, variation margin is exchanged daily to:",opts:["Build up a buffer against future potential exposure during close-out periods", "Reflect current exposure from market value changes in outstanding contracts", "Satisfy the Cover 2 standard for CCPs", "Fund the CCP's default fund contributions"],exps:["❌ Building a buffer against future potential exposure describes initial margin.", "✅ Correct — variation margin is exchanged daily to reflect current exposure from market value changes in outstanding contracts.", "❌ The Cover 2 standard is a CCP capital requirement.", "❌ Default fund contributions are a separate CCP risk management tool."],correct:1,slide:"Slide 10"},
{q:"CCP board independence under EMIR requires:",opts:["The entire board must be independent from clearing members", "At least one-third of management body members must be independent", "At least 50% of management body members must be independent", "Board members must be approved by ESMA before appointment"],exps:["❌ Full board independence is not required.", "✅ Correct — EMIR requires at least one-third of management body members to be independent.", "❌ 50% is above the EMIR requirement.", "❌ ESMA approval of board members is not required."],correct:1,slide:"Slide 10"},
{q:"Under SFTR, UCITS and AIFMs must inform investors in periodic reports about:",opts:["Avoiding all use of SFTs to protect retail investors", "Use of SFTs and total return swaps, and identify such use in pre-contractual documents", "SFT usage on a weekly basis reported to ESMA", "Obtaining NCA approval before engaging in any SFT"],exps:["❌ SFT use is permitted; SFTR requires disclosure, not prohibition.", "✅ Correct — UCITS and AIFMs must inform investors in periodic reports about use of SFTs and total return swaps, and identify such use in pre-contractual documents.", "❌ Weekly reporting to ESMA is not an SFTR obligation for investment funds.", "❌ NCA approval is not required before engaging in SFTs."],correct:1,slide:"Slide 10"},
{q:"The active account obligation under EMIR 3.0 requires FC+ entities to clear at least how many trades annually per subcategory at EU CCPs?",opts:["One trade per year", "Five trades annually per subcategory per class of derivatives in active accounts (with scaled requirements for low-frequency traders)", "Ten trades per quarter", "Twenty trades per year"],exps:["❌ One trade per year is below the minimum activity requirement.", "✅ Correct — FC+ entities must clear at least five trades annually per subcategory per class of derivatives in active accounts, with scaled requirements for low-frequency traders.", "❌ Ten trades per quarter is above the minimum annual requirement.", "❌ Twenty trades per year is above the minimum requirement."],correct:1,slide:"Slide 10"},
{q:"Under CSDR, the 'book-entry requirement' means securities admitted to trading must be represented:",opts:["In physical certificate form stored in registered vaults", "In book-entry form through immobilisation or dematerialised issuance", "Exclusively in dematerialised form — physical certificates are permanently prohibited", "In any form agreed between the issuer and the CSD"],exps:["❌ Physical certificate form is the opposite of the book-entry requirement.", "✅ Correct — CSDR requires securities admitted to trading or traded on venues to be represented in book-entry form through immobilisation or dematerialised issuance.", "❌ CSDR allows both immobilisation and dematerialised issuance.", "❌ The book-entry requirement is mandated by law."],correct:1,slide:"Slide 10"}
,
{q:"The 'Cover 2' standard applicable to CCPs under EMIR means that:",opts:["CCPs must hold capital covering losses from the two largest European markets","CCPs must maintain financial resources sufficient to cover the simultaneous default of the two clearing members with the largest exposures","CCPs must cover two days of margin requirements at all times","CCPs must be supervised by at least two national competent authorities"],exps:["❌ 'Cover 2' refers to default scenarios, not geographic market exposure.","✅ Correct — EMIR's 'Cover 2' standard requires CCPs to hold sufficient financial resources to cover simultaneously the default of the two clearing members with the largest exposures — the most demanding prudential standard.","❌ Two-day margin coverage is a different concept; 'Cover 2' concerns the default of two members.","❌ Dual supervisory oversight is not what 'Cover 2' refers to."],correct:1,slide:"Slide 10"},
{q:"Under CSDR, the maximum settlement period for transactions in transferable securities executed on trading venues is:",opts:["T+1 (one business day after trade date)","T+2 (two business days after trade date)","T+3 (three business days after trade date)","T+5 (five business days after trade date)"],exps:["❌ T+1 is shorter than the CSDR requirement (though markets may move toward T+1 over time).","✅ Correct — CSDR harmonises settlement at T+2: transactions in transferable securities executed on trading venues must settle no later than the second business day after the trade date.","❌ T+3 was the pre-CSDR standard; CSDR shortened it to T+2.","❌ T+5 was never the EU standard; CSDR moved toward T+2."],correct:1,slide:"Slide 10"},
{q:"EMIR 3.0 (effective December 24, 2024) introduced the Active Account Obligation (AAO). Who must comply with the AAO?",opts:["All EU financial institutions without exception","FC+ and NFC+ entities exceeding €3 billion notional in interest rate OTC derivatives in specified categories","Only Tier 2 third-country CCPs","All investment firms providing clearing services to EU clients"],exps:["❌ The AAO has specific thresholds; not all EU financial institutions are subject to it.","✅ Correct — the AAO applies to FC+ entities and NFC+ entities exceeding €3 billion notional aggregate for interest rate OTC derivatives in specified categories, requiring them to maintain active accounts at EU CCPs.","❌ Tier 2 third-country CCPs are subject to recognition requirements, not the AAO directly.","❌ The AAO applies to derivatives users, not CCP service providers."],correct:1,slide:"Slide 10"},
{q:"Under SFTR, a Legal Entity Identifier (LEI) is required for:",opts:["Only financial counterparties above clearing thresholds","All legal entities involved in SFT reporting","Only EU-registered CCPs and trade repositories","Entities with annual turnover exceeding €50 million"],exps:["❌ The LEI requirement applies broadly to all legal entities involved in reporting, not just large counterparties.","✅ Correct — under SFTR, an LEI is required for all legal entities involved in SFT reporting, enabling accurate identification across the reporting chain.","❌ CCPs and trade repositories are subject to different LEI obligations; the requirement is broader.","❌ Turnover thresholds do not determine LEI requirements."],correct:1,slide:"Slide 10"},
{q:"What is the key difference between 'title transfer' collateral and 'security collateral' under SFTR?",opts:["Title transfer allows reuse of collateral without restriction; security collateral can never be reused","In title transfer, full ownership passes to the collateral taker; in security collateral, full or qualified ownership remains with the collateral provider when the security right is established","Security collateral is only used in repo transactions; title transfer in securities lending","Title transfer collateral must be held in segregated accounts; security collateral can be commingled"],exps:["❌ SFTR regulates conditions for reuse of both types; title transfer doesn't allow unrestricted reuse.","✅ Correct — under title transfer (e.g., repos), full ownership transfers to the taker; under security collateral, the provider retains ownership (full or qualified) when the security interest is created.","❌ Both types may be used across different SFT structures.","❌ Segregation requirements apply differently; this description is not the key legal distinction."],correct:1,slide:"Slide 10"},
{q:"The EMIR bottom-up approach to the clearing obligation means:",opts:["ESMA initiates the assessment of which derivative classes should be mandatorily cleared","CCPs submit derivative classes they are authorised to clear for ESMA consideration, triggering assessment of whether those classes should be subject to mandatory clearing","NCAs directly determine which instruments are cleared without ESMA involvement","Commission adopts clearing obligations without consulting ESMA or CCPs"],exps:["❌ ESMA initiating the assessment describes the top-down approach.","✅ Correct — the bottom-up approach occurs when CCPs submit the derivative classes they are authorised to clear for ESMA's consideration, potentially triggering assessment of mandatory clearing obligations for those classes.","❌ NCAs do not directly set EU-wide clearing obligations.","❌ The Commission adopts delegated regulations based on ESMA technical standards; the bottom-up approach involves CCP initiative."],correct:1,slide:"Slide 10"},
{q:"Which of the following describes the 'notary function' of a Central Securities Depository (CSD)?",opts:["Verifying the identity of investors before admitting them to trading on a regulated market","Maintaining a central register of securities in book-entry form, guaranteeing issuance integrity and preventing unauthorized creation or deletion","Managing settlement fails and imposing cash penalties on defaulting participants","Providing clearing services between buyers and sellers of securities"],exps:["❌ Investor identity verification is a conduct/AML function, not the CSD notary function.","✅ Correct — the notary function involves maintaining central registers of securities in book-entry form, ensuring issuance integrity and preventing unauthorized creation or deletion of securities.","❌ Managing settlement fails and imposing penalties relates to CSDR settlement discipline measures.","❌ Providing clearing services is the function of a CCP (central counterparty), not the notary function."],correct:1,slide:"Slide 10"},
{q:"Under SFTR, UCITS and AIFMs must disclose their use of SFTs and total return swaps to investors:",opts:["Only upon specific investor request","Only to institutional investors through bilateral agreements","In periodic reports and by identifying such use in pre-contractual documents","Only to national competent authorities through quarterly reporting"],exps:["❌ Disclosure is mandatory, not conditional on investor request.","❌ The disclosure obligation applies to all fund investors (retail and professional), not selectively.","✅ Correct — UCITS and AIFMs must disclose SFT and total return swap use in their periodic reports to investors and must identify such use in pre-contractual documents.","❌ Disclosure to NCAs is separate from investor disclosure obligations."],correct:2,slide:"Slide 10"},
{q:"EMIR's reporting obligation requires all derivatives transactions (OTC and exchange-traded) to be reported to trade repositories within:",opts:["One hour of execution","One business day","Five business days","At the end of the calendar month"],exps:["❌ One hour is not the EMIR reporting deadline.","✅ Correct — EMIR requires comprehensive reporting of all derivatives transactions to registered trade repositories within one business day.","❌ Five business days is too long; EMIR aims for near real-time supervisory data.","❌ Monthly reporting would not provide timely systemic risk oversight."],correct:1,slide:"Slide 10"},
{q:"CSD participants are required to hold client securities in what type of accounts under CSDR?",opts:["Pooled proprietary accounts alongside the CSD's own assets","Segregated accounts separating client securities from proprietary assets, with client securities held in omnibus accounts","A single omnibus account commingling all CSD assets for operational efficiency","Accounts managed exclusively by the ECB as part of Target2-Securities"],exps:["❌ Pooling client and proprietary assets would violate CSDR segregation requirements.","✅ Correct — CSDR requires CSDs to segregate participants' securities from those of other participants and their own assets; participants must segregate client securities from their own in omnibus accounts.","❌ Commingling all CSD assets violates the segregation requirement.","❌ T2S is the settlement platform; CSD account structures are governed by CSDR."],correct:1,slide:"Slide 10"},
{q:"Under EMIR, CCPs must maintain governance arrangements ensuring the risk management function is independent from other operational areas. Which specific governance requirement relates to board composition?",opts:["The entire board must be composed of independent non-executive directors","At least one-third of management body members must be independent, and a risk committee must include clearing members, independent board members, and client representatives","A majority of board members must be appointed by ESMA","The CEO must also chair the risk committee to ensure accountability"],exps:["❌ Full board independence would prevent operational management of the CCP.","✅ Correct — EMIR requires at least one-third of CCP management body members to be independent, and mandates a risk committee composed of clearing members, independent board members, and client representatives — ensuring diverse risk oversight.","❌ ESMA does not appoint CCP board members; it supervises CCPs but governance is internal.","❌ Combining the CEO and risk committee chair roles would create a conflict of interest; EMIR requires functional separation."],correct:1,slide:"Slide 10"}]
,
"11 — Prospectus Regulation":[
{q:"The Prospectus Regulation (EU 2017/1129) applies when:",opts:["Any financial instrument is created by a company","Transferable securities are offered to the public OR admitted to trading on EU regulated markets","Any financial product is sold to retail investors regardless of listing","Securities are issued exclusively to professional investors"],exps:["❌ Mere creation of an instrument does not trigger the Prospectus Regulation.","✅ Correct — the Regulation applies to transferable securities offered to the public OR admitted to trading on EU regulated markets.","❌ Not all retail sales trigger prospectus obligations; exemptions exist.","❌ Offers exclusively to professional investors are among the exemptions."],correct:1,slide:"Slide 11"},
{q:"The 'dual trigger' in the Prospectus Regulation means:",opts:["Both the issuer and the offeror must sign the prospectus","The prospectus obligation is triggered by EITHER an offer to the public OR admission to trading on a regulated market — whichever occurs first","The prospectus must be approved by both the home NCA and ESMA","The prospectus must be published in both English and the local language"],exps:["❌ The dual trigger concerns triggering events, not signatories.","✅ Correct — the obligation attaches to whichever trigger occurs first: offer to the public OR admission to trading on a regulated market.","❌ Only the home NCA approves; ESMA maintains a searchable storage mechanism but does not approve.","❌ Language requirements are separate from the dual trigger concept."],correct:1,slide:"Slide 11"},
{q:"The Listing Act (effective June 2026) introduced a general EU-wide exemption for offers with total consideration under:",opts:["€1 million per offeror over 12 months","€5 million per offeror over 12 months","EUR 12 million per offeror/issuer over 12 months — Member States may lower to €5 million for single-Member State offers","€50 million for all issuers regardless of size"],exps:["❌ €1 million was the previous minimum in the original Regulation.","❌ €5 million is the national option for single-Member State offers; the general EU threshold is €12 million.","✅ Correct — the Listing Act introduced a general exemption for offers under EUR 12 million per offeror/issuer over 12 months; Member States may lower to €5 million for offers limited to one Member State.","❌ €50 million is the EU Growth Prospectus threshold, not the general exemption."],correct:2,slide:"Slide 11"},
{q:"The passport mechanism under the Prospectus Regulation enables:",opts:["Third-country issuers to access EU markets without any prospectus","Once the home NCA approves the prospectus, it is automatically recognised throughout the EU — host authorities cannot conduct additional substantive review","Issuers to market securities in one additional Member State without re-approval","The Commission to approve all prospectuses centrally"],exps:["❌ Third-country issuers must comply with equivalence requirements.","✅ Correct — once the home NCA approves, the prospectus is recognised throughout the EU; host authorities may only enforce language rules and local advertising standards.","❌ The passport enables EU-wide access, not just one additional Member State.","❌ The Commission does not approve individual prospectuses."],correct:1,slide:"Slide 11"},
{q:"The EU Growth Prospectus is available to which issuers and what is its maximum page length?",opts:["Any EU issuer regardless of size; maximum 300 pages","SMEs, non-SME issuers on SME Growth Markets, and issuers with aggregate consideration below EUR 50 million employing fewer than 499 persons; maximum 75 pages","Only credit institutions and investment firms; maximum 100 pages","Only issuers with at least 18 months trading history; maximum 50 pages"],exps:["❌ Any EU issuer regardless of size applies to the full prospectus, not the EU Growth Prospectus.","✅ Correct — available for SMEs, non-SME issuers on SME Growth Markets, and issuers with aggregate consideration below EUR 50 million and fewer than 499 employees; maximum 75 pages.","❌ The EU Growth Prospectus is not limited to credit institutions and investment firms.","❌ The 18-month trading history requirement applies to the EU Follow-on Prospectus."],correct:1,slide:"Slide 11"},
{q:"The EU Follow-on Prospectus requires at least how many months of trading history, with what maximum page length?",opts:["6 months; maximum 100 pages","12 months; maximum 75 pages","18 months; maximum 50 pages — with only one year of financial information required and a 7-day approval period","24 months; maximum 30 pages"],exps:["❌ 6 months is below the threshold; 100 pages is the EU Growth Prospectus maximum.","❌ 12 months is below the threshold.","✅ Correct — the EU Follow-on Prospectus requires at least 18 months of continuous trading on a regulated market or SME Growth Market; maximum 50 pages, one year of financial information, 7-day approval period.","❌ 24 months is above the required threshold."],correct:2,slide:"Slide 11"},
{q:"The maximum length of a full equity prospectus on regulated markets (as set by the Listing Act) is:",opts:["100 pages","200 pages","300 pages","500 pages"],exps:["❌ 100 pages is not the full equity prospectus limit.","❌ 200 pages is not the limit set by the Listing Act.","✅ Correct — the Listing Act set a maximum of 300 pages for a full equity prospectus on regulated markets.","❌ 500 pages exceeds the Listing Act limit."],correct:2,slide:"Slide 11"},
{q:"The Universal Registration Document (URD) allows frequent issuers to:",opts:["File a prospectus without any NCA review from the first year of use","Describe their organisation and business annually; after the first two years the URD may be filed without prior approval; when launching offers, issuers add only a securities note and summary to compose a complete prospectus rapidly","Replace both the securities note and summary with a single document","Access the EU passport without home NCA approval"],exps:["❌ During the first two financial years, the URD must be approved by the home NCA.","✅ Correct — the URD enables rapid market access: approved for the first two years, then filed without prior approval; issuers add only a securities note and summary to compose a complete prospectus.","❌ The URD is one component; a securities note and summary are still required.","❌ Passporting requires NCA approval; the URD streamlines but does not bypass it."],correct:1,slide:"Slide 11"},
{q:"The prospectus summary's maximum length is:",opts:["3 A4 pages","5 A4 pages","7 A4 pages","10 A4 pages"],exps:["❌ 3 A4 pages is the maximum length of the KID (PRIIPs), not the prospectus summary.","❌ 5 A4 pages is not the limit.","✅ Correct — the prospectus summary is limited to a maximum of 7 A4 pages when printed.","❌ 10 A4 pages exceeds the limit."],correct:2,slide:"Slide 11"},
{q:"In Kolassa v Barclays (2015), the CJEU established that:",opts:["Issuers are not liable for prospectus errors if they have obtained NCA approval","Jurisdiction under Brussels I Regulation can lie with investor's home courts if objective connecting factors exist, even when the issuer is established abroad — expanding cross-border investor access to remedies","Only institutional investors can bring prospectus liability claims","Prospectus liability is fully harmonised at EU level with uniform remedies"],exps:["❌ NCA approval examines completeness and consistency, not material accuracy; it does not shield issuers from liability.","✅ Correct — in Kolassa, the CJEU established that jurisdiction can lie with the investor's home courts if objective connecting factors exist.","❌ Kolassa did not limit claims to institutional investors.","❌ Bankia v UMAS (2021) confirmed civil liability is NOT fully harmonised."],correct:1,slide:"Slide 11"},
{q:"Competent authority approval of a prospectus examines only:",opts:["Material accuracy of all statements","Completeness, consistency, and comprehensibility — material accuracy remains the issuer's responsibility (clarified by the Listing Act)","Whether the issuer meets minimum size and track record requirements","Whether the offer price is fair compared to intrinsic value"],exps:["❌ Material accuracy is the issuer's responsibility.","✅ Correct — the Listing Act clarified that competent authority approval examines only completeness, consistency, and comprehensibility — material accuracy remains with the issuer.","❌ Minimum size requirements are not how NCA approval is framed.","❌ NCAs do not assess whether the offer price is fair."],correct:1,slide:"Slide 11"},
{q:"A supplement to the prospectus is required when:",opts:["Only at the end of the offering period to confirm final terms","A significant new factor arises, a material mistake is discovered, or an inaccuracy is identified during the offer period or before admission — investors who have already committed receive at least two working days to withdraw","Only when the issuer voluntarily decides to update the prospectus","Never; updated information is always incorporated by reference"],exps:["❌ A supplement must be published during the offer period when specific triggers arise.","✅ Correct — supplements are required for significant new factors, material mistakes, or inaccuracies; investors who have already committed receive at least two working days to withdraw.","❌ Supplements are mandatory in specific circumstances, not purely voluntary.","❌ A supplement is distinct from incorporation by reference."],correct:1,slide:"Slide 11"},
{q:"Which instruments are excluded from the prospectus obligation?",opts:["Transferable securities admitted to trading on regulated markets","Money market instruments under 12 months, collective investment units (open-end), securities issued by Member States, and central bank shares","Bonds issued by credit institutions in the EU","Shares admitted to trading on SME Growth Markets"],exps:["❌ Transferable securities admitted to regulated markets are within scope.","✅ Correct — excluded instruments include money market instruments under 12 months, collective investment units (open-end), securities issued by Member States, and central bank shares.","❌ Bonds issued by credit institutions are generally within scope.","❌ Shares admitted to SME Growth Markets may be within scope."],correct:1,slide:"Slide 11"},
{q:"The 'fungibility threshold' raised by the Listing Act to 30% means:",opts:["Securities of a different class from those already admitted are exempt from prospectus requirements","No prospectus is required for securities fungible with those already admitted and representing less than 30% of existing securities over 12 months","Any secondary offering of previously listed securities is automatically exempt","Securities offered exclusively to existing shareholders are always exempt"],exps:["❌ The fungibility threshold applies to securities of the same class.","✅ Correct — the Listing Act raised the fungibility threshold to 30%; no prospectus is required for securities fungible with those already admitted representing less than 30% of existing securities over 12 months.","❌ Not all secondary offerings are exempt; the percentage threshold applies.","❌ Offers to existing shareholders benefit from a different exemption (fewer than 150 natural or legal persons)."],correct:1,slide:"Slide 11"},
