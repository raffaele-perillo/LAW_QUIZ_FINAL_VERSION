{q:"What is the '28th corporate-law regime' concept discussed under the SIU Pillar 3?",opts:["A new EU insolvency framework replacing national insolvency laws with a uniform proceeding for cross-border restructurings","A harmonised set of corporate tax rules for cross-border businesses, eliminating transfer pricing disputes between Member States","A requirement for all publicly listed companies across the EU to mandatorily re-incorporate under a single EU legal structure","An optional EU-level corporate law framework companies could adopt alongside the 27 existing national regimes voluntarily"],exps:["❌ The 28th regime concept concerns corporate law, not insolvency, and complements rather than replaces national law.","❌ The concept concerns corporate law, not tax harmonisation.","❌ Re-incorporation would not be mandatory under the 28th regime concept.","✅ Correct — the '28th regime' concept proposes an optional EU-level corporate law framework companies could adopt alongside the 27 existing national regimes, reducing fragmentation and gold-plating."],correct:3,slide:"Slide 05"},
{q:"Under what circumstances may host competent authorities deviate from their non-intervention stance under the passporting regime?",opts:["In response to immediate threats to financial stability or investor protection, or to enforce general law applicable to all","Whenever the host authority disagrees with the home authority's supervisory approach to specific firm conduct matters","Whenever the host authority identifies any breach of host State law by a passporting firm operating in its territory","At any time by notifying the home authority within 30 days — the home authority may then request a supervisory college"],exps:["✅ Correct — host authorities may intervene only in response to immediate threats to financial stability or investor protection, or to enforce non-harmonised local requirements, and must exercise powers cooperatively with the home supervisor.","❌ Disagreement with supervisory approach alone is insufficient; the home authority retains primary competence.","❌ Host authorities cannot broadly intervene for any breach of host State law — the passport precisely limits such intervention.","❌ There is no unilateral 30-day notification right for host authorities to override passport protection."],correct:0,slide:"Slide 05"}]
,
"06 — MiFID II":[
{q:"MiFID II became applicable in which year?",opts:["2014","2016","2018","2020"],exps:["❌ 2014 is when MiFID II was adopted, not when it became applicable.","❌ 2016 is not when MiFID II became applicable.","✅ Correct — MiFID II became applicable in January 2018.","❌ 2020 is not when MiFID II became applicable."],correct:2,slide:"Slide 06"},
{q:"Financial instruments under Section C of Annex I MiFID II are divided into:",opts:["Liquid and illiquid instruments","Regulated market instruments and OTC instruments","Shares and bonds only","Non-derivative instruments and derivative instruments"],exps:["❌ Liquid/illiquid is not the Section C classification.","❌ Section C classification is not based on trading venue.","❌ Section C covers much more than shares and bonds.","✅ Correct — Section C divides instruments into non-derivative (transferable securities, money market instruments, CIU units, emission allowances) and derivative instruments."],correct:3,slide:"Slide 06"},
{q:"The unifying criterion for MiFID II financial instruments is:",opts:["Admission to trading on a regulated market — applicable to all investment firms providing services to retail clients","Negotiability on the capital market — suitability for trading and transfer, though not necessarily on regulated markets","Denomination in euros or another EU currency — a conduct obligation enforceable by national competent authorities","Issuance by entities established in the EU — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Admission to a regulated market is not required.","✅ Correct — the unifying criterion is negotiability: suitability for trading and transfer, though not necessarily on regulated markets.","❌ Currency of denomination is not the unifying criterion.","❌ EU establishment is not required."],correct:1,slide:"Slide 06"},
{q:"In Case C-627/23 (January 2025), the CJEU ruled that an instrument is negotiable unless:",opts:["It is not admitted to a regulated market or MTF","Its transfer is 'impossible' or 'extremely difficult'","It lacks fungibility with other instruments of the same class","It is not denominated in a freely convertible currency"],exps:["❌ Admission to regulated markets or MTFs is not the test for negotiability.","✅ Correct — the CJEU ruled in C-627/23 that an instrument is negotiable unless its transfer is 'impossible' or 'extremely difficult'.","❌ Fungibility may be relevant but is not the test articulated in this case.","❌ Currency denomination is not the negotiability test."],correct:1,slide:"Slide 06"},
{q:"'Portfolio management' under Section A MiFID II is defined as:",opts:["Reception and transmission of orders to facilitate transactions between investors","Trading against proprietary capital","Personal recommendations based on client characteristics and needs","Discretionary management of individualised client portfolios"],exps:["❌ Reception and transmission of orders is a separate service.","❌ Trading against proprietary capital describes Dealing on Own Account.","❌ Personal recommendations describe Investment Advice.","✅ Correct — Portfolio management involves discretionary management of individualised client portfolios."],correct:3,slide:"Slide 06"},
{q:"'Systematic Internalisation' is a particular form of which investment service?",opts:["Portfolio management — applicable to all investment firms providing services to retail clients — a position that differs from the correct EU legal framework applicable in this context","Investment advice — a conduct obligation enforceable by national competent authorities — an incorrect characterisation that confuses this instrument with a different regulatory tool","Dealing on own account — where firms execute client orders outside regulated venues on an organised, frequent, systematic, and substantial basis","Underwriting and placement — reflecting the investor protection objective of MiFID II's framework — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ Portfolio management is a different service.","❌ Investment advice is a different service.","✅ Correct — systematic internalisation is a particular form of dealing on own account, where firms execute client orders outside regulated venues on an organised, frequent, systematic, and substantial basis.","❌ Underwriting and placement is a different service."],correct:2,slide:"Slide 06"},
{q:"MiFID II authorisation (the European passport) enables authorised investment firms to:",opts:["Operate only within the Member State that granted the authorisation — applicable to all investment firms providing services to retail clients","Operate throughout the Union based on home Member State authorisation — for both cross-border services and branch establishment without separate local authorisation","Operate in all Member States plus EEA countries and major third countries under equivalence — a conduct obligation enforceable by national competent authorities","Operate only in Member States that have signed a bilateral cooperation agreement with the home supervisor — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ The passport enables EU-wide operation, not only domestic.","✅ Correct — the MiFID European passport enables authorised firms to operate throughout the Union based on home Member State authorisation, covering cross-border services and branch establishment.","❌ Third-country access is not covered by the MiFID passport.","❌ No bilateral cooperation agreement between Member States is required."],correct:1,slide:"Slide 06"},
{q:"Under MiFID II client classification, 'Eligible Counterparties' are subject to which regime?",opts:["Full MiFID II conduct obligations including comprehensive information duties and suitability tests","An intermediate protection regime between retail and professional clients","A lighter regime applicable only for specific services: order reception/transmission, execution, and dealing on own account","No MiFID II obligations at all"],exps:["❌ Full obligations describe the Retail Client regime.","❌ Eligible Counterparties are the least protected category.","✅ Correct — Eligible Counterparties are subject to a lighter regime for specific services (order reception/transmission, execution, dealing on own account).","❌ Eligible Counterparties are still subject to some MiFID II obligations, though lighter."],correct:2,slide:"Slide 06"},
{q:"'Professional by Law' clients include which entities?",opts:["Regulated financial entities (investment firms, credit institutions, insurers, UCITS) and large undertakings meeting two of three criteria: €20M balance sheet, €40M net turnover, €2M own funds","Only natural persons with significant investment experience — applicable to all investment firms providing services to retail clients — a position that differs from the correct EU legal framework applicable in this context","All companies registered in the EU regardless of size — reflecting the investor protection objective of MiFID II's framework — a description that applies to a different EU legal act, not the one relevant to this question","Only government bodies and central banks — applicable to all investment firms providing services to retail clients — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — Professional by Law includes regulated financial entities and large undertakings meeting two of three criteria: €20M balance sheet, €40M net turnover, €2M own funds.","❌ Natural persons with investment experience may apply for professional treatment but are not 'Professional by Law'.","❌ All EU companies regardless of size are not automatically Professional by Law.","❌ Government bodies are included but not the only entities."],correct:0,slide:"Slide 06"},
{q:"To be reclassified as 'Professional upon Request', a retail client must meet which two of three criteria?",opts:["Significant transaction volume (min. 10 per quarter over four quarters), portfolio exceeding €500,000, and one year financial sector experience in relevant position — any two of these three","Hold a professional financial qualification AND have minimum €1 million in assets — applicable to all investment firms providing services to retail clients","Be affiliated with a regulated financial entity AND have minimum €500,000 in assets — a conduct obligation enforceable by national competent authorities","Be a large undertaking AND have at least five years of investment experience — reflecting the investor protection objective of MiFID II's framework"],exps:["✅ Correct — retail clients may request professional treatment by meeting two of: minimum 10 significant transactions per quarter over four quarters; portfolio exceeding €500,000; one year relevant financial sector experience.","❌ Professional qualifications alone are not the criteria for 'Professional upon Request'.","❌ Affiliation with a regulated entity makes one 'Professional by Law', not 'Professional upon Request'.","❌ Large undertaking criteria apply to 'Professional by Law', not 'Professional upon Request'."],correct:0,slide:"Slide 06"},
{q:"The suitability assessment under MiFID II applies to which investment services?",opts:["All investment services without exception — applicable to all investment firms providing services to retail clients","Only execution-only services for non-complex instruments — as set out in the relevant ESMA guidelines and technical standards","Investment advice and portfolio management — a blocking test preventing recommendations when suitability cannot be established","Only services to retail clients, not professional clients — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Suitability applies specifically to advice and portfolio management.","❌ Execution-only services are exempt from both suitability AND appropriateness assessments.","✅ Correct — the suitability assessment applies to investment advice and portfolio management and is a blocking test.","❌ Suitability applies based on service type; professional clients benefit from some presumptions but the obligation exists."],correct:2,slide:"Slide 06"},
{q:"The three dimensions of the MiFID II suitability assessment are:",opts:["Nationality, tax residency, and legal capacity — applicable to all investment firms providing services to retail clients","Credit score, employment status, and net worth — a conduct obligation enforceable by national competent authorities","Knowledge and experience, financial situation, and investment objectives (including risk tolerance and ESG preferences)","Past investment performance, risk tolerance, and portfolio diversification — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Nationality and tax residency are not the three suitability dimensions.","❌ Credit score and employment status are not the three suitability dimensions.","✅ Correct — the three dimensions are: knowledge and experience; financial situation (income, assets, commitments, ability to bear losses); and investment objectives (purpose, duration, risk tolerance, ESG preferences).","❌ Past investment performance is not one of the three suitability dimensions."],correct:2,slide:"Slide 06"},
{q:"The appropriateness assessment under MiFID II is a 'warning test', meaning:",opts:["It prevents recommendations when appropriateness cannot be established — applicable to all investment firms providing services to retail clients","It only applies to professional clients and eligible counterparties — reflecting the investor protection objective of MiFID II's framework","It applies the same comprehensive assessment as suitability — a conduct obligation enforceable by national competent authorities","It assesses only client knowledge and experience; firms must alert clients when products are inappropriate, but clients may proceed despite the warning"],exps:["❌ Preventing recommendations when the test cannot be satisfied describes the suitability blocking test, not appropriateness.","❌ Appropriateness applies to services other than advice and portfolio management, for all client types.","❌ Comprehensive assessment of knowledge, experience, financial situation, AND objectives describes suitability.","✅ Correct — appropriateness assesses only knowledge and experience; it is a warning test allowing clients to proceed despite warnings (unlike suitability, which is blocking)."],correct:3,slide:"Slide 06"},
{q:"Best execution under Article 27(1) MiFID II requires firms to:",opts:["Take all reasonable steps to obtain the best possible result considering multiple execution factors including price, costs, speed, and likelihood of execution","Always execute orders at the lowest possible price — a requirement introduced by the Lamfalussy Level 2 implementing measures","Execute all client orders on regulated markets only — reflecting the maximum harmonisation approach adopted in this EU framework","Report all client orders to ESMA within 15 minutes — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — best execution requires all reasonable steps to obtain the best possible result considering price, execution costs, speed, likelihood of execution, order size, and market impact.","❌ Best execution considers multiple factors; price alone is insufficient.","❌ Best execution can be achieved on various venues, not only regulated markets.","❌ Reporting to ESMA is a different obligation."],correct:0,slide:"Slide 06"},
{q:"For retail clients, best execution is primarily assessed on:",opts:["Speed of execution only — applicable to all investment firms providing services to retail clients","Order size and market impact — as set out in the relevant ESMA guidelines and technical standards","'Total consideration' — price plus all direct execution costs","Likelihood of execution and settlement — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Speed is one of multiple factors but not the primary criterion for retail clients.","❌ Order size and market impact are factors but not the primary criterion.","✅ Correct — for retail clients, best execution is assessed primarily on 'total consideration': the price of the instrument plus all direct execution costs.","❌ Likelihood of execution is a factor but not the primary criterion for retail clients."],correct:2,slide:"Slide 06"},
{q:"Under MiFID II, inducements (third-party payments) are permitted only if:",opts:["They are paid exclusively by professional clients and eligible counterparties — applicable to all investment firms providing services to retail clients","They enhance service quality and do not impair the firm's duty to act honestly, fairly, and professionally in the client's best interests — with advance disclosure","They are below a specific monetary threshold set by ESMA — a conduct obligation enforceable by national competent authorities","They are disclosed to the client after the service has been provided — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ The payer of the inducement is not the determining factor.","✅ Correct — inducements are permitted only if they enhance service quality and do not impair the duty to act in the client's best interests, with advance disclosure in durable medium.","❌ There is no specific monetary threshold set by ESMA.","❌ Disclosure must be in advance, not after service provision."],correct:1,slide:"Slide 06"},
{q:"Product governance under MiFID II addresses:",opts:["Only distribution of financial products to retail clients — applicable to all investment firms providing services to retail clients — a position that differs from the correct EU legal framework applicable in this context","The upstream design, approval, and distribution of financial instruments — manufacturers must identify target markets, assess risks, and avoid unsuitable products reaching certain client categories","Exclusively the pricing and cost structure of financial instruments — a conduct obligation enforceable by national competent authorities — a description that applies to a different EU legal act, not the one relevant to this question","Only conflicts of interest in trading venue operations — applicable to all investment firms providing services to retail clients — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ Product governance applies at the manufacturing stage, not only distribution.","✅ Correct — product governance addresses upstream product design: manufacturers identify target markets, assess risks, and avoid features harming investors; distributors align strategies with manufacturer's target markets.","❌ Pricing and cost structure are addressed by cost transparency rules.","❌ Product governance applies to investment firms, not specifically trading venues."],correct:1,slide:"Slide 06"},
{q:"Execution-only services are permitted without suitability or appropriateness assessment when which cumulative conditions are met?",opts:["Client is a professional investor — as established under the relevant EU secondary legislation framework","Service at client initiative, for non-complex instruments, without credit/loans, and with clear client notification that no assessment will be conducted","Instrument has been traded on a regulated market for at least 5 years — reflecting the harmonisation objective of the EU single financial market","Investment firm has conducted a simplified suitability assessment — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Professional investor status is not one of the specific execution-only conditions.","✅ Correct — conditions include: service at client initiative, non-complex instruments, service limited to execution or order reception/transmission (excluding credit/loans), and client clearly informed of no assessment.","❌ 5-year trading history is not a condition for execution-only services.","❌ No assessment (even simplified) is conducted for execution-only services."],correct:1,slide:"Slide 06"},
{q:"Conflicts of interest disclosure under MiFID II Article 23 is described as:",opts:["The primary tool for managing conflicts of interest — sufficient on its own — a requirement introduced by the Lamfalussy Level 2 implementing measures","A last-resort mechanism when prevention arrangements are insufficient to ensure client interest protection; cannot substitute robust internal safeguards","A mandatory step before any client communication — reflecting the maximum harmonisation approach adopted in this EU framework","Only required for retail clients, not professional clients or eligible counterparties — a principle established in the foundational Regulation governing this area"],exps:["❌ Disclosure is explicitly described as a last resort, not the primary tool.","✅ Correct — disclosure is a last-resort mechanism when organisational arrangements are insufficient; it cannot substitute robust internal safeguards.","❌ Disclosure is not required before every client communication.","❌ Conflicts of interest obligations apply across client categories."],correct:1,slide:"Slide 06"},
{q:"Investment research is NOT an inducement under MiFID II if:",opts:["It is provided free of charge by the investment firm — applicable to all investment firms providing services to retail clients","It is paid directly from firm resources or from a dedicated research payment account (RPA) funded by a client charge, subject to governance and control mechanisms","It is provided only to professional clients and eligible counterparties — a conduct obligation enforceable by national competent authorities","It relates exclusively to non-complex financial instruments — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Free provision alone does not determine whether research is an inducement.","✅ Correct — investment research is not an inducement if paid directly from firm resources or from an RPA funded by client charge, subject to governance and control mechanisms ensuring client best interests.","❌ The client category does not determine whether research constitutes an inducement.","❌ Instrument complexity is not the determining factor."],correct:1,slide:"Slide 06"}
,
{q:"Investment advice under MiFID II Section A must be:",opts:["General recommendations on categories of assets published to the public — applicable to all investment firms providing services to retail clients","Any communication about financial instruments addressed to clients — a conduct obligation enforceable by national competent authorities","Personal recommendations presented as suitable for specific individuals based on their characteristics, relating to identifiable instruments (not general categories)","Research reports distributed to clients by investment firms — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ General public recommendations describe investment research, not MiFID II investment advice.","❌ All communications about financial instruments are not investment advice.","✅ Correct — investment advice consists of personal recommendations presented as suitable for specific individuals based on their characteristics, relating to identifiable instruments, not general categories or asset classes.","❌ Research reports distributed to clients describe investment research, an ancillary service under Section B."],correct:2,slide:"Slide 06"},
{q:"Ancillary services listed in Section B of Annex I MiFID II can generally be provided by:",opts:["Only authorised investment firms subject to full MiFID II obligations — applicable to all investment firms providing services to retail clients","Only entities with specific ESMA registration for each ancillary service — reflecting the investor protection objective of MiFID II's framework","Only credit institutions with full banking authorisation — a conduct obligation enforceable by national competent authorities","Non-authorised entities freely, unless otherwise restricted — because they are complementary to investment services"],exps:["❌ Section B services can be provided by non-authorised entities unless restricted.","❌ No specific ESMA registration for ancillary services is required.","❌ Credit institutions may provide ancillary services but so can non-credit institutions.","✅ Correct — ancillary services can be freely provided by non-authorised entities unless otherwise restricted, as they are complementary activities."],correct:3,slide:"Slide 06"},
{q:"Under MiFID II, a 'large undertaking' qualifies as Professional by Law if it meets at least two of three criteria. Which are they?",opts:["€10M balance sheet, €20M net turnover, €1M own funds","€5M balance sheet, €10M net turnover, €500K own funds","€50M balance sheet, €100M net turnover, €5M own funds","€20M balance sheet, €40M net turnover, €2M own funds"],exps:["❌ These figures are below the MiFID II thresholds.","❌ These figures are below the MiFID II thresholds.","❌ These figures exceed the MiFID II thresholds.","✅ Correct — a large undertaking qualifies as Professional by Law if it meets at least two of: €20M balance sheet, €40M net turnover, €2M own funds."],correct:3,slide:"Slide 06"},
{q:"The suitability report under MiFID II must be provided to which clients and when?",opts:["To all clients before any investment service is provided — as set out in the relevant ESMA guidelines and technical standards — a position that differs from the correct EU legal framework applicable in this context","To retail clients receiving investment advice — on a durable medium explaining how the recommendation matches their objectives, financial situation, investment horizon, risk profile, and loss-bearing ability","Only to professional clients receiving portfolio management services — a conduct obligation enforceable by national competent authorities — a description that applies to a different EU legal act, not the one relevant to this question","To eligible counterparties before any transaction is executed — applicable to all investment firms providing services to retail clients — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ The suitability report is specifically required for retail clients receiving investment advice.", "✅ Correct — retail clients receiving investment advice must receive a suitability report on a durable medium explaining how the recommendation matches their objectives, financial situation, investment horizon, risk profile, and loss-bearing ability.", "❌ Professional clients receiving portfolio management do not require the same suitability report.", "❌ Eligible counterparties are not the target of suitability reports."],correct:1,slide:"Slide 06"},
{q:"MiFID II cost transparency requires firms to provide cost information:",opts:["Only at year-end in an annual summary statement — applicable to all investment firms providing services to retail clients","Only for structured products and derivatives, not simple instruments — reflecting the investor protection objective of MiFID II's framework","Only when the client specifically requests cost information — a conduct obligation enforceable by national competent authorities","Ex ante (before service) and updated annually ex post — aggregated, shown as cash amounts and percentages, with cumulative effect illustrations on investment returns"],exps:["❌ Cost information must be provided ex ante, not only at year end.","❌ Cost transparency applies to all instruments and services.","❌ Cost disclosure is proactive and mandatory, not only upon client request.","✅ Correct — MiFID II requires ex ante and annual ex post cost disclosure, aggregated, shown as cash amounts and percentages, with cumulative effect illustrations."],correct:3,slide:"Slide 06"},
{q:"When executing orders outside regulated markets, MTFs, or OTFs, what is required?",opts:["No additional requirement — firms may execute anywhere without client notification — as established under the relevant EU secondary legislation framework","Prior written NCA approval is required for each such execution — as confirmed by the relevant CJEU case law and regulatory guidance","Only a general disclosure in the terms and conditions is sufficient — reflecting the harmonisation objective of the EU single financial market","Express prior consent from the client is required — the execution policy must indicate venues used per instrument class and explain venue selection criteria"],exps:["❌ An express prior consent requirement applies when policies permit execution outside regulated venues.","❌ NCA prior approval for each execution is not required.","❌ General terms and conditions disclosure is insufficient; express prior consent is required.","✅ Correct — where execution policies permit execution outside regulated markets, MTFs, or OTFs, express prior consent from the client is required before proceeding."],correct:3,slide:"Slide 06"},
{q:"Periodic suitability assessments for retail clients receiving ongoing investment advice must be conducted:",opts:["Only when the client requests a review — applicable to all investment firms providing services to retail clients","Every five years, aligned with the MiFID II review cycle — reflecting the investor protection objective of MiFID II's framework","Only upon a significant market event affecting the portfolio — a conduct obligation enforceable by national competent authorities","At least annually, with increased frequency warranted by client risk profile or investment complexity"],exps:["❌ Periodic assessments must be conducted proactively, not only upon client request.","❌ Five-year reviews are not the standard; annual minimum is required.","❌ Significant market events may trigger additional assessments, but the minimum is annual.","✅ Correct — periodic suitability assessments must be conducted at least annually for retail clients receiving ongoing investment advice or portfolio management."],correct:3,slide:"Slide 06"},
{q:"MiFID II's general information obligation (Article 24(3)) applies to:",opts:["All information provided to clients or potential clients — including marketing communications — ensuring it is fair, clear, and not misleading across all client categories","Only marketing materials about new financial products — a requirement introduced by the Lamfalussy Level 2 implementing measures","Only information provided to retail clients — reflecting the maximum harmonisation approach adopted in this EU framework","Only pre-contractual documents for complex financial instruments — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — Article 24(3) establishes a general obligation ensuring all information provided to clients or potential clients — including marketing communications — is fair, clear, and not misleading. This applies across all client categories.","❌ The obligation applies to all information, not only marketing materials about new products.","❌ The obligation applies to all client categories, not only retail clients.","❌ The obligation applies to all information, not only pre-contractual documents."],correct:0,slide:"Slide 06"},
{q:"Under MiFID II cross-selling rules for product or service packages, firms must:",opts:["Offer all products exclusively as packages — as set out in the relevant ESMA guidelines and technical standards — a position that differs from the correct EU legal framework applicable in this context","Only disclose the total package price without breaking down individual components — a conduct obligation enforceable by national competent authorities — a description that applies to a different EU legal act, not the one relevant to this question","Inform whether components can be purchased separately, disclose separate costs per component, explain how component interaction alters risk profile, and provide full pricing for both package and individual components","Obtain NCA approval before offering any bundled products — applicable to all investment firms providing services to retail clients — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ Firms must offer unbundled alternatives, not exclusively packages.","❌ Breaking down individual component costs is specifically required.","✅ Correct — cross-selling rules require: informing whether components can be purchased separately; disclosing separate costs per component; explaining how component interaction alters risk profile; providing full pricing for package and individual components.","❌ NCA approval is not required for bundled products."],correct:2,slide:"Slide 06"},
{q:"Under MiFID II, staff providing investment advice require a minimum of how many months of relevant experience?",opts:["Three months — as set out in the relevant ESMA guidelines and technical standards","Six months full-time relevant experience — with unqualified staff able to provide services under qualified supervision for a maximum of four years","Twelve months of directly supervised experience — a conduct obligation enforceable by national competent authorities","Twenty-four months of graduate training — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Three months is below the MiFID II requirement.", "✅ Correct — MiFID II requires appropriate qualifications and a minimum of six months full-time relevant experience; unqualified staff may provide services under qualified supervision for a maximum of four years.", "❌ Twelve months is above the minimum required.", "❌ Twenty-four months of graduate training is not the MiFID II standard."],correct:1,slide:"Slide 06"}
,
{q:"Which of the following is NOT an investment service under Section A of Annex I of MiFID II?",opts:["Portfolio management", "Underwriting of financial instruments", "Collective asset management", "Reception and transmission of orders"],exps:["❌ Portfolio management IS an investment service listed in Section A of Annex I MiFID II.", "❌ Underwriting of financial instruments IS an investment service listed in Section A of Annex I MiFID II.", "✅ Correct — collective asset management (i.e., managing UCITS or AIFs) is NOT listed as an investment service in Section A of Annex I MiFID II. It is governed by the UCITS Directive and AIFMD, not MiFID II.", "❌ Reception and transmission of orders IS an investment service listed in Section A of Annex I MiFID II."],correct:2,slide:"Slide 06"}
,
{q:"Why does MiFID II classify clients into different categories (retail, professional, eligible counterparty)?",opts:["Because the Directive mandates that investment services can be provided only to retail clients — applicable to all investment firms providing services to retail clients","Because professional clients and eligible counterparties are entirely out of scope of MiFID II — as set out in the relevant ESMA guidelines and technical standards","Because the Directive mandates that investment firms apply a differentiated set of conduct-of-business and transparency obligations depending on the category of client","Because only retail clients can bring civil liability claims for MiFID II breaches — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ MiFID II applies to all client categories; it does not restrict services only to retail clients.", "❌ Professional clients and eligible counterparties are within MiFID II's scope, but subject to lighter conduct-of-business obligations.", "✅ Correct — MiFID II classifies clients because the Directive mandates that investment firms apply a differentiated set of conduct-of-business and transparency obligations depending on the category of client, calibrating protection to financial sophistication.", "❌ Civil liability for MiFID II breaches is available to all client categories, not only retail clients."],correct:2,slide:"Slide 06"}
,
{q:"Under MiFID II, a retail client may request to be treated as a professional investor if certain quantitative and qualitative conditions are met. Which of the following criteria is NOT among those assessed for such reclassification?",opts:["The investor's global wealth","The number of transactions carried out within a given time period","The investor's work experience in the financial sector","The value of the investor's financial instrument portfolio"],exps:["✅ Correct — the investor's global wealth is NOT one of the three criteria assessed for professional reclassification. The three criteria are: significant transaction volume (10+ per quarter over four quarters); portfolio exceeding €500,000 (cash deposits plus financial instruments); and one year of relevant professional experience in the financial sector.","❌ The number of significant transactions per quarter (minimum 10 over four quarters) IS one of the three criteria assessed for professional reclassification.","❌ The investor's work experience (minimum one year in a relevant financial sector position) IS one of the three criteria assessed.","❌ The value of the financial instrument portfolio (exceeding €500,000) IS one of the three criteria assessed — though it is the portfolio value, not global wealth."],correct:0,slide:"Slide 06"}
,
{q:"Suitability and appropriateness under MiFID II are best described as:",opts:["Synonyms that MiFID II uses interchangeably for the same client assessment — as set out in the relevant ESMA guidelines and technical standards","Two distinct layers of client assessment to align financial services and instruments with the needs and capabilities of investors — suitability applies to advice and portfolio management; appropriateness applies to other services","Assessments that investment firms must carry out only when retail clients are involved, but not when providing services to professional clients — a conduct obligation enforceable by national competent authorities","A single combined assessment required before any investment service is provided to any client — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Suitability and appropriateness are NOT synonyms; they are two distinct assessments with different scope, triggers, and consequences.", "✅ Correct — suitability and appropriateness are two distinct layers of client assessment: suitability (full assessment of knowledge/experience, financial situation, and investment objectives) applies to investment advice and portfolio management; appropriateness (knowledge and experience only, warning test) applies to other investment services.", "❌ Both assessments can also apply when serving professional clients, although professional clients benefit from certain presumptions under MiFID II.", "❌ A single combined assessment is not the MiFID II framework; suitability and appropriateness are triggered by different services and have different scope."],correct:1,slide:"Slide 06"}
,
{q:"Instruments of payment under MiFID II:",opts:["Qualify as financial instruments under MiFID II", "Fall inside the scope of MiFID II to the extent that they are bought and sold by banks", "Can be traded in multilateral trading facilities", "Do not qualify as financial instruments under MiFID II"],exps:["❌ Instruments of payment are explicitly excluded from the definition of financial instruments under MiFID II.", "❌ The fact that banks buy and sell instruments of payment does not bring them within MiFID II's financial instrument definition.", "❌ Instruments of payment cannot be traded in MTFs because they are not financial instruments within MiFID II's scope.", "✅ Correct — instruments of payment (such as currencies used as means of payment) do not qualify as financial instruments under MiFID II; they are explicitly excluded from Section C of Annex I."],correct:3,slide:"Slide 06"}
,
{q:"The information to be collected in the context of the suitability test under MiFID II includes:",opts:["Experience of the client in the financial markets only — applicable to all investment firms providing services to retail clients","Risk tolerance only — as set out in the relevant ESMA guidelines and technical standards","All of the other options — experience, risk tolerance, and financial situation of the client","Financial situation of the client only — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Experience alone is insufficient; the suitability test also requires risk tolerance and financial situation.", "❌ Risk tolerance alone is insufficient; the suitability test also requires experience and financial situation.", "✅ Correct — the suitability test collects ALL of: (1) knowledge and experience of the client in the financial markets; (2) risk tolerance and ability to bear losses; (3) financial situation including income, assets, commitments, and investment objectives.", "❌ Financial situation alone is insufficient; all three dimensions are required."],correct:2,slide:"Slide 06"}
,
{q:"Under the MiFID II framework, investment advice:",opts:["May be provided by both regulated and non-regulated firms", "Is not an investment service", "Involves stricter rules of conduct compared to other investment services", "Is an investment service, but does not usually involve stricter rules compared to other investment services"],exps:["❌ Investment advice is a regulated investment service under Section A of Annex I; only authorised investment firms or credit institutions may provide it as a professional activity.", "❌ Investment advice IS listed as an investment service in Section A of Annex I to MiFID II.", "✅ Correct — investment advice involves stricter rules of conduct compared to other investment services, including the full suitability assessment (versus merely appropriateness for other services), mandatory suitability reports for retail clients, and specific inducement restrictions for independent advice.", "❌ Investment advice involves stricter rules — including the blocking suitability test — compared to other services like execution-only or order reception/transmission."],correct:2,slide:"Slide 06"}
,
{q:"The 'non-complex instruments' category for execution-only services under MiFID II does NOT include which of the following?",opts:["Shares traded on regulated markets, which qualify as non-complex because they are liquid and pricing is transparent","UCITS units excluding structured UCITS, which are non-complex due to their daily redemption and regulated structure","Bonds without embedded derivatives traded on regulated venues, qualifying as non-complex under ESMA criteria","Structured products with embedded derivatives, which are complex even if capital-protected due to derivative features"],exps:["❌ Shares traded on regulated markets (excluding structured UCITS or those with embedded derivatives) are non-complex.","❌ UCITS units (excluding structured UCITS) are non-complex instruments.","❌ Bonds and debt instruments on regulated venues (excluding complex structures) are non-complex.","✅ Correct — structured products with embedded derivatives are complex instruments, even if capital-protected. Embedded derivative features are a key complexity indicator under ESMA guidelines."],correct:3,slide:"Slide 06"},
{q:"When must a firm issue a 10% portfolio loss alert to a retail client?",opts:["When any single instrument in the portfolio declines by 10% from its original purchase price regardless of portfolio impact","When the portfolio falls by 5% and includes any leveraged instruments or transactions with potential uncapped liability","When the overall portfolio value declines by 10% from the last periodic statement, and for each subsequent 10% decline","Only when total losses across all positions exceed 20% of the total portfolio value since the management agreement began"],exps:["❌ The 10% rule applies to the portfolio as a whole, not individual instruments (except for leveraged instruments and transactions involving potential liability, assessed instrument-by-instrument).","❌ The threshold is 10%, not 5%.","✅ Correct — MiFID II requires a 10% loss alert when the portfolio value declines by 10% from the last statement, and for each subsequent multiple of 10%, applicable to retail clients.","❌ The threshold is 10%, not 20%."],correct:2,slide:"Slide 06"},
{q:"Under MiFID II, a distributor's obligations in product governance include:",opts:["Developing distribution strategies aligned with the manufacturer's target market and reporting sales data to manufacturers","Verifying that the manufacturer's target market definition is mathematically correct and no further action is required","Assuming full liability for product design failures, replacing the manufacturer's responsibility for client outcomes entirely","Restricting distribution exclusively to professional clients to avoid the additional retail protection and suitability obligations"],exps:["✅ Correct — distributors must define distribution strategies aligned with the target market, understand product features and risks, conduct ongoing governance reviews, and report sales data and performance back to manufacturers.","❌ Distributors have broader obligations than merely verifying manufacturer definitions.","❌ Distributors do not assume manufacturer liability; both have independent obligations.","❌ MiFID II product governance applies across client categories; distributors cannot simply avoid retail obligations."],correct:0,slide:"Slide 06"},
{q:"Investment research under MiFID II is not considered an inducement when:",opts:["It is paid from the firm's own resources or from a dedicated Research Payment Account funded by a specific client charge","It is provided entirely free of charge by any third party, regardless of the commercial relationship with the provider","The research provider is a regulated investment firm supervised by an ESMA-recognised competent authority in any Member State","It is provided only to professional clients, since inducement restrictions do not apply to non-retail client relationships"],exps:["✅ Correct — investment research is not an inducement when paid from the firm's own resources or from a dedicated RPA funded by a client charge, with appropriate governance.","❌ 'Free of charge' does not automatically make research non-inducement; the source of payment matters.","❌ ESMA regulation of the research firm is irrelevant to inducement classification.","❌ The research recipient's client category does not determine inducement status."],correct:0,slide:"Slide 06"},
{q:"Under MiFID II, staff who provide investment advice must have deeper knowledge than those who only provide information. What specific area of knowledge is specifically required for advisers but not information providers?",opts:["Product features and risk characteristics, which are required for both information providers and advisers equally","General regulatory obligations of the firm, which all client-facing staff must understand regardless of their specific role","Suitability concerns, cost structures, portfolio management fundamentals, and client profile assessment techniques","Valuation techniques and economic indicators used to assess market conditions and forecast instrument performance"],exps:["❌ Product features and risks are required for both information providers and advisers.","❌ Regulatory obligations are required for both categories.","✅ Correct — advisers require deeper knowledge covering suitability concerns, cost structures, portfolio management fundamentals, the regulatory environment, and client profile assessment — beyond the information-provider requirements.","❌ Valuation techniques and economic indicators are among the knowledge requirements for information providers."],correct:2,slide:"Slide 06"},
{q:"For retail clients, best execution under MiFID II is primarily assessed on the basis of:",opts:["Speed of execution alone, since retail clients benefit most from immediate trade execution before prices can move","Market impact of the order, since minimising price impact is the most important factor for retail investor protection","Likelihood of execution and settlement, since certainty of completing the transaction is paramount for retail clients","Total consideration — the price of the financial instrument plus all direct costs including fees and commissions"],exps:["❌ Speed of execution is one of several factors, not the primary standard for retail clients.","❌ Market impact is a factor but not the primary standard.","❌ Likelihood of execution is a factor but not the primary standard for retail clients.","✅ Correct — for retail clients, best execution is assessed primarily on 'total consideration': the price of the instrument plus all direct execution costs. Other factors may only take precedence if instrumental in achieving best total consideration."],correct:3,slide:"Slide 06"},
{q:"MiFID II's GENIL case (C-604/11) clarified which aspect of civil liability for MiFID II breaches?",opts:["Member States must adopt a uniform damages regime for MiFID II breaches, ensuring equal investor protection EU-wide","Civil claims for MiFID II breaches can only be brought before the CJEU in Luxembourg, not before national courts","ESMA has exclusive jurisdiction to adjudicate civil claims arising from MiFID II violations by investment firms","Member States determine civil liability consequences under national law, subject to effectiveness and equivalence principles"],exps:["❌ The CJEU left civil liability to Member States; there is no uniform EU damages regime.","❌ Civil claims are brought before national courts, not the CJEU.","❌ ESMA has no adjudicative jurisdiction over civil claims.","✅ Correct — Genil clarified that Member States determine the civil consequences of MiFID II breaches under national law, provided that the principles of effectiveness and equivalence are respected."],correct:3,slide:"Slide 06"},
{q:"A systematic internaliser (SI) under MiFID II is required to:",opts:["Publish firm quotes for shares, depositary receipts, ETFs, and certificates, with transparency obligations aligned to venues","Obtain separate authorisation as a trading venue from its national competent authority before operating as an SI","Apply full pre-trade and post-trade transparency rules identical to those applicable to regulated markets under MiFIR","Accept and execute orders from any investor regardless of size, client category, or relationship with the SI operator"],exps:["✅ Correct — SIs must publish firm quotes for shares, depositary receipts, ETFs, and certificates, aligning their transparency obligations with those of multilateral venues despite being bilateral entities.","❌ SIs do not need separate venue authorisation; they notify their NCA.","❌ SIs are subject to SI-specific transparency rules, not identical to regulated market obligations.","❌ SIs may limit the number of transactions or refuse orders from clients in certain circumstances."],correct:0,slide:"Slide 06"},
{q:"The 'suitability' obligation in MiFID II differs from the 'appropriateness' obligation in that:",opts:["Suitability applies to execution-only services while appropriateness applies to investment advice and portfolio management","Appropriateness requires assessment of all three suitability dimensions while suitability assesses only knowledge and experience","Suitability applies exclusively to professional clients while appropriateness applies exclusively to retail investors","Suitability is a blocking test for advice — no unsuitable recommendation may be made; appropriateness permits client override"],exps:["❌ Suitability applies to advice and portfolio management, not execution-only services.","❌ Suitability requires all three dimensions; appropriateness is limited to knowledge and experience only.","❌ Both apply to retail and professional clients, with different presumptions.","✅ Correct — suitability is a blocking test for advice/portfolio management (no unsuitable recommendation can be made); appropriateness is a warning test for other services (the firm warns but the client can proceed)."],correct:3,slide:"Slide 06"},
{q:"Under MiFID II, what is the maximum period during which unqualified staff may provide investment services under the supervision of a qualified adviser?",opts:["One year, after which unqualified staff must either achieve full qualification or cease providing any investment services","Two years, during which supervisors must document all client interactions and file quarterly reports with the NCA","Four years, after which staff must satisfy the full qualification requirements or be restricted to non-client-facing roles","Six months, being the minimum relevant experience period required alongside formal qualifications for all advisory staff"],exps:["❌ One year is insufficient for the supervisory period.","❌ Two years is not the correct maximum period.","✅ Correct — unqualified staff may provide investment services under the supervision of a qualified adviser for a maximum of four years, after which they must meet the full qualification requirements.","❌ Six months is the minimum relevant experience requirement for qualified staff, not the supervisory period for unqualified staff."],correct:2,slide:"Slide 06"},
{q:"MiFID II's four core regulatory objectives are best described as:",opts:["Market transparency, investor protection, market integrity, and cross-border integration through maximum harmonisation","Free movement of capital, elimination of tax barriers to investment, harmonisation of insolvency law, and retail protection","Reducing systemic risk, promoting sustainable finance, digitalising financial services, and simplifying regulatory requirements","Establishing a single currency, creating a banking union, harmonising contract law, and protecting depositor interests"],exps:["✅ Correct — MiFID II's four core objectives are: (1) market transparency (pre/post-trade); (2) investor protection (conduct rules, product governance); (3) market integrity (algorithmic trading, MAR interface); and (4) cross-border integration through maximum harmonisation.","❌ Free movement of capital and insolvency law are Treaty/general EU law matters, not MiFID II's specific objectives.","❌ These describe broader EU financial policy priorities, not MiFID II's specific objectives.","❌ These describe Banking Union and monetary union objectives, not MiFID II."],correct:0,slide:"Slide 06"}],
"07 — Trading Venues":[
{q:"Under MiFID II, a 'trading venue' is defined as:",opts:["Any system that, as a regular business, brings together multiple third-party buying and selling interests in financial instruments and matches those interests so a contract is formed","Any regulated market recognised by a Member State — applicable to all investment firms providing services to retail clients — a position that differs from the correct EU legal framework applicable in this context","Any investment firm authorised to execute client orders — a conduct obligation enforceable by national competent authorities — a description that applies to a different EU legal act, not the one relevant to this question","Any electronic platform used for trading financial instruments — reflecting the investor protection objective of MiFID II's framework"],exps:["✅ Correct — a trading venue is any system that, as a regular business, brings together multiple third-party buying and selling interests and matches them so a contract is formed.","❌ Regulated markets are one category of trading venue, but the definition is broader.","❌ Investment firms may operate trading venues but are not themselves trading venues.","❌ 'Electronic platform' is too broad; the definition requires multilateral matching."],correct:0,slide:"Slide 07"},
{q:"A Regulated Market (RM) is best described as:",opts:["A multilateral system operated by an investment firm matching third-party orders under non-discretionary rules, not authorised as an RM — as established under the relevant EU secondary legislation framework","An investment firm dealing on own account bilaterally with clients outside regulated venues — as confirmed by the relevant CJEU case law and regulatory guidance","A multilateral platform for non-equity instruments where the operator may exercise discretion — reflecting the harmonisation objective of the EU single financial market","A multilateral system operated by a market operator bringing together multiple third-party interests under non-discretionary rules — the most demanding governance and transparency obligations — notified by each Member State to ESMA"],exps:["❌ A multilateral system operated by an investment firm (not authorised as RM) describes an MTF.","❌ An investment firm dealing bilaterally on own account describes a Systematic Internaliser.","❌ A platform for non-equity instruments with operator discretion describes an OTF.","✅ Correct — RMs are operated by market operators under non-discretionary rules, subject to the most demanding governance and transparency obligations."],correct:3,slide:"Slide 07"},
{q:"An Organised Trading Facility (OTF) was introduced by MiFID II to capture:",opts:["All equity trading outside regulated markets — applicable to all investment firms providing services to retail clients","Previously unregulated multilateral platforms for non-equity instruments (bonds, derivatives, structured products) where the operator may exercise discretion","Systematic internalisers dealing on their own account — a conduct obligation enforceable by national competent authorities","Alternative Investment Fund managers operating trading platforms — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ OTFs are limited to non-equity instruments.","✅ Correct — OTFs were introduced to capture previously unregulated multilateral platforms for non-equity instruments, where the operator may exercise discretion subject to conduct constraints.","❌ Systematic internalisers are bilateral, not multilateral.","❌ AIFM platforms are not OTFs."],correct:1,slide:"Slide 07"},
{q:"The key difference between OTF and RM/MTF regarding discretion is:",opts:["OTF operators may exercise discretion when executing transactions (subject to conduct constraints); RMs and MTFs must use non-discretionary rules","OTF operators must use non-discretionary rules; RMs and MTFs may exercise discretion — as established under the relevant EU secondary legislation framework","All three venue types operate under non-discretionary rules without exception — reflecting the harmonisation objective of the EU single financial market","Discretion rules apply only to equity instruments across all venue types — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — OTF operators may exercise discretion; both RMs and MTFs must operate under non-discretionary rules.","❌ This is the exact reverse.","❌ OTFs are distinguished precisely by the ability to exercise discretion.","❌ Discretion rules apply differently depending on venue type, not instrument type."],correct:0,slide:"Slide 07"},
{q:"A Systematic Internaliser (SI) differs from a trading venue because:",opts:["SIs are investment firms dealing bilaterally on own account with clients outside RMs, MTFs, or OTFs — they lack the multilateralism characterising true trading venues","SIs trade only bonds and structured products, not equities — as established under the relevant EU secondary legislation framework","SIs require separate authorisation as market operators from their home NCA — reflecting the harmonisation objective of the EU single financial market","SIs are only permitted in Member States that have opted out of certain MiFID II provisions — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — SIs are investment firms dealing bilaterally on own account with clients outside RMs/MTFs/OTFs; they lack multilateralism and are not trading venues in the statutory sense.","❌ SIs can trade equities and other instruments.","❌ SIs need merely to notify their NCA; no separate market operator authorisation is required.","❌ SIs are a uniform EU concept; there is no opt-out provision."],correct:0,slide:"Slide 07"},
{q:"An SME Growth Market must meet which registration requirement?",opts:["At least 25% of issuers must be SMEs with market cap below €200 million — as established under the relevant EU secondary legislation framework","At least 75% of traded instruments must be equity securities — as confirmed by the relevant CJEU case law and regulatory guidance","All issuers must be SMEs with fewer than 250 employees — reflecting the harmonisation objective of the EU single financial market","At least 50% of issuers whose financial instruments are traded must be SMEs (average market cap below EUR 200 million over the previous three years)"],exps:["❌ The threshold is 50%, not 25%.","❌ The requirement concerns issuer characteristics, not instrument type.","❌ The SME Growth Market does not require all issuers to be SMEs.","✅ Correct — at least 50% of issuers must be SMEs (average market cap below EUR 200 million over the previous three years)."],correct:3,slide:"Slide 07"},
{q:"The Share Trading Obligation under MiFIR requires:",opts:["Investment firms to execute transactions in shares admitted to EU trading only on an RM, MTF, SI, or equivalent third-country venue — internal crossing is no longer permissible","All shares to be traded exclusively on regulated markets — as established under the relevant EU secondary legislation framework","Investment firms to report all share transactions to ESMA within 15 minutes — reflecting the harmonisation objective of the EU single financial market","Shares to be cleared through an EU central counterparty — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — once a share is admitted to EU trading, investment firms must execute transactions only on an RM, MTF, SI, or equivalent third-country venue.","❌ SIs and equivalent third-country venues are also permitted.","❌ 15-minute reporting is a post-trade transparency obligation, not the Share Trading Obligation.","❌ Central clearing is required for specific derivatives under EMIR, not all share transactions."],correct:0,slide:"Slide 07"},
{q:"Pre-trade transparency obligations require trading venues to make public on a continuous basis:",opts:["Only prices of transactions that have already been executed — as established under the relevant EU secondary legislation framework","Current bid and offer prices, depth of trading interests, and actionable indications of interest — free of charge 15 minutes after publication","Only transaction prices for regulated market equities — reflecting the harmonisation objective of the EU single financial market","Aggregate trading volumes without individual order prices — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Post-execution information describes post-trade transparency.","✅ Correct — venues must publish current bid/offer prices, depth of trading interests, and actionable indications of interest, free of charge 15 minutes after publication.","❌ Pre-trade transparency applies beyond equities.","❌ Individual order prices are required, not just aggregate volumes."],correct:1,slide:"Slide 07"},
{q:"Post-trade transparency for non-equity instruments under MiFIR requires publication:",opts:["Within 1 minute of execution — as established under the relevant EU secondary legislation framework","Within 1 business day of execution — as confirmed by the relevant CJEU case law and regulatory guidance","Within 5 minutes of execution — reflecting the harmonisation objective of the EU single financial market","Within 15 minutes of execution (moving to 5 minutes under MiFIR reform)"],exps:["❌ Within 1 minute applies to equity instruments, not non-equities.","❌ Within 1 business day is far too long for post-trade transparency.","❌ Within 5 minutes is the future target, not the current 15-minute requirement.","✅ Correct — non-equity instruments must be published within 15 minutes of execution, moving to 5 minutes as MiFIR reforms develop."],correct:3,slide:"Slide 07"},
{q:"The Consolidated Tape Provider (CTP) under MiFIR is best described as:",opts:["A real-time reporting mechanism for derivatives cleared through CCPs","An approved reporting mechanism for transaction reporting to competent authorities","A platform for pre-trade transparency of order books across all EU venues","A system aggregating post-trade data from all trading venues and APAs into a single consolidated feed"],exps:["❌ CCP reporting is handled under EMIR and SFTR.","❌ Transaction reporting to competent authorities is handled by ARMs (Approved Reporting Mechanisms).","❌ The CTP covers post-trade data, not pre-trade order books.","✅ Correct — the CTP aggregates post-trade data from all trading venues and APAs into a single consolidated feed, disseminating it commercially while making a delayed version freely available."],correct:3,slide:"Slide 07"},
{q:"High-frequency trading (HFT) under MiFID II is defined by three objective elements. Which are they?",opts:["Low-latency infrastructure, fully automated execution, and high intraday message rate exceeding quantitative thresholds","Artificial intelligence, machine learning, and automated execution — applicable to all investment firms providing services to retail clients","Co-location, smart order routing, and market-making obligations — a conduct obligation enforceable by national competent authorities","Flash-crash exposure, liquidity provision, and cross-venue arbitrage — reflecting the investor protection objective of MiFID II's framework"],exps:["✅ Correct — HFT is defined by: low-latency infrastructure (co-location, proximity), fully automated execution with no/limited human intervention, and high intraday message rate exceeding quantitative thresholds.","❌ AI and machine learning are not the three legal elements defining HFT.","❌ Smart order routing is part of algorithmic trading generally; these do not define HFT.","❌ These describe potential effects or strategies, not the legal definition."],correct:0,slide:"Slide 07"},
{q:"Article 19 of Delegated Regulation 2017/565 sets the HFT quantitative threshold at:",opts:["1 message per second in a single instrument or 2 per second across all instruments on a venue","5 messages per second exclusively for equity instruments","10 messages per second in any instrument on a regulated market","2 messages per second in a single instrument or 4 per second across all instruments on a given venue"],exps:["❌ The threshold is 2/4, not 1/2.","❌ The threshold applies across instruments, not exclusively equities.","❌ 10 messages per second is not the regulatory threshold.","✅ Correct — the threshold is an average of 2 messages per second in a single instrument or 4 messages per second across all instruments on a given venue."],correct:3,slide:"Slide 07"},
{q:"Investment firms engaging in algorithmic trading under MiFID II must:",opts:["Notify their competent authority, keep detailed logs for five years, and ensure algorithms do not disrupt fair and orderly trading","Cease all automated trading when market volatility exceeds 2% — applicable to all investment firms providing services to retail clients","Obtain a separate MiFID II authorisation specifically for algorithmic trading — a conduct obligation enforceable by national competent authorities","Submit all algorithms to ESMA for pre-approval before deployment — reflecting the investor protection objective of MiFID II's framework"],exps:["✅ Correct — firms must notify their competent authority, keep detailed logs for five years, and ensure algorithms do not disrupt fair and orderly trading.","❌ A 2% volatility threshold triggering cessation is not the MiFID II requirement.","❌ Algorithmic trading is covered within the existing MiFID II authorisation.","❌ ESMA pre-approval of algorithms is not required."],correct:0,slide:"Slide 07"},
{q:"A Smart Order Router (SOR) that adjusts price, size, or timing is:",opts:["Expressly excluded from the definition of algorithmic trading","Itself an algorithmic trading application because it alters key order parameters","A type of systematic internaliser","Not subject to any MiFID II requirements because it only optimises execution"],exps:["❌ A SOR adjusting price, size, or timing IS algorithmic trading; only a pure venue-selector is excluded.","✅ Correct — a SOR that optimises execution by adjusting price, size, or timing is itself an algorithmic trading application under MiFID II.","❌ SIs are bilateral dealers; a SOR is an order routing tool.","❌ If it constitutes algorithmic trading, it is fully subject to MiFID II requirements."],correct:1,slide:"Slide 07"},
{q:"At the end of 2022, how many trading venues were registered in the EU, alongside how many systematic internalisers?",opts:["150 trading venues; 50 SIs","250 trading venues; 100 SIs","500 trading venues; 300 SIs","310 trading venues; 188 SIs"],exps:["❌ 150 trading venues and 50 SIs are not the figures cited.","❌ 250 trading venues and 100 SIs are not the figures cited.","❌ 500 trading venues and 300 SIs are not the figures cited.","✅ Correct — 310 trading venues were registered in the Union at the end of 2022, alongside 188 systematic internalisers."],correct:3,slide:"Slide 07"},
{q:"The Investment Services Directive (93/22/EEC) triggered which transformation in EU markets?",opts:["Introduction of OTFs for bond trading — a requirement introduced by the Lamfalussy Level 2 implementing measures","Radical transformation of regulated markets — continental markets underwent gradual privatisation while the UK introduced forms of public control","Creation of the first fully harmonised framework for AT/HFT regulation — reflecting the maximum harmonisation approach adopted in this EU framework","Establishment of the consolidated tape provider system — a principle established in the foundational Regulation governing this area"],exps:["❌ OTFs were introduced by MiFID II (2014).","✅ Correct — the ISD (1993) triggered radical transformation; continental Europe's 'public' model markets underwent gradual privatisation while the UK introduced forms of public control.","❌ AT/HFT regulation was introduced by MiFID II.","❌ The consolidated tape provider is a more recent MiFIR development."],correct:1,slide:"Slide 07"},
{q:"Trading venues using algorithmic market-makers must:",opts:["Bind market-making firms by written agreement to maintain two-sided quotes during a significant portion of the trading day","Prohibit algorithmic market-making due to systemic risks — as established under the relevant EU secondary legislation framework","Ensure algorithmic market-makers hold at least €750,000 in initial capital — reflecting the harmonisation objective of the EU single financial market","Report all algorithmic market-making activity to ESMA weekly — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — where a firm conducts market-making through algorithms, the venue must bind it by written agreement to maintain two-sided quotes during a significant portion of the trading day.","❌ Algorithmic market-making is permitted under MiFID II.","❌ Capital requirements are set based on firm class under IFR.","❌ Weekly ESMA reporting of market-making activity is not required."],correct:0,slide:"Slide 07"},
{q:"The 'enter-display-match-publish-settle' sequence describes:",opts:["The lifecycle of a derivative contract from inception to maturity — as established under the relevant EU secondary legislation framework","How trading venues operate: from order routing through validation, display, matching, instant publication, and settlement","The MiFID II authorisation process for new investment firms — reflecting the harmonisation objective of the EU single financial market","The four Lamfalussy levels applied to trading venue regulation — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The lifecycle of a derivative contract is a different sequence.","✅ Correct — this sequence describes how trading venues operate: orders are routed, validated, displayed in the queue, matched by a matching engine, trade details published almost instantly, then cleared and settled.","❌ The authorisation process for investment firms is not described by this sequence.","❌ The Lamfalussy process has four levels (framework legislation, technical standards, harmonised application, enforcement)."],correct:1,slide:"Slide 07"},
{q:"The Derivatives Trading Obligation under MiFIR applies to:",opts:["All OTC derivatives contracts without exception — a requirement applying to all entities within the relevant regulatory scope — a position that differs from the correct EU legal framework applicable in this context","Only trades between EU-based financial counterparties — as confirmed by the relevant CJEU case law and regulatory guidance — an interpretation that was considered but rejected by the EU legislator during the drafting process","Only interest rate derivatives denominated in euros — reflecting the harmonisation objective of the EU single financial market — a description that applies to a different EU legal act, not the one relevant to this question","Specified classes of derivatives subject to EMIR central clearing mandate and assessed by ESMA as sufficiently liquid — requiring execution on RM, MTF, OTF, or equivalent third-country venue"],exps:["❌ Not all OTC derivatives are subject to the trading obligation.","❌ The DTO extends to transactions with a direct, substantial, and foreseeable effect within the Union.","❌ The DTO is not limited to euro-denominated interest rate derivatives.","✅ Correct — the Derivatives Trading Obligation applies to derivatives subject to EMIR's clearing mandate and assessed by ESMA as sufficiently liquid."],correct:3,slide:"Slide 07"}
,
{q:"Under MiFID II, investment firms engaging in algorithmic trading must test each algorithm:",opts:["Once every five years as part of regulatory review","Only for HFT algorithms, not for standard algorithmic trading","Only when the NCA specifically requests a review","Before first use and after any significant modification"],exps:["❌ Five-year reviews are not the requirement.","❌ Conformance testing applies to all algorithmic trading, not only HFT.","❌ Algorithmic testing is a firm obligation, not dependent on NCA requests.","✅ Correct — every algorithm must be tested before first use and after any significant modification."],correct:3,slide:"Slide 07"},
{q:"NCAs may grant waivers from pre-trade transparency requirements for:",opts:["All trading by professional investors and eligible counterparties","Transactions executed by systematic internalisers in non-equity instruments","Any transaction where the client requests confidentiality","Large-scale orders, reference-price transactions, or illiquid instruments"],exps:["❌ Professional investor status does not automatically qualify for a pre-trade transparency waiver.","❌ SI transactions in non-equity instruments do not automatically qualify for waivers.","❌ Client confidentiality requests are not a basis for pre-trade transparency waivers.","✅ Correct — NCAs may grant pre-trade transparency waivers for large-scale orders, reference-price transactions, or illiquid instruments."],correct:3,slide:"Slide 07"},
{q:"The legal status of an RM vs an MTF differs in that:",opts:["An RM receives formal official recognition as 'market operator' by a Member State; an MTF requires investment firm authorisation under MiFID II and is not granted this formal status","An RM can trade only equities while an MTF can trade all instruments — as established under the relevant EU secondary legislation framework","An MTF faces more demanding governance requirements than an RM — reflecting the harmonisation objective of the EU single financial market","An OTF and MTF are legally identical except for the instruments they can trade — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — RMs receive formal official recognition as 'market operator' by a Member State and must be notified to ESMA; MTFs operate under investment firm authorisation.","❌ Both RMs and MTFs can trade all financial instruments.","❌ RMs face more demanding governance requirements than MTFs.","❌ OTFs and MTFs differ significantly: OTFs allow operator discretion and are limited to non-equity instruments."],correct:0,slide:"Slide 07"},
{q:"MiFIR deferred post-trade publication is permitted where:",opts:["The counterparty is an eligible counterparty or professional client — as established under the relevant EU secondary legislation framework","The transaction is large in scale, involves a package order, or meets other specified conditions","All OTC transactions between financial counterparties — reflecting the harmonisation objective of the EU single financial market","Transactions executed after market hours — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Counterparty classification alone does not trigger deferred publication.", "✅ Correct — MiFIR permits deferred publication where the transaction is large in scale, involves a package order, or meets other specified conditions.", "❌ Not all OTC transactions between financial counterparties qualify for deferred publication.", "❌ After-hours transactions are not automatically eligible for deferred publication."],correct:1,slide:"Slide 07"},
{q:"MiFID II requires trading venues using algorithmic market-makers to:",opts:["Permanently halt trading in any instrument that falls more than 5% in one day — applicable to all investment firms providing services to retail clients","Activate only upon instruction from the NCA — reflecting the investor protection objective of MiFID II's framework","Apply only during pre-opening auction periods — a conduct obligation enforceable by national competent authorities","Deploy circuit breakers and kill-switches that can immediately halt trading or throttle disorderly flows when abnormal conditions are detected, preventing flash crashes"],exps:["❌ A 5% daily fall does not automatically trigger circuit breakers.","❌ Firms and venues must be able to activate these independently.","❌ Circuit breakers and kill-switches operate throughout the trading day.","✅ Correct — MiFID II requires venues to deploy mechanisms that can immediately halt trading or throttle disorderly flows when abnormal conditions are detected, preventing flash crashes."],correct:3,slide:"Slide 07"}
,
