{q:"The PRIIPs Regulation (EU 1286/2014) supplements the Prospectus Regulation by providing:",opts:["General disclosure requirements for all financial products — a requirement introduced by the Lamfalussy Level 2 implementing measures","Requirements only for structured equity products offered to retail investors — reflecting the maximum harmonisation approach adopted in this EU framework","Specific disclosure requirements for packaged retail investment and insurance-based investment products — which due to complexity and opacity require additional layers of transparency","Requirements only for life insurance products with investment components — a principle established in the foundational Regulation governing this area"],exps:["❌ The PRIIPs Regulation has a specific scope focused on packaged products.","❌ The scope extends beyond structured equity products.","✅ Correct — the PRIIPs Regulation provides specific disclosure requirements for packaged retail investment and insurance-based investment products, which due to complexity and opacity require additional transparency.","❌ The scope extends beyond life insurance products."],correct:2,slide:"Slide 14"},
{q:"The Key Information Document (KID) must be prepared and published by:",opts:["The entity responsible for issuing the PRIIP (manufacturer) — prior to the PRIIP's availability to retail investors","The NCA responsible for supervising the PRIIP — as established under the relevant EU secondary legislation framework","The distributor of the PRIIP at the point of sale — reflecting the harmonisation objective of the EU single financial market","ESMA for standardised retail products — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the manufacturer must prepare the KID and publish it on its website prior to the PRIIP's availability to retail investors.","❌ The NCA does not prepare the KID.","❌ The distributor must provide the KID to investors but does not prepare it (unless also acting as manufacturer).","❌ ESMA does not prepare KIDs for individual products."],correct:0,slide:"Slide 14"},
{q:"The KID must be no longer than:",opts:["One A4 page","Two A4 pages","Three A4 pages","Five A4 pages"],exps:["❌ One A4 page is insufficient for the required content.","❌ Two A4 pages is not the regulatory maximum.","✅ Correct — the KID must be a short, concise document of no more than three A4 pages when printed.","❌ Five A4 pages exceeds the regulatory maximum."],correct:2,slide:"Slide 14"},
{q:"The KID contains how many defined sections?",opts:["Four sections","Five sections","Seven sections","Ten sections"],exps:["❌ Four sections is below the number required.","❌ Five sections is below the number required.","✅ Correct — the KID contains seven sections: (1) What is this product? (2) Risks and potential rewards? (3) Costs? (4) How long must I hold it? (5) Guarantee/compensation schemes? (6) Means of redress? (7) Other relevant information.","❌ Ten sections exceeds the number defined."],correct:2,slide:"Slide 14"},
{q:"Post-contract delivery of the KID under Article 13 is permitted only when:",opts:["The distributor chooses convenience over pre-contractual delivery — as confirmed by the CJEU in its consistent line of case law on this point — a position that differs from the correct EU legal framework applicable in this context","Only for professional clients and eligible counterparties — a requirement introduced by the Lamfalussy Level 2 implementing measures — an interpretation that was considered but rejected by the EU legislator during the drafting process","Only when the NCA grants an emergency waiver — a principle established in the foundational Regulation governing this area — a description that applies to a different EU legal act, not the one relevant to this question","The retail client decided on own initiative to use distance communication, delivery was not possible in good time before contract conclusion, the client was informed of this and agreed to post-contract delivery rather than postponing"],exps:["❌ Distributor convenience is not a permitted reason for post-contract delivery.","❌ The PRIIPs Regulation applies to retail investors, not professional clients.","❌ NCA emergency waivers are not the mechanism.","✅ Correct — Article 13 permits post-contract delivery only when: client contacted seller on own initiative via distance communication, delivery not possible before conclusion, client informed and agreed to post-contract delivery."],correct:3,slide:"Slide 14"},
{q:"EIOPA's role under the PRIIPs Regulation includes:",opts:["Preparing and distributing KIDs to retail investors directly — a requirement introduced by the Lamfalussy Level 2 implementing measures","Monitoring insurance-based PRIIPs and having the power to temporarily prohibit or restrict their marketing, distribution, or sale","Approving all PRIIPs before they can be offered to retail investors — reflecting the maximum harmonisation approach adopted in this EU framework","Standardising the KID format for all PRIIP types independently — a principle established in the foundational Regulation governing this area"],exps:["❌ EIOPA does not prepare or distribute KIDs to retail investors.","✅ Correct — EIOPA monitors insurance-based PRIIPs marketed in the Union and can temporarily prohibit or restrict marketing, distribution, or sale of certain PRIIPs or financial activities.","❌ NCAs approve individual products where relevant; EIOPA does not approve all PRIIPs.","❌ The KID RTS are developed jointly through the Joint Committee of ESAs."],correct:1,slide:"Slide 14"},
{q:"Product intervention by EIOPA or national authorities is best described as:",opts:["The primary regulatory tool used routinely for all PRIIPs — as established under the relevant EU secondary legislation framework","A measure of last resort, subject to conditions of residuality, proportionality, publication, and advance notice of at least one month to EIOPA and other authorities (except urgency)","A voluntary tool that authorities use at their discretion without conditions — reflecting the harmonisation objective of the EU single financial market","A tool exclusively available to ESMA for equity-linked PRIIPs — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Product intervention is a last resort, not a routine tool.","✅ Correct — product intervention is a last resort only when other measures are insufficient; it must be proportionate, published on the authority's website, and notified at least one month in advance (except urgency).","❌ Specific conditions apply; product intervention is not purely discretionary.","❌ ESMA has product intervention powers for MiFID II products; EIOPA has them for insurance-based PRIIPs."],correct:1,slide:"Slide 14"},
{q:"The distinction between 'manufacturers' and 'distributors' of PRIIPs is important because:",opts:["Only manufacturers are subject to any obligations under the PRIIPs Regulation — as established under the relevant EU secondary legislation framework — a position that differs from the correct EU legal framework applicable in this context","Manufacturers prepare and publish the KID; distributors must provide it to retail investors in a timely manner before they are bound by any contract — the same entity can be both manufacturer and distributor","Distributors prepare the KID; manufacturers only review it — as confirmed by the relevant CJEU case law and regulatory guidance — a description that applies to a different EU legal act, not the one relevant to this question","Only distributors face civil liability for KID content — as established under the relevant EU secondary legislation framework — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ Both manufacturers and distributors have obligations.","✅ Correct — manufacturers prepare and publish the KID; distributors provide it before the client is bound by any contract; the same entity can be both manufacturer and distributor.","❌ Manufacturers, not distributors, prepare the KID.","❌ Primary civil liability for KID content rests with the manufacturer."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation applies to which category of investors?",opts:["All investors including professional clients and eligible counterparties — a requirement introduced by the Lamfalussy Level 2 implementing measures","Only investors who lack relevant investment experience — a principle established in the foundational Regulation governing this area","Only investors below a certain asset threshold — reflecting the maximum harmonisation approach adopted in this EU framework","Retail investors as defined under MiFID II or the Insurance Distribution Directive — the PRIIPs regime does not apply to professional clients"],exps:["❌ The PRIIPs Regulation is specifically for retail investors.","❌ The definition refers to MiFID II retail client status.","❌ There is no specific asset threshold in the PRIIPs Regulation.","✅ Correct — the KID is delivered only when a PRIIP is marketed to 'retail investors' as defined under MiFID II or the IDD; the PRIIPs regime does not apply to professional clients."],correct:3,slide:"Slide 14"},
{q:"Multi-option PRIIPs (offering multiple investment options) must:",opts:["Produce a single KID covering all options generically — applicable to all investment firms providing services to retail clients","Either divide disclosure into several KIDs (one per option) OR produce a single KID with generic disclosure plus specific technical annexes for each option","Only disclose the top three investment options by performance — a conduct obligation enforceable by national competent authorities","Have each option approved separately by the NCA — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ A single KID without option-specific detail is insufficient.","✅ Correct — for multi-option PRIIPs, manufacturers must either produce separate KIDs per option OR produce a single KID with generic PRIIP disclosure plus specific technical annexes for each option.","❌ Disclosure of only the top three options would not meet RTS requirements.","❌ Separate NCA approval per option is not required."],correct:1,slide:"Slide 14"}
,
{q:"When a product falls within both the PRIIPs Regulation and the Prospectus Regulation:",opts:["The PRIIPs Regulation takes precedence and replaces the prospectus summary — a requirement introduced by the Lamfalussy Level 2 implementing measures","Only the Prospectus Regulation applies as it is more comprehensive — reflecting the maximum harmonisation approach adopted in this EU framework","Manufacturers may need to prepare both a prospectus summary AND a PRIIPs KID — though when a KID exists, the prospectus summary can be modelled on and rely on the KID content","The NCA determines which single document is required — a principle established in the foundational Regulation governing this area"],exps:["❌ The PRIIPs Regulation does not replace the prospectus summary.","❌ Both Regulations may apply simultaneously.","✅ Correct — when a product falls within both Regulations, manufacturers may need to prepare both; however, the Prospectus Regulation acknowledges that when a KID exists, the prospectus summary can be modelled on and rely on the KID content.","❌ The NCA does not determine which single document is required."],correct:2,slide:"Slide 14"},
{q:"The PRIIPs KID must be provided to retail investors:",opts:["Well before the retail investor is bound by any contract or offer relating to the PRIIP — 'in good time' before conclusion","Within 24 hours after the contract is concluded — as established under the relevant EU secondary legislation framework","Within 30 days following the contract conclusion — reflecting the harmonisation objective of the EU single financial market","Only if the retail investor specifically requests it — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the KID must be provided 'in good time' before the retail investor is bound by any contract or offer relating to the PRIIP.","❌ The KID must be provided before the contract is concluded.","❌ Providing the KID within 30 days after contract conclusion is only permitted in the limited post-contract delivery conditions of Article 13.","❌ KID delivery is proactive and mandatory, not dependent on client request."],correct:0,slide:"Slide 14"},
{q:"The PRIIPs Regulation defines 'manufacturers' to also include:",opts:["The originator/creator who issues the PRIIP AND persons who make changes to an existing PRIIP — including changing its risk and return profile or the costs associated with investment","Only original creators of PRIIPs who issue them for the first time — a requirement introduced by the Lamfalussy Level 2 implementing measures","Only investment firms authorised under MiFID II — reflecting the maximum harmonisation approach adopted in this EU framework","Only insurance undertakings regulated under Solvency II — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — the Regulation defines a manufacturer as the originator/creator who issues the PRIIP, AND also as 'a person who makes changes to an existing PRIIP, including changing its risk and return profile or the costs associated with investment'.","❌ The definition of manufacturer extends beyond original creators.","❌ Manufacturers include entities beyond MiFID II investment firms.","❌ Manufacturers include entities beyond insurance undertakings."],correct:0,slide:"Slide 14"}
,
{q:"Which of the following is explicitly EXCLUDED from the PRIIPs Regulation?",opts:["Life insurance products with benefits payable only in the event of death or disability, non-life insurance products, simple bank deposits linked only to an interest rate, and pension plans","Units in investment funds — as confirmed by the CJEU in its consistent line of case law on this point — a position that differs from the correct EU legal framework applicable in this context","Structured deposits with capital protection — a principle established in the foundational Regulation governing this area — a description that applies to a different EU legal act, not the one relevant to this question","Derivatives sold to retail clients — a requirement introduced by the Lamfalussy Level 2 implementing measures — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — excluded from the PRIIPs Regulation are: non-life insurance products; life insurance where benefits are payable only in the event of death or disability; simple bank deposits linked only to an interest rate; financial assets held directly by the investor; and certain pension plans.","❌ Units in investment funds (specifically UCITS) were subject to a transitional exemption but are within the Regulation's scope.","❌ Structured deposits with capital protection may qualify as PRIIPs if the amount repayable is subject to fluctuations.","❌ Derivatives sold to retail clients are within the PRIIPs Regulation's scope."],correct:0,slide:"Slide 14"},
{q:"The PRIIPs Regulation is described as a 'cross-sectoral legislative regime' because:",opts:["It was adopted jointly by Parliament, Council, and Commission with equal voting rights — a requirement introduced by the Lamfalussy Level 2 implementing measures","It encompasses diverse sectors and a wide range of products — unlike the more sectorally limited Prospectus Regulation — covering funds, structured products, derivatives, and insurance-based investment products","It applies across all EU Member States simultaneously without national implementing measures — reflecting the maximum harmonisation approach adopted in this EU framework","It was developed in coordination with the US SEC and Japanese FSA — a principle established in the foundational Regulation governing this area"],exps:["❌ The co-decision procedure is the standard EU legislative process, not what makes PRIIPs cross-sectoral.", "✅ Correct — the PRIIPs Regulation is a distinctive example of a truly cross-sectoral legislative regime within EU Capital Markets Law, encompassing diverse sectors and a wide range of products across funds, structured products, derivatives, and insurance-based investment products.", "❌ While the PRIIPs Regulation is directly applicable (as a Regulation), cross-sectorality refers to the scope across financial sectors, not the legislative form.", "❌ International coordination is not what makes PRIIPs cross-sectoral."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation is based on the premise that:",opts:["Investors exercise due diligence and make informed decisions — but research shows individuals without professional backgrounds may face challenges navigating comprehensive information, hence the focus on how information is presented","Retail investors always make fully rational investment decisions when given complete information — a requirement introduced by the Lamfalussy Level 2 implementing measures","Retail investors should be prohibited from investing in complex products — a principle established in the foundational Regulation governing this area — a description that applies to a different EU legal act, not the one relevant to this question","All financial products should be standardised to eliminate investor confusion — a principle established in the foundational Regulation governing this area — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — the Regulation is based on the premise that investors exercise due diligence and make informed decisions, but is also informed by research showing individuals without professional backgrounds may face challenges navigating comprehensive information — hence the particular attention to how information is presented.","❌ The PRIIPs Regulation acknowledges that retail investors may face challenges with complex information.","❌ The Regulation aims to facilitate informed investment in complex products, not prohibit them.","❌ Standardising all financial products is not the approach; the KID standardises disclosure, not the products themselves."],correct:0,slide:"Slide 14"},
{q:"PRIIPs serve as an 'interface' between retail investors and markets because they:",opts:["Are sold exclusively through regulated intermediaries who filter unsuitable products — as established under the relevant EU secondary legislation framework","Assemble assets in such a way as to create products with different exposures, characteristics, or cost structures than would be the case if assets were held directly","Replace direct market access for retail investors entirely — reflecting the harmonisation objective of the EU single financial market","Are always guaranteed by the issuer against capital loss — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ PRIIPs can be sold through various channels; exclusive intermediary distribution is not the definition.", "✅ Correct — as stated in Recital 6, PRIIPs serve as an 'interface' between retail investors and markets because they 'assemble' assets creating products with different exposures, characteristics, or cost structures than would be the case if assets were held directly.", "❌ PRIIPs do not replace direct market access; they provide an alternative investment vehicle.", "❌ PRIIPs are not always guaranteed against capital loss; the amount repayable is subject to fluctuations."],correct:1,slide:"Slide 14"},
{q:"Marketing communications relating to PRIIPs must be consistent with the KID and must not:",opts:["Be longer than the KID itself — as established under the relevant EU secondary legislation framework","Contradict the KID or diminish its significance — while also being clearly identifiable as marketing communications","Be distributed through digital channels without prior NCA approval — reflecting the harmonisation objective of the EU single financial market","Be sent to retail clients more than 30 days before the KID is provided — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ There is no length restriction on marketing communications relative to the KID.", "✅ Correct — marketing communications must not contradict the KID or diminish its significance; they must be clearly identifiable as marketing communications.", "❌ NCA approval for each digital marketing communication is not required.", "❌ There is no 30-day pre-provision rule for marketing communications; the KID must be provided 'in good time' before the client is bound."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs KID's synthetic risk indicator must be presented:",opts:["Using an appropriate graphical format on an increasing numerical scale — standardised by the RTS to make KIDs effectively comparable across products","As a narrative description of risks without any numerical scale — as established under the relevant EU secondary legislation framework","As a percentage of the maximum possible loss relative to the amount invested — reflecting the harmonisation objective of the EU single financial market","Only for products where the risk level exceeds a certain threshold — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the RTS requires use of appropriate graphical formats, such as the synthetic risk indicator on an increasing numerical scale, standardised to make KIDs effectively comparable across different PRIIPs.","❌ The synthetic risk indicator must use a standardised graphical format with a numerical scale, not only a narrative.","❌ A percentage of maximum possible loss is not the synthetic risk indicator format.","❌ The synthetic risk indicator is required for all PRIIPs, not only those above a certain risk threshold."],correct:0,slide:"Slide 14"}
,
{q:"The PRIIPs Regulation pays particular attention to how information is presented because:",opts:["Research shows that individuals without professional backgrounds may face challenges navigating comprehensive information, making presentation quality as important as information completeness","Regulators have determined that all retail investors are incapable of making investment decisions — a requirement introduced by the Lamfalussy Level 2 implementing measures","The EU wants to reduce the total amount of information provided to investors — reflecting the maximum harmonisation approach adopted in this EU framework","Regulators found that overly detailed disclosure increases retail investor engagement — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — the PRIIPs Regulation is informed by research showing that individuals without professional backgrounds may face challenges navigating comprehensive information; hence the particular attention to how information is presented, leading to the standardised, concise KID format.","❌ The Regulation does not deem all retail investors incapable; it acknowledges complexity challenges.","❌ The Regulation aims for essential information presented well, not reduced information.","❌ The motivation is to improve comprehension, not necessarily increase engagement."],correct:0,slide:"Slide 14"}
,
{q:"Under Article 13 of the PRIIPs Regulation, post-contract KID delivery is permitted only when which specific conditions are met?",opts:["The retail client decides on their own initiative to contact the seller using distance communication, timely delivery was not possible, and the client agreed to receive the KID after conclusion","The manufacturer requests it for operational efficiency — a requirement introduced by the Lamfalussy Level 2 implementing measures — a position that differs from the correct EU legal framework applicable in this context","The distributor is a regulated investment firm — a principle established in the foundational Regulation governing this area — a description that applies to a different EU legal act, not the one relevant to this question","The PRIIP is classified as non-complex under MiFID II — a principle established in the foundational Regulation governing this area — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — post-contract KID delivery requires: client-initiated distance contact, impossibility of timely pre-contract delivery, prior client information about the impossibility and the right to postpone, and client agreement to receive the KID post-conclusion.","❌ Manufacturer convenience is not a ground for post-contract delivery.","❌ The distributor's regulatory status does not determine post-contract delivery eligibility.","❌ Non-complexity under MiFID II is irrelevant to PRIIPs post-contract delivery."],correct:0,slide:"Slide 14"},
{q:"The KID under PRIIPs must not exceed what format limit?",opts:["Five A4 pages, including all tables and graphs","Two A4 pages, without any visual elements","Seven A4 pages, in any format the manufacturer chooses","Three A4 pages, presented to facilitate readability"],exps:["❌ Five pages exceeds the PRIIPs KID limit.","❌ Two pages is too short and visual elements (like the synthetic risk indicator) are required.","❌ Seven pages is the limit for the prospectus summary, not the PRIIPs KID.","✅ Correct — the PRIIPs KID must be a short, concise document of no more than three A4 pages, presented and structured to facilitate readability."],correct:3,slide:"Slide 14"},
{q:"The PRIIPs Regulation applies to 'packaged retail investment products'. Which of the following is expressly EXCLUDED from the PRIIPs scope?",opts:["Units of investment funds — a requirement introduced by the Lamfalussy Level 2 implementing measures","Derivatives — as confirmed by the CJEU in its consistent line of case law on this point","Life insurance where benefits are payable only in the event of death or disability","Structured deposits — a principle established in the foundational Regulation governing this area"],exps:["❌ Units of investment funds are within PRIIPs scope.","❌ Derivatives are within PRIIPs scope.","✅ Correct — Article 2 excludes life insurance products where benefits are payable only upon death or disability (with no investment/market-linked component) from the PRIIPs Regulation.","❌ Structured deposits (with conditions) may fall within PRIIPs scope."],correct:2,slide:"Slide 14"},
{q:"A PRIIPs 'manufacturer' includes which type of person?",opts:["Any person who issues the PRIIP, and also a person who makes changes to an existing PRIIP affecting its risk, return profile, or costs","Only the entity that first invented the product concept — as established under the relevant EU secondary legislation framework","Any financial institution with a licence to sell PRIIPs — reflecting the harmonisation objective of the EU single financial market","Only legal persons established in an EU Member State — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — a manufacturer is the entity issuing the PRIIP, and also any person making material changes to an existing PRIIP (changing risk/return profile or costs), potentially creating distributor-manufacturer overlap.","❌ Manufacturer status is not based on invention; it concerns control over the product.","❌ Licensing to sell characterises distributors, not manufacturers.","❌ Manufacturers need not be established in the EU; the Regulation has extraterritorial reach when products are marketed to EU retail investors."],correct:0,slide:"Slide 14"},
{q:"Product intervention powers under the PRIIPs Regulation allow EIOPA and national authorities to:",opts:["Require manufacturers to redesign PRIIPs that do not meet minimum return thresholds — a requirement introduced by the Lamfalussy Level 2 implementing measures","Temporarily prohibit or restrict the marketing, distribution, or sale of certain PRIIPs or types of financial activities","Set maximum fees for all PRIIPs sold to retail investors — reflecting the maximum harmonisation approach adopted in this EU framework","Approve or reject individual PRIIPs before they are offered to the public — a principle established in the foundational Regulation governing this area"],exps:["❌ PRIIPs product intervention is not based on return thresholds.","✅ Correct — as a measure of last resort, EIOPA and NCAs may temporarily prohibit or restrict marketing, distribution, or sale of certain PRIIPs when investor protection or financial system integrity is at risk.","❌ Fee capping is not a product intervention power under PRIIPs.","❌ PRIIPs does not require ex-ante product approval; the KID is approved by the manufacturer, not authorities."],correct:1,slide:"Slide 14"},
{q:"The Regulatory Technical Standards (RTS) for PRIIPs KIDs were initially rejected by the European Parliament and later substantially revised. What is the current instrument containing the RTS?",opts:["ESMA Guideline on PRIIPs disclosure formats — as established under the relevant EU secondary legislation framework","Commission Delegated Regulation (EU) 2017/653, with major changes from Delegated Regulation 2021/2268","A Directive requiring Member States to adopt their own KID standards — reflecting the harmonisation objective of the EU single financial market","EBA Technical Standard on retail investment product disclosure — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The PRIIPs RTS is not an ESMA guideline.","✅ Correct — the RTS are contained in Commission Delegated Regulation (EU) 2017/653, substantially amended by Delegated Regulation 2021/2268 following the Parliament's rejection of the first version.","❌ PRIIPs uses a Regulation, not a Directive — no national transposition of KID standards is needed.","❌ The PRIIPs RTS is a Commission Delegated Regulation, not an EBA Technical Standard."],correct:1,slide:"Slide 14"},
{q:"When a PRIIP offers multiple investment options, manufacturers under Chapter II of the PRIIPs RTS may choose to:",opts:["Produce only one generic KID covering all options without option-specific details — applicable to all investment firms providing services to retail clients","Refer investors to the prospectus for details on individual options — a conduct obligation enforceable by national competent authorities","Either produce separate KIDs for each underlying option or produce a single generic KID with specific technical annexes for each option","Request ESMA to approve a simplified multi-option summary — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ A single generic KID without option-specific details would be insufficient for investor decision-making.","❌ Referring to the prospectus does not satisfy the PRIIPs KID requirement; KIDs must be self-contained.","✅ Correct — for multi-option PRIIPs, manufacturers may either produce separate KIDs per option or one generic KID with technical annexes providing detailed information for each option.","❌ ESMA does not approve individual KIDs for multi-option PRIIPs."],correct:2,slide:"Slide 14"},
{q:"How does the PRIIPs Regulation interact with the Prospectus Regulation when a product falls within both scopes?",opts:["The PRIIPs Regulation entirely replaces the Prospectus Regulation for all PRIIP products — a requirement introduced by the Lamfalussy Level 2 implementing measures","PRIIPs-compliant products are automatically exempt from any Prospectus Regulation requirements — a principle established in the foundational Regulation governing this area","The Prospectus Regulation always takes precedence over the PRIIPs Regulation — reflecting the maximum harmonisation approach adopted in this EU framework","Both may apply simultaneously — manufacturers may need to prepare both a prospectus summary and a KID, with the prospectus summary modelled as much as possible on the PRIIPs KID"],exps:["❌ The PRIIPs Regulation does not replace the Prospectus Regulation; both may apply concurrently.","❌ PRIIPs compliance does not exempt products from the Prospectus Regulation.","❌ The PRIIPs Regulation and Prospectus Regulation can coexist; there is no blanket precedence.","✅ Correct — when a product falls within both regimes, manufacturers may need to prepare both a prospectus summary and a PRIIPs KID. The Prospectus Regulation explicitly states the summary should be modelled on the PRIIPs KID, and where a KID exists, the prospectus summary can rely on it."],correct:3,slide:"Slide 14"},
{q:"The PRIIPs Regulation's KID is specifically NOT required for which class of investor?",opts:["Retail investors as defined under MiFID II","Semi-professional investors with portfolio exceeding €500,000","Professional clients","Eligible counterparties under MiFID II"],exps:["❌ The KID is specifically designed for and required when marketing to retail investors.","❌ 'Semi-professional' is not a formal MiFID II category; the PRIIPs regime uses the MiFID II retail investor definition.","✅ Correct — the PRIIPs regime does not apply to professional clients; the KID obligation is triggered only when marketing to 'retail investors' as defined under MiFID II or the Insurance Distribution Directive.","❌ Eligible counterparties, like professional clients, are outside the PRIIPs KID requirement."],correct:2,slide:"Slide 14"},
{q:"Which section of the PRIIPs KID must include a warning about high product complexity?",opts:["Section 3: What are the costs?","Section 4: How long do I have to hold it?","Section 1: What is this product? — where appropriate","Section 7: How can I complain?"],exps:["❌ Section 3 covers costs; complexity warnings are not placed there.","❌ Section 4 covers holding periods; complexity warnings are not placed there.","✅ Correct — Section 1 ('What is this product?') must include, where appropriate, a warning alerting the investor to the high level of complexity of the product.","❌ Section 7 covers complaints mechanisms; complexity warnings belong in Section 1."],correct:2,slide:"Slide 14"},
{q:"Article 2 of the PRIIPs Regulation excludes which of the following products from its scope?",opts:["Structured deposits with capital protection linked to an equity index — a requirement introduced by the Lamfalussy Level 2 implementing measures","Units of investment funds investing in transferable securities — as confirmed by the CJEU in its consistent line of case law on this point","Life insurance products where the only benefit payable is upon death or disability with no investment component","Derivatives used for hedging purposes by retail investors — a principle established in the foundational Regulation governing this area"],exps:["❌ Structured deposits may fall within PRIIPs scope depending on their features.","❌ Units of investment funds are within the PRIIPs scope as they are explicitly listed as example PRIIPs.","✅ Correct — Article 2 excludes life insurance products where the only benefit payable is upon death or disability (i.e. pure protection products with no investment/market-linked component), since these do not expose investors to market fluctuations.","❌ Derivatives used by retail investors are within PRIIPs scope; the exclusion relates to non-investment insurance, not derivatives."],correct:2,slide:"Slide 14"}],
"15 — Market Abuse Regulation":[
{q:"The three pillars of the Market Abuse Regulation (MAR, 2014) are:",opts:["Disclosure, conduct regulation, and prudential rules — a requirement introduced by the Lamfalussy Level 2 implementing measures","Transparency, short selling, and shareholder rights — a principle established in the foundational Regulation governing this area","Licensing, conduct of business, and enforcement — reflecting the maximum harmonisation approach adopted in this EU framework","Prohibition of insider dealing, prohibition of market manipulation, and mandatory disclosure obligations for issuers"],exps:["❌ These are categories of regulatory tools, not the three MAR pillars.","❌ Transparency, short selling, and shareholder rights are covered by separate legislation.","❌ Licensing, conduct, and enforcement are regulatory tools.","✅ Correct — the three pillars are: (1) prohibition of insider dealing; (2) prohibition of market manipulation; (3) mandatory disclosure obligations for issuers."],correct:3,slide:"Slide 15"},
{q:"Article 7 MAR defines inside information as information that is:",opts:["Any material non-public information that any person in the company possesses — a requirement introduced by the Lamfalussy Level 2 implementing measures","Any information that causes a measurable price movement when published — reflecting the maximum harmonisation approach adopted in this EU framework","Precise, non-public, relating to one or more issuers or financial instruments, and which, if made public, would be likely to have a significant effect on prices","Confidential information labelled as such by the issuer in a written communication to the NCA — a principle established in the foundational Regulation governing this area"],exps:["❌ This description is too broad; the Article 7 definition requires all four elements.","❌ Actual measurable price movement is not required.","✅ Correct — inside information must be: precise, non-public, relating to issuers or financial instruments, and likely to have a significant effect on prices if made public.","❌ Labelling information as confidential is not part of the Article 7 definition."],correct:2,slide:"Slide 15"},
{q:"In Geltl v Daimler (C-19/11), the CJEU held that for the precision requirement:",opts:["Only final corporate decisions qualify; intermediate steps in protracted processes do not — as established under the relevant EU secondary legislation framework","Precision requires the information to be disclosed in writing to the NCA — as confirmed by the relevant CJEU case law and regulatory guidance","Information must be certain to occur before it qualifies as precise — reflecting the harmonisation objective of the EU single financial market","A 'realistic prospect' of occurrence suffices — intermediate steps may constitute inside information if they meet the statutory criteria"],exps:["❌ Intermediate steps in protracted processes can constitute inside information.","❌ Written disclosure to the NCA is not part of the precision requirement.","❌ Certainty is not required; a realistic prospect suffices.","✅ Correct — in Geltl v Daimler, a 'realistic prospect' of occurrence suffices; expected price impact doesn't influence whether information is precise."],correct:3,slide:"Slide 15"},
{q:"Article 17(1) MAR requires issuers to disclose inside information:",opts:["Once per year with annual financial statements — a requirement introduced by the Lamfalussy Level 2 implementing measures","As soon as possible after inside information directly concerns that issuer","Only upon formal written request from the NCA — reflecting the maximum harmonisation approach adopted in this EU framework","After pre-clearing the disclosure with ESMA — a principle established in the foundational Regulation governing this area"],exps:["❌ Annual disclosure would defeat the purpose of preventing insider dealing.","✅ Correct — Article 17(1) MAR requires issuers to inform the public as soon as possible of inside information which directly concerns that issuer.","❌ Issuers have a proactive obligation; no formal NCA request is required.","❌ Pre-clearing with ESMA is not required."],correct:1,slide:"Slide 15"},
{q:"Article 17(4) MAR allows delay of disclosure when which three cumulative conditions are met?",opts:["Immediate disclosure would prejudice the issuer's legitimate interests, the delay would not mislead the public, and the issuer ensures ongoing confidentiality","Information concerns a merger, the acquirer requests confidentiality, and the transaction completes within 6 months — a requirement introduced by the Lamfalussy Level 2 implementing measures","The NCA has been informed, delay is limited to 30 days, and information concerns only internal reorganisation — reflecting the maximum harmonisation approach adopted in this EU framework","The information is already known to major shareholders, trading is suspended, and a supplement will be published — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — the three cumulative conditions are: (1) immediate disclosure would prejudice legitimate interests; (2) the delay would not mislead the public; (3) the issuer ensures ongoing confidentiality.","❌ Mergers and acquisitions are not specifically the three conditions.","❌ A 30-day limit and NCA pre-notification are not the three statutory conditions.","❌ These are not the statutory conditions."],correct:0,slide:"Slide 15"},
{q:"'Market soundings' under Article 11 MAR allow selective disclosure of inside information for:",opts:["Assessing potential investor interest and conditions for possible transactions — e.g., gauging investor appetite before a capital raise — under strict procedural requirements","Complying with employee communication obligations — a requirement introduced by the Lamfalussy Level 2 implementing measures","Providing inside information to analysts for research reports — reflecting the maximum harmonisation approach adopted in this EU framework","Sharing information with major shareholders ahead of general meetings — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — market soundings allow selective disclosure to gauge investor interest and conditions for possible transactions, under strict procedural requirements.","❌ Employee communication is governed by labour law, not Article 11 MAR.","❌ Providing inside information to analysts without Article 11 procedures would be unlawful disclosure.","❌ Sharing with major shareholders without Article 11 procedures would be unlawful selective disclosure."],correct:0,slide:"Slide 15"},
{q:"The insider dealing prohibition under Article 8(1) MAR requires which two elements?",opts:["Possession of inside information AND use of that information to acquire or dispose of financial instruments to which it relates","Knowledge AND actual price impact upon trading — a requirement introduced by the Lamfalussy Level 2 implementing measures","Working at the issuer AND trading in the issuer's securities — reflecting the maximum harmonisation approach adopted in this EU framework","Senior management status AND deliberate intent to deceive the market — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — insider dealing requires: (1) possession of inside information; AND (2) use of that information by acquiring or disposing of financial instruments to which it relates.","❌ Actual price impact upon trading is not required.","❌ Working at the issuer is one way to be a primary insider but is not required.","❌ Senior management status and deliberate deceptive intent are not the two required elements."],correct:0,slide:"Slide 15"},
{q:"The ne bis in idem debate in MAR enforcement was triggered by:",opts:["MiFID II provisions on administrative and criminal sanctions — as established under the relevant EU secondary legislation framework","The Geltl v Daimler case on precision requirement — reflecting the harmonisation objective of the EU single financial market — a description that applies to a different EU legal act, not the one relevant to this question","Grande Stevens v. Italy (ECtHR, 2014): imposition of both administrative AND criminal sanctions for the same misleading-the-market conduct violated Article 4 of Protocol No. 7 ECHR","The Short Selling case on ESMA's intervention powers — as confirmed by the relevant CJEU case law and regulatory guidance — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ MiFID II sanctions provisions are related but not the trigger.","❌ Geltl v Daimler addressed the precision requirement.","✅ Correct — Grande Stevens v. Italy (ECtHR, 2014) held that imposing both administrative and criminal sanctions for the same misleading-the-market conduct violated the ne bis in idem principle.","❌ The Short Selling case addressed ESMA's powers under the Meroni doctrine."],correct:2,slide:"Slide 15"},
{q:"Safe harbours for share buy-backs (Article 5 MAR) require:",opts:["ESMA approval and limitation to 10% of issued shares — a requirement introduced by the Lamfalussy Level 2 implementing measures","No other market transactions in the preceding 90 days — a principle established in the foundational Regulation governing this area","Completion within 30 calendar days and price not exceeding 5% premium over market — reflecting the maximum harmonisation approach adopted in this EU framework","Full details disclosed before trading; trades reported and disclosed; price/volume limits respected; carried out for capital reduction, debt obligations, or employee programs"],exps:["❌ ESMA approval is not required for the buy-back safe harbour.","❌ A 90-day moratorium is not a MAR safe harbour condition.","❌ A 30-day completion and 5% premium are not the safe harbour conditions.","✅ Correct — Article 5 MAR safe harbour for buy-backs requires: full details disclosed before trading; trades reported and disclosed; price/volume limits respected; carried out for capital reduction, debt obligations, or employee programs."],correct:3,slide:"Slide 15"},
{q:"'Benchmark manipulation' was added to MAR as a prohibited form of market manipulation after:",opts:["The WorldCom and Enron accounting scandals","The flash crash of 2010","The LIBOR and EURIBOR scandals of 2012","The subprime mortgage crisis and Lehman Brothers collapse"],exps:["❌ WorldCom and Enron were accounting scandals, not benchmark manipulation.","❌ The flash crash prompted algorithmic trading rules.","✅ Correct — benchmark manipulation was added to MAR after the LIBOR and EURIBOR scandals of 2012.","❌ The subprime crisis prompted post-trade infrastructure reform (EMIR)."],correct:2,slide:"Slide 15"},
{q:"'Tippee liability' under Article 8(3) MAR establishes that:",opts:["Primary insiders are liable for all profits of all tippees down the chain — a requirement introduced by the Lamfalussy Level 2 implementing measures — a position that differs from the correct EU legal framework applicable in this context","Tippee liability applies only to professional investors with fiduciary duties — a principle established in the foundational Regulation governing this area","Only primary insiders who directly benefit financially from tipping are liable — reflecting the maximum harmonisation approach adopted in this EU framework","A person who receives a recommendation to trade is liable where they know or ought to know the recommendation is based on inside information — reflecting EU's market-based approach (not the US fiduciary-based model)"],exps:["❌ While tippers are liable, Article 8(3) specifically establishes tippee liability.","❌ Tippee liability applies regardless of fiduciary duties.","❌ Financial benefit to the tipper is the US fiduciary test; EU MAR uses a market-based approach.","✅ Correct — Article 8(3) MAR establishes tippee liability where the recipient knows or ought to know the recommendation is based on inside information; reflecting EU's market-based approach."],correct:3,slide:"Slide 15"}
,
{q:"The 'Efficient Capital Markets Hypothesis' (ECMH) underpins MAR because:",opts:["It proves all investors always act rationally — as established under the relevant EU secondary legislation framework","Its central claim that efficient markets reflect available material information in prices justifies regulatory intervention against any asymmetry in access to material information","It demonstrates that insider dealing does not affect market prices — reflecting the harmonisation objective of the EU single financial market","It provides the mathematical framework for calculating insider trading profits — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The ECMH assumes rational behaviour as a theoretical model.", "✅ Correct — the ECMH's central claim that efficient markets reflect available material information justifies MAR's intervention against information asymmetry through the insider dealing and manipulation prohibitions.", "❌ Insider dealing distorts prices precisely because inside information has value.", "❌ The ECMH is a theoretical framework, not a calculation methodology."],correct:1,slide:"Slide 15"},
{q:"'Permitted selective disclosure' under MAR must be interpreted:",opts:["Broadly to allow free flow of information for legitimate business purposes — as clarified by ESMA guidelines on prospectus disclosure requirements — a position that differs from the correct EU legal framework applicable in this context","Narrowly — disclosure must be strictly necessary for professional activity, not merely useful or convenient; if the recipient lacks a confidentiality obligation, the issuer must restore informational parity with the market","Broadly to allow analysts to receive management briefings before earnings announcements — reflecting the investor protection objective of the Prospectus Regulation","Without restriction if both parties are regulated financial entities — as clarified by ESMA guidelines on prospectus disclosure requirements — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ Permitted selective disclosure is interpreted narrowly.", "✅ Correct — disclosure must be strictly necessary for professional activity; if the recipient lacks a confidentiality obligation, the issuer must restore informational parity (simultaneous disclosure if intentional; prompt disclosure if unintentional).", "❌ Management briefings to analysts are not automatically permitted.", "❌ The status of both parties as regulated entities does not exempt them from MAR's selective disclosure rules."],correct:1,slide:"Slide 15"},
{q:"Article 8(2) MAR specifically added which previously uncovered prohibited conduct?",opts:["Cancelling or amending orders placed before the person came to possess inside information — explicitly added by MAR to close a loophole","Tipping inside information to third parties — a requirement introduced by the Lamfalussy Level 2 implementing measures","Using inside information through derivatives rather than direct share purchases — reflecting the maximum harmonisation approach adopted in this EU framework","Communicating inside information to a person who is also an insider — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — MAR explicitly added the cancellation or amendment of orders placed before possessing inside information, closing a loophole where traders would cancel pending orders upon receiving inside information.","❌ Tipping inside information was already prohibited.","❌ Using inside information through derivatives was already prohibited.","❌ Communicating inside information is addressed by the unlawful disclosure prohibition."],correct:0,slide:"Slide 15"},
{q:"'Algorithmic manipulation' as a specific form of market manipulation under Article 12(2) MAR includes:",opts:["Orders via electronic means (including HFT) that disrupt trading systems, obscure genuine orders, or create false signals about supply, demand, or price — including spoofing, layering, and quote stuffing","Any use of algorithms for trading, which is inherently manipulative — a requirement introduced by the Lamfalussy Level 2 implementing measures","Only spoofing strategies where orders are placed and immediately cancelled — reflecting the maximum harmonisation approach adopted in this EU framework","Only layering strategies where multiple orders are placed at different price levels — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — Article 12(2) MAR lists algorithmic manipulation as orders via electronic means (including HFT) that disrupt trading systems, obscure genuine orders, or create false signals.","❌ Algorithmic trading per se is not inherently manipulative; only specific manipulative techniques are prohibited.","❌ Algorithmic manipulation covers more than only spoofing.","❌ Algorithmic manipulation covers more than only layering."],correct:0,slide:"Slide 15"}
,
{q:"The Market Abuse Regulation (MAR) was adopted in 2014 alongside which other instrument?",opts:["The Market Abuse Directive II (MAD II) — the criminal sanctions directive, which requires Member States to provide criminal penalties for serious market abuse offences","The MiFID II Directive — as confirmed by the CJEU in its consistent line of case law on this point — a position that differs from the correct EU legal framework applicable in this context","The Prospectus Regulation (EU 2017/1129) — reflecting the maximum harmonisation approach adopted in this EU framework — a description that applies to a different EU legal act, not the one relevant to this question","The Short Selling Regulation (EU 236/2012) — a principle established in the foundational Regulation governing this area — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — MAR was adopted in 2014 alongside the Market Abuse Directive II (MAD II), which requires Member States to provide criminal penalties for serious market abuse offences such as insider dealing and market manipulation.","❌ MiFID II was adopted in 2014 but is a separate instrument addressing investment services and trading venues.","❌ The Prospectus Regulation was adopted in 2017, not alongside MAR.","❌ The Short Selling Regulation was adopted in 2012, not alongside MAR."],correct:0,slide:"Slide 15"},
{q:"'Dominant position abuse' as a specific form of market manipulation under Article 12(2) MAR involves:",opts:["Securing a dominant position over the supply or demand for a financial instrument to fix prices or create unfair trading conditions — also known as 'cornering' the market","A company's CEO using inside information to trade in the company's securities — a requirement introduced by the Lamfalussy Level 2 implementing measures","A firm executing transactions on multiple venues simultaneously to create the appearance of liquidity — reflecting the maximum harmonisation approach adopted in this EU framework","Spreading false rumours through social media to move prices in a desired direction — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — dominant position abuse involves securing a dominant position over supply or demand to fix prices or create unfair trading conditions, sometimes referred to as 'cornering' the market.","❌ The CEO using inside information describes insider dealing, not dominant position abuse.","❌ Executing transactions on multiple venues to create the appearance of liquidity describes 'painting the tape', another form of manipulation.","❌ Spreading false rumours describes information-based market manipulation."],correct:0,slide:"Slide 15"},
{q:"'Opening/closing manipulation' as a form of market manipulation under Article 12(2) MAR involves:",opts:["Trading at market open or close to mislead investors acting on displayed prices or underlying asset prices", "Placing large orders at opening to ensure the best execution price for the firm's own account", "Executing trades during illiquid periods to obtain better prices", "Using algorithmic strategies to exploit price differences between opening and closing auctions"],exps:["✅ Correct — opening/closing manipulation involves trading at market open or close to mislead investors acting on displayed prices or underlying asset prices (e.g., for derivatives settlement).", "❌ Seeking best execution for the firm's own account through normal trading is not manipulation.", "❌ Trading during illiquid periods for better prices is not inherently manipulative.", "❌ Exploiting price differences through algorithmic strategies is not the definition of opening/closing manipulation."],correct:0,slide:"Slide 15"},
{q:"The MAR prohibition of insider dealing under Article 8(1) covers trading 'for own account or third party account, directly or indirectly'. This means:",opts:["Any acquisition or disposal of financial instruments to which the information relates, whether acting directly or through an intermediary, agent, or any other person acting on behalf of the insider","Only direct purchases or sales of the financial instrument concerned — a requirement introduced by the Lamfalussy Level 2 implementing measures","Only transactions in the company's shares, not in derivative instruments — reflecting the maximum harmonisation approach adopted in this EU framework","Only transactions conducted on regulated markets, not OTC trades — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — the prohibition covers any acquisition or disposal of financial instruments to which the information relates, whether the insider acts directly or through an intermediary, agent, or any other person acting on behalf of the insider.","❌ The prohibition covers direct and indirect transactions, not only direct ones.","❌ The prohibition extends to all financial instruments to which the inside information relates, including derivatives.","❌ The prohibition applies regardless of venue — regulated markets, MTFs, OTFs, and OTC transactions are all covered."],correct:0,slide:"Slide 15"},
{q:"The 'wash trade' indicator of market manipulation under Annex I MAR refers to:",opts:["Washing a company's financial statements to remove evidence of poor performance — as established under the relevant EU secondary legislation framework","Transactions where the same beneficial owner is on both sides — creating the appearance of activity without genuine change in beneficial ownership","Executing a large number of small trades to avoid triggering transparency thresholds — reflecting the harmonisation objective of the EU single financial market","Using multiple accounts to obscure the origin of trading profits — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Washing financial statements describes accounting fraud, not market manipulation.", "✅ Correct — wash trades are transactions where the same beneficial owner is on both sides (or closely connected parties), creating the appearance of genuine market activity without any actual change in beneficial ownership — a fictitious device indicator.", "❌ Breaking trades into small sizes to avoid thresholds describes 'layering' or 'smurfing'; wash trades are about same-owner both-side transactions.", "❌ Obscuring trading profit origins relates to money laundering, not the wash trade indicator."],correct:1,slide:"Slide 15"}
,
{q:"Under Regulation (EU) No 596/2014 (the Market Abuse Regulation), the distinction between primary and secondary insiders implies that:",opts:["Only primary insiders are subject to the prohibition on insider dealing under MAR, while secondary insiders are entirely exempt from the market abuse regime — a requirement introduced by the Lamfalussy Level 2 implementing measures","Secondary insiders are conclusively presumed to act in good faith and can never be sanctioned for insider dealing under MAR — as confirmed by the CJEU in its consistent line of case law on this point","Primary insiders are presumed to be aware of the special nature of the information because of their close relationship with the issuer, whereas secondary insiders are subject to the prohibition only if they know or ought to know that the information qualifies as inside information","The distinction has no practical legal significance since both primary and secondary insiders face identical presumptions and identical burdens of proof — a principle established in the foundational Regulation governing this area"],exps:["❌ Secondary insiders are NOT exempt from MAR; they are subject to the insider dealing prohibition if they know or ought to know the information is inside information.", "❌ Secondary insiders are NOT conclusively presumed to act in good faith; they face liability if they know or ought to know the information qualifies as inside information.", "✅ Correct — primary insiders are presumed to be aware of the special nature of the information because of their close relationship with the issuer (membership in administrative/supervisory bodies, capital interest, employment). Secondary insiders are subject to the prohibition only if they know or ought to know that the information qualifies as inside information.", "❌ The distinction has significant practical significance: primary insiders face a presumption of knowledge; secondary insiders face a subjective knowledge test."],correct:2,slide:"Slide 15"}
,
{q:"Under Article 7 MAR, inside information does NOT require:",opts:["The information to be of a precise nature", "The information to be non-public", "An actual and measurable price movement in the relevant financial instrument after public disclosure", "The information to be likely to have a significant effect on prices if made public"],exps:["❌ Precision IS required — the information must be specific enough to enable conclusions about possible price effects.", "❌ Non-public nature IS required — information that has already been made public does not qualify as inside information.", "✅ Correct — inside information does NOT require an actual and measurable price movement after disclosure. It is sufficient that the information, if made public, would be LIKELY to have a significant effect on prices. The reasonable investor test is forward-looking; no actual price movement needs to be observed.", "❌ Likely significant effect on prices IS required — this is assessed through the reasonable investor test under Article 7(4) MAR."],correct:2,slide:"Slide 15"}
,
{q:"Are issuers obliged to draw up a list of persons who have access to inside information?",opts:["Yes, but only if expressly required by the National Competent Authority", "Yes, but only where such persons work for the issuer under a contract of employment", "Yes, where such persons perform tasks through which they have access to inside information", "No, if such issuers carry out transactions which do not exceed EUR 3,000,000 on an annual basis"],exps:["❌ The obligation is not conditional on NCA request — it applies automatically.", "❌ The obligation extends beyond employment contracts to all persons who have access to inside information, regardless of the legal basis of their relationship with the issuer.", "✅ Correct — issuers must draw up insider lists for all persons who perform tasks through which they have access to inside information, whether employees, contractors, advisors, or others.", "❌ There is no EUR 3,000,000 annual transaction threshold exempting issuers from the insider list obligation."],correct:2,slide:"Slide 15"}
,
{q:"How must issuers publish inside information under the Market Abuse Regulation (MAR)?",opts:["In a way that ensures fast and complete access, without marketing issuers' activities, making information available on the Officially Appointed Mechanism and on the website of the regulated market where issuers' securities are admitted","Only through a press release distributed to national and international press agencies — as confirmed by the CJEU in its consistent line of case law on this point","By making the information available exclusively on the issuer's own website, without any additional notification requirements — reflecting the maximum harmonisation approach adopted in this EU framework","By notifying the national competent authority first, which then publishes on behalf of the issuer — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — MAR requires disclosure in a way that ensures fast and complete access to information (e.g., through a press release), without including marketing of issuers' activities, making it available on the Officially Appointed Mechanism (OAM) and the website of the regulated market.", "❌ A press release alone is insufficient; publication on the OAM and regulated market website is also required.", "❌ Publication on the issuer's website alone is insufficient without the OAM and regulated market requirements.", "❌ The NCA does not publish on behalf of the issuer; the issuer bears the responsibility and obligation to disclose directly."],correct:0,slide:"Slide 15"}
,
{q:"Which of the following statements is true regarding inside information and disclosure?",opts:["A person who possesses inside information must always disclose it to the market immediately", "A person who possesses inside information can never disclose such information to any other person", "A person who possesses inside information can disclose such information to other persons provided that a non-disclosure agreement is signed", "None of the other options is correct"],exps:["❌ Issuers have an obligation to disclose inside information 'as soon as possible' (not immediately upon possession) and have discretion to delay under Article 17(4) conditions.", "❌ Persons may disclose inside information in the normal exercise of employment, profession, or duty (permitted selective disclosure), provided confidentiality obligations apply.", "❌ A non-disclosure agreement alone is not sufficient — permitted selective disclosure requires that the disclosure occurs in the normal exercise of employment, profession, or duties, AND that the recipient is bound by a confidentiality obligation (legal, regulatory, contractual, or professional).", "✅ Correct — none of the other options is correct: (1) there is no obligation to disclose immediately; (2) disclosure is permitted in normal exercise of employment if confidentiality applies; (3) an NDA alone is not sufficient — the legal basis for permitted disclosure is the normal exercise of employment, not merely an NDA."],correct:3,slide:"Slide 15"}
,
{q:"The Lafonta case (C-628/13) clarified the precision requirement for inside information by establishing that:",opts:["Investors need not predict direction — it is sufficient that information allows the conclusion there will be a price effect, regardless of whether upward or downward","Investors must be able to predict the exact direction of the price movement — as established under the relevant EU secondary legislation framework","Information only qualifies as 'precise' after a board resolution has been formally adopted — reflecting the harmonisation objective of the EU single financial market","The 'precision' standard only applies to criminal proceedings, not administrative sanctions — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — in Lafonta, the CJEU held that it is sufficient for information to allow the conclusion there will be some price effect; investors are not required to predict the direction (upward or downward) of the price movement.","❌ The Lafonta judgment specifically rejected the requirement to predict direction.","❌ Precision is assessed at the time of the information, not only after formal board decisions.","❌ The precision standard applies uniformly to all MAR obligations."],correct:0,slide:"Slide 15"},
{q:"The 'reasonable investor test' under Article 7(4) MAR assesses price sensitivity by asking:",opts:["Whether professional analysts would trade on the information — a requirement introduced by the Lamfalussy Level 2 implementing measures","Whether a rational market participant would likely use the information as part of the basis for investment decisions","Whether the information would cause a 10% or greater price movement — reflecting the maximum harmonisation approach adopted in this EU framework","Whether at least three competent NCAs have declared the information material — a principle established in the foundational Regulation governing this area"],exps:["❌ The test is broader than professional analysts; it concerns any reasonable investor.","✅ Correct — the reasonable investor test asks whether a rational market participant would likely use the information as part of the basis for their investment decisions, assessing qualitative significance rather than quantitative price impact.","❌ No specific price movement percentage is required by the reasonable investor test.","❌ NCA declarations are not required to establish price sensitivity."],correct:1,slide:"Slide 15"},
{q:"Under MAR, 'tippee liability' (Article 8(3)) applies when a person receives a recommendation based on inside information and:",opts:["Always, regardless of their knowledge","Only if they have formally acknowledged receiving the inside information","When they know or ought to know the recommendation is based on inside information","Only primary insiders can become tippees"],exps:["❌ Tippee liability requires knowledge or constructive knowledge; it is not automatic.","❌ Formal acknowledgment is not required; knowledge or constructive knowledge is sufficient.","✅ Correct — tippee liability under Article 8(3) applies when the recipient knows or ought to know that the recommendation or inducement is based on inside information.","❌ Tippees are by definition secondary insiders; the restriction concerns primary/secondary insider status."],correct:2,slide:"Slide 15"},
{q:"Article 13 MAR 'accepted market practices' differ from Article 5 'safe harbours' primarily because:",opts:["Safe harbours provide EU-wide automatic protection for specific practices (buy-backs, stabilisation); accepted market practices are subject to national NCA discretion and are not harmonised across the EU","Accepted market practices require ESMA approval; safe harbours require NCA approval — a requirement introduced by the Lamfalussy Level 2 implementing measures","Safe harbours are only available to professional investors; accepted market practices apply to all market participants — reflecting the maximum harmonisation approach adopted in this EU framework","Article 5 safe harbours are temporary; Article 13 practices are permanent — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — safe harbours provide EU-wide uniform automatic protection for buy-backs and stabilisation; accepted market practices are subject to national discretion, are not harmonised, and must be formally recognised by individual NCAs after ESMA notification.","❌ Safe harbours don't require NCA approval; they apply automatically when conditions are met.","❌ Both mechanisms apply across investor categories.","❌ Both mechanisms are permanent features of the MAR framework, not temporary."],correct:0,slide:"Slide 15"},
{q:"Market soundings under Article 11 MAR permit selective disclosure of inside information. Which of the following is NOT a requirement of the market soundings regime?",opts:["Assessing potential investor interest and conditions for possible transactions","Following prescribed procedures ensuring proper documentation","Prior approval from the relevant NCA before any market sounding may commence","Recipient awareness of the information's inside nature"],exps:["❌ Assessing investor interest is the stated purpose of market soundings.","❌ Documented procedures are required under the market soundings regime.","✅ Correct — market soundings do not require prior NCA approval. The regime provides a safe harbour for selective disclosure provided prescribed procedures (documentation, recipient awareness) are followed; NCAs are notified after the fact, not before.","❌ Recipient awareness requirements are part of the market soundings regime."],correct:2,slide:"Slide 15"},
{q:"Grande Stevens v Italy (ECtHR, 2014) raised concerns about dual administrative and criminal sanctions for market abuse because:",opts:["Imposing both administrative and criminal sanctions for the same conduct violated the ne bis in idem principle under ECHR Protocol 7","It found that administrative sanctions were always disproportionate in market abuse cases — as established under the relevant EU secondary legislation framework","It declared that only criminal courts may impose significant penalties for market manipulation — reflecting the harmonisation objective of the EU single financial market","It required Member States to choose between administrative-only or criminal-only enforcement — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — Grande Stevens found that imposing both punitive administrative and criminal sanctions for the same misleading market conduct violated Article 4 Protocol 7 ECHR (ne bis in idem), sparking broader debate on dual-track enforcement.","❌ The case concerned double jeopardy, not the proportionality of sanctions individually.","❌ The case concerned the accumulation of sanctions, not which court may impose them.","❌ Grande Stevens did not require an exclusive enforcement track; it addressed the double jeopardy issue."],correct:0,slide:"Slide 15"},
{q:"Benchmark manipulation was added to MAR's market manipulation prohibition following which scandal?",opts:["The Enron accounting fraud","The LIBOR and EURIBOR scandals of 2012","The 2010 flash crash caused by algorithmic trading","The Madoff Ponzi scheme"],exps:["❌ The Enron scandal concerned accounting fraud, not benchmark manipulation.","✅ Correct — benchmark manipulation (transmitting false information or providing false inputs for benchmarks) was added to MAR's prohibition following the LIBOR and EURIBOR manipulation scandals that became public in 2012.","❌ The 2010 flash crash was an algorithmic trading issue that contributed to the MiFID II algorithmic trading rules.","❌ The Madoff scheme was a Ponzi fraud, not benchmark manipulation."],correct:1,slide:"Slide 15"},
{q:"The 2026 Listing Act reform to MAR's disclosure obligation addressed what specific concern about protracted processes?",opts:["It abolished the disclosure obligation for intermediate steps in M&A transactions — as clarified by ESMA guidelines on prospectus disclosure requirements","It required simultaneous disclosure of all steps in multi-stage transactions — reflecting the investor protection objective of the Prospectus Regulation","It introduced a new rule that issuers are not required to disclose intermediate steps if they ensure ongoing confidentiality, with final events triggering disclosure to be specified by Commission delegated acts","It transferred disclosure obligations for M&A intermediates from issuers to investment banks — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ The reform did not abolish disclosure of intermediate steps; it managed when they must be disclosed.","❌ Simultaneous disclosure of all steps was the existing concern the reform addressed; premature disclosure of preliminary information may mislead rather than inform.","✅ Correct — the 2026 Listing Act amendment provides that issuers are not required to disclose intermediate steps in protracted processes if they ensure ongoing confidentiality, with the Commission to adopt delegated acts listing final events triggering disclosure.","❌ Disclosure obligations remain with issuers, not their advisers."],correct:2,slide:"Slide 15"},
{q:"Which of the following describes 'wash trading' as a manipulative behaviour under MAR?",opts:["Trading at the market open to influence opening prices — as established under the relevant EU secondary legislation framework","Transactions where the same beneficial owner is on both the buy and sell side, creating false appearance of activity without genuine ownership change","Spreading false rumours to influence prices — reflecting the harmonisation objective of the EU single financial market","Using dominant positions over supply to fix prices — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Trading at market open to influence prices is 'opening manipulation', not wash trading.","✅ Correct — wash trading (also called 'painting the tape') involves transactions where the same beneficial owner is effectively on both sides, creating a false impression of market activity without genuine change in beneficial ownership.","❌ Spreading false rumours is information-based manipulation, not wash trading.","❌ Using dominant positions to fix prices is 'abusive squeeze' behaviour."],correct:1,slide:"Slide 15"},
{q:"Primary insiders under MAR are presumed to know information's special nature because:",opts:["They have a close relationship with the issuer through board membership, capital interest, professional duties, or criminal activity involvement","They received formal training on insider dealing rules — as established under the relevant EU secondary legislation framework","They are regulated by national competent authorities — reflecting the harmonisation objective of the EU single financial market","They signed confidentiality agreements with the issuer — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — primary insiders are presumed to know information's special nature due to their close relationship with the issuer: membership in management/supervisory bodies, capital interest, professional duties, or involvement in criminal activities.","❌ Training is relevant to liability defences but is not the basis for the primary insider presumption.","❌ Regulatory status does not create primary insider classification under MAR.","❌ Confidentiality agreements are relevant to the selective disclosure analysis, not primary insider classification."],correct:0,slide:"Slide 15"},
{q:"The 27 Member States' sanctioning regimes for market abuse under MAD II can be characterised as exhibiting which pattern?",opts:["Full harmonisation: identical criminal penalties apply in all Member States — as established under the relevant EU secondary legislation framework","A patchwork of divergent systems — some emphasising criminal sanctions, others administrative priority, others cumulative application — creating inconsistent severity and regulatory arbitrage opportunities","A single administrative track: criminal sanctions have been abolished in favour of purely civil enforcement — reflecting the harmonisation objective of the EU single financial market","A unified system where ESMA directly imposes sanctions on market abuse offenders — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ MAD II sets minimum rules for criminal offences but does not fully harmonise national sanctioning regimes.","✅ Correct — across the 27 Member States there are three broad enforcement models: criminal emphasis, administrative priority, and cumulative application; this patchwork creates divergent severity, potentially jeopardises proportionality, and creates regulatory arbitrage opportunities.","❌ Criminal sanctions remain available in all Member States under MAD II; administrative sanctions complement rather than replace them.","❌ ESMA does not directly impose market abuse sanctions; NCAs retain enforcement competence."],correct:1,slide:"Slide 15"},
