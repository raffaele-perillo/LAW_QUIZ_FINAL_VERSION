{q:"An SME Growth Market is best described as:",opts:["A regulated market in which at least 50% of the market capitalisation is made up of traded shares of small and medium-sized enterprises", "An MTF in which at least 50% of the market capitalisation is made up of traded shares of small and medium-sized enterprises", "A market on which only SMEs with high growth potential are listed", "An OTF specifically designed for SME bond issuance without prospectus requirements"],exps:["❌ An SME Growth Market is an MTF, not a regulated market. RMs and MTFs are distinct under MiFID II, and SME Growth Markets can only be designated as MTFs.", "✅ Correct — an SME Growth Market is an MTF in which at least 50% of the market capitalisation is made up of traded shares of small and medium-sized enterprises (companies with average market cap below EUR 200 million over the previous three years).", "❌ SME Growth Markets do not restrict listing to only high-growth-potential SMEs; the criterion is market capitalisation below EUR 200 million.", "❌ SME Growth Markets are not OTFs; they are a specific category of MTF under MiFID II."],correct:1,slide:"Slide 07"}
,
{q:"Under MiFID II, systematic internalisers:",opts:["Shall operate within a trading venue", "In order to operate as such, must be authorised to provide investment advice", "Are required to be authorised as systematic internalisers by competent authorities", "None of the other options is correct"],exps:["❌ Systematic internalisers execute orders outside trading venues — they are bilateral dealers, not trading venues themselves.", "❌ Systematic internaliser status does not require authorisation to provide investment advice; it requires authorisation as an investment firm for dealing on own account.", "❌ There is no separate authorisation as 'systematic internaliser' — firms must notify their home NCA when they meet the quantitative thresholds, but it is not a separate authorisation.", "✅ Correct — none of the other options is correct: SIs do not operate within trading venues; they do not need separate authorisation to provide investment advice; and there is no separate SI authorisation requirement (only notification when thresholds are met)."],correct:3,slide:"Slide 07"}
,
{q:"Which of the following statements is true with respect to emission allowances?",opts:["Emission allowances are not caught by MiFID II", "Emission allowances are not caught by MAR", "Emission allowances are caught by both MAR and MiFID II", "Emission allowances are not financial instruments"],exps:["❌ Emission allowances ARE caught by MiFID II — they are listed in Section C of Annex I as financial instruments.", "❌ Emission allowances ARE caught by MAR — the Market Abuse Regulation applies to financial instruments listed under MiFID II, including emission allowances.", "✅ Correct — emission allowances are caught by both MAR and MiFID II: they are listed as financial instruments in Section C(11) of Annex I to MiFID II, and therefore subject to MAR's market abuse prohibitions and disclosure obligations.", "❌ Emission allowances ARE financial instruments under MiFID II Section C(11)."],correct:2,slide:"Slide 07"}
,
{q:"With reference to trading venues under MiFID II:",opts:["OTFs are based on discretionary rules in some circumstances, while MTFs are always based on non-discretionary rules", "MTFs are always based on non-discretionary rules, while regulated markets are based on discretionary rules in some circumstances", "OTFs are always based on non-discretionary rules, while MTFs are based on discretionary rules in some circumstances", "Regulated markets are always based on non-discretionary rules, while MTFs are based on discretionary rules in some circumstances"],exps:["✅ Correct — OTFs may exercise discretion in some circumstances (subject to conduct constraints), while MTFs must always operate under non-discretionary rules. Regulated markets must also always use non-discretionary rules.", "❌ Regulated markets must use non-discretionary rules — they are not based on discretionary rules in any circumstances.", "❌ This reverses the correct position: OTFs may use discretion; MTFs always use non-discretionary rules.", "❌ MTFs use non-discretionary rules, not discretionary rules in some circumstances."],correct:0,slide:"Slide 07"}
,
{q:"What is the main difference between a regulated market and a multilateral trading facility?",opts:["Admission to trading on a regulated market involves the application of protective measures such as the duty to publish a prospectus and the rules on major shareholding disclosure, while that is not the case with multilateral trading facilities","A multilateral trading facility is used exclusively by institutional investors, while a regulated market ensures more liquidity and is open to retail investors — a requirement applying to all entities within the relevant regulatory scope","Regulated markets can admit to trading any financial instruments, while multilateral trading facilities are only active on equity and equity-like securities — reflecting the harmonisation objective of the EU single financial market","A regulated market requires all trades to be executed through a central securities depository (CSD), while a multilateral trading facility does not — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — admission to a regulated market triggers protective measures such as the duty to publish a prospectus (Prospectus Regulation) and major shareholding disclosure obligations (Transparency Directive), while these do not automatically apply to instruments admitted to MTFs.", "❌ MTFs are not used exclusively by institutional investors, and there is no distinction in retail vs institutional access between RMs and MTFs.", "❌ Both regulated markets and MTFs can admit to trading a wide range of financial instruments, not only equities.", "❌ There is no requirement that all trades on a regulated market be executed through a CSD."],correct:0,slide:"Slide 07"}
,
{q:"Which of the following is a defining feature that distinguishes an OTF from a Regulated Market and MTF?",opts:["OTFs may operate exclusively in equity instruments, unlike RMs and MTFs which also permit non-equity instrument trading","OTFs are exclusively operated by national stock exchanges under public law mandates, unlike private-sector RMs and MTFs","The OTF operator may exercise discretion in order execution for non-equity instruments — unlike the non-discretionary RM/MTF","OTFs are subject to materially lighter transparency obligations than RMs and MTFs, reflecting their bilateral trading model"],exps:["❌ OTFs are exclusively for non-equity instruments; they cannot operate in equities.","❌ OTFs may be operated by any investment firm, not exclusively by national exchanges.","✅ Correct — the defining feature of OTFs compared to RMs and MTFs is that the operator may exercise discretion in order execution (subject to conduct constraints), whereas RMs and MTFs must apply non-discretionary rules.","❌ OTFs are subject to a hybrid regulatory burden combining venue and conduct rules, not lighter obligations."],correct:2,slide:"Slide 07"},
{q:"How many trading venues were registered in the EU at the end of 2022, according to the slides?",opts:["50 trading venues, reflecting continued consolidation after MiFID II reduced fragmentation by harmonising venue rules","188 trading venues, the same number as systematic internalisers — reflecting the symmetry of the post-MiFID II landscape","310 trading venues were registered in the Union at the end of 2022, alongside 188 systematic internalisers","450 trading venues, demonstrating that MiFID II significantly increased fragmentation by creating new venue categories"],exps:["❌ 50 significantly understates the fragmented EU trading venue landscape.","❌ 188 was the number of systematic internalisers, not trading venues.","✅ Correct — 310 trading venues were registered in the Union at the end of 2022, alongside 188 systematic internalisers.","❌ 450 overstates the number of registered venues."],correct:2,slide:"Slide 07"},
{q:"The Share Trading Obligation under MiFIR requires that:",opts:["All shares must be traded exclusively on regulated markets, completely prohibiting execution on MTFs or SIs","Shares listed on EU regulated markets must simultaneously be listed on an SME Growth Market to qualify for EU passporting","Investment firms may execute share transactions internally as long as they are reported to a trade repository within one day","Investment firms must execute transactions in shares admitted to EU regulated markets on RMs, MTFs, SIs, or equivalent venues"],exps:["❌ The STO also permits execution on MTFs and SIs, not just regulated markets.","❌ The STO concerns execution venues, not listing requirements.","❌ Internal crossing outside authorised venues is precisely what the STO prohibits.","✅ Correct — under the Share Trading Obligation, transactions in shares admitted to EU regulated markets must be executed on RMs, MTFs, SIs, or equivalent third-country venues; internal crossing outside authorised venues is prohibited."],correct:3,slide:"Slide 07"},
{q:"The Derivatives Trading Obligation under MiFIR applies to which category of derivatives?",opts:["All OTC derivatives without exception, requiring execution on regulated venues regardless of standardisation or liquidity","Only physically settled commodity derivatives traded by non-financial counterparties exceeding clearing thresholds","Derivatives subject to the EMIR clearing mandate assessed by ESMA as sufficiently liquid for venue-based execution","All exchange-traded derivatives on EU regulated markets, irrespective of whether they are also traded in OTC markets"],exps:["❌ Not all OTC derivatives are subject to the DTO — only specific liquid standardised classes.","❌ Commodity derivatives are not necessarily subject to the DTO.","✅ Correct — the DTO applies to derivatives subject to the EMIR clearing mandate that ESMA has assessed as sufficiently liquid, requiring execution on RMs, MTFs, OTFs, or equivalent third-country venues.","❌ Exchange-traded derivatives are already traded on venues; the DTO targets OTC derivatives requiring venue-channelling."],correct:2,slide:"Slide 07"},
{q:"Under MiFID II, a Smart Order Router (SOR) is treated differently from an Automated Order Router (AOR) in that:",opts:["SORs require no regulatory notification to the NCA while AORs always require full MiFID II authorisation as AT","A SOR that adjusts price, size, or timing to optimise execution qualifies as algorithmic trading; an AOR merely selecting the venue does not","Both SORs and AORs are classified as HFT tools requiring circuit breakers, kill-switches, and annual self-certification","AORs are specifically prohibited under MiFID II due to their market-disruption potential; only SORs remain permissible"],exps:["❌ Both SORs and AORs may trigger regulatory requirements depending on their function.","✅ Correct — a SOR optimising execution by adjusting price, size, or timing qualifies as algorithmic trading; an AOR that only selects the venue while leaving all other parameters unchanged does not amount to algorithmic trading.","❌ The distinction concerns whether the system constitutes algorithmic trading, not HFT classification.","❌ AORs are not prohibited; they simply do not constitute algorithmic trading."],correct:1,slide:"Slide 07"},
{q:"HFT under Article 4(1)(40) MiFID II is distinguished by three objective elements. Which of the following is NOT one of them?",opts:["Low-latency infrastructure using co-location or proximity services to access trading venues with minimal network delay","Fully automated initiation, generation, routing, or execution of orders without human intervention in individual decisions","High intraday message rate in individual financial instruments or across all instruments on a trading venue","Minimum transaction value exceeding €1 million per trade to distinguish HFT from ordinary algorithmic trading activity"],exps:["❌ Low-latency infrastructure is one of the three defining elements of HFT.","❌ Fully automated execution is one of the three defining elements.","❌ High message rate is one of the three defining elements.","✅ Correct — HFT is not defined by minimum transaction value. The three elements are: low-latency infrastructure, fully automated execution, and high intraday message rate."],correct:3,slide:"Slide 07"},
{q:"For registration as an SME Growth Market under MiFID II, what minimum percentage of issuers on the market must be SMEs?",opts:["25% of issuers must be SMEs to qualify, reflecting a balanced approach between specialisation and market breadth","33% of issuers must be SMEs, ensuring that one-third of the market serves small and medium-sized enterprise financing","At least 50% of issuers must be SMEs — companies with average market capitalisation below €200 million over three years","75% of issuers must be SMEs, creating a near-exclusive venue dedicated to small and medium-sized enterprise listings"],exps:["❌ 25% is too low; the threshold ensures the market genuinely caters to SMEs.","❌ 33% is not the correct threshold.","✅ Correct — at least 50% of issuers on an SME Growth Market must be SMEs (companies with average market capitalisation below €200 million over the previous three years).","❌ 75% is too high; the actual requirement is 50%."],correct:2,slide:"Slide 07"},
{q:"Under MiFIR post-trade transparency rules, within what time frame must equity instrument transactions be published?",opts:["Immediately upon execution with no permissible delay — all equity trades must be published in real-time without exception","Within one minute of execution — as close to real-time as technically possible for equity instrument transactions","Within fifteen minutes of execution, matching the standard applicable to non-equity instruments under MiFIR transparency","Within one business day of execution, ensuring that market participants have overnight time to assess market impact"],exps:["❌ 'As close to real time as technically possible' means within one minute for equities, not instantaneous.","✅ Correct — MiFIR requires post-trade publication within one minute of execution for equity instruments. For non-equities, the standard is fifteen minutes (moving to five minutes).","❌ Fifteen minutes applies to non-equity instruments, not equities.","❌ One business day would undermine real-time price transparency; it is not the standard."],correct:1,slide:"Slide 07"},
{q:"An Approved Reporting Mechanism (ARM) under MiFIR has which specific function?",opts:["Publishing real-time post-trade transparency data from all trading venues to the market-wide consolidated tape provider","Aggregating post-trade data from multiple approved publication arrangements into a single consolidated European feed","Transmitting investment firms' transaction reports to competent authorities on their behalf with accuracy and timeliness","Managing clearing, settlement, and custody of financial instruments on behalf of regulated markets and MTFs"],exps:["❌ Publishing real-time post-trade data describes an APA (Approved Publication Arrangement).","❌ Aggregating data into a single consolidated feed describes a CTP (Consolidated Tape Provider).","✅ Correct — an ARM acts as the licensed conduit through which investment firms transmit transaction reports to competent authorities, ensuring timely submission, data accuracy, and confidentiality.","❌ Settlement management is a CSD function, not an ARM function."],correct:2,slide:"Slide 07"},
{q:"The quantitative HFT threshold under Delegated Regulation 2017/565 is set at:",opts:["2 messages per second in one instrument or 4 messages per second across all instruments on a given venue","10 messages per second across all instruments on a venue — a firm exceeding this is automatically classified as an HFT firm","1,000 orders per day in any single financial instrument traded on a regulated market or an MTF simultaneously","500 order cancellations per trading session in any instrument — reflecting the 'high message rate' element of HFT definition"],exps:["✅ Correct — the HFT threshold is 2 messages per second in a single instrument or 4 messages per second across all instruments on a given venue. Exceeding this triggers automatic HFT classification.","❌ 10 messages per second is above the actual threshold.","❌ 1,000 orders per day does not reflect the actual quantitative threshold.","❌ 500 cancellations is not the basis for HFT classification."],correct:0,slide:"Slide 07"},
{q:"The core regulatory objectives of EU trading venue regulation under MiFID II are:",opts:["Maximising trading volume and minimising transaction costs for institutional investors accessing pan-European liquidity","Ensuring national stock exchanges maintain dominant market positions to support price formation and national champions","Investor protection and market integrity through uniform transparency rules, and single market integration via level playing field","Restricting algorithmic and high-frequency trading to protect human market makers from unfair technological competition"],exps:["❌ While efficiency matters, the stated objectives concern investor protection and market integration, not solely volume or cost.","❌ MiFID II promotes competition among venues, including new entrants — not national exchange dominance.","✅ Correct — trading venue regulation pursues two core objectives: (1) investor protection and market integrity through uniform transparency and order handling rules; and (2) single market integration through a level playing field that prevents rule shopping between venues.","❌ MiFID II regulates algorithmic trading but does not restrict it to protect human market makers."],correct:2,slide:"Slide 07"},
{q:"Which of the following transactions is explicitly listed as potentially exempt from the MiFIR trading obligations?",opts:["All transactions between two financial counterparties above clearing thresholds for standardised equity instruments","Intraday crossings, primary market issuance transactions, and certain bilateral OTC trades meeting specific criteria","All derivatives transactions between EU and non-EU counterparties where one party is not subject to MiFIR obligations","All transactions on SME Growth Markets regardless of the instrument type or the counterparty's supervisory classification"],exps:["❌ FC-to-FC transactions are generally subject to the trading obligations, not exempt.","✅ Correct — MiFIR trading obligation exemptions include: intraday crossings within firms or crossing networks (under conditions), primary market issuance transactions, certain OTC trades, third-country venue trades (subject to equivalence), and non-standardised bilateral negotiated trades.","❌ The third-country exemption is specific and subject to equivalence decisions, not a blanket exemption for all cross-border trades.","❌ SME Growth Market transactions are not categorically exempt from trading obligations."],correct:1,slide:"Slide 07"},
{q:"Strategies such as spoofing, layering, and quote stuffing in algorithmic trading fall under the prohibitions of which regulation?",opts:["MiFID II's algorithmic trading rules exclusively, which classify these as impermissible order entry strategies under Article 48","The Prospectus Regulation's disclosure requirements, which require AT strategies to be disclosed in offering documents","EMIR's clearing and reporting obligations for OTC derivatives, which treat AT manipulation as a post-trade risk issue","The Market Abuse Regulation's prohibition on market manipulation under Article 12 and Annex I behavioural indicators"],exps:["❌ MiFID II governs the operational requirements for algorithmic trading; the manipulation prohibition itself comes from MAR.","❌ The Prospectus Regulation governs disclosure for securities offerings, not trading manipulation.","❌ EMIR governs derivatives clearing and post-trade infrastructure, not market manipulation.","✅ Correct — spoofing, layering, and quote stuffing are forms of market manipulation prohibited under MAR's Article 12, which forms part of MiFID II's multi-layer safety net for algorithmic trading alongside firm-level risk management and venue safeguards."],correct:3,slide:"Slide 07"},
{q:"Which statement best describes the current state of EU trading venue regulation following MiFID II?",opts:["Since MiFID II, no major disorderly episode attributable to AT/HFT gaps has occurred, but sophisticated algorithms require monitoring","A major disorderly episode has occurred due to regulatory gaps in the HFT regime, prompting an emergency MiFID review","The multi-layer safety net has proven ineffective in preventing manipulation, leading to proposals to ban HFT entirely","MiFID II has made EU venues uncompetitive compared to US and Asian equivalents, causing significant trading venue relocation"],exps:["✅ Correct — since MiFID II, no major disorderly episode has been attributed to AT/HFT regulatory gaps; however, the increasing sophistication of self-learning algorithms will inevitably raise new issues requiring updates to existing rules.","❌ No major disorderly episode attributable to AT/HFT regulatory gaps has occurred since MiFID II entered into force.","❌ No proposals to ban HFT have been made; the regime focuses on disciplining it, not banning it.","❌ Empirical studies suggest European venues have retained their competitive appeal under MiFID II."],correct:0,slide:"Slide 07"}],
"08 — Collective Investment Undertakings":[
{q:"Collective investment undertakings (CIUs) are best described as:",opts:["Investment firms that trade on their own account in financial markets — applicable to all investment firms providing services to retail clients","Special purpose vehicles used for securitisation transactions — reflecting the investor protection objective of MiFID II's framework","Insurance products with an investment component exposed to market fluctuations — a conduct obligation enforceable by national competent authorities","Financial vehicles that pool capital from multiple investors to allocate it collectively, with gains and losses shared proportionally"],exps:["❌ Investment firms trading on own account are not CIUs.","❌ SPVs are used in securitisation.","❌ Insurance products with investment components describe IBIPs/PRIIPs.","✅ Correct — CIUs pool capital from multiple investors to allocate it collectively, with gains and losses shared proportionally."],correct:3,slide:"Slide 08"},
{q:"The three-pillar structure of a CIU consists of:",opts:["Management company, regulator, and investors — as established under the relevant EU secondary legislation framework","The undertaking (pool of assets), the management company, and the depositary","Custodian bank, administrator, and distribution agent — reflecting the harmonisation objective of the EU single financial market","UCITS, AIFM, and national competent authority — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The regulator is not one of the three structural pillars.","✅ Correct — the three pillars are: the undertaking (pool of assets), the management company (investment management), and the depositary (custodian and oversight).","❌ Distribution agent is not one of the three structural pillars.","❌ UCITS and AIFM refer to regulatory regimes, not structural pillars."],correct:1,slide:"Slide 08"},
{q:"The UCITS Directive is best described as:",opts:["Manager-focused regulation covering alternative funds including hedge funds, private equity, and real estate — a requirement introduced by the Lamfalussy Level 2 implementing measures","Product-focused regulation establishing a harmonised regime for open-ended retail funds — one of the EU's most successful financial law regimes, latest iteration being UCITS V (2014/91/EU)","A Regulation directly applicable without national implementing measures — reflecting the maximum harmonisation approach adopted in this EU framework","A Directive covering all types of investment funds without restriction on eligible assets — a principle established in the foundational Regulation governing this area"],exps:["❌ Manager-focused regulation covering alternative funds describes the AIFMD.","✅ Correct — UCITS is product-focused, establishing a harmonised regime for open-ended retail funds.","❌ UCITS is a Directive, not a Regulation.","❌ UCITS is specifically restricted to open-ended retail funds with strict eligibility criteria."],correct:1,slide:"Slide 08"},
{q:"A UCITS must offer unitholders the right to have units repurchased or redeemed at minimum:",opts:["Once per year — as specified in the relevant delegated acts and ESMA guidelines","Once per month — applicable to all collective investment undertakings in the EU","At least twice monthly (usually daily in practice)","At least twice per week — reflecting the product-focused approach of this EU regulatory framework"],exps:["❌ Once per year does not meet the UCITS minimum.","❌ Once per month does not meet the UCITS minimum.","✅ Correct — UCITS must be open-ended, offering unit redemption at least twice monthly.","❌ Twice per week is not the minimum; twice monthly is the legal requirement."],correct:2,slide:"Slide 08"},
{q:"The UCITS 5/10/40 rule means:",opts:["Maximum 5% in derivatives, 10% in illiquid assets, and 40% in a single country — as specified in the relevant delegated acts and ESMA guidelines","Maximum 5% in securities from one issuer (raisable to 10%), but aggregate exposure above 5% cannot exceed 40% of total assets","Minimum 5% cash, maximum 10% in emerging markets, 40% in government bonds — a requirement that applies from the date of authorisation onward","5% equity, 10% bonds, 40% money market instruments minimum — reflecting the product-focused approach of this EU regulatory framework"],exps:["❌ This is not what the 5/10/40 rule means.","✅ Correct — maximum 5% in securities from one issuer (raisable to 10%), but aggregate exposure above 5% cannot exceed 40% of total assets.","❌ The 5/10/40 rule concerns issuer concentration, not asset classes or geography.","❌ The 5/10/40 rule concerns issuer concentration limits."],correct:1,slide:"Slide 08"},
{q:"Under the feeder-master UCITS model, a feeder UCITS may invest at least what percentage in a single master UCITS?",opts:["55%","70%","85%","100%"],exps:["❌ 55% is the ELTIF minimum in eligible investment assets.","❌ 70% is the EuSEF and EuVECA requirement.","✅ Correct — a feeder UCITS may invest at least 85% of its assets in a single master UCITS.","❌ 100% is not required; 85% minimum is specified."],correct:2,slide:"Slide 08"},
{q:"Under UCITS V, the depositary's liability for loss of financial instruments held in custody is:",opts:["Strict liability, save for events beyond reasonable control","No liability unless gross negligence is proven","Proportionate liability based on the percentage of assets affected","Limited to €1 million per incident regardless of actual loss"],exps:["✅ Correct — under UCITS V, depositaries are strictly liable for loss of financial instruments held in custody, save for events beyond reasonable control.","❌ Strict liability is the UCITS V standard, not gross negligence.","❌ Proportionate liability is not the UCITS V standard.","❌ There is no €1 million cap; strict liability applies."],correct:0,slide:"Slide 08"},
{q:"The AIFMD (Directive 2011/61/EU) defines an AIF as:",opts:["Any fund that invests in alternative assets such as commodities, real estate, or infrastructure — a requirement introduced by the Lamfalussy Level 2 implementing measures","Residually — essentially any collective investment undertaking that is not a UCITS, ensuring broad coverage across hedge funds, private equity, real estate, and infrastructure","Any fund marketed exclusively to professional investors and eligible counterparties — reflecting the maximum harmonisation approach adopted in this EU framework","Any fund that uses leverage or short-selling strategies — a principle established in the foundational Regulation governing this area"],exps:["❌ The AIFMD definition is based on what the fund is not (not a UCITS), not on asset types.","✅ Correct — an AIF is defined residually as essentially any CIU that is not a UCITS, ensuring broad coverage.","❌ The definition is not based on investor type.","❌ Leverage and short-selling are not part of the AIF definition."],correct:1,slide:"Slide 08"},
{q:"ESMA's Guidelines (ESMA 2013/600) on CIU identification require three essential characteristics. Which are they?",opts:["Regulated status, professional management, and EU domicile — as established under the relevant EU secondary legislation framework","Listed securities, minimum €10 million in assets, and UCITS-eligible instruments — as confirmed by the relevant CJEU case law and regulatory guidance","Open-ended structure, diversified portfolio, and independent depositary — reflecting the harmonisation objective of the EU single financial market","Financial purpose (not general commercial/industrial), pooled capital, and no day-to-day control by unitholders or shareholders"],exps:["❌ Regulated status and EU domicile are not the three ESMA characteristics.","❌ Listed securities and minimum asset size are not the three ESMA characteristics.","❌ Open-ended structure and diversified portfolio are UCITS characteristics, not universal CIU characteristics.","✅ Correct — ESMA's Guidelines identify: financial purpose (not a general commercial or industrial purpose), pooled capital, and no day-to-day control by unitholders/shareholders over the undertaking's assets."],correct:3,slide:"Slide 08"},
{q:"Under AIFMD II (2024), the new loan origination regime sets leverage caps at:",opts:["175% for open-ended AIFs and 300% for closed-ended funds","100% for open-ended AIFs and 200% for closed-ended funds","250% for open-ended AIFs and 500% for closed-ended funds","No specific leverage limit for loan origination funds"],exps:["✅ Correct — AIFMD II sets leverage caps of 175% for open-ended AIFs and 300% for closed-ended funds for loan origination activities.","❌ 100%/200% are not the AIFMD II leverage caps.","❌ 250%/500% are not the AIFMD II leverage caps.","❌ AIFMD II explicitly sets leverage caps."],correct:0,slide:"Slide 08"},
{q:"AIFMD II requires all open-ended AIFs to:",opts:["Select at least two liquidity management tools from a prescribed list — ESMA may require activation/deactivation to safeguard investor protection or financial stability","Convert to closed-ended structures to better manage redemption risk — as specified in the relevant delegated acts and ESMA guidelines","Obtain credit ratings from EU-registered credit rating agencies — a requirement that applies from the date of authorisation onward","Appoint ESMA as their depositary — reflecting the product-focused approach of this EU regulatory framework"],exps:["✅ Correct — AIFMD II requires all open-ended AIFs to select at least two liquidity management tools from a prescribed list.","❌ AIFMD II requires liquidity management tools, not conversion to closed-ended structures.","❌ Credit ratings from CRAs are not required by AIFMD II.","❌ ESMA cannot serve as depositary."],correct:0,slide:"Slide 08"},
{q:"The EuSEF label requires at least what percentage of capital in qualifying social investments?",opts:["51%","60%","70%","85%"],exps:["❌ 51% is not the EuSEF threshold.","❌ 60% is not the EuSEF threshold.","✅ Correct — EuSEF requires at least 70% of aggregate capital and uncalled commitments to be invested in qualifying social enterprises.","❌ 85% is the feeder UCITS threshold, not EuSEF."],correct:2,slide:"Slide 08"},
{q:"The ELTIF 2.0 (Regulation EU 2023/606, applicable from January 2024) introduced which important change for retail investors?",opts:["Removed retail investor access entirely — a requirement introduced by the Lamfalussy Level 2 implementing measures","Reduced the minimum investment in eligible assets from 70% to 55% — a principle established in the foundational Regulation governing this area","Required all ELTIFs to adopt a fully closed-ended structure — reflecting the maximum harmonisation approach adopted in this EU framework","Allowed limited early redemptions under specified conditions ('semi-closed' structure) — previously no early redemptions were permitted"],exps:["❌ ELTIF 2.0 maintained and enhanced retail access.","❌ The minimum investment in eligible assets is 55% as set by ELTIF 2.0 — a specified threshold, not a reduction.","❌ ELTIF 2.0 moved from fully closed to semi-closed.","✅ Correct — ELTIF 2.0 introduced limited early redemptions under specified conditions, creating a 'semi-closed' structure."],correct:3,slide:"Slide 08"},
{q:"Money Market Funds (MMFs) are best described as:",opts:["Hedge funds investing in government bonds to generate absolute returns — as specified in the relevant delegated acts and ESMA guidelines","Collective investment undertakings investing in short-term financial assets, aiming to provide returns aligned with money market rates or preserve investment value","Long-term infrastructure funds accessible to retail investors — a requirement that applies from the date of authorisation onward","Structured products using leverage to amplify returns on money market instruments — reflecting the product-focused approach of this EU regulatory framework"],exps:["❌ Hedge funds and absolute returns do not describe MMFs.","✅ Correct — MMFs invest in short-term financial assets, aiming to provide returns aligned with money market rates and/or preserve investment value.","❌ Long-term infrastructure funds describe ELTIFs.","❌ MMFs do not use leverage to amplify returns; they are conservative vehicles."],correct:1,slide:"Slide 08"},
{q:"MMF sponsor support is prohibited because:",opts:["Sponsor support creates moral hazard and undermines fund resilience based on own financial resources","EU law prohibits any third-party guarantees for investment vehicles — as established under the relevant EU secondary legislation framework","Only registered deposit guarantee schemes can provide support to MMFs — reflecting the harmonisation objective of the EU single financial market","Sponsor support would violate UCITS diversification requirements — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — MMFs cannot receive direct or indirect assistance from third parties aimed at guaranteeing liquidity or stabilizing NAV; this reduces moral hazard and ensures resilience based on own resources.","❌ EU law does not generally prohibit third-party guarantees for all investment vehicles.","❌ There is no requirement that only deposit guarantee schemes can provide MMF support.","❌ MMF prohibitions stem from the MMF Regulation, not UCITS diversification rules."],correct:0,slide:"Slide 08"},
{q:"The AIFMD full-scope passport system provides AIFMs with which two passports?",opts:["An issuance passport and a marketing passport — as specified in the relevant delegated acts and ESMA guidelines","A management passport (cross-border management of EU AIFs) and a marketing passport (distribution to professional investors across the Union)","A retail passport and a professional investor passport — a requirement that applies from the date of authorisation onward","A domestic passport and a third-country passport — reflecting the product-focused approach of this EU regulatory framework"],exps:["❌ An 'issuance passport' is not part of the AIFMD system.","✅ Correct — full-scope AIFMs have two passports: management (cross-border management of EU AIFs) and marketing (distribution to professional investors across the Union).","❌ The AIFMD does not have separate retail and professional investor passports.","❌ Domestic and third-country passports are not the AIFMD distinction."],correct:1,slide:"Slide 08"},
{q:"Holding companies are excluded from AIFMD scope because:",opts:["They are already regulated under the Prospectus Regulation — applicable to all collective investment undertakings in the EU — a position that differs from the correct EU legal framework applicable in this context","Their main purpose is generally not financial investment characterised by a defined investment policy aimed at generating pooled returns — they acquire stakes in subsidiaries for strategic business purposes","They are too small to pose systemic risk — reflecting the product-focused approach of this EU regulatory framework — a description that applies to a different EU legal act, not the one relevant to this question","All holding companies are classified as AIFMs by default — as specified in the relevant delegated acts and ESMA guidelines — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ Holding companies are not excluded because of Prospectus Regulation regulation.","✅ Correct — holding companies are excluded because their main purpose is generally not financial investment with a defined investment policy; they acquire stakes in subsidiaries to carry out a business strategy.","❌ Size is not the reason for the exclusion.","❌ Holding companies are explicitly excluded from AIFMD, not included as AIFMs."],correct:1,slide:"Slide 08"},
{q:"The pre-marketing regime under CBFD establishes which important rule?",opts:["Subscriptions within 18 months of pre-marketing start are deemed to result from marketing, requiring full notification procedures","Pre-marketing can only be conducted in one Member State at a time — as established under the relevant EU secondary legislation framework","Pre-marketing is limited to professional investors with at least €500,000 minimum commitment — reflecting the harmonisation objective of the EU single financial market","No draft documents of any kind may be shared during pre-marketing — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — subscriptions within 18 months of pre-marketing start are deemed to result from marketing, requiring full notification procedures.","❌ Pre-marketing can be conducted in multiple Member States simultaneously.","❌ There is no €500,000 minimum commitment for pre-marketing.","❌ Draft prospectuses may be circulated if clearly marked as incomplete and not constituting an offer."],correct:0,slide:"Slide 08"},
{q:"The Money Market Funds Regulation overlays which existing frameworks?",opts:["It replaces UCITS and AIFMD for money market funds — a requirement introduced by the Lamfalussy Level 2 implementing measures","It applies only to public debt CNAV MMFs and not to other MMF types — a principle established in the foundational Regulation governing this area","It is a standalone framework replacing all other EU fund regulation for MMFs — reflecting the maximum harmonisation approach adopted in this EU framework","It overlays UCITS/AIFMD requirements, providing additional rules specific to MMF risk profiles — including portfolio composition, maturity, liquidity, and stress testing"],exps:["❌ The MMF Regulation overlays, not replaces, UCITS and AIFMD.","❌ The MMF Regulation applies to all three MMF types (VNAV, Public Debt CNAV, and LVNAV).","❌ The MMF Regulation is a supplement to, not replacement of, existing frameworks.","✅ Correct — the MMF Regulation overlays UCITS/AIFMD requirements with additional rules for portfolio composition, maturity, liquidity, and stress testing to prevent systemic risk."],correct:3,slide:"Slide 08"}
,
{q:"The AIFMD's 'defined investment policy' — the most critical CIU classification element — must be:",opts:["Set in the fund's name and website description — applicable to all investment firms providing services to retail clients","Published in the Official Journal of the EU — applicable to all investment firms providing services to retail clients","Approved by the national competent authority before investors can commit — a conduct obligation enforceable by national competent authorities","Established when the investor's commitment becomes binding, stable over time, legally binding and enforceable — determined by investment techniques and objectives, not just asset type"],exps:["❌ The fund name and website description are insufficient.","❌ Publication in the Official Journal is not required.","❌ NCA approval of the investment policy is not required to satisfy this element.","✅ Correct — the defined investment policy must be: (a) established when the investor's commitment becomes binding; (b) stable over time; (c) legally binding and enforceable. It is determined by investment techniques and objectives, not merely asset type."],correct:3,slide:"Slide 08"},
{q:"Eligible UCITS depositaries are limited to:",opts:["National central banks, credit institutions, or investment firms meeting specific organisational and prudential criteria","Any regulated financial institution established in any jurisdiction — as specified in the relevant delegated acts and ESMA guidelines","Only the central bank of the Member State where the UCITS is domiciled — a requirement that applies from the date of authorisation onward","Any entity holding ISO 27001 certification for asset safekeeping — reflecting the product-focused approach of this EU regulatory framework"],exps:["✅ Correct — eligible UCITS depositaries are: national central banks, credit institutions, or investment firms meeting specific organisational and prudential criteria.","❌ UCITS depositaries must be from a specified list of eligible entities.","❌ Any national central bank may act, not only the one in the UCITS home Member State.","❌ ISO certification is not a UCITS depositary requirement."],correct:0,slide:"Slide 08"},
{q:"The EuVECA qualifying portfolio undertaking must:",opts:["Not be an AIF, have fewer than 500 employees, be an SME with average market cap under €200M, and NOT be listed at the time of first investment","Be listed on a regulated market with market cap below €200M at the time of investment — as established under the relevant EU secondary legislation framework","Be registered in a Member State with a favourable tax regime for venture capital — reflecting the harmonisation objective of the EU single financial market","Have received at least one round of institutional funding before EuVECA investment — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — a qualifying EuVECA portfolio undertaking must: not be an AIF; have fewer than 500 employees; be an SME with average market cap under €200M; and not be listed at time of first investment.","❌ A qualifying portfolio undertaking must NOT be listed at the time of first investment.","❌ Tax regime is not a qualifying criterion.","❌ Prior institutional funding is not a qualifying criterion."],correct:0,slide:"Slide 08"},
{q:"Under the AIFMD, delegation of portfolio and risk management may only be to:",opts:["Any entity chosen by the AIFM regardless of supervision status — as specified in the relevant delegated acts and ESMA guidelines — a position that differs from the correct EU legal framework applicable in this context","Any entity approved by the NCA of the AIFM — as specified in the relevant delegated acts and ESMA guidelines — an interpretation that was considered but rejected by the EU legislator during the drafting process","The UCITS management company affiliated with the AIFM group — a requirement that applies from the date of authorisation onward — a description that applies to a different EU legal act, not the one relevant to this question","Authorised and supervised entities, or third-country delegates where cooperation agreements exist — the AIFM retains full responsibility and must continuously monitor delegate performance"],exps:["❌ Delegation is restricted to authorised and supervised entities or qualifying third-country delegates.","❌ NCA approval alone is not sufficient; the delegate must be authorised and supervised.","❌ An affiliated UCITS management company is not automatically a qualifying delegate.","✅ Correct — portfolio and risk management may only be delegated to authorised and supervised entities, or third-country delegates where cooperation agreements exist; the AIFM retains full responsibility and must continuously monitor."],correct:3,slide:"Slide 08"},
{q:"The ELTIF minimum investment in eligible investment assets is:",opts:["70% of capital — applicable to all investment firms providing services to retail clients","100% of capital — reflecting the investor protection objective of MiFID II's framework","85% of capital — a conduct obligation enforceable by national competent authorities","55% of capital within a defined period (maximum 5 years or half the ELTIF's lifetime)"],exps:["❌ 70% is the EuSEF and EuVECA minimum qualifying investment threshold.","❌ 100% is not the ELTIF requirement.","❌ 85% is the feeder UCITS in master UCITS threshold.","✅ Correct — ELTIFs must invest at least 55% of capital in eligible investment assets within a defined period."],correct:3,slide:"Slide 08"},
{q:"MMF investor concentration monitoring requires MMF managers to:",opts:["Limit any single investor to no more than 10% of fund total assets — as established under the relevant EU secondary legislation framework","Publish the identity of all investors holding more than 1% of fund assets — as confirmed by the relevant CJEU case law and regulatory guidance","Obtain NCA approval before accepting any single investor representing more than 5% of the fund — reflecting the harmonisation objective of the EU single financial market","Adopt procedures for monitoring investor concentration and redemption behaviour — including data on investor type, holdings, inflows/outflows, and patterns in cash needs or risk aversion"],exps:["❌ A 10% per-investor cap is not the mechanism; monitoring and procedures are required.","❌ Publishing the identity of investors is not required.","❌ NCA approval is not required before accepting large investors.","✅ Correct — MMF managers must adopt procedures for monitoring investor concentration and redemption behaviour, including data on investor type, holdings, inflows/outflows, and patterns in cash needs or risk aversion."],correct:3,slide:"Slide 08"}
,
{q:"What differentiates the investment made by a fund subscriber from that made by a client who benefits from individual portfolio management services?",opts:["The amount of yield received, which is always higher in individual portfolio management", "Fund subscribers cannot exert any influence over the management of the fund's assets, while clients of individual portfolio managers can", "The higher fees in the case of funds compared with individual portfolio management", "Fund subscribers always receive guaranteed capital protection, while individual portfolio management clients do not"],exps:["❌ Individual portfolio management does not always generate higher yields than fund investments; performance depends on strategy and market conditions.", "✅ Correct — the key distinction is that fund subscribers (as part of a collective pool) have no day-to-day control or influence over the management of the fund's assets, while clients of individual portfolio management services have a bilateral relationship with the manager who acts on their behalf with discretionary authority over their individual portfolio.", "❌ Fee structures vary; it is not generally true that fund fees are always higher than individual portfolio management fees.", "❌ Neither fund subscriptions nor individual portfolio management guarantee capital protection; both involve investment risk."],correct:1,slide:"Slide 08"}
,
{q:"Under the UCITS Directive, Money Market Funds (MMFs) are best described as:",opts:["Funds which invest only in other currencies", "A kind of investment vehicle that primarily invests in listed companies", "Collective investment undertakings which operate as short-term cash management tools", "Investment funds that guarantee capital protection and a minimum rate of return"],exps:["❌ MMFs do not invest in currencies as such; they invest in short-term, highly liquid financial assets.", "❌ MMFs do not primarily invest in listed companies; that describes equity funds.", "✅ Correct — Money Market Funds (MMFs) are collective investment undertakings which operate as short-term cash management tools, investing in short-term financial assets aiming to provide returns aligned with money market rates and/or preserve investment value.", "❌ MMFs do not guarantee capital protection or a minimum rate of return — in fact, the MMF Regulation prohibits sponsor support that would guarantee NAV stability."],correct:2,slide:"Slide 08"}
,
{q:"Under the UCITS Directive, the 5/10/40 rule provides that:",opts:["A UCITS must hold at least 5% of its assets in cash, may invest up to 10% in derivative instruments, and must allocate at least 40% of its portfolio to sovereign debt — a requirement introduced by the Lamfalussy Level 2 implementing measures","A UCITS may invest a maximum of 5% in equity instruments, 10% in money market instruments, and 40% in units of other UCITS — reflecting the maximum harmonisation approach adopted in this EU framework","A UCITS may not invest more than 5% of its assets in securities issued by the same issuer — although this limit may be raised to 10% — provided that the aggregate exposure to issuers above the 5% threshold does not exceed 40% of total assets","A UCITS must invest at least 5% in SMEs, maintain at most 10% in illiquid assets, and limit derivatives exposure to 40% of NAV — a principle established in the foundational Regulation governing this area"],exps:["❌ This misrepresents the 5/10/40 rule; it is an issuer concentration rule, not an asset class allocation requirement.","❌ The 5/10/40 rule concerns issuer concentration limits, not asset class percentages (equity vs money market vs other UCITS).","✅ Correct — the 5/10/40 rule means: maximum 5% of UCITS assets in securities from a single issuer (raisable to 10%); but aggregate exposure above the 5% threshold cannot exceed 40% of total assets. This prevents excessive concentration in a small number of issuers.","❌ The 5/10/40 rule is not about SME investment, illiquid assets, or derivatives limits."],correct:2,slide:"Slide 08"}
,
{q:"In the UCITS Directive, the depositary bank:",opts:["Ensures that the management company complies with the investment strategy it declared in its prospectus", "Enables subscribers to deposit their assets so that the management company can manage those portfolios", "Ensures that the value of the fund units is calculated in accordance with the law and the fund rules", "Drafts periodic reports on the fund's performance"],exps:["❌ While the depositary exercises oversight over management company compliance, its primary specific function regarding valuation is described in option 3.", "❌ The depositary holds the fund's assets in custody — it does not hold subscriber assets for individual portfolio management.", "✅ Correct — under the UCITS Directive, the depositary ensures that the value of fund units is calculated in accordance with the law and the fund rules, acting as custodian and exercising oversight over management company compliance.", "❌ Drafting periodic reports on fund performance is the management company's responsibility, not the depositary's."],correct:2,slide:"Slide 08"}
,
{q:"Which statement correctly describes the differences between AIFs and UCITS regarding their structure?",opts:["AIFs are necessarily open-ended, while UCITS can be either open-ended or closed-ended — as specified in the relevant delegated acts and ESMA guidelines — a position that differs from the correct EU legal framework applicable in this context","UCITS funds are necessarily open-ended, while AIFs can be either open-ended or closed-ended. Only UCITS — as opposed to AIFs — are subject to prudential requirements to maintain a stable NAV and sufficient liquidity","UCITS funds are necessarily open-ended, while AIFs are necessarily closed-ended — a requirement that applies from the date of authorisation onward — a description that applies to a different EU legal act, not the one relevant to this question","Both AIFs and UCITS must be open-ended to ensure investor liquidity — reflecting the product-focused approach of this EU regulatory framework — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ This reverses the correct description — UCITS must be open-ended; AIFs may be either.", "✅ Correct — UCITS are necessarily open-ended funds (with mandatory redemption at least twice monthly); AIFs can be either open-ended or closed-ended. Only for UCITS is the principle of risk-spreading mandatory.", "❌ AIFs are not necessarily closed-ended; many hedge funds operate as open-ended AIFs.", "❌ Only UCITS must be open-ended; AIFs may be closed-ended."],correct:1,slide:"Slide 08"}
,
{q:"Under the AIFMD, what is the legal definition of an AIF?",opts:["Any collective investment undertaking that is not a UCITS, regardless of legal structure, investment strategy, or geography","Any investment fund investing in equity securities listed on regulated markets and managed by a registered AIFM","A fund that raises capital exclusively from the general public and invests exclusively in transferable securities","Only closed-ended funds investing in real assets, infrastructure, or private equity under the AIFMD regulatory framework"],exps:["✅ Correct — an AIF is defined residually as any collective investment undertaking that does not require UCITS Directive authorisation. This negative definition ensures broad coverage across hedge funds, private equity, real estate, and infrastructure.","❌ AIFs are defined residually — any non-UCITS collective investment undertaking, not limited to listed equities.","❌ The requirement to raise from the 'general public' and invest in 'transferable securities' describes UCITS, not AIFs.","❌ Closed-ended real assets funds are one type of AIF, but the definition is far broader."],correct:0,slide:"Slide 08"},
{q:"The UCITS 5/10/40 diversification rule means that:",opts:["A UCITS must invest at least 40% in sovereign bonds, at least 10% in money market instruments, and at most 5% in equities","A UCITS must hold at least 5 investments, allocate across 10 different asset classes, and invest in companies from 40 countries","A UCITS may not invest more than 5% of assets in one issuer (extendable to 10%), with aggregate >5% exposures capped at 40%","A UCITS may invest maximum 40% in equities, 10% in alternative assets, and 5% in financial derivatives instruments"],exps:["❌ The 5/10/40 rule concerns concentration limits per issuer, not asset class allocation.","❌ The rule concerns per-issuer concentration limits, not the number of investments or geographic spread.","✅ Correct — the 5/10/40 rule limits concentration: maximum 5% in securities from one issuer (can be raised to 10%), but aggregate exposure above 5% to single issuers cannot exceed 40% of total assets.","❌ The rule is a concentration limit per issuer, not an asset class allocation rule."],correct:2,slide:"Slide 08"},
{q:"What is the minimum frequency with which a UCITS must offer unitholders the right to have units repurchased or redeemed?",opts:["At least annually, reflecting the long-term nature of regulated investment funds and their underlying portfolio liquidity","At least quarterly, providing investors with regular exit opportunities while allowing the fund to manage liquidity prudently","At least twice monthly, reflecting the open-ended nature of UCITS and their obligation to maintain sufficient portfolio liquidity","At any time on demand, since UCITS must provide immediate redemption to retail investors upon request without conditions"],exps:["❌ Annual redemption is too infrequent for a UCITS open-ended structure.","❌ Quarterly is less frequent than the required standard.","✅ Correct — UCITS must offer redemptions at least twice monthly (usually daily in practice), reflecting their open-ended nature and liquidity obligations.","❌ Immediate redemption at any time is not required; the minimum standard is twice monthly."],correct:2,slide:"Slide 08"},
{q:"Under AIFMD II (2024), the leverage cap for open-ended loan origination AIFs is:",opts:["100% of net asset value — the same cap applicable to retail ELTIFs investing in eligible long-term loan assets","175% of net asset value for open-ended loan origination AIFs, with 300% permitted for closed-ended structures","300% of net asset value — the cap applicable regardless of whether the loan origination AIF is open or closed-ended","500% of net asset value, reflecting the higher leverage typically used in leveraged loan and CLO fund structures"],exps:["❌ 100% is too low; it applies to retail ELTIFs for borrowing limits.","✅ Correct — AIFMD II sets a 175% leverage cap for open-ended loan origination AIFs and a higher 300% cap for closed-ended loan origination AIFs.","❌ 300% is the cap for closed-ended loan origination AIFs, not open-ended.","❌ 500% is not a leverage cap found in AIFMD II."],correct:1,slide:"Slide 08"},
{q:"EuVECA funds must invest at least what percentage of their aggregate capital commitments in qualifying portfolio undertakings?",opts:["50% of aggregate capital and uncalled commitments in qualifying portfolio undertakings meeting EuVECA eligibility criteria","60% of aggregate capital and uncalled commitments in qualifying SME portfolio undertakings with fewer than 500 employees","70% of aggregate capital and uncalled commitments in qualifying portfolio undertakings under the EuVECA Regulation","85% of aggregate capital and uncalled commitments — the same threshold as the UCITS master-feeder fund requirement"],exps:["❌ 50% is too low for the EuVECA qualifying investment threshold.","❌ 60% is not the correct threshold.","✅ Correct — EuVECA funds must invest at least 70% of aggregate capital and uncalled commitments in qualifying portfolio undertakings (equity, quasi-equity, loans, etc. in eligible SMEs).","❌ 85% is the master-feeder threshold for UCITS feeder funds, not the EuVECA requirement."],correct:2,slide:"Slide 08"},
{q:"ELTIF 2.0 (Regulation (EU) 2023/606) modified the original ELTIF structure primarily by:",opts:["Allowing limited early redemptions under specified conditions, creating a 'semi-closed' structure attractive to retail investors","Removing retail investor access entirely and restricting ELTIFs exclusively to professional and institutional investors","Abolishing the minimum 55% qualifying asset threshold, allowing ELTIFs to invest freely in any liquid or illiquid assets","Reducing the EU-wide marketing passport to domestic market only, requiring separate authorisation in each Member State"],exps:["✅ Correct — a key ELTIF 2.0 innovation was allowing limited early redemptions under specified conditions, creating a semi-closed structure that makes ELTIFs more attractive to retail investors.","❌ ELTIF 2.0 maintained and enhanced retail investor access — it did not restrict it.","❌ ELTIF 2.0 retained the 55% qualifying asset requirement.","❌ ELTIF 2.0 maintained the EU-wide marketing passport."],correct:0,slide:"Slide 08"},
{q:"Which EU fund label requires portfolio undertakings to be NOT listed on a regulated market and to have achieving measurable positive social impact as their primary objective?",opts:["EuVECA — a fund label focused on venture capital investment in innovative SMEs with high growth potential","ELTIF — a fund structure channelling long-term retail savings into infrastructure and real economy productive assets","EuSEF — a fund label for which portfolio companies must be unlisted and have measurable positive social impact as primary objective","MMF — a money market fund investing in short-term liquid instruments to preserve capital and provide daily liquidity"],exps:["❌ EuVECA focuses on venture capital and innovation in SMEs, not primarily on social impact.","❌ ELTIFs focus on long-term infrastructure and real economy assets, not specifically social enterprises.","✅ Correct — EuSEF (European Social Entrepreneurship Funds) requires qualifying portfolio undertakings to not be listed on regulated markets or MTFs and to have achieving measurable positive social impact embedded as their primary objective.","❌ MMFs (Money Market Funds) invest in short-term financial assets, not social enterprises."],correct:2,slide:"Slide 08"},
{q:"The prohibition on sponsor support in Money Market Fund regulation means:",opts:["MMFs may not receive direct or indirect financial assistance from third parties aimed at guaranteeing liquidity or NAV","MMF managers may not invest more than 10% of the fund in instruments issued by their affiliated parent company","Sponsors of MMFs may not market or distribute fund units to retail investors without separate MiFID II authorisation","MMFs may not invest more than 10% of assets in instruments from a single sponsor group across all affiliated entities"],exps:["✅ Correct — the sponsor support prohibition prevents any direct or indirect financial assistance (including cash injections or unit purchases) from sponsors aimed at guaranteeing MMF liquidity or stabilising NAV, reducing moral hazard.","❌ Issuer concentration limits address the single-issuer rule, not sponsor support.","❌ The prohibition concerns financial support, not marketing restrictions.","❌ Single-issuer limits and sponsor support are separate provisions."],correct:0,slide:"Slide 08"},
{q:"Under the AIFMD, the 'defined investment policy' requirement for AIFs is the most critical definitional element because:",opts:["It requires AIFs to publish their strategy as a regulated market prospectus before raising capital from any investors","It requires prior ESMA approval of the investment strategy, ensuring consistency with EU market stability objectives","It limits AIFs to a single specified asset class or geographic focus area, preventing style drift after fundraising closes","It must be established when investors commit, be stable over time, and be legally binding — distinguishing AIFs from companies"],exps:["❌ AIFs do not require a regulated market prospectus for their strategy.","❌ Prior ESMA approval is not required for AIFM investment strategies.","❌ A defined investment policy does not limit asset class or geography — it describes the predetermined strategy, which can be diverse.","✅ Correct — the defined investment policy is the most critical element: it must be established when investors commit, remain stable over time, and be legally binding and enforceable, distinguishing AIFs from corporate entities with general commercial purposes."],correct:3,slide:"Slide 08"},
{q:"The pre-marketing regime under the CBFD framework requires that within what time frame must an AIFM notify its home authority after commencing pre-marketing?",opts:["Immediately before commencing any pre-marketing activity — prior notification is required before investor contact begins","Within 5 business days of commencing pre-marketing — a short window ensuring rapid supervisory oversight of market activity","Within 2 weeks (14 days) of commencing pre-marketing — identifying Member States, periods, strategies, and AIFs involved","Within 1 month of commencing pre-marketing — a sufficient window given the volume of information to be assembled"],exps:["❌ Pre-notification before commencing is not required; notification is after the fact.","❌ 5 business days is not the correct deadline.","✅ Correct — within 2 weeks (14 days) of commencing pre-marketing, the AIFM must send a letter to its home competent authority identifying the Member States involved, relevant periods, strategies presented, and AIFs involved.","❌ One month is too long; the 2-week notification requirement enables timely supervisory oversight."],correct:2,slide:"Slide 08"}],
"09 — Prudential Regulation":[
{q:"The IFD/IFR framework consists of which two instruments?",opts:["Regulation (EU) 2019/2033 (IFR) and Directive 2019/2034 (IFD)","Directive 2019/2033 (IFD) and Regulation 2019/2034 (IFR)","CRR and CRD IV, adapted for investment firms","MiFID II and MiFIR, supplemented by prudential provisions"],exps:["✅ Correct — the framework consists of Regulation (EU) 2019/2033 (IFR) and Directive 2019/2034 (IFD).","❌ This reverses the Regulation/Directive designations.","❌ CRR and CRD IV were the previous ill-fitting framework for investment firms.","❌ MiFID II and MiFIR are conduct rules, not the IFD/IFR prudential framework."],correct:0,slide:"Slide 09"},
{q:"The IFD/IFR framework replaced which previous regime for investment firms?",opts:["MiFID II/MiFIR conduct rules — as set out in the relevant ESMA guidelines and technical standards — a position that differs from the correct EU legal framework applicable in this context","The CRR/CRD IV prudential regime designed for credit institutions — ill-suited for most investment firm activities as it addressed banking risks like credit risk and deposit withdrawal liquidity","The UCITS Directive for UCITS management companies — reflecting the investor protection objective of MiFID II's framework — a description that applies to a different EU legal act, not the one relevant to this question","The AIFMD for alternative investment fund managers — applicable to all investment firms providing services to retail clients — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ MiFID II/MiFIR are conduct rules that continue to apply alongside IFD/IFR.","✅ Correct — investment firms were previously subject to the CRR/CRD IV regime designed for credit institutions, which was ill-suited as it addressed banking risks like credit risk and deposit withdrawal liquidity.","❌ The UCITS Directive remains the framework for UCITS management companies.","❌ The AIFMD remains the framework for AIFMs."],correct:1,slide:"Slide 09"},
{q:"Class 1 investment firms under the IFD/IFR framework are:",opts:["Firms authorised to hold client assets, subject to the new IFR/IFD regime — applicable to all investment firms providing services to retail clients","Small non-interconnected firms with the lightest prudential regime — as set out in the relevant ESMA guidelines and technical standards","Large entities (assets ≥€30 billion) engaged in high-risk activities like proprietary trading or underwriting — must seek authorisation as credit institutions and follow the CRR/CRD regime","Medium-sized firms subject to K-factor requirements — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Firms holding client assets subject to the new IFR/IFD describes Class 2.","❌ Small non-interconnected firms with the lightest regime describes Class 3.","✅ Correct — Class 1 firms are large entities (assets ≥€30 billion) engaged in high-risk activities like proprietary trading or underwriting; they must seek credit institution authorisation.","❌ Medium-sized firms subject to K-factors describes Class 2."],correct:2,slide:"Slide 09"},
{q:"Class 2 investment firms are best described as:",opts:["Firms authorised to hold client assets that exceed thresholds like €1.2B AuM or €30M annual turnover, subject to the new IFR/IFD regime including K-factor requirements","Class 1 firms that have voluntarily chosen the IFD/IFR regime — applicable to all investment firms providing services to retail clients","Small non-interconnected firms below Class 2 thresholds with a lighter prudential regime — a conduct obligation enforceable by national competent authorities","Firms engaged exclusively in investment advice with no client asset-holding — reflecting the investor protection objective of MiFID II's framework"],exps:["✅ Correct — Class 2 firms are authorised to hold client assets and exceed specific thresholds (€1.2B AuM, €30M turnover); they are subject to the new IFR/IFD regime including K-factor requirements.","❌ Class 1 firms must follow CRR/CRD; they cannot simply choose IFD/IFR.","❌ Firms below Class 2 thresholds describe Class 3.","❌ Firms providing only investment advice that don't hold client assets would fall into Class 3."],correct:0,slide:"Slide 09"},
{q:"The minimum initial capital for firms engaged in proprietary trading, underwriting, or guaranteed placement services is:",opts:["€75,000","€150,000","€750,000","€1,000,000"],exps:["❌ €75,000 is the minimum for basic services (order reception, execution, portfolio management, and advice without holding client assets).","❌ €150,000 is the minimum for MTF/OTF operators.","✅ Correct — €750,000 is required for high-risk activities: proprietary trading, underwriting, or guaranteed placement services.","❌ €1,000,000 is not the regulatory threshold set by IFR."],correct:2,slide:"Slide 09"},
{q:"Class 2 investment firms must maintain own funds equal to the greatest of three requirements. Which are they?",opts:["Fixed overhead requirement, permanent minimum capital, and K-factor requirement (risk-based)","Base capital requirement, tier 1 capital requirement, and leverage ratio requirement","Initial capital requirement, solvency capital requirement, and minimum capital guarantee","Pillar 1 capital, Pillar 2 guidance, and capital conservation buffer"],exps:["✅ Correct — Class 2 firms must hold own funds equal to the greatest of: fixed overhead requirement, permanent minimum capital, and K-factor requirement.","❌ These are banking/insurance capital concepts, not IFD/IFR for Class 2 firms.","❌ Solvency capital requirement applies to insurance undertakings (Solvency II), not investment firms.","❌ Pillar 1/2 and capital conservation buffers are banking concepts under CRR/CRD."],correct:0,slide:"Slide 09"},
{q:"The K-factor methodology for Class 2 investment firms measures which risk categories?",opts:["Credit risk, market risk, and operational risk (as in Basel framework) — applicable to all investment firms providing services to retail clients","Liquidity risk, interest rate risk, and reputational risk — reflecting the investor protection objective of MiFID II's framework","Counterparty risk, settlement risk, and concentration risk — a conduct obligation enforceable by national competent authorities","Customer risk (client money and instruments), market risk (trading exposure), and business risk (operational risks from business model)"],exps:["❌ The Basel framework risk categories are banking-focused; K-factors are designed specifically for investment firms.","❌ Liquidity, interest rate, and reputational risk are not the three K-factor categories.","❌ Counterparty, settlement, and concentration risk are related but not the three K-factor categories.","✅ Correct — K-factors measure: customer risk (AuM, client orders handled), market risk (trading positions), and business risk (fixed costs, revenue volatility)."],correct:3,slide:"Slide 09"},
{q:"Tier 1 capital must represent at least what percentage of total capital requirements for Class 2 and 3 investment firms?",opts:["25%","33%","56%","75%"],exps:["❌ 25% is the fixed overhead buffer requirement, not the Tier 1 minimum.","❌ 33% is not the regulatory minimum for Tier 1 capital for investment firms.","✅ Correct — Tier 1 capital must represent at least 56% of total capital requirements for Class 2 and 3 investment firms.","❌ 75% is not the regulatory minimum cited."],correct:2,slide:"Slide 09"},
{q:"Article 43 IFR requires investment firms to hold liquid assets equivalent to at least:",opts:["One-third of their general expense requirement","10% of their annual fixed overheads","50% of their minimum initial capital","One-quarter of their previous year's fixed overheads"],exps:["✅ Correct — Article 43 IFR requires most investment firms to hold liquid assets equivalent to at least one-third of their general expense requirement.","❌ 10% of annual fixed overheads is not the IFR liquidity requirement.","❌ 50% of minimum initial capital is not the IFR liquidity requirement.","❌ One-quarter of previous year's fixed overheads describes part of the capital requirement, not the liquidity requirement."],correct:0,slide:"Slide 09"},
{q:"The concentration risk limit for Class 2 investment firms per client or group of connected clients is:",opts:["10% of own funds","20% of own funds","25% of own funds","50% of own funds"],exps:["❌ 10% is below the IFR concentration limit.","❌ 20% is not the concentration limit set by IFR.","✅ Correct — the concentration risk limit is 25% of own funds per client or group of connected clients.","❌ 50% exceeds the IFR concentration limit."],correct:2,slide:"Slide 09"},
{q:"UCITS management company capital requirements follow which structure?",opts:["Base capital of €125,000; 0.02% of AuM above €250 million; combined cap of €10 million","Base capital of €730,000; 0.04% of AuM above €500 million; combined cap of €50 million","Base capital of €50,000; 0.01% of AuM above €100 million; combined cap of €5 million","Base capital of €300,000; 0.05% of AuM above €1 billion; combined cap of €20 million"],exps:["✅ Correct — UCITS management companies: base capital €125,000; additional 0.02% of AuM above €250 million threshold; combined initial capital plus additional amount cannot exceed €10 million.","❌ These figures do not match the UCITS Directive capital requirements.","❌ These figures do not match the UCITS Directive capital requirements.","❌ These figures do not match the UCITS Directive capital requirements."],correct:0,slide:"Slide 09"},
{q:"AIFMs must have initial capital of at least €125,000. When portfolios exceed €250 million, which additional requirement applies?",opts:["Own funds must double to €250,000 — applicable to all collective investment undertakings in the EU","Additional own funds of 0.02% of the excess amount are required, capped at €10 million; at all times own funds must equal at least one quarter of the preceding year's fixed overheads","Additional own funds of 0.1% of the total portfolio value are required — a requirement that applies from the date of authorisation onward","The AIFM must convert to a credit institution and apply for banking authorisation — reflecting the product-focused approach of this EU regulatory framework"],exps:["❌ Doubling to €250,000 is not the AIFMD requirement.","✅ Correct — when portfolios exceed €250 million, additional own funds of 0.02% of the excess are required, capped at €10 million; own funds must always equal at least one quarter of the preceding year's fixed overheads.","❌ 0.1% of total portfolio value is not the AIFMD requirement.","❌ AIFMs are not required to become credit institutions."],correct:1,slide:"Slide 09"},
{q:"The key difference between prudential requirements for investment firms versus fund managers is:",opts:["Investment firms require no capital; fund managers require substantial capital buffers — applicable to all investment firms providing services to retail clients","Investment firms face risk-based K-factors and substantial own funds for loss absorption; fund managers have lower baseline capital requirements reflecting asset segregation and diversification as primary protections","Investment firms and fund managers have identical capital requirements under CRR — a conduct obligation enforceable by national competent authorities — a description that applies to a different EU legal act, not the one relevant to this question","Fund managers require more capital than investment firms because they manage systemic risk — reflecting the investor protection objective of MiFID II's framework"],exps:["❌ Investment firms do require capital; the IFD/IFR framework sets out their requirements.","✅ Correct — investment firms face risk-based K-factors and direct position risks requiring substantial own funds; fund managers have lower baseline capital requirements as risks are concentrated in segregated asset pools protected by diversification.","❌ The IFD/IFR framework specifically replaced the ill-fitting CRR framework for investment firms.","❌ Fund managers generally have lower, not higher, capital requirements than investment firms."],correct:1,slide:"Slide 09"},
{q:"Class 3 investment firms must hold own funds equal to the higher of:",opts:["General minimum capital requirement and 25% of previous year's fixed overheads (cost requirement)","Fixed overhead requirement and K-factor requirement — applicable to all investment firms providing services to retail clients","Base capital and tier 1 capital requirement — a conduct obligation enforceable by national competent authorities","Initial capital requirement and solvency capital requirement — reflecting the investor protection objective of MiFID II's framework"],exps:["✅ Correct — Class 3 firms must hold own funds equal to the higher of: the general minimum capital requirement and the cost requirement (25% of previous year's fixed overheads).","❌ K-factor requirement applies to Class 2 firms, not Class 3.","❌ Base capital and tier 1 capital are banking concepts under CRR/CRD.","❌ Solvency capital requirement applies to insurance undertakings."],correct:0,slide:"Slide 09"},
{q:"Professional indemnity insurance for AIFMs covers risks of:",opts:["Professional negligence — AIFMs must hold PI insurance OR provide additional own funds equal to 0.01% of portfolio value","Market losses suffered by fund investors — as specified in the relevant delegated acts and ESMA guidelines","Depositary losses from custodial failures — a requirement that applies from the date of authorisation onward","Systemic risk arising from interconnected fund exposures — reflecting the product-focused approach of this EU regulatory framework"],exps:["✅ Correct — AIFMs must hold professional indemnity insurance (or equivalent additional own funds equal to 0.01% of portfolio value) to cover risks of professional negligence.","❌ Market losses are borne by fund investors as part of normal investment risk.","❌ Depositary losses from custodial failures are the depositary's responsibility under the AIFMD strict liability regime.","❌ Systemic risk is not what PI insurance covers."],correct:0,slide:"Slide 09"},
{q:"Member States may allow UCITS management companies to replace up to what percentage of the additional capital (above €250M AuM) with a guarantee?",opts:["25% of the additional capital (the 0.02% of AUM above €250M) may be replaced by a qualifying bank guarantee","33% of the additional capital requirement may be replaced by a guarantee from an insurer or credit institution","50% of the additional capital requirement may be replaced by a guarantee from a qualifying credit institution or insurer","75% of the additional capital requirement may be replaced by a qualifying guarantee, reducing the cash capital burden"],exps:["❌ 25% is not the percentage that may be replaced by a guarantee.","❌ 33% is not the percentage that may be replaced by a guarantee.","✅ Correct — Member States may allow up to 50% of the additional capital to be replaced by a guarantee from a qualifying credit institution or insurance company.","❌ 75% is not the percentage that may be replaced by a guarantee."],correct:2,slide:"Slide 09"}
,
