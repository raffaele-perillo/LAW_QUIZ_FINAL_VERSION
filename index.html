{q:"Class 1-minus investment firms under IFD/IFR are firms with:",opts:["Consolidated business ≥€30 billion — must seek credit institution authorisation — applicable to all investment firms providing services to retail clients","Consolidated business ≥€15 billion or group assets ≥€15 billion — some CRD IV/CRR rules apply, but no credit institution authorisation required","AuM ≥€1.2 billion or annual turnover ≥€30M — subject to full IFR/IFD regime including K-factors — a conduct obligation enforceable by national competent authorities","No client assets, no proprietary trading, below Class 2 thresholds — subject to a lighter prudential regime"],exps:["❌ Firms with assets ≥€30 billion are Class 1.", "✅ Correct — Class 1-minus firms have consolidated business ≥€15 billion or group assets ≥€15 billion; some CRD IV/CRR rules apply but no credit institution authorisation is required.", "❌ AuM ≥€1.2 billion describes Class 2 thresholds.", "❌ No client assets, no proprietary trading, below Class 2 thresholds describes Class 3."],correct:1,slide:"Slide 09"},
{q:"Class 3 investment firms are defined as firms that:",opts:["Are authorised to hold client assets and exceed Class 2 thresholds — applicable to all investment firms providing services to retail clients","Provide only investment advice to retail clients without holding client assets — reflecting the investor protection objective of MiFID II's framework","Have assets under management exceeding €30 billion — a conduct obligation enforceable by national competent authorities","Cannot hold client assets, don't engage in proprietary trading, and fall below Class 2 thresholds — subject to a lighter prudential regime"],exps:["❌ Holding client assets and exceeding thresholds describes Class 2.","❌ Providing only investment advice is one example of a Class 3 firm but the definition is broader.","❌ Assets exceeding €30 billion would make a firm Class 1.","✅ Correct — Class 3 firms cannot hold client assets, don't engage in proprietary trading, and fall below Class 2 thresholds; they benefit from a lighter prudential regime."],correct:3,slide:"Slide 09"},
{q:"The SREP (Supervisory Review and Evaluation Process) under IFD applies:",opts:["To all investment firms regardless of class — as established under the relevant EU secondary legislation framework","Mandatorily to Class 2 investment firms; competent authorities may require it for Class 3 firms","Only to Class 1 and 1-minus firms subject to CRR/CRD — reflecting the harmonisation objective of the EU single financial market","Only to firms with AuM above €10 billion — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The SREP is not mandatory for all investment firm classes.", "✅ Correct — the SREP with defined powers and instruments is mandatory for Class 2 investment firms; competent authorities may require it for Class 3 firms.", "❌ Class 1 and 1-minus firms are subject to the banking SREP under CRR/CRD.", "❌ The €10 billion AuM threshold is not the SREP applicability criterion."],correct:1,slide:"Slide 09"},
{q:"Article 43 IFR explicitly excludes from 'liquid assets' the following:",opts:["Government bonds with remaining maturity over 1 year — a requirement introduced by the Lamfalussy Level 2 implementing measures","Client money and financial instruments, even if held in the investment firm's name","Fixed assets and real estate owned by the investment firm — reflecting the maximum harmonisation approach adopted in this EU framework","Receivables from other group entities — a principle established in the foundational Regulation governing this area"],exps:["❌ Government bonds with short maturity would generally qualify as liquid assets.", "✅ Correct — Article 43 IFR explicitly excludes client money and financial instruments from the liquid assets calculation, even if held in the investment firm's name.", "❌ Fixed assets and real estate are not the specific exclusion cited.", "❌ Group receivables are not the specific exclusion cited."],correct:1,slide:"Slide 09"},
{q:"Consolidated supervision under IFD applies to:",opts:["Only Class 1 investment firms that must seek credit institution authorisation — as established under the relevant EU secondary legislation framework","Holding companies and financial subsidiaries within investment firm groups, ensuring group-level capital adequacy and risk management","Only cross-border groups with subsidiaries in more than three Member States — reflecting the harmonisation objective of the EU single financial market","All investment firms regardless of whether they belong to a group — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Consolidated supervision applies beyond Class 1 firms.", "✅ Correct — consolidated supervision applies to holding companies and financial subsidiaries, ensuring group-level capital adequacy and risk management.", "❌ Consolidated supervision applies to all qualifying investment firm groups.", "❌ Consolidated supervision applies to groups, not all individual investment firms."],correct:1,slide:"Slide 09"}
,
{q:"Which of the following plans is NOT adopted in the 'preparation' phase of crisis management under the BRRD?",opts:["Recovery plans", "Liquidation plans", "Resolution plans", "All the above answers are correct"],exps:["❌ Recovery plans ARE part of the preparation phase — institutions must prepare recovery plans identifying measures to restore financial position.", "❌ Liquidation plans ARE part of the preparation phase — authorities plan for orderly wind-down if resolution is not in the public interest.", "✅ Correct — resolution plans are NOT part of the preparation phase; they are adopted by resolution authorities as part of the resolution planning phase, distinct from the preparation measures adopted by institutions themselves.", "❌ Not all of the above are correct — resolution plans are not adopted in the preparation phase."],correct:2,slide:"Slide 09"}
,
{q:"The purpose of the Net Stable Funding Ratio (NSFR) is to:",opts:["Ensure that banks are able to appropriately handle cash outflows","Ensure that banks hold sufficient liquid assets to survive a 30-day stress scenario","Limit the maximum leverage that banks can take on their balance sheet","Ensure that credit institutions maintain a minimum level of own funds"],exps:["✅ Correct — the NSFR requires banks to maintain a stable funding profile over a one-year horizon, ensuring they are able to appropriately handle cash outflows. It complements the short-term LCR.","❌ Surviving a 30-day stress scenario describes the purpose of the Liquidity Coverage Ratio (LCR), not the NSFR.","❌ Limiting maximum leverage describes the Leverage Ratio under CRR, not the NSFR.","❌ Minimum own funds requirements are set by CRR capital requirements (CET1, Tier 1, Total Capital), not the NSFR."],correct:0,slide:"Slide 09"}
,
{q:"Which of the following issues fall in the scope of the Solvency II Directive?",opts:["Governance requirements, with the exclusion of fit and proper requirements", "Only fit and proper requirements", "Governance requirements as well as fit and proper requirements", "Neither governance requirements nor fit and proper requirements"],exps:["❌ Solvency II Pillar 2 includes BOTH governance requirements AND fit and proper requirements — they cannot be separated.", "❌ Fit and proper requirements are part of Solvency II, but so are comprehensive governance requirements.", "✅ Correct — Solvency II Pillar 2 covers governance requirements (including board structures, risk management, internal control, audit, actuarial, and outsourcing) as well as fit and proper requirements for persons running the undertaking.", "❌ Both governance and fit and proper requirements are expressly within Solvency II's scope."],correct:2,slide:"Slide 09"}
,
{q:"Which of the following is NOT a requirement for authorisation to carry out banking activity?",opts:["Adequacy of the structural organisation", "Qualification and competence of individuals performing administrative and managerial functions", "Preliminary authorisation to carry out investment services pursuant to MiFID II", "Feasibility of the envisaged programme"],exps:["❌ Adequacy of the structural organisation IS a requirement for banking authorisation under CRD IV.", "❌ Qualification and competence of individuals performing administrative and managerial functions IS a requirement under CRD IV (fit and proper requirements).", "✅ Correct — a preliminary MiFID II authorisation to provide investment services is NOT a requirement for banking authorisation. Credit institutions may provide investment services under their banking authorisation without a separate MiFID II licence.", "❌ Feasibility of the envisaged programme IS a requirement for banking authorisation under CRD IV."],correct:2,slide:"Slide 09"}
,
{q:"Under the IFD/IFR framework, a Class 1 investment firm (systemically important) is defined by which threshold?",opts:["Assets under management exceeding €5 billion, since large fund managers pose systemic risks similar to credit institutions","Consolidated assets of at least €30 billion, requiring authorisation as a credit institution under CRR/CRD framework","Annual revenue exceeding €1 billion from investment services, reflecting the income-based threshold for systemic designation","Client assets held in custody exceeding €100 million, reflecting the importance of safeguarding client assets at scale"],exps:["❌ AuM thresholds define Class 2 firms, not Class 1.","✅ Correct — Class 1 investment firms are large entities with assets of at least €30 billion engaged in high-risk activities; they must seek authorisation as credit institutions and follow the CRR/CRD regime.","❌ Turnover thresholds apply to Class 2 firms (€30M annual turnover threshold).","❌ Class 1 classification is based on balance sheet size, not client asset custody levels."],correct:1,slide:"Slide 09"},
{q:"The minimum initial capital requirement for an investment firm wishing to provide proprietary trading, underwriting, or guaranteed placement services is:",opts:["€75,000 — the minimum initial capital for firms providing basic services without holding client money or instruments","€150,000 — the minimum capital required for firms operating multilateral or organised trading facilities as venue operators","€500,000 — the threshold applicable to investment firms providing portfolio management with discretionary client mandates","€750,000 — the minimum initial capital for high-risk services including proprietary trading and firm underwriting commitments"],exps:["❌ €75,000 is the minimum for basic services (order reception, execution, portfolio management, advice) without holding client assets.","❌ €150,000 is the minimum for MTF/OTF operators.","❌ €500,000 is not a standard MiFID threshold.","✅ Correct — €750,000 is the minimum initial capital for high-risk activities including proprietary trading, underwriting, or guaranteed placement services."],correct:3,slide:"Slide 09"},
{q:"The K-factor methodology under IFR is designed to:",opts:["Replace all capital requirements with a single fixed percentage of total assets applicable uniformly to all investment firms","Calculate risk-based capital for Class 2 investment firms based on customer risk, market risk, and business risk K-factors","Provide a simplified flat-fee capital assessment applicable only to Class 3 small non-interconnected investment firms","Set leverage limits for investment firms engaging in algorithmic trading and high-frequency trading strategies specifically"],exps:["❌ K-factors provide a tailored risk-based approach, not a single fixed percentage.","✅ Correct — K-factors measure different risk categories (customer risk: AuM and client orders handled; market risk: trading positions; business risk: operational factors) to calculate capital requirements for Class 2 investment firms.","❌ K-factors apply to Class 2 firms; Class 3 firms use a simpler approach.","❌ K-factors are about capital requirements, not leverage limits."],correct:1,slide:"Slide 09"},
{q:"Under Article 43 IFR, what assets are explicitly excluded from counting as liquid assets for investment firm liquidity requirements?",opts:["Government bonds and treasury bills, which are excluded because their value may fall in a stress scenario unexpectedly","Short-term deposits at credit institutions, which are excluded as potentially unavailable in a systemic liquidity crisis","Client money and financial instruments, even if held in the firm's name — excluded because they are client assets","Long-term corporate bonds, which are explicitly excluded due to their potential illiquidity in stressed market conditions"],exps:["❌ Government bonds and treasury bills count as liquid assets.","❌ Short-term deposits count as liquid assets.","✅ Correct — client money and financial instruments are explicitly excluded from the liquid asset calculation, even if held in the firm's name, because they are client assets and not available to the firm.","❌ Long-term corporate bonds may qualify depending on their liquidity; they are not explicitly excluded."],correct:2,slide:"Slide 09"},
{q:"For UCITS management companies, at what level of AuM does the additional capital requirement of 0.02% begin to apply?",opts:["€50 million","€125 million","€250 million","€500 million"],exps:["❌ €50 million is not the threshold.","❌ €125,000 is the base capital requirement for UCITS managers, not an AuM threshold.","✅ Correct — UCITS management companies must pay an additional 0.02% of assets under management exceeding €250 million, subject to a €10 million total cap.","❌ €500 million is not the correct threshold."],correct:2,slide:"Slide 09"},
{q:"The IFD/IFR framework replaced the prior CRR/CRD IV regime for most investment firms because:",opts:["CRR/CRD IV was designed for credit institution risks and was ill-suited to the actual risk profile of most investment firms","The CRR/CRD IV regime was considered too light for investment firm risks, creating dangerous regulatory gaps in oversight","Investment firms grew too large to be supervised by national authorities, necessitating a new EU-level prudential framework","Investment firms successfully lobbied for lighter capital requirements after the financial crisis, resulting in the IFD/IFR regime"],exps:["✅ Correct — CRR/CRD IV was designed to address banking risks (credit risk, liquidity from deposit withdrawals) and was inappropriate for investment firm activities; IFD/IFR provides a proportionate, tailored framework.","❌ The CRR/CRD IV regime was considered too heavy and ill-fitting for investment firms, not too light.","❌ Supervisory competence issues were not the reason for the regime change.","❌ The change reflected regulatory design logic, not lobbying outcomes."],correct:0,slide:"Slide 09"},
{q:"Class 2 investment firms must hold own funds equal to the greatest of which three requirements?",opts:["Fixed overhead requirement, permanent minimum capital, and the K-factor requirement — whichever is highest at any time","Tier 1 capital, Tier 2 capital, and Tier 3 capital amounts — each calculated separately and the highest amount applied","Client asset protection buffer, market risk buffer, and operational risk buffer — as defined in IFR Delegated Regulation","56% of total capital, 25% of fixed overheads, and the K-AUM factor — applied cumulatively to all Class 2 IFs"],exps:["✅ Correct — Class 2 investment firms must hold own funds equal to the greatest of: the fixed overhead requirement (25% of prior year fixed costs), the permanent minimum capital, and the K-factor requirement.","❌ Tiers of capital describe capital quality, not the three-part test for capital level.","❌ These buffer types do not describe the IFR three-part test.","❌ These describe capital quality ratios, not the three-part level test."],correct:0,slide:"Slide 09"},
{q:"Under IFR, what is the concentration risk limit for a Class 2 investment firm's exposure to a single client or group of connected clients, as a percentage of own funds?",opts:["10% of own funds per client or group of connected clients — requiring immediate reduction if the threshold is breached","15% of own funds per client or group — with a 6-month cure period before the NCA must be notified of the breach","25% of own funds per single client or group of connected clients as the maximum permissible concentration under IFR","40% of own funds per client, reflecting the higher concentration risk tolerance for smaller investment firm balance sheets"],exps:["❌ 10% is too low; it would unduly restrict normal business operations.","❌ 15% is not the correct limit.","✅ Correct — the concentration risk limit under IFR is 25% of own funds per client or group of connected clients.","❌ 40% exceeds the regulatory limit."],correct:2,slide:"Slide 09"},
{q:"The Tier 1 capital requirement for Class 2 and 3 investment firms under IFR must represent at least what percentage of total capital requirements?",opts:["25% of total capital requirements — matching the fixed overhead requirement proportion under the three-part capital test","33% of total capital requirements — ensuring Tier 1 represents at least one-third of all own funds held by investment firms","56% of total capital requirements — primary Tier 1 capital must constitute more than half of all own funds requirements","75% of total capital requirements — aligning investment firm capital quality standards with those for credit institutions"],exps:["❌ 25% is the fixed overhead buffer requirement, not the Tier 1 minimum ratio.","❌ 33% is not the correct Tier 1 minimum for investment firms.","✅ Correct — for Class 2 and 3 investment firms, primary Tier 1 capital must represent at least 56% of total capital requirements.","❌ 75% is too high; it is not the standard Tier 1 minimum ratio for investment firms."],correct:2,slide:"Slide 09"},
{q:"Member States may allow UCITS management companies to replace up to what percentage of additional capital (above base) with a guarantee from a qualifying credit institution or insurer?",opts:["25%","33%","50%","75%"],exps:["❌ 25% is not the correct replacement percentage.","❌ 33% is not the correct replacement percentage.","✅ Correct — Member States may allow UCITS management companies to replace up to 50% of the additional capital (the 0.02% of AuM above €250M) with a guarantee from a qualifying credit institution or insurance company.","❌ 75% exceeds the permitted replacement percentage."],correct:2,slide:"Slide 09"}],
"10 — EMIR, CSDR and SFTR":[
{q:"EMIR (2012), CSDR (2014), and SFTR (2015) all emerged from:",opts:["The 2015 Capital Markets Union initiative — as established in the EMIR technical standards adopted by the Commission","The Lamfalussy process level 3 convergence initiatives — reflecting the G20 commitment to reduce systemic risk in derivatives markets","The G20 commitments and the 2008 financial crisis, translating commitments into binding EU law to secure post-trading processes from clearing through settlement","The ECB's 2010 review of Target2-Securities infrastructure — applicable from the date the relevant Commission delegated regulation entered into force"],exps:["❌ The CMU initiative came later (2015); the three regulations emerged from the financial crisis.","❌ Lamfalussy level 3 involves ESA soft law; EMIR, CSDR, and SFTR are Level 1 legislation.","✅ Correct — all three regulations emerged from the 2008 financial crisis, translating G20 commitments into binding EU law to secure post-trading processes.","❌ Target2-Securities is separate ECB infrastructure; the three regulations are distinct."],correct:2,slide:"Slide 10"},
{q:"The 2009 G20 commitment regarding OTC derivatives required that:",opts:["All standardised OTC derivatives be cleared through CCPs, reported to trade repositories, and traded on organised platforms where appropriate","All derivatives trading be moved from OTC to exchange-based trading immediately — as established under the relevant EU secondary legislation framework","All derivative contracts be governed by ISDA Master Agreements — reflecting the harmonisation objective of the EU single financial market","OTC derivatives markets be abolished and replaced by regulated markets only — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the G20 committed that all standardised OTC derivatives be cleared through CCPs, reported to trade repositories, and traded on organised platforms where appropriate.","❌ Not all derivatives were moved to exchange trading; clearing and reporting were the primary mandates.","❌ ISDA Master Agreements existed before 2009; they were not mandated by G20.","❌ OTC derivatives markets were not abolished; they were reformed with new requirements."],correct:0,slide:"Slide 10"},
{q:"The CCP 'default waterfall' under EMIR must meet which standard?",opts:["Cover 2 standard — sufficient resources to cover the simultaneous default of the two clearing members with the largest exposures","Cover 1 standard — sufficient resources to cover the default of the largest clearing member — as established in the EMIR technical standards adopted by the Commission","Cover 3 standard — sufficient for the simultaneous default of the three largest clearing members","Cover All standard — sufficient for the default of all clearing members simultaneously — applicable from the date the relevant Commission delegated regulation entered into force"],exps:["✅ Correct — the Cover 2 standard requires CCPs to hold sufficient financial resources to cover the simultaneous default of the two clearing members with the largest exposures.","❌ Cover 1 is below the EMIR requirement.","❌ Cover 3 exceeds the EMIR minimum requirement.","❌ Cover All is not the EMIR standard."],correct:0,slide:"Slide 10"},
{q:"The EMIR default waterfall applies resources in which order?",opts:["Mutualized default fund first, then CCP's own resources, then defaulter's margin — as established in the EMIR technical standards adopted by the Commission","Non-defaulting members' contributions first, then defaulter's margin, then CCP's own resources — applicable from the date the relevant Commission delegated regulation entered into force","CCP's own resources first, then defaulter's margin, then mutualized default fund — reflecting the G20 commitment to reduce systemic risk in derivatives markets","Defaulter's initial margin and default fund contribution first, then CCP's own 'skin-in-the-game' resources, then mutualized default fund from non-defaulting members"],exps:["❌ The defaulter's resources are applied first, not the mutualized fund.","❌ Non-defaulting members' contributions are applied after the defaulter's resources and CCP's own resources.","❌ CCP's own resources are not applied first.","✅ Correct — the waterfall starts with the defaulter's initial margin and default fund contribution, then CCP's own 'skin-in-the-game' dedicated resources, then the mutualized default fund from non-defaulting members."],correct:3,slide:"Slide 10"},
{q:"EMIR 3.0 (effective December 24, 2024) introduced the Active Account Obligation, which requires:",opts:["Financial counterparties above clearing threshold (FC+) and NFC+ entities above EUR 3 billion in specified IR OTC derivatives to maintain permanently functional active accounts with EU CCPs and clear at least five trades annually per subcategory","All EU derivatives clearing to move exclusively to EU CCPs immediately — a requirement applying to all financial counterparties above clearing thresholds — a position that differs from the correct EU legal framework applicable in this context","All clearing to cease at UK CCPs from January 1, 2025 — applicable from the date the relevant Commission delegated regulation entered into force — a description that applies to a different EU legal act, not the one relevant to this question","Investment firms to convert all OTC derivatives to exchange-traded instruments — applicable from the date the relevant Commission delegated regulation entered into force — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — FC+ and qualifying NFC+ entities must maintain permanently functional active accounts with EU CCPs and clear at least five trades annually per subcategory.","❌ The active account obligation does not require exclusive EU CCP clearing immediately.","❌ UK CCPs continue under time-limited equivalence until June 30, 2028.","❌ EMIR 3.0 does not require conversion of OTC derivatives to exchange-traded instruments."],correct:0,slide:"Slide 10"},
{q:"CSDR harmonised securities settlement by requiring transactions in transferable securities executed on trading venues to settle no later than:",opts:["T+1 (one business day after trade date)","T+5 (five business days after trade date)","T+3 (three business days after trade date)","T+2 (two business days after trade date)"],exps:["❌ T+1 is the target being discussed for future reform but not yet the CSDR standard.","❌ T+5 is not the CSDR standard.","❌ T+3 was the pre-CSDR standard in many jurisdictions; CSDR reduced it to T+2.","✅ Correct — CSDR requires transactions in transferable securities to settle no later than T+2."],correct:3,slide:"Slide 10"},
{q:"A Central Securities Depository (CSD) must provide at least which core services?",opts:["Securities settlement only — a requirement applying to all entities within the relevant regulatory scope — a position that differs from the correct EU legal framework applicable in this context","Only custody services for investors' securities — as established under the relevant EU secondary legislation framework — an interpretation that was considered but rejected by the EU legislator during the drafting process","Only the notary service of recording new security issuances — as confirmed by the relevant CJEU case law and regulatory guidance — a description that applies to a different EU legal act, not the one relevant to this question","Settlement service (operating a securities settlement system) PLUS at least one of: notary service (initial recording in book-entry form) or central maintenance service (maintaining securities accounts at top-tier level)"],exps:["❌ CSDs must provide settlement and at least one of the other two core services.","❌ Custody is an ancillary service; the core services are settlement, notary, and central maintenance.","❌ The notary service alone does not constitute a CSD.","✅ Correct — a CSD must operate a securities settlement system AND provide at least one of two additional core functions: notary service or central maintenance."],correct:3,slide:"Slide 10"},
{q:"SFTR (Securities Financing Transactions Regulation, 2015) was adopted in response to:",opts:["The need to regulate crypto-asset financing transactions — a requirement introduced by the Lamfalussy Level 2 implementing measures","The ESRB's concerns about sovereign debt repo markets — a principle established in the foundational Regulation governing this area","The European Commission's CMU initiative requiring greater transparency in securities lending — reflecting the maximum harmonisation approach adopted in this EU framework","FSB recommendations addressing risks in the shadow banking sector — SFTs contributed to excessive leverage, pro-cyclicality, and systemic interconnectedness before and during the financial crisis"],exps:["❌ SFTR was not adopted for crypto-asset financing.","❌ SFTR covers all SFT types, not specifically sovereign debt repos.","❌ While CMU transparency is a broader objective, SFTR specifically responds to FSB shadow banking recommendations.","✅ Correct — SFTR responds to FSB recommendations addressing shadow banking risks; SFTs contributed to excessive leverage, pro-cyclicality, and systemic interconnectedness during the crisis."],correct:3,slide:"Slide 10"},
{q:"Under SFTR, which types of securities financing transactions must be reported?",opts:["Only repurchase transactions (repos) — a requirement applying to all entities within the relevant regulatory scope — a position that differs from the correct EU legal framework applicable in this context","Only securities lending and borrowing transactions — a requirement applying to all entities within the relevant regulatory scope","Repurchase transactions, securities lending/borrowing, buy-sell back/sell-buy back, and margin lending — all new SFTs and lifecycle events must be reported within one working day","Only transactions above €100 million notional value — as confirmed by the relevant CJEU case law and regulatory guidance — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ SFTR covers all SFT types, not only repos.","❌ SFTR covers all SFT types, not only securities lending.","✅ Correct — SFTR covers repurchase transactions, securities lending/borrowing, buy-sell back/sell-buy back, and margin lending; all new SFTs and lifecycle events must be reported to trade repositories within one working day.","❌ There is no €100 million notional threshold for SFTR reporting."],correct:2,slide:"Slide 10"},
{q:"Under SFTR, collateral reuse requires which conditions?",opts:["No conditions — reuse is freely permitted without restriction — a requirement applying to all entities within the relevant regulatory scope — a position that differs from the correct EU legal framework applicable in this context","Only written consent from the collateral provider, with no other conditions — reflecting the harmonisation objective of the EU single financial market — a description that applies to a different EU legal act, not the one relevant to this question","Prior written information to the collateral provider about risks and consequences, AND prior express written consent from the collateral provider, AND financial instruments transferred from the collateral provider's account","Approval from the relevant NCA and notification to ESMA — as established under the relevant EU secondary legislation framework — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ Collateral reuse is subject to specific conditions under SFTR.","❌ Written consent alone is insufficient; prior written information is also required.","✅ Correct — three conditions: (1) prior written information to collateral provider about risks; (2) prior express written consent (evidenced by signature); (3) financial instruments transferred from collateral provider's account.","❌ NCA approval is not required for collateral reuse."],correct:2,slide:"Slide 10"},
{q:"EMIR counterparties are classified as Financial Counterparties (FC) and Non-Financial Counterparties (NFC). FC+ and NFC+ designation depends on:",opts:["Whether the counterparty is registered in an EU Member State — as established in the EMIR technical standards adopted by the Commission","Whether OTC derivatives positions exceed clearing thresholds — FC+ and NFC+ are subject to the clearing obligation","Whether the counterparty is supervised by a national central bank — reflecting the G20 commitment to reduce systemic risk in derivatives markets","Whether the counterparty holds more than €1 billion in total derivatives exposure — applicable from the date the relevant Commission delegated regulation entered into force"],exps:["❌ EU registration alone does not determine FC+/NFC+ status.","✅ Correct — FC+ and NFC+ are designated based on whether OTC derivatives positions exceed clearing thresholds; these entities are subject to the clearing obligation.","❌ National central bank supervision does not determine clearing threshold status.","❌ A specific €1 billion threshold is not the universal EMIR clearing threshold."],correct:1,slide:"Slide 10"},
{q:"CCP authorisation under Article 17 EMIR requires which consultation process?",opts:["The home competent authority consults the college (including ESMA, NCAs, and ESCB members) — authorisation is refused if two-thirds of college members (excluding home authority) reach a joint negative opinion","Only the home competent authority reviews and approves without external consultation — a requirement introduced by the Lamfalussy Level 2 implementing measures","ESMA directly grants CCP authorisation after consulting the ECB — reflecting the maximum harmonisation approach adopted in this EU framework — a description that applies to a different EU legal act, not the one relevant to this question","The Commission approves CCP authorisation based on the home NCA's recommendation — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — the home competent authority consults the college; authorisation is refused if two-thirds of college members (excluding home authority) reach a joint negative opinion.","❌ External consultation through a college of supervisors is required.","❌ ESMA does not directly grant CCP authorisation (except for third-country Tier 2 CCPs under direct supervision).","❌ The Commission is not involved in CCP authorisation under Article 17 EMIR."],correct:0,slide:"Slide 10"},
{q:"The settlement discipline regime under CSDR includes which mechanisms?",opts:["Mandatory settlement within T+1 and criminal penalties for settlement failures","Cash penalties for settlement fails and mandatory buy-in processes for persistent failures","Only voluntary buy-in processes as agreed between parties","Only cash penalties with no mandatory buy-in requirement"],exps:["❌ The CSDR standard is T+2, not T+1, and penalties are administrative rather than criminal.","✅ Correct — CSDR settlement discipline includes cash penalties for settlement fails and mandatory buy-in processes for persistent failures.","❌ Buy-in processes are mandatory, not voluntary.","❌ CSDR includes both cash penalties AND mandatory buy-in processes."],correct:1,slide:"Slide 10"},
{q:"All data reported under SFTR must be retained for a minimum of:",opts:["One year","Three years","Five years","Ten years"],exps:["❌ One year is below the SFTR minimum retention period.","❌ Three years is below the SFTR minimum retention period.","✅ Correct — all SFTR data must be retained for a minimum of five years. A Legal Entity Identifier (LEI) is required for all legal entities involved in SFT reporting.","❌ Ten years is the CSDR data retention requirement for CSDs, not SFTR."],correct:2,slide:"Slide 10"},
{q:"The CSDR book-entry requirement means:",opts:["Securities admitted to trading or traded on venues must be represented in book-entry form through immobilisation or dematerialised issuance","All financial instruments must be held in physical certificate form and stored in registered vaults — as established under the relevant EU secondary legislation framework","Securities must be held exclusively by authorised custodians with minimum €1 billion capital — reflecting the harmonisation objective of the EU single financial market","Only government bonds are required to be held in book-entry form — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — CSDR requires securities admitted to trading or traded on venues to be represented in book-entry form through immobilisation or dematerialised issuance.","❌ Physical certificate form is the opposite of the book-entry requirement.","❌ The €1 billion capital requirement for custodians is not what the book-entry requirement means.","❌ The book-entry requirement applies to all securities admitted to trading, not only government bonds."],correct:0,slide:"Slide 10"}
,
{q:"The EMIR reporting obligation requires reporting all derivatives transactions to trade repositories within:",opts:["One hour of execution","One week of execution","One business day after the transaction","One month, in consolidated monthly reports"],exps:["❌ One hour is too short; the EMIR reporting deadline is one business day.","❌ One week is far too long.","✅ Correct — all derivatives transactions (OTC and exchange-traded) must be reported to registered trade repositories within one business day after the transaction.","❌ Monthly consolidated reports are insufficient."],correct:2,slide:"Slide 10"},
{q:"Under EMIR, variation margin is exchanged daily to:",opts:["Build up a buffer against future potential exposure during close-out periods", "Reflect current exposure from market value changes in outstanding contracts", "Satisfy the Cover 2 standard for CCPs", "Fund the CCP's default fund contributions"],exps:["❌ Building a buffer against future potential exposure describes initial margin.", "✅ Correct — variation margin is exchanged daily to reflect current exposure from market value changes in outstanding contracts.", "❌ The Cover 2 standard is a CCP capital requirement.", "❌ Default fund contributions are a separate CCP risk management tool."],correct:1,slide:"Slide 10"},
{q:"CCP board independence under EMIR requires:",opts:["The entire board must be independent from clearing members","Board members must be approved by ESMA before appointment","At least 50% of management body members must be independent","At least one-third of management body members must be independent"],exps:["❌ Full board independence is not required.","❌ ESMA approval of board members is not required.","❌ 50% is above the EMIR requirement.","✅ Correct — EMIR requires at least one-third of management body members to be independent."],correct:3,slide:"Slide 10"},
{q:"Under SFTR, UCITS and AIFMs must inform investors in periodic reports about:",opts:["Use of SFTs and total return swaps, and identify such use in pre-contractual documents","Avoiding all use of SFTs to protect retail investors — as specified in the relevant delegated acts and ESMA guidelines","SFT usage on a weekly basis reported to ESMA — a requirement that applies from the date of authorisation onward","Obtaining NCA approval before engaging in any SFT — reflecting the product-focused approach of this EU regulatory framework"],exps:["✅ Correct — UCITS and AIFMs must inform investors in periodic reports about use of SFTs and total return swaps, and identify such use in pre-contractual documents.","❌ SFT use is permitted; SFTR requires disclosure, not prohibition.","❌ Weekly reporting to ESMA is not an SFTR obligation for investment funds.","❌ NCA approval is not required before engaging in SFTs."],correct:0,slide:"Slide 10"},
{q:"The active account obligation under EMIR 3.0 requires FC+ entities to clear at least how many trades annually per subcategory at EU CCPs?",opts:["One trade per year — as established in the EMIR technical standards adopted by the Commission","Five trades annually per subcategory per class of derivatives in active accounts (with scaled requirements for low-frequency traders)","Ten trades per quarter — reflecting the G20 commitment to reduce systemic risk in derivatives markets","Twenty trades per year — applicable from the date the relevant Commission delegated regulation entered into force"],exps:["❌ One trade per year is below the minimum activity requirement.", "✅ Correct — FC+ entities must clear at least five trades annually per subcategory per class of derivatives in active accounts, with scaled requirements for low-frequency traders.", "❌ Ten trades per quarter is above the minimum annual requirement.", "❌ Twenty trades per year is above the minimum requirement."],correct:1,slide:"Slide 10"},
{q:"Under CSDR, the 'book-entry requirement' means securities admitted to trading must be represented:",opts:["In physical certificate form stored in registered vaults","In any form agreed between the issuer and the CSD","Exclusively in dematerialised form — physical certificates are permanently prohibited","In book-entry form through immobilisation or dematerialised issuance"],exps:["❌ Physical certificate form is the opposite of the book-entry requirement.","❌ The book-entry requirement is mandated by law.","❌ CSDR allows both immobilisation and dematerialised issuance.","✅ Correct — CSDR requires securities admitted to trading or traded on venues to be represented in book-entry form through immobilisation or dematerialised issuance."],correct:3,slide:"Slide 10"}
,
{q:"The 'Cover 2' standard applicable to CCPs under EMIR means that:",opts:["CCPs must hold capital covering losses from the two largest European markets in which they operate simultaneously","CCPs must maintain sufficient financial resources to cover the simultaneous default of the two largest-exposure clearing members","CCPs must cover two full days of margin requirements at all times — both initial and variation margin combined","CCPs must be directly supervised by at least two national competent authorities to ensure multi-jurisdictional coverage"],exps:["❌ 'Cover 2' refers to default scenarios, not geographic market exposure.","✅ Correct — EMIR's 'Cover 2' standard requires CCPs to hold sufficient financial resources to cover simultaneously the default of the two clearing members with the largest exposures — the most demanding prudential standard.","❌ Two-day margin coverage is a different concept; 'Cover 2' concerns the default of two members.","❌ Dual supervisory oversight is not what 'Cover 2' refers to."],correct:1,slide:"Slide 10"},
{q:"Under CSDR, the maximum settlement period for transactions in transferable securities executed on trading venues is:",opts:["T+1 (one business day after trade date) — CSDR harmonised settlement at the fastest technically achievable standard","T+5 (five business days after trade date) — permissible for cross-border transactions involving third-country CSDs","T+3 (three business days after trade date) — the pre-CSDR standard that CSDR shortened to improve settlement efficiency","T+2 (two business days after trade date) — CSDR harmonised settlement of on-venue transferable security transactions"],exps:["❌ T+1 is shorter than the CSDR requirement (though markets may move toward T+1 over time).","❌ T+5 was never the EU standard; CSDR moved toward T+2.","❌ T+3 was the pre-CSDR standard; CSDR shortened it to T+2.","✅ Correct — CSDR harmonises settlement at T+2: transactions in transferable securities executed on trading venues must settle no later than the second business day after the trade date."],correct:3,slide:"Slide 10"},
{q:"EMIR 3.0 (effective December 24, 2024) introduced the Active Account Obligation (AAO). Who must comply with the AAO?",opts:["FC+ and NFC+ entities exceeding €3 billion notional in interest rate OTC derivatives in specified currency categories","All EU financial institutions without exception, requiring all derivatives to be cleared through EU-established CCPs","Only Tier 2 third-country CCPs directly, which must maintain EU-accessible accounts to manage their clearing exposures","All investment firms providing clearing services to EU clients, regardless of whether they are FC+ or NFC+ classified"],exps:["✅ Correct — the AAO applies to FC+ entities and NFC+ entities exceeding €3 billion notional aggregate for interest rate OTC derivatives in specified categories, requiring them to maintain active accounts at EU CCPs.","❌ The AAO has specific thresholds; not all EU financial institutions are subject to it.","❌ Tier 2 third-country CCPs are subject to recognition requirements, not the AAO directly.","❌ The AAO applies to derivatives users, not CCP service providers."],correct:0,slide:"Slide 10"},
{q:"Under SFTR, a Legal Entity Identifier (LEI) is required for:",opts:["Only financial counterparties above the EMIR clearing thresholds — below threshold entities use national identifiers","Entities with annual turnover exceeding €50 million — below this threshold a national tax identifier may be substituted","Only EU-registered CCPs and ESMA-registered trade repositories that participate in securities financing transactions","All legal entities involved in SFT reporting under SFTR, enabling accurate identification throughout the reporting chain"],exps:["❌ The LEI requirement applies broadly to all legal entities involved in reporting, not just large counterparties.","❌ Turnover thresholds do not determine LEI requirements.","❌ CCPs and trade repositories are subject to different LEI obligations; the requirement is broader.","✅ Correct — under SFTR, an LEI is required for all legal entities involved in SFT reporting, enabling accurate identification across the reporting chain."],correct:3,slide:"Slide 10"},
{q:"What is the key difference between 'title transfer' collateral and 'security collateral' under SFTR?",opts:["In title transfer, full ownership passes to the taker; in security collateral, ownership remains with the provider","Title transfer allows unrestricted collateral reuse without any notification; security collateral can never be reused at all","Security collateral is used exclusively in repo transactions while title transfer is used exclusively in securities lending","Title transfer collateral must be held in segregated accounts while security collateral may always be commingled freely"],exps:["✅ Correct — under title transfer (e.g., repos), full ownership transfers to the taker; under security collateral, the provider retains ownership (full or qualified) when the security interest is created.","❌ SFTR regulates conditions for reuse of both types; title transfer doesn't allow unrestricted reuse.","❌ Both types may be used across different SFT structures.","❌ Segregation requirements apply differently; this description is not the key legal distinction."],correct:0,slide:"Slide 10"},
{q:"The EMIR bottom-up approach to the clearing obligation means:",opts:["ESMA initiates the clearing obligation assessment by identifying derivative classes posing systemic risks proactively","The Commission adopts clearing obligations following G20 commitments without consulting ESMA, ESAs, or industry bodies","NCAs directly determine which instruments must be cleared nationally without any ESMA involvement in the process","CCPs submit derivative classes they are authorised to clear to ESMA, which may then assess mandatory clearing obligations"],exps:["❌ ESMA initiating the assessment describes the top-down approach.","❌ The Commission adopts delegated regulations based on ESMA technical standards; the bottom-up approach involves CCP initiative.","❌ NCAs do not directly set EU-wide clearing obligations.","✅ Correct — the bottom-up approach occurs when CCPs submit the derivative classes they are authorised to clear for ESMA's consideration, potentially triggering assessment of mandatory clearing obligations for those classes."],correct:3,slide:"Slide 10"},
{q:"Which of the following describes the 'notary function' of a Central Securities Depository (CSD)?",opts:["Maintaining a central register of securities in book-entry form, ensuring issuance integrity and preventing unauthorised changes","Verifying the identity of investors before admitting them to securities trading on a regulated market or MTF","Managing settlement fails and imposing mandatory buy-in procedures and cash penalties on defaulting participants","Providing central clearing services between buyers and sellers of securities to eliminate bilateral counterparty risk"],exps:["✅ Correct — the notary function involves maintaining central registers of securities in book-entry form, ensuring issuance integrity and preventing unauthorized creation or deletion of securities.","❌ Investor identity verification is a conduct/AML function, not the CSD notary function.","❌ Managing settlement fails and imposing penalties relates to CSDR settlement discipline measures.","❌ Providing clearing services is the function of a CCP (central counterparty), not the notary function."],correct:0,slide:"Slide 10"},
{q:"Under SFTR, UCITS and AIFMs must disclose their use of SFTs and total return swaps to investors:",opts:["Only upon specific investor request, provided the investor demonstrates a legitimate interest in the fund's SFT activity","Only to institutional investors through bilateral agreements, since retail investor disclosure would breach confidentiality","In periodic reports and by identifying such use in pre-contractual documents available to all investors before subscription","Only to national competent authorities through quarterly regulatory reporting — not to investors in their fund documents"],exps:["❌ Disclosure is mandatory, not conditional on investor request.","❌ The disclosure obligation applies to all fund investors (retail and professional), not selectively.","✅ Correct — UCITS and AIFMs must disclose SFT and total return swap use in their periodic reports to investors and must identify such use in pre-contractual documents.","❌ Disclosure to NCAs is separate from investor disclosure obligations."],correct:2,slide:"Slide 10"},
{q:"EMIR's reporting obligation requires all derivatives transactions (OTC and exchange-traded) to be reported to trade repositories within:",opts:["One hour of execution — reflecting EMIR's near real-time surveillance objective for systemic risk monitoring purposes","Five business days — the deadline that balances reporting accuracy with operational feasibility for complex derivatives","One business day — the standard reporting window for both OTC and exchange-traded derivatives under EMIR","At the end of the calendar month — allowing firms to aggregate reporting with their periodic financial statements"],exps:["❌ One hour is not the EMIR reporting deadline.","❌ Five business days is too long; EMIR aims for near real-time supervisory data.","✅ Correct — EMIR requires comprehensive reporting of all derivatives transactions to registered trade repositories within one business day.","❌ Monthly reporting would not provide timely systemic risk oversight."],correct:2,slide:"Slide 10"},
{q:"CSD participants are required to hold client securities in what type of accounts under CSDR?",opts:["Pooled proprietary accounts mixing client and own securities to improve operational efficiency in settlement processes","Accounts managed exclusively by the ECB as part of Target2-Securities for harmonised central bank money settlement","A single omnibus account commingling all CSD participant assets for maximum operational and settlement efficiency","Segregated accounts separating client securities from proprietary assets, using omnibus accounts across client pools"],exps:["❌ Pooling client and proprietary assets would violate CSDR segregation requirements.","❌ T2S is the settlement platform; CSD account structures are governed by CSDR.","❌ Commingling all CSD assets violates the segregation requirement.","✅ Correct — CSDR requires CSDs to segregate participants' securities from those of other participants and their own assets; participants must segregate client securities from their own in omnibus accounts."],correct:3,slide:"Slide 10"},
{q:"Under EMIR, CCPs must maintain governance arrangements ensuring the risk management function is independent from other operational areas. Which specific governance requirement relates to board composition?",opts:["The entire board must be composed of independent non-executive directors — as established in the EMIR technical standards adopted by the Commission","A majority of board members must be appointed by ESMA — reflecting the G20 commitment to reduce systemic risk in derivatives markets","At least one-third of management body members must be independent, and a risk committee must include clearing members, independent board members, and client representatives","The CEO must also chair the risk committee to ensure accountability — applicable from the date the relevant Commission delegated regulation entered into force"],exps:["❌ Full board independence would prevent operational management of the CCP.","❌ ESMA does not appoint CCP board members; it supervises CCPs but governance is internal.","✅ Correct — EMIR requires at least one-third of CCP management body members to be independent, and mandates a risk committee composed of clearing members, independent board members, and client representatives — ensuring diverse risk oversight.","❌ Combining the CEO and risk committee chair roles would create a conflict of interest; EMIR requires functional separation."],correct:2,slide:"Slide 10"}]
,
"11 — Prospectus Regulation":[
{q:"The Prospectus Regulation (EU 2017/1129) applies when:",opts:["Any financial instrument is created by a company — a requirement introduced by the Lamfalussy Level 2 implementing measures","Transferable securities are offered to the public OR admitted to trading on EU regulated markets","Any financial product is sold to retail investors regardless of listing — reflecting the maximum harmonisation approach adopted in this EU framework","Securities are issued exclusively to professional investors — a principle established in the foundational Regulation governing this area"],exps:["❌ Mere creation of an instrument does not trigger the Prospectus Regulation.","✅ Correct — the Regulation applies to transferable securities offered to the public OR admitted to trading on EU regulated markets.","❌ Not all retail sales trigger prospectus obligations; exemptions exist.","❌ Offers exclusively to professional investors are among the exemptions."],correct:1,slide:"Slide 11"},
{q:"The 'dual trigger' in the Prospectus Regulation means:",opts:["The prospectus obligation is triggered by EITHER an offer to the public OR admission to trading on a regulated market — whichever occurs first","Both the issuer and the offeror must sign the prospectus — a requirement introduced by the Lamfalussy Level 2 implementing measures","The prospectus must be approved by both the home NCA and ESMA — reflecting the maximum harmonisation approach adopted in this EU framework","The prospectus must be published in both English and the local language — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — the obligation attaches to whichever trigger occurs first: offer to the public OR admission to trading on a regulated market.","❌ The dual trigger concerns triggering events, not signatories.","❌ Only the home NCA approves; ESMA maintains a searchable storage mechanism but does not approve.","❌ Language requirements are separate from the dual trigger concept."],correct:0,slide:"Slide 11"},
{q:"The Listing Act (effective June 2026) introduced a general EU-wide exemption for offers with total consideration under:",opts:["€1 million per offeror over 12 months — as clarified by ESMA guidelines on prospectus disclosure requirements","€5 million per offeror over 12 months — a requirement applying to all public offers above the relevant threshold","EUR 12 million per offeror/issuer over 12 months — Member States may lower to €5 million for single-Member State offers","€50 million for all issuers regardless of size — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ €1 million was the previous minimum in the original Regulation.","❌ €5 million is the national option for single-Member State offers; the general EU threshold is €12 million.","✅ Correct — the Listing Act introduced a general exemption for offers under EUR 12 million per offeror/issuer over 12 months; Member States may lower to €5 million for offers limited to one Member State.","❌ €50 million is the EU Growth Prospectus threshold, not the general exemption."],correct:2,slide:"Slide 11"},
{q:"The passport mechanism under the Prospectus Regulation enables:",opts:["Third-country issuers to access EU markets without any prospectus — a requirement introduced by the Lamfalussy Level 2 implementing measures","The Commission to approve all prospectuses centrally — a principle established in the foundational Regulation governing this area","Issuers to market securities in one additional Member State without re-approval — reflecting the maximum harmonisation approach adopted in this EU framework","Once the home NCA approves the prospectus, it is automatically recognised throughout the EU — host authorities cannot conduct additional substantive review"],exps:["❌ Third-country issuers must comply with equivalence requirements.","❌ The Commission does not approve individual prospectuses.","❌ The passport enables EU-wide access, not just one additional Member State.","✅ Correct — once the home NCA approves, the prospectus is recognised throughout the EU; host authorities may only enforce language rules and local advertising standards."],correct:3,slide:"Slide 11"},
{q:"The EU Growth Prospectus is available to which issuers and what is its maximum page length?",opts:["Any EU issuer regardless of size; maximum 300 pages — as clarified by ESMA guidelines on prospectus disclosure requirements","SMEs, non-SME issuers on SME Growth Markets, and issuers with aggregate consideration below EUR 50 million employing fewer than 499 persons; maximum 75 pages","Only credit institutions and investment firms; maximum 100 pages — reflecting the investor protection objective of the Prospectus Regulation","Only issuers with at least 18 months trading history; maximum 50 pages — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ Any EU issuer regardless of size applies to the full prospectus, not the EU Growth Prospectus.","✅ Correct — available for SMEs, non-SME issuers on SME Growth Markets, and issuers with aggregate consideration below EUR 50 million and fewer than 499 employees; maximum 75 pages.","❌ The EU Growth Prospectus is not limited to credit institutions and investment firms.","❌ The 18-month trading history requirement applies to the EU Follow-on Prospectus."],correct:1,slide:"Slide 11"},
{q:"The EU Follow-on Prospectus requires at least how many months of trading history, with what maximum page length?",opts:["6 months; maximum 100 pages — as clarified by ESMA guidelines on prospectus disclosure requirements","12 months; maximum 75 pages — a requirement applying to all public offers above the relevant threshold","18 months; maximum 50 pages — with only one year of financial information required and a 7-day approval period","24 months; maximum 30 pages — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ 6 months is below the threshold; 100 pages is the EU Growth Prospectus maximum.","❌ 12 months is below the threshold.","✅ Correct — the EU Follow-on Prospectus requires at least 18 months of continuous trading on a regulated market or SME Growth Market; maximum 50 pages, one year of financial information, 7-day approval period.","❌ 24 months is above the required threshold."],correct:2,slide:"Slide 11"},
{q:"The maximum length of a full equity prospectus on regulated markets (as set by the Listing Act) is:",opts:["100 pages","200 pages","300 pages","500 pages"],exps:["❌ 100 pages is not the full equity prospectus limit.","❌ 200 pages is not the limit set by the Listing Act.","✅ Correct — the Listing Act set a maximum of 300 pages for a full equity prospectus on regulated markets.","❌ 500 pages exceeds the Listing Act limit."],correct:2,slide:"Slide 11"},
{q:"The Universal Registration Document (URD) allows frequent issuers to:",opts:["File a prospectus without any NCA review from the first year of use — a requirement applying to all entities within the relevant regulatory scope — a position that differs from the correct EU legal framework applicable in this context","Describe their organisation and business annually; after the first two years the URD may be filed without prior approval; when launching offers, issuers add only a securities note and summary to compose a complete prospectus rapidly","Replace both the securities note and summary with a single document — as confirmed by the relevant CJEU case law and regulatory guidance — a description that applies to a different EU legal act, not the one relevant to this question","Access the EU passport without home NCA approval — as established under the relevant EU secondary legislation framework — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ During the first two financial years, the URD must be approved by the home NCA.","✅ Correct — the URD enables rapid market access: approved for the first two years, then filed without prior approval; issuers add only a securities note and summary to compose a complete prospectus.","❌ The URD is one component; a securities note and summary are still required.","❌ Passporting requires NCA approval; the URD streamlines but does not bypass it."],correct:1,slide:"Slide 11"},
{q:"The prospectus summary's maximum length is:",opts:["3 A4 pages","5 A4 pages","7 A4 pages","10 A4 pages"],exps:["❌ 3 A4 pages is the maximum length of the KID (PRIIPs), not the prospectus summary.","❌ 5 A4 pages is not the limit.","✅ Correct — the prospectus summary is limited to a maximum of 7 A4 pages when printed.","❌ 10 A4 pages exceeds the limit."],correct:2,slide:"Slide 11"},
{q:"In Kolassa v Barclays (2015), the CJEU established that:",opts:["Issuers are not liable for prospectus errors if they have obtained NCA approval — as established under the relevant EU secondary legislation framework — a position that differs from the correct EU legal framework applicable in this context","Jurisdiction under Brussels I Regulation can lie with investor's home courts if objective connecting factors exist, even when the issuer is established abroad — expanding cross-border investor access to remedies","Only institutional investors can bring prospectus liability claims — reflecting the harmonisation objective of the EU single financial market — a description that applies to a different EU legal act, not the one relevant to this question","Prospectus liability is fully harmonised at EU level with uniform remedies — as confirmed by the relevant CJEU case law and regulatory guidance — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ NCA approval examines completeness and consistency, not material accuracy; it does not shield issuers from liability.","✅ Correct — in Kolassa, the CJEU established that jurisdiction can lie with the investor's home courts if objective connecting factors exist.","❌ Kolassa did not limit claims to institutional investors.","❌ Bankia v UMAS (2021) confirmed civil liability is NOT fully harmonised."],correct:1,slide:"Slide 11"},
{q:"Competent authority approval of a prospectus examines only:",opts:["Completeness, consistency, and comprehensibility — material accuracy remains the issuer's responsibility (clarified by the Listing Act)","Material accuracy of all statements — as clarified by ESMA guidelines on prospectus disclosure requirements","Whether the issuer meets minimum size and track record requirements — reflecting the investor protection objective of the Prospectus Regulation","Whether the offer price is fair compared to intrinsic value — applicable in all Member States under the maximum harmonisation approach"],exps:["✅ Correct — the Listing Act clarified that competent authority approval examines only completeness, consistency, and comprehensibility — material accuracy remains with the issuer.","❌ Material accuracy is the issuer's responsibility.","❌ Minimum size requirements are not how NCA approval is framed.","❌ NCAs do not assess whether the offer price is fair."],correct:0,slide:"Slide 11"},
{q:"A supplement to the prospectus is required when:",opts:["Only at the end of the offering period to confirm final terms — a requirement applying to all public offers above the relevant threshold — a position that differs from the correct EU legal framework applicable in this context","Never; updated information is always incorporated by reference — as clarified by ESMA guidelines on prospectus disclosure requirements — an interpretation that was considered but rejected by the EU legislator during the drafting process","Only when the issuer voluntarily decides to update the prospectus — applicable in all Member States under the maximum harmonisation approach — a description that applies to a different EU legal act, not the one relevant to this question","A significant new factor arises, a material mistake is discovered, or an inaccuracy is identified during the offer period or before admission — investors who have already committed receive at least two working days to withdraw"],exps:["❌ A supplement must be published during the offer period when specific triggers arise.","❌ A supplement is distinct from incorporation by reference.","❌ Supplements are mandatory in specific circumstances, not purely voluntary.","✅ Correct — supplements are required for significant new factors, material mistakes, or inaccuracies; investors who have already committed receive at least two working days to withdraw."],correct:3,slide:"Slide 11"},
{q:"Which instruments are excluded from the prospectus obligation?",opts:["Transferable securities admitted to trading on regulated markets — as clarified by ESMA guidelines on prospectus disclosure requirements","Shares admitted to trading on SME Growth Markets — applicable in all Member States under the maximum harmonisation approach","Bonds issued by credit institutions in the EU — reflecting the investor protection objective of the Prospectus Regulation","Money market instruments under 12 months, collective investment units (open-end), securities issued by Member States, and central bank shares"],exps:["❌ Transferable securities admitted to regulated markets are within scope.","❌ Shares admitted to SME Growth Markets may be within scope.","❌ Bonds issued by credit institutions are generally within scope.","✅ Correct — excluded instruments include money market instruments under 12 months, collective investment units (open-end), securities issued by Member States, and central bank shares."],correct:3,slide:"Slide 11"},
{q:"The 'fungibility threshold' raised by the Listing Act to 30% means:",opts:["Securities of a different class from those already admitted are exempt from prospectus requirements — as clarified by ESMA guidelines on prospectus disclosure requirements","No prospectus is required for securities fungible with those already admitted and representing less than 30% of existing securities over 12 months","Any secondary offering of previously listed securities is automatically exempt — reflecting the investor protection objective of the Prospectus Regulation","Securities offered exclusively to existing shareholders are always exempt — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ The fungibility threshold applies to securities of the same class.","✅ Correct — the Listing Act raised the fungibility threshold to 30%; no prospectus is required for securities fungible with those already admitted representing less than 30% of existing securities over 12 months.","❌ Not all secondary offerings are exempt; the percentage threshold applies.","❌ Offers to existing shareholders benefit from a different exemption (fewer than 150 natural or legal persons)."],correct:1,slide:"Slide 11"},
{q:"In Bankia v UMAS (2021), the CJEU confirmed that:",opts:["Article 6 requires civil liability systems but does not fully harmonise them — national legislatures retain discretion over remedies, procedures, and limitation periods, provided investor protection is effective","Article 6 of the Prospectus Directive fully harmonises civil liability across the EU — as established under the relevant EU secondary legislation framework","Issuers bear no civil liability for prospectus errors if errors are immaterial — reflecting the harmonisation objective of the EU single financial market","The Commission has exclusive competence to harmonise prospectus civil liability — as confirmed by the relevant CJEU case law and regulatory guidance — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — Bankia confirmed Article 6 requires civil liability but does not fully harmonise it; national legislatures retain discretion provided investor protection is effective.","❌ Bankia confirmed the opposite — civil liability is NOT fully harmonised.","❌ All prospectus errors can give rise to civil liability; materiality thresholds vary by national law.","❌ The Commission does not have exclusive competence to harmonise civil liability."],correct:0,slide:"Slide 11"}
,
{q:"The exemption for 'fewer than 150 natural or legal persons per Member State, excluding qualified investors' reflects:",opts:["Pre-IPO placements to a small group of early investors — as established under the relevant EU secondary legislation framework","The limited scale scenario: offers to fewer than 150 non-professional persons per Member State pose limited systemic risk","Rights issues to existing shareholders only — reflecting the harmonisation objective of the EU single financial market","Private placements to a single institutional investor — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Pre-IPO placements are typically covered by the qualified investors exemption.", "✅ Correct — this exemption reflects the limited scale scenario: offers to fewer than 150 natural or legal persons per Member State (excluding qualified investors) pose limited systemic risk.", "❌ Rights issues to existing shareholders may benefit from a different exemption.", "❌ A single institutional investor would be covered by the qualified investors exemption."],correct:1,slide:"Slide 11"},
{q:"The Prospectus Regulation requires the prospectus to remain publicly accessible for a minimum of:",opts:["Three years", "Five years", "Ten years", "Twenty years"],exps:["❌ Three years is below the minimum.", "❌ Five years is below the minimum.", "✅ Correct — the prospectus must remain publicly accessible for 10 years upon approval and is uploaded to ESMA's publicly searchable storage mechanism.", "❌ Twenty years is above the required period."],correct:2,slide:"Slide 11"},
{q:"The home State NCA has how long to review a standard prospectus submission?",opts:["5 business days for all submissions — a requirement applying to all public offers above the relevant threshold — a position that differs from the correct EU legal framework applicable in this context","10 business days for standard submissions; 20 business days for first-time issuers; 5 business days for frequent issuers with a URD — each request for additional information restarts a 5-day review period","30 calendar days for all submissions — applicable in all Member States under the maximum harmonisation approach — a description that applies to a different EU legal act, not the one relevant to this question","Only 3 business days for frequent issuers with a URD — as clarified by ESMA guidelines on prospectus disclosure requirements — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ 5 business days applies to reviews after additional information requests, not the initial standard submission.", "✅ Correct — 10 business days for standard submissions; 20 business days for first-time issuers; 5 business days for frequent issuers with a URD; each request for additional information restarts a 5-day review period.", "❌ 30 calendar days is not the standard review period.", "❌ 3 business days is not the URD frequent issuer review period; it is 5 business days."],correct:1,slide:"Slide 11"},
{q:"Risk factors in a prospectus must be:",opts:["Standard boilerplate warnings applicable to all investments in the asset class — as clarified by ESMA guidelines on prospectus disclosure requirements","Specific to the issuer or securities, classified by probability of occurrence and severity of impact — generic disclaimers and boilerplate lists are prohibited","Only listed if they represent a probability of occurrence above 50% — reflecting the investor protection objective of the Prospectus Regulation","Approved by the NCA as accurate before the prospectus is published — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ Standard boilerplate warnings are explicitly prohibited.", "✅ Correct — risk factors must be specific to the issuer or securities, classified by probability of occurrence and severity of impact; generic disclaimers and boilerplate lists are prohibited.", "❌ There is no 50% probability threshold.", "❌ The NCA examines completeness and comprehensibility but does not approve risk factors as 'accurate'."],correct:1,slide:"Slide 11"},
{q:"The 'base prospectus' option under the Prospectus Regulation is available to:",opts:["Any issuer seeking to simplify a large volume of equity offerings — a requirement introduced by the Lamfalussy Level 2 implementing measures","Only UCITS management companies issuing units in collective investment undertakings — a principle established in the foundational Regulation governing this area","Only sovereign issuers making frequent debt offerings — reflecting the maximum harmonisation approach adopted in this EU framework","Non-equity issuers who may draw up a base prospectus with generic information, with tranche-specific data supplied later in 'final terms' published on the designated website"],exps:["❌ The base prospectus option is for non-equity issuers, not equity issuers.","❌ UCITS units are excluded from the Prospectus Regulation.","❌ While sovereigns may use base prospectuses, the option is available to all non-equity issuers.","✅ Correct — for non-equity securities, issuers may elect to draw up a base prospectus containing generic information, with tranche-specific data supplied later in 'final terms'."],correct:3,slide:"Slide 11"}
,
{q:"Why does Regulation (EU) 2017/1129 (the Prospectus Regulation) treat certain resales as a separate 'offer to the public'?",opts:["Because secondary trading is always equivalent to primary issuance in terms of investor protection concerns — a requirement introduced by the Lamfalussy Level 2 implementing measures","Because any trading venue activity is automatically treated as a new and independent offer to the public — as confirmed by the CJEU in its consistent line of case law on this point","Because the 'offer' concept is intentionally wide and captures any communication presenting sufficient information for an investment decision, with each resale treated as a separate offer unless exempted","Because the Regulation requires a new prospectus for every transfer of securities between investors — a principle established in the foundational Regulation governing this area"],exps:["❌ Secondary trading is not always equivalent to primary issuance; the Regulation distinguishes between regulated secondary market transactions and resales that constitute new offers to the public.", "❌ Trading venue activity is not automatically treated as a new offer to the public; secondary market transactions on regulated markets are generally exempt.", "✅ Correct — the 'offer' concept is intentionally wide, capturing any communication presenting sufficient information on the terms of the offer and the securities to enable an investment decision. Consequently, each resale is treated as a separate offer to the public unless it falls within an applicable exemption.", "❌ The Regulation does not require a new prospectus for every transfer; many secondary market transactions are exempt from prospectus requirements."],correct:2,slide:"Slide 11"}
,
{q:"The Listing Act (Regulation (EU) 2024/2809) introduced a general EU-wide exemption from the prospectus requirement for offers below what total consideration threshold?",opts:["€1 million","€5 million","€8 million","€12 million"],exps:["❌ €1 million was the original minimum threshold; the Listing Act raised it significantly.","❌ €5 million is the national option threshold for Member States wishing to set a lower limit for domestic-only offers.","❌ €8 million was an earlier national discretion threshold.","✅ Correct — the Listing Act introduced a general EU-wide exemption for offers with total consideration under €12 million per offeror over 12 months."],correct:3,slide:"Slide 11"},
{q:"The EU Follow-on Prospectus, introduced by the Listing Act, is available to issuers who:",opts:["Are listing for the first time on any EU trading venue — as clarified by ESMA guidelines on prospectus disclosure requirements","Have securities admitted to trading on regulated markets or SME Growth Markets continuously for at least 18 months","Have a market capitalisation below €50 million — reflecting the investor protection objective of the Prospectus Regulation","Are issuing bonds only, not equity securities — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ First-time issuers use the standard prospectus or EU Growth Prospectus; the Follow-on Prospectus is for seasoned issuers.","✅ Correct — the EU Follow-on Prospectus (max 50 pages, 7-day approval) is available to issuers whose securities have been traded continuously on regulated markets or SME Growth Markets for at least 18 months.","❌ The Follow-on Prospectus is size-independent; the €50 million threshold does not define eligibility.","❌ The Follow-on Prospectus is not restricted to bonds."],correct:1,slide:"Slide 11"},
{q:"Under the Kolossa v Barclays (2015) CJEU judgment, where may investors in cross-border prospectus liability cases bring their claims?",opts:["Only before the courts of the Member State where the issuer is incorporated — as clarified by ESMA guidelines on prospectus disclosure requirements","Only before the CJEU in Luxembourg — a requirement applying to all public offers above the relevant threshold","Before courts of the investor's home Member State if objective connecting factors exist, even when the issuer is established abroad","Only through ESMA's arbitration mechanism — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ The Kolossa judgment expanded access for investors beyond the issuer's home courts.","❌ The CJEU does not adjudicate individual civil liability claims.","✅ Correct — Kolossa established that jurisdiction under Brussels I can lie with courts in the investor's home Member State if objective connecting factors exist, expanding cross-border investor access to remedies.","❌ ESMA has no arbitration mechanism for prospectus civil liability claims."],correct:2,slide:"Slide 11"},
{q:"A Universal Registration Document (URD) may be filed without prior competent authority approval (automatic filing) after:",opts:["The first year of using a URD","The first two financial years of use","The third year of use onward","At any time if the issuer is a large undertaking"],exps:["❌ The URD requires approval in the first two years; automatic filing begins after that.","❌ The first two years require prior approval, not automatic filing.","✅ Correct — from the third financial year onward, the URD may be filed without prior approval (though subject to ex-post review), enabling rapid market access for frequent issuers.","❌ Size does not determine when automatic URD filing becomes available; it is based on years of use."],correct:2,slide:"Slide 11"},
