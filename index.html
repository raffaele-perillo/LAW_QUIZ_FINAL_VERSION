{q:"ESMA is headquartered in which city and operates under which founding Regulation?",opts:["Frankfurt; Regulation 1092/2010","Paris; Regulation 1095/2010","London; Regulation 1093/2010","Brussels; Regulation 1094/2010"],exps:["❌ Frankfurt is where the ECB and EIOPA are based; Regulation 1092/2010 established the ESRB.","✅ Correct — ESMA is headquartered in Paris since 2011 and operates under Regulation 1095/2010.","❌ ESMA relocated from London to Paris; Regulation 1093/2010 established EBA.","❌ ESMA is based in Paris; Regulation 1094/2010 established EIOPA."],correct:1,slide:"Slide 04"},
{q:"ESMA's Board of Supervisors comprises:",opts:["The Chair, Executive Director, and six elected management board members","27 NCA heads with ultimate decision-making power","Representatives from the Commission, ECB, and Member State finance ministers","The three ESA chairs meeting jointly on cross-sectoral issues"],exps:["❌ Those are management board members, not the Board of Supervisors.","✅ Correct — the Board of Supervisors comprises 27 NCA heads and holds ultimate decision-making power.","❌ The Board of Supervisors comprises NCA heads, not Commission or ECB representatives.","❌ The three ESA chairs meeting describes the Joint Committee function."],correct:1,slide:"Slide 04"},
{q:"ESMA's Article 17 power enables it to:",opts:["Prohibit or restrict financial activities threatening market integrity — product intervention","Direct national supervisors or market participants when Union law is breached, ensuring compliance across jurisdictions","Engage in binding mediation to settle disputes between NCAs","Act decisively during declared emergencies"],exps:["❌ Product intervention (prohibiting or restricting activities) is Article 9(5).","✅ Correct — Article 17 empowers ESMA to direct national supervisors or market participants when Union law is breached.","❌ Binding mediation is Article 19.","❌ Acting during declared emergencies is Article 18."],correct:1,slide:"Slide 04"},
{q:"ESMA's Article 18 power enables it to:",opts:["Direct national supervisors or market participants when Union law is breached","Prohibit or restrict financial activities threatening market integrity","Act decisively during declared emergencies, coordinating responses to market stress and systemic threats","Engage in binding mediation to settle disputes between NCAs"],exps:["❌ Directing supervisors when Union law is breached is Article 17.","❌ Product intervention is Article 9(5).","✅ Correct — Article 18 allows ESMA to act decisively during declared emergencies, coordinating responses to market stress.","❌ Binding mediation is Article 19."],correct:2,slide:"Slide 04"},
{q:"ESMA's Article 9(5) power is notable because:",opts:["It is the standard mechanism for infringement proceedings against Member States","It permits prohibiting or restricting financial activities threatening market integrity or stability — ESMA is the only ESA authority to have activated this power","It enables binding mediation between national supervisors","It allows ESMA to directly supervise all credit rating agencies"],exps:["❌ Infringement proceedings are launched by the Commission under Article 258 TFEU.","✅ Correct — Article 9(5) permits prohibiting or restricting financial activities threatening market integrity or stability; ESMA is the only ESA to have activated this product intervention power.","❌ Binding mediation is Article 19.","❌ Direct supervision of credit rating agencies is one of ESMA's direct supervisory functions but not Article 9(5)."],correct:1,slide:"Slide 04"},
{q:"The EBA was relocated from London to Paris in which year, under which Regulation?",opts:["2016; Regulation 1093/2010","2019; Regulation 1093/2010","2019; Regulation 2019/2175","2021; Regulation 1093/2010"],exps:["❌ 2016 is when the Brexit referendum occurred, not when EBA relocated.","✅ Correct — the EBA was relocated from London to Paris in 2019. It operates under Regulation 1093/2010.","❌ While the relocation occurred in 2019, the founding Regulation is 1093/2010.","❌ EBA relocated in 2019, not 2021."],correct:1,slide:"Slide 04"},
{q:"Under MiCAR, EBA's new mandate includes:",opts:["Direct supervision of all crypto-asset service providers in the EU","Direct supervision of significant ART and EMT issuers above significance thresholds — the first time EBA becomes a direct supervisor","Supervision of all utility token issuers across the EU","Supervision only of crypto-asset trading platforms registered under MiCAR"],exps:["❌ Crypto-asset service providers are supervised by NCAs and ESMA for significant ones.","✅ Correct — MiCAR grants EBA direct supervision of significant ART and EMT issuers, marking the first time EBA becomes a direct supervisor, mirroring ESMA's model.","❌ Utility token issuers are not under EBA's direct supervision.","❌ Trading platforms are subject to national or ESMA supervision, not EBA."],correct:1,slide:"Slide 04"},
{q:"EIOPA is headquartered in which city and covers which sectors?",opts:["Paris; banking and investment services","Frankfurt am Main; insurance, reinsurance, institutions for occupational retirement provision, and financial conglomerates","Brussels; capital markets and investment funds","Luxembourg; securities and derivatives markets"],exps:["❌ Paris is where ESMA and EBA are based.","✅ Correct — EIOPA is headquartered in Frankfurt am Main under Regulation 1094/2010 and covers insurance, reinsurance, IORPs, insurance intermediaries, and financial conglomerates.","❌ Capital markets and investment funds are ESMA's mandate.","❌ Luxembourg is where the CJEU is based."],correct:1,slide:"Slide 04"},
{q:"The Banking Union comprises which three pillars?",opts:["ESMA, EBA, and EIOPA","Single Supervisory Mechanism (SSM), Single Resolution Mechanism (SRM), and European Deposit Insurance Scheme (EDIS — proposed)","European Central Bank, European Stability Mechanism, and EDIS","SSM, ESRB, and SRM"],exps:["❌ ESMA, EBA, and EIOPA are the three ESAs, not the Banking Union pillars.","✅ Correct — the Banking Union pillars are the SSM, SRM, and EDIS (proposed).","❌ The European Stability Mechanism is not a Banking Union pillar.","❌ The ESRB is not a Banking Union pillar."],correct:1,slide:"Slide 04"},
{q:"The ESRB is responsible for:",opts:["Direct supervision of systemically important banks in the euro area","Macro-prudential oversight, detecting and mitigating systemic threats through risk warnings and recommendations","Developing technical standards for financial regulation across all sectors","Approving all Level 2 delegated acts in the financial sector"],exps:["❌ Direct supervision of systemically important banks is the SSM/ECB's role.","✅ Correct — the ESRB is responsible for macro-prudential oversight, established by Regulation 1092/2010, hosted by ECB but institutionally independent.","❌ Developing technical standards is done by the three ESAs.","❌ Approving Level 2 delegated acts is the Commission's role."],correct:1,slide:"Slide 04"},
{q:"The Board of Appeal shared by EBA, ESMA and EIOPA is best described as:",opts:["An optional alternative to judicial review","A mandatory intermediate layer before the General Court with full jurisdiction over ESA decisions, able to confirm, amend or replace contested measures","A purely advisory body with no power to modify ESA decisions","A political body composed of EU institutional representatives"],exps:["❌ The Board of Appeal is mandatory, not optional.","✅ Correct — it is a mandatory intermediate layer before the General Court, with full jurisdiction to confirm, amend, or replace ESA decisions.","❌ The Board of Appeal has real decisional power.","❌ It comprises experts in banking, insurance, or securities law with demonstrated expertise — not a political body."],correct:1,slide:"Slide 04"},
{q:"AMLA (European Anti-Money Laundering Authority) was established by which Regulation and is based where?",opts:["Regulation 1095/2010; Paris","Regulation 2024/1620; Frankfurt am Main","Regulation 1093/2010; Paris","Regulation 1092/2010; Frankfurt am Main"],exps:["❌ Regulation 1095/2010 established ESMA.","✅ Correct — AMLA was established by Regulation 2024/1620 and is based in Frankfurt am Main.","❌ Regulation 1093/2010 established EBA.","❌ Regulation 1092/2010 established the ESRB."],correct:1,slide:"Slide 04"},
{q:"The pre-2001 state of EU financial supervision was characterised by:",opts:["A centralised EU-level supervisory system with uniform procedures","Supervisory competence residing solely with national authorities, creating fragmented systems with differing procedures and enforcement powers","A network of ESAs coordinating with national supervisors","ESMA having direct supervisory powers over all capital market participants"],exps:["❌ There was no centralised EU supervisory system before 2001.","✅ Correct — before 2001, supervisory competence resided solely with national authorities, creating fragmented, differing systems.","❌ The ESA network was created in 2011.","❌ ESMA was established in 2011."],correct:1,slide:"Slide 04"},
{q:"The De Larosière group was significant because:",opts:["It proposed the Lamfalussy process for capital markets regulation in 2001","It recommended comprehensive supervisory upgrade across all financial sectors following the 2008 financial crisis, leading to the creation of the ESAs in 2011","It established AMLA as the EU's anti-money laundering authority","It drafted the first EU framework for crypto-assets"],exps:["❌ The Lamfalussy process was proposed by the Committee of Wise Men in 2001.","✅ Correct — the De Larosière group recommended a comprehensive supervisory upgrade following the 2008 financial crisis, leading to the three ESAs in 2011.","❌ AMLA was established by Regulation 2024/1620, not by the De Larosière group.","❌ The De Larosière group preceded MiCAR."],correct:1,slide:"Slide 04"},
{q:"The Joint Committee of ESAs serves which function?",opts:["It replaces the three individual ESA boards for all financial regulation","It is the central forum for cross-sectoral issues — anti-money laundering, PRIIPs, cloud outsourcing, securitisation — issuing common guidance across banking, capital markets, and insurance","It directly supervises significant financial institutions across all three sectors","It advises the Commission on all Level 1 legislative proposals"],exps:["❌ The Joint Committee supplements, does not replace, the individual ESA boards.","✅ Correct — the Joint Committee is the central forum for cross-sectoral issues, issuing common guidance on AML, PRIIPs, cloud outsourcing, securitisation.","❌ Direct supervision of significant institutions is done by individual ESAs and NCAs.","❌ The Joint Committee does not primarily advise on Level 1 legislative proposals."],correct:1,slide:"Slide 04"},
{q:"The future direction of EU financial supervision involves which trend?",opts:["Progressive decentralisation returning supervisory powers to national authorities","Progressive selective centralisation — transfer of direct supervisory powers to EU-level institutions for areas with significant cross-border externalities","Elimination of the three ESAs and replacement with a single unified supervisor","Reduction of ESMA's mandate to focus exclusively on capital markets"],exps:["❌ The trend is towards centralisation, not decentralisation.","✅ Correct — recent developments signal deepening integration with expanding direct supervisory powers for ESMA, EBA's crypto mandate, and enhanced cross-sectoral coordination.","❌ There are no proposals to eliminate the three ESAs.","❌ ESMA's mandate is expanding, not being reduced."],correct:1,slide:"Slide 04"},
{q:"ESMA's direct supervisory functions include which entities?",opts:["All investment firms and credit institutions in the EU","Trade repositories under EMIR and SFTR, credit rating agencies, EU administrators of critical benchmarks, significant crypto-asset service providers under MiCAR, and DLT market infrastructures","All regulated markets and multilateral trading facilities in the EU","All investment funds and their managers across the EU"],exps:["❌ All investment firms and credit institutions are supervised by national authorities (and the ECB for significant banks).","✅ Correct — ESMA directly supervises trade repositories, credit rating agencies, EU critical benchmark administrators, significant CASPs under MiCAR, and DLT market infrastructures.","❌ Regulated markets and MTFs are supervised by national competent authorities.","❌ Investment funds and their managers are supervised by national authorities."],correct:1,slide:"Slide 04"}
,
{q:"Regarding the European System of Financial Supervision (ESFS), which of the following is correct?",opts:["It was conceived by the de Larosière Report as a structure within the Single Supervisory Mechanism", "The Joint Committee of ESAs is responsible for micro-prudential supervision", "It focuses on micro-prudential supervision, whereas the ESRB focuses on macro-prudential supervision", "It is structured within the ESRB and directly accountable to it"],exps:["❌ The de Larosière Report conceived the ESFS as a structure involving three ESAs and the ESRB — not specifically within the SSM (the SSM was created later in 2014).", "❌ The Joint Committee of ESAs is responsible for cross-sectoral issues, not specifically for micro-prudential supervision. Micro-prudential supervision is the responsibility of individual ESAs and national competent authorities.", "✅ Correct — the ESFS covers micro-prudential supervision through the three ESAs (ESMA, EBA, EIOPA) and national competent authorities, while the ESRB focuses on macro-prudential oversight to prevent systemic risk.", "❌ The ESFS is not structured within the ESRB; the ESRB is a separate body responsible for macro-prudential oversight, hosted by the ECB but institutionally independent."],correct:2,slide:"Slide 04"}
,
{q:"The European Systemic Risk Board (ESRB), established by Regulation 1092/2010, is responsible for:",opts:["Directly supervising systemically important banks in the euro area","Macro-prudential oversight, detecting and mitigating systemic threats through risk warnings and recommendations","Drafting regulatory technical standards for capital requirements","Granting authorization to credit institutions across the EU"],exps:["❌ Direct supervision of systemic banks is the SSM's role under the ECB.","✅ Correct — the ESRB is responsible for macro-prudential oversight of the EU financial system, detecting and mitigating systemic risks through warnings and recommendations.","❌ RTS drafting is the role of EBA, ESMA, and EIOPA.","❌ Authorization of credit institutions is a national competent authority function."],correct:1,slide:"Slide 04"},
{q:"The Banking Union's three pillars are:",opts:["EBA, ESMA, and EIOPA","Single Supervisory Mechanism (SSM), Single Resolution Mechanism (SRM), and European Deposit Insurance Scheme (EDIS — proposed)","European Financial Stability Facility, European Stability Mechanism, and the ECB","ESRB, ESAs, and the Joint Committee"],exps:["❌ EBA, ESMA, and EIOPA are the three ESAs, not the Banking Union pillars.","✅ Correct — the Banking Union consists of the SSM, the SRM, and the proposed EDIS.","❌ These are crisis-management mechanisms, not Banking Union pillars.","❌ These form part of the ESFS, not the Banking Union."],correct:1,slide:"Slide 04"},
{q:"AMLA — the European Anti-Money Laundering Authority — is based in which city and was established by which Regulation?",opts:["Paris; Regulation 1095/2010","Frankfurt am Main; Regulation 2024/1620","Luxembourg; Regulation 2023/1114","Brussels; Regulation 2019/2033"],exps:["❌ Paris is where ESMA is based; Regulation 1095/2010 established ESMA.","✅ Correct — AMLA is based in Frankfurt am Main and was established by Regulation 2024/1620, representing a paradigm shift in EU AML/CFT institutional architecture.","❌ Luxembourg hosts the CJEU; Regulation 2023/1114 is MiCAR.","❌ Brussels hosts several EU institutions; Regulation 2019/2033 is the IFR for investment firms."],correct:1,slide:"Slide 04"},
{q:"EIOPA is headquartered in which city and operates under which founding Regulation?",opts:["Paris; Regulation 1095/2010","Frankfurt am Main; Regulation 1094/2010","Brussels; Regulation 1093/2010","London; Regulation 1092/2010"],exps:["❌ Paris; Regulation 1095/2010 describes ESMA.","✅ Correct — EIOPA is headquartered in Frankfurt am Main under Regulation 1094/2010, covering insurance and occupational pensions.","❌ Brussels; Regulation 1093/2010 describes the EBA's current situation (though EBA relocated to Paris in 2019).","❌ London; Regulation 1092/2010 describes ESRB, which is hosted by the ECB in Frankfurt. EIOPA was never in London."],correct:1,slide:"Slide 04"},
{q:"The Joint Committee of the ESAs serves which main function?",opts:["Acts as the appellate body for decisions taken by ESMA, EBA, and EIOPA","Acts as a central forum for cross-sectoral issues cutting across banking, capital markets, and insurance","Directly supervises pan-European market infrastructures on behalf of all three ESAs","Sets binding interest rates for the euro area"],exps:["❌ The appellate function belongs to the shared Board of Appeal, not the Joint Committee.","✅ Correct — the Joint Committee of the ESAs is a cross-sectoral forum addressing issues spanning banking, capital markets, and insurance, including work on AML, PRIIPs, cloud outsourcing, and securitisation.","❌ Direct supervision of market infrastructures is primarily ESMA's function.","❌ Interest rates are set by the ECB Governing Council."],correct:1,slide:"Slide 04"},
{q:"The Board of Appeal serving all three ESAs consists of how many members and alternates, and serves what purpose?",opts:["27 members, one per Member State, deciding binding arbitration","Six members and six alternates with proven expertise in banking, insurance or securities law, providing independent review of ESA decisions before General Court appeal","Three members, one from each ESA, deciding on supervisory convergence","Nine members appointed by the European Council for 10-year terms"],exps:["❌ 27 members describes the composition of the ESA Boards of Supervisors (one NCA head per Member State).","✅ Correct — the shared Board of Appeal has six members and six alternates with proven expertise, providing a mandatory intermediate layer of independent review before parties can appeal to the General Court.","❌ One member per ESA would undermine the independence of the review body.","❌ The Board of Appeal is not appointed by the European Council and serves 5-year renewable terms."],correct:1,slide:"Slide 04"},
{q:"ESMA's Article 19 power enables it to:",opts:["Prohibit or restrict financial activities threatening market integrity","Direct national supervisors or market participants when Union law is breached","Act decisively during declared emergencies","Engage in binding mediation to settle disputes between NCAs"],exps:["❌ Prohibiting/restricting activities is Article 9(5) product intervention.","❌ Directing supervisors/participants for Union law breaches is Article 17.","❌ Acting during declared emergencies is Article 18.","✅ Correct — Article 19 empowers ESMA to engage in binding mediation to settle disputes between national competent authorities, promoting consistent supervisory approaches across borders."],correct:3,slide:"Slide 04"},
{q:"Under the 2015 SIU proposals, which function is proposed to be transferred to ESMA as a signal toward a 'single supervisor' model?",opts:["Direct supervision of all credit institutions in the euro area","Prospectus approval, market abuse surveillance, and consolidated tape oversight","Setting capital requirements for investment firms","Administering the ESRB risk warning mechanism"],exps:["❌ Credit institution supervision is an SSM/ECB function.","✅ Correct — the SIU package proposes transferring prospectus approval, market abuse surveillance, and consolidated tape oversight to ESMA, signalling a shift toward a single supervisor model for cross-border activities.","❌ Capital requirements for investment firms are set by the IFR/IFD framework, not ESMA directly.","❌ The ESRB warning mechanism is not part of the ESMA centralisation proposals."],correct:1,slide:"Slide 04"},
{q:"In the de Larosière Report (2009), the group recommended:",opts:["Abolishing national supervisors and replacing them with a single EU super-regulator","A comprehensive supervisory upgrade across all financial sectors, leading to the creation of the ESAs","Transferring all supervisory powers to the ECB immediately","Extending the Lamfalussy process to cover only banking supervision"],exps:["❌ The de Larosière Report did not recommend abolishing national supervisors; national authorities remained central to the ESFS.","✅ Correct — the de Larosière group recommended a comprehensive upgrade creating the three sectoral ESAs (ESMA, EBA, EIOPA) as part of the European System of Financial Supervision.","❌ Transferring all powers to the ECB was not the recommendation; direct banking supervision came later via the SSM.","❌ The de Larosière Report recommended upgrading supervision across all financial sectors, not restricting it to banking."],correct:1,slide:"Slide 04"},
{q:"Which of the following is NOT a direct supervisory function of ESMA?",opts:["Credit rating agencies","EU administrators of critical benchmarks","Tier 2 third-country CCPs","Direct supervision of all investment firms in the EU"],exps:["❌ ESMA does directly supervise credit rating agencies — this is one of its established direct powers.","❌ ESMA directly supervises EU administrators of critical benchmarks — another established direct function.","❌ ESMA does directly supervise Tier 2 third-country CCPs under EMIR 2.2.","✅ Correct — ESMA does not directly supervise all EU investment firms; those are supervised by national competent authorities. ESMA's direct powers are specific and targeted."],correct:3,slide:"Slide 04"},
{q:"EBA's supervisory convergence toolkit includes which of the following activities?",opts:["Directly authorising all credit institutions in the EU","Chairing and organising colleges of supervisors, conducting peer reviews, performing biennial EU-wide stress tests, and issuing binding mediation recommendations","Setting binding interest rates for euro-area credit institutions","Directly supervising all investment firms under MiFID II"],exps:["❌ Direct authorisation of credit institutions remains with national competent authorities.","✅ Correct — EBA's convergence tools include: chairing supervisor colleges, peer reviews of NCAs, disseminating best practices, binding mediation, and biennial EU-wide stress tests assessing banking resilience.","❌ Interest rates are set by the ECB, not EBA.","❌ Direct supervision of investment firms under MiFID II is an NCA function; EBA focuses on credit institutions."],correct:1,slide:"Slide 04"},
{q:"The proposed transfer of supervisory mandates to ESMA under the Savings and Investments Union signals a shift toward which model for cross-border activities?",opts:["A fully decentralised model where each Member State retains complete supervisory autonomy","A 'single supervisor' model for areas with significant cross-border externalities, with ESMA receiving direct powers over prospectus approval, market abuse surveillance, and consolidated tape oversight","A Banking Union-style model where the ECB takes over all securities supervision","An informal peer review model replacing formal supervisory powers"],exps:["❌ The SIU proposals explicitly move away from full decentralisation for cross-border activities.","✅ Correct — the SIU package proposes transferring prospectus approval, market abuse surveillance, and consolidated tape oversight to ESMA, signalling a shift toward a 'single supervisor' model for activities with significant cross-border externalities.","❌ The ECB's supervisory role is limited to banking (SSM); ESMA would receive the proposed capital markets powers.","❌ The proposals involve formal legislative transfer of powers, not informal peer review."],correct:1,slide:"Slide 04"}],
"05 — Savings & Investments Union":[
{q:"The three critical problems caused by fragmentation of EU capital markets are:",opts:["Lack of supervisory convergence, absence of soft law, and insufficient ESA powers","Inflated cost of capital, discouraged cross-border investment, and enforcement asymmetries between Member States","Excessive gold-plating, insufficient mutual recognition, and absence of a passporting regime","Over-regulation of retail investors, lack of financial literacy, and inadequate pension systems"],exps:["❌ Supervisory convergence and ESA powers are separate issues.","✅ Correct — the three critical problems are: inflated cost of capital (duplicated disclosures deter equity market access), discouraged investment (different regimes depress cross-border allocation), and enforcement asymmetries (creating regulatory arbitrage).","❌ These are related concepts but not the three specific critical fragmentation problems identified.","❌ Retail investor issues and pension systems are discussed separately."],correct:1,slide:"Slide 05"},
{q:"The aspiration to create 'an area without internal frontiers' first appeared in which treaty and is now codified where?",opts:["The Maastricht Treaty (1992); Article 63 TFEU","The Treaty of Rome (1957); Article 26 TFEU","The Treaty of Lisbon (2009); Article 49 TFEU","The Treaty of Amsterdam (1997); Article 56 TFEU"],exps:["❌ While Article 63 TFEU governs capital freedom, the aspiration for an area without internal frontiers first appeared in the Treaty of Rome (1957).","✅ Correct — the aspiration first appeared in the Treaty of Rome (1957) and is now codified in Article 26 TFEU.","❌ The Treaty of Lisbon introduced the TFEU; Article 49 covers freedom of establishment.","❌ The Treaty of Amsterdam is not the source of this aspiration."],correct:1,slide:"Slide 05"},
{q:"The Gebhard proportionality test, as applied to measures derogating from fundamental freedoms, requires that measures:",opts:["Be approved by the European Commission and notified to ESMA before entering into force","Pursue legitimate objectives, apply without discrimination, be suitable for achieving goals, and go no further than necessary — four cumulative conditions","Be adopted through the ordinary legislative procedure and subject to a parliamentary vote","Be consistent with mutual recognition and home-country control principles"],exps:["❌ The Gebhard test is a judicial proportionality standard; it does not require prior Commission approval.","✅ Correct — the four-part Gebhard test: legitimate objectives, non-discrimination, suitable for achieving goals, and going no further than necessary.","❌ The Gebhard test applies to national measures reviewed by courts.","❌ Mutual recognition and home-country control are integration techniques, not the Gebhard test."],correct:1,slide:"Slide 05"},
{q:"'Negative integration' as an EU capital markets integration technique is best described as:",opts:["Directives establishing common standards but allowing Member States to impose additional requirements","Treaty freedoms enforced through Court of Justice review under non-discrimination and proportionality principles — proved insufficient to overcome deeply rooted national divergences","Directives and Regulations applying uniformly, leaving little room for gold-plating","The passporting regime enabling single authorisation for cross-border services"],exps:["❌ Directives allowing additional requirements describes 'Mutual Recognition' (1980s–1990s).","✅ Correct — negative integration means Treaty freedoms enforced through CJEU review; it proved insufficient to overcome national divergences in company, property, and contract laws.","❌ Uniform application leaving little room for gold-plating describes 'Maximum Harmonisation' (post-2008).","❌ The passporting regime is a product of positive integration through legislation."],correct:1,slide:"Slide 05"},
{q:"The passporting regime is best described as:",opts:["A system requiring firms to obtain separate licences in each Member State where they wish to operate","A principle establishing that once an undertaking is licensed in its home Member State, it may carry on the same activity throughout the EU without needing further licences","A supervisory mechanism giving host country authorities primary responsibility for ongoing prudential oversight","A mutual recognition agreement applying only to banking institutions"],exps:["❌ Requiring separate licences in each Member State is precisely what the passporting regime eliminates.","✅ Correct — the passporting regime means once an undertaking is licensed in its home Member State (satisfying common requirements once), it may carry on the same activity throughout the EU without further licences.","❌ Primary responsibility for ongoing prudential oversight lies with the home country authority.","❌ The passporting regime applies broadly across financial services, not only banking."],correct:1,slide:"Slide 05"},
{q:"Under the passporting regime, how long does a firm wait before beginning cross-border operations after notifying its home supervisor?",opts:["30 calendar days, then host authority must approve or reject","10 working days from the supervisor forwarding the notification dossier to host authorities — no separate permit required","Until the host authority issues a formal acknowledgment — no fixed deadline","6 months during which the host authority conducts a full suitability assessment"],exps:["❌ The timeframe is 10 working days, not 30 calendar days.","✅ Correct — firms inform home supervisors; the supervisor forwards a notification dossier to host authorities. Within 10 working days, the firm may begin operations — no separate permit required.","❌ There is a fixed 10-working-day deadline.","❌ A 6-month suitability assessment contradicts the passporting regime's efficiency purpose."],correct:1,slide:"Slide 05"},
{q:"Under the supervisory division of labour in the passporting regime, which is a function of the HOST country authority?",opts:["Conducting full-scope prudential and conduct supervision of the passporting firm","Investigating breaches regardless of where in the Union they occur","Imposing sanctions on the passporting undertaking","Enforcing general law applicable to all market participants and reacting to immediate threats to financial stability or investor protection"],exps:["❌ Full-scope prudential and conduct supervision is the HOME country authority's role.","❌ Investigating breaches regardless of location is the HOME country authority's role.","❌ Imposing sanctions on the undertaking is the HOME country authority's role.","✅ Correct — the host country enforces general law applicable to all market participants and reacts to immediate threats, in cooperation with the home supervisor."],correct:3,slide:"Slide 05"},
{q:"The Capital Markets Union (CMU) was announced in which year and by whom?",opts:["In 2008 by the ECB in response to the global financial crisis","In 2015 as a flagship European Commission project","In 2020 by the European Parliament as part of the COVID-19 recovery package","In 2017 as part of the Lamfalussy process reform"],exps:["❌ The CMU was a 2015 Commission project, not a 2008 ECB initiative.","✅ Correct — the CMU was announced in 2015 as a flagship European Commission project seeking to establish a genuine single market for capital.","❌ While the 2020 Action Plan was launched amid COVID-19 recovery, the CMU itself began in 2015.","❌ The CMU is a Commission initiative, not a Lamfalussy process reform."],correct:1,slide:"Slide 05"},
{q:"The 2020 CMU Action Plan is notable because, by re-instating several 2015 and 2017 objectives, it:",opts:["Confirmed the full success of previous CMU action plans","Confirmed partial failure of previous efforts, prompting the Savings and Investments Union project","Replaced the passporting regime with a new system of direct EU-level authorisation","Eliminated the need for Member State implementation by converting all CMU measures into Regulations"],exps:["❌ Re-instating previous objectives indicates those objectives had not been achieved.","✅ Correct — by re-instating several 2015 and 2017 objectives, the 2020 Action Plan confirmed partial failure of previous efforts, prompting the evolution toward the Savings and Investments Union.","❌ The 2020 Action Plan did not replace the passporting regime.","❌ Converting all measures into Regulations was not a specific outcome of the 2020 Action Plan."],correct:1,slide:"Slide 05"},
{q:"According to the slides, what percentage of banked citizens in ten surveyed countries had invested in financial products?",opts:["About 50%, indicating strong retail investor participation","Just over a quarter (28%), indicating disappointingly low retail investor involvement","Nearly three-quarters (72%), showing Europe's high saving rate translating into investment","About 40%, with most investing in government bonds"],exps:["❌ 50% would indicate moderate participation; the figure is much lower.","✅ Correct — just over a quarter (28%) of banked citizens had invested in financial products, with another 25% either actively looking to invest or interested.","❌ 72% is not the retail investor participation rate cited.","❌ 40% is not the figure cited; the slides report 28%."],correct:1,slide:"Slide 05"},
{q:"The 2023 Retail Investment Package adopted by the Commission consists of:",opts:["A new standalone Directive on retail investor protection and a Regulation establishing a European retail investor label","An amending Directive revising MiFID II, IDD, UCITS Directive, AIFMD, and Solvency II; an amending Regulation revising the PRIIPs Regulation; and ongoing financial literacy initiatives","A Regulation directly applicable in all Member States replacing MiFID II and PRIIPs entirely","A soft law package of ESA guidelines and Q&As addressed to national supervisors"],exps:["❌ The 2023 package does not create a standalone Directive or retail investor label.","✅ Correct — the 2023 Retail Investment Package consists of: an amending Directive revising MiFID II, IDD, UCITS, AIFMD, and Solvency II; an amending Regulation revising PRIIPs; and ongoing financial literacy initiatives.","❌ The package amends MiFID II and PRIIPs but does not replace them entirely.","❌ The 2023 Retail Investment Package is legislative (Directive and Regulation), not soft law."],correct:1,slide:"Slide 05"},
{q:"The SIU was named in 2025 to replace the CMU. According to the slides, how much household wealth remains in low-yield deposits?",opts:["More than €1 trillion, with €800 billion potentially redirectable","More than €10 trillion, with €8 trillion potentially redirectable if European savers' asset mix converged with US peers","Approximately €5 trillion, equally distributed across euro-area Member States","More than €20 trillion, mostly held by institutional investors"],exps:["❌ The slides report a much larger figure of more than €10 trillion.","✅ Correct — more than €10 trillion of household wealth remains in low-yield deposits; economists estimate €8 trillion could be redirected if European savers' asset mix converged with US peers.","❌ €5 trillion equally distributed is not the figure cited.","❌ The slides report €10+ trillion, not €20 trillion."],correct:1,slide:"Slide 05"},
{q:"Which of the following correctly describes Pillar 1 ('Citizens and Savings') of the four SIU pillars?",opts:["Addressing capital shortage for start-ups and scale-ups by clarifying prudential incentives for insurers and pension funds","Building trust, literacy, and attractive entry points through European savings and investment accounts, tax recommendations, reinforced Retail Investment Strategy, and Union-wide financial literacy targets","Targeting market-structure barriers through trading and post-trading legislative packages and removal of gold-plating in fund distribution","Pursuing balance between national competence and Union-level convergence, with ESMA receiving stronger supervisory powers"],exps:["❌ Addressing capital shortage for start-ups describes Pillar 2 (Investments and Financing).","✅ Correct — Pillar 1 (Citizens and Savings) builds trust, literacy, and attractive entry points through European savings accounts, tax recommendations, reinforced Retail Investment Strategy, and financial literacy targets.","❌ Targeting market-structure barriers describes Pillar 3 (Integration and Scale).","❌ Pursuing balance between national and EU-level competence describes Pillar 4 (Efficient Supervision)."],correct:1,slide:"Slide 05"},
{q:"The SIU–EMU relationship is best described as:",opts:["Competitive: the SIU aims to replace EMU as the primary framework for economic integration","Mutually reinforcing: EMU removes exchange-rate risk and enlarges markets for securities; SIU builds legal frameworks enabling cross-border capital flows; together they enhance resilience","Irrelevant: EMU governs monetary policy while SIU governs fiscal policy with no interaction","Hierarchical: EMU is subordinate to the SIU"],exps:["❌ The SIU does not seek to replace EMU; they are complementary and mutually reinforcing.","✅ Correct — the relationship is mutually reinforcing: EMU removes exchange-rate risk; SIU builds legal and supervisory frameworks; resulting capital flows smooth shocks and strengthen monetary union resilience.","❌ The slides describe a circular, symbiotic relationship between EMU and SIU.","❌ The slides describe EMU and SIU as complementary equals in a virtuous cycle."],correct:1,slide:"Slide 05"},
{q:"Between 2013 and 2023, US venture capital funds raised how much more capital than European counterparts?",opts:["Twice as much","Three times as much","Five times as much","Seven times as much"],exps:["❌ The gap is significantly larger than twice.","❌ Three times is not the figure cited.","❌ Five times is not the figure cited.","✅ Correct — between 2013 and 2023, US venture capital funds raised seven times more capital than European counterparts."],correct:3,slide:"Slide 05"},
{q:"'Maximum Harmonisation' as an integration technique (post-2008) differs from 'Mutual Recognition' (1980s–1990s) because:",opts:["Maximum Harmonisation requires full uniform rules; Mutual Recognition allowed Member States to impose additional requirements","Mutual Recognition established common standards but allowed Member States to impose additional requirements; Maximum Harmonisation applies uniformly, leaving little room for gold-plating and converting segmented regimes into one European market","Maximum Harmonisation was the first technique used, later replaced by Mutual Recognition after the financial crisis","Both techniques are identical; the distinction is purely terminological"],exps:["❌ This reverses the descriptions.","✅ Correct — Mutual Recognition allowed additional national requirements (leading to fragmentation); Maximum Harmonisation applies uniformly, converting nationally segmented regimes into one European market.","❌ The chronological order is reversed: Mutual Recognition preceded Maximum Harmonisation.","❌ The two techniques are substantively different."],correct:1,slide:"Slide 05"},
{q:"The 'critical success factor' for the SIU identified in the slides is:",opts:["The development of a digital euro to replace fragmented national payment systems","Achieving full tax harmonisation across all EU Member States","Sustained political commitment within the Union's overarching capital markets agenda — success depends on sustained political will and legislative courage","The creation of a single EU sovereign bond to deepen capital markets"],exps:["❌ The digital euro is a separate monetary initiative.","❌ Full tax harmonisation is a persistent challenge not identified as the critical success factor.","✅ Correct — the SIU may prove decisive only if it succeeds in anchoring strong political commitment; whether reforms fill Europe's chronic equity gaps depends on sustained political will and legislative courage.","❌ A single EU sovereign bond is not identified as the critical success factor."],correct:2,slide:"Slide 05"},
{q:"The four SIU pillars work as:",opts:["Competing initiatives where Member States may choose which to implement","Mutually reinforcing components to create deep, liquid, and resilient capital markets","Sequential steps where each pillar must be completed before the next begins","Optional enhancements to the existing CMU framework with no binding force"],exps:["❌ The four pillars are not competing; they are complementary.","✅ Correct — the four pillars (Citizens and Savings; Investments and Financing; Integration and Scale; Efficient Supervision) work as mutually reinforcing components.","❌ The pillars are not sequential; they are pursued simultaneously.","❌ The SIU pillars are the core strategic framework, not optional enhancements."],correct:1,slide:"Slide 05"}
,
{q:"'Negative integration' as an EU capital markets technique proved insufficient because:",opts:["It was too aggressive in eliminating national barriers", "Treaty freedoms enforced through CJEU review could not overcome deeply rooted divergences in national company, property, and contract laws", "It was not legally binding on Member States", "It applied only to banking services and not to capital markets"],exps:["❌ Negative integration was actually not aggressive enough — it relied on Court review rather than positive legislative action.", "✅ Correct — negative integration (Treaty freedoms enforced through CJEU review under non-discrimination and proportionality principles) proved insufficient to overcome deeply rooted divergences in national company, property, and contract laws.", "❌ Treaty freedoms ARE legally binding; the problem was their limited practical effect on national law divergences.", "❌ Negative integration applied to all fundamental freedoms, not only banking."],correct:1,slide:"Slide 05"},
{q:"The 2017 CMU Mid-Term Review introduced which targeted adjustments?",opts:["Launched the CMU initiative and established its foundational strategy", "Strengthening ESMA's supervisory role, introducing proportionate listing regimes for SMEs, promoting digital finance and innovation, and streamlining cross-border distribution", "Launched amid COVID-19 recovery, emphasising cross-border harmonisation and enhanced SME funding", "Created a European Single Access Point for financial information"],exps:["❌ Launching the CMU initiative and foundational strategy describes the 2015 Action Plan.", "✅ Correct — the 2017 Mid-Term Review introduced targeted adjustments: strengthening ESMA's supervisory role, proportionate listing regimes for SMEs, promoting digital finance and innovation, and streamlining cross-border distribution.", "❌ Launching amid COVID-19 recovery describes the 2020 Action Plan.", "❌ Creating the European Single Access Point was part of the 2020 Action Plan."],correct:1,slide:"Slide 05"},
{q:"Pillar 2 ('Investments and Financing') of the SIU addresses capital shortage for start-ups and scale-ups by:",opts:["Building trust, literacy, and attractive entry points through European savings and investment accounts", "Clarifying prudential incentives for insurers and pension funds, upgrading EuVeCA, simplifying securitisation rules, and creating frameworks for intermittent private share trading", "Targeting market-structure barriers through trading and post-trading legislative packages", "Pursuing balance between national competence and Union-level convergence with stronger ESMA supervisory powers"],exps:["❌ Building trust, literacy, and savings accounts describes Pillar 1 (Citizens and Savings).", "✅ Correct — Pillar 2 (Investments and Financing) addresses capital shortage by clarifying prudential incentives for insurers and pension funds, upgrading EuVeCA, simplifying securitisation rules, and creating frameworks for intermittent private share trading.", "❌ Targeting market-structure barriers describes Pillar 3 (Integration and Scale).", "❌ Pursuing balance with stronger ESMA powers describes Pillar 4 (Efficient Supervision)."],correct:1,slide:"Slide 05"},
{q:"Pillar 4 ('Efficient Supervision') of the SIU pursues:",opts:["Building trust and literacy through European savings accounts and tax recommendations", "Addressing capital shortage for start-ups by clarifying prudential incentives for insurers", "Targeting market-structure barriers through legislative packages on trading and post-trading infrastructures", "Balance between national competence and Union-level convergence — ESMA receives stronger, possibly direct, supervisory powers; European Semester monitors Member State progress; like risks overseen by like rules"],exps:["❌ Building trust and literacy describes Pillar 1 (Citizens and Savings).", "❌ Addressing capital shortage for start-ups describes Pillar 2 (Investments and Financing).", "❌ Targeting market-structure barriers describes Pillar 3 (Integration and Scale).", "✅ Correct — Pillar 4 (Efficient Supervision) pursues balance between national competence and Union-level convergence, with ESMA receiving stronger supervisory powers, the European Semester monitoring Member State progress, and like risks being overseen by like rules."],correct:3,slide:"Slide 05"},
{q:"The 2025 Competitiveness Compass renamed the CMU as the SIU based on reports by:",opts:["Mario Draghi and Christine Lagarde", "Enrico Letta and Mario Draghi", "Jean-Claude Juncker and Mario Draghi", "Pascal Donohoe and Enrico Letta"],exps:["❌ Christine Lagarde is the ECB President; she did not author the reports that prompted the SIU renaming.", "✅ Correct — the 2025 Competitiveness Compass, drawing on reports by Enrico Letta and Mario Draghi, renamed the CMU as the Savings and Investments Union.", "❌ Jean-Claude Juncker launched the CMU in 2015 but was not the author of the reports prompting the SIU renaming.", "❌ Pascal Donohoe is the Eurogroup President; he did not author the key reports."],correct:1,slide:"Slide 05"},
{q:"Cross-border risk-sharing under the SIU-EMU symbiosis works by:",opts:["Transferring fiscal resources between Member States through the EU budget", "When savers in one country hold equity and debt claims issued in another, losses from local recessions are cushioned by income from the rest of the currency area", "Requiring all EU companies to list on multiple national stock exchanges simultaneously", "Mandating that pension funds hold at least 30% of assets in cross-border investments"],exps:["❌ Fiscal risk-sharing through the EU budget is a different concept (fiscal union).", "✅ Correct — when savers hold claims across Member States, losses from local recessions are cushioned by income from the rest of the currency area, providing private risk-sharing that supplements fiscal mechanisms.", "❌ Multiple listings are not required; cross-border investment is encouraged but not mandated in this form.", "❌ No 30% cross-border investment mandate for pension funds exists."],correct:1,slide:"Slide 05"}
,
{q:"The CMU was renamed the Savings and Investments Union (SIU) following which strategic documents?",opts:["The MiFID II review report and ESMA's 2024 work programme","The 2025 Competitiveness Compass, drawing on reports by Enrico Letta and Mario Draghi","The European Green Deal and the 2020 CMU Action Plan","The Banking Union completion roadmap and ESRB systemic risk warnings"],exps:["❌ The MiFID II review had no role in renaming the CMU.","✅ Correct — the 2025 Competitiveness Compass, drawing on Enrico Letta's single market report and Mario Draghi's competitiveness report, relaunched the CMU as the SIU.","❌ The European Green Deal and 2020 CMU Action Plan confirmed the CMU's continuation but did not rename it the SIU.","❌ The Banking Union roadmap concerned banking supervision, not the CMU/SIU renaming."],correct:1,slide:"Slide 05"},
{q:"The European Single Access Point (ESAP) was introduced under which CMU action plan?",opts:["2015 Action Plan","2017 Mid-Term Review","2020 Action Plan","The 2025 SIU enabling package"],exps:["❌ The 2015 Action Plan set foundational measures but did not introduce ESAP.","❌ The 2017 Mid-Term Review refined the CMU but did not introduce ESAP.","✅ Correct — the 2020 CMU Action Plan introduced the European Single Access Point for financial information, improving transparency and data access across the Union.","❌ The 2025 SIU package builds on ESAP but did not create it."],correct:2,slide:"Slide 05"},
{q:"Pillar 4 of the Savings and Investments Union focuses on:",opts:["Building trust, financial literacy, and attractive entry points for retail savers","Addressing capital shortage for start-ups and scale-ups","Targeting market-structure barriers through legislative packages","Efficient supervision: pursuing balance between national competence and Union-level convergence"],exps:["❌ Pillar 1 focuses on citizens and savings.","❌ Pillar 2 focuses on investments and financing.","❌ Pillar 3 focuses on integration and scale.","✅ Correct — Pillar 4 of the SIU addresses efficient supervision, including ESMA receiving stronger supervisory powers and monitoring Member State progress through the European Semester."],correct:3,slide:"Slide 05"},
{q:"How does the SIU support the Economic and Monetary Union (EMU) in absorbing asymmetric shocks?",opts:["By directing the ECB to cut interest rates when regional recessions occur","By allowing cross-border holdings of equity and debt so losses from local recessions are cushioned by income from the broader currency area","By creating a single fiscal authority to redistribute tax revenues across Member States","By requiring Member States to hold identical shares of each other's sovereign debt"],exps:["❌ ECB interest rate decisions are made for the euro area as a whole, not region-by-region.","✅ Correct — integrated capital markets allow investors in one country to hold claims on another, so a regional recession's losses are cushioned by income from the rest of the currency area, smoothing asymmetric shocks.","❌ The SIU is a capital markets initiative, not a fiscal union proposal.","❌ The SIU does not mandate specific portfolio compositions."],correct:1,slide:"Slide 05"},
{q:"The passporting regime established under EU financial legislation means that:",opts:["A firm licensed in one Member State must obtain additional licences in every other Member State where it wishes to operate","A firm satisfying common requirements in its home Member State may carry on the same activity throughout the EU without additional licences from host authorities","Supervisory responsibilities reside exclusively with host Member State authorities","Only state-owned entities may benefit from cross-border authorisation"],exps:["❌ The passporting regime eliminates the need for multiple licences.","✅ Correct — once licensed at home, the passport enables the firm to provide services or establish branches throughout the EU; host authorities cannot impose additional licensing conditions.","❌ Supervisory responsibility is shared: home country for prudential and conduct oversight, host country for certain local enforcement.","❌ The passport is available to all authorised firms, not just state-owned entities."],correct:1,slide:"Slide 05"},
{q:"The 2020 CMU Action Plan was launched amid which two major contexts?",opts:["The Brexit referendum and the LIBOR scandal","COVID-19 recovery and the European Green Deal","The 2018 ESAs review and digital finance package","The SIU Competitiveness Compass and DORA adoption"],exps:["❌ Brexit and LIBOR were relevant earlier; the 2020 plan had different contexts.","✅ Correct — the 2020 CMU Action Plan was launched amid COVID-19 economic recovery and the European Green Deal, emphasising sustainable and digital finance.","❌ The ESAs review was ongoing but not the context for the 2020 plan.","❌ The SIU and DORA came after the 2020 plan."],correct:1,slide:"Slide 05"},
{q:"Negative integration in the context of EU capital markets refers to:",opts:["The reduction of EU regulatory standards to attract investment","Enforcement of Treaty freedoms through CJEU review using non-discrimination and proportionality principles","Harmonisation of rules through maximum-harmonisation regulations","The removal of supervisory powers from national authorities"],exps:["❌ Reducing standards describes regulatory arbitrage, not negative integration.","✅ Correct — negative integration means enforcing free movement by striking down national barriers through CJEU review based on non-discrimination and proportionality; it does not require positive legislative harmonisation.","❌ Maximum-harmonisation regulations describe positive integration.","❌ Removing national supervisory powers is a separate supervisory convergence issue."],correct:1,slide:"Slide 05"},
{q:"The Retail Investment Strategy 2023 package consists of which legislative instruments?",opts:["A new UCITS Directive and a revised MiCAR Regulation","An amending Directive revising MiFID II, IDD, UCITS, AIFMD, and Solvency II, plus an amending Regulation revising PRIIPs","A new Crowdfunding Regulation and revised Prospectus Regulation","Revised EBA guidelines on conduct of business and a new KID template"],exps:["❌ The RIS package amends existing legislation; it does not create a new UCITS Directive or revise MiCAR.","✅ Correct — the 2023 RIS package includes an amending Directive revising MiFID II, IDD, UCITS, AIFMD, and Solvency II, plus an amending Regulation revising PRIIPs.","❌ The Crowdfunding Regulation and Prospectus Regulation were revised separately and earlier.","❌ EBA guidelines are not legislative instruments; the RIS was a Commission proposal."],correct:1,slide:"Slide 05"},
{q:"What is the '28th corporate-law regime' concept discussed under the SIU Pillar 3?",opts:["A new EU insolvency framework replacing national insolvency laws","An optional EU-level corporate law regime that would allow companies to operate under a uniform set of rules alongside existing national regimes, avoiding gold-plating","A requirement for all listed companies to re-incorporate under a single EU corporate structure","A harmonised set of corporate tax rules for cross-border businesses"],exps:["❌ The 28th regime concept concerns corporate law, not insolvency, and complements rather than replaces national law.","✅ Correct — the '28th regime' concept proposes an optional EU-level corporate law framework companies could adopt alongside the 27 existing national regimes, reducing fragmentation and gold-plating.","❌ Re-incorporation would not be mandatory under the 28th regime concept.","❌ The concept concerns corporate law, not tax harmonisation."],correct:1,slide:"Slide 05"},
{q:"Under what circumstances may host competent authorities deviate from their non-intervention stance under the passporting regime?",opts:["Whenever the host authority disagrees with the home authority's supervisory approach","In response to immediate threats to financial stability or investor protection, or to enforce general law applicable to all market participants","Whenever the host authority identifies any breach of host State law","At any time after notifying the home authority within 30 days"],exps:["❌ Disagreement with supervisory approach alone is insufficient; the home authority retains primary competence.","✅ Correct — host authorities may intervene only in response to immediate threats to financial stability or investor protection, or to enforce non-harmonised local requirements, and must exercise powers cooperatively with the home supervisor.","❌ Host authorities cannot broadly intervene for any breach of host State law — the passport precisely limits such intervention.","❌ There is no unilateral 30-day notification right for host authorities to override passport protection."],correct:1,slide:"Slide 05"}]
,
"06 — MiFID II":[
{q:"MiFID II became applicable in which year?",opts:["2014","2016","2018","2020"],exps:["❌ 2014 is when MiFID II was adopted, not when it became applicable.","❌ 2016 is not when MiFID II became applicable.","✅ Correct — MiFID II became applicable in January 2018.","❌ 2020 is not when MiFID II became applicable."],correct:2,slide:"Slide 06"},
{q:"Financial instruments under Section C of Annex I MiFID II are divided into:",opts:["Liquid and illiquid instruments","Non-derivative instruments and derivative instruments","Shares and bonds only","Regulated market instruments and OTC instruments"],exps:["❌ Liquid/illiquid is not the Section C classification.","✅ Correct — Section C divides instruments into non-derivative (transferable securities, money market instruments, CIU units, emission allowances) and derivative instruments.","❌ Section C covers much more than shares and bonds.","❌ Section C classification is not based on trading venue."],correct:1,slide:"Slide 06"},
{q:"The unifying criterion for MiFID II financial instruments is:",opts:["Admission to trading on a regulated market","Negotiability on the capital market — suitability for trading and transfer, though not necessarily on regulated markets","Denomination in euros or another EU currency","Issuance by entities established in the EU"],exps:["❌ Admission to a regulated market is not required.","✅ Correct — the unifying criterion is negotiability: suitability for trading and transfer, though not necessarily on regulated markets.","❌ Currency of denomination is not the unifying criterion.","❌ EU establishment is not required."],correct:1,slide:"Slide 06"},
{q:"In Case C-627/23 (January 2025), the CJEU ruled that an instrument is negotiable unless:",opts:["It is not admitted to a regulated market or MTF","Its transfer is 'impossible' or 'extremely difficult'","It lacks fungibility with other instruments of the same class","It is not denominated in a freely convertible currency"],exps:["❌ Admission to regulated markets or MTFs is not the test for negotiability.","✅ Correct — the CJEU ruled in C-627/23 that an instrument is negotiable unless its transfer is 'impossible' or 'extremely difficult'.","❌ Fungibility may be relevant but is not the test articulated in this case.","❌ Currency denomination is not the negotiability test."],correct:1,slide:"Slide 06"},
{q:"'Portfolio management' under Section A MiFID II is defined as:",opts:["Reception and transmission of orders to facilitate transactions between investors","Discretionary management of individualised client portfolios","Personal recommendations based on client characteristics and needs","Trading against proprietary capital"],exps:["❌ Reception and transmission of orders is a separate service.","✅ Correct — Portfolio management involves discretionary management of individualised client portfolios.","❌ Personal recommendations describe Investment Advice.","❌ Trading against proprietary capital describes Dealing on Own Account."],correct:1,slide:"Slide 06"},
{q:"'Systematic Internalisation' is a particular form of which investment service?",opts:["Portfolio management","Investment advice","Dealing on own account — where firms execute client orders outside regulated venues on an organised, frequent, systematic, and substantial basis","Underwriting and placement"],exps:["❌ Portfolio management is a different service.","❌ Investment advice is a different service.","✅ Correct — systematic internalisation is a particular form of dealing on own account, where firms execute client orders outside regulated venues on an organised, frequent, systematic, and substantial basis.","❌ Underwriting and placement is a different service."],correct:2,slide:"Slide 06"},
{q:"MiFID II authorisation (the European passport) enables authorised investment firms to:",opts:["Operate only within the Member State that granted the authorisation","Operate throughout the Union based on home Member State authorisation — for both cross-border services and branch establishment without separate local authorisation","Operate in all Member States plus EEA countries and major third countries under equivalence","Operate only in Member States that have signed a bilateral cooperation agreement with the home supervisor"],exps:["❌ The passport enables EU-wide operation, not only domestic.","✅ Correct — the MiFID European passport enables authorised firms to operate throughout the Union based on home Member State authorisation, covering cross-border services and branch establishment.","❌ Third-country access is not covered by the MiFID passport.","❌ No bilateral cooperation agreement between Member States is required."],correct:1,slide:"Slide 06"},
{q:"Under MiFID II client classification, 'Eligible Counterparties' are subject to which regime?",opts:["Full MiFID II conduct obligations including comprehensive information duties and suitability tests","An intermediate protection regime between retail and professional clients","A lighter regime applicable only for specific services: order reception/transmission, execution, and dealing on own account","No MiFID II obligations at all"],exps:["❌ Full obligations describe the Retail Client regime.","❌ Eligible Counterparties are the least protected category.","✅ Correct — Eligible Counterparties are subject to a lighter regime for specific services (order reception/transmission, execution, dealing on own account).","❌ Eligible Counterparties are still subject to some MiFID II obligations, though lighter."],correct:2,slide:"Slide 06"},
{q:"'Professional by Law' clients include which entities?",opts:["Only natural persons with significant investment experience","Regulated financial entities (investment firms, credit institutions, insurers, UCITS) and large undertakings meeting two of three criteria: €20M balance sheet, €40M net turnover, €2M own funds","All companies registered in the EU regardless of size","Only government bodies and central banks"],exps:["❌ Natural persons with investment experience may apply for professional treatment but are not 'Professional by Law'.","✅ Correct — Professional by Law includes regulated financial entities and large undertakings meeting two of three criteria: €20M balance sheet, €40M net turnover, €2M own funds.","❌ All EU companies regardless of size are not automatically Professional by Law.","❌ Government bodies are included but not the only entities."],correct:1,slide:"Slide 06"},
{q:"To be reclassified as 'Professional upon Request', a retail client must meet which two of three criteria?",opts:["Hold a professional financial qualification AND have minimum €1 million in assets","Significant transaction volume (min. 10 per quarter over four quarters), portfolio exceeding €500,000, and one year financial sector experience in relevant position — any two of these three","Be affiliated with a regulated financial entity AND have minimum €500,000 in assets","Be a large undertaking AND have at least five years of investment experience"],exps:["❌ Professional qualifications alone are not the criteria for 'Professional upon Request'.","✅ Correct — retail clients may request professional treatment by meeting two of: minimum 10 significant transactions per quarter over four quarters; portfolio exceeding €500,000; one year relevant financial sector experience.","❌ Affiliation with a regulated entity makes one 'Professional by Law', not 'Professional upon Request'.","❌ Large undertaking criteria apply to 'Professional by Law', not 'Professional upon Request'."],correct:1,slide:"Slide 06"},
{q:"The suitability assessment under MiFID II applies to which investment services?",opts:["All investment services without exception","Only execution-only services for non-complex instruments","Investment advice and portfolio management — a blocking test preventing recommendations when suitability cannot be established","Only services to retail clients, not professional clients"],exps:["❌ Suitability applies specifically to advice and portfolio management.","❌ Execution-only services are exempt from both suitability AND appropriateness assessments.","✅ Correct — the suitability assessment applies to investment advice and portfolio management and is a blocking test.","❌ Suitability applies based on service type; professional clients benefit from some presumptions but the obligation exists."],correct:2,slide:"Slide 06"},
{q:"The three dimensions of the MiFID II suitability assessment are:",opts:["Nationality, tax residency, and legal capacity","Knowledge and experience, financial situation, and investment objectives (including risk tolerance and ESG preferences)","Credit score, employment status, and net worth","Past investment performance, risk tolerance, and portfolio diversification"],exps:["❌ Nationality and tax residency are not the three suitability dimensions.","✅ Correct — the three dimensions are: knowledge and experience; financial situation (income, assets, commitments, ability to bear losses); and investment objectives (purpose, duration, risk tolerance, ESG preferences).","❌ Credit score and employment status are not the three suitability dimensions.","❌ Past investment performance is not one of the three suitability dimensions."],correct:1,slide:"Slide 06"},
{q:"The appropriateness assessment under MiFID II is a 'warning test', meaning:",opts:["It prevents recommendations when appropriateness cannot be established","It assesses only client knowledge and experience; firms must alert clients when products are inappropriate, but clients may proceed despite the warning","It applies the same comprehensive assessment as suitability","It only applies to professional clients and eligible counterparties"],exps:["❌ Preventing recommendations when the test cannot be satisfied describes the suitability blocking test, not appropriateness.","✅ Correct — appropriateness assesses only knowledge and experience; it is a warning test allowing clients to proceed despite warnings (unlike suitability, which is blocking).","❌ Comprehensive assessment of knowledge, experience, financial situation, AND objectives describes suitability.","❌ Appropriateness applies to services other than advice and portfolio management, for all client types."],correct:1,slide:"Slide 06"},
{q:"Best execution under Article 27(1) MiFID II requires firms to:",opts:["Always execute orders at the lowest possible price","Take all reasonable steps to obtain the best possible result considering multiple execution factors including price, costs, speed, and likelihood of execution","Execute all client orders on regulated markets only","Report all client orders to ESMA within 15 minutes"],exps:["❌ Best execution considers multiple factors; price alone is insufficient.","✅ Correct — best execution requires all reasonable steps to obtain the best possible result considering price, execution costs, speed, likelihood of execution, order size, and market impact.","❌ Best execution can be achieved on various venues, not only regulated markets.","❌ Reporting to ESMA is a different obligation."],correct:1,slide:"Slide 06"},
{q:"For retail clients, best execution is primarily assessed on:",opts:["Speed of execution only","Order size and market impact","'Total consideration' — price plus all direct execution costs","Likelihood of execution and settlement"],exps:["❌ Speed is one of multiple factors but not the primary criterion for retail clients.","❌ Order size and market impact are factors but not the primary criterion.","✅ Correct — for retail clients, best execution is assessed primarily on 'total consideration': the price of the instrument plus all direct execution costs.","❌ Likelihood of execution is a factor but not the primary criterion for retail clients."],correct:2,slide:"Slide 06"},
{q:"Under MiFID II, inducements (third-party payments) are permitted only if:",opts:["They are paid exclusively by professional clients and eligible counterparties","They enhance service quality and do not impair the firm's duty to act honestly, fairly, and professionally in the client's best interests — with advance disclosure","They are below a specific monetary threshold set by ESMA","They are disclosed to the client after the service has been provided"],exps:["❌ The payer of the inducement is not the determining factor.","✅ Correct — inducements are permitted only if they enhance service quality and do not impair the duty to act in the client's best interests, with advance disclosure in durable medium.","❌ There is no specific monetary threshold set by ESMA.","❌ Disclosure must be in advance, not after service provision."],correct:1,slide:"Slide 06"},
{q:"Product governance under MiFID II addresses:",opts:["Only distribution of financial products to retail clients","The upstream design, approval, and distribution of financial instruments — manufacturers must identify target markets, assess risks, and avoid unsuitable products reaching certain client categories","Exclusively the pricing and cost structure of financial instruments","Only conflicts of interest in trading venue operations"],exps:["❌ Product governance applies at the manufacturing stage, not only distribution.","✅ Correct — product governance addresses upstream product design: manufacturers identify target markets, assess risks, and avoid features harming investors; distributors align strategies with manufacturer's target markets.","❌ Pricing and cost structure are addressed by cost transparency rules.","❌ Product governance applies to investment firms, not specifically trading venues."],correct:1,slide:"Slide 06"},
{q:"Execution-only services are permitted without suitability or appropriateness assessment when which cumulative conditions are met?",opts:["Client is a professional investor","Service at client initiative, for non-complex instruments, without credit/loans, and with clear client notification that no assessment will be conducted","Instrument has been traded on a regulated market for at least 5 years","Investment firm has conducted a simplified suitability assessment"],exps:["❌ Professional investor status is not one of the specific execution-only conditions.","✅ Correct — conditions include: service at client initiative, non-complex instruments, service limited to execution or order reception/transmission (excluding credit/loans), and client clearly informed of no assessment.","❌ 5-year trading history is not a condition for execution-only services.","❌ No assessment (even simplified) is conducted for execution-only services."],correct:1,slide:"Slide 06"},
{q:"Conflicts of interest disclosure under MiFID II Article 23 is described as:",opts:["The primary tool for managing conflicts of interest — sufficient on its own","A last-resort mechanism when prevention arrangements are insufficient to ensure client interest protection; cannot substitute robust internal safeguards","A mandatory step before any client communication","Only required for retail clients, not professional clients or eligible counterparties"],exps:["❌ Disclosure is explicitly described as a last resort, not the primary tool.","✅ Correct — disclosure is a last-resort mechanism when organisational arrangements are insufficient; it cannot substitute robust internal safeguards.","❌ Disclosure is not required before every client communication.","❌ Conflicts of interest obligations apply across client categories."],correct:1,slide:"Slide 06"},
{q:"Investment research is NOT an inducement under MiFID II if:",opts:["It is provided free of charge by the investment firm","It is paid directly from firm resources or from a dedicated research payment account (RPA) funded by a client charge, subject to governance and control mechanisms","It is provided only to professional clients and eligible counterparties","It relates exclusively to non-complex financial instruments"],exps:["❌ Free provision alone does not determine whether research is an inducement.","✅ Correct — investment research is not an inducement if paid directly from firm resources or from an RPA funded by client charge, subject to governance and control mechanisms ensuring client best interests.","❌ The client category does not determine whether research constitutes an inducement.","❌ Instrument complexity is not the determining factor."],correct:1,slide:"Slide 06"}
,
{q:"Investment advice under MiFID II Section A must be:",opts:["General recommendations on categories of assets published to the public", "Personal recommendations presented as suitable for specific individuals based on their characteristics, relating to identifiable instruments (not general categories)", "Any communication about financial instruments addressed to clients", "Research reports distributed to clients by investment firms"],exps:["❌ General public recommendations describe investment research, not MiFID II investment advice.", "✅ Correct — investment advice consists of personal recommendations presented as suitable for specific individuals based on their characteristics, relating to identifiable instruments, not general categories or asset classes.", "❌ All communications about financial instruments are not investment advice.", "❌ Research reports distributed to clients describe investment research, an ancillary service under Section B."],correct:1,slide:"Slide 06"},
{q:"Ancillary services listed in Section B of Annex I MiFID II can generally be provided by:",opts:["Only authorised investment firms subject to full MiFID II obligations", "Non-authorised entities freely, unless otherwise restricted — because they are complementary to investment services", "Only credit institutions with full banking authorisation", "Only entities with specific ESMA registration for each ancillary service"],exps:["❌ Section B services can be provided by non-authorised entities unless restricted.", "✅ Correct — ancillary services can be freely provided by non-authorised entities unless otherwise restricted, as they are complementary activities.", "❌ Credit institutions may provide ancillary services but so can non-credit institutions.", "❌ No specific ESMA registration for ancillary services is required."],correct:1,slide:"Slide 06"},
{q:"Under MiFID II, a 'large undertaking' qualifies as Professional by Law if it meets at least two of three criteria. Which are they?",opts:["€10M balance sheet, €20M net turnover, €1M own funds", "€20M balance sheet, €40M net turnover, €2M own funds", "€50M balance sheet, €100M net turnover, €5M own funds", "€5M balance sheet, €10M net turnover, €500K own funds"],exps:["❌ These figures are below the MiFID II thresholds.", "✅ Correct — a large undertaking qualifies as Professional by Law if it meets at least two of: €20M balance sheet, €40M net turnover, €2M own funds.", "❌ These figures exceed the MiFID II thresholds.", "❌ These figures are below the MiFID II thresholds."],correct:1,slide:"Slide 06"},
{q:"The suitability report under MiFID II must be provided to which clients and when?",opts:["To all clients before any investment service is provided", "To retail clients receiving investment advice — on a durable medium explaining how the recommendation matches their objectives, financial situation, investment horizon, risk profile, and loss-bearing ability", "Only to professional clients receiving portfolio management services", "To eligible counterparties before any transaction is executed"],exps:["❌ The suitability report is specifically required for retail clients receiving investment advice.", "✅ Correct — retail clients receiving investment advice must receive a suitability report on a durable medium explaining how the recommendation matches their objectives, financial situation, investment horizon, risk profile, and loss-bearing ability.", "❌ Professional clients receiving portfolio management do not require the same suitability report.", "❌ Eligible counterparties are not the target of suitability reports."],correct:1,slide:"Slide 06"},
{q:"MiFID II cost transparency requires firms to provide cost information:",opts:["Only at year-end in an annual summary statement", "Ex ante (before service) and updated annually ex post — aggregated, shown as cash amounts and percentages, with cumulative effect illustrations on investment returns", "Only when the client specifically requests cost information", "Only for structured products and derivatives, not simple instruments"],exps:["❌ Cost information must be provided ex ante, not only at year end.", "✅ Correct — MiFID II requires ex ante and annual ex post cost disclosure, aggregated, shown as cash amounts and percentages, with cumulative effect illustrations.", "❌ Cost disclosure is proactive and mandatory, not only upon client request.", "❌ Cost transparency applies to all instruments and services."],correct:1,slide:"Slide 06"},
{q:"When executing orders outside regulated markets, MTFs, or OTFs, what is required?",opts:["No additional requirement — firms may execute anywhere without client notification", "Express prior consent from the client is required — the execution policy must indicate venues used per instrument class and explain venue selection criteria", "Only a general disclosure in the terms and conditions is sufficient", "Prior written NCA approval is required for each such execution"],exps:["❌ An express prior consent requirement applies when policies permit execution outside regulated venues.", "✅ Correct — where execution policies permit execution outside regulated markets, MTFs, or OTFs, express prior consent from the client is required before proceeding.", "❌ General terms and conditions disclosure is insufficient; express prior consent is required.", "❌ NCA prior approval for each execution is not required."],correct:1,slide:"Slide 06"},
{q:"Periodic suitability assessments for retail clients receiving ongoing investment advice must be conducted:",opts:["Only when the client requests a review", "At least annually, with increased frequency warranted by client risk profile or investment complexity", "Only upon a significant market event affecting the portfolio", "Every five years, aligned with the MiFID II review cycle"],exps:["❌ Periodic assessments must be conducted proactively, not only upon client request.", "✅ Correct — periodic suitability assessments must be conducted at least annually for retail clients receiving ongoing investment advice or portfolio management.", "❌ Significant market events may trigger additional assessments, but the minimum is annual.", "❌ Five-year reviews are not the standard; annual minimum is required."],correct:1,slide:"Slide 06"},
{q:"MiFID II's general information obligation (Article 24(3)) applies to:",opts:["Only marketing materials about new financial products", "All information provided to clients or potential clients — including marketing communications — ensuring it is fair, clear, and not misleading across all client categories", "Only information provided to retail clients", "Only pre-contractual documents for complex financial instruments"],exps:["❌ The obligation applies to all information, not only marketing materials about new products.", "✅ Correct — Article 24(3) establishes a general obligation ensuring all information provided to clients or potential clients — including marketing communications — is fair, clear, and not misleading. This applies across all client categories.", "❌ The obligation applies to all client categories, not only retail clients.", "❌ The obligation applies to all information, not only pre-contractual documents."],correct:1,slide:"Slide 06"},
