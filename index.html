{q:"What is the fundamental principle regarding the MiCAR/MiFID II boundary when a token already qualifies as a financial instrument under MiFID II?",opts:["Both regimes apply simultaneously with the stricter rules prevailing","MiCAR steps back and MiFID II applies, following technological neutrality","MiCAR's white-paper disclosure regime replaces MiFID II's prospectus requirements","The issuer may choose which regime to apply"],exps:["❌ The two regimes do not apply simultaneously; MiCAR defers to MiFID II.","✅ Correct — where a token already falls within an existing MiFID II financial instrument category, MiCAR steps back and MiFID II applies, consistent with the principle of technological neutrality.","❌ A MiFID II financial instrument requires the full MiFID II/Prospectus Regulation framework, not just MiCAR's lighter white-paper regime.","❌ The issuer cannot choose — the nature of the instrument determines the applicable regime."],correct:1,slide:"Slide 18"},
{q:"DORA (Regulation (EU) 2022/2554) is notable for extending ICT resilience requirements beyond financial institutions to include:",opts:["Only systemically important banks and CCPs","The entire financial ecosystem, including critically the technology vendors that serve financial entities, with direct ESA oversight of designated critical third-party providers","Only firms with annual ICT budgets exceeding €10 million","Only fintech start-ups offering digital financial services"],exps:["❌ DORA applies to the entire financial sector, not just systemic institutions.","✅ Correct — DORA binds the entire financial ecosystem and, crucially, the technology vendors (cloud providers, ICT firms) that serve it, with ESAs directly overseeing designated critical third-party technology providers.","❌ DORA does not use an ICT budget threshold for applicability.","❌ DORA applies to established financial institutions, not only fintech start-ups."],correct:1,slide:"Slide 18"},
{q:"Fully decentralised finance (DeFi) arrangements are outside MiCAR's scope because:",opts:["The EU decided DeFi does not pose systemic risks","MiCAR requires identifiable issuers or service providers who can be authorised and supervised; truly decentralised protocols have no such identifiable entity","DeFi users are exclusively professional investors outside MiCAR's retail protection scope","DeFi protocols are treated as collective investment undertakings under AIFMD"],exps:["❌ The systemic risk assessment of DeFi is ongoing; regulatory gap is the reason, not a risk finding.","✅ Correct — MiCAR's regime depends on identifiable authorisable entities (issuers, CASPs); truly decentralised protocols without a responsible entity cannot be fitted into this framework, leaving DeFi outside MiCAR's current reach.","❌ DeFi users include retail participants; scope limitation is structural, not investor-type-based.","❌ DeFi protocols are not classified as AIFs under AIFMD."],correct:1,slide:"Slide 18"},
{q:"Under MiCAR, the aggregate DLT Pilot Regulation venue cap that triggers the operator's pre-agreed 'transition strategy' is:",opts:["€5 billion aggregate market value","€6 billion per venue","€9 billion aggregate across all sandbox instruments","€15 billion total notional value"],exps:["❌ €5 billion is not the stated transition trigger.","❌ €6 billion is the individual venue cap under the DLTR, not the transition trigger.","✅ Correct — once the total market value of instruments across the sandbox passes €9 billion, the operator must trigger its pre-agreed transition strategy explaining how participants will migrate to conventional infrastructures.","❌ €15 billion is not the DLTR trigger level."],correct:2,slide:"Slide 18"},
{q:"Under MiCAR's utility token regime, the exemption from the white-paper requirement disappears when:",opts:["The utility token is held by more than 1,000 investors","The offeror announces or subsequently seeks admission of the token to trading on a crypto-asset trading platform","The utility token's market value exceeds €1 million","The token grants access to more than one product or service"],exps:["❌ Number of holders does not remove the utility token exemption.","✅ Correct — the utility token exemption from the white-paper requirement disappears if the offeror announces or later seeks admission to trading on a CASP platform; in that case a white paper must be published and the competent authority notified.","❌ Market value thresholds do not remove the utility token exemption.","❌ The number of products/services accessed does not remove the exemption."],correct:1,slide:"Slide 18"},
{q:"What is the key conduct obligation for CASPs under Articles 69-74 MiCAR regarding suitability?",opts:["CASPs are not required to assess client suitability under any circumstances","Where the service involves advice or discretionary management, CASPs must conduct a full suitability assessment mirroring MiFID II — gathering information on knowledge, experience, financial situation, and investment objectives","Suitability applies only to retail clients purchasing significant ARTs","CASPs must conduct suitability assessments only for clients investing more than €10,000"],exps:["❌ MiCAR imposes a suitability assessment for advice and portfolio management services.","✅ Correct — for advice and discretionary management services, Article 81 MiCAR requires CASPs to conduct a full suitability assessment gathering information on knowledge, experience, financial situation, and investment objectives — directly mirroring the MiFID II test.","❌ The suitability obligation applies across services involving advice/management, not only for significant ART purchases.","❌ The suitability threshold is not defined by investment amount."],correct:1,slide:"Slide 18"},
{q:"Under MiCAR, the market abuse regime for crypto-assets (Articles 87-92) mirrors MAR but with which key adjustment to the inside information definition?",opts:["Crypto inside information requires a 5% price movement, while MAR requires only a reasonable investor test","Materiality is gauged against the 'reasonable crypto-asset holder' rather than the 'reasonable investor' standard used in MAR","Crypto inside information requires actual disclosure to at least 100 holders before the prohibition is triggered","MiCAR applies the same identical definition as Article 7 MAR with no adjustments"],exps:["❌ MiCAR does not use a 5% price movement threshold — it mirrors MAR's qualitative approach.","✅ Correct — MiCAR Article 87 mirrors Article 7 MAR's inside information definition but gauges materiality against what a 'reasonable crypto-asset holder' would use as basis for investment decisions, rather than the 'reasonable investor' standard.","❌ No disclosure threshold of 100 holders exists in MiCAR's inside information definition.","❌ MiCAR intentionally adapts the definition for the crypto context rather than copying it identically."],correct:1,slide:"Slide 18"},
{q:"MiCAR's market abuse regime is notably silent on which MAR obligations that apply to traditional securities issuers?",opts:["The prohibition on insider dealing and market manipulation","The disclosure obligation for inside information and selective disclosure rules","Insider lists, manager dealings reporting, and investment recommendations","The definition of inside information and price sensitivity assessment"],exps:["❌ MiCAR does include insider dealing and manipulation prohibitions (Articles 88-92).","❌ MiCAR includes dual disclosure tracks for ART issuers and a disclosure obligation equivalent to MAR Article 17.","✅ Correct — MiCAR is silent on insider lists, manager dealings reporting, and investment recommendations — obligations that exist under MAR for traditional securities issuers. Whether these gaps matter in practice depends on how surveillance tools develop.","❌ MiCAR addresses inside information and price sensitivity through Article 87."],correct:2,slide:"Slide 18"},
{q:"The background to MiCAR's adoption is best described as:",opts:["The EU responding to US legislation on crypto-assets to remain competitive","Bitcoin's 2009 launch promised a peer-to-peer payment system free from central authorities, but crypto-markets reproduced traditional finance failures without regulatory backstops, culminating in FTX's 2022 collapse and the crypto-winter","The LIBOR scandal exposing the need for digital benchmark alternatives","The ECB requiring a regulatory framework before launching the digital euro"],exps:["❌ MiCAR was an autonomous EU initiative, not a response to US legislation.","✅ Correct — Bitcoin promised a self-governing financial ecosystem, but crypto-markets reproduced information asymmetries, manipulation, fraud, and systemic contagion without regulatory backstops; the succession of collapses between 2021-2023, culminating in FTX's failure, exposed these vulnerabilities and prompted comprehensive regulation.","❌ The LIBOR scandal prompted the Benchmarks Regulation; it was not the background to MiCAR.","❌ The digital euro project is separate from MiCAR and was not the driver of MiCAR's adoption."],correct:1,slide:"Slide 18"},
{q:"MiCAR's 'regulatory toolkit' is notable because it draws from multiple existing EU frameworks. Which combination best describes the instruments MiCAR borrows from?",opts:["It creates entirely new legal concepts with no reference to existing EU financial law","Prospectus-style disclosure for public offerings, MiFID-type authorisation for CASPs, MiFIR-like conduct rules, MAR-inspired market abuse provisions, and banking-style prudential concepts for payment-function tokens","It is based exclusively on the AIFMD framework adapted for digital assets","It relies solely on anti-money laundering rules with no conduct of business provisions"],exps:["❌ MiCAR explicitly borrows and adapts concepts from across EU financial law.","✅ Correct — MiCAR's regulatory toolkit combines: prospectus-style disclosure (white papers), MiFID-type authorisation (CASPs), MiFIR-like conduct rules (trading platforms), MAR-inspired market abuse provisions (Articles 87-92), and banking-style prudential concepts (ART/EMT reserve requirements) — making it the most comprehensive crypto-asset regime yet enacted.","❌ AIFMD is one of several frameworks MiCAR draws from, but it is not the sole basis.","❌ While AML is relevant to crypto, MiCAR's primary framework is capital markets and prudential regulation, not solely AML."],correct:1,slide:"Slide 18"},
{q:"The multi-supervisor authorization process for ARTs under MiCAR involves which combination of authorities?",opts:["Only the home NCA, with no involvement from EU-level bodies","The home NCA as primary reviewer, with mandatory consultation of ESMA and EBA before granting permission, and an ECB opinion where macro-prudential concerns arise","ESMA alone, as the single EU-level supervisor for all ART issuers","The ECB as sole supervisor, given ARTs' potential impact on monetary policy"],exps:["❌ The ART authorization process is deliberately multi-layered, not confined to the home NCA.","✅ Correct — the ART authorization process involves: (1) the home NCA conducting the primary review; (2) mandatory consultation of ESMA and EBA before granting permission; and (3) an ECB opinion where macro-prudential concerns arise — reflecting the Union's determination to protect monetary sovereignty from privately issued payment tokens.","❌ ESMA is consulted in the process but is not the sole supervisor; home NCAs and EBA are also involved.","❌ The ECB provides an opinion where relevant but is not the sole supervisor; the multi-supervisor structure distributes responsibility appropriately."],correct:1,slide:"Slide 18"},
{q:"Under MiCAR's dual authorization track, how does the path differ for existing financial institutions compared to new market entrants?",opts:["Existing financial institutions must obtain full MiCAR authorisation like new entrants; no shortcuts are available","New entrants must obtain full MiCAR authorisation meeting all prudential and organisational standards; existing financial institutions (credit institutions, investment firms, e-money institutions etc.) may enter through a pre-launch notification rather than de-novo authorisation","Existing financial institutions are permanently exempt from all MiCAR requirements","New entrants benefit from a lighter notification regime to encourage innovation in the digital asset sector"],exps:["❌ The dual track explicitly distinguishes between new entrants and existing financial institutions.","✅ Correct — new entrants require full MiCAR authorisation; existing authorised financial entities (credit institutions, CSDs, investment firms, market operators, e-money institutions, UCITS managers, AIFMs) may enter through pre-launch notification, leveraging their existing regulatory status.","❌ Existing financial institutions are not permanently exempt; they face ongoing MiCAR obligations once providing crypto-asset services.","❌ The lighter notification route benefits existing regulated firms, not new entrants — which face the full authorisation burden."],correct:1,slide:"Slide 18"},
{q:"Articles 72-77 of MiCAR establish technology-specific safeguards for CASPs. What are the three main areas covered?",opts:["Capital requirements, liquidity ratios, and leverage limits for crypto-asset trading firms","IT systems and cyber-risk management (Article 72 cross-referencing DORA), custody and administration elevated to a core activity with strict segregation and client ownership rights (Article 75), and trading platform gate-keeping including pre-admission vetting and real-time market integrity monitoring (Articles 76-77)","Mandatory insurance coverage, outsourcing restrictions, and staff competence requirements","Consumer protection disclosure, advertising standards, and cooling-off periods for retail crypto investors"],exps:["❌ Capital requirements are addressed elsewhere in MiCAR; these articles focus on technology-specific operational safeguards.","✅ Correct — Articles 72-77 address: (1) IT and cyber-risk: robust systems, business continuity, incident reporting, cross-referencing DORA; (2) custody as a core (not ancillary) activity with written agreements, segregation, and client beneficial ownership at all times; and (3) trading platform gate-keeping: vetting assets before admission, screening for misleading white papers and manipulative designs, real-time monitoring.","❌ Insurance and staff competence are general organisational requirements; these articles concern technology-specific operational safeguards.","❌ Consumer protection disclosure is covered by general CASP conduct rules; Articles 72-77 focus on operational and technological safeguards."],correct:1,slide:"Slide 18"},
{q:"The 'Digital Finance Cathedral' metaphor used in the MiCAR/DORA/DLTR slides refers to which overall assessment of the EU's digital finance framework?",opts:["A completed and perfect regulatory edifice requiring no further development","A framework that is only half-built even after MiCAR's 200+ recitals and 149 articles, with unresolved questions about DeFi, the digital euro, the AI Act interface, and the regulation of fully decentralised finance — requiring supervisory practice and court decisions to complete","A framework that has failed to attract crypto businesses to the EU due to excessive regulation","A temporary arrangement to be replaced by a single global crypto regulation standard by 2030"],exps:["❌ The 'cathedral' metaphor explicitly acknowledges the framework is incomplete.","✅ Correct — MiCAR, DLTR, and DORA together discipline crypto-asset markets, DLT trading infrastructure, and operational resilience, but the 'cathedral is only half-built': key questions remain about DeFi regulation, the digital euro's interaction with MiCAR, the AI Act interface, and truly decentralised finance — answers requiring supervisory practice, court decisions, and legislative evolution.","❌ The slides note empirical uncertainty about whether MiCAR will foster or ossify a competitive digital market; regulatory failure is not the assessment.","❌ A single global standard is not imminent; MiCAR represents the EU's autonomous regulatory approach."],correct:1,slide:"Slide 18"}]
,
"19 — Crowdfunding":[
{q:"Regulation (EU) 2020/1503 on European crowdfunding service providers became fully applicable on:",opts:["January 1, 2020","November 21, 2021","June 30, 2022","January 1, 2023"],exps:["❌ January 1, 2020 is not the correct date.","✅ Correct — Regulation (EU) 2020/1503 became fully applicable across all Member States on November 21, 2021.","❌ June 30, 2022 is not the correct date.","❌ January 1, 2023 is not the correct date."],correct:1,slide:"Slide 19"},
{q:"The Crowdfunding Regulation was adopted as part of which EU initiative?",opts:["The post-2008 financial crisis regulatory reform package","The Capital Markets Union (CMU) Action Plan","The Digital Finance Package alongside MiCAR and DORA","The Retail Investment Package alongside the 2023 MiFID II amendments"],exps:["❌ The post-crisis reform package focused on banking, derivatives, and market infrastructure.","✅ Correct — the Crowdfunding Regulation was adopted as part of the Capital Markets Union Action Plan, introducing a unified legal regime and European passport for crowdfunding service providers.","❌ The Digital Finance Package addressed crypto-assets (MiCAR) and ICT risk (DORA); crowdfunding is separate.","❌ The 2023 Retail Investment Package addressed MiFID II, PRIIPs, and financial literacy."],correct:1,slide:"Slide 19"},
{q:"Under Article 3(1) of the Crowdfunding Regulation, only which entities may be authorised to provide crowdfunding services?",opts:["Natural persons with relevant financial qualifications","Legal persons established in the EU — natural persons and third-country entities are excluded from the authorisation regime","Any entity registered with ESMA regardless of establishment location","Only credit institutions and investment firms already licensed under MiFID II"],exps:["❌ Natural persons are excluded from authorisation as crowdfunding service providers.","✅ Correct — only legal persons established in the EU may be authorised; natural persons and entities established in third countries are excluded.","❌ ESMA registration alone is not the mechanism; national competent authority authorisation is required.","❌ The Crowdfunding Regulation creates a separate authorisation regime for crowdfunding; MiFID II licensing is not required."],correct:1,slide:"Slide 19"},
{q:"The Crowdfunding Regulation covers which two primary types of crowdfunding services?",opts:["Donation-based and reward-based crowdfunding","Lending-based crowdfunding (facilitation of loan agreements between investors and project owners) and investment-based crowdfunding (placement of securities or crowdfunding instruments without firm underwriting commitment)","Peer-to-peer personal lending and corporate bond issuance","Real estate crowdfunding and equity crowdfunding for listed companies"],exps:["❌ Donation-based and reward-based crowdfunding are outside the scope of this Regulation.","✅ Correct — the Regulation covers lending-based crowdfunding (facilitating loan agreements) and investment-based crowdfunding (placement of securities or crowdfunding instruments without firm underwriting commitment).","❌ Peer-to-peer personal lending is excluded from the Regulation's scope.","❌ Real estate crowdfunding may be within scope but only for unlisted, non-consumer projects; listed company bond issuance is covered by other regimes."],correct:1,slide:"Slide 19"},
{q:"The Crowdfunding Regulation's quantitative threshold under Article 1(2)(c) limits its application to offers that do not exceed:",opts:["€1 million over 12 months","€5 million over 12 months — exceeding this may trigger the Prospectus Regulation","€10 million over 12 months","€50 million over 12 months"],exps:["❌ €1 million is the original general Prospectus Regulation exemption threshold, not the Crowdfunding Regulation threshold.","✅ Correct — the Crowdfunding Regulation applies only to offers not exceeding EUR 5 million over 12 months; exceeding this threshold may trigger the Prospectus Regulation.","❌ €10 million is not the Crowdfunding Regulation threshold.","❌ €50 million is the EU Growth Prospectus consideration threshold."],correct:1,slide:"Slide 19"},
{q:"The three key players in the crowdfunding ecosystem are:",opts:["Regulator, platform operator, and investor","Project owner (seeking funds), investors (providing financing), and crowdfunding service provider (operating the platform and facilitating matching)","Manufacturer, distributor, and retail client","Issuer, underwriter, and market maker"],exps:["❌ The regulator is not one of the three operational players in the crowdfunding ecosystem.","✅ Correct — the three players are: project owner (seeking funds), investors (providing financing via the platform), and crowdfunding service provider (the intermediary operating the platform and facilitating matching).","❌ Manufacturer, distributor, and retail client describes the PRIIPs framework.","❌ Issuer, underwriter, and market maker describes traditional capital markets, not crowdfunding."],correct:1,slide:"Slide 19"},
{q:"The minimum capital requirement for crowdfunding service providers is:",opts:["€100,000 or one quarter of fixed overheads, whichever is higher","€25,000 or one quarter of fixed overheads for the preceding year, whichever is higher — may be satisfied through own funds, PI insurance, or a combination","€500,000 — equivalent to a small investment firm","€1,000,000 — equivalent to a credit institution"],exps:["❌ €100,000 is not the Crowdfunding Regulation minimum capital requirement.","✅ Correct — the minimum capital requirement is €25,000 or one quarter of fixed overheads for the preceding year, whichever is higher; may be satisfied through own funds, professional indemnity insurance, or a combination.","❌ €500,000 is not the crowdfunding minimum capital requirement.","❌ €1,000,000 is not the crowdfunding minimum capital requirement."],correct:1,slide:"Slide 19"},
{q:"The Key Investment Information Sheet (KIIS) under the Crowdfunding Regulation is:",opts:["Prepared by the crowdfunding service provider based on their own due diligence","The primary disclosure instrument prepared by the project owner (with provider verification) containing comprehensive information on the offer — and crowdfunding offers within scope are expressly exempted from the Prospectus Regulation's prospectus obligation","Prepared by ESMA as a standardised document for all crowdfunding projects","Equivalent to the KID under the PRIIPs Regulation and may substitute for it"],exps:["❌ The KIIS is primarily the project owner's responsibility, with provider verification.","✅ Correct — the KIIS is prepared by the project owner, verified by the provider; crowdfunding offers within scope are expressly exempted from the Prospectus Regulation's prospectus obligation.","❌ ESMA does not prepare individual KIISs.","❌ The KIIS and the KID are distinct instruments serving different purposes."],correct:1,slide:"Slide 19"},
{q:"The investor classification under the Crowdfunding Regulation distinguishes between:",opts:["Retail clients and professional clients as defined under MiFID II — identical to MiFID II classification","Sophisticated investors (capable of fully understanding risks and bearing losses) and unsophisticated investors (all others — subject to entry knowledge test and 4-day cooling-off period)","Qualified investors and non-qualified investors as defined under the Prospectus Regulation","Eligible counterparties and retail clients as defined under MiFID II"],exps:["❌ The Crowdfunding Regulation creates its own investor classification, distinct from MiFID II.","✅ Correct — the Crowdfunding Regulation distinguishes sophisticated investors (who fully understand risks) from unsophisticated investors (all others), with the latter subject to an entry knowledge test and a 4-day cooling-off period.","❌ Qualified/non-qualified investors are a Prospectus Regulation concept; the Crowdfunding Regulation uses its own classification.","❌ Eligible counterparties/retail clients is MiFID II terminology; the Crowdfunding Regulation creates its own categories."],correct:1,slide:"Slide 19"},
{q:"Unsophisticated investors benefit from a cooling-off period of:",opts:["1 day","2 days","4 days — allowing withdrawal of the investment commitment without penalty after submission of offer or expression of interest","7 days"],exps:["❌ 1 day is below the Crowdfunding Regulation cooling-off period.","❌ 2 days is below the Crowdfunding Regulation cooling-off period.","✅ Correct — unsophisticated investors benefit from a 4-day cooling-off period, permitting withdrawal of the investment commitment without penalty.","❌ 7 days exceeds the cooling-off period specified in the Crowdfunding Regulation."],correct:2,slide:"Slide 19"},
{q:"For unsophisticated investors investing amounts exceeding EUR 1,000 or 5% of net worth, the Crowdfunding Regulation requires:",opts:["Automatic rejection of the investment order","A risk warning, explicit consent, and demonstration of understanding that the investment may result in total loss of the amount invested","A mandatory 30-day waiting period before the investment can be confirmed","Approval from the national competent authority before the investment proceeds"],exps:["❌ Automatic rejection is not the required response; additional protective steps are required.","✅ Correct — for amounts exceeding EUR 1,000 or 5% of net worth, the provider must issue a risk warning, obtain explicit consent, and confirm the investor demonstrates understanding that the investment may result in total loss.","❌ A 30-day waiting period is not required; the cooling-off period is 4 days.","❌ NCA approval for individual investments is not required."],correct:1,slide:"Slide 19"},
{q:"The maximum administrative fine for crowdfunding service providers under the Crowdfunding Regulation is:",opts:["€100,000 or 1% of annual turnover, whichever is higher","€500,000 or 5% of annual turnover, whichever is higher — and where economic benefit exceeds these amounts, fines may reach twice the benefit gained","€1,000,000 fixed fine regardless of turnover","€50,000 or 0.5% of annual turnover, whichever is higher"],exps:["❌ €100,000 and 1% are below the regulatory maximum.","✅ Correct — administrative fines may reach €500,000 or 5% of annual turnover, whichever is higher; where economic benefit exceeds these amounts, fines may reach twice the benefit gained.","❌ €1,000,000 fixed fine is not the correct structure.","❌ €50,000 and 0.5% are below the regulatory maximum."],correct:1,slide:"Slide 19"},
{q:"Crowdfunding service providers are prohibited from:",opts:["Operating both lending-based and investment-based crowdfunding on the same platform","Offering or accepting remuneration, rebates, or non-monetary benefits in exchange for directing investor orders toward particular crowdfunding offers — and from participating in offers on their own platform","Providing crowdfunding services in more than three Member States","Offering crowdfunding services to non-EU investors"],exps:["❌ Providers may operate both types of crowdfunding on the same platform.","✅ Correct — providers cannot offer or accept inducements directing investors to particular offers, and cannot participate in offers on their own platform (conflicts of interest management under Articles 3(3) and 8).","❌ The European passport allows cross-border services throughout the EU without limit.","❌ The Regulation does not prohibit serving non-EU investors; it regulates EU-established providers."],correct:1,slide:"Slide 19"},
{q:"The entry knowledge test for unsophisticated investors assesses:",opts:["Only the investor's financial wealth and ability to bear losses","Sophistication level, experience, investment objectives, financial situation, and risk understanding — if insufficient, the provider must issue a warning but may still grant access","Only whether the investor has previously invested in crowdfunding projects","Only whether the investor holds a professional financial qualification"],exps:["❌ The knowledge test covers more than financial wealth.","✅ Correct — the entry knowledge test assesses sophistication level, experience, investment objectives, financial situation, and risk understanding; if the test indicates insufficient understanding, the provider must warn the investor but may still grant access.","❌ Previous crowdfunding investment history alone is insufficient.","❌ Professional financial qualifications alone are not what the test assesses."],correct:1,slide:"Slide 19"},
{q:"The Crowdfunding Regulation's supervisory regime assigns which role to ESMA?",opts:["ESMA is the primary direct supervisor of all crowdfunding service providers across the EU","ESMA was not entrusted with direct supervisory powers but plays a crucial role as European-level coordinator — national competent authorities (NCAs) hold harmonised supervisory powers","ESMA approves all individual crowdfunding offers exceeding €1 million","ESMA issues binding decisions on crowdfunding service provider authorisations"],exps:["❌ ESMA does not directly supervise crowdfunding service providers.","✅ Correct — ESMA was not entrusted with direct supervisory powers but plays a crucial coordination role; NCAs possess harmonised powers to request information, carry out inspections, and intervene in ongoing service provision where infringements are suspected.","❌ ESMA does not approve individual crowdfunding offers.","❌ NCAs, not ESMA, issue authorisation decisions for crowdfunding service providers."],correct:1,slide:"Slide 19"},
{q:"The Crowdfunding Regulation expressly excludes which type of crowdfunding from its scope?",opts:["Investment-based crowdfunding for SMEs","Lending-based crowdfunding for real estate projects","Peer-to-peer lending arrangements between individuals bypassing traditional financial institutions, and crowdfunding projects where the project owner qualifies as a consumer","All crowdfunding projects denominated in currencies other than euros"],exps:["❌ Investment-based crowdfunding for SMEs is within the Regulation's scope.","❌ Lending-based crowdfunding for real estate projects may be within scope if the project owner is not a consumer.","✅ Correct — the Regulation excludes peer-to-peer lending between individuals and projects where the project owner qualifies as a consumer under Directive 2008/48/EC on consumer credit.","❌ The Regulation does not exclude crowdfunding based on currency denomination."],correct:2,slide:"Slide 19"}
,
{q:"The Crowdfunding Regulation's 'electronic bulletin board' allows providers to:",opts:["Operate a secondary market equivalent to a regulated trading venue", "Enable investors to express interest in buying or selling loans or securities previously acquired through the platform — facilitating liquidity and exit opportunities, without constituting a multilateral trading system", "Offer new crowdfunding projects to investors on a priority subscription basis", "Provide real-time price quotations for all crowdfunding instruments"],exps:["❌ The bulletin board explicitly does not constitute a multilateral trading system.", "✅ Correct — providers may operate bulletin boards enabling investors to express interest in buying or selling previously acquired loans or securities, facilitating liquidity and exit opportunities.", "❌ The bulletin board is for secondary interest expression, not for offering new projects.", "❌ The bulletin board is not a real-time price quotation system."],correct:1,slide:"Slide 19"},
{q:"The conduct of business principle under the Crowdfunding Regulation states providers must act in the best interests of:",opts:["Only investors, as they are the paying clients", "Both investors AND project owners — 'clients' refers to both parties within the triangular structure; the provider acts as a neutral intermediary facilitating matching", "Only project owners, as they pay the platform fees", "Only sophisticated investors, as unsophisticated investors are not considered 'clients'"],exps:["❌ 'Clients' under the Crowdfunding Regulation includes both investors and project owners.", "✅ Correct — 'clients' refers to both investors and project owners; within the triangular structure, the provider acts as a neutral intermediary facilitating matching between capital supply and demand.", "❌ The best interests duty extends to investors as well as project owners.", "❌ Unsophisticated investors are 'clients' subject to additional protections."],correct:1,slide:"Slide 19"},

const LABELS = ['A','B','C','D'];
let selectedTopic = 'ALL';
let selectedMode = 10;
let sessionQ = [], cur = 0, score = 0, answered = false, wrongs = [];
let sessions = 0, bestScore = null;

function buildTopics() {
  const grid = document.getElementById('topic-grid');
  const allBtn = document.createElement('div');
  allBtn.className = 'topic-btn active';
  allBtn.innerHTML = '<div class="tb-num">ALL</div><div class="tb-name">All Topics Mixed</div>';
  allBtn.onclick = () => selectTopic(allBtn, 'ALL');
  grid.appendChild(allBtn);
  Object.keys(TOPICS).forEach(key => {
    const btn = document.createElement('div');
    btn.className = 'topic-btn';
    const parts = key.split(' — ');
    btn.innerHTML = '<div class="tb-num">'+parts[0]+'</div><div class="tb-name">'+(parts[1]||'')+'</div>';
    btn.onclick = () => selectTopic(btn, key);
    grid.appendChild(btn);
  });
  const total = Object.values(TOPICS).reduce((s,v)=>s+v.length,0);
  document.getElementById('stat-total').textContent = total;
}

function selectTopic(el, topic) {
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedTopic = topic;
}

function selectMode(el, n) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedMode = n;
}

function getPool() {
  if (selectedTopic === 'ALL') return Object.values(TOPICS).flat();
  return TOPICS[selectedTopic] || [];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = getPool();
  if (!pool.length) return;
  sessionQ = shuffle(pool).slice(0, Math.min(selectedMode, pool.length));
  cur = 0; score = 0; answered = false; wrongs = [];
  show('quiz-card'); hide('home-card'); hide('score-card');
  renderQ();
}

function renderQ() {
  const q = sessionQ[cur];
  const pct = Math.round((cur/sessionQ.length)*100);
  document.getElementById('q-num').textContent = 'Question '+(cur+1)+' of '+sessionQ.length;
  document.getElementById('q-score').textContent = '✅ '+score+' correct';
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('q-topic').textContent = q.slide ? '📖 '+q.slide : '';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('next-wrap').style.display = 'none';
  document.getElementById('next-btn').textContent = (cur+1<sessionQ.length) ? 'Next question →' : 'See results →';
  document.getElementById('opts').innerHTML = q.opts.map((o,i) =>
    '<button class="ob" id="ob'+i+'" onclick="answer('+i+')">'
        +'<span class="ol">'+LABELS[i]+'.</span>'
        +'<div style="flex:1"><div>'+o+'</div><div class="opt-exp" id="exp'+i+'"></div></div>'
        +'</button>'
  ).join('');
  answered = false;
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const q = sessionQ[cur];
  for (let i=0; i<q.opts.length; i++) {
    const b = document.getElementById('ob'+i);
    const e = document.getElementById('exp'+i);
    b.disabled = true;
    e.textContent = q.exps[i];
    if (i===q.correct) b.classList.add(idx===q.correct?'correct':'reveal');
    else if (i===idx && idx!==q.correct) b.classList.add('wrong');
    else b.classList.add('neutral');
  }
  if (idx===q.correct) score++;
  else wrongs.push(cur);
  document.getElementById('q-score').textContent = '✅ '+score+' correct';
  document.getElementById('next-wrap').style.display = 'block';
}

function nextQ() {
  cur++;
  if (cur>=sessionQ.length) showScore();
  else renderQ();
}

function showScore() {
  hide('quiz-card'); show('score-card');
  sessions++;
  const pct = Math.round(score/sessionQ.length*100);
  if (bestScore===null || pct>bestScore) bestScore = pct;
  document.getElementById('stat-done').textContent = sessions;
  document.getElementById('stat-best').textContent = bestScore+'%';
  const msg = pct>=80 ? '🎯 Excellent! You are ready for the exam.'
             : pct>=60 ? '📚 Good result — review the topics you missed.'
             : '💪 Keep studying and try again!';
  document.getElementById('score-big').textContent = score+'/'+sessionQ.length;
  document.getElementById('score-pct').textContent = pct+'% correct';
  document.getElementById('score-msg').textContent = msg;
  document.getElementById('miss-section').innerHTML = wrongs.length>0
    ? '<div class="miss-title">📌 Topics to review:</div>'+wrongs.map(i=>'<div class="miss-item">'+sessionQ[i].q+'</div>').join('')
    : '<p style="color:#388e3c;font-size:14px">🎉 Perfect score! No topics to review.</p>';
}

function retryQuiz() { startQuiz(); }
function goHome() { hide('quiz-card'); hide('score-card'); show('home-card'); }
function show(id) { document.getElementById(id).style.display='block'; }
function hide(id) { document.getElementById(id).style.display='none'; }

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', buildTopics);
} else {
  buildTopics();
}
</script>
</body>
</html>
