{q:"What is 'gold plating' in the context of EU law?",opts:["In case of minimum harmonisation, Member States are entitled to provide for stricter provisions than required by European law", "In case of maximum harmonisation, Member States are entitled to provide for less strict provisions than required by European law", "In case of minimum harmonisation, Member States are entitled to provide for less strict provisions than required by European law", "In case of maximum harmonisation, Member States are entitled to provide for stricter provisions than required by European law"],exps:["✅ Correct — 'gold plating' refers to the practice where, in case of minimum harmonisation (where EU law sets a floor), Member States go beyond what is required and provide for stricter provisions than required by European law.", "❌ In case of maximum harmonisation, Member States cannot deviate from the EU standard in either direction. If they could provide less strict provisions, that would violate maximum harmonisation.", "❌ In case of minimum harmonisation, Member States may provide stricter provisions (gold plating), but they are not entitled to provide LESS strict provisions — the EU minimum standard is a floor, not a ceiling.", "❌ In case of maximum harmonisation, Member States cannot provide stricter provisions — the EU standard is a ceiling as well as a floor."],correct:0,slide:"Slide 03"}
,
{q:"Which of the following best describes the relationship between EU Regulations, Directives, and Decisions under Article 288 TFEU?",opts:["There is no formal hierarchy among these three instruments — each serves specific policy needs under Article 288 TFEU","Regulations are superior to Directives in a formal hierarchy, which are in turn superior to Decisions in binding effect","Decisions always prevail over Regulations in individual cases because they are addressed to specific identified parties","Directives are never legally binding on individuals — only Regulations and Decisions create directly enforceable obligations"],exps:["✅ Correct — Article 288 TFEU provides five types of acts with no formal hierarchy among them; each serves specific policy needs.","❌ Unlike national legal systems, EU secondary legislation has no formal hierarchy.","❌ Decisions are binding on their specific addressees but do not 'prevail' over Regulations in a hierarchical sense.","❌ Directives are binding on Member States as to the result to be achieved."],correct:0,slide:"Slide 03"},
{q:"The 'Frankovich principle' in EU law establishes that:",opts:["Member States are liable in damages to individuals who suffer loss due to incorrect or absent implementation of EU Directives","EU Directives are directly applicable without national transposition once the implementation deadline has passed","The Commission may sue Member States for non-implementation exclusively before the CJEU under Article 258 TFEU","Individuals may bring direct actions in the CJEU against Member States that breach EU financial market obligations"],exps:["✅ Correct — the Frankovich principle establishes State liability: when individuals cannot enforce EU-conferred rights because a Directive was not implemented, the State must compensate them.","❌ Direct applicability without transposition describes EU Regulations, not Directives generally.","❌ Infringement proceedings are brought under Article 258 TFEU; Frankovich is about compensation, not infringement.","❌ Individuals cannot bring direct actions in the CJEU against Member States; they use national courts."],correct:0,slide:"Slide 03"},
{q:"ESMA guidelines operate under a 'comply or explain' rule. Which actors are subject to this rule?",opts:["All financial institutions across the EU that fall within ESMA's supervisory remit, including investment firms and CCPs","Only investment firms providing MiFID II investment services that are directly regulated by ESMA under ESA Regulation","National competent authorities, which must comply with ESMA guidelines or formally explain to ESMA why they have not","EU Member States' national parliaments, which must transpose ESMA guidelines into national law within 12 months"],exps:["❌ The comply-or-explain obligation in ESMA guidelines applies to supervisory authorities, not directly to firms.","❌ The rule applies to national supervisory authorities, not specifically to investment firms.","✅ Correct — national competent authorities must comply with ESMA guidelines or explain to ESMA why they have not, under the comply-or-explain mechanism.","❌ National parliaments are not subject to ESMA's comply-or-explain obligation."],correct:2,slide:"Slide 03"},
{q:"Under the Lamfalussy process, which actor drafts Regulatory Technical Standards (RTS) at Level 2?",opts:["The European Parliament, which exercises its co-legislative power to draft implementing rules under the framework directive","National competent authorities, which collaborate to produce binding technical standards through the ESA network","The relevant ESA (EBA, ESMA, or EIOPA), which drafts RTS subject to Commission adoption as binding delegated acts","The European Council, which adopts implementing measures under Article 291 TFEU when technical rules are needed"],exps:["❌ The Parliament co-adopts Level 1 framework legislation but does not draft RTS.","❌ NCAs implement and supervise; they do not draft EU-wide technical standards.","✅ Correct — at Level 2, the relevant ESA drafts RTS (substantive regulatory rules) and ITS (technical/procedural details), which are then adopted by the Commission.","❌ The European Council sets political direction but does not draft technical standards."],correct:2,slide:"Slide 03"},
{q:"The Cassis de Dijon case (1979) is significant in EU financial markets law because:",opts:["It established the primacy of EU law over conflicting national law, enabling the Commission to enforce financial rules","It laid foundations for the principle of mutual recognition, underpinning the single market and financial passporting","It first recognised the direct effect of EU Treaty provisions, allowing individuals to invoke them before national courts","It established criminal liability for market manipulation, forming the basis for the MAR enforcement framework"],exps:["❌ Primacy of EU law was established in Costa v ENEL (1964).","✅ Correct — Cassis de Dijon consolidated free movement of goods and laid foundations for the principle of mutual recognition, which underpins single market integration.","❌ Direct effect was established in Van Gend en Loos (1963).","❌ Criminal liability for market manipulation was introduced by MAD II (2014)."],correct:1,slide:"Slide 03"},
{q:"Level 4 of the Lamfalussy process concerns:",opts:["Adoption of framework directives and regulations by the European Parliament and Council at the highest legislative level","Drafting of Regulatory Technical Standards and Implementing Technical Standards by the relevant European Supervisory Authority","Supervisory convergence activities through peer reviews, guidelines, and Q&A documents issued by the ESAs at Level 3","Commission monitoring of correct transposition and application of EU law, with power to bring infringement proceedings"],exps:["❌ Framework legislation is adopted at Level 1.","❌ Technical standards are drafted at Level 2.","❌ Supervisory convergence activities occur at Level 3.","✅ Correct — at Level 4, the Commission monitors correct transposition and application of EU law by Member States, with power to bring infringement proceedings."],correct:3,slide:"Slide 03"},
{q:"Which of the following describes 'maximum harmonisation' in EU financial regulation?",opts:["Member States may exceed EU requirements to provide stricter investor protection where domestic markets require it","EU rules establish minimum standards, leaving Member States free to add additional national requirements on top","EU rules apply uniformly across the Union, leaving little or no room for Member States to impose additional requirements","EU rules set out principles only, with Member States retaining full discretion to determine all implementing details"],exps:["❌ Going beyond EU requirements describes minimum harmonisation (gold-plating).","❌ Setting only minimum standards describes minimum harmonisation.","✅ Correct — maximum harmonisation means EU rules apply uniformly, converting nationally segmented regimes into a single European standard with no room for national deviation.","❌ Maximum harmonisation involves detailed rules, not principles-only approaches."],correct:2,slide:"Slide 03"},
{q:"The EBA website (eba.europa.eu) is the primary source for:",opts:["CJEU judgments and Advocate General opinions on EU financial law, accessible through the Curia search database","ESMA financial market guidelines, technical standards, and recommendations on securities and capital markets regulation","Banking rules, guidelines, Q&As on credit institutions, investment firms, and crypto-asset issuers under MiCAR","Insurance and occupational pensions sector rules, including Solvency II guidelines and PEPP supervisory standards"],exps:["❌ CJEU judgments are found on Curia (curia.europa.eu).","❌ ESMA guidelines are found on esma.europa.eu.","✅ Correct — EBA (eba.europa.eu) is the primary source for banking rules, guidelines, recommendations, Q&As on credit institutions and, under MiCAR, on crypto-assets.","❌ Insurance and pensions rules are found on EIOPA (eiopa.europa.eu)."],correct:2,slide:"Slide 03"},
{q:"Direct effect of EU law means:",opts:["EU Regulations must be published in the Official Journal of the EU before they can enter into force and be applied","The European Commission may enforce EU law directly against private parties without going through national courts","EU law always prevails over conflicting national law in all circumstances, regardless of the nature of the conflict","EU law provisions create rights that individuals can invoke directly before national courts without national implementing measures"],exps:["❌ Publication in the Official Journal is a transparency requirement, not the meaning of direct effect.","❌ The Commission enforces EU law against Member States, not individuals directly.","❌ Primacy (supremacy) describes EU law's precedence; direct effect describes its enforceability by individuals.","✅ Correct — direct effect means certain EU law provisions create rights and obligations that individuals can rely on directly before national courts, without needing national implementing legislation."],correct:3,slide:"Slide 03"},
{q:"The principle of subsidiarity in EU law provides that:",opts:["EU institutions must always act before Member States in the area of financial regulation to ensure uniform standards","Regulations always take precedence over Directives and national law in the hierarchy of EU legal sources","EU law always prevails over national law on all matters, including those not covered by specific EU legislative acts","The Union acts only where objectives cannot be sufficiently achieved at Member State level and are better achieved at Union level"],exps:["❌ Subsidiarity limits when the EU acts; it does not require EU action before national action.","❌ Subsidiarity concerns when the EU acts, not the hierarchy among EU legal acts.","❌ That describes the primacy principle, not subsidiarity.","✅ Correct — the subsidiarity principle means the Union acts only where the objectives cannot be sufficiently achieved at Member State level and can be better achieved at Union level."],correct:3,slide:"Slide 03"},
{q:"When researching EU capital markets law in practice, which challenge arises from the interaction of multiple regulatory levels?",opts:["Practitioners must simultaneously trace Directive transposition, Level 2 standards, and ESA guidelines — all at once","EU Regulations are never supplemented by national law, making research simple once the relevant Regulation is identified","Only Level 1 legislation is legally binding — Level 2 delegated acts and ESA guidelines can safely be ignored in practice","National law always prevails over EU soft law, making ESA guidelines irrelevant to national court proceedings"],exps:["✅ Correct — navigating EU capital markets law requires juggling national and supranational layers: tracing directive transposition, finding Level 2 technical standards that supplement regulations, and applying ESA guidelines, all at the same time.","❌ Even directly applicable Regulations are supplemented by national implementing measures and ESA guidelines.","❌ Level 2 RTS/ITS are legally binding once adopted by the Commission; ESA guidelines carry strong compliance expectations.","❌ EU law (including soft law with significant compliance effect) prevails over conflicting national law under the primacy principle."],correct:0,slide:"Slide 03"}],
"04 — Supervisory Architecture":[
{q:"The ESFS (European System of Financial Supervision) is centred around:",opts:["The ECB and the SSM only — as established under the relevant EU secondary legislation framework","The European Commission and national competent authorities — as confirmed by the relevant CJEU case law and regulatory guidance","ESMA alone with direct supervisory powers over all financial sectors","Three ESAs, the ESRB, and national supervisors, creating an integrated supervisory network"],exps:["❌ The SSM is part of banking supervision, not the entire ESFS.","❌ The Commission and NCAs are not the centrepiece.","❌ ESMA is only one of the three ESAs.","✅ Correct — the ESFS centres around the three ESAs, the ESRB, and national supervisors."],correct:3,slide:"Slide 04"},
{q:"The Meroni doctrine (CJEU, 1956) established which fundamental limit on EU agencies?",opts:["Agencies may exercise any power delegated to them by the Commission or Council — as specified in the relevant delegated acts and ESMA guidelines","Agencies cannot impose financial penalties without prior court authorisation — reflecting the product-focused approach of this EU regulatory framework","Agencies must obtain unanimous Council approval before exercising supervisory powers — a requirement that applies from the date of authorisation onward","Agencies could only exercise 'clearly defined executive powers' subject to judicial review, not regulatory powers implying wide discretion for economic policy"],exps:["❌ The Meroni doctrine restricts agency powers, not grants unlimited delegation.","❌ Financial penalties without court authorisation is a different issue.","❌ Unanimous Council approval is not required under Meroni.","✅ Correct — Meroni established that agencies could only exercise 'clearly defined executive powers' subject to judicial review, not powers implying wide discretion."],correct:3,slide:"Slide 04"},
{q:"The Short Selling case (2014) affected the Meroni doctrine by:",opts:["Softening Meroni standards post-Lisbon, allowing a margin of discretion when expertise is required, subject to objective criteria and judicial review","Confirming that the original 1956 Meroni doctrine applies unchanged to modern ESAs — as established under the relevant EU secondary legislation framework","Abolishing the Meroni doctrine entirely for financial regulation — reflecting the harmonisation objective of the EU single financial market","Extending Meroni to cover all EU agencies, not just financial supervisors — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the CJEU softened Meroni standards, allowing ESAs a margin of discretion when expertise is required, subject to objective criteria and judicial review.","❌ The Short Selling case softened, not confirmed, the original Meroni standards.","❌ The Meroni doctrine was not abolished; core constraints remain valid per Fundación Tatiana (2024).","❌ The case specifically concerned ESMA's powers."],correct:0,slide:"Slide 04"},
{q:"ESMA is headquartered in which city and operates under which founding Regulation?",opts:["Frankfurt; Regulation 1092/2010","Paris; Regulation 1095/2010","London; Regulation 1093/2010","Brussels; Regulation 1094/2010"],exps:["❌ Frankfurt is where the ECB and EIOPA are based; Regulation 1092/2010 established the ESRB.","✅ Correct — ESMA is headquartered in Paris since 2011 and operates under Regulation 1095/2010.","❌ ESMA relocated from London to Paris; Regulation 1093/2010 established EBA.","❌ ESMA is based in Paris; Regulation 1094/2010 established EIOPA."],correct:1,slide:"Slide 04"},
{q:"ESMA's Board of Supervisors comprises:",opts:["The Chair, Executive Director, and six elected management board members","27 NCA heads with ultimate decision-making power","Representatives from the Commission, ECB, and Member State finance ministers","The three ESA chairs meeting jointly on cross-sectoral issues"],exps:["❌ Those are management board members, not the Board of Supervisors.","✅ Correct — the Board of Supervisors comprises 27 NCA heads and holds ultimate decision-making power.","❌ The Board of Supervisors comprises NCA heads, not Commission or ECB representatives.","❌ The three ESA chairs meeting describes the Joint Committee function."],correct:1,slide:"Slide 04"},
{q:"ESMA's Article 17 power enables it to:",opts:["Direct national supervisors or market participants when Union law is breached, ensuring compliance across jurisdictions","Prohibit or restrict financial activities threatening market integrity — product intervention","Engage in binding mediation to settle disputes between NCAs","Act decisively during declared emergencies"],exps:["✅ Correct — Article 17 empowers ESMA to direct national supervisors or market participants when Union law is breached.","❌ Product intervention (prohibiting or restricting activities) is Article 9(5).","❌ Binding mediation is Article 19.","❌ Acting during declared emergencies is Article 18."],correct:0,slide:"Slide 04"},
{q:"ESMA's Article 18 power enables it to:",opts:["Direct national supervisors or market participants when Union law is breached — a requirement introduced by the Lamfalussy Level 2 implementing measures","Prohibit or restrict financial activities threatening market integrity — as confirmed by the CJEU in its consistent line of case law on this point","Act decisively during declared emergencies, coordinating responses to market stress and systemic threats","Engage in binding mediation to settle disputes between NCAs — a principle established in the foundational Regulation governing this area"],exps:["❌ Directing supervisors when Union law is breached is Article 17.","❌ Product intervention is Article 9(5).","✅ Correct — Article 18 allows ESMA to act decisively during declared emergencies, coordinating responses to market stress.","❌ Binding mediation is Article 19."],correct:2,slide:"Slide 04"},
{q:"ESMA's Article 9(5) power is notable because:",opts:["It is the standard mechanism for infringement proceedings against Member States — a requirement introduced by the Lamfalussy Level 2 implementing measures","It permits prohibiting or restricting financial activities threatening market integrity or stability — ESMA is the only ESA authority to have activated this power","It enables binding mediation between national supervisors — reflecting the maximum harmonisation approach adopted in this EU framework","It allows ESMA to directly supervise all credit rating agencies — a principle established in the foundational Regulation governing this area"],exps:["❌ Infringement proceedings are launched by the Commission under Article 258 TFEU.","✅ Correct — Article 9(5) permits prohibiting or restricting financial activities threatening market integrity or stability; ESMA is the only ESA to have activated this product intervention power.","❌ Binding mediation is Article 19.","❌ Direct supervision of credit rating agencies is one of ESMA's direct supervisory functions but not Article 9(5)."],correct:1,slide:"Slide 04"},
{q:"The EBA was relocated from London to Paris in which year, under which Regulation?",opts:["2016; Regulation 1093/2010","2021; Regulation 1093/2010","2019; Regulation 2019/2175","2019; Regulation 1093/2010"],exps:["❌ 2016 is when the Brexit referendum occurred, not when EBA relocated.","❌ EBA relocated in 2019, not 2021.","❌ While the relocation occurred in 2019, the founding Regulation is 1093/2010.","✅ Correct — the EBA was relocated from London to Paris in 2019. It operates under Regulation 1093/2010."],correct:3,slide:"Slide 04"},
{q:"Under MiCAR, EBA's new mandate includes:",opts:["Direct supervision of all crypto-asset service providers in the EU — as established under the relevant EU secondary legislation framework","Supervision only of crypto-asset trading platforms registered under MiCAR — as confirmed by the relevant CJEU case law and regulatory guidance","Supervision of all utility token issuers across the EU — reflecting the harmonisation objective of the EU single financial market","Direct supervision of significant ART and EMT issuers above significance thresholds — the first time EBA becomes a direct supervisor"],exps:["❌ Crypto-asset service providers are supervised by NCAs and ESMA for significant ones.","❌ Trading platforms are subject to national or ESMA supervision, not EBA.","❌ Utility token issuers are not under EBA's direct supervision.","✅ Correct — MiCAR grants EBA direct supervision of significant ART and EMT issuers, marking the first time EBA becomes a direct supervisor, mirroring ESMA's model."],correct:3,slide:"Slide 04"},
{q:"EIOPA is headquartered in which city and covers which sectors?",opts:["Frankfurt am Main; insurance, reinsurance, institutions for occupational retirement provision, and financial conglomerates","Paris; banking and investment services — as established under the relevant EU secondary legislation framework","Brussels; capital markets and investment funds — reflecting the harmonisation objective of the EU single financial market","Luxembourg; securities and derivatives markets — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — EIOPA is headquartered in Frankfurt am Main under Regulation 1094/2010 and covers insurance, reinsurance, IORPs, insurance intermediaries, and financial conglomerates.","❌ Paris is where ESMA and EBA are based.","❌ Capital markets and investment funds are ESMA's mandate.","❌ Luxembourg is where the CJEU is based."],correct:0,slide:"Slide 04"},
{q:"The Banking Union comprises which three pillars?",opts:["Single Supervisory Mechanism (SSM), Single Resolution Mechanism (SRM), and European Deposit Insurance Scheme (EDIS — proposed)","ESMA, EBA, and EIOPA — as established under the relevant EU secondary legislation framework","European Central Bank, European Stability Mechanism, and EDIS — reflecting the harmonisation objective of the EU single financial market","SSM, ESRB, and SRM — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the Banking Union pillars are the SSM, SRM, and EDIS (proposed).","❌ ESMA, EBA, and EIOPA are the three ESAs, not the Banking Union pillars.","❌ The European Stability Mechanism is not a Banking Union pillar.","❌ The ESRB is not a Banking Union pillar."],correct:0,slide:"Slide 04"},
{q:"The ESRB is responsible for:",opts:["Direct supervision of systemically important banks in the euro area — as established under the relevant EU secondary legislation framework","Macro-prudential oversight, detecting and mitigating systemic threats through risk warnings and recommendations","Developing technical standards for financial regulation across all sectors — reflecting the harmonisation objective of the EU single financial market","Approving all Level 2 delegated acts in the financial sector — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Direct supervision of systemically important banks is the SSM/ECB's role.","✅ Correct — the ESRB is responsible for macro-prudential oversight, established by Regulation 1092/2010, hosted by ECB but institutionally independent.","❌ Developing technical standards is done by the three ESAs.","❌ Approving Level 2 delegated acts is the Commission's role."],correct:1,slide:"Slide 04"},
{q:"The Board of Appeal shared by EBA, ESMA and EIOPA is best described as:",opts:["An optional alternative to judicial review — as established under the relevant EU secondary legislation framework","A mandatory intermediate layer before the General Court with full jurisdiction over ESA decisions, able to confirm, amend or replace contested measures","A purely advisory body with no power to modify ESA decisions — reflecting the harmonisation objective of the EU single financial market","A political body composed of EU institutional representatives — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The Board of Appeal is mandatory, not optional.","✅ Correct — it is a mandatory intermediate layer before the General Court, with full jurisdiction to confirm, amend, or replace ESA decisions.","❌ The Board of Appeal has real decisional power.","❌ It comprises experts in banking, insurance, or securities law with demonstrated expertise — not a political body."],correct:1,slide:"Slide 04"},
{q:"AMLA (European Anti-Money Laundering Authority) was established by which Regulation and is based where?",opts:["Regulation 2024/1620; Frankfurt am Main","Regulation 1095/2010; Paris","Regulation 1093/2010; Paris","Regulation 1092/2010; Frankfurt am Main"],exps:["✅ Correct — AMLA was established by Regulation 2024/1620 and is based in Frankfurt am Main.","❌ Regulation 1095/2010 established ESMA.","❌ Regulation 1093/2010 established EBA.","❌ Regulation 1092/2010 established the ESRB."],correct:0,slide:"Slide 04"},
{q:"The pre-2001 state of EU financial supervision was characterised by:",opts:["A centralised EU-level supervisory system with uniform procedures — as established under the relevant EU secondary legislation framework","Supervisory competence residing solely with national authorities, creating fragmented systems with differing procedures and enforcement powers","A network of ESAs coordinating with national supervisors — reflecting the harmonisation objective of the EU single financial market","ESMA having direct supervisory powers over all capital market participants — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ There was no centralised EU supervisory system before 2001.","✅ Correct — before 2001, supervisory competence resided solely with national authorities, creating fragmented, differing systems.","❌ The ESA network was created in 2011.","❌ ESMA was established in 2011."],correct:1,slide:"Slide 04"},
{q:"The De Larosière group was significant because:",opts:["It proposed the Lamfalussy process for capital markets regulation in 2001 — as established under the relevant EU secondary legislation framework","It drafted the first EU framework for crypto-assets — as confirmed by the relevant CJEU case law and regulatory guidance","It established AMLA as the EU's anti-money laundering authority — reflecting the harmonisation objective of the EU single financial market","It recommended comprehensive supervisory upgrade across all financial sectors following the 2008 financial crisis, leading to the creation of the ESAs in 2011"],exps:["❌ The Lamfalussy process was proposed by the Committee of Wise Men in 2001.","❌ The De Larosière group preceded MiCAR.","❌ AMLA was established by Regulation 2024/1620, not by the De Larosière group.","✅ Correct — the De Larosière group recommended a comprehensive supervisory upgrade following the 2008 financial crisis, leading to the three ESAs in 2011."],correct:3,slide:"Slide 04"},
{q:"The Joint Committee of ESAs serves which function?",opts:["It replaces the three individual ESA boards for all financial regulation — as established under the relevant EU secondary legislation framework","It is the central forum for cross-sectoral issues — anti-money laundering, PRIIPs, cloud outsourcing, securitisation — issuing common guidance across banking, capital markets, and insurance","It directly supervises significant financial institutions across all three sectors — reflecting the harmonisation objective of the EU single financial market","It advises the Commission on all Level 1 legislative proposals — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The Joint Committee supplements, does not replace, the individual ESA boards.","✅ Correct — the Joint Committee is the central forum for cross-sectoral issues, issuing common guidance on AML, PRIIPs, cloud outsourcing, securitisation.","❌ Direct supervision of significant institutions is done by individual ESAs and NCAs.","❌ The Joint Committee does not primarily advise on Level 1 legislative proposals."],correct:1,slide:"Slide 04"},
{q:"The future direction of EU financial supervision involves which trend?",opts:["Progressive decentralisation returning supervisory powers to national authorities — as established under the relevant EU secondary legislation framework","Reduction of ESMA's mandate to focus exclusively on capital markets — as confirmed by the relevant CJEU case law and regulatory guidance","Elimination of the three ESAs and replacement with a single unified supervisor — reflecting the harmonisation objective of the EU single financial market","Progressive selective centralisation — transfer of direct supervisory powers to EU-level institutions for areas with significant cross-border externalities"],exps:["❌ The trend is towards centralisation, not decentralisation.","❌ ESMA's mandate is expanding, not being reduced.","❌ There are no proposals to eliminate the three ESAs.","✅ Correct — recent developments signal deepening integration with expanding direct supervisory powers for ESMA, EBA's crypto mandate, and enhanced cross-sectoral coordination."],correct:3,slide:"Slide 04"},
{q:"ESMA's direct supervisory functions include which entities?",opts:["Trade repositories under EMIR and SFTR, credit rating agencies, EU administrators of critical benchmarks, significant crypto-asset service providers under MiCAR, and DLT market infrastructures","All investment firms and credit institutions in the EU — as established under the relevant EU secondary legislation framework — a position that differs from the correct EU legal framework applicable in this context","All regulated markets and multilateral trading facilities in the EU — reflecting the harmonisation objective of the EU single financial market","All investment funds and their managers across the EU — as established under the relevant EU secondary legislation framework — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — ESMA directly supervises trade repositories, credit rating agencies, EU critical benchmark administrators, significant CASPs under MiCAR, and DLT market infrastructures.","❌ All investment firms and credit institutions are supervised by national authorities (and the ECB for significant banks).","❌ Regulated markets and MTFs are supervised by national competent authorities.","❌ Investment funds and their managers are supervised by national authorities."],correct:0,slide:"Slide 04"}
,
{q:"Regarding the European System of Financial Supervision (ESFS), which of the following is correct?",opts:["It was conceived by the de Larosière Report as a structure within the Single Supervisory Mechanism", "The Joint Committee of ESAs is responsible for micro-prudential supervision", "It focuses on micro-prudential supervision, whereas the ESRB focuses on macro-prudential supervision", "It is structured within the ESRB and directly accountable to it"],exps:["❌ The de Larosière Report conceived the ESFS as a structure involving three ESAs and the ESRB — not specifically within the SSM (the SSM was created later in 2014).", "❌ The Joint Committee of ESAs is responsible for cross-sectoral issues, not specifically for micro-prudential supervision. Micro-prudential supervision is the responsibility of individual ESAs and national competent authorities.", "✅ Correct — the ESFS covers micro-prudential supervision through the three ESAs (ESMA, EBA, EIOPA) and national competent authorities, while the ESRB focuses on macro-prudential oversight to prevent systemic risk.", "❌ The ESFS is not structured within the ESRB; the ESRB is a separate body responsible for macro-prudential oversight, hosted by the ECB but institutionally independent."],correct:2,slide:"Slide 04"}
,
{q:"The European Systemic Risk Board (ESRB), established by Regulation 1092/2010, is responsible for:",opts:["Macro-prudential oversight, detecting and mitigating systemic threats to financial stability through warnings and recommendations","Directly supervising systemically important credit institutions and imposing binding capital add-ons under the SSM","Drafting Regulatory Technical Standards on capital requirements and liquidity buffers for banking and investment firms","Granting initial authorisation to credit institutions and investment firms across all 27 EU Member States"],exps:["✅ Correct — the ESRB is responsible for macro-prudential oversight of the EU financial system, detecting and mitigating systemic risks through warnings and recommendations.","❌ Direct supervision of systemic banks is the SSM's role under the ECB.","❌ RTS drafting is the role of EBA, ESMA, and EIOPA.","❌ Authorization of credit institutions is a national competent authority function."],correct:0,slide:"Slide 04"},
{q:"The Banking Union's three pillars are:",opts:["EBA, ESMA, and EIOPA — the three European Supervisory Authorities established by the 2010 ESA founding Regulations","Single Supervisory Mechanism (SSM), Single Resolution Mechanism (SRM), and European Deposit Insurance Scheme (EDIS)","European Financial Stability Facility, European Stability Mechanism, and the ECB — forming the crisis management framework","ESRB, the three ESAs, and their Joint Committee — forming the European System of Financial Supervision"],exps:["❌ EBA, ESMA, and EIOPA are the three ESAs, not the Banking Union pillars.","✅ Correct — the Banking Union consists of the SSM, the SRM, and the proposed EDIS.","❌ These are crisis-management mechanisms, not Banking Union pillars.","❌ These form part of the ESFS, not the Banking Union."],correct:1,slide:"Slide 04"},
{q:"AMLA — the European Anti-Money Laundering Authority — is based in which city and was established by which Regulation?",opts:["Frankfurt am Main; Regulation 2024/1620, marking a paradigm shift in EU AML/CFT institutional architecture","Paris; Regulation 1095/2010 — the same Regulation that established ESMA and its powers over capital markets supervision","Luxembourg; Regulation 2023/1114 (MiCAR), which mandated AMLA's creation as part of the crypto-asset oversight framework","Brussels; Regulation 2019/2033 (IFR), which established both the investment firm prudential framework and anti-money laundering"],exps:["✅ Correct — AMLA is based in Frankfurt am Main and was established by Regulation 2024/1620, representing a paradigm shift in EU AML/CFT institutional architecture.","❌ Paris is where ESMA is based; Regulation 1095/2010 established ESMA.","❌ Luxembourg hosts the CJEU; Regulation 2023/1114 is MiCAR.","❌ Brussels hosts several EU institutions; Regulation 2019/2033 is the IFR for investment firms."],correct:0,slide:"Slide 04"},
{q:"EIOPA is headquartered in which city and operates under which founding Regulation?",opts:["Paris; Regulation 1095/2010 — the same Regulation governing ESMA, covering both securities and insurance supervision","Frankfurt am Main; Regulation 1094/2010, covering insurance undertakings, reinsurance, and occupational pensions","Brussels; Regulation 1093/2010 — the same framework used for EBA, covering all financial sector prudential oversight","London; Regulation 1092/2010, before EIOPA relocated to Frankfurt following the 2016 Brexit referendum outcome"],exps:["❌ Paris; Regulation 1095/2010 describes ESMA.","✅ Correct — EIOPA is headquartered in Frankfurt am Main under Regulation 1094/2010, covering insurance and occupational pensions.","❌ Brussels; Regulation 1093/2010 describes the EBA's current situation (though EBA relocated to Paris in 2019).","❌ London; Regulation 1092/2010 describes ESRB, which is hosted by the ECB in Frankfurt. EIOPA was never in London."],correct:1,slide:"Slide 04"},
{q:"The Joint Committee of the ESAs serves which main function?",opts:["Acting as a cross-sectoral forum for issues spanning banking, capital markets, and insurance — including AML and PRIIPs","Acting as the appellate body for reviewing legality and merits of binding decisions taken by ESMA, EBA, and EIOPA","Directly supervising pan-European market infrastructures including CCPs, CSDs, and trade repositories on behalf of all ESAs","Setting binding reference interest rates for the euro area based on input from all three ESAs and the ECB"],exps:["✅ Correct — the Joint Committee of the ESAs is a cross-sectoral forum addressing issues spanning banking, capital markets, and insurance, including work on AML, PRIIPs, cloud outsourcing, and securitisation.","❌ The appellate function belongs to the shared Board of Appeal, not the Joint Committee.","❌ Direct supervision of market infrastructures is primarily ESMA's function.","❌ Interest rates are set by the ECB Governing Council."],correct:0,slide:"Slide 04"},
{q:"The Board of Appeal serving all three ESAs consists of how many members and alternates, and serves what purpose?",opts:["27 members (one per Member State) deciding binding arbitration between national supervisors and EU-level authorities","Three members (one from each ESA), deciding on supervisory convergence measures and binding mediation outcomes","Six members and six alternates with proven expertise, providing independent review of ESA decisions before General Court appeal","Nine members appointed by the European Council for 10-year terms to ensure long-term institutional independence"],exps:["❌ 27 members describes the composition of the ESA Boards of Supervisors (one NCA head per Member State).","❌ One member per ESA would undermine the independence of the review body.","✅ Correct — the shared Board of Appeal has six members and six alternates with proven expertise, providing a mandatory intermediate layer of independent review before parties can appeal to the General Court.","❌ The Board of Appeal is not appointed by the European Council and serves 5-year renewable terms."],correct:2,slide:"Slide 04"},
{q:"ESMA's Article 19 power enables it to:",opts:["Prohibit or restrict financial activities or products posing a threat to investor protection or market integrity","Direct national supervisors or market participants when Union law is being breached and the NCA has failed to act","Act decisively during declared emergencies by adopting temporary measures valid for up to three months","Engage in binding mediation to settle disagreements between national competent authorities in cross-border situations"],exps:["❌ Prohibiting/restricting activities is Article 9(5) product intervention.","❌ Directing supervisors/participants for Union law breaches is Article 17.","❌ Acting during declared emergencies is Article 18.","✅ Correct — Article 19 empowers ESMA to engage in binding mediation to settle disputes between national competent authorities, promoting consistent supervisory approaches across borders."],correct:3,slide:"Slide 04"},
{q:"Under the 2015 SIU proposals, which function is proposed to be transferred to ESMA as a signal toward a 'single supervisor' model?",opts:["Prospectus approval, market abuse surveillance, and consolidated tape oversight","Direct supervision of all credit institutions in the euro area","Setting capital requirements for investment firms","Administering the ESRB risk warning mechanism"],exps:["✅ Correct — the SIU package proposes transferring prospectus approval, market abuse surveillance, and consolidated tape oversight to ESMA, signalling a shift toward a single supervisor model for cross-border activities.","❌ Credit institution supervision is an SSM/ECB function.","❌ Capital requirements for investment firms are set by the IFR/IFD framework, not ESMA directly.","❌ The ESRB warning mechanism is not part of the ESMA centralisation proposals."],correct:0,slide:"Slide 04"},
{q:"In the de Larosière Report (2009), the group recommended:",opts:["Abolishing national supervisors and replacing them with a single EU super-regulator for all financial sector activities","Extending the Lamfalussy process exclusively to cover banking supervision while retaining national approaches elsewhere","Transferring all supervisory powers immediately to the ECB as part of an accelerated Banking Union completion","A comprehensive supervisory upgrade across all financial sectors, leading to the creation of the three ESAs"],exps:["❌ The de Larosière Report did not recommend abolishing national supervisors; national authorities remained central to the ESFS.","❌ The de Larosière Report recommended upgrading supervision across all financial sectors, not restricting it to banking.","❌ Transferring all powers to the ECB was not the recommendation; direct banking supervision came later via the SSM.","✅ Correct — the de Larosière group recommended a comprehensive upgrade creating the three sectoral ESAs (ESMA, EBA, EIOPA) as part of the European System of Financial Supervision."],correct:3,slide:"Slide 04"},
{q:"Which of the following is NOT a direct supervisory function of ESMA?",opts:["Supervision of EU-registered credit rating agencies, including registration withdrawal and on-site inspections","Supervision of administrators of EU critical benchmarks under the Benchmarks Regulation 2016/1011","Supervision of Tier 2 third-country CCPs under EMIR 2.2 based on systemic importance assessments","Direct supervision of all investment firms operating in the EU, replacing national competent authority oversight"],exps:["❌ ESMA does directly supervise credit rating agencies — this is one of its established direct powers.","❌ ESMA directly supervises EU administrators of critical benchmarks — another established direct function.","❌ ESMA does directly supervise Tier 2 third-country CCPs under EMIR 2.2.","✅ Correct — ESMA does not directly supervise all EU investment firms; those are supervised by national competent authorities. ESMA's direct powers are specific and targeted."],correct:3,slide:"Slide 04"},
{q:"EBA's supervisory convergence toolkit includes which of the following activities?",opts:["Directly authorising all credit institutions in the EU and imposing binding Pillar 2 capital add-ons on systemic banks","Setting binding interest rates for euro-area credit institutions and overseeing the ECB's monetary policy transmission","Chairing colleges of supervisors, conducting peer reviews, performing biennial EU-wide stress tests, and binding mediation","Directly supervising all MiFID II investment firms in the EU, monitoring their capital, liquidity, and conduct obligations"],exps:["❌ Direct authorisation of credit institutions remains with national competent authorities.","❌ Interest rates are set by the ECB, not EBA.","✅ Correct — EBA's convergence tools include: chairing supervisor colleges, peer reviews of NCAs, disseminating best practices, binding mediation, and biennial EU-wide stress tests assessing banking resilience.","❌ Direct supervision of investment firms under MiFID II is an NCA function; EBA focuses on credit institutions."],correct:2,slide:"Slide 04"},
{q:"The proposed transfer of supervisory mandates to ESMA under the Savings and Investments Union signals a shift toward which model for cross-border activities?",opts:["A fully decentralised model where each Member State retains complete supervisory autonomy for all financial activities","A 'single supervisor' model for cross-border activities, with ESMA receiving direct powers over prospectus approval and more","A Banking Union-style model where the ECB takes over all securities and investment firm supervision across the Union","An informal peer review model replacing formal supervisory delegation, retaining all powers with national competent authorities"],exps:["❌ The SIU proposals explicitly move away from full decentralisation for cross-border activities.","✅ Correct — the SIU package proposes transferring prospectus approval, market abuse surveillance, and consolidated tape oversight to ESMA, signalling a shift toward a 'single supervisor' model for activities with significant cross-border externalities.","❌ The ECB's supervisory role is limited to banking (SSM); ESMA would receive the proposed capital markets powers.","❌ The proposals involve formal legislative transfer of powers, not informal peer review."],correct:1,slide:"Slide 04"}],
"05 — Savings & Investments Union":[
{q:"The three critical problems caused by fragmentation of EU capital markets are:",opts:["Lack of supervisory convergence, absence of soft law, and insufficient ESA powers","Over-regulation of retail investors, lack of financial literacy, and inadequate pension systems","Excessive gold-plating, insufficient mutual recognition, and absence of a passporting regime","Inflated cost of capital, discouraged cross-border investment, and enforcement asymmetries between Member States"],exps:["❌ Supervisory convergence and ESA powers are separate issues.","❌ Retail investor issues and pension systems are discussed separately.","❌ These are related concepts but not the three specific critical fragmentation problems identified.","✅ Correct — the three critical problems are: inflated cost of capital (duplicated disclosures deter equity market access), discouraged investment (different regimes depress cross-border allocation), and enforcement asymmetries (creating regulatory arbitrage)."],correct:3,slide:"Slide 05"},
{q:"The aspiration to create 'an area without internal frontiers' first appeared in which treaty and is now codified where?",opts:["The Maastricht Treaty (1992); Article 63 TFEU","The Treaty of Amsterdam (1997); Article 56 TFEU","The Treaty of Lisbon (2009); Article 49 TFEU","The Treaty of Rome (1957); Article 26 TFEU"],exps:["❌ While Article 63 TFEU governs capital freedom, the aspiration for an area without internal frontiers first appeared in the Treaty of Rome (1957).","❌ The Treaty of Amsterdam is not the source of this aspiration.","❌ The Treaty of Lisbon introduced the TFEU; Article 49 covers freedom of establishment.","✅ Correct — the aspiration first appeared in the Treaty of Rome (1957) and is now codified in Article 26 TFEU."],correct:3,slide:"Slide 05"},
{q:"The Gebhard proportionality test, as applied to measures derogating from fundamental freedoms, requires that measures:",opts:["Be approved by the European Commission and notified to ESMA before entering into force — as specified in the relevant delegated acts and ESMA guidelines","Pursue legitimate objectives, apply without discrimination, be suitable for achieving goals, and go no further than necessary — four cumulative conditions","Be adopted through the ordinary legislative procedure and subject to a parliamentary vote — a requirement that applies from the date of authorisation onward","Be consistent with mutual recognition and home-country control principles — reflecting the product-focused approach of this EU regulatory framework"],exps:["❌ The Gebhard test is a judicial proportionality standard; it does not require prior Commission approval.","✅ Correct — the four-part Gebhard test: legitimate objectives, non-discrimination, suitable for achieving goals, and going no further than necessary.","❌ The Gebhard test applies to national measures reviewed by courts.","❌ Mutual recognition and home-country control are integration techniques, not the Gebhard test."],correct:1,slide:"Slide 05"},
{q:"'Negative integration' as an EU capital markets integration technique is best described as:",opts:["Directives establishing common standards but allowing Member States to impose additional requirements — as established under the relevant EU secondary legislation framework","The passporting regime enabling single authorisation for cross-border services — as confirmed by the relevant CJEU case law and regulatory guidance","Directives and Regulations applying uniformly, leaving little room for gold-plating — reflecting the harmonisation objective of the EU single financial market","Treaty freedoms enforced through Court of Justice review under non-discrimination and proportionality principles — proved insufficient to overcome deeply rooted national divergences"],exps:["❌ Directives allowing additional requirements describes 'Mutual Recognition' (1980s–1990s).","❌ The passporting regime is a product of positive integration through legislation.","❌ Uniform application leaving little room for gold-plating describes 'Maximum Harmonisation' (post-2008).","✅ Correct — negative integration means Treaty freedoms enforced through CJEU review; it proved insufficient to overcome national divergences in company, property, and contract laws."],correct:3,slide:"Slide 05"},
{q:"The passporting regime is best described as:",opts:["A principle establishing that once an undertaking is licensed in its home Member State, it may carry on the same activity throughout the EU without needing further licences","A system requiring firms to obtain separate licences in each Member State where they wish to operate — as established under the relevant EU secondary legislation framework","A supervisory mechanism giving host country authorities primary responsibility for ongoing prudential oversight — reflecting the harmonisation objective of the EU single financial market","A mutual recognition agreement applying only to banking institutions — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the passporting regime means once an undertaking is licensed in its home Member State (satisfying common requirements once), it may carry on the same activity throughout the EU without further licences.","❌ Requiring separate licences in each Member State is precisely what the passporting regime eliminates.","❌ Primary responsibility for ongoing prudential oversight lies with the home country authority.","❌ The passporting regime applies broadly across financial services, not only banking."],correct:0,slide:"Slide 05"},
{q:"Under the passporting regime, how long does a firm wait before beginning cross-border operations after notifying its home supervisor?",opts:["30 calendar days, then host authority must approve or reject — as established under the relevant EU secondary legislation framework","10 working days from the supervisor forwarding the notification dossier to host authorities — no separate permit required","Until the host authority issues a formal acknowledgment — no fixed deadline — reflecting the harmonisation objective of the EU single financial market","6 months during which the host authority conducts a full suitability assessment — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The timeframe is 10 working days, not 30 calendar days.","✅ Correct — firms inform home supervisors; the supervisor forwards a notification dossier to host authorities. Within 10 working days, the firm may begin operations — no separate permit required.","❌ There is a fixed 10-working-day deadline.","❌ A 6-month suitability assessment contradicts the passporting regime's efficiency purpose."],correct:1,slide:"Slide 05"},
{q:"Under the supervisory division of labour in the passporting regime, which is a function of the HOST country authority?",opts:["Conducting full-scope prudential and conduct supervision of the passporting firm — as established under the relevant EU secondary legislation framework","Investigating breaches regardless of where in the Union they occur — a requirement applying to all entities within the relevant regulatory scope","Imposing sanctions on the passporting undertaking — reflecting the harmonisation objective of the EU single financial market","Enforcing general law applicable to all market participants and reacting to immediate threats to financial stability or investor protection"],exps:["❌ Full-scope prudential and conduct supervision is the HOME country authority's role.","❌ Investigating breaches regardless of location is the HOME country authority's role.","❌ Imposing sanctions on the undertaking is the HOME country authority's role.","✅ Correct — the host country enforces general law applicable to all market participants and reacts to immediate threats, in cooperation with the home supervisor."],correct:3,slide:"Slide 05"},
{q:"The Capital Markets Union (CMU) was announced in which year and by whom?",opts:["In 2015 as a flagship European Commission project","In 2008 by the ECB in response to the global financial crisis","In 2020 by the European Parliament as part of the COVID-19 recovery package","In 2017 as part of the Lamfalussy process reform"],exps:["✅ Correct — the CMU was announced in 2015 as a flagship European Commission project seeking to establish a genuine single market for capital.","❌ The CMU was a 2015 Commission project, not a 2008 ECB initiative.","❌ While the 2020 Action Plan was launched amid COVID-19 recovery, the CMU itself began in 2015.","❌ The CMU is a Commission initiative, not a Lamfalussy process reform."],correct:0,slide:"Slide 05"},
{q:"The 2020 CMU Action Plan is notable because, by re-instating several 2015 and 2017 objectives, it:",opts:["Confirmed the full success of previous CMU action plans","Eliminated the need for Member State implementation by converting all CMU measures into Regulations","Replaced the passporting regime with a new system of direct EU-level authorisation","Confirmed partial failure of previous efforts, prompting the Savings and Investments Union project"],exps:["❌ Re-instating previous objectives indicates those objectives had not been achieved.","❌ Converting all measures into Regulations was not a specific outcome of the 2020 Action Plan.","❌ The 2020 Action Plan did not replace the passporting regime.","✅ Correct — by re-instating several 2015 and 2017 objectives, the 2020 Action Plan confirmed partial failure of previous efforts, prompting the evolution toward the Savings and Investments Union."],correct:3,slide:"Slide 05"},
{q:"According to the slides, what percentage of banked citizens in ten surveyed countries had invested in financial products?",opts:["About 50%, indicating strong retail investor participation","Just over a quarter (28%), indicating disappointingly low retail investor involvement","Nearly three-quarters (72%), showing Europe's high saving rate translating into investment","About 40%, with most investing in government bonds"],exps:["❌ 50% would indicate moderate participation; the figure is much lower.","✅ Correct — just over a quarter (28%) of banked citizens had invested in financial products, with another 25% either actively looking to invest or interested.","❌ 72% is not the retail investor participation rate cited.","❌ 40% is not the figure cited; the slides report 28%."],correct:1,slide:"Slide 05"},
{q:"The 2023 Retail Investment Package adopted by the Commission consists of:",opts:["A new standalone Directive on retail investor protection and a Regulation establishing a European retail investor label — applicable to all investment firms providing services to retail clients","A soft law package of ESA guidelines and Q&As addressed to national supervisors — reflecting the investor protection objective of MiFID II's framework","A Regulation directly applicable in all Member States replacing MiFID II and PRIIPs entirely — a conduct obligation enforceable by national competent authorities","An amending Directive revising MiFID II, IDD, UCITS Directive, AIFMD, and Solvency II; an amending Regulation revising the PRIIPs Regulation; and ongoing financial literacy initiatives"],exps:["❌ The 2023 package does not create a standalone Directive or retail investor label.","❌ The 2023 Retail Investment Package is legislative (Directive and Regulation), not soft law.","❌ The package amends MiFID II and PRIIPs but does not replace them entirely.","✅ Correct — the 2023 Retail Investment Package consists of: an amending Directive revising MiFID II, IDD, UCITS, AIFMD, and Solvency II; an amending Regulation revising PRIIPs; and ongoing financial literacy initiatives."],correct:3,slide:"Slide 05"},
{q:"The SIU was named in 2025 to replace the CMU. According to the slides, how much household wealth remains in low-yield deposits?",opts:["More than €1 trillion, with €800 billion potentially redirectable — as established under the relevant EU secondary legislation framework","Approximately €5 trillion, equally distributed across euro-area Member States — reflecting the harmonisation objective of the EU single financial market","More than €10 trillion, with €8 trillion potentially redirectable if European savers' asset mix converged with US peers","More than €20 trillion, mostly held by institutional investors — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The slides report a much larger figure of more than €10 trillion.","❌ €5 trillion equally distributed is not the figure cited.","✅ Correct — more than €10 trillion of household wealth remains in low-yield deposits; economists estimate €8 trillion could be redirected if European savers' asset mix converged with US peers.","❌ The slides report €10+ trillion, not €20 trillion."],correct:2,slide:"Slide 05"},
{q:"Which of the following correctly describes Pillar 1 ('Citizens and Savings') of the four SIU pillars?",opts:["Addressing capital shortage for start-ups and scale-ups by clarifying prudential incentives for insurers and pension funds — as established under the relevant EU secondary legislation framework","Building trust, literacy, and attractive entry points through European savings and investment accounts, tax recommendations, reinforced Retail Investment Strategy, and Union-wide financial literacy targets","Targeting market-structure barriers through trading and post-trading legislative packages and removal of gold-plating in fund distribution — reflecting the harmonisation objective of the EU single financial market","Pursuing balance between national competence and Union-level convergence, with ESMA receiving stronger supervisory powers — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Addressing capital shortage for start-ups describes Pillar 2 (Investments and Financing).","✅ Correct — Pillar 1 (Citizens and Savings) builds trust, literacy, and attractive entry points through European savings accounts, tax recommendations, reinforced Retail Investment Strategy, and financial literacy targets.","❌ Targeting market-structure barriers describes Pillar 3 (Integration and Scale).","❌ Pursuing balance between national and EU-level competence describes Pillar 4 (Efficient Supervision)."],correct:1,slide:"Slide 05"},
{q:"The SIU–EMU relationship is best described as:",opts:["Competitive: the SIU aims to replace EMU as the primary framework for economic integration — as established under the relevant EU secondary legislation framework","Mutually reinforcing: EMU removes exchange-rate risk and enlarges markets for securities; SIU builds legal frameworks enabling cross-border capital flows; together they enhance resilience","Irrelevant: EMU governs monetary policy while SIU governs fiscal policy with no interaction — reflecting the harmonisation objective of the EU single financial market","Hierarchical: EMU is subordinate to the SIU — as established under the relevant EU secondary legislation framework"],exps:["❌ The SIU does not seek to replace EMU; they are complementary and mutually reinforcing.","✅ Correct — the relationship is mutually reinforcing: EMU removes exchange-rate risk; SIU builds legal and supervisory frameworks; resulting capital flows smooth shocks and strengthen monetary union resilience.","❌ The slides describe a circular, symbiotic relationship between EMU and SIU.","❌ The slides describe EMU and SIU as complementary equals in a virtuous cycle."],correct:1,slide:"Slide 05"},
{q:"Between 2013 and 2023, US venture capital funds raised how much more capital than European counterparts?",opts:["Twice as much","Three times as much","Five times as much","Seven times as much"],exps:["❌ The gap is significantly larger than twice.","❌ Three times is not the figure cited.","❌ Five times is not the figure cited.","✅ Correct — between 2013 and 2023, US venture capital funds raised seven times more capital than European counterparts."],correct:3,slide:"Slide 05"},
{q:"'Maximum Harmonisation' as an integration technique (post-2008) differs from 'Mutual Recognition' (1980s–1990s) because:",opts:["Mutual Recognition established common standards but allowed Member States to impose additional requirements; Maximum Harmonisation applies uniformly, leaving little room for gold-plating and converting segmented regimes into one European market","Maximum Harmonisation requires full uniform rules; Mutual Recognition allowed Member States to impose additional requirements — as established under the relevant EU secondary legislation framework","Maximum Harmonisation was the first technique used, later replaced by Mutual Recognition after the financial crisis — reflecting the harmonisation objective of the EU single financial market","Both techniques are identical; the distinction is purely terminological — as established under the relevant EU secondary legislation framework"],exps:["✅ Correct — Mutual Recognition allowed additional national requirements (leading to fragmentation); Maximum Harmonisation applies uniformly, converting nationally segmented regimes into one European market.","❌ This reverses the descriptions.","❌ The chronological order is reversed: Mutual Recognition preceded Maximum Harmonisation.","❌ The two techniques are substantively different."],correct:0,slide:"Slide 05"},
{q:"The 'critical success factor' for the SIU identified in the slides is:",opts:["The development of a digital euro to replace fragmented national payment systems — as established under the relevant EU secondary legislation framework","Achieving full tax harmonisation across all EU Member States — a requirement applying to all entities within the relevant regulatory scope","Sustained political commitment within the Union's overarching capital markets agenda — success depends on sustained political will and legislative courage","The creation of a single EU sovereign bond to deepen capital markets — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The digital euro is a separate monetary initiative.","❌ Full tax harmonisation is a persistent challenge not identified as the critical success factor.","✅ Correct — the SIU may prove decisive only if it succeeds in anchoring strong political commitment; whether reforms fill Europe's chronic equity gaps depends on sustained political will and legislative courage.","❌ A single EU sovereign bond is not identified as the critical success factor."],correct:2,slide:"Slide 05"},
{q:"The four SIU pillars work as:",opts:["Competing initiatives where Member States may choose which to implement","Mutually reinforcing components to create deep, liquid, and resilient capital markets","Sequential steps where each pillar must be completed before the next begins","Optional enhancements to the existing CMU framework with no binding force"],exps:["❌ The four pillars are not competing; they are complementary.","✅ Correct — the four pillars (Citizens and Savings; Investments and Financing; Integration and Scale; Efficient Supervision) work as mutually reinforcing components.","❌ The pillars are not sequential; they are pursued simultaneously.","❌ The SIU pillars are the core strategic framework, not optional enhancements."],correct:1,slide:"Slide 05"}
,
{q:"'Negative integration' as an EU capital markets technique proved insufficient because:",opts:["It was too aggressive in eliminating national barriers — as established under the relevant EU secondary legislation framework","It was not legally binding on Member States — reflecting the harmonisation objective of the EU single financial market","Treaty freedoms enforced through CJEU review could not overcome deeply rooted divergences in national company, property, and contract laws","It applied only to banking services and not to capital markets — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Negative integration was actually not aggressive enough — it relied on Court review rather than positive legislative action.","❌ Treaty freedoms ARE legally binding; the problem was their limited practical effect on national law divergences.","✅ Correct — negative integration (Treaty freedoms enforced through CJEU review under non-discrimination and proportionality principles) proved insufficient to overcome deeply rooted divergences in national company, property, and contract laws.","❌ Negative integration applied to all fundamental freedoms, not only banking."],correct:2,slide:"Slide 05"},
{q:"The 2017 CMU Mid-Term Review introduced which targeted adjustments?",opts:["Launched the CMU initiative and established its foundational strategy — as established under the relevant EU secondary legislation framework","Strengthening ESMA's supervisory role, introducing proportionate listing regimes for SMEs, promoting digital finance and innovation, and streamlining cross-border distribution","Launched amid COVID-19 recovery, emphasising cross-border harmonisation and enhanced SME funding — reflecting the harmonisation objective of the EU single financial market","Created a European Single Access Point for financial information — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Launching the CMU initiative and foundational strategy describes the 2015 Action Plan.", "✅ Correct — the 2017 Mid-Term Review introduced targeted adjustments: strengthening ESMA's supervisory role, proportionate listing regimes for SMEs, promoting digital finance and innovation, and streamlining cross-border distribution.", "❌ Launching amid COVID-19 recovery describes the 2020 Action Plan.", "❌ Creating the European Single Access Point was part of the 2020 Action Plan."],correct:1,slide:"Slide 05"},
{q:"Pillar 2 ('Investments and Financing') of the SIU addresses capital shortage for start-ups and scale-ups by:",opts:["Clarifying prudential incentives for insurers and pension funds, upgrading EuVeCA, simplifying securitisation rules, and creating frameworks for intermittent private share trading","Building trust, literacy, and attractive entry points through European savings and investment accounts — applicable to all investment firms providing services to retail clients","Targeting market-structure barriers through trading and post-trading legislative packages — a conduct obligation enforceable by national competent authorities","Pursuing balance between national competence and Union-level convergence with stronger ESMA supervisory powers — reflecting the investor protection objective of MiFID II's framework"],exps:["✅ Correct — Pillar 2 (Investments and Financing) addresses capital shortage by clarifying prudential incentives for insurers and pension funds, upgrading EuVeCA, simplifying securitisation rules, and creating frameworks for intermittent private share trading.","❌ Building trust, literacy, and savings accounts describes Pillar 1 (Citizens and Savings).","❌ Targeting market-structure barriers describes Pillar 3 (Integration and Scale).","❌ Pursuing balance with stronger ESMA powers describes Pillar 4 (Efficient Supervision)."],correct:0,slide:"Slide 05"},
{q:"Pillar 4 ('Efficient Supervision') of the SIU pursues:",opts:["Building trust and literacy through European savings accounts and tax recommendations — as established under the relevant EU secondary legislation framework","Addressing capital shortage for start-ups by clarifying prudential incentives for insurers — a requirement applying to all entities within the relevant regulatory scope","Targeting market-structure barriers through legislative packages on trading and post-trading infrastructures — reflecting the harmonisation objective of the EU single financial market","Balance between national competence and Union-level convergence — ESMA receives stronger, possibly direct, supervisory powers; European Semester monitors Member State progress; like risks overseen by like rules"],exps:["❌ Building trust and literacy describes Pillar 1 (Citizens and Savings).", "❌ Addressing capital shortage for start-ups describes Pillar 2 (Investments and Financing).", "❌ Targeting market-structure barriers describes Pillar 3 (Integration and Scale).", "✅ Correct — Pillar 4 (Efficient Supervision) pursues balance between national competence and Union-level convergence, with ESMA receiving stronger supervisory powers, the European Semester monitoring Member State progress, and like risks being overseen by like rules."],correct:3,slide:"Slide 05"},
{q:"The 2025 Competitiveness Compass renamed the CMU as the SIU based on reports by:",opts:["Mario Draghi and Christine Lagarde", "Enrico Letta and Mario Draghi", "Jean-Claude Juncker and Mario Draghi", "Pascal Donohoe and Enrico Letta"],exps:["❌ Christine Lagarde is the ECB President; she did not author the reports that prompted the SIU renaming.", "✅ Correct — the 2025 Competitiveness Compass, drawing on reports by Enrico Letta and Mario Draghi, renamed the CMU as the Savings and Investments Union.", "❌ Jean-Claude Juncker launched the CMU in 2015 but was not the author of the reports prompting the SIU renaming.", "❌ Pascal Donohoe is the Eurogroup President; he did not author the key reports."],correct:1,slide:"Slide 05"},
{q:"Cross-border risk-sharing under the SIU-EMU symbiosis works by:",opts:["Transferring fiscal resources between Member States through the EU budget — as established under the relevant EU secondary legislation framework","Mandating that pension funds hold at least 30% of assets in cross-border investments — as confirmed by the relevant CJEU case law and regulatory guidance","Requiring all EU companies to list on multiple national stock exchanges simultaneously — reflecting the harmonisation objective of the EU single financial market","When savers in one country hold equity and debt claims issued in another, losses from local recessions are cushioned by income from the rest of the currency area"],exps:["❌ Fiscal risk-sharing through the EU budget is a different concept (fiscal union).","❌ No 30% cross-border investment mandate for pension funds exists.","❌ Multiple listings are not required; cross-border investment is encouraged but not mandated in this form.","✅ Correct — when savers hold claims across Member States, losses from local recessions are cushioned by income from the rest of the currency area, providing private risk-sharing that supplements fiscal mechanisms."],correct:3,slide:"Slide 05"}
,
{q:"The CMU was renamed the Savings and Investments Union (SIU) following which strategic documents?",opts:["The MiFID II review report and ESMA's 2024 work programme recommending greater retail investor market integration","The 2025 Competitiveness Compass, drawing on Enrico Letta's single market report and Mario Draghi's competitiveness report","The European Green Deal and the 2020 CMU Action Plan, which together reoriented the CMU toward sustainable finance","The Banking Union completion roadmap and ESRB systemic risk warnings triggering a rebranding of capital market policy"],exps:["❌ The MiFID II review had no role in renaming the CMU.","✅ Correct — the 2025 Competitiveness Compass, drawing on Enrico Letta's single market report and Mario Draghi's competitiveness report, relaunched the CMU as the SIU.","❌ The European Green Deal and 2020 CMU Action Plan confirmed the CMU's continuation but did not rename it the SIU.","❌ The Banking Union roadmap concerned banking supervision, not the CMU/SIU renaming."],correct:1,slide:"Slide 05"},
{q:"The European Single Access Point (ESAP) was introduced under which CMU action plan?",opts:["The 2015 Action Plan — ESAP was the flagship measure of the original CMU launch to address information fragmentation","The 2017 Mid-Term Review — ESAP was introduced as a corrective measure after the 2015 plan proved insufficient","The 2020 Action Plan, which introduced ESAP as a centralised platform for accessing financial and sustainability information","The 2025 SIU enabling package, where ESAP was created alongside the new supervisory convergence measures"],exps:["❌ The 2015 Action Plan set foundational measures but did not introduce ESAP.","❌ The 2017 Mid-Term Review refined the CMU but did not introduce ESAP.","✅ Correct — the 2020 CMU Action Plan introduced the European Single Access Point for financial information, improving transparency and data access across the Union.","❌ The 2025 SIU package builds on ESAP but did not create it."],correct:2,slide:"Slide 05"},
{q:"Pillar 4 of the Savings and Investments Union focuses on:",opts:["Building financial literacy among retail savers and creating attractive entry points for household investment participation","Addressing the capital shortage for innovative start-ups and scale-ups by improving access to equity and venture capital","Targeting market-structure barriers through targeted legislative packages removing fragmentation in key financial markets","Efficient supervision: pursuing balance between national competence and Union-level convergence, including ESMA powers"],exps:["❌ Pillar 1 focuses on citizens and savings.","❌ Pillar 2 focuses on investments and financing.","❌ Pillar 3 focuses on integration and scale.","✅ Correct — Pillar 4 of the SIU addresses efficient supervision, including ESMA receiving stronger supervisory powers and monitoring Member State progress through the European Semester."],correct:3,slide:"Slide 05"},
{q:"How does the SIU support the Economic and Monetary Union (EMU) in absorbing asymmetric shocks?",opts:["By directing the ECB to adjust interest rates regionally when specific Member States face localised economic recessions","By enabling cross-border equity and debt holdings that cushion regional recessions through income from the broader currency area","By creating a central EU fiscal authority empowered to redistribute tax revenues across Member States experiencing shocks","By requiring Member States to hold identical proportions of each other's sovereign debt as a form of automatic stabilisation"],exps:["❌ ECB interest rate decisions are made for the euro area as a whole, not region-by-region.","✅ Correct — integrated capital markets allow investors in one country to hold claims on another, so a regional recession's losses are cushioned by income from the rest of the currency area, smoothing asymmetric shocks.","❌ The SIU is a capital markets initiative, not a fiscal union proposal.","❌ The SIU does not mandate specific portfolio compositions."],correct:1,slide:"Slide 05"},
{q:"The passporting regime established under EU financial legislation means that:",opts:["A firm licensed in one Member State must obtain separate authorisations from every host Member State before operating there","Only state-owned financial entities benefit from cross-border authorisation rights under EU financial services legislation","Supervisory responsibilities for passporting firms reside exclusively with host Member State authorities for all purposes","A firm satisfying common home-country requirements may carry on the same activity throughout the EU without host licences"],exps:["❌ The passporting regime eliminates the need for multiple licences.","❌ The passport is available to all authorised firms, not just state-owned entities.","❌ Supervisory responsibility is shared: home country for prudential and conduct oversight, host country for certain local enforcement.","✅ Correct — once licensed at home, the passport enables the firm to provide services or establish branches throughout the EU; host authorities cannot impose additional licensing conditions."],correct:3,slide:"Slide 05"},
{q:"The 2020 CMU Action Plan was launched amid which two major contexts?",opts:["The Brexit referendum outcome and the LIBOR benchmark manipulation scandal demanding deeper single market integration","COVID-19 economic recovery and the European Green Deal, emphasising sustainable and digital finance as twin priorities","The 2018 ESAs comprehensive review and the digital finance package requiring new CMU enabling measures for fintechs","The SIU Competitiveness Compass priorities and the DORA adoption requiring infrastructure resilience alongside CMU reform"],exps:["❌ Brexit and LIBOR were relevant earlier; the 2020 plan had different contexts.","✅ Correct — the 2020 CMU Action Plan was launched amid COVID-19 economic recovery and the European Green Deal, emphasising sustainable and digital finance.","❌ The ESAs review was ongoing but not the context for the 2020 plan.","❌ The SIU and DORA came after the 2020 plan."],correct:1,slide:"Slide 05"},
{q:"Negative integration in the context of EU capital markets refers to:",opts:["The reduction of EU regulatory standards to attract cross-border investment by lowering barriers for market participants","The removal of supervisory powers from national authorities and their centralisation within ESMA as a single supervisor","Harmonisation of rules through maximum-harmonisation Regulations that replace divergent national market frameworks","Enforcement of Treaty freedoms through CJEU review using non-discrimination and proportionality principles to strike down barriers"],exps:["❌ Reducing standards describes regulatory arbitrage, not negative integration.","❌ Removing national supervisory powers is a separate supervisory convergence issue.","❌ Maximum-harmonisation regulations describe positive integration.","✅ Correct — negative integration means enforcing free movement by striking down national barriers through CJEU review based on non-discrimination and proportionality; it does not require positive legislative harmonisation."],correct:3,slide:"Slide 05"},
{q:"The Retail Investment Strategy 2023 package consists of which legislative instruments?",opts:["A new UCITS Directive and a revised MiCAR Regulation addressing retail distribution and crypto-asset consumer protection","Revised EBA guidelines on conduct of business standards and a new PRIIPs KID template adopting ESMA performance scenarios","A new Crowdfunding Regulation and a revised Prospectus Regulation aimed at improving SME access to retail investor capital","An amending Directive revising MiFID II, IDD, UCITS, AIFMD, and Solvency II, plus an amending Regulation revising PRIIPs"],exps:["❌ The RIS package amends existing legislation; it does not create a new UCITS Directive or revise MiCAR.","❌ EBA guidelines are not legislative instruments; the RIS was a Commission proposal.","❌ The Crowdfunding Regulation and Prospectus Regulation were revised separately and earlier.","✅ Correct — the 2023 RIS package includes an amending Directive revising MiFID II, IDD, UCITS, AIFMD, and Solvency II, plus an amending Regulation revising PRIIPs."],correct:3,slide:"Slide 05"},
