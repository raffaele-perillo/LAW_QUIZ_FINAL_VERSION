<script>
const TOPICS = {
"01 — EU Financial Markets Law & the Treaties":[
{q:"The TEU and TFEU are best described as:",opts:["Political declarations with no legally binding force","Secondary legislation adopted by Parliament and the Council","Directives issued by the Commission to harmonise national financial laws","The constitutional foundations of the EU, defining its values, goals, and legal framework"],exps:["❌ The TEU and TFEU are legally binding primary law.","❌ Secondary legislation includes Regulations and Directives; the Treaties are adopted by Member States.","❌ Directives are secondary legislation; the Treaties are primary law.","✅ Correct — the TEU and TFEU are the constitutional foundations of the EU."],correct:3,slide:"Slide 01"},
{q:"The ECSC (1951) covered which two industries?",opts:["Oil and gas — the commodities underpinning post-war reconstruction and NATO's energy strategy","Automotive and aerospace — industries central to the post-war European economic recovery plan","Banking and insurance — sectors requiring supranational oversight after wartime disruptions","Coal and steel — key industries for military power and post-war reconstruction in Europe"],exps:["❌ Oil and gas were not part of the ECSC.","❌ Automotive and aerospace were not covered by the ECSC.","❌ Banking and insurance were not covered by the ECSC.","✅ Correct — the ECSC covered coal and steel, two key industries for military power, binding European economies together after WWII."],correct:3,slide:"Slide 01"},
{q:"The Treaties of Rome (1957) founded which two bodies?",opts:["The EU and the ECB","The ECSC and Euratom","The European Economic Community and Euratom","The European Parliament and the European Commission"],exps:["❌ The EU was established by the Maastricht Treaty (1992).","❌ The ECSC was established by the 1951 Treaty of Paris.","✅ Correct — the Treaties of Rome (1957) founded the EEC and Euratom.","❌ These institutions were not created by the Treaties of Rome."],correct:2,slide:"Slide 01"},
{q:"The Maastricht Treaty (1992) formally established the EU and:",opts:["Founded the EEC and Euratom","Introduced the TFEU and EU Charter of Fundamental Rights","Introduced the three-pillar structure and laid foundations for the euro","Provided for the largest EU expansion with ten CEE countries"],exps:["❌ Founding the EEC and Euratom was the result of the Treaties of Rome (1957).","❌ Introducing the TFEU and Charter describes the Treaty of Lisbon (2009).","✅ Correct — the Maastricht Treaty (1992) introduced the three-pillar structure and laid foundations for the euro.","❌ The largest CEE expansion occurred in 2004."],correct:2,slide:"Slide 01"},
{q:"The euro was introduced as virtual currency in which year, and in physical form in which year?",opts:["1992 virtual; 1999 physical","2002 virtual; 2004 physical","1999 virtual; 2002 physical","1997 virtual; 2000 physical"],exps:["❌ 1992 is the year of Maastricht, not euro introduction.","❌ 2002 was when the euro became physical, not virtual.","✅ Correct — virtual in 1999, physical in 2002, with 11 countries initially adopting it.","❌ Neither 1997 nor 2000 are the correct dates."],correct:2,slide:"Slide 01"},
{q:"As of January 2026, the EU comprises how many Member States, with how many in the euro area?",opts:["27 Member States; 19 in euro area","27 Member States; 21 in euro area","28 Member States; 21 in euro area","27 Member States; all 27 in euro area"],exps:["❌ 19 was an earlier euro area figure.","✅ Correct — 27 Member States as of January 2026, with 21 in the euro area.","❌ The EU has 27 (not 28) Member States since Brexit.","❌ Not all 27 Member States have adopted the euro."],correct:1,slide:"Slide 01"},
{q:"The European Parliament is best described as:",opts:["The body that brings together Heads of State or Government to define political direction","The executive arm proposing legislation and acting as guardian of the Treaties","The only directly elected EU institution, sharing legislative power with the Council","The institution responsible for monetary policy and price stability"],exps:["❌ Bringing together Heads of State describes the European Council.","❌ Proposing legislation and guardian of Treaties describes the European Commission.","✅ Correct — the European Parliament is the only directly elected EU institution, with elections every five years.","❌ Monetary policy and price stability are the ECB's responsibility."],correct:2,slide:"Slide 01"},
{q:"The European Council is best described as:",opts:["Proposes EU legislation, manages the budget, and enforces EU law as the executive arm of the Union","Represents Member State governments and shares legislative and budgetary powers with Parliament under the ordinary procedure","Brings together Heads of State or Government, defines general political direction but does NOT exercise legislative functions","Ensures EU law is interpreted consistently across Member States and may rule on Treaty infringements by institutions"],exps:["❌ Proposing legislation describes the European Commission.","❌ Representing Member State governments describes the Council of the EU.","✅ Correct — the European Council brings together Heads of State, defines political direction, but does not exercise legislative functions.","❌ Consistent interpretation and direct effect/supremacy are CJEU roles."],correct:2,slide:"Slide 01"},
{q:"Which two foundational doctrines has the CJEU used to shape EU legal order?",opts:["Mutual recognition and home-country control","Subsidiarity and proportionality","Direct effect and supremacy of EU law","Best execution and market transparency"],exps:["❌ Mutual recognition and home-country control are Single Market integration techniques.","❌ Subsidiarity and proportionality are general EU principles but not the foundational CJEU doctrines.","✅ Correct — the CJEU's foundational doctrines are direct effect and supremacy of EU law.","❌ Best execution and transparency are MiFID II concepts."],correct:2,slide:"Slide 01"},
{q:"The ECB's primary objective is:",opts:["Overseeing banking supervision through the SSM","Managing the EU budget","Setting fiscal policy for euro area Member States","Maintaining price stability in the euro area"],exps:["❌ Banking supervision through the SSM is important but not the primary objective.","❌ Managing the EU budget is the Commission and Court of Auditors' role.","❌ Fiscal policy remains a national competence.","✅ Correct — the ECB's primary objective is maintaining price stability."],correct:3,slide:"Slide 01"},
{q:"Which of the following is NOT among the core objectives of Article 3 TEU?",opts:["Promoting peace, EU values, and well-being of its peoples","Establishing an internal market with the four fundamental freedoms","Setting harmonised corporate tax rates across all Member States","Fighting social exclusion and promoting equality between women and men"],exps:["❌ Promoting peace and well-being IS a core Article 3 TEU objective.","❌ Establishing the internal market IS a core Article 3 TEU objective.","✅ Correct — harmonised corporate tax rates are NOT among Article 3 TEU objectives.","❌ Fighting social exclusion and promoting equality IS a core Article 3 TEU objective."],correct:2,slide:"Slide 01"},
{q:"The Free Movement of Capital (Article 63 TFEU) is distinctive because:",opts:["It applies only between Member States and not to third countries, unlike the other three freedoms which have no territorial limit","It prohibits all restrictions on capital and payments between Member States AND with third countries — making it the broadest freedom","It requires prior ECB authorisation for large cross-border capital flows exceeding thresholds set by Commission delegated acts","It was fully liberalised by the Maastricht Treaty alone, without any preceding secondary legislation or Council Directives"],exps:["❌ Unlike the other freedoms, capital freedom also extends to third countries.","✅ Correct — Article 63 TFEU prohibits all restrictions on capital and payments between Member States AND with third countries, making it the broadest and least conditional freedom.","❌ No prior ECB approval is required; Article 63 TFEU is directly effective.","❌ Directive 88/361/EEC (1988) provided full liberalisation before Maastricht enshrined it in primary law."],correct:1,slide:"Slide 01"},
{q:"Council Directive 88/361/EEC (1988) is significant because:",opts:["It provided for full liberalisation of capital movements among Member States","It established the first framework for EU banking supervision","It introduced MiFID I, replacing the Investment Services Directive","It created the European System of Financial Supervision with three ESAs"],exps:["✅ Correct — Directive 88/361/EEC (1988) provided for full liberalisation of capital movements among Member States, before Maastricht enshrined it in primary law.","❌ Banking supervision was not addressed by this Directive.","❌ MiFID I was adopted in 2004.","❌ The ESFS and ESAs were created in 2010–2011."],correct:0,slide:"Slide 01"},
{q:"The key distinction between Freedom of Establishment (Art. 49 TFEU) and Freedom to Provide Services (Art. 56 TFEU) lies in:",opts:["The type of economic activity involved — as established under the relevant EU secondary legislation framework","The nationality of the service provider — a requirement applying to all entities within the relevant regulatory scope","Duration and presence: establishment involves a fixed establishment for an indefinite period; services are temporary in nature","Whether the activity is regulated by national or EU-level supervisors — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Both freedoms cover a wide range of activities.","❌ Both apply to EU nationals and legal persons.","✅ Correct — the key distinction is duration and presence: establishment involves a fixed establishment for an indefinite period; services are temporary and lack permanent physical presence.","❌ Whether regulated nationally or at EU level does not determine which freedom applies."],correct:2,slide:"Slide 01"},
{q:"In Gebhard (C-55/94), the CJEU established which cumulative test for national measures restricting fundamental freedoms?",opts:["Measures must be proportionate — one condition only — as specified in the relevant delegated acts and ESMA guidelines","Measures are valid if adopted through the ordinary legislative procedure — reflecting the product-focused approach of this EU regulatory framework","Measures require prior Commission approval before entering into force — a requirement that applies from the date of authorisation onward","Non-discriminatory, justified by imperative requirements in the general interest, suitable for achieving goals, and going no further than necessary"],exps:["❌ The Gebhard test has four cumulative conditions.","❌ The Gebhard test is a judicial review standard, not a legislative procedure requirement.","❌ No prior Commission approval is required.","✅ Correct — national measures must be: non-discriminatory, justified by imperative requirements in the general interest, suitable for achieving their objective, and proportionate."],correct:3,slide:"Slide 01"},
{q:"In Centros (C-212/97), the CJEU held that:",opts:["National measures hindering freedoms must satisfy the Gebhard proportionality test — as established under the relevant EU secondary legislation framework","A Dutch ban on cold-calling for financial services was a justified restriction — as confirmed by the relevant CJEU case law and regulatory guidance","Restrictions on property ownership by non-nationals in border areas breach capital freedom — reflecting the harmonisation objective of the EU single financial market","Member States cannot hinder companies from exercising freedom to choose their place of incorporation; Danish refusal to register a UK company branch was invalidated"],exps:["❌ The Gebhard test was established in Gebhard (C-55/94), not Centros.","❌ Cold-calling bans were addressed in Alpine Investments.","❌ Property ownership restrictions were addressed in Commission v Greece.","✅ Correct — in Centros, the CJEU invalidated the Danish refusal to register a UK company branch, holding Member States cannot hinder companies' freedom to choose their place of incorporation."],correct:3,slide:"Slide 01"},
{q:"In Alpine Investments (C-384/93), the CJEU held that:",opts:["Member States cannot restrict companies' freedom to choose their place of incorporation — applicable to all investment firms providing services to retail clients","State special rights constitute restrictions on capital freedom unless proportionate — reflecting the investor protection objective of MiFID II's framework","Fiscal autonomy must not result in discrimination on cross-border capital flows — a conduct obligation enforceable by national competent authorities","A Dutch ban on cold-calling for financial services was a restriction on service provision, justified by consumer protection"],exps:["❌ Freedom to choose place of incorporation was addressed in Centros.","❌ State special rights and capital freedom were addressed in Commission v Portugal, France and Netherlands.","❌ Fiscal autonomy and capital flows were addressed in Verkooijen and Santander.","✅ Correct — in Alpine Investments, the Dutch ban on cold-calling was a restriction on service provision, but justified by consumer protection in that case."],correct:3,slide:"Slide 01"},
{q:"Phase III of EU financial markets integration (1999–2007) included which landmark acts?",opts:["First and Second Banking Directives introducing home-country control","MiFID II/MiFIR and EMIR significantly expanding the regulatory framework","Market Abuse Directive, Prospectus Directive, Transparency Directive, and MiFID I (2004)","CRD IV/CRR implementing Basel III, and the SSM centralising banking supervision"],exps:["❌ First and Second Banking Directives belong to Phase II (1985–1999).","❌ MiFID II/MiFIR and EMIR belong to Phase IV (2007–2015).","✅ Correct — Phase III included the FSAP with 42 measures and landmark acts: Market Abuse Directive, Prospectus Directive, Transparency Directive, and MiFID I (2004).","❌ CRD IV/CRR and the SSM belong to Phase IV."],correct:2,slide:"Slide 01"},
{q:"The Single Supervisory Mechanism (SSM) centralised banking supervision in which institution and in which year?",opts:["ESMA, in 2010","EBA, in 2011","The ECB, in 2014","The European Commission, in 2015"],exps:["❌ ESMA covers capital markets, not banking supervision through the SSM.","❌ EBA covers banking regulation and standards but does not run the SSM.","✅ Correct — the SSM centralised banking supervision in the ECB in 2014.","❌ The European Commission does not conduct banking supervision."],correct:2,slide:"Slide 01"},
{q:"DORA (Digital Operational Resilience Act) addresses which regulatory need?",opts:["Digital asset trading and crypto-asset issuance","Short selling and market manipulation prevention","Sustainable finance and ESG investment disclosure","ICT risk management requirements for financial entities"],exps:["❌ Digital asset trading and crypto-assets are addressed by MiCAR.","❌ Short selling regulation is a separate piece of EU legislation.","❌ Sustainable finance and ESG disclosure are addressed by SFDR, Taxonomy Regulation, and CSRD.","✅ Correct — DORA (Digital Operational Resilience Act) established ICT risk management requirements for financial entities in Phase VI."],correct:3,slide:"Slide 01"}
,
{q:"Which institution is described as the 'guardian of the Treaties' in the EU's institutional architecture?",opts:["European Parliament","European Council","European Commission","Court of Justice of the EU"],exps:["❌ The Parliament exercises legislative and oversight functions, not guardian of the Treaties.","❌ The European Council defines political direction but does not enforce the Treaties.","✅ Correct — the European Commission is the executive arm and acts as 'guardian of the Treaties', ensuring compliance with EU law.","❌ The CJEU ensures consistent interpretation but is not referred to as 'guardian of the Treaties'."],correct:2,slide:"Slide 01"},
{q:"The Court of Justice of the EU is based in which city?",opts:["Brussels, where the Court sits alongside the European Parliament and the Council in the EU's legislative quarter","Frankfurt, where the Court shares facilities with the European Central Bank and the Single Supervisory Mechanism","Paris, where the Court relocated alongside ESMA as part of the 2019 post-Brexit institutional reorganisation","Luxembourg, where it ensures consistent interpretation of EU law and hears preliminary rulings from national courts"],exps:["❌ Brussels hosts the Parliament, Commission, and Council, not the CJEU.","❌ Frankfurt is where the ECB and EBA/EIOPA are based.","❌ Paris hosts ESMA.","✅ Correct — the CJEU is based in Luxembourg and ensures EU law is interpreted consistently across all Member States."],correct:3,slide:"Slide 01"},
{q:"The Single Supervisory Mechanism (SSM), placing banking supervision with the ECB, has been in place since which year?",opts:["2008, when the global financial crisis prompted emergency transfer of banking oversight to the ECB immediately","2011, when the three ESAs were established as part of the broader European System of Financial Supervision reform","2014, when the SSM became operational with the ECB directly supervising significant credit institutions in the euro area","2019, when EBA relocated from London to Paris and the ECB assumed formal responsibility for banking sector oversight"],exps:["❌ 2008 is the year of the financial crisis, which prompted supervisory reform.","❌ 2011 is when the ESAs were established, not the SSM.","✅ Correct — the SSM began overseeing banking supervision through the ECB in 2014.","❌ 2019 is when EBA relocated from London to Paris."],correct:2,slide:"Slide 01"},
{q:"Which Treaty first enshrined capital freedom in primary EU law through what is now Article 63 TFEU?",opts:["The Treaty of Rome (1957) established the EEC and enshrined free movement of capital in primary law from the outset","The Single European Act (1986) introduced capital freedom as a primary law obligation alongside goods and services freedoms","The Maastricht Treaty (1993) enshrined capital freedom in primary law via Article 73b (now Article 63 TFEU)","The Treaty of Lisbon (2009) first elevated capital freedom to the status of a directly applicable fundamental freedom"],exps:["❌ The Treaty of Rome laid foundations for the common market but capital remained subject to national controls.","❌ The Single European Act focused on completing the internal market for goods and services.","✅ Correct — the Maastricht Treaty enshrined capital freedom in primary law via Article 73b (now Article 63 TFEU), elevating it to a directly applicable treaty right.","❌ The Treaty of Lisbon introduced the TFEU but capital freedom had already been in primary law since Maastricht."],correct:2,slide:"Slide 01"},
{q:"The CJEU found in Commission v Greece that national restrictions on property ownership by non-nationals in border areas breached which freedom?",opts:["Free movement of goods","Freedom of establishment","Free movement of persons","Free movement of capital"],exps:["❌ Free movement of goods concerns trade in tangible products.","❌ Freedom of establishment concerns setting up business operations, not property ownership per se.","❌ Free movement of persons concerns residence and work rights of EU citizens.","✅ Correct — the CJEU found that restrictions on property ownership by non-nationals in border areas breached the free movement of capital."],correct:3,slide:"Slide 01"},
{q:"In Gebhard (C-55/94), national measures restricting fundamental freedoms must satisfy which cumulative test?",opts:["Measures must be proportionate — this single condition, applied by the host Member State, is sufficient to justify restrictions","Measures are valid if adopted through the ordinary legislative procedure and formally notified to the European Parliament","Measures require prior Commission approval and a formal notification to ESMA before entry into force in the host Member State","Non-discriminatory, justified by imperative requirements in the general interest, suitable to ensure the objective, and not exceeding what is necessary"],exps:["❌ The Gebhard test is a CJEU proportionality test, not a Council voting procedure.","❌ The Gebhard test applies regardless of nationality — it governs restrictions on EU Treaty freedoms generally.","❌ ESMA approval is not part of the Gebhard test.","✅ Correct — national measures liable to hinder fundamental freedoms must be non-discriminatory, justified by imperative requirements in the general interest, and proportionate."],correct:3,slide:"Slide 01"},
{q:"What is the key distinction between freedom of establishment (Article 49 TFEU) and freedom to provide services (Article 56 TFEU)?",opts:["Establishment applies only to natural persons; services apply only to companies — a requirement introduced by the Lamfalussy Level 2 implementing measures","Services require prior authorisation from the host Member State; establishment does not — a principle established in the foundational Regulation governing this area","Establishment applies only within one Member State; services allow cross-border activities — reflecting the maximum harmonisation approach adopted in this EU framework","Establishment requires physical presence for an indefinite period; services are characterised by temporary nature and absence of permanent presence"],exps:["❌ Both freedoms apply to natural and legal persons.","❌ Host Member State prior authorisation is precisely what freedom of establishment and services prevent (subject to proportionate public-interest exceptions).","❌ Both freedoms concern cross-border activity within the EU.","✅ Correct — the key distinction lies in duration and presence: establishment involves a fixed presence for an indefinite period, while services are temporary and lack permanent presence."],correct:3,slide:"Slide 01"},
{q:"The Centros case (C-212/97) established which principle regarding freedom of establishment?",opts:["Companies must establish in the Member State where they conduct the majority of their commercial and economic activities","Member States cannot hinder companies from choosing their place of incorporation within the EU even if it circumvents local rules","Host Member States may impose additional capital requirements on foreign company branches to protect local creditors","Tax avoidance justifies refusing registration of foreign company branches under the public-interest exception in Article 52 TFEU"],exps:["❌ The Centros case held the opposite — companies are free to choose their place of incorporation.","✅ Correct — Centros established that Member States cannot hinder the freedom of establishment by refusing to register a UK company branch in Denmark.","❌ Centros rejected the imposition of additional requirements on foreign-company branches.","❌ The CJEU rejected Denmark's tax-avoidance justification as insufficient to override freedom of establishment."],correct:1,slide:"Slide 01"},
{q:"Which Council Directive in 1988 first provided for full liberalisation of capital movements among EU Member States?",opts:["Directive 85/611/EEC established the UCITS regime, which as a side effect liberalised capital movements for fund investments","Directive 89/298/EEC harmonised prospectus requirements for public offers, implicitly requiring capital movement liberalisation","Directive 88/361/EEC (1988) provided for full liberalisation of capital movements among Member States, before it was enshrined in primary law by Maastricht","Directive 93/22/EEC, the Investment Services Directive, created the passport that effectively liberalised cross-border capital flows"],exps:["❌ Directive 85/611/EEC established the UCITS regime for investment funds.","❌ Directive 89/298/EEC concerned prospectus requirements for public offers.","✅ Correct — Council Directive 88/361/EEC (1988) provided for full liberalisation of capital movements among Member States, before it was enshrined in primary law by Maastricht.","❌ Directive 93/22/EEC was the Investment Services Directive of 1993."],correct:2,slide:"Slide 01"},
{q:"In Alpine Investments (C-384/93), a Dutch ban on cold-calling for financial services was found to be:",opts:["A restriction on service provision, but justified by consumer protection in that specific case despite limiting market access","Permitted as a non-discriminatory and fully proportionate measure with no appreciable restriction on cross-border services","Contrary to Maastricht Treaty provisions on free movement of capital because it restricted financial product distribution","Not a restriction on services because it applied only to domestic firms operating exclusively in the Netherlands"],exps:["✅ Correct — the Dutch ban was found to be a restriction on service provision under Article 56 TFEU, but was justified in that specific case by consumer protection interests.","❌ The CJEU did find it was a restriction on freedom to provide services.","❌ The case concerned freedom to provide services under what is now Article 56 TFEU, not capital freedom.","❌ The ban applied to all firms, including Dutch ones operating cross-border — precisely why it restricted cross-border service provision."],correct:0,slide:"Slide 01"}],
"02 — EU Financial Regulation":[
{q:"The primary intellectual justification for financial regulation rests on the concept of:",opts:["Government failure","Market failure — situations where unregulated markets produce suboptimal outcomes","Regulatory failure — situations where existing rules are poorly enforced","Systemic failure — situations where entire financial systems collapse"],exps:["❌ Government failure is a different economic concept.","✅ Correct — the primary justification rests on market failure, where unregulated markets produce suboptimal outcomes.","❌ Regulatory failure is a consequence, not the primary justification.","❌ Systemic failure is one type of market failure, but market failure is more broadly the primary justification."],correct:1,slide:"Slide 02"},
{q:"Market failure alone is not sufficient justification for regulation. Two additional conditions are needed. Which are they?",opts:["The deviation from market optimum must be significant enough to warrant constraints on private autonomy AND any intervention must generate a net increase in social welfare","The regulator must have sufficient expertise AND there must be an agreed international standard — a requirement introduced by the Lamfalussy Level 2 implementing measures","The regulated activity must cross international borders AND there must be a supranational body to enforce the rules — reflecting the maximum harmonisation approach adopted in this EU framework","The intervention must be approved by a supranational body AND must not distort competition — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — the two additional conditions are: (1) the deviation must be significant enough to warrant constraints on private autonomy; (2) the intervention must generate a net increase in social welfare.","❌ Regulator expertise and international standards are not the two additional conditions.","❌ Cross-border nature and a supranational body are not the two conditions.","❌ Supranational approval and competition effects are not the two conditions."],correct:0,slide:"Slide 02"},
{q:"'Allocative Efficiency' is best described as:",opts:["Ensuring that resources are optimally distributed to activities and individuals who value them most","Yielding the maximum possible output from a given set of scarce resources — as established under the relevant EU secondary legislation framework","Capturing the economy's ability to innovate, invest, and adapt over time — reflecting the harmonisation objective of the EU single financial market","Ensuring market prices reflect new information quickly and accurately — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — Allocative Efficiency means resources are optimally distributed to activities and individuals who value them most.","❌ Maximum output from given resources describes Productive Efficiency.","❌ The economy's ability to innovate and adapt describes Dynamic Efficiency.","❌ Prices reflecting new information quickly describes market efficiency."],correct:0,slide:"Slide 02"},
{q:"'Dynamic Efficiency' is best described as:",opts:["Yielding the maximum possible output from a given set of resources","Ensuring resources are optimally distributed to those who value them most","Capturing the economy's ability to innovate, invest, and adapt over time to sustain long-term growth","Ensuring no alternative allocation could make someone better off without making others worse off"],exps:["❌ Maximum output from given resources describes Productive Efficiency.","❌ Optimal distribution to those who value resources most describes Allocative Efficiency.","✅ Correct — Dynamic Efficiency captures the economy's ability to innovate, invest, and adapt over time.","❌ No alternative allocation making someone better off without making others worse off describes Pareto optimality."],correct:2,slide:"Slide 02"},
{q:"Pareto optimality has significant limitations because:",opts:["It is impossible to achieve due to market failures — as established under the relevant EU secondary legislation framework","It can only be measured in markets with complete price transparency — as confirmed by the relevant CJEU case law and regulatory guidance","It requires government intervention, undermining market efficiency — reflecting the harmonisation objective of the EU single financial market","An allocation may be Pareto efficient but result in a disproportionate distribution of resources — efficient does not mean socially desirable"],exps:["❌ The slides do not say Pareto optimality is impossible to achieve.","❌ Measurement challenges are not the limitation identified.","❌ Pareto optimality does not require government intervention by definition.","✅ Correct — an allocation can be Pareto efficient yet result in disproportionate distribution; efficient does not mean socially desirable."],correct:3,slide:"Slide 02"},
{q:"'Financial Stability' as a core goal of financial regulation involves:",opts:["Maximising GDP growth through deregulation — a requirement introduced by the Lamfalussy Level 2 implementing measures","Harmonising national tax rates to prevent regulatory arbitrage — a principle established in the foundational Regulation governing this area","Promoting full employment in the financial services sector — reflecting the maximum harmonisation approach adopted in this EU framework","Addressing negative externalities and systemic risk through prudential regulation, especially after the 2008 financial crisis"],exps:["❌ Deregulation contradicts the concept of prudential regulation.","❌ Harmonising tax rates is not a listed core goal.","❌ Full employment in financial services is not listed as a core goal.","✅ Correct — Financial Stability addresses negative externalities and systemic risk through prudential regulation."],correct:3,slide:"Slide 02"},
{q:"'Crime Prevention' as a core goal of financial regulation refers to:",opts:["Preventing fraud committed by retail investors against financial institutions — a requirement introduced by the Lamfalussy Level 2 implementing measures","Preventing cybercrime and data theft from financial institutions — a principle established in the foundational Regulation governing this area","Prosecuting insider dealers under criminal law rather than administrative sanctions — reflecting the maximum harmonisation approach adopted in this EU framework","Fighting money laundering, terrorist financing, and tax evasion to prevent the financial system being used for socially harmful activities"],exps:["❌ Fraud by retail investors is not what this core goal refers to.","❌ Cybercrime prevention falls under Innovation Governance or operational risk.","❌ The choice between criminal and administrative sanctions is a different regulatory issue.","✅ Correct — Crime Prevention means fighting money laundering, terrorist financing, and tax evasion."],correct:3,slide:"Slide 02"},
{q:"'Innovation Governance' as a core goal of financial regulation refers to:",opts:["Restricting all financial innovation to prevent systemic risk — a requirement introduced by the Lamfalussy Level 2 implementing measures","Supporting fair and proper innovation while preventing risks from technological developments like crypto-assets and artificial intelligence","Requiring all new financial products to be pre-approved by ESMA — reflecting the maximum harmonisation approach adopted in this EU framework","Banning high-frequency trading due to flash-crash risks — a principle established in the foundational Regulation governing this area"],exps:["❌ Restricting all innovation is not what Innovation Governance means.","✅ Correct — Innovation Governance means supporting fair and proper innovation while preventing risks from technological developments like crypto-assets and AI.","❌ ESMA pre-approval of all new products is not what Innovation Governance means.","❌ Banning HFT is not the approach; HFT is regulated but not banned."],correct:1,slide:"Slide 02"},
{q:"Adverse selection in finance is best illustrated by (Akerlof's 'Market for Lemons'):",opts:["Investors overreacting to short-term news due to behavioral biases — as established under the relevant EU secondary legislation framework","Sellers knowing product quality while buyers do not, leading to markets dominated by inferior offerings such as subprime mortgages or opaque funds","Excessive risk-taking because profits are privatised while losses are socialised — reflecting the harmonisation objective of the EU single financial market","Regulators lacking information to assess risks of complex institutions — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Overreacting to news describes a behavioral bias, not adverse selection.","✅ Correct — Akerlof's 1970 paper showed that inability to assess quality leads to market equilibrium dominated by inferior offerings.","❌ Privatising profits while socialising losses describes moral hazard.","❌ Regulator information gaps describe a supervisory challenge, not adverse selection."],correct:1,slide:"Slide 02"},
{q:"Financial markets are described as requiring stricter oversight than other markets because of:",opts:["Simple and transparent structure compared to product markets — as established under the relevant EU secondary legislation framework","Interconnectedness — the failure of one actor can destabilise the system through direct or indirect exposures — and high complexity, leverage amplification, and economic centrality","Exclusive use by sophisticated professional investors — reflecting the harmonisation objective of the EU single financial market — a description that applies to a different EU legal act, not the one relevant to this question","No negative externalities unlike product markets — as confirmed by the relevant CJEU case law and regulatory guidance — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ Financial markets are described as highly complex, not simple and transparent.","✅ Correct — interconnectedness, high complexity, leverage amplification, speed and velocity, and economic centrality all justify stricter oversight.","❌ Financial markets are used by a wide range of participants including retail investors.","❌ Financial markets do generate negative externalities — a key justification for regulation."],correct:1,slide:"Slide 02"},
{q:"'Disclosure' as a regulatory tool is based on the assumption that:",opts:["Markets work best with minimal information requirements — as clarified by ESMA guidelines on prospectus disclosure requirements","Markets function correctly if investors have sufficient information to assess risk and performance","All investors have professional expertise to analyse complex financial data","Regulators can verify all disclosed information for accuracy — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ Minimal information requirements contradict the disclosure logic.","✅ Correct — disclosure assumes markets can function correctly if investors have sufficient information to assess risk and performance.","❌ The limitations of disclosure include that retail investors often lack expertise to assess information.","❌ Regulator verification of accuracy is a separate issue."],correct:1,slide:"Slide 02"},
{q:"The EU's approach to financial regulation compared to the US is best characterised as:",opts:["More fragmented, with overlapping agencies and stronger reliance on enforcement and litigation","More decentralised, leaving most regulation to national authorities — a principle established in the foundational Regulation governing this area","More principle-based with minimal prescriptive rules — reflecting the maximum harmonisation approach adopted in this EU framework","Favouring harmonisation, prescriptive rulemaking, and centralised oversight through bodies like ESMA, EBA, EIOPA, and the ECB"],exps:["❌ The fragmented, enforcement-based approach describes the US model.","❌ The EU involves significant harmonisation; it is more centralised than the US.","❌ A principle-based, minimal prescriptive approach is not how the EU's approach is characterised.","✅ Correct — the EU favours harmonisation, prescriptive rulemaking, and centralised oversight through ESMA, EBA, EIOPA, and the ECB."],correct:3,slide:"Slide 02"},
{q:"The EU's response to crypto-assets and digital finance is characterised by:",opts:["Full deregulation leaving crypto to self-regulation","A fragmented framework with agencies disagreeing on classification of digital assets","MiCAR establishing a uniform licensing regime, complemented by DORA for cybersecurity and incident reporting","Exclusively soft law with no binding regulation"],exps:["❌ The EU's response is comprehensive binding regulation.","❌ A fragmented framework with agency disagreements describes the US approach.","✅ Correct — the EU responded with MiCAR (uniform licensing regime) complemented by DORA (cybersecurity and incident reporting obligations).","❌ The EU's response is binding legislation, not exclusively soft law."],correct:2,slide:"Slide 02"},
{q:"The 'Twin Peaks' regulatory model is best described as:",opts:["A goal-defined architecture with separate agencies for different objectives — one for consumer protection/market integrity and one for prudential regulation","Two identical regulators with overlapping mandates for redundancy — as established under the relevant EU secondary legislation framework","A single comprehensive regulator combining all financial supervision functions — reflecting the harmonisation objective of the EU single financial market","A model where national and EU-level supervisors share equal powers — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — Twin Peaks is goal-defined: e.g., UK replaced the FSA with FCA (consumer protection/market integrity) and PRA (prudential regulation).","❌ The Twin Peaks model has agencies with different objectives.","❌ A single comprehensive regulator describes the Unified Model.","❌ Shared national and EU powers describes the ESFS network."],correct:0,slide:"Slide 02"},
{q:"'Regulatory arbitrage' refers to:",opts:["Legitimate innovation that reduces the social costs of regulated activities — as established under the relevant EU secondary legislation framework","Firms restructuring activities to fall outside the scope of regulation or under less costly regulations, without necessarily reducing social costs","Regulators adjusting rules to accommodate market innovation — reflecting the harmonisation objective of the EU single financial market","Investors using legal differences between jurisdictions to optimise returns — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Genuine innovation reducing social costs is distinguished from regulatory arbitrage.","✅ Correct — regulatory arbitrage means firms restructure to fall outside regulation or under less costly rules, without necessarily reducing social costs.","❌ Regulators adjusting rules is not regulatory arbitrage.","❌ Investors exploiting legal differences is a related but distinct concept."],correct:1,slide:"Slide 02"},
{q:"Post-2008, macroprudential oversight introduced which tools?",opts:["Capital surcharges for systemic institutions (G-SIBs/D-SIBs), countercyclical capital buffers, LCR and NSFR, alongside resolution regimes like the BRRD","Only capital adequacy ratios and stress testing requirements — as established under the relevant EU secondary legislation framework","Only resolution regimes like the BRRD — reflecting the harmonisation objective of the EU single financial market","Exclusively disclosure requirements under the Prospectus Regulation — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — macroprudential tools include capital surcharges, countercyclical buffers, LCR and NSFR, and resolution regimes.","❌ Capital adequacy and stress testing are part of the toolkit but not the complete post-2008 list.","❌ Resolution regimes are one element; the toolkit is broader.","❌ Disclosure requirements are a different category of regulatory tool."],correct:0,slide:"Slide 02"},
{q:"Disclosure has limitations as a regulatory tool because:",opts:["It is never effective and should be abandoned in favour of product bans — as clarified by ESMA guidelines on prospectus disclosure requirements","Excessive and/or too technical disclosure can be ineffective, as retail investors often lack expertise to assess risks even when information is complete","Disclosure requirements are too costly for firms to implement — reflecting the investor protection objective of the Prospectus Regulation","Regulators cannot verify the accuracy of disclosed information — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ Disclosure has not been abandoned; it has evolved and been supplemented.","✅ Correct — excessive and/or too technical disclosure can be ineffective, especially for retail investors lacking expertise, leading to standardised disclosures like KIDs under PRIIPs.","❌ Cost to firms is not the primary limitation identified.","❌ Regulatory verification of accuracy is a separate issue."],correct:1,slide:"Slide 02"},
{q:"'Conduct regulation' in financial law addresses:",opts:["How market actors should operate and carry on their business, protecting users of financial products — reducing agency problems, conflicts of interest, and ensuring adequate services","Rules preventing financial institutions from failing and spreading systemic risk — a requirement introduced by the Lamfalussy Level 2 implementing measures","Requirements for institutions to hold sufficient capital to absorb losses — reflecting the maximum harmonisation approach adopted in this EU framework","Licensing rules ensuring only competent players can provide financial services — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — Conduct Regulation addresses how market actors should operate, protecting users, reducing agency problems and conflicts of interest.","❌ Preventing failure and systemic risk describes Prudential Regulation.","❌ Sufficient capital to absorb losses describes Prudential Rules.","❌ Licensing rules ensuring competent players describes the Licensing tool."],correct:0,slide:"Slide 02"},
{q:"One of the main challenges for regulators identified in the slides is that:",opts:["Regulated firms lack resources to comply with complex regulation — as established under the relevant EU secondary legislation framework","Large international financial institutions possess far greater resources dedicated to understanding and navigating the financial system than regulators do","Regulators are too politically independent and lack democratic accountability — reflecting the harmonisation objective of the EU single financial market","International coordination bodies like the FSB have too much power over national regulators — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The information asymmetry runs in the opposite direction.","✅ Correct — large international financial institutions have grown to the scale of nation-state financial systems and possess far greater resources than regulators.","❌ The slides advocate for political independence of regulators.","❌ The slides advocate for stronger international coordination through bodies like the FSB."],correct:1,slide:"Slide 02"},
{q:"The SFDR (Sustainable Finance Disclosure Regulation) mandates:",opts:["All EU companies to report on their environmental impact","Asset managers to report on sustainability risk integration","Credit institutions to hold green assets as minimum capital","Issuers to include ESG risk factors in their prospectuses"],exps:["❌ All EU companies' environmental impact reporting is addressed by the CSRD.","✅ Correct — the SFDR mandates asset managers to report on sustainability risk integration.","❌ Green asset requirements for credit institutions are a separate prudential concept.","❌ Prospectus requirements are governed by the Prospectus Regulation."],correct:1,slide:"Slide 02"},
{q:"The 'Institutional Model' of regulatory architecture uses:",opts:["Separate regulators for banking, securities, and insurance — mirroring the financial sector's divisions — still reflected in the EU's EBA, ESMA, and EIOPA structure","A single comprehensive authority like the UK's former FSA — as established under the relevant EU secondary legislation framework","Goal-defined agencies with separate authorities for different objectives — reflecting the harmonisation objective of the EU single financial market","A fully integrated EU-level supervisor replacing all national authorities — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the Institutional Model uses separate regulators for banking, securities, and insurance, still reflected in the EU's three ESA structure.","❌ A single comprehensive authority describes the Unified Model.","❌ Goal-defined agencies describe the Twin Peaks Model.","❌ A fully integrated EU-level supervisor is a different concept."],correct:0,slide:"Slide 02"}
,
{q:"George Akerlof's 'Market for Lemons' describes which market failure?",opts:["Negative externalities arising from excessive trading volumes that damage market efficiency and price formation","Adverse selection caused by information asymmetry between sellers who know product quality and buyers who do not","Moral hazard created when implicit government guarantees encourage banks to take excessive risks at public expense","Regulatory arbitrage by large financial institutions exploiting gaps between national supervisory frameworks"],exps:["❌ The 'Market for Lemons' focuses on information asymmetry, not externalities.","✅ Correct — Akerlof's model shows how sellers knowing product quality while buyers do not leads to adverse selection, with only low-quality 'lemons' remaining in the market.","❌ Moral hazard concerns incentives created by insurance or guarantees, not information asymmetry at point of sale.","❌ Regulatory arbitrage is not the subject of Akerlof's model."],correct:1,slide:"Slide 02"},
{q:"Which form of market efficiency posits that prices rapidly adjust to all publicly available information?",opts:["Weak form efficiency, which holds that prices reflect all historical price data but not current public disclosures","Semi-strong form efficiency, under which market prices rapidly adjust to incorporate all publicly available information","Strong form efficiency, which requires prices to reflect all information including private and insider information","Pareto efficiency, which holds that no market participant can improve their position without making another worse off"],exps:["❌ Weak form efficiency holds that prices reflect all historical price data only.","✅ Correct — semi-strong form efficiency holds that market prices rapidly reflect all publicly available information.","❌ Strong form efficiency holds that prices reflect all information, including private information.","❌ Pareto efficiency is an economic welfare concept, not a form of market efficiency."],correct:1,slide:"Slide 02"},
{q:"Which regulatory tool is most directly aimed at preventing firms from using leverage to amplify systemic risk?",opts:["Disclosure requirements, which force firms to reveal leverage levels to investors so markets can price risks appropriately","Licensing requirements, which screen entrants and ensure only firms with adequate capital can access financial markets","Prudential rules including capital and liquidity requirements that directly constrain leverage and risk-taking capacity","Conduct regulation, which addresses conflicts of interest and ensures clients are treated fairly regardless of leverage"],exps:["❌ Disclosure improves information but does not directly limit leverage.","❌ Licensing controls market entry but does not address ongoing leverage.","✅ Correct — prudential rules, including capital requirements and leverage limits, are specifically designed to prevent firms from taking excessive risk that could spread systemic failure.","❌ Conduct regulation addresses how firms treat clients, not capital structure."],correct:2,slide:"Slide 02"},
{q:"The 'Twin Peaks' regulatory model, adopted in the UK after the financial crisis, is based on:",opts:["Two separate agencies each defined by objective: one for prudential regulation and one for consumer protection and conduct","Two regulators each responsible for one financial sector — one covering banking and one covering insurance and pensions","A single unified regulator combining prudential and conduct supervision, replacing the pre-crisis sectoral approach","A central bank-led model where the Bank of England supervises all financial entities for both safety and conduct purposes"],exps:["✅ Correct — Twin Peaks uses goal-defined architecture: the PRA handles prudential regulation while the FCA handles consumer protection and market integrity.","❌ The institutional model (not Twin Peaks) divides regulators by sector.","❌ A single unified regulator describes the pre-crisis FSA model, which Twin Peaks replaced.","❌ Central bank supervision of all entities describes the unified model, not Twin Peaks."],correct:0,slide:"Slide 02"},
{q:"Pareto optimality is limited as a social welfare standard because:",opts:["An allocation may be Pareto efficient yet deeply unequal or socially undesirable — efficiency does not equal fairness","It requires unanimous agreement among all economic actors before any policy change can be adopted or implemented","It can only be achieved through direct government intervention in markets, making it incompatible with market economies","It conflicts with EU Treaty obligations on free movement, which require redistribution of resources across Member States"],exps:["✅ Correct — a Pareto-optimal allocation may be highly efficient yet extremely unequal, which is why redistribution and fairness considerations justify public intervention even without market failure.","❌ Pareto optimality is an economic concept, not a political voting rule.","❌ Pareto optimality can arise from competitive markets without government intervention.","❌ Pareto optimality is an economic concept unrelated to EU Treaty freedoms."],correct:0,slide:"Slide 02"},
{q:"The Genius Act of July 2025 is notable for being:",opts:["The first US legislation specifically addressing stablecoins, contrasting with the EU's earlier MiCAR comprehensive approach","The EU's comprehensive crypto-asset regulation, adopted in 2025 to replace MiCAR after its initial implementation failed","The UK's post-Brexit financial services framework, replacing EU passporting rights with a unilateral equivalence regime","An IOSCO standard for cross-border crypto regulation, endorsed by the G20 as the global benchmark for digital assets"],exps:["✅ Correct — the Genius Act of July 2025 introduced the first US legislation specifically addressing stablecoins, in contrast to the EU's more comprehensive MiCAR approach.","❌ MiCAR is the EU regulation adopted in 2023; the Genius Act is a US law.","❌ The Genius Act is US legislation, not the UK's post-Brexit framework.","❌ The Genius Act is US domestic legislation, not an IOSCO international standard."],correct:0,slide:"Slide 02"},
{q:"Which macro-prudential tool requires banks to hold additional capital during economic booms that can be released during downturns?",opts:["The Liquidity Coverage Ratio, which requires banks to hold enough high-quality liquid assets to survive 30-day stress scenarios","The Net Stable Funding Ratio, which requires sufficient stable long-term funding relative to illiquid asset holdings","The countercyclical capital buffer, built up in credit booms and released in downturns to prevent pro-cyclical lending","The leverage ratio, which imposes a minimum Tier 1 capital floor as a percentage of total exposure regardless of risk weights"],exps:["❌ The LCR requires banks to hold enough liquid assets to cover 30-day cash outflows.","❌ The NSFR requires stable long-term funding relative to illiquid assets.","✅ Correct — the countercyclical capital buffer is built up during credit booms and released during downturns to prevent pro-cyclical lending behaviour.","❌ The leverage ratio limits total assets relative to capital but is not countercyclical."],correct:2,slide:"Slide 02"},
{q:"The EU's AI Act compared to the US NIST AI Risk Management Framework represents:",opts:["Both adopt equally prescriptive binding rules requiring ex-ante approval for all AI systems above a minimal risk threshold","The EU adopts a highly detailed prescriptive legislative approach while the US prefers soft law and informal voluntary guidance","The US adopts stricter binding rules with mandatory certification, while the EU relies on voluntary industry standards only","Both rely entirely on market-based self-regulation with no mandatory requirements for any category of AI application"],exps:["❌ The approaches are fundamentally different in character.","✅ Correct — the EU AI Act represents a highly detailed, prescriptive legislative approach, while the US prefers soft law and informal guidance through frameworks like NIST's AI Risk Management Framework.","❌ The US approach is less binding than the EU's.","❌ Neither relies entirely on self-regulation."],correct:1,slide:"Slide 02"},
{q:"In the regulatory toolbox, 'conduct regulation' primarily addresses:",opts:["Capital requirements and liquidity buffers that prevent firms from becoming insolvent and threatening financial stability","Market entry controls ensuring that only fit and proper firms with adequate resources can obtain financial authorisation","How market actors operate and treat clients, including suitability, conflicts of interest, and best execution obligations","Enforcement powers enabling NCAs to investigate, sanction, and publicly disclose violations of financial market rules"],exps:["❌ Capital requirements are prudential tools, not conduct regulation.","❌ Market entry controls describe licensing requirements.","✅ Correct — conduct regulation addresses how market actors should operate, protecting users of financial products by reducing conflicts of interest and ensuring clients receive adequate service.","❌ Enforcement is a separate tool involving sanctions and investigations."],correct:2,slide:"Slide 02"},
{q:"What distinguishes genuine financial innovation from regulatory arbitrage?",opts:["Genuine innovation always delivers higher returns for investors while regulatory arbitrage always reduces risk for firms","Only large systemically important institutions engage in regulatory arbitrage while only start-ups engage in genuine innovation","Regulatory arbitrage is always legal under EU law while genuine innovation may require derogations from existing rules","Genuine innovation reduces actual social costs of financial activity while arbitrage restructures to avoid costs without reducing harms"],exps:["❌ The distinction is not about returns or risk levels.","❌ The distinction is conceptual, not firm-size based.","❌ Both forms of innovation may be legal; the distinction is about whether they serve regulatory goals.","✅ Correct — genuine innovation reduces the actual social costs of activities, while regulatory arbitrage restructures activities to fall outside or under lighter regulation without reducing social costs."],correct:3,slide:"Slide 02"},
{q:"Bounded rationality and behavioural biases in financial markets refer to which observation?",opts:["Humans are cognitively constrained and prone to systematic errors including overconfidence, herding, and loss aversion","Investors are entirely rational when provided with sufficient financial education and access to standardised disclosure documents","Regulatory authorities rather than investors are the main source of irrational behaviour in financial markets globally","Behavioural biases exclusively affect retail investors and are absent among professional and institutional market participants"],exps:["✅ Correct — bounded rationality describes how humans are cognitively limited and systematically prone to errors including overconfidence, herding, and loss aversion; these biases are predictable, widespread, and constitute a recognised market failure justifying regulatory intervention.","❌ The existence of bounded rationality directly contradicts the assumption of full investor rationality.","❌ Bounded rationality applies to all market participants, including regulators; however, as a market failure concept it primarily concerns investor behaviour.","❌ Behavioural finance research shows that professional investors are also subject to systematic biases, not only retail participants."],correct:0,slide:"Slide 02"},
{q:"When regulatory goals conflict, which of the following best illustrates a tension between investor protection and financial stability?",opts:["Disclosure requirements reducing information asymmetry between issuers and investors, improving both protection and efficiency","Competition rules preventing anti-competitive bank mergers, maintaining diversity and reducing too-big-to-fail concentration","Criminal sanctions for market abuse deterring manipulative trading activity, improving both integrity and investor confidence","Microprudential rules constraining certain investments that reduce diversification, potentially creating concentration risks"],exps:["❌ Disclosure rules generally support both investor protection and efficiency simultaneously.","❌ Merger rules concern competition policy, not the investor protection vs stability tension.","❌ Criminal sanctions for market abuse serve both investor protection and market integrity without inherent tension with stability.","✅ Correct — investor protection might conflict with financial stability when microprudential rules (e.g. constraints on certain risky assets) reduce diversification, potentially creating stability risks if the rules concentrate exposures."],correct:3,slide:"Slide 02"}],
"03 — Taxonomy of Legal Sources":[
{q:"At the peak of the hierarchy of EU legal sources are:",opts:["Regulations, Directives, and Decisions (Article 288 TFEU)","ESA Guidelines and Q&As","The TEU, TFEU and the EU Charter of Fundamental Rights","Level 2 delegated acts adopted by the Commission"],exps:["❌ These are secondary legislation, below the Treaties.","❌ ESA guidelines are soft law, well below the Treaties.","✅ Correct — the TEU, TFEU, and the EU Charter of Fundamental Rights (same legal value as Treaties since Lisbon) are at the peak.","❌ Level 2 acts are derived from the Treaties."],correct:2,slide:"Slide 03"},
{q:"The Treaty of Lisbon (2009) introduced:",opts:["The Treaty on European Union, renamed from the founding text, and the euro — as established under the relevant EU secondary legislation framework","The European Economic Community, launching the post-war integration project — a requirement applying to all entities within the relevant regulatory scope","The Treaty on the Functioning of the EU (TFEU) and brought the EU Charter of Fundamental Rights into force with the same legal value as the Treaties","The Lamfalussy process to speed up financial market regulation — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Renaming the founding text and introducing the euro were outcomes of the Maastricht Treaty (1992).","❌ Founding the EEC was the result of the Treaty of Rome (1957).","✅ Correct — the Treaty of Lisbon introduced the TFEU and brought the EU Charter into force with the same legal value as the Treaties.","❌ The Lamfalussy process was designed in 2001, before the Treaty of Lisbon."],correct:2,slide:"Slide 03"},
{q:"The principle of subsidiarity means:",opts:["The Union acts only when objectives cannot be sufficiently achieved by Member States and can therefore be better achieved at Union level","The Union always acts before Member States on matters covered by EU law — as established under the relevant EU secondary legislation framework","EU action must not exceed what is necessary to achieve Treaty objectives — reflecting the harmonisation objective of the EU single financial market","EU law is directly applicable in national legal systems — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — subsidiarity means the Union acts only when objectives cannot sufficiently be achieved by Member States.","❌ The Union does not always act first; subsidiarity limits Union action.","❌ Not exceeding what is necessary describes the principle of proportionality.","❌ Direct applicability in national systems describes direct effect."],correct:0,slide:"Slide 03"},
{q:"The principle of proportionality means:",opts:["The Union always acts to the full extent possible to achieve Treaty objectives","Union action shall not exceed what is necessary to achieve Treaty objectives","National measures restricting fundamental freedoms must be proportionate to a legitimate aim","EU law prevails over incompatible national legislation"],exps:["❌ Acting to the full extent possible is the opposite of proportionality.","✅ Correct — proportionality means Union action shall not exceed what is necessary to achieve Treaty objectives.","❌ Proportionality of national restrictions is a CJEU concept; this question asks about the EU principle of proportionality.","❌ EU law prevailing over national law describes primacy."],correct:1,slide:"Slide 03"},
{q:"A Regulation under Article 288 TFEU is best described as:",opts:["Binding on Member States as to result, leaving freedom in means and form — a requirement introduced by the Lamfalussy Level 2 implementing measures","An act of general scope, binding in all its elements and directly applicable in the EU without national transposition","An act binding only on its specified addressees — reflecting the maximum harmonisation approach adopted in this EU framework","A non-binding instrument subject to comply-or-explain — a principle established in the foundational Regulation governing this area"],exps:["❌ Binding as to result but leaving freedom of means describes a Directive.","✅ Correct — a Regulation is of general scope, binding in all its elements, and directly applicable without need for national implementing measures.","❌ Binding only on specified addressees describes a Decision.","❌ Comply-or-explain describes ESA guidelines (soft law)."],correct:1,slide:"Slide 03"},
{q:"A Directive under Article 288 TFEU is best described as:",opts:["Directly applicable in all Member States without national implementing measures — a requirement introduced by the Lamfalussy Level 2 implementing measures","Binding only on its specified addressees — as confirmed by the CJEU in its consistent line of case law on this point","Binding on Member States as to the result to be achieved, leaving freedom as to form and methods of implementation","A non-binding instrument subject to a comply-or-explain obligation — a principle established in the foundational Regulation governing this area"],exps:["❌ Direct applicability without national implementation describes a Regulation.","❌ Binding only on specified addressees describes a Decision.","✅ Correct — a Directive is binding as to result but leaves national authorities freedom as to form and methods of implementation.","❌ Comply-or-explain is associated with ESA guidelines (soft law), not Directives."],correct:2,slide:"Slide 03"},
{q:"'Gold-plating' refers to:",opts:["The Commission adding requirements to a Directive after its adoption — as established under the relevant EU secondary legislation framework","An obligation to implement Directives within a stricter timeline — as confirmed by the relevant CJEU case law and regulatory guidance","Maximum harmonisation clauses preventing national deviation — reflecting the harmonisation objective of the EU single financial market","Member States increasing regulation beyond minimum Directive requirements when transposing — though Directives may set limitations to prevent fragmentation"],exps:["❌ Gold-plating is a Member State transposition practice.","❌ Implementation timelines are not related to gold-plating.","❌ Maximum harmonisation clauses are the tool used to limit gold-plating.","✅ Correct — gold-plating means Member States increase regulation beyond Directive requirements when transposing."],correct:3,slide:"Slide 03"},
{q:"The 'Frankovich principle' means:",opts:["EU law has direct effect and can be relied upon before national courts — as established under the relevant EU secondary legislation framework","State liability for compensation when individuals cannot enforce EU-conferred rights due to a failure to implement a Directive","Regulations are directly applicable without national transposition — reflecting the harmonisation objective of the EU single financial market","National courts must interpret domestic law in conformity with EU Directives — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Direct effect is a separate doctrine.","✅ Correct — Frankovich establishes State liability: when a Directive grants rights that cannot be enforced because the State failed to implement it, individuals can claim compensation.","❌ Direct applicability of Regulations is a feature of Article 288 TFEU.","❌ Interpreting national law in conformity with EU Directives is 'consistent interpretation' (indirect effect)."],correct:1,slide:"Slide 03"},
{q:"The Lamfalussy process was designed in 2001 primarily because:",opts:["The financial crisis of 2008 exposed major weaknesses requiring faster regulatory responses","The CJEU ruled that existing legislative procedures breached the principle of proportionality","The Maastricht Treaty mandated a specific financial markets legislative procedure","The EU's traditional legislative process proved too lengthy and cumbersome for rapidly evolving financial markets"],exps:["❌ The Lamfalussy process was designed in 2001, seven years before the financial crisis.","❌ The CJEU did not rule on this; it was a political decision.","❌ The Maastricht Treaty did not mandate this.","✅ Correct — the Lamfalussy process addressed the fact that the traditional legislative process was too slow for rapidly evolving financial markets."],correct:3,slide:"Slide 03"},
{q:"Under the Lamfalussy process, Level 1 consists of:",opts:["Delegated acts (RTS) and implementing acts (ITS) drafted by ESAs — as established under the relevant EU secondary legislation framework","Broad framework legislation containing basic principles approved through the ordinary legislative procedure","Guidelines, Q&As and opinions from ESAs to foster convergence — reflecting the harmonisation objective of the EU single financial market","Commission monitoring with power to bring infringement proceedings — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ RTS and ITS describe Level 2.","✅ Correct — Level 1 consists of broad framework legislation containing basic principles approved through the ordinary legislative procedure involving Parliament, Council, and Commission.","❌ Guidelines, Q&As, and opinions describe Level 3.","❌ Commission monitoring and infringement proceedings describe Level 4."],correct:1,slide:"Slide 03"},
{q:"Under the Lamfalussy process, Level 2 consists of:",opts:["Broad framework legislation with basic principles — as established under the relevant EU secondary legislation framework","Delegated acts (RTS) and implementing acts (ITS) drafted by ESAs and adopted by the Commission","Guidelines, Q&As and opinions from ESAs for convergence — reflecting the harmonisation objective of the EU single financial market","Commission monitoring and infringement proceedings — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Broad framework legislation describes Level 1.","✅ Correct — Level 2 consists of RTS (substantive regulatory rules) and ITS (technical/procedural details) drafted by ESAs and adopted by the Commission.","❌ Guidelines, Q&As, and opinions describe Level 3.","❌ Commission monitoring describes Level 4."],correct:1,slide:"Slide 03"},
{q:"ESA Guidelines are subject to a 'comply or explain' rule, meaning national authorities must:",opts:["Comply with the guidelines or face infringement proceedings","Either comply with the guidelines or explain publicly why they have not done so","Comply with the guidelines; Q&As carry the same formal obligation","Comply or explain; Q&As and Opinions carry no such formal obligation"],exps:["❌ Guidelines are soft law; non-compliance does not directly trigger infringement proceedings.","❌ Partially correct but incomplete — Q&As and Opinions do NOT carry the same formal comply-or-explain obligation.","❌ Q&As and Opinions do NOT carry the same formal comply-or-explain obligation as Guidelines.","✅ Correct — national authorities must comply with ESA Guidelines or explain why they have not; Q&As and Opinions are informal tools with no formal comply-or-explain obligation."],correct:3,slide:"Slide 03"},
{q:"Soft law instruments (ESA Guidelines) are best described as:",opts:["Formally binding acts challengeable through annulment actions before the CJEU — as established under the relevant EU secondary legislation framework","Non-binding instruments that have absolutely no legal effects in practice — a requirement applying to all entities within the relevant regulatory scope","Not formally binding, but carrying significant compliance throughout the EU; validity may be reviewed indirectly through preliminary rulings","Secondary legislation with direct applicability equivalent to Regulations — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Soft law instruments cannot be subject to direct annulment actions.","❌ The slides explicitly state they can have significant legal effects.","✅ Correct — not formally binding but carrying significant compliance; validity may be reviewed indirectly through preliminary rulings.","❌ Soft law instruments are not secondary legislation."],correct:2,slide:"Slide 03"},
{q:"In Cassis de Dijon (1979), the CJEU's ruling consolidated:",opts:["ESA powers and the legal status of soft law instruments","The Frankovich principle on State liability","Free movement of goods, laying foundations for single market development","Horizontal direct effect of Directives between private parties"],exps:["❌ ESA powers and soft law were addressed in Short Selling (2014) and FBF (2021).","❌ The Frankovich principle was established in Francovich and Bonifaci (1991).","✅ Correct — Cassis de Dijon (1979) consolidated free movement of goods, laying foundations for single market development.","❌ Horizontal direct effect of Directives is a separate doctrine."],correct:2,slide:"Slide 03"},
{q:"In the Short Selling case (2014), the CJEU addressed:",opts:["ESA powers and legal status of soft law instruments","Free movement of capital and state special rights","The Frankovich principle on State liability","The principle of subsidiarity in financial regulation"],exps:["✅ Correct — the Short Selling case (2014) addressed ESA powers and the legal status of soft law instruments, and also softened the Meroni doctrine.","❌ State special rights and capital freedom were addressed in Commission v Portugal, France and Netherlands.","❌ The Frankovich principle was established in Francovich and Bonifaci (1991).","❌ Subsidiarity was not the central issue in the Short Selling case."],correct:0,slide:"Slide 03"},
{q:"Preliminary ruling procedures under Article 267 TFEU serve which purpose?",opts:["They allow the Commission to bring infringement proceedings against Member States","They allow private parties to challenge EU secondary legislation directly","They enable the CJEU to provide uniform interpretation of EU law when referred by national courts","They enable ESAs to seek CJEU guidance on Level 2 technical standards"],exps:["❌ Infringement proceedings are brought under Article 258 TFEU.","❌ Private parties challenging EU acts use annulment actions under Article 263 TFEU.","✅ Correct — preliminary rulings allow national courts to refer questions to the CJEU, ensuring uniform interpretation.","❌ ESAs do not use preliminary rulings; this mechanism is for national courts."],correct:2,slide:"Slide 03"},
{q:"Unlike national legal systems, secondary EU legislation under Article 288 TFEU is notable because:",opts:["Regulations always take precedence over Directives","Decisions are always superior to Regulations and Directives in matters of enforcement","Directives always take precedence over Regulations in financial regulation","There is no formal hierarchy between the five types of acts — each serves specific policy needs"],exps:["❌ Unlike national legal systems, there is no formal hierarchy between the five types of secondary legislation.","❌ Decisions are not superior to Regulations and Directives.","❌ Directives do not take precedence over Regulations.","✅ Correct — there is no formal hierarchy between the five types of acts provided for in Article 288 TFEU; each serves specific policy needs."],correct:3,slide:"Slide 03"},
{q:"Curia (curia.europa.eu) provides which information for legal research?",opts:["Regulations, directives, decisions, and CJEU rulings (Eur-Lex function)","Judgments, Advocate General opinions, and a 'Case Law Search' function","Financial market rules, guidelines, and recommendations (ESMA function)","Banking rules, guidelines, and Q&As on credit institutions (EBA function)"],exps:["❌ Access to EU law is provided by Eur-Lex, not Curia.","✅ Correct — Curia is the CJEU website providing judgments, Advocate General opinions, and the 'Case Law Search' function.","❌ Financial market rules and recommendations are provided by ESMA.","❌ Banking rules and Q&As are provided by EBA."],correct:1,slide:"Slide 03"},
{q:"The FBF case (2021) further clarified:",opts:["The Frankovich principle on State liability for non-implementation of Directives","The scope of the transparency obligation under the Market Abuse Directive","Free movement of goods and the principle of mutual recognition","Soft law measures and their judicial review, continuing the evolution of the Meroni doctrine"],exps:["❌ The Frankovich principle was established in earlier case law.","❌ The transparency obligation under MAD is a separate topic.","❌ Free movement of goods was addressed in Cassis de Dijon (1979).","✅ Correct — the FBF case (2021) further clarified soft law measures and their judicial review, showing doctrine evolving while core Meroni constraints remain valid."],correct:3,slide:"Slide 03"},
{q:"The co-decision procedure in EU legislative process is best described as:",opts:["The Commission adopting legislation independently after consulting Parliament — as established under the relevant EU secondary legislation framework","The Council adopting legislation by unanimity after a Parliamentary vote — as confirmed by the relevant CJEU case law and regulatory guidance","The Council adopting legislation with mere Commission approval — reflecting the harmonisation objective of the EU single financial market","Joint adoption by Parliament and Council operating on equal footing, with the Commission launching consultations and presenting legislative proposals"],exps:["❌ The Commission cannot adopt legislation independently.","❌ Unanimity in the Council is the exception, not the rule.","❌ The Council does not act with mere Commission approval; Parliament is equally involved.","✅ Correct — the co-decision (ordinary legislative) procedure involves joint adoption by Parliament and Council on equal footing, with Commission proposals."],correct:3,slide:"Slide 03"}
,
{q:"The Basel standards (Basel I, II, III) are best described as:",opts:["Binding EU Regulations directly applicable in all Member States","Technical standards adopted by EBA at Level 2 of the Lamfalussy process","Directives adopted through the ordinary legislative procedure by Parliament and Council","Examples of soft law — they are set by international bodies and are not directly applicable worldwide"],exps:["❌ Basel standards are not EU Regulations; they are international standards developed by the Basel Committee on Banking Supervision.","❌ Basel standards are not EBA technical standards; EBA drafts RTS implementing Basel principles, but the Basel standards themselves originate from the international Basel Committee.","❌ Basel standards are not adopted through the EU ordinary legislative procedure; they are international standards.","✅ Correct — Basel standards are examples of soft law: they are set by international bodies (the Basel Committee on Banking Supervision at the BIS) and are not directly applicable worldwide; they must be implemented through national or EU legislation (e.g., CRR/CRD IV implement Basel III in the EU)."],correct:3,slide:"Slide 03"}
,
{q:"EU Decisions under Article 288 TFEU:",opts:["Apply to all EU citizens","Require national authorities to adapt their laws to meet the goals set by them","Relate to specific cases","Are never binding"],exps:["❌ EU Decisions do not apply to all EU citizens; they are binding only on their specific addressees.","❌ Requiring national authorities to adapt their laws to meet goals set by them describes Directives, not Decisions.","✅ Correct — EU Decisions are binding in their entirety but only on those to whom they are addressed; they relate to specific cases and specific addressees, unlike Regulations (general application) or Directives (Member States as addressees).","❌ EU Decisions are binding in their entirety on their addressees — they are legally binding acts."],correct:2,slide:"Slide 03"}
,
