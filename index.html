{q:"Under MiFID II cross-selling rules for product or service packages, firms must:",opts:["Offer all products exclusively as packages", "Inform whether components can be purchased separately, disclose separate costs per component, explain how component interaction alters risk profile, and provide full pricing for both package and individual components", "Only disclose the total package price without breaking down individual components", "Obtain NCA approval before offering any bundled products"],exps:["❌ Firms must offer unbundled alternatives, not exclusively packages.", "✅ Correct — cross-selling rules require: informing whether components can be purchased separately; disclosing separate costs per component; explaining how component interaction alters risk profile; providing full pricing for package and individual components.", "❌ Breaking down individual component costs is specifically required.", "❌ NCA approval is not required for bundled products."],correct:1,slide:"Slide 06"},
{q:"Under MiFID II, staff providing investment advice require a minimum of how many months of relevant experience?",opts:["Three months", "Six months full-time relevant experience — with unqualified staff able to provide services under qualified supervision for a maximum of four years", "Twelve months of directly supervised experience", "Twenty-four months of graduate training"],exps:["❌ Three months is below the MiFID II requirement.", "✅ Correct — MiFID II requires appropriate qualifications and a minimum of six months full-time relevant experience; unqualified staff may provide services under qualified supervision for a maximum of four years.", "❌ Twelve months is above the minimum required.", "❌ Twenty-four months of graduate training is not the MiFID II standard."],correct:1,slide:"Slide 06"}
,
{q:"Which of the following is NOT an investment service under Section A of Annex I of MiFID II?",opts:["Portfolio management", "Underwriting of financial instruments", "Collective asset management", "Reception and transmission of orders"],exps:["❌ Portfolio management IS an investment service listed in Section A of Annex I MiFID II.", "❌ Underwriting of financial instruments IS an investment service listed in Section A of Annex I MiFID II.", "✅ Correct — collective asset management (i.e., managing UCITS or AIFs) is NOT listed as an investment service in Section A of Annex I MiFID II. It is governed by the UCITS Directive and AIFMD, not MiFID II.", "❌ Reception and transmission of orders IS an investment service listed in Section A of Annex I MiFID II."],correct:2,slide:"Slide 06"}
,
{q:"Why does MiFID II classify clients into different categories (retail, professional, eligible counterparty)?",opts:["Because the Directive mandates that investment services can be provided only to retail clients", "Because professional clients and eligible counterparties are entirely out of scope of MiFID II", "Because the Directive mandates that investment firms apply a differentiated set of conduct-of-business and transparency obligations depending on the category of client", "Because only retail clients can bring civil liability claims for MiFID II breaches"],exps:["❌ MiFID II applies to all client categories; it does not restrict services only to retail clients.", "❌ Professional clients and eligible counterparties are within MiFID II's scope, but subject to lighter conduct-of-business obligations.", "✅ Correct — MiFID II classifies clients because the Directive mandates that investment firms apply a differentiated set of conduct-of-business and transparency obligations depending on the category of client, calibrating protection to financial sophistication.", "❌ Civil liability for MiFID II breaches is available to all client categories, not only retail clients."],correct:2,slide:"Slide 06"}
,
{q:"Under MiFID II, a retail client may request to be treated as a professional investor if certain quantitative and qualitative conditions are met. Which of the following criteria is NOT among those assessed for such reclassification?",opts:["The number of transactions carried out within a given time period", "The investor's global wealth", "The investor's work experience in the financial sector", "The value of the investor's financial instrument portfolio"],exps:["❌ The number of significant transactions per quarter (minimum 10 over four quarters) IS one of the three criteria assessed for professional reclassification.", "✅ Correct — the investor's global wealth is NOT one of the three criteria assessed for professional reclassification. The three criteria are: significant transaction volume (10+ per quarter over four quarters); portfolio exceeding €500,000 (cash deposits plus financial instruments); and one year of relevant professional experience in the financial sector.", "❌ The investor's work experience (minimum one year in a relevant financial sector position) IS one of the three criteria assessed.", "❌ The value of the financial instrument portfolio (exceeding €500,000) IS one of the three criteria assessed — though it is the portfolio value, not global wealth."],correct:1,slide:"Slide 06"}
,
{q:"Suitability and appropriateness under MiFID II are best described as:",opts:["Synonyms that MiFID II uses interchangeably for the same client assessment", "Two distinct layers of client assessment to align financial services and instruments with the needs and capabilities of investors — suitability applies to advice and portfolio management; appropriateness applies to other services", "Assessments that investment firms must carry out only when retail clients are involved, but not when providing services to professional clients", "A single combined assessment required before any investment service is provided to any client"],exps:["❌ Suitability and appropriateness are NOT synonyms; they are two distinct assessments with different scope, triggers, and consequences.", "✅ Correct — suitability and appropriateness are two distinct layers of client assessment: suitability (full assessment of knowledge/experience, financial situation, and investment objectives) applies to investment advice and portfolio management; appropriateness (knowledge and experience only, warning test) applies to other investment services.", "❌ Both assessments can also apply when serving professional clients, although professional clients benefit from certain presumptions under MiFID II.", "❌ A single combined assessment is not the MiFID II framework; suitability and appropriateness are triggered by different services and have different scope."],correct:1,slide:"Slide 06"}
,
{q:"Instruments of payment under MiFID II:",opts:["Qualify as financial instruments under MiFID II", "Fall inside the scope of MiFID II to the extent that they are bought and sold by banks", "Can be traded in multilateral trading facilities", "Do not qualify as financial instruments under MiFID II"],exps:["❌ Instruments of payment are explicitly excluded from the definition of financial instruments under MiFID II.", "❌ The fact that banks buy and sell instruments of payment does not bring them within MiFID II's financial instrument definition.", "❌ Instruments of payment cannot be traded in MTFs because they are not financial instruments within MiFID II's scope.", "✅ Correct — instruments of payment (such as currencies used as means of payment) do not qualify as financial instruments under MiFID II; they are explicitly excluded from Section C of Annex I."],correct:3,slide:"Slide 06"}
,
{q:"The information to be collected in the context of the suitability test under MiFID II includes:",opts:["Experience of the client in the financial markets only", "Risk tolerance only", "All of the other options — experience, risk tolerance, and financial situation of the client", "Financial situation of the client only"],exps:["❌ Experience alone is insufficient; the suitability test also requires risk tolerance and financial situation.", "❌ Risk tolerance alone is insufficient; the suitability test also requires experience and financial situation.", "✅ Correct — the suitability test collects ALL of: (1) knowledge and experience of the client in the financial markets; (2) risk tolerance and ability to bear losses; (3) financial situation including income, assets, commitments, and investment objectives.", "❌ Financial situation alone is insufficient; all three dimensions are required."],correct:2,slide:"Slide 06"}
,
{q:"Under the MiFID II framework, investment advice:",opts:["May be provided by both regulated and non-regulated firms", "Is not an investment service", "Involves stricter rules of conduct compared to other investment services", "Is an investment service, but does not usually involve stricter rules compared to other investment services"],exps:["❌ Investment advice is a regulated investment service under Section A of Annex I; only authorised investment firms or credit institutions may provide it as a professional activity.", "❌ Investment advice IS listed as an investment service in Section A of Annex I to MiFID II.", "✅ Correct — investment advice involves stricter rules of conduct compared to other investment services, including the full suitability assessment (versus merely appropriateness for other services), mandatory suitability reports for retail clients, and specific inducement restrictions for independent advice.", "❌ Investment advice involves stricter rules — including the blocking suitability test — compared to other services like execution-only or order reception/transmission."],correct:2,slide:"Slide 06"}
,
{q:"The 'non-complex instruments' category for execution-only services under MiFID II does NOT include which of the following?",opts:["Shares traded on regulated markets","UCITS units excluding structured UCITS","Bonds without embedded derivatives on regulated venues","Structured products with capital protection but with embedded derivatives"],exps:["❌ Shares traded on regulated markets (excluding structured UCITS or those with embedded derivatives) are non-complex.","❌ UCITS units (excluding structured UCITS) are non-complex instruments.","❌ Bonds and debt instruments on regulated venues (excluding complex structures) are non-complex.","✅ Correct — structured products with embedded derivatives are complex instruments, even if capital-protected. Embedded derivative features are a key complexity indicator under ESMA guidelines."],correct:3,slide:"Slide 06"},
{q:"When must a firm issue a 10% portfolio loss alert to a retail client?",opts:["When any single instrument in the portfolio falls in value by 10%","When the overall portfolio value declines by 10% from the last report, and then for each subsequent 10% decline","When the portfolio falls by 5% and includes leveraged instruments","Only when losses exceed 20% of the total portfolio value"],exps:["❌ The 10% rule applies to the portfolio as a whole, not individual instruments (except for leveraged instruments and transactions involving potential liability, assessed instrument-by-instrument).","✅ Correct — MiFID II requires a 10% loss alert when the portfolio value declines by 10% from the last statement, and for each subsequent multiple of 10%, applicable to retail clients.","❌ The threshold is 10%, not 5%.","❌ The threshold is 10%, not 20%."],correct:1,slide:"Slide 06"},
{q:"Under MiFID II, a distributor's obligations in product governance include:",opts:["Only verifying that the manufacturer's target market definition is correct","Developing distribution strategies aligned with the manufacturer's target market and reporting sales data to manufacturers","Assuming the manufacturer's liability for product design","Only distributing to professional clients to avoid retail protection obligations"],exps:["❌ Distributors have broader obligations than merely verifying manufacturer definitions.","✅ Correct — distributors must define distribution strategies aligned with the target market, understand product features and risks, conduct ongoing governance reviews, and report sales data and performance back to manufacturers.","❌ Distributors do not assume manufacturer liability; both have independent obligations.","❌ MiFID II product governance applies across client categories; distributors cannot simply avoid retail obligations."],correct:1,slide:"Slide 06"},
{q:"Investment research under MiFID II is not considered an inducement when:",opts:["It is provided free of charge by any third party","It is paid directly from the firm's own resources or from a dedicated research payment account (RPA) funded by a specific client charge","The research firm is regulated by ESMA","It is provided only to professional clients"],exps:["❌ 'Free of charge' does not automatically make research non-inducement; the source of payment matters.","✅ Correct — investment research is not an inducement when paid from the firm's own resources or from a dedicated RPA funded by a client charge, with appropriate governance.","❌ ESMA regulation of the research firm is irrelevant to inducement classification.","❌ The research recipient's client category does not determine inducement status."],correct:1,slide:"Slide 06"},
{q:"Under MiFID II, staff who provide investment advice must have deeper knowledge than those who only provide information. What specific area of knowledge is specifically required for advisers but not information providers?",opts:["Product features and risks","Regulatory obligations of the firm","Suitability concerns, cost structures, portfolio management fundamentals, and client profile assessment","Valuation techniques and economic indicators"],exps:["❌ Product features and risks are required for both information providers and advisers.","❌ Regulatory obligations are required for both categories.","✅ Correct — advisers require deeper knowledge covering suitability concerns, cost structures, portfolio management fundamentals, the regulatory environment, and client profile assessment — beyond the information-provider requirements.","❌ Valuation techniques and economic indicators are among the knowledge requirements for information providers."],correct:2,slide:"Slide 06"},
{q:"For retail clients, best execution under MiFID II is primarily assessed on the basis of:",opts:["Speed of execution only","Total consideration — price plus all direct execution costs","Likelihood of execution and settlement","Market impact alone"],exps:["❌ Speed of execution is one of several factors, not the primary standard for retail clients.","✅ Correct — for retail clients, best execution is assessed primarily on 'total consideration': the price of the instrument plus all direct execution costs. Other factors may only take precedence if instrumental in achieving best total consideration.","❌ Likelihood of execution is a factor but not the primary standard for retail clients.","❌ Market impact is a factor but not the primary standard."],correct:1,slide:"Slide 06"},
{q:"MiFID II's GENIL case (C-604/11) clarified which aspect of civil liability for MiFID II breaches?",opts:["Member States must adopt a uniform damages regime for MiFID II breaches","Member States determine civil liability consequences under national law, subject to effectiveness and equivalence principles","ESMA has exclusive jurisdiction to adjudicate civil claims arising from MiFID II violations","Civil claims for MiFID II breaches can only be brought before the CJEU"],exps:["❌ The CJEU left civil liability to Member States; there is no uniform EU damages regime.","✅ Correct — Genil clarified that Member States determine the civil consequences of MiFID II breaches under national law, provided that the principles of effectiveness and equivalence are respected.","❌ ESMA has no adjudicative jurisdiction over civil claims.","❌ Civil claims are brought before national courts, not the CJEU."],correct:1,slide:"Slide 06"},
{q:"A systematic internaliser (SI) under MiFID II is required to:",opts:["Obtain separate authorisation as a trading venue","Publish firm quotes for shares, depositary receipts, ETFs, and certificates, aligning disclosure duties with multilateral venues","Apply full pre-trade and post-trade transparency rules identical to regulated markets","Accept orders from any investor regardless of size or client category"],exps:["❌ SIs do not need separate venue authorisation; they notify their NCA.","✅ Correct — SIs must publish firm quotes for shares, depositary receipts, ETFs, and certificates, aligning their transparency obligations with those of multilateral venues despite being bilateral entities.","❌ SIs are subject to SI-specific transparency rules, not identical to regulated market obligations.","❌ SIs may limit the number of transactions or refuse orders from clients in certain circumstances."],correct:1,slide:"Slide 06"},
{q:"The 'suitability' obligation in MiFID II differs from the 'appropriateness' obligation in that:",opts:["Suitability applies to execution-only services; appropriateness applies to advice","Suitability is a blocking test requiring the firm to refrain from recommending unsuitable products; appropriateness is a warning test — the firm must warn but the client may proceed","Suitability applies only to professional clients; appropriateness applies only to retail clients","Appropriateness requires assessing all three dimensions (knowledge, financial situation, objectives); suitability assesses only knowledge and experience"],exps:["❌ Suitability applies to advice and portfolio management, not execution-only services.","✅ Correct — suitability is a blocking test for advice/portfolio management (no unsuitable recommendation can be made); appropriateness is a warning test for other services (the firm warns but the client can proceed).","❌ Both apply to retail and professional clients, with different presumptions.","❌ Suitability requires all three dimensions; appropriateness is limited to knowledge and experience only."],correct:1,slide:"Slide 06"},
{q:"Under MiFID II, what is the maximum period during which unqualified staff may provide investment services under the supervision of a qualified adviser?",opts:["One year","Two years","Four years","Six months"],exps:["❌ One year is insufficient for the supervisory period.","❌ Two years is not the correct maximum period.","✅ Correct — unqualified staff may provide investment services under the supervision of a qualified adviser for a maximum of four years, after which they must meet the full qualification requirements.","❌ Six months is the minimum relevant experience requirement for qualified staff, not the supervisory period for unqualified staff."],correct:2,slide:"Slide 06"},
{q:"MiFID II's four core regulatory objectives are best described as:",opts:["Ensuring free movement of capital, eliminating tax barriers, harmonising insolvency law, and protecting retail investors","Market transparency, investor protection, market integrity, and cross-border integration through maximum harmonisation","Reducing systemic risk, promoting sustainable finance, digitalising financial services, and simplifying regulation","Establishing a single currency, creating a banking union, harmonising contract law, and protecting depositors"],exps:["❌ Free movement of capital and insolvency law are Treaty/general EU law matters, not MiFID II's specific objectives.","✅ Correct — MiFID II's four core objectives are: (1) market transparency (pre/post-trade); (2) investor protection (conduct rules, product governance); (3) market integrity (algorithmic trading, MAR interface); and (4) cross-border integration through maximum harmonisation.","❌ These describe broader EU financial policy priorities, not MiFID II's specific objectives.","❌ These describe Banking Union and monetary union objectives, not MiFID II."],correct:1,slide:"Slide 06"}],
"07 — Trading Venues":[
{q:"Under MiFID II, a 'trading venue' is defined as:",opts:["Any regulated market recognised by a Member State","Any system that, as a regular business, brings together multiple third-party buying and selling interests in financial instruments and matches those interests so a contract is formed","Any investment firm authorised to execute client orders","Any electronic platform used for trading financial instruments"],exps:["❌ Regulated markets are one category of trading venue, but the definition is broader.","✅ Correct — a trading venue is any system that, as a regular business, brings together multiple third-party buying and selling interests and matches them so a contract is formed.","❌ Investment firms may operate trading venues but are not themselves trading venues.","❌ 'Electronic platform' is too broad; the definition requires multilateral matching."],correct:1,slide:"Slide 07"},
{q:"A Regulated Market (RM) is best described as:",opts:["A multilateral system operated by an investment firm matching third-party orders under non-discretionary rules, not authorised as an RM","A multilateral system operated by a market operator bringing together multiple third-party interests under non-discretionary rules — the most demanding governance and transparency obligations — notified by each Member State to ESMA","A multilateral platform for non-equity instruments where the operator may exercise discretion","An investment firm dealing on own account bilaterally with clients outside regulated venues"],exps:["❌ A multilateral system operated by an investment firm (not authorised as RM) describes an MTF.","✅ Correct — RMs are operated by market operators under non-discretionary rules, subject to the most demanding governance and transparency obligations.","❌ A platform for non-equity instruments with operator discretion describes an OTF.","❌ An investment firm dealing bilaterally on own account describes a Systematic Internaliser."],correct:1,slide:"Slide 07"},
{q:"An Organised Trading Facility (OTF) was introduced by MiFID II to capture:",opts:["All equity trading outside regulated markets","Previously unregulated multilateral platforms for non-equity instruments (bonds, derivatives, structured products) where the operator may exercise discretion","Systematic internalisers dealing on their own account","Alternative Investment Fund managers operating trading platforms"],exps:["❌ OTFs are limited to non-equity instruments.","✅ Correct — OTFs were introduced to capture previously unregulated multilateral platforms for non-equity instruments, where the operator may exercise discretion subject to conduct constraints.","❌ Systematic internalisers are bilateral, not multilateral.","❌ AIFM platforms are not OTFs."],correct:1,slide:"Slide 07"},
{q:"The key difference between OTF and RM/MTF regarding discretion is:",opts:["OTF operators must use non-discretionary rules; RMs and MTFs may exercise discretion","OTF operators may exercise discretion when executing transactions (subject to conduct constraints); RMs and MTFs must use non-discretionary rules","All three venue types operate under non-discretionary rules without exception","Discretion rules apply only to equity instruments across all venue types"],exps:["❌ This is the exact reverse.","✅ Correct — OTF operators may exercise discretion; both RMs and MTFs must operate under non-discretionary rules.","❌ OTFs are distinguished precisely by the ability to exercise discretion.","❌ Discretion rules apply differently depending on venue type, not instrument type."],correct:1,slide:"Slide 07"},
{q:"A Systematic Internaliser (SI) differs from a trading venue because:",opts:["SIs trade only bonds and structured products, not equities","SIs are investment firms dealing bilaterally on own account with clients outside RMs, MTFs, or OTFs — they lack the multilateralism characterising true trading venues","SIs require separate authorisation as market operators from their home NCA","SIs are only permitted in Member States that have opted out of certain MiFID II provisions"],exps:["❌ SIs can trade equities and other instruments.","✅ Correct — SIs are investment firms dealing bilaterally on own account with clients outside RMs/MTFs/OTFs; they lack multilateralism and are not trading venues in the statutory sense.","❌ SIs need merely to notify their NCA; no separate market operator authorisation is required.","❌ SIs are a uniform EU concept; there is no opt-out provision."],correct:1,slide:"Slide 07"},
{q:"An SME Growth Market must meet which registration requirement?",opts:["At least 25% of issuers must be SMEs with market cap below €200 million","At least 50% of issuers whose financial instruments are traded must be SMEs (average market cap below EUR 200 million over the previous three years)","All issuers must be SMEs with fewer than 250 employees","At least 75% of traded instruments must be equity securities"],exps:["❌ The threshold is 50%, not 25%.","✅ Correct — at least 50% of issuers must be SMEs (average market cap below EUR 200 million over the previous three years).","❌ The SME Growth Market does not require all issuers to be SMEs.","❌ The requirement concerns issuer characteristics, not instrument type."],correct:1,slide:"Slide 07"},
{q:"The Share Trading Obligation under MiFIR requires:",opts:["All shares to be traded exclusively on regulated markets","Investment firms to execute transactions in shares admitted to EU trading only on an RM, MTF, SI, or equivalent third-country venue — internal crossing is no longer permissible","Investment firms to report all share transactions to ESMA within 15 minutes","Shares to be cleared through an EU central counterparty"],exps:["❌ SIs and equivalent third-country venues are also permitted.","✅ Correct — once a share is admitted to EU trading, investment firms must execute transactions only on an RM, MTF, SI, or equivalent third-country venue.","❌ 15-minute reporting is a post-trade transparency obligation, not the Share Trading Obligation.","❌ Central clearing is required for specific derivatives under EMIR, not all share transactions."],correct:1,slide:"Slide 07"},
{q:"Pre-trade transparency obligations require trading venues to make public on a continuous basis:",opts:["Only prices of transactions that have already been executed","Current bid and offer prices, depth of trading interests, and actionable indications of interest — free of charge 15 minutes after publication","Only transaction prices for regulated market equities","Aggregate trading volumes without individual order prices"],exps:["❌ Post-execution information describes post-trade transparency.","✅ Correct — venues must publish current bid/offer prices, depth of trading interests, and actionable indications of interest, free of charge 15 minutes after publication.","❌ Pre-trade transparency applies beyond equities.","❌ Individual order prices are required, not just aggregate volumes."],correct:1,slide:"Slide 07"},
{q:"Post-trade transparency for non-equity instruments under MiFIR requires publication:",opts:["Within 1 minute of execution","Within 15 minutes of execution (moving to 5 minutes under MiFIR reform)","Within 5 minutes of execution","Within 1 business day of execution"],exps:["❌ Within 1 minute applies to equity instruments, not non-equities.","✅ Correct — non-equity instruments must be published within 15 minutes of execution, moving to 5 minutes as MiFIR reforms develop.","❌ Within 5 minutes is the future target, not the current 15-minute requirement.","❌ Within 1 business day is far too long for post-trade transparency."],correct:1,slide:"Slide 07"},
{q:"The Consolidated Tape Provider (CTP) under MiFIR is best described as:",opts:["A real-time reporting mechanism for derivatives cleared through CCPs","A system aggregating post-trade data from all trading venues and APAs into a single consolidated feed","A platform for pre-trade transparency of order books across all EU venues","An approved reporting mechanism for transaction reporting to competent authorities"],exps:["❌ CCP reporting is handled under EMIR and SFTR.","✅ Correct — the CTP aggregates post-trade data from all trading venues and APAs into a single consolidated feed, disseminating it commercially while making a delayed version freely available.","❌ The CTP covers post-trade data, not pre-trade order books.","❌ Transaction reporting to competent authorities is handled by ARMs (Approved Reporting Mechanisms)."],correct:1,slide:"Slide 07"},
{q:"High-frequency trading (HFT) under MiFID II is defined by three objective elements. Which are they?",opts:["Artificial intelligence, machine learning, and automated execution","Low-latency infrastructure, fully automated execution, and high intraday message rate exceeding quantitative thresholds","Co-location, smart order routing, and market-making obligations","Flash-crash exposure, liquidity provision, and cross-venue arbitrage"],exps:["❌ AI and machine learning are not the three legal elements defining HFT.","✅ Correct — HFT is defined by: low-latency infrastructure (co-location, proximity), fully automated execution with no/limited human intervention, and high intraday message rate exceeding quantitative thresholds.","❌ Smart order routing is part of algorithmic trading generally; these do not define HFT.","❌ These describe potential effects or strategies, not the legal definition."],correct:1,slide:"Slide 07"},
{q:"Article 19 of Delegated Regulation 2017/565 sets the HFT quantitative threshold at:",opts:["1 message per second in a single instrument or 2 per second across all instruments on a venue","2 messages per second in a single instrument or 4 per second across all instruments on a given venue","10 messages per second in any instrument on a regulated market","5 messages per second exclusively for equity instruments"],exps:["❌ The threshold is 2/4, not 1/2.","✅ Correct — the threshold is an average of 2 messages per second in a single instrument or 4 messages per second across all instruments on a given venue.","❌ 10 messages per second is not the regulatory threshold.","❌ The threshold applies across instruments, not exclusively equities."],correct:1,slide:"Slide 07"},
{q:"Investment firms engaging in algorithmic trading under MiFID II must:",opts:["Cease all automated trading when market volatility exceeds 2%","Notify their competent authority, keep detailed logs for five years, and ensure algorithms do not disrupt fair and orderly trading","Obtain a separate MiFID II authorisation specifically for algorithmic trading","Submit all algorithms to ESMA for pre-approval before deployment"],exps:["❌ A 2% volatility threshold triggering cessation is not the MiFID II requirement.","✅ Correct — firms must notify their competent authority, keep detailed logs for five years, and ensure algorithms do not disrupt fair and orderly trading.","❌ Algorithmic trading is covered within the existing MiFID II authorisation.","❌ ESMA pre-approval of algorithms is not required."],correct:1,slide:"Slide 07"},
{q:"A Smart Order Router (SOR) that adjusts price, size, or timing is:",opts:["Expressly excluded from the definition of algorithmic trading","Itself an algorithmic trading application because it alters key order parameters","A type of systematic internaliser","Not subject to any MiFID II requirements because it only optimises execution"],exps:["❌ A SOR adjusting price, size, or timing IS algorithmic trading; only a pure venue-selector is excluded.","✅ Correct — a SOR that optimises execution by adjusting price, size, or timing is itself an algorithmic trading application under MiFID II.","❌ SIs are bilateral dealers; a SOR is an order routing tool.","❌ If it constitutes algorithmic trading, it is fully subject to MiFID II requirements."],correct:1,slide:"Slide 07"},
{q:"At the end of 2022, how many trading venues were registered in the EU, alongside how many systematic internalisers?",opts:["150 trading venues; 50 SIs","310 trading venues; 188 SIs","500 trading venues; 300 SIs","250 trading venues; 100 SIs"],exps:["❌ 150 trading venues and 50 SIs are not the figures cited.","✅ Correct — 310 trading venues were registered in the Union at the end of 2022, alongside 188 systematic internalisers.","❌ 500 trading venues and 300 SIs are not the figures cited.","❌ 250 trading venues and 100 SIs are not the figures cited."],correct:1,slide:"Slide 07"},
{q:"The Investment Services Directive (93/22/EEC) triggered which transformation in EU markets?",opts:["Introduction of OTFs for bond trading","Radical transformation of regulated markets — continental markets underwent gradual privatisation while the UK introduced forms of public control","Creation of the first fully harmonised framework for AT/HFT regulation","Establishment of the consolidated tape provider system"],exps:["❌ OTFs were introduced by MiFID II (2014).","✅ Correct — the ISD (1993) triggered radical transformation; continental Europe's 'public' model markets underwent gradual privatisation while the UK introduced forms of public control.","❌ AT/HFT regulation was introduced by MiFID II.","❌ The consolidated tape provider is a more recent MiFIR development."],correct:1,slide:"Slide 07"},
{q:"Trading venues using algorithmic market-makers must:",opts:["Prohibit algorithmic market-making due to systemic risks","Bind market-making firms by written agreement to maintain two-sided quotes during a significant portion of the trading day","Ensure algorithmic market-makers hold at least €750,000 in initial capital","Report all algorithmic market-making activity to ESMA weekly"],exps:["❌ Algorithmic market-making is permitted under MiFID II.","✅ Correct — where a firm conducts market-making through algorithms, the venue must bind it by written agreement to maintain two-sided quotes during a significant portion of the trading day.","❌ Capital requirements are set based on firm class under IFR.","❌ Weekly ESMA reporting of market-making activity is not required."],correct:1,slide:"Slide 07"},
{q:"The 'enter-display-match-publish-settle' sequence describes:",opts:["The lifecycle of a derivative contract from inception to maturity","How trading venues operate: from order routing through validation, display, matching, instant publication, and settlement","The MiFID II authorisation process for new investment firms","The four Lamfalussy levels applied to trading venue regulation"],exps:["❌ The lifecycle of a derivative contract is a different sequence.","✅ Correct — this sequence describes how trading venues operate: orders are routed, validated, displayed in the queue, matched by a matching engine, trade details published almost instantly, then cleared and settled.","❌ The authorisation process for investment firms is not described by this sequence.","❌ The Lamfalussy process has four levels (framework legislation, technical standards, harmonised application, enforcement)."],correct:1,slide:"Slide 07"},
{q:"The Derivatives Trading Obligation under MiFIR applies to:",opts:["All OTC derivatives contracts without exception","Specified classes of derivatives subject to EMIR central clearing mandate and assessed by ESMA as sufficiently liquid — requiring execution on RM, MTF, OTF, or equivalent third-country venue","Only interest rate derivatives denominated in euros","Only trades between EU-based financial counterparties"],exps:["❌ Not all OTC derivatives are subject to the trading obligation.","✅ Correct — the Derivatives Trading Obligation applies to derivatives subject to EMIR's clearing mandate and assessed by ESMA as sufficiently liquid.","❌ The DTO is not limited to euro-denominated interest rate derivatives.","❌ The DTO extends to transactions with a direct, substantial, and foreseeable effect within the Union."],correct:1,slide:"Slide 07"}
,
{q:"Under MiFID II, investment firms engaging in algorithmic trading must test each algorithm:",opts:["Once every five years as part of regulatory review", "Before first use and after any significant modification", "Only when the NCA specifically requests a review", "Only for HFT algorithms, not for standard algorithmic trading"],exps:["❌ Five-year reviews are not the requirement.", "✅ Correct — every algorithm must be tested before first use and after any significant modification.", "❌ Algorithmic testing is a firm obligation, not dependent on NCA requests.", "❌ Conformance testing applies to all algorithmic trading, not only HFT."],correct:1,slide:"Slide 07"},
{q:"NCAs may grant waivers from pre-trade transparency requirements for:",opts:["All trading by professional investors and eligible counterparties", "Large-scale orders, reference-price transactions, or illiquid instruments", "Any transaction where the client requests confidentiality", "Transactions executed by systematic internalisers in non-equity instruments"],exps:["❌ Professional investor status does not automatically qualify for a pre-trade transparency waiver.", "✅ Correct — NCAs may grant pre-trade transparency waivers for large-scale orders, reference-price transactions, or illiquid instruments.", "❌ Client confidentiality requests are not a basis for pre-trade transparency waivers.", "❌ SI transactions in non-equity instruments do not automatically qualify for waivers."],correct:1,slide:"Slide 07"},
{q:"The legal status of an RM vs an MTF differs in that:",opts:["An RM can trade only equities while an MTF can trade all instruments", "An RM receives formal official recognition as 'market operator' by a Member State; an MTF requires investment firm authorisation under MiFID II and is not granted this formal status", "An MTF faces more demanding governance requirements than an RM", "An OTF and MTF are legally identical except for the instruments they can trade"],exps:["❌ Both RMs and MTFs can trade all financial instruments.", "✅ Correct — RMs receive formal official recognition as 'market operator' by a Member State and must be notified to ESMA; MTFs operate under investment firm authorisation.", "❌ RMs face more demanding governance requirements than MTFs.", "❌ OTFs and MTFs differ significantly: OTFs allow operator discretion and are limited to non-equity instruments."],correct:1,slide:"Slide 07"},
{q:"MiFIR deferred post-trade publication is permitted where:",opts:["The counterparty is an eligible counterparty or professional client", "The transaction is large in scale, involves a package order, or meets other specified conditions", "All OTC transactions between financial counterparties", "Transactions executed after market hours"],exps:["❌ Counterparty classification alone does not trigger deferred publication.", "✅ Correct — MiFIR permits deferred publication where the transaction is large in scale, involves a package order, or meets other specified conditions.", "❌ Not all OTC transactions between financial counterparties qualify for deferred publication.", "❌ After-hours transactions are not automatically eligible for deferred publication."],correct:1,slide:"Slide 07"},
{q:"MiFID II requires trading venues using algorithmic market-makers to:",opts:["Permanently halt trading in any instrument that falls more than 5% in one day", "Deploy circuit breakers and kill-switches that can immediately halt trading or throttle disorderly flows when abnormal conditions are detected, preventing flash crashes", "Apply only during pre-opening auction periods", "Activate only upon instruction from the NCA"],exps:["❌ A 5% daily fall does not automatically trigger circuit breakers.", "✅ Correct — MiFID II requires venues to deploy mechanisms that can immediately halt trading or throttle disorderly flows when abnormal conditions are detected, preventing flash crashes.", "❌ Circuit breakers and kill-switches operate throughout the trading day.", "❌ Firms and venues must be able to activate these independently."],correct:1,slide:"Slide 07"}
,
{q:"An SME Growth Market is best described as:",opts:["A regulated market in which at least 50% of the market capitalisation is made up of traded shares of small and medium-sized enterprises", "An MTF in which at least 50% of the market capitalisation is made up of traded shares of small and medium-sized enterprises", "A market on which only SMEs with high growth potential are listed", "An OTF specifically designed for SME bond issuance without prospectus requirements"],exps:["❌ An SME Growth Market is an MTF, not a regulated market. RMs and MTFs are distinct under MiFID II, and SME Growth Markets can only be designated as MTFs.", "✅ Correct — an SME Growth Market is an MTF in which at least 50% of the market capitalisation is made up of traded shares of small and medium-sized enterprises (companies with average market cap below EUR 200 million over the previous three years).", "❌ SME Growth Markets do not restrict listing to only high-growth-potential SMEs; the criterion is market capitalisation below EUR 200 million.", "❌ SME Growth Markets are not OTFs; they are a specific category of MTF under MiFID II."],correct:1,slide:"Slide 07"}
,
{q:"Under MiFID II, systematic internalisers:",opts:["Shall operate within a trading venue", "In order to operate as such, must be authorised to provide investment advice", "Are required to be authorised as systematic internalisers by competent authorities", "None of the other options is correct"],exps:["❌ Systematic internalisers execute orders outside trading venues — they are bilateral dealers, not trading venues themselves.", "❌ Systematic internaliser status does not require authorisation to provide investment advice; it requires authorisation as an investment firm for dealing on own account.", "❌ There is no separate authorisation as 'systematic internaliser' — firms must notify their home NCA when they meet the quantitative thresholds, but it is not a separate authorisation.", "✅ Correct — none of the other options is correct: SIs do not operate within trading venues; they do not need separate authorisation to provide investment advice; and there is no separate SI authorisation requirement (only notification when thresholds are met)."],correct:3,slide:"Slide 07"}
,
{q:"Which of the following statements is true with respect to emission allowances?",opts:["Emission allowances are not caught by MiFID II", "Emission allowances are not caught by MAR", "Emission allowances are caught by both MAR and MiFID II", "Emission allowances are not financial instruments"],exps:["❌ Emission allowances ARE caught by MiFID II — they are listed in Section C of Annex I as financial instruments.", "❌ Emission allowances ARE caught by MAR — the Market Abuse Regulation applies to financial instruments listed under MiFID II, including emission allowances.", "✅ Correct — emission allowances are caught by both MAR and MiFID II: they are listed as financial instruments in Section C(11) of Annex I to MiFID II, and therefore subject to MAR's market abuse prohibitions and disclosure obligations.", "❌ Emission allowances ARE financial instruments under MiFID II Section C(11)."],correct:2,slide:"Slide 07"}
,
{q:"With reference to trading venues under MiFID II:",opts:["OTFs are based on discretionary rules in some circumstances, while MTFs are always based on non-discretionary rules", "MTFs are always based on non-discretionary rules, while regulated markets are based on discretionary rules in some circumstances", "OTFs are always based on non-discretionary rules, while MTFs are based on discretionary rules in some circumstances", "Regulated markets are always based on non-discretionary rules, while MTFs are based on discretionary rules in some circumstances"],exps:["✅ Correct — OTFs may exercise discretion in some circumstances (subject to conduct constraints), while MTFs must always operate under non-discretionary rules. Regulated markets must also always use non-discretionary rules.", "❌ Regulated markets must use non-discretionary rules — they are not based on discretionary rules in any circumstances.", "❌ This reverses the correct position: OTFs may use discretion; MTFs always use non-discretionary rules.", "❌ MTFs use non-discretionary rules, not discretionary rules in some circumstances."],correct:0,slide:"Slide 07"}
,
{q:"What is the main difference between a regulated market and a multilateral trading facility?",opts:["Admission to trading on a regulated market involves the application of protective measures such as the duty to publish a prospectus and the rules on major shareholding disclosure, while that is not the case with multilateral trading facilities", "A multilateral trading facility is used exclusively by institutional investors, while a regulated market ensures more liquidity and is open to retail investors", "Regulated markets can admit to trading any financial instruments, while multilateral trading facilities are only active on equity and equity-like securities", "A regulated market requires all trades to be executed through a central securities depository (CSD), while a multilateral trading facility does not"],exps:["✅ Correct — admission to a regulated market triggers protective measures such as the duty to publish a prospectus (Prospectus Regulation) and major shareholding disclosure obligations (Transparency Directive), while these do not automatically apply to instruments admitted to MTFs.", "❌ MTFs are not used exclusively by institutional investors, and there is no distinction in retail vs institutional access between RMs and MTFs.", "❌ Both regulated markets and MTFs can admit to trading a wide range of financial instruments, not only equities.", "❌ There is no requirement that all trades on a regulated market be executed through a CSD."],correct:0,slide:"Slide 07"}
,
{q:"Which of the following is a defining feature that distinguishes an OTF from a Regulated Market and MTF?",opts:["OTFs may operate only in equities","OTFs are exclusively operated by national stock exchanges","The operator of an OTF may exercise discretion when executing transactions in non-equity instruments","OTFs are subject to lighter transparency obligations than RMs and MTFs"],exps:["❌ OTFs are exclusively for non-equity instruments; they cannot operate in equities.","❌ OTFs may be operated by any investment firm, not exclusively by national exchanges.","✅ Correct — the defining feature of OTFs compared to RMs and MTFs is that the operator may exercise discretion in order execution (subject to conduct constraints), whereas RMs and MTFs must apply non-discretionary rules.","❌ OTFs are subject to a hybrid regulatory burden combining venue and conduct rules, not lighter obligations."],correct:2,slide:"Slide 07"},
{q:"How many trading venues were registered in the EU at the end of 2022, according to the slides?",opts:["50","188","310","450"],exps:["❌ 50 significantly understates the fragmented EU trading venue landscape.","❌ 188 was the number of systematic internalisers, not trading venues.","✅ Correct — 310 trading venues were registered in the Union at the end of 2022, alongside 188 systematic internalisers.","❌ 450 overstates the number of registered venues."],correct:2,slide:"Slide 07"},
{q:"The Share Trading Obligation under MiFIR requires that:",opts:["All shares must be traded on regulated markets only, excluding MTFs","Investment firms must execute transactions in shares admitted to EU regulated markets only on RMs, MTFs, SIs, or equivalent third-country venues","Investment firms may execute share transactions internally as long as they report them to trade repositories","Shares listed on EU regulated markets must also be listed on an SME Growth Market"],exps:["❌ The STO also permits execution on MTFs and SIs, not just regulated markets.","✅ Correct — under the Share Trading Obligation, transactions in shares admitted to EU regulated markets must be executed on RMs, MTFs, SIs, or equivalent third-country venues; internal crossing outside authorised venues is prohibited.","❌ Internal crossing outside authorised venues is precisely what the STO prohibits.","❌ The STO concerns execution venues, not listing requirements."],correct:1,slide:"Slide 07"},
{q:"The Derivatives Trading Obligation under MiFIR applies to which category of derivatives?",opts:["All OTC derivatives without exception","Only physically settled commodity derivatives","Derivatives subject to the EMIR clearing mandate assessed by ESMA as sufficiently liquid","All exchange-traded derivatives"],exps:["❌ Not all OTC derivatives are subject to the DTO — only specific liquid standardised classes.","❌ Commodity derivatives are not necessarily subject to the DTO.","✅ Correct — the DTO applies to derivatives subject to the EMIR clearing mandate that ESMA has assessed as sufficiently liquid, requiring execution on RMs, MTFs, OTFs, or equivalent third-country venues.","❌ Exchange-traded derivatives are already traded on venues; the DTO targets OTC derivatives requiring venue-channelling."],correct:2,slide:"Slide 07"},
{q:"Under MiFID II, a Smart Order Router (SOR) is treated differently from an Automated Order Router (AOR) in that:",opts:["SORs require no regulatory notification; AORs always require full MiFID authorisation","A SOR that adjusts price, size, or timing to optimise execution is itself an algorithmic trading application; an AOR that merely selects the venue without altering order parameters is not","Both are classified as HFT tools requiring circuit breakers","AORs are prohibited under MiFID II; only SORs are permissible"],exps:["❌ Both SORs and AORs may trigger regulatory requirements depending on their function.","✅ Correct — a SOR optimising execution by adjusting price, size, or timing qualifies as algorithmic trading; an AOR that only selects the venue while leaving all other parameters unchanged does not amount to algorithmic trading.","❌ The distinction concerns whether the system constitutes algorithmic trading, not HFT classification.","❌ AORs are not prohibited; they simply do not constitute algorithmic trading."],correct:1,slide:"Slide 07"},
{q:"HFT under Article 4(1)(40) MiFID II is distinguished by three objective elements. Which of the following is NOT one of them?",opts:["Low-latency infrastructure using co-location or proximity services","Fully automated initiation, generation, routing or execution of orders","High intraday message rate exceeding certain quantitative thresholds","Minimum transaction value exceeding €1 million per trade"],exps:["❌ Low-latency infrastructure is one of the three defining elements of HFT.","❌ Fully automated execution is one of the three defining elements.","❌ High message rate is one of the three defining elements.","✅ Correct — HFT is not defined by minimum transaction value. The three elements are: low-latency infrastructure, fully automated execution, and high intraday message rate."],correct:3,slide:"Slide 07"},
{q:"For registration as an SME Growth Market under MiFID II, what minimum percentage of issuers on the market must be SMEs?",opts:["25%","33%","50%","75%"],exps:["❌ 25% is too low; the threshold ensures the market genuinely caters to SMEs.","❌ 33% is not the correct threshold.","✅ Correct — at least 50% of issuers on an SME Growth Market must be SMEs (companies with average market capitalisation below €200 million over the previous three years).","❌ 75% is too high; the actual requirement is 50%."],correct:2,slide:"Slide 07"},
{q:"Under MiFIR post-trade transparency rules, within what time frame must equity instrument transactions be published?",opts:["Immediately, with no delay permitted","Within one minute of execution","Within fifteen minutes of execution","Within one business day of execution"],exps:["❌ 'As close to real time as technically possible' means within one minute for equities, not instantaneous.","✅ Correct — MiFIR requires post-trade publication within one minute of execution for equity instruments. For non-equities, the standard is fifteen minutes (moving to five minutes).","❌ Fifteen minutes applies to non-equity instruments, not equities.","❌ One business day would undermine real-time price transparency; it is not the standard."],correct:1,slide:"Slide 07"},
{q:"An Approved Reporting Mechanism (ARM) under MiFIR has which specific function?",opts:["Publishing real-time post-trade data from all trading venues to the public","Aggregating post-trade data into a single consolidated feed","Transmitting investment firms' transaction reports to competent authorities","Managing settlement of financial instruments on behalf of trading venues"],exps:["❌ Publishing real-time post-trade data describes an APA (Approved Publication Arrangement).","❌ Aggregating data into a single consolidated feed describes a CTP (Consolidated Tape Provider).","✅ Correct — an ARM acts as the licensed conduit through which investment firms transmit transaction reports to competent authorities, ensuring timely submission, data accuracy, and confidentiality.","❌ Settlement management is a CSD function, not an ARM function."],correct:2,slide:"Slide 07"},
{q:"The quantitative HFT threshold under Delegated Regulation 2017/565 is set at:",opts:["10 messages per second across all instruments","2 messages per second in a single instrument or 4 messages per second across all instruments on a venue","1,000 orders per day in any single instrument","500 cancellations per trading session"],exps:["❌ 10 messages per second is above the actual threshold.","✅ Correct — the HFT threshold is 2 messages per second in a single instrument or 4 messages per second across all instruments on a given venue. Exceeding this triggers automatic HFT classification.","❌ 1,000 orders per day does not reflect the actual quantitative threshold.","❌ 500 cancellations is not the basis for HFT classification."],correct:1,slide:"Slide 07"},
{q:"The core regulatory objectives of EU trading venue regulation under MiFID II are:",opts:["Maximising trading volume and minimising transaction costs for institutional investors","Investor protection and market integrity through uniform transparency rules, and single market integration through a level playing field eliminating rule shopping","Ensuring national stock exchanges maintain dominant market positions","Restricting algorithmic trading to protect human market makers"],exps:["❌ While efficiency matters, the stated objectives concern investor protection and market integration, not solely volume or cost.","✅ Correct — trading venue regulation pursues two core objectives: (1) investor protection and market integrity through uniform transparency and order handling rules; and (2) single market integration through a level playing field that prevents rule shopping between venues.","❌ MiFID II promotes competition among venues, including new entrants — not national exchange dominance.","❌ MiFID II regulates algorithmic trading but does not restrict it to protect human market makers."],correct:1,slide:"Slide 07"},
{q:"Which of the following transactions is explicitly listed as potentially exempt from the MiFIR trading obligations?",opts:["All transactions between two financial counterparties above clearing thresholds","Intraday crossings within a firm, primary market issuance transactions, and non-standardised bilateral OTC trades meeting specific criteria","All derivatives transactions between EU and non-EU counterparties","Transactions on SME Growth Markets regardless of instrument type"],exps:["❌ FC-to-FC transactions are generally subject to the trading obligations, not exempt.","✅ Correct — MiFIR trading obligation exemptions include: intraday crossings within firms or crossing networks (under conditions), primary market issuance transactions, certain OTC trades, third-country venue trades (subject to equivalence), and non-standardised bilateral negotiated trades.","❌ The third-country exemption is specific and subject to equivalence decisions, not a blanket exemption for all cross-border trades.","❌ SME Growth Market transactions are not categorically exempt from trading obligations."],correct:1,slide:"Slide 07"},
{q:"Strategies such as spoofing, layering, and quote stuffing in algorithmic trading fall under the prohibitions of which regulation?",opts:["MiFID II's algorithmic trading rules exclusively","The Market Abuse Regulation (MAR) prohibition on market manipulation","EMIR's clearing and reporting obligations","The Prospectus Regulation's disclosure requirements"],exps:["❌ MiFID II governs the operational requirements for algorithmic trading; the manipulation prohibition itself comes from MAR.","✅ Correct — spoofing, layering, and quote stuffing are forms of market manipulation prohibited under MAR's Article 12, which forms part of MiFID II's multi-layer safety net for algorithmic trading alongside firm-level risk management and venue safeguards.","❌ EMIR governs derivatives clearing and post-trade infrastructure, not market manipulation.","❌ The Prospectus Regulation governs disclosure for securities offerings, not trading manipulation."],correct:1,slide:"Slide 07"},
{q:"Which statement best describes the current state of EU trading venue regulation following MiFID II?",opts:["There has been a major disorderly episode caused by regulatory gaps in the AT/HFT regime since MiFID II entered into force","Since MiFID II there has been no major disorderly episode attributable to regulatory gaps in the AT/HFT regime, but increasingly sophisticated self-learning algorithms may require future updates","The multi-layer safety net has proven ineffective, leading to proposals to ban HFT entirely","MiFID II succeeded in reducing EU venue competitiveness compared to US and Asian markets"],exps:["❌ No major disorderly episode attributable to AT/HFT regulatory gaps has occurred since MiFID II entered into force.","✅ Correct — since MiFID II, no major disorderly episode has been attributed to AT/HFT regulatory gaps; however, the increasing sophistication of self-learning algorithms will inevitably raise new issues requiring updates to existing rules.","❌ No proposals to ban HFT have been made; the regime focuses on disciplining it, not banning it.","❌ Empirical studies suggest European venues have retained their competitive appeal under MiFID II."],correct:1,slide:"Slide 07"}],
"08 — Collective Investment Undertakings":[
{q:"Collective investment undertakings (CIUs) are best described as:",opts:["Investment firms that trade on their own account in financial markets","Financial vehicles that pool capital from multiple investors to allocate it collectively, with gains and losses shared proportionally","Insurance products with an investment component exposed to market fluctuations","Special purpose vehicles used for securitisation transactions"],exps:["❌ Investment firms trading on own account are not CIUs.","✅ Correct — CIUs pool capital from multiple investors to allocate it collectively, with gains and losses shared proportionally.","❌ Insurance products with investment components describe IBIPs/PRIIPs.","❌ SPVs are used in securitisation."],correct:1,slide:"Slide 08"},
{q:"The three-pillar structure of a CIU consists of:",opts:["Management company, regulator, and investors","The undertaking (pool of assets), the management company, and the depositary","Custodian bank, administrator, and distribution agent","UCITS, AIFM, and national competent authority"],exps:["❌ The regulator is not one of the three structural pillars.","✅ Correct — the three pillars are: the undertaking (pool of assets), the management company (investment management), and the depositary (custodian and oversight).","❌ Distribution agent is not one of the three structural pillars.","❌ UCITS and AIFM refer to regulatory regimes, not structural pillars."],correct:1,slide:"Slide 08"},
{q:"The UCITS Directive is best described as:",opts:["Manager-focused regulation covering alternative funds including hedge funds, private equity, and real estate","Product-focused regulation establishing a harmonised regime for open-ended retail funds — one of the EU's most successful financial law regimes, latest iteration being UCITS V (2014/91/EU)","A Regulation directly applicable without national implementing measures","A Directive covering all types of investment funds without restriction on eligible assets"],exps:["❌ Manager-focused regulation covering alternative funds describes the AIFMD.","✅ Correct — UCITS is product-focused, establishing a harmonised regime for open-ended retail funds.","❌ UCITS is a Directive, not a Regulation.","❌ UCITS is specifically restricted to open-ended retail funds with strict eligibility criteria."],correct:1,slide:"Slide 08"},
{q:"A UCITS must offer unitholders the right to have units repurchased or redeemed at minimum:",opts:["Once per year","Once per month","At least twice monthly (usually daily in practice)","At least twice per week"],exps:["❌ Once per year does not meet the UCITS minimum.","❌ Once per month does not meet the UCITS minimum.","✅ Correct — UCITS must be open-ended, offering unit redemption at least twice monthly.","❌ Twice per week is not the minimum; twice monthly is the legal requirement."],correct:2,slide:"Slide 08"},
{q:"The UCITS 5/10/40 rule means:",opts:["Maximum 5% in derivatives, 10% in illiquid assets, and 40% in a single country","Maximum 5% in securities from one issuer (raisable to 10%), but aggregate exposure above 5% cannot exceed 40% of total assets","Minimum 5% cash, maximum 10% in emerging markets, 40% in government bonds","5% equity, 10% bonds, 40% money market instruments minimum"],exps:["❌ This is not what the 5/10/40 rule means.","✅ Correct — maximum 5% in securities from one issuer (raisable to 10%), but aggregate exposure above 5% cannot exceed 40% of total assets.","❌ The 5/10/40 rule concerns issuer concentration, not asset classes or geography.","❌ The 5/10/40 rule concerns issuer concentration limits."],correct:1,slide:"Slide 08"},
{q:"Under the feeder-master UCITS model, a feeder UCITS may invest at least what percentage in a single master UCITS?",opts:["55%","70%","85%","100%"],exps:["❌ 55% is the ELTIF minimum in eligible investment assets.","❌ 70% is the EuSEF and EuVECA requirement.","✅ Correct — a feeder UCITS may invest at least 85% of its assets in a single master UCITS.","❌ 100% is not required; 85% minimum is specified."],correct:2,slide:"Slide 08"},
{q:"Under UCITS V, the depositary's liability for loss of financial instruments held in custody is:",opts:["No liability unless gross negligence is proven","Strict liability, save for events beyond reasonable control","Proportionate liability based on the percentage of assets affected","Limited to €1 million per incident regardless of actual loss"],exps:["❌ Strict liability is the UCITS V standard, not gross negligence.","✅ Correct — under UCITS V, depositaries are strictly liable for loss of financial instruments held in custody, save for events beyond reasonable control.","❌ Proportionate liability is not the UCITS V standard.","❌ There is no €1 million cap; strict liability applies."],correct:1,slide:"Slide 08"},
{q:"The AIFMD (Directive 2011/61/EU) defines an AIF as:",opts:["Any fund that invests in alternative assets such as commodities, real estate, or infrastructure","Residually — essentially any collective investment undertaking that is not a UCITS, ensuring broad coverage across hedge funds, private equity, real estate, and infrastructure","Any fund marketed exclusively to professional investors and eligible counterparties","Any fund that uses leverage or short-selling strategies"],exps:["❌ The AIFMD definition is based on what the fund is not (not a UCITS), not on asset types.","✅ Correct — an AIF is defined residually as essentially any CIU that is not a UCITS, ensuring broad coverage.","❌ The definition is not based on investor type.","❌ Leverage and short-selling are not part of the AIF definition."],correct:1,slide:"Slide 08"},
{q:"ESMA's Guidelines (ESMA 2013/600) on CIU identification require three essential characteristics. Which are they?",opts:["Regulated status, professional management, and EU domicile","Financial purpose (not general commercial/industrial), pooled capital, and no day-to-day control by unitholders or shareholders","Open-ended structure, diversified portfolio, and independent depositary","Listed securities, minimum €10 million in assets, and UCITS-eligible instruments"],exps:["❌ Regulated status and EU domicile are not the three ESMA characteristics.","✅ Correct — ESMA's Guidelines identify: financial purpose (not a general commercial or industrial purpose), pooled capital, and no day-to-day control by unitholders/shareholders over the undertaking's assets.","❌ Open-ended structure and diversified portfolio are UCITS characteristics, not universal CIU characteristics.","❌ Listed securities and minimum asset size are not the three ESMA characteristics."],correct:1,slide:"Slide 08"},
{q:"Under AIFMD II (2024), the new loan origination regime sets leverage caps at:",opts:["100% for open-ended AIFs and 200% for closed-ended funds","175% for open-ended AIFs and 300% for closed-ended funds","250% for open-ended AIFs and 500% for closed-ended funds","No specific leverage limit for loan origination funds"],exps:["❌ 100%/200% are not the AIFMD II leverage caps.","✅ Correct — AIFMD II sets leverage caps of 175% for open-ended AIFs and 300% for closed-ended funds for loan origination activities.","❌ 250%/500% are not the AIFMD II leverage caps.","❌ AIFMD II explicitly sets leverage caps."],correct:1,slide:"Slide 08"},
{q:"AIFMD II requires all open-ended AIFs to:",opts:["Convert to closed-ended structures to better manage redemption risk","Select at least two liquidity management tools from a prescribed list — ESMA may require activation/deactivation to safeguard investor protection or financial stability","Obtain credit ratings from EU-registered credit rating agencies","Appoint ESMA as their depositary"],exps:["❌ AIFMD II requires liquidity management tools, not conversion to closed-ended structures.","✅ Correct — AIFMD II requires all open-ended AIFs to select at least two liquidity management tools from a prescribed list.","❌ Credit ratings from CRAs are not required by AIFMD II.","❌ ESMA cannot serve as depositary."],correct:1,slide:"Slide 08"},
{q:"The EuSEF label requires at least what percentage of capital in qualifying social investments?",opts:["51%","60%","70%","85%"],exps:["❌ 51% is not the EuSEF threshold.","❌ 60% is not the EuSEF threshold.","✅ Correct — EuSEF requires at least 70% of aggregate capital and uncalled commitments to be invested in qualifying social enterprises.","❌ 85% is the feeder UCITS threshold, not EuSEF."],correct:2,slide:"Slide 08"},
{q:"The ELTIF 2.0 (Regulation EU 2023/606, applicable from January 2024) introduced which important change for retail investors?",opts:["Removed retail investor access entirely","Allowed limited early redemptions under specified conditions ('semi-closed' structure) — previously no early redemptions were permitted","Required all ELTIFs to adopt a fully closed-ended structure","Reduced the minimum investment in eligible assets from 70% to 55%"],exps:["❌ ELTIF 2.0 maintained and enhanced retail access.","✅ Correct — ELTIF 2.0 introduced limited early redemptions under specified conditions, creating a 'semi-closed' structure.","❌ ELTIF 2.0 moved from fully closed to semi-closed.","❌ The minimum investment in eligible assets is 55% as set by ELTIF 2.0 — a specified threshold, not a reduction."],correct:1,slide:"Slide 08"},
{q:"Money Market Funds (MMFs) are best described as:",opts:["Hedge funds investing in government bonds to generate absolute returns","Collective investment undertakings investing in short-term financial assets, aiming to provide returns aligned with money market rates or preserve investment value","Long-term infrastructure funds accessible to retail investors","Structured products using leverage to amplify returns on money market instruments"],exps:["❌ Hedge funds and absolute returns do not describe MMFs.","✅ Correct — MMFs invest in short-term financial assets, aiming to provide returns aligned with money market rates and/or preserve investment value.","❌ Long-term infrastructure funds describe ELTIFs.","❌ MMFs do not use leverage to amplify returns; they are conservative vehicles."],correct:1,slide:"Slide 08"},
{q:"MMF sponsor support is prohibited because:",opts:["EU law prohibits any third-party guarantees for investment vehicles","Sponsor support creates moral hazard and undermines fund resilience based on own financial resources","Only registered deposit guarantee schemes can provide support to MMFs","Sponsor support would violate UCITS diversification requirements"],exps:["❌ EU law does not generally prohibit third-party guarantees for all investment vehicles.","✅ Correct — MMFs cannot receive direct or indirect assistance from third parties aimed at guaranteeing liquidity or stabilizing NAV; this reduces moral hazard and ensures resilience based on own resources.","❌ There is no requirement that only deposit guarantee schemes can provide MMF support.","❌ MMF prohibitions stem from the MMF Regulation, not UCITS diversification rules."],correct:1,slide:"Slide 08"},
{q:"The AIFMD full-scope passport system provides AIFMs with which two passports?",opts:["An issuance passport and a marketing passport","A management passport (cross-border management of EU AIFs) and a marketing passport (distribution to professional investors across the Union)","A retail passport and a professional investor passport","A domestic passport and a third-country passport"],exps:["❌ An 'issuance passport' is not part of the AIFMD system.","✅ Correct — full-scope AIFMs have two passports: management (cross-border management of EU AIFs) and marketing (distribution to professional investors across the Union).","❌ The AIFMD does not have separate retail and professional investor passports.","❌ Domestic and third-country passports are not the AIFMD distinction."],correct:1,slide:"Slide 08"},
{q:"Holding companies are excluded from AIFMD scope because:",opts:["They are already regulated under the Prospectus Regulation","Their main purpose is generally not financial investment characterised by a defined investment policy aimed at generating pooled returns — they acquire stakes in subsidiaries for strategic business purposes","They are too small to pose systemic risk","All holding companies are classified as AIFMs by default"],exps:["❌ Holding companies are not excluded because of Prospectus Regulation regulation.","✅ Correct — holding companies are excluded because their main purpose is generally not financial investment with a defined investment policy; they acquire stakes in subsidiaries to carry out a business strategy.","❌ Size is not the reason for the exclusion.","❌ Holding companies are explicitly excluded from AIFMD, not included as AIFMs."],correct:1,slide:"Slide 08"},
{q:"The pre-marketing regime under CBFD establishes which important rule?",opts:["Pre-marketing can only be conducted in one Member State at a time","Subscriptions within 18 months of pre-marketing start are deemed to result from marketing, requiring full notification procedures","Pre-marketing is limited to professional investors with at least €500,000 minimum commitment","No draft documents of any kind may be shared during pre-marketing"],exps:["❌ Pre-marketing can be conducted in multiple Member States simultaneously.","✅ Correct — subscriptions within 18 months of pre-marketing start are deemed to result from marketing, requiring full notification procedures.","❌ There is no €500,000 minimum commitment for pre-marketing.","❌ Draft prospectuses may be circulated if clearly marked as incomplete and not constituting an offer."],correct:1,slide:"Slide 08"},
{q:"The Money Market Funds Regulation overlays which existing frameworks?",opts:["It replaces UCITS and AIFMD for money market funds","It overlays UCITS/AIFMD requirements, providing additional rules specific to MMF risk profiles — including portfolio composition, maturity, liquidity, and stress testing","It is a standalone framework replacing all other EU fund regulation for MMFs","It applies only to public debt CNAV MMFs and not to other MMF types"],exps:["❌ The MMF Regulation overlays, not replaces, UCITS and AIFMD.","✅ Correct — the MMF Regulation overlays UCITS/AIFMD requirements with additional rules for portfolio composition, maturity, liquidity, and stress testing to prevent systemic risk.","❌ The MMF Regulation is a supplement to, not replacement of, existing frameworks.","❌ The MMF Regulation applies to all three MMF types (VNAV, Public Debt CNAV, and LVNAV)."],correct:1,slide:"Slide 08"}
,
{q:"The AIFMD's 'defined investment policy' — the most critical CIU classification element — must be:",opts:["Set in the fund's name and website description", "Established when the investor's commitment becomes binding, stable over time, legally binding and enforceable — determined by investment techniques and objectives, not just asset type", "Approved by the national competent authority before investors can commit", "Published in the Official Journal of the EU"],exps:["❌ The fund name and website description are insufficient.", "✅ Correct — the defined investment policy must be: (a) established when the investor's commitment becomes binding; (b) stable over time; (c) legally binding and enforceable. It is determined by investment techniques and objectives, not merely asset type.", "❌ NCA approval of the investment policy is not required to satisfy this element.", "❌ Publication in the Official Journal is not required."],correct:1,slide:"Slide 08"},
{q:"Eligible UCITS depositaries are limited to:",opts:["Any regulated financial institution established in any jurisdiction", "National central banks, credit institutions, or investment firms meeting specific organisational and prudential criteria", "Only the central bank of the Member State where the UCITS is domiciled", "Any entity holding ISO 27001 certification for asset safekeeping"],exps:["❌ UCITS depositaries must be from a specified list of eligible entities.", "✅ Correct — eligible UCITS depositaries are: national central banks, credit institutions, or investment firms meeting specific organisational and prudential criteria.", "❌ Any national central bank may act, not only the one in the UCITS home Member State.", "❌ ISO certification is not a UCITS depositary requirement."],correct:1,slide:"Slide 08"},
{q:"The EuVECA qualifying portfolio undertaking must:",opts:["Be listed on a regulated market with market cap below €200M at the time of investment", "Not be an AIF, have fewer than 500 employees, be an SME with average market cap under €200M, and NOT be listed at the time of first investment", "Be registered in a Member State with a favourable tax regime for venture capital", "Have received at least one round of institutional funding before EuVECA investment"],exps:["❌ A qualifying portfolio undertaking must NOT be listed at the time of first investment.", "✅ Correct — a qualifying EuVECA portfolio undertaking must: not be an AIF; have fewer than 500 employees; be an SME with average market cap under €200M; and not be listed at time of first investment.", "❌ Tax regime is not a qualifying criterion.", "❌ Prior institutional funding is not a qualifying criterion."],correct:1,slide:"Slide 08"},
{q:"Under the AIFMD, delegation of portfolio and risk management may only be to:",opts:["Any entity chosen by the AIFM regardless of supervision status", "Authorised and supervised entities, or third-country delegates where cooperation agreements exist — the AIFM retains full responsibility and must continuously monitor delegate performance", "The UCITS management company affiliated with the AIFM group", "Any entity approved by the NCA of the AIFM"],exps:["❌ Delegation is restricted to authorised and supervised entities or qualifying third-country delegates.", "✅ Correct — portfolio and risk management may only be delegated to authorised and supervised entities, or third-country delegates where cooperation agreements exist; the AIFM retains full responsibility and must continuously monitor.", "❌ An affiliated UCITS management company is not automatically a qualifying delegate.", "❌ NCA approval alone is not sufficient; the delegate must be authorised and supervised."],correct:1,slide:"Slide 08"},
{q:"The ELTIF minimum investment in eligible investment assets is:",opts:["70% of capital", "55% of capital within a defined period (maximum 5 years or half the ELTIF's lifetime)", "85% of capital", "100% of capital"],exps:["❌ 70% is the EuSEF and EuVECA minimum qualifying investment threshold.", "✅ Correct — ELTIFs must invest at least 55% of capital in eligible investment assets within a defined period.", "❌ 85% is the feeder UCITS in master UCITS threshold.", "❌ 100% is not the ELTIF requirement."],correct:1,slide:"Slide 08"},
{q:"MMF investor concentration monitoring requires MMF managers to:",opts:["Limit any single investor to no more than 10% of fund total assets", "Adopt procedures for monitoring investor concentration and redemption behaviour — including data on investor type, holdings, inflows/outflows, and patterns in cash needs or risk aversion", "Obtain NCA approval before accepting any single investor representing more than 5% of the fund", "Publish the identity of all investors holding more than 1% of fund assets"],exps:["❌ A 10% per-investor cap is not the mechanism; monitoring and procedures are required.", "✅ Correct — MMF managers must adopt procedures for monitoring investor concentration and redemption behaviour, including data on investor type, holdings, inflows/outflows, and patterns in cash needs or risk aversion.", "❌ NCA approval is not required before accepting large investors.", "❌ Publishing the identity of investors is not required."],correct:1,slide:"Slide 08"}
,
{q:"What differentiates the investment made by a fund subscriber from that made by a client who benefits from individual portfolio management services?",opts:["The amount of yield received, which is always higher in individual portfolio management", "Fund subscribers cannot exert any influence over the management of the fund's assets, while clients of individual portfolio managers can", "The higher fees in the case of funds compared with individual portfolio management", "Fund subscribers always receive guaranteed capital protection, while individual portfolio management clients do not"],exps:["❌ Individual portfolio management does not always generate higher yields than fund investments; performance depends on strategy and market conditions.", "✅ Correct — the key distinction is that fund subscribers (as part of a collective pool) have no day-to-day control or influence over the management of the fund's assets, while clients of individual portfolio management services have a bilateral relationship with the manager who acts on their behalf with discretionary authority over their individual portfolio.", "❌ Fee structures vary; it is not generally true that fund fees are always higher than individual portfolio management fees.", "❌ Neither fund subscriptions nor individual portfolio management guarantee capital protection; both involve investment risk."],correct:1,slide:"Slide 08"}
,
