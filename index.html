{q:"EIOPA's role under the PRIIPs Regulation includes:",opts:["Preparing and distributing KIDs to retail investors directly","Monitoring insurance-based PRIIPs and having the power to temporarily prohibit or restrict their marketing, distribution, or sale","Approving all PRIIPs before they can be offered to retail investors","Standardising the KID format for all PRIIP types independently"],exps:["❌ EIOPA does not prepare or distribute KIDs to retail investors.","✅ Correct — EIOPA monitors insurance-based PRIIPs marketed in the Union and can temporarily prohibit or restrict marketing, distribution, or sale of certain PRIIPs or financial activities.","❌ NCAs approve individual products where relevant; EIOPA does not approve all PRIIPs.","❌ The KID RTS are developed jointly through the Joint Committee of ESAs."],correct:1,slide:"Slide 14"},
{q:"Product intervention by EIOPA or national authorities is best described as:",opts:["The primary regulatory tool used routinely for all PRIIPs","A measure of last resort, subject to conditions of residuality, proportionality, publication, and advance notice of at least one month to EIOPA and other authorities (except urgency)","A voluntary tool that authorities use at their discretion without conditions","A tool exclusively available to ESMA for equity-linked PRIIPs"],exps:["❌ Product intervention is a last resort, not a routine tool.","✅ Correct — product intervention is a last resort only when other measures are insufficient; it must be proportionate, published on the authority's website, and notified at least one month in advance (except urgency).","❌ Specific conditions apply; product intervention is not purely discretionary.","❌ ESMA has product intervention powers for MiFID II products; EIOPA has them for insurance-based PRIIPs."],correct:1,slide:"Slide 14"},
{q:"The distinction between 'manufacturers' and 'distributors' of PRIIPs is important because:",opts:["Only manufacturers are subject to any obligations under the PRIIPs Regulation","Manufacturers prepare and publish the KID; distributors must provide it to retail investors in a timely manner before they are bound by any contract — the same entity can be both manufacturer and distributor","Distributors prepare the KID; manufacturers only review it","Only distributors face civil liability for KID content"],exps:["❌ Both manufacturers and distributors have obligations.","✅ Correct — manufacturers prepare and publish the KID; distributors provide it before the client is bound by any contract; the same entity can be both manufacturer and distributor.","❌ Manufacturers, not distributors, prepare the KID.","❌ Primary civil liability for KID content rests with the manufacturer."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation applies to which category of investors?",opts:["All investors including professional clients and eligible counterparties","Retail investors as defined under MiFID II or the Insurance Distribution Directive — the PRIIPs regime does not apply to professional clients","Only investors below a certain asset threshold","Only investors who lack relevant investment experience"],exps:["❌ The PRIIPs Regulation is specifically for retail investors.","✅ Correct — the KID is delivered only when a PRIIP is marketed to 'retail investors' as defined under MiFID II or the IDD; the PRIIPs regime does not apply to professional clients.","❌ There is no specific asset threshold in the PRIIPs Regulation.","❌ The definition refers to MiFID II retail client status."],correct:1,slide:"Slide 14"},
{q:"Multi-option PRIIPs (offering multiple investment options) must:",opts:["Produce a single KID covering all options generically","Either divide disclosure into several KIDs (one per option) OR produce a single KID with generic disclosure plus specific technical annexes for each option","Only disclose the top three investment options by performance","Have each option approved separately by the NCA"],exps:["❌ A single KID without option-specific detail is insufficient.","✅ Correct — for multi-option PRIIPs, manufacturers must either produce separate KIDs per option OR produce a single KID with generic PRIIP disclosure plus specific technical annexes for each option.","❌ Disclosure of only the top three options would not meet RTS requirements.","❌ Separate NCA approval per option is not required."],correct:1,slide:"Slide 14"}
,
{q:"When a product falls within both the PRIIPs Regulation and the Prospectus Regulation:",opts:["The PRIIPs Regulation takes precedence and replaces the prospectus summary", "Manufacturers may need to prepare both a prospectus summary AND a PRIIPs KID — though when a KID exists, the prospectus summary can be modelled on and rely on the KID content", "Only the Prospectus Regulation applies as it is more comprehensive", "The NCA determines which single document is required"],exps:["❌ The PRIIPs Regulation does not replace the prospectus summary.", "✅ Correct — when a product falls within both Regulations, manufacturers may need to prepare both; however, the Prospectus Regulation acknowledges that when a KID exists, the prospectus summary can be modelled on and rely on the KID content.", "❌ Both Regulations may apply simultaneously.", "❌ The NCA does not determine which single document is required."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs KID must be provided to retail investors:",opts:["Within 24 hours after the contract is concluded", "Well before the retail investor is bound by any contract or offer relating to the PRIIP — 'in good time' before conclusion", "Within 30 days following the contract conclusion", "Only if the retail investor specifically requests it"],exps:["❌ The KID must be provided before the contract is concluded.", "✅ Correct — the KID must be provided 'in good time' before the retail investor is bound by any contract or offer relating to the PRIIP.", "❌ Providing the KID within 30 days after contract conclusion is only permitted in the limited post-contract delivery conditions of Article 13.", "❌ KID delivery is proactive and mandatory, not dependent on client request."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation defines 'manufacturers' to also include:",opts:["Only original creators of PRIIPs who issue them for the first time", "The originator/creator who issues the PRIIP AND persons who make changes to an existing PRIIP — including changing its risk and return profile or the costs associated with investment", "Only investment firms authorised under MiFID II", "Only insurance undertakings regulated under Solvency II"],exps:["❌ The definition of manufacturer extends beyond original creators.", "✅ Correct — the Regulation defines a manufacturer as the originator/creator who issues the PRIIP, AND also as 'a person who makes changes to an existing PRIIP, including changing its risk and return profile or the costs associated with investment'.", "❌ Manufacturers include entities beyond MiFID II investment firms.", "❌ Manufacturers include entities beyond insurance undertakings."],correct:1,slide:"Slide 14"}
,
{q:"Which of the following is explicitly EXCLUDED from the PRIIPs Regulation?",opts:["Units in investment funds", "Life insurance products with benefits payable only in the event of death or disability, non-life insurance products, simple bank deposits linked only to an interest rate, and pension plans", "Structured deposits with capital protection", "Derivatives sold to retail clients"],exps:["❌ Units in investment funds (specifically UCITS) were subject to a transitional exemption but are within the Regulation's scope.", "✅ Correct — excluded from the PRIIPs Regulation are: non-life insurance products; life insurance where benefits are payable only in the event of death or disability; simple bank deposits linked only to an interest rate; financial assets held directly by the investor; and certain pension plans.", "❌ Structured deposits with capital protection may qualify as PRIIPs if the amount repayable is subject to fluctuations.", "❌ Derivatives sold to retail clients are within the PRIIPs Regulation's scope."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation is described as a 'cross-sectoral legislative regime' because:",opts:["It was adopted jointly by Parliament, Council, and Commission with equal voting rights", "It encompasses diverse sectors and a wide range of products — unlike the more sectorally limited Prospectus Regulation — covering funds, structured products, derivatives, and insurance-based investment products", "It applies across all EU Member States simultaneously without national implementing measures", "It was developed in coordination with the US SEC and Japanese FSA"],exps:["❌ The co-decision procedure is the standard EU legislative process, not what makes PRIIPs cross-sectoral.", "✅ Correct — the PRIIPs Regulation is a distinctive example of a truly cross-sectoral legislative regime within EU Capital Markets Law, encompassing diverse sectors and a wide range of products across funds, structured products, derivatives, and insurance-based investment products.", "❌ While the PRIIPs Regulation is directly applicable (as a Regulation), cross-sectorality refers to the scope across financial sectors, not the legislative form.", "❌ International coordination is not what makes PRIIPs cross-sectoral."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation is based on the premise that:",opts:["Retail investors always make fully rational investment decisions when given complete information", "Investors exercise due diligence and make informed decisions — but research shows individuals without professional backgrounds may face challenges navigating comprehensive information, hence the focus on how information is presented", "Retail investors should be prohibited from investing in complex products", "All financial products should be standardised to eliminate investor confusion"],exps:["❌ The PRIIPs Regulation acknowledges that retail investors may face challenges with complex information.", "✅ Correct — the Regulation is based on the premise that investors exercise due diligence and make informed decisions, but is also informed by research showing individuals without professional backgrounds may face challenges navigating comprehensive information — hence the particular attention to how information is presented.", "❌ The Regulation aims to facilitate informed investment in complex products, not prohibit them.", "❌ Standardising all financial products is not the approach; the KID standardises disclosure, not the products themselves."],correct:1,slide:"Slide 14"},
{q:"PRIIPs serve as an 'interface' between retail investors and markets because they:",opts:["Are sold exclusively through regulated intermediaries who filter unsuitable products", "Assemble assets in such a way as to create products with different exposures, characteristics, or cost structures than would be the case if assets were held directly", "Replace direct market access for retail investors entirely", "Are always guaranteed by the issuer against capital loss"],exps:["❌ PRIIPs can be sold through various channels; exclusive intermediary distribution is not the definition.", "✅ Correct — as stated in Recital 6, PRIIPs serve as an 'interface' between retail investors and markets because they 'assemble' assets creating products with different exposures, characteristics, or cost structures than would be the case if assets were held directly.", "❌ PRIIPs do not replace direct market access; they provide an alternative investment vehicle.", "❌ PRIIPs are not always guaranteed against capital loss; the amount repayable is subject to fluctuations."],correct:1,slide:"Slide 14"},
{q:"Marketing communications relating to PRIIPs must be consistent with the KID and must not:",opts:["Be longer than the KID itself", "Contradict the KID or diminish its significance — while also being clearly identifiable as marketing communications", "Be distributed through digital channels without prior NCA approval", "Be sent to retail clients more than 30 days before the KID is provided"],exps:["❌ There is no length restriction on marketing communications relative to the KID.", "✅ Correct — marketing communications must not contradict the KID or diminish its significance; they must be clearly identifiable as marketing communications.", "❌ NCA approval for each digital marketing communication is not required.", "❌ There is no 30-day pre-provision rule for marketing communications; the KID must be provided 'in good time' before the client is bound."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs KID's synthetic risk indicator must be presented:",opts:["As a narrative description of risks without any numerical scale", "Using an appropriate graphical format on an increasing numerical scale — standardised by the RTS to make KIDs effectively comparable across products", "As a percentage of the maximum possible loss relative to the amount invested", "Only for products where the risk level exceeds a certain threshold"],exps:["❌ The synthetic risk indicator must use a standardised graphical format with a numerical scale, not only a narrative.", "✅ Correct — the RTS requires use of appropriate graphical formats, such as the synthetic risk indicator on an increasing numerical scale, standardised to make KIDs effectively comparable across different PRIIPs.", "❌ A percentage of maximum possible loss is not the synthetic risk indicator format.", "❌ The synthetic risk indicator is required for all PRIIPs, not only those above a certain risk threshold."],correct:1,slide:"Slide 14"}
,
{q:"The PRIIPs Regulation pays particular attention to how information is presented because:",opts:["Regulators have determined that all retail investors are incapable of making investment decisions", "Research shows that individuals without professional backgrounds may face challenges navigating comprehensive information, making presentation quality as important as information completeness", "The EU wants to reduce the total amount of information provided to investors", "Regulators found that overly detailed disclosure increases retail investor engagement"],exps:["❌ The Regulation does not deem all retail investors incapable; it acknowledges complexity challenges.", "✅ Correct — the PRIIPs Regulation is informed by research showing that individuals without professional backgrounds may face challenges navigating comprehensive information; hence the particular attention to how information is presented, leading to the standardised, concise KID format.", "❌ The Regulation aims for essential information presented well, not reduced information.", "❌ The motivation is to improve comprehension, not necessarily increase engagement."],correct:1,slide:"Slide 14"}
,
{q:"Under Article 13 of the PRIIPs Regulation, post-contract KID delivery is permitted only when which specific conditions are met?",opts:["The manufacturer requests it for operational efficiency","The retail client decides on their own initiative to contact the seller using distance communication, timely delivery was not possible, and the client agreed to receive the KID after conclusion","The distributor is a regulated investment firm","The PRIIP is classified as non-complex under MiFID II"],exps:["❌ Manufacturer convenience is not a ground for post-contract delivery.","✅ Correct — post-contract KID delivery requires: client-initiated distance contact, impossibility of timely pre-contract delivery, prior client information about the impossibility and the right to postpone, and client agreement to receive the KID post-conclusion.","❌ The distributor's regulatory status does not determine post-contract delivery eligibility.","❌ Non-complexity under MiFID II is irrelevant to PRIIPs post-contract delivery."],correct:1,slide:"Slide 14"},
{q:"The KID under PRIIPs must not exceed what format limit?",opts:["Five A4 pages, including all tables and graphs","Three A4 pages, presented to facilitate readability","Seven A4 pages, in any format the manufacturer chooses","Two A4 pages, without any visual elements"],exps:["❌ Five pages exceeds the PRIIPs KID limit.","✅ Correct — the PRIIPs KID must be a short, concise document of no more than three A4 pages, presented and structured to facilitate readability.","❌ Seven pages is the limit for the prospectus summary, not the PRIIPs KID.","❌ Two pages is too short and visual elements (like the synthetic risk indicator) are required."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation applies to 'packaged retail investment products'. Which of the following is expressly EXCLUDED from the PRIIPs scope?",opts:["Units of investment funds","Derivatives","Life insurance where benefits are payable only in the event of death or disability","Structured deposits"],exps:["❌ Units of investment funds are within PRIIPs scope.","❌ Derivatives are within PRIIPs scope.","✅ Correct — Article 2 excludes life insurance products where benefits are payable only upon death or disability (with no investment/market-linked component) from the PRIIPs Regulation.","❌ Structured deposits (with conditions) may fall within PRIIPs scope."],correct:2,slide:"Slide 14"},
{q:"A PRIIPs 'manufacturer' includes which type of person?",opts:["Only the entity that first invented the product concept","Any person who issues the PRIIP, and also a person who makes changes to an existing PRIIP affecting its risk, return profile, or costs","Any financial institution with a licence to sell PRIIPs","Only legal persons established in an EU Member State"],exps:["❌ Manufacturer status is not based on invention; it concerns control over the product.","✅ Correct — a manufacturer is the entity issuing the PRIIP, and also any person making material changes to an existing PRIIP (changing risk/return profile or costs), potentially creating distributor-manufacturer overlap.","❌ Licensing to sell characterises distributors, not manufacturers.","❌ Manufacturers need not be established in the EU; the Regulation has extraterritorial reach when products are marketed to EU retail investors."],correct:1,slide:"Slide 14"},
{q:"Product intervention powers under the PRIIPs Regulation allow EIOPA and national authorities to:",opts:["Require manufacturers to redesign PRIIPs that do not meet minimum return thresholds","Temporarily prohibit or restrict the marketing, distribution, or sale of certain PRIIPs or types of financial activities","Set maximum fees for all PRIIPs sold to retail investors","Approve or reject individual PRIIPs before they are offered to the public"],exps:["❌ PRIIPs product intervention is not based on return thresholds.","✅ Correct — as a measure of last resort, EIOPA and NCAs may temporarily prohibit or restrict marketing, distribution, or sale of certain PRIIPs when investor protection or financial system integrity is at risk.","❌ Fee capping is not a product intervention power under PRIIPs.","❌ PRIIPs does not require ex-ante product approval; the KID is approved by the manufacturer, not authorities."],correct:1,slide:"Slide 14"},
{q:"The Regulatory Technical Standards (RTS) for PRIIPs KIDs were initially rejected by the European Parliament and later substantially revised. What is the current instrument containing the RTS?",opts:["ESMA Guideline on PRIIPs disclosure formats","Commission Delegated Regulation (EU) 2017/653, with major changes from Delegated Regulation 2021/2268","A Directive requiring Member States to adopt their own KID standards","EBA Technical Standard on retail investment product disclosure"],exps:["❌ The PRIIPs RTS is not an ESMA guideline.","✅ Correct — the RTS are contained in Commission Delegated Regulation (EU) 2017/653, substantially amended by Delegated Regulation 2021/2268 following the Parliament's rejection of the first version.","❌ PRIIPs uses a Regulation, not a Directive — no national transposition of KID standards is needed.","❌ The PRIIPs RTS is a Commission Delegated Regulation, not an EBA Technical Standard."],correct:1,slide:"Slide 14"},
{q:"When a PRIIP offers multiple investment options, manufacturers under Chapter II of the PRIIPs RTS may choose to:",opts:["Produce only one generic KID covering all options without option-specific details","Either produce separate KIDs for each underlying option or produce a single generic KID with specific technical annexes for each option","Refer investors to the prospectus for details on individual options","Request ESMA to approve a simplified multi-option summary"],exps:["❌ A single generic KID without option-specific details would be insufficient for investor decision-making.","✅ Correct — for multi-option PRIIPs, manufacturers may either produce separate KIDs per option or one generic KID with technical annexes providing detailed information for each option.","❌ Referring to the prospectus does not satisfy the PRIIPs KID requirement; KIDs must be self-contained.","❌ ESMA does not approve individual KIDs for multi-option PRIIPs."],correct:1,slide:"Slide 14"},
{q:"How does the PRIIPs Regulation interact with the Prospectus Regulation when a product falls within both scopes?",opts:["The PRIIPs Regulation entirely replaces the Prospectus Regulation for all PRIIP products","Both may apply simultaneously — manufacturers may need to prepare both a prospectus summary and a KID, with the prospectus summary modelled as much as possible on the PRIIPs KID","The Prospectus Regulation always takes precedence over the PRIIPs Regulation","PRIIPs-compliant products are automatically exempt from any Prospectus Regulation requirements"],exps:["❌ The PRIIPs Regulation does not replace the Prospectus Regulation; both may apply concurrently.","✅ Correct — when a product falls within both regimes, manufacturers may need to prepare both a prospectus summary and a PRIIPs KID. The Prospectus Regulation explicitly states the summary should be modelled on the PRIIPs KID, and where a KID exists, the prospectus summary can rely on it.","❌ The PRIIPs Regulation and Prospectus Regulation can coexist; there is no blanket precedence.","❌ PRIIPs compliance does not exempt products from the Prospectus Regulation."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation's KID is specifically NOT required for which class of investor?",opts:["Retail investors as defined under MiFID II","Semi-professional investors with portfolio exceeding €500,000","Professional clients","Eligible counterparties under MiFID II"],exps:["❌ The KID is specifically designed for and required when marketing to retail investors.","❌ 'Semi-professional' is not a formal MiFID II category; the PRIIPs regime uses the MiFID II retail investor definition.","✅ Correct — the PRIIPs regime does not apply to professional clients; the KID obligation is triggered only when marketing to 'retail investors' as defined under MiFID II or the Insurance Distribution Directive.","❌ Eligible counterparties, like professional clients, are outside the PRIIPs KID requirement."],correct:2,slide:"Slide 14"},
{q:"Which section of the PRIIPs KID must include a warning about high product complexity?",opts:["Section 3: What are the costs?","Section 4: How long do I have to hold it?","Section 1: What is this product? — where appropriate","Section 7: How can I complain?"],exps:["❌ Section 3 covers costs; complexity warnings are not placed there.","❌ Section 4 covers holding periods; complexity warnings are not placed there.","✅ Correct — Section 1 ('What is this product?') must include, where appropriate, a warning alerting the investor to the high level of complexity of the product.","❌ Section 7 covers complaints mechanisms; complexity warnings belong in Section 1."],correct:2,slide:"Slide 14"},
{q:"Article 2 of the PRIIPs Regulation excludes which of the following products from its scope?",opts:["Structured deposits with capital protection linked to an equity index","Units of investment funds investing in transferable securities","Life insurance products where the only benefit payable is upon death or disability with no investment component","Derivatives used for hedging purposes by retail investors"],exps:["❌ Structured deposits may fall within PRIIPs scope depending on their features.","❌ Units of investment funds are within the PRIIPs scope as they are explicitly listed as example PRIIPs.","✅ Correct — Article 2 excludes life insurance products where the only benefit payable is upon death or disability (i.e. pure protection products with no investment/market-linked component), since these do not expose investors to market fluctuations.","❌ Derivatives used by retail investors are within PRIIPs scope; the exclusion relates to non-investment insurance, not derivatives."],correct:2,slide:"Slide 14"}],
"15 — Market Abuse Regulation":[
{q:"The three pillars of the Market Abuse Regulation (MAR, 2014) are:",opts:["Disclosure, conduct regulation, and prudential rules","Prohibition of insider dealing, prohibition of market manipulation, and mandatory disclosure obligations for issuers","Licensing, conduct of business, and enforcement","Transparency, short selling, and shareholder rights"],exps:["❌ These are categories of regulatory tools, not the three MAR pillars.","✅ Correct — the three pillars are: (1) prohibition of insider dealing; (2) prohibition of market manipulation; (3) mandatory disclosure obligations for issuers.","❌ Licensing, conduct, and enforcement are regulatory tools.","❌ Transparency, short selling, and shareholder rights are covered by separate legislation."],correct:1,slide:"Slide 15"},
{q:"Article 7 MAR defines inside information as information that is:",opts:["Any material non-public information that any person in the company possesses","Precise, non-public, relating to one or more issuers or financial instruments, and which, if made public, would be likely to have a significant effect on prices","Any information that causes a measurable price movement when published","Confidential information labelled as such by the issuer in a written communication to the NCA"],exps:["❌ This description is too broad; the Article 7 definition requires all four elements.","✅ Correct — inside information must be: precise, non-public, relating to issuers or financial instruments, and likely to have a significant effect on prices if made public.","❌ Actual measurable price movement is not required.","❌ Labelling information as confidential is not part of the Article 7 definition."],correct:1,slide:"Slide 15"},
{q:"In Geltl v Daimler (C-19/11), the CJEU held that for the precision requirement:",opts:["Only final corporate decisions qualify; intermediate steps in protracted processes do not","A 'realistic prospect' of occurrence suffices — intermediate steps may constitute inside information if they meet the statutory criteria","Information must be certain to occur before it qualifies as precise","Precision requires the information to be disclosed in writing to the NCA"],exps:["❌ Intermediate steps in protracted processes can constitute inside information.","✅ Correct — in Geltl v Daimler, a 'realistic prospect' of occurrence suffices; expected price impact doesn't influence whether information is precise.","❌ Certainty is not required; a realistic prospect suffices.","❌ Written disclosure to the NCA is not part of the precision requirement."],correct:1,slide:"Slide 15"},
{q:"Article 17(1) MAR requires issuers to disclose inside information:",opts:["Once per year with annual financial statements","As soon as possible after inside information directly concerns that issuer","Only upon formal written request from the NCA","After pre-clearing the disclosure with ESMA"],exps:["❌ Annual disclosure would defeat the purpose of preventing insider dealing.","✅ Correct — Article 17(1) MAR requires issuers to inform the public as soon as possible of inside information which directly concerns that issuer.","❌ Issuers have a proactive obligation; no formal NCA request is required.","❌ Pre-clearing with ESMA is not required."],correct:1,slide:"Slide 15"},
{q:"Article 17(4) MAR allows delay of disclosure when which three cumulative conditions are met?",opts:["Information concerns a merger, the acquirer requests confidentiality, and the transaction completes within 6 months","Immediate disclosure would prejudice the issuer's legitimate interests, the delay would not mislead the public, and the issuer ensures ongoing confidentiality","The NCA has been informed, delay is limited to 30 days, and information concerns only internal reorganisation","The information is already known to major shareholders, trading is suspended, and a supplement will be published"],exps:["❌ Mergers and acquisitions are not specifically the three conditions.","✅ Correct — the three cumulative conditions are: (1) immediate disclosure would prejudice legitimate interests; (2) the delay would not mislead the public; (3) the issuer ensures ongoing confidentiality.","❌ A 30-day limit and NCA pre-notification are not the three statutory conditions.","❌ These are not the statutory conditions."],correct:1,slide:"Slide 15"},
{q:"'Market soundings' under Article 11 MAR allow selective disclosure of inside information for:",opts:["Complying with employee communication obligations","Assessing potential investor interest and conditions for possible transactions — e.g., gauging investor appetite before a capital raise — under strict procedural requirements","Providing inside information to analysts for research reports","Sharing information with major shareholders ahead of general meetings"],exps:["❌ Employee communication is governed by labour law, not Article 11 MAR.","✅ Correct — market soundings allow selective disclosure to gauge investor interest and conditions for possible transactions, under strict procedural requirements.","❌ Providing inside information to analysts without Article 11 procedures would be unlawful disclosure.","❌ Sharing with major shareholders without Article 11 procedures would be unlawful selective disclosure."],correct:1,slide:"Slide 15"},
{q:"The insider dealing prohibition under Article 8(1) MAR requires which two elements?",opts:["Knowledge AND actual price impact upon trading","Possession of inside information AND use of that information to acquire or dispose of financial instruments to which it relates","Working at the issuer AND trading in the issuer's securities","Senior management status AND deliberate intent to deceive the market"],exps:["❌ Actual price impact upon trading is not required.","✅ Correct — insider dealing requires: (1) possession of inside information; AND (2) use of that information by acquiring or disposing of financial instruments to which it relates.","❌ Working at the issuer is one way to be a primary insider but is not required.","❌ Senior management status and deliberate deceptive intent are not the two required elements."],correct:1,slide:"Slide 15"},
{q:"The ne bis in idem debate in MAR enforcement was triggered by:",opts:["MiFID II provisions on administrative and criminal sanctions","Grande Stevens v. Italy (ECtHR, 2014): imposition of both administrative AND criminal sanctions for the same misleading-the-market conduct violated Article 4 of Protocol No. 7 ECHR","The Geltl v Daimler case on precision requirement","The Short Selling case on ESMA's intervention powers"],exps:["❌ MiFID II sanctions provisions are related but not the trigger.","✅ Correct — Grande Stevens v. Italy (ECtHR, 2014) held that imposing both administrative and criminal sanctions for the same misleading-the-market conduct violated the ne bis in idem principle.","❌ Geltl v Daimler addressed the precision requirement.","❌ The Short Selling case addressed ESMA's powers under the Meroni doctrine."],correct:1,slide:"Slide 15"},
{q:"Safe harbours for share buy-backs (Article 5 MAR) require:",opts:["ESMA approval and limitation to 10% of issued shares","Full details disclosed before trading; trades reported and disclosed; price/volume limits respected; carried out for capital reduction, debt obligations, or employee programs","Completion within 30 calendar days and price not exceeding 5% premium over market","No other market transactions in the preceding 90 days"],exps:["❌ ESMA approval is not required for the buy-back safe harbour.","✅ Correct — Article 5 MAR safe harbour for buy-backs requires: full details disclosed before trading; trades reported and disclosed; price/volume limits respected; carried out for capital reduction, debt obligations, or employee programs.","❌ A 30-day completion and 5% premium are not the safe harbour conditions.","❌ A 90-day moratorium is not a MAR safe harbour condition."],correct:1,slide:"Slide 15"},
{q:"'Benchmark manipulation' was added to MAR as a prohibited form of market manipulation after:",opts:["The WorldCom and Enron accounting scandals","The LIBOR and EURIBOR scandals of 2012","The flash crash of 2010","The subprime mortgage crisis and Lehman Brothers collapse"],exps:["❌ WorldCom and Enron were accounting scandals, not benchmark manipulation.","✅ Correct — benchmark manipulation was added to MAR after the LIBOR and EURIBOR scandals of 2012.","❌ The flash crash prompted algorithmic trading rules.","❌ The subprime crisis prompted post-trade infrastructure reform (EMIR)."],correct:1,slide:"Slide 15"},
{q:"'Tippee liability' under Article 8(3) MAR establishes that:",opts:["Primary insiders are liable for all profits of all tippees down the chain","A person who receives a recommendation to trade is liable where they know or ought to know the recommendation is based on inside information — reflecting EU's market-based approach (not the US fiduciary-based model)","Only primary insiders who directly benefit financially from tipping are liable","Tippee liability applies only to professional investors with fiduciary duties"],exps:["❌ While tippers are liable, Article 8(3) specifically establishes tippee liability.","✅ Correct — Article 8(3) MAR establishes tippee liability where the recipient knows or ought to know the recommendation is based on inside information; reflecting EU's market-based approach.","❌ Financial benefit to the tipper is the US fiduciary test; EU MAR uses a market-based approach.","❌ Tippee liability applies regardless of fiduciary duties."],correct:1,slide:"Slide 15"}
,
{q:"The 'Efficient Capital Markets Hypothesis' (ECMH) underpins MAR because:",opts:["It proves all investors always act rationally", "Its central claim that efficient markets reflect available material information in prices justifies regulatory intervention against any asymmetry in access to material information", "It demonstrates that insider dealing does not affect market prices", "It provides the mathematical framework for calculating insider trading profits"],exps:["❌ The ECMH assumes rational behaviour as a theoretical model.", "✅ Correct — the ECMH's central claim that efficient markets reflect available material information justifies MAR's intervention against information asymmetry through the insider dealing and manipulation prohibitions.", "❌ Insider dealing distorts prices precisely because inside information has value.", "❌ The ECMH is a theoretical framework, not a calculation methodology."],correct:1,slide:"Slide 15"},
{q:"'Permitted selective disclosure' under MAR must be interpreted:",opts:["Broadly to allow free flow of information for legitimate business purposes", "Narrowly — disclosure must be strictly necessary for professional activity, not merely useful or convenient; if the recipient lacks a confidentiality obligation, the issuer must restore informational parity with the market", "Broadly to allow analysts to receive management briefings before earnings announcements", "Without restriction if both parties are regulated financial entities"],exps:["❌ Permitted selective disclosure is interpreted narrowly.", "✅ Correct — disclosure must be strictly necessary for professional activity; if the recipient lacks a confidentiality obligation, the issuer must restore informational parity (simultaneous disclosure if intentional; prompt disclosure if unintentional).", "❌ Management briefings to analysts are not automatically permitted.", "❌ The status of both parties as regulated entities does not exempt them from MAR's selective disclosure rules."],correct:1,slide:"Slide 15"},
{q:"Article 8(2) MAR specifically added which previously uncovered prohibited conduct?",opts:["Tipping inside information to third parties", "Cancelling or amending orders placed before the person came to possess inside information — explicitly added by MAR to close a loophole", "Using inside information through derivatives rather than direct share purchases", "Communicating inside information to a person who is also an insider"],exps:["❌ Tipping inside information was already prohibited.", "✅ Correct — MAR explicitly added the cancellation or amendment of orders placed before possessing inside information, closing a loophole where traders would cancel pending orders upon receiving inside information.", "❌ Using inside information through derivatives was already prohibited.", "❌ Communicating inside information is addressed by the unlawful disclosure prohibition."],correct:1,slide:"Slide 15"},
{q:"'Algorithmic manipulation' as a specific form of market manipulation under Article 12(2) MAR includes:",opts:["Any use of algorithms for trading, which is inherently manipulative", "Orders via electronic means (including HFT) that disrupt trading systems, obscure genuine orders, or create false signals about supply, demand, or price — including spoofing, layering, and quote stuffing", "Only spoofing strategies where orders are placed and immediately cancelled", "Only layering strategies where multiple orders are placed at different price levels"],exps:["❌ Algorithmic trading per se is not inherently manipulative; only specific manipulative techniques are prohibited.", "✅ Correct — Article 12(2) MAR lists algorithmic manipulation as orders via electronic means (including HFT) that disrupt trading systems, obscure genuine orders, or create false signals.", "❌ Algorithmic manipulation covers more than only spoofing.", "❌ Algorithmic manipulation covers more than only layering."],correct:1,slide:"Slide 15"}
,
{q:"The Market Abuse Regulation (MAR) was adopted in 2014 alongside which other instrument?",opts:["The MiFID II Directive", "The Market Abuse Directive II (MAD II) — the criminal sanctions directive, which requires Member States to provide criminal penalties for serious market abuse offences", "The Prospectus Regulation (EU 2017/1129)", "The Short Selling Regulation (EU 236/2012)"],exps:["❌ MiFID II was adopted in 2014 but is a separate instrument addressing investment services and trading venues.", "✅ Correct — MAR was adopted in 2014 alongside the Market Abuse Directive II (MAD II), which requires Member States to provide criminal penalties for serious market abuse offences such as insider dealing and market manipulation.", "❌ The Prospectus Regulation was adopted in 2017, not alongside MAR.", "❌ The Short Selling Regulation was adopted in 2012, not alongside MAR."],correct:1,slide:"Slide 15"},
{q:"'Dominant position abuse' as a specific form of market manipulation under Article 12(2) MAR involves:",opts:["A company's CEO using inside information to trade in the company's securities", "Securing a dominant position over the supply or demand for a financial instrument to fix prices or create unfair trading conditions — also known as 'cornering' the market", "A firm executing transactions on multiple venues simultaneously to create the appearance of liquidity", "Spreading false rumours through social media to move prices in a desired direction"],exps:["❌ The CEO using inside information describes insider dealing, not dominant position abuse.", "✅ Correct — dominant position abuse involves securing a dominant position over supply or demand to fix prices or create unfair trading conditions, sometimes referred to as 'cornering' the market.", "❌ Executing transactions on multiple venues to create the appearance of liquidity describes 'painting the tape', another form of manipulation.", "❌ Spreading false rumours describes information-based market manipulation."],correct:1,slide:"Slide 15"},
{q:"'Opening/closing manipulation' as a form of market manipulation under Article 12(2) MAR involves:",opts:["Trading at market open or close to mislead investors acting on displayed prices or underlying asset prices", "Placing large orders at opening to ensure the best execution price for the firm's own account", "Executing trades during illiquid periods to obtain better prices", "Using algorithmic strategies to exploit price differences between opening and closing auctions"],exps:["✅ Correct — opening/closing manipulation involves trading at market open or close to mislead investors acting on displayed prices or underlying asset prices (e.g., for derivatives settlement).", "❌ Seeking best execution for the firm's own account through normal trading is not manipulation.", "❌ Trading during illiquid periods for better prices is not inherently manipulative.", "❌ Exploiting price differences through algorithmic strategies is not the definition of opening/closing manipulation."],correct:0,slide:"Slide 15"},
{q:"The MAR prohibition of insider dealing under Article 8(1) covers trading 'for own account or third party account, directly or indirectly'. This means:",opts:["Only direct purchases or sales of the financial instrument concerned", "Any acquisition or disposal of financial instruments to which the information relates, whether acting directly or through an intermediary, agent, or any other person acting on behalf of the insider", "Only transactions in the company's shares, not in derivative instruments", "Only transactions conducted on regulated markets, not OTC trades"],exps:["❌ The prohibition covers direct and indirect transactions, not only direct ones.", "✅ Correct — the prohibition covers any acquisition or disposal of financial instruments to which the information relates, whether the insider acts directly or through an intermediary, agent, or any other person acting on behalf of the insider.", "❌ The prohibition extends to all financial instruments to which the inside information relates, including derivatives.", "❌ The prohibition applies regardless of venue — regulated markets, MTFs, OTFs, and OTC transactions are all covered."],correct:1,slide:"Slide 15"},
{q:"The 'wash trade' indicator of market manipulation under Annex I MAR refers to:",opts:["Washing a company's financial statements to remove evidence of poor performance", "Transactions where the same beneficial owner is on both sides — creating the appearance of activity without genuine change in beneficial ownership", "Executing a large number of small trades to avoid triggering transparency thresholds", "Using multiple accounts to obscure the origin of trading profits"],exps:["❌ Washing financial statements describes accounting fraud, not market manipulation.", "✅ Correct — wash trades are transactions where the same beneficial owner is on both sides (or closely connected parties), creating the appearance of genuine market activity without any actual change in beneficial ownership — a fictitious device indicator.", "❌ Breaking trades into small sizes to avoid thresholds describes 'layering' or 'smurfing'; wash trades are about same-owner both-side transactions.", "❌ Obscuring trading profit origins relates to money laundering, not the wash trade indicator."],correct:1,slide:"Slide 15"}
,
{q:"Under Regulation (EU) No 596/2014 (the Market Abuse Regulation), the distinction between primary and secondary insiders implies that:",opts:["Only primary insiders are subject to the prohibition on insider dealing under MAR, while secondary insiders are entirely exempt from the market abuse regime", "Secondary insiders are conclusively presumed to act in good faith and can never be sanctioned for insider dealing under MAR", "Primary insiders are presumed to be aware of the special nature of the information because of their close relationship with the issuer, whereas secondary insiders are subject to the prohibition only if they know or ought to know that the information qualifies as inside information", "The distinction has no practical legal significance since both primary and secondary insiders face identical presumptions and identical burdens of proof"],exps:["❌ Secondary insiders are NOT exempt from MAR; they are subject to the insider dealing prohibition if they know or ought to know the information is inside information.", "❌ Secondary insiders are NOT conclusively presumed to act in good faith; they face liability if they know or ought to know the information qualifies as inside information.", "✅ Correct — primary insiders are presumed to be aware of the special nature of the information because of their close relationship with the issuer (membership in administrative/supervisory bodies, capital interest, employment). Secondary insiders are subject to the prohibition only if they know or ought to know that the information qualifies as inside information.", "❌ The distinction has significant practical significance: primary insiders face a presumption of knowledge; secondary insiders face a subjective knowledge test."],correct:2,slide:"Slide 15"}
,
{q:"Under Article 7 MAR, inside information does NOT require:",opts:["The information to be of a precise nature", "The information to be non-public", "An actual and measurable price movement in the relevant financial instrument after public disclosure", "The information to be likely to have a significant effect on prices if made public"],exps:["❌ Precision IS required — the information must be specific enough to enable conclusions about possible price effects.", "❌ Non-public nature IS required — information that has already been made public does not qualify as inside information.", "✅ Correct — inside information does NOT require an actual and measurable price movement after disclosure. It is sufficient that the information, if made public, would be LIKELY to have a significant effect on prices. The reasonable investor test is forward-looking; no actual price movement needs to be observed.", "❌ Likely significant effect on prices IS required — this is assessed through the reasonable investor test under Article 7(4) MAR."],correct:2,slide:"Slide 15"}
,
{q:"Are issuers obliged to draw up a list of persons who have access to inside information?",opts:["Yes, but only if expressly required by the National Competent Authority", "Yes, but only where such persons work for the issuer under a contract of employment", "Yes, where such persons perform tasks through which they have access to inside information", "No, if such issuers carry out transactions which do not exceed EUR 3,000,000 on an annual basis"],exps:["❌ The obligation is not conditional on NCA request — it applies automatically.", "❌ The obligation extends beyond employment contracts to all persons who have access to inside information, regardless of the legal basis of their relationship with the issuer.", "✅ Correct — issuers must draw up insider lists for all persons who perform tasks through which they have access to inside information, whether employees, contractors, advisors, or others.", "❌ There is no EUR 3,000,000 annual transaction threshold exempting issuers from the insider list obligation."],correct:2,slide:"Slide 15"}
,
{q:"How must issuers publish inside information under the Market Abuse Regulation (MAR)?",opts:["In a way that ensures fast and complete access, without marketing issuers' activities, making information available on the Officially Appointed Mechanism and on the website of the regulated market where issuers' securities are admitted", "Only through a press release distributed to national and international press agencies", "By making the information available exclusively on the issuer's own website, without any additional notification requirements", "By notifying the national competent authority first, which then publishes on behalf of the issuer"],exps:["✅ Correct — MAR requires disclosure in a way that ensures fast and complete access to information (e.g., through a press release), without including marketing of issuers' activities, making it available on the Officially Appointed Mechanism (OAM) and the website of the regulated market.", "❌ A press release alone is insufficient; publication on the OAM and regulated market website is also required.", "❌ Publication on the issuer's website alone is insufficient without the OAM and regulated market requirements.", "❌ The NCA does not publish on behalf of the issuer; the issuer bears the responsibility and obligation to disclose directly."],correct:0,slide:"Slide 15"}
,
{q:"Which of the following statements is true regarding inside information and disclosure?",opts:["A person who possesses inside information must always disclose it to the market immediately", "A person who possesses inside information can never disclose such information to any other person", "A person who possesses inside information can disclose such information to other persons provided that a non-disclosure agreement is signed", "None of the other options is correct"],exps:["❌ Issuers have an obligation to disclose inside information 'as soon as possible' (not immediately upon possession) and have discretion to delay under Article 17(4) conditions.", "❌ Persons may disclose inside information in the normal exercise of employment, profession, or duty (permitted selective disclosure), provided confidentiality obligations apply.", "❌ A non-disclosure agreement alone is not sufficient — permitted selective disclosure requires that the disclosure occurs in the normal exercise of employment, profession, or duties, AND that the recipient is bound by a confidentiality obligation (legal, regulatory, contractual, or professional).", "✅ Correct — none of the other options is correct: (1) there is no obligation to disclose immediately; (2) disclosure is permitted in normal exercise of employment if confidentiality applies; (3) an NDA alone is not sufficient — the legal basis for permitted disclosure is the normal exercise of employment, not merely an NDA."],correct:3,slide:"Slide 15"}
,
{q:"The Lafonta case (C-628/13) clarified the precision requirement for inside information by establishing that:",opts:["Investors must be able to predict the exact direction of the price movement","Investors need not predict direction — it is sufficient that information allows the conclusion there will be a price effect, regardless of whether upward or downward","Information only qualifies as 'precise' after a board resolution has been formally adopted","The 'precision' standard only applies to criminal proceedings, not administrative sanctions"],exps:["❌ The Lafonta judgment specifically rejected the requirement to predict direction.","✅ Correct — in Lafonta, the CJEU held that it is sufficient for information to allow the conclusion there will be some price effect; investors are not required to predict the direction (upward or downward) of the price movement.","❌ Precision is assessed at the time of the information, not only after formal board decisions.","❌ The precision standard applies uniformly to all MAR obligations."],correct:1,slide:"Slide 15"},
{q:"The 'reasonable investor test' under Article 7(4) MAR assesses price sensitivity by asking:",opts:["Whether professional analysts would trade on the information","Whether a rational market participant would likely use the information as part of the basis for investment decisions","Whether the information would cause a 10% or greater price movement","Whether at least three competent NCAs have declared the information material"],exps:["❌ The test is broader than professional analysts; it concerns any reasonable investor.","✅ Correct — the reasonable investor test asks whether a rational market participant would likely use the information as part of the basis for their investment decisions, assessing qualitative significance rather than quantitative price impact.","❌ No specific price movement percentage is required by the reasonable investor test.","❌ NCA declarations are not required to establish price sensitivity."],correct:1,slide:"Slide 15"},
{q:"Under MAR, 'tippee liability' (Article 8(3)) applies when a person receives a recommendation based on inside information and:",opts:["Always, regardless of their knowledge","Only if they have formally acknowledged receiving the inside information","When they know or ought to know the recommendation is based on inside information","Only primary insiders can become tippees"],exps:["❌ Tippee liability requires knowledge or constructive knowledge; it is not automatic.","❌ Formal acknowledgment is not required; knowledge or constructive knowledge is sufficient.","✅ Correct — tippee liability under Article 8(3) applies when the recipient knows or ought to know that the recommendation or inducement is based on inside information.","❌ Tippees are by definition secondary insiders; the restriction concerns primary/secondary insider status."],correct:2,slide:"Slide 15"},
{q:"Article 13 MAR 'accepted market practices' differ from Article 5 'safe harbours' primarily because:",opts:["Accepted market practices require ESMA approval; safe harbours require NCA approval","Safe harbours provide EU-wide automatic protection for specific practices (buy-backs, stabilisation); accepted market practices are subject to national NCA discretion and are not harmonised across the EU","Safe harbours are only available to professional investors; accepted market practices apply to all market participants","Article 5 safe harbours are temporary; Article 13 practices are permanent"],exps:["❌ Safe harbours don't require NCA approval; they apply automatically when conditions are met.","✅ Correct — safe harbours provide EU-wide uniform automatic protection for buy-backs and stabilisation; accepted market practices are subject to national discretion, are not harmonised, and must be formally recognised by individual NCAs after ESMA notification.","❌ Both mechanisms apply across investor categories.","❌ Both mechanisms are permanent features of the MAR framework, not temporary."],correct:1,slide:"Slide 15"},
{q:"Market soundings under Article 11 MAR permit selective disclosure of inside information. Which of the following is NOT a requirement of the market soundings regime?",opts:["Assessing potential investor interest and conditions for possible transactions","Following prescribed procedures ensuring proper documentation","Prior approval from the relevant NCA before any market sounding may commence","Recipient awareness of the information's inside nature"],exps:["❌ Assessing investor interest is the stated purpose of market soundings.","❌ Documented procedures are required under the market soundings regime.","✅ Correct — market soundings do not require prior NCA approval. The regime provides a safe harbour for selective disclosure provided prescribed procedures (documentation, recipient awareness) are followed; NCAs are notified after the fact, not before.","❌ Recipient awareness requirements are part of the market soundings regime."],correct:2,slide:"Slide 15"},
{q:"Grande Stevens v Italy (ECtHR, 2014) raised concerns about dual administrative and criminal sanctions for market abuse because:",opts:["It found that administrative sanctions were always disproportionate in market abuse cases","Imposing both administrative and criminal sanctions for the same conduct violated the ne bis in idem principle under ECHR Protocol 7","It declared that only criminal courts may impose significant penalties for market manipulation","It required Member States to choose between administrative-only or criminal-only enforcement"],exps:["❌ The case concerned double jeopardy, not the proportionality of sanctions individually.","✅ Correct — Grande Stevens found that imposing both punitive administrative and criminal sanctions for the same misleading market conduct violated Article 4 Protocol 7 ECHR (ne bis in idem), sparking broader debate on dual-track enforcement.","❌ The case concerned the accumulation of sanctions, not which court may impose them.","❌ Grande Stevens did not require an exclusive enforcement track; it addressed the double jeopardy issue."],correct:1,slide:"Slide 15"},
{q:"Benchmark manipulation was added to MAR's market manipulation prohibition following which scandal?",opts:["The Enron accounting fraud","The LIBOR and EURIBOR scandals of 2012","The 2010 flash crash caused by algorithmic trading","The Madoff Ponzi scheme"],exps:["❌ The Enron scandal concerned accounting fraud, not benchmark manipulation.","✅ Correct — benchmark manipulation (transmitting false information or providing false inputs for benchmarks) was added to MAR's prohibition following the LIBOR and EURIBOR manipulation scandals that became public in 2012.","❌ The 2010 flash crash was an algorithmic trading issue that contributed to the MiFID II algorithmic trading rules.","❌ The Madoff scheme was a Ponzi fraud, not benchmark manipulation."],correct:1,slide:"Slide 15"},
{q:"The 2026 Listing Act reform to MAR's disclosure obligation addressed what specific concern about protracted processes?",opts:["It abolished the disclosure obligation for intermediate steps in M&A transactions","It introduced a new rule that issuers are not required to disclose intermediate steps if they ensure ongoing confidentiality, with final events triggering disclosure to be specified by Commission delegated acts","It required simultaneous disclosure of all steps in multi-stage transactions","It transferred disclosure obligations for M&A intermediates from issuers to investment banks"],exps:["❌ The reform did not abolish disclosure of intermediate steps; it managed when they must be disclosed.","✅ Correct — the 2026 Listing Act amendment provides that issuers are not required to disclose intermediate steps in protracted processes if they ensure ongoing confidentiality, with the Commission to adopt delegated acts listing final events triggering disclosure.","❌ Simultaneous disclosure of all steps was the existing concern the reform addressed; premature disclosure of preliminary information may mislead rather than inform.","❌ Disclosure obligations remain with issuers, not their advisers."],correct:1,slide:"Slide 15"},
{q:"Which of the following describes 'wash trading' as a manipulative behaviour under MAR?",opts:["Trading at the market open to influence opening prices","Transactions where the same beneficial owner is on both the buy and sell side, creating false appearance of activity without genuine ownership change","Spreading false rumours to influence prices","Using dominant positions over supply to fix prices"],exps:["❌ Trading at market open to influence prices is 'opening manipulation', not wash trading.","✅ Correct — wash trading (also called 'painting the tape') involves transactions where the same beneficial owner is effectively on both sides, creating a false impression of market activity without genuine change in beneficial ownership.","❌ Spreading false rumours is information-based manipulation, not wash trading.","❌ Using dominant positions to fix prices is 'abusive squeeze' behaviour."],correct:1,slide:"Slide 15"},
{q:"Primary insiders under MAR are presumed to know information's special nature because:",opts:["They received formal training on insider dealing rules","They have a close relationship with the issuer through board membership, capital interest, professional duties, or criminal activity involvement","They are regulated by national competent authorities","They signed confidentiality agreements with the issuer"],exps:["❌ Training is relevant to liability defences but is not the basis for the primary insider presumption.","✅ Correct — primary insiders are presumed to know information's special nature due to their close relationship with the issuer: membership in management/supervisory bodies, capital interest, professional duties, or involvement in criminal activities.","❌ Regulatory status does not create primary insider classification under MAR.","❌ Confidentiality agreements are relevant to the selective disclosure analysis, not primary insider classification."],correct:1,slide:"Slide 15"},
{q:"The 27 Member States' sanctioning regimes for market abuse under MAD II can be characterised as exhibiting which pattern?",opts:["Full harmonisation: identical criminal penalties apply in all Member States","A patchwork of divergent systems — some emphasising criminal sanctions, others administrative priority, others cumulative application — creating inconsistent severity and regulatory arbitrage opportunities","A single administrative track: criminal sanctions have been abolished in favour of purely civil enforcement","A unified system where ESMA directly imposes sanctions on market abuse offenders"],exps:["❌ MAD II sets minimum rules for criminal offences but does not fully harmonise national sanctioning regimes.","✅ Correct — across the 27 Member States there are three broad enforcement models: criminal emphasis, administrative priority, and cumulative application; this patchwork creates divergent severity, potentially jeopardises proportionality, and creates regulatory arbitrage opportunities.","❌ Criminal sanctions remain available in all Member States under MAD II; administrative sanctions complement rather than replace them.","❌ ESMA does not directly impose market abuse sanctions; NCAs retain enforcement competence."],correct:1,slide:"Slide 15"},
{q:"The core concerns about the dual-track administrative and criminal sanctions architecture for market abuse include which of the following?",opts:["The risk that administrative sanctions are too lenient compared to criminal penalties","Over-penalisation (cumulative sanctions exceeding proportionality), jurisdictional divergence in severity across Member States, and potential infringement of fundamental rights including the ne bis in idem principle","The lack of any criminal sanctions in most Member States","ESMA's inability to coordinate between national sanctioning regimes"],exps:["❌ The concern is the opposite: cumulative sanctions may be excessive, not that administrative sanctions are too lenient.","✅ Correct — the three core concerns are: (1) over-penalisation when the same conduct faces both administrative and criminal proceedings with cumulative sanctions; (2) jurisdictional divergence in severity undermining equality; and (3) constitutional safeguards including ne bis in idem and due process rights.","❌ MAD II requires all Member States to provide for criminal sanctions for serious market abuse offences.","❌ ESMA plays a coordinating role but the core concern is the fundamental rights dimension of dual-track enforcement."],correct:1,slide:"Slide 15"},
{q:"Looking forward, the evolution of MAR and MAD II faces which key regulatory challenges?",opts:["Abolishing administrative sanctions to create a purely criminal enforcement system","Harmonising enforcement across fragmented national regimes, ensuring proportionality in dual-track systems, adapting to technological developments including AI and HFT, and balancing disclosure obligations with legitimate business interests","Transferring all enforcement powers to ESMA and eliminating national competent authority roles","Reducing the scope of the insider dealing prohibition to cover only primary insiders"],exps:["❌ There are no proposals to abolish administrative sanctions; proportionality reform is the direction.","✅ Correct — the key future challenges for MAR/MAD II include: harmonising enforcement across fragmented national regimes; ensuring proportionality in dual-track systems (post-Grande Stevens); adapting to digital markets, AI, and HFT; maintaining legal certainty amid evolving CJEU/ECtHR case law; and balancing disclosure obligations with legitimate business needs.","❌ NCAs retain enforcement competence; full ESMA takeover is not proposed.","❌ Secondary insiders (tippees) remain within MAR's scope; narrowing the prohibition is not under discussion."],correct:1,slide:"Slide 15"}],
"16 — Sustainable Finance & ESG":[
{q:"The EU Taxonomy Regulation identifies how many environmental objectives?",opts:["Two","Four","Six","Eight"],exps:["❌ Two is too few.","❌ Four is not the correct number.","✅ Correct — six environmental objectives: climate change mitigation, climate change adaptation, sustainable use of water and marine resources, transition to circular economy, pollution prevention and control, and protection of biodiversity and ecosystems.","❌ Eight is too many."],correct:2,slide:"Slide 16"},
{q:"For an activity to qualify as environmentally sustainable under the Taxonomy Regulation, it must cumulatively satisfy:",opts:["ESMA certification, minimum capital thresholds, disclosure to investors, and Paris Agreement alignment","Substantial contribution to at least one environmental objective, Do No Significant Harm (DNSH) to other objectives, compliance with minimum social and governance safeguards, and meeting relevant technical screening criteria","Audit by an EU-registered external reviewer, listing on an EU trading venue, an ESG rating, and NCA approval","SFDR Article 9 alignment, ESMA endorsement, CSRD reporting, and CSDDD due diligence compliance"],exps:["❌ ESMA certification and capital thresholds are not Taxonomy requirements.","✅ Correct — the four cumulative requirements are: (1) substantial contribution to at least one of six environmental objectives; (2) DNSH to other objectives; (3) minimum social and governance safeguards; (4) relevant technical screening criteria.","❌ External reviewer audits and ESG ratings are not the four Taxonomy requirements.","❌ SFDR alignment and ESMA endorsement are not Taxonomy requirements."],correct:1,slide:"Slide 16"},
{q:"The CSRD entered into force on which date?",opts:["January 1, 2021","5 January 2023","March 1, 2022","June 30, 2024"],exps:["❌ January 1, 2021 is not when the CSRD entered into force.","✅ Correct — the CSRD entered into force on 5 January 2023.","❌ March 1, 2022 is not when the CSRD entered into force.","❌ June 30, 2024 is not when the CSRD entered into force."],correct:1,slide:"Slide 16"},
{q:"The 'dual materiality principle' under CSRD means:",opts:["Companies must report under both CSRD and SFDR simultaneously","Financial materiality (how sustainability issues affect the company — outside-in) AND impact materiality (how the company's activities impact people and environment — inside-out)","Both quantitative and qualitative sustainability data must be reported","Sustainability reports must be audited by two independent auditors"],exps:["❌ Dual materiality relates to the scope of reporting, not two regulatory frameworks.","✅ Correct — dual materiality means reporting on both financial materiality (outside-in) AND impact materiality (inside-out).","❌ Quantitative and qualitative reporting is not what 'dual materiality' means.","❌ Dual auditors is not what dual materiality means."],correct:1,slide:"Slide 16"},
{q:"CSRD 'Wave 1' (reporting for FY 2024) applies to:",opts:["All listed companies in the EU regardless of size","Large public-interest entities with more than 500 employees (previously subject to NFRD)","All large undertakings including non-listed companies above 250 employees","Only banks and insurance companies above €1 billion in assets"],exps:["❌ Wave 1 is limited to entities with over 500 employees previously subject to NFRD.","✅ Correct — Wave 1 (reporting for FY 2024) applies to large public-interest entities with more than 500 employees.","❌ All large undertakings above 250 employees are Wave 2 (reporting for FY 2027).","❌ Banks and insurance companies specifically are not the only Wave 1 entities."],correct:1,slide:"Slide 16"},
{q:"The Stop-the-Clock Directive delayed CSRD implementation by:",opts:["Stopping all CSRD Wave 1 reporting requirements","Delaying Waves 2 and 3 by two years (Wave 2: 2028; Wave 3: 2029)","Indefinitely postponing all CSRD requirements","Delaying only Wave 3 by one year"],exps:["❌ Wave 1 was not affected.","✅ Correct — the Stop-the-Clock Directive delayed Waves 2 and 3 by two years.","❌ The Directive does not indefinitely postpone all CSRD requirements.","❌ Both Waves 2 and 3 were delayed by two years."],correct:1,slide:"Slide 16"},
{q:"The SFDR distinguishes Article 8 products from Article 9 products because:",opts:["Article 8 products are more expensive for investors","Article 8 products promote environmental/social characteristics; Article 9 products have sustainable investment as their specific objective — both face different disclosure requirements","Article 8 products are available to retail investors; Article 9 products only for professional investors","Article 8 products are regulated by ESMA; Article 9 products by national authorities"],exps:["❌ Cost is not the distinction.","✅ Correct — Article 8 products promote E/S characteristics; Article 9 products have sustainable investment as their objective; both face specific disclosure requirements.","❌ Both can be available to retail investors.","❌ Both are regulated under the SFDR framework."],correct:1,slide:"Slide 16"},
{q:"The CSDDD maximum pecuniary sanction is:",opts:["1% of net worldwide turnover","5% of net worldwide turnover","€10 million fixed fine","€100 million or 2% of global turnover, whichever is higher"],exps:["❌ 1% is below the CSDDD maximum.","✅ Correct — pecuniary sanctions under the CSDDD can reach up to 5% of net worldwide turnover.","❌ A fixed fine of €10 million is not the CSDDD maximum.","❌ The CSDDD uses 5% of net worldwide turnover, not a €100 million/2% formula."],correct:1,slide:"Slide 16"},
{q:"The ESG Ratings Regulation (EU 2024/3005) requires EU-established ESG rating providers to obtain authorisation from:",opts:["The national competent authority of their home Member State","ESMA — and they must maintain independence and impartiality, use rigorous methodologies, manage conflicts of interest, and are prohibited from combining ratings with certain advisory and financial services","EBA — as ESG ratings are considered equivalent to credit ratings","The European Commission — as ESG ratings affect EU sustainable finance policy"],exps:["❌ EU-established ESG rating providers must obtain authorisation from ESMA, not national authorities.","✅ Correct — EU-established providers must obtain ESMA authorisation and comply with independence, methodology, and conflict of interest requirements.","❌ EBA covers banking; ESG rating providers are supervised by ESMA.","❌ The Commission sets policy; ESMA grants authorisation."],correct:1,slide:"Slide 16"},
{q:"The European Green Bond Standard (Regulation EU 2023/2631) requires proceeds to be:",opts:["Certified as green by ESMA before issuance","Fully allocated to environmentally sustainable economic activities under the Taxonomy Regulation before maturity","Used for at least 50% renewable energy projects","Invested exclusively in EU Member State infrastructure projects"],exps:["❌ ESMA does not certify proceeds as green before issuance.","✅ Correct — European green bond proceeds must be fully allocated to environmentally sustainable economic activities under the Taxonomy Regulation before maturity.","❌ A 50% renewable energy minimum is not the EuGB Standard requirement.","❌ EU Member State infrastructure is not the only eligible use."],correct:1,slide:"Slide 16"},
{q:"The three fundamental pillars of the European sustainable finance architecture are:",opts:["SFDR, Taxonomy Regulation, and CSRD","Taxonomy (common language for sustainable activities), mandatory reporting/disclosure, and implementation tools (benchmarks, standards, codes of conduct)","ESG ratings, green bonds, and climate transition plans","Article 8 products, Article 9 products, and the DNSH principle"],exps:["❌ SFDR, Taxonomy, and CSRD are specific legislative instruments, not the three fundamental pillars.","✅ Correct — the three pillars are: (1) the taxonomy as a common language; (2) mandatory reporting/disclosure; (3) implementation tools such as benchmarks, standards, and codes of conduct.","❌ ESG ratings, green bonds, and climate transition plans are instruments, not the three foundational pillars.","❌ Article 8/9 products and DNSH are elements of specific regulations."],correct:1,slide:"Slide 16"},
{q:"The Omnibus Directive proposal narrows mandatory CSRD reporting to:",opts:["All listed companies regardless of size","Large undertakings with more than 1,000 employees","All companies with more than €50 million in turnover","Only companies with more than 5,000 employees"],exps:["❌ The Omnibus Directive narrows scope significantly.","✅ Correct — the Omnibus Directive proposal limits mandatory CSRD reporting to large undertakings with more than 1,000 employees.","❌ The €50 million turnover threshold is not the Omnibus Directive criterion.","❌ The threshold is 1,000 employees, not 5,000."],correct:1,slide:"Slide 16"}
,
{q:"The three obstacles to sustainable finance identified in the EU Action Plan (2018) are:",opts:["Insufficient capital, inadequate regulation, and lack of consumer demand", "Fragmented standards (absence of unified taxonomy), data complexity (collecting and analysing sustainability data), and regulatory integration challenges", "Greenwashing risk, inadequate penalties, and lack of international coordination", "Short-termism, insufficient ESG research, and inadequate sustainable bond markets"],exps:["❌ Insufficient capital and consumer demand are not the three obstacles identified.", "✅ Correct — the three obstacles are: (1) fragmented standards and absence of a common taxonomy; (2) data complexity; (3) regulatory integration challenges.", "❌ Greenwashing risk is a result of fragmented standards, not itself one of the three main obstacles.", "❌ Short-termism and insufficient research are related issues but not the three obstacles identified."],correct:1,slide:"Slide 16"},
{q:"The Taxonomy Regulation's Article 8 disclosure obligation requires CSRD-subject companies to:",opts:["Only disclose whether they have a sustainability strategy", "Report the percentage of their turnover and capital/operating expenditure attributable to taxonomy-aligned (sustainable) activities", "Obtain third-party certification of taxonomy alignment before disclosure", "Disclose only when 100% of their activities are taxonomy-aligned"],exps:["❌ A general sustainability strategy disclosure is insufficient.", "✅ Correct — Article 8 requires CSRD-subject entities to report the percentage of turnover and capital/operating expenditure on taxonomy-aligned activities.", "❌ Third-party certification is not required for taxonomy alignment disclosure.", "❌ Disclosure is required regardless of the alignment percentage; even 0% alignment must be disclosed."],correct:1,slide:"Slide 16"},
{q:"The SFDR requires financial market participants to disclose policies on:",opts:["Their own carbon footprint and net-zero plans", "Integration of sustainability risks, whether and how principal adverse impacts (PAIs) are considered, and how remuneration policies align with sustainability risk integration", "Only product-level ESG ratings from EU-registered ESG rating agencies", "Only information about Article 9 sustainable investment products"],exps:["❌ Own carbon footprint disclosure is addressed by CSRD, not SFDR.", "✅ Correct — SFDR requires financial market participants to disclose: policies on integrating sustainability risks; whether and how PAIs are considered; and how remuneration policies align with sustainability risk integration.", "❌ SFDR does not require disclosure of ESG ratings from registered agencies.", "❌ SFDR disclosure requirements apply to all financial market participants."],correct:1,slide:"Slide 16"},
{q:"The CSDDD's complaints mechanisms must:",opts:["Be exclusively internal mechanisms accessible only to employees", "Establish accessible channels for complaints and notifications accessible to persons potentially affected by companies' adverse human rights and environmental impacts", "Be maintained only during CSDDD compliance audits", "Be limited to environmental complaints and not extend to human rights issues"],exps:["❌ Complaints mechanisms must be accessible to external affected persons, not only employees.", "✅ Correct — complaints mechanisms must establish accessible channels for complaints and notifications accessible to persons potentially affected by companies' adverse human rights and environmental impacts.", "❌ Complaints mechanisms are ongoing, not only active during audits.", "❌ The CSDDD covers both human rights and environmental adverse impacts."],correct:1,slide:"Slide 16"}
,
{q:"The first Climate Delegated Act (EU 2021/2139) established technical criteria for which environmental objectives?",opts:["All six environmental objectives simultaneously", "Only climate change mitigation and climate change adaptation — the four remaining objectives were addressed in a later delegated act (November 2023)", "Only climate change mitigation", "Only pollution prevention and biodiversity protection"],exps:["❌ All six objectives were not addressed simultaneously; the Climate Delegated Act covered only two.", "✅ Correct — the first Climate Delegated Act (EU 2021/2139) established technical criteria for climate change mitigation and climate change adaptation only. The four remaining environmental objectives were addressed by the Environmental Delegated Act (EU 2023/2485) in November 2023.", "❌ Only climate change mitigation is incomplete; adaptation was also covered in the first Climate Delegated Act.", "❌ Pollution prevention and biodiversity were addressed in the later Environmental Delegated Act (November 2023)."],correct:1,slide:"Slide 16"},
{q:"The CSRD requires companies to prepare sustainability reports using:",opts:["Voluntary reporting frameworks chosen freely by each company", "Mandatory EU Sustainability Reporting Standards (ESRS) — with the first set of sector-agnostic ESRS adopted in July 2023 and sector-specific standards to be adopted by June 2026", "GRI (Global Reporting Initiative) standards as the mandatory EU framework", "Either ESRS or IFRS Sustainability Standards, at the company's choice"],exps:["❌ Voluntary reporting frameworks are insufficient under CSRD; mandatory ESRS apply.", "✅ Correct — the CSRD requires use of mandatory EU Sustainability Reporting Standards (ESRS); the first set of sector-agnostic ESRS was adopted in July 2023, with sector-specific standards to be adopted by June 2026.", "❌ GRI is not the mandatory EU framework; the EU has its own ESRS.", "❌ Companies do not have a choice between ESRS and IFRS Sustainability Standards; ESRS are the mandatory EU standard."],correct:1,slide:"Slide 16"},
