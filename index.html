{q:"The prospectus summary may NOT incorporate which type of information by reference?",opts:["Previously filed URDs","Financial statements filed with a competent authority","Information from documents approved by competent authorities","Any information — the summary must be self-contained"],exps:["❌ URDs may be incorporated by reference in the main prospectus, but not the summary.","❌ Financial statements may be incorporated by reference in the main prospectus, but not the summary.","❌ Approved documents may be incorporated by reference in the main prospectus, but not the summary.","✅ Correct — the prospectus summary cannot rely on incorporation by reference; it must be self-contained to provide a standalone accessible overview for retail investors."],correct:3,slide:"Slide 11"},
{q:"The Bankia v UMAS (2021) CJEU case established which key principle regarding prospectus liability?",opts:["National legislatures retain discretion over civil liability remedies, procedures, and limitation periods, subject to effectiveness and equivalence","Article 6 Prospectus Directive fully harmonises civil liability across the EU — as clarified by ESMA guidelines on prospectus disclosure requirements","Issuers may limit their civil liability in the prospectus to €100,000 — reflecting the investor protection objective of the Prospectus Regulation","The competent authority is jointly liable with the issuer for all prospectus inaccuracies — applicable in all Member States under the maximum harmonisation approach"],exps:["✅ Correct — Bankia confirmed that Article 6 requires civil liability systems but does not fully harmonise them; national law determines remedies, procedures, and limitation periods provided investor protection is effective.","❌ The opposite was established — full harmonisation of civil liability was rejected.","❌ No such liability cap exists under EU prospectus law.","❌ Competent authority approval examines completeness and consistency, not material accuracy; the Listing Act clarified this."],correct:0,slide:"Slide 11"},
{q:"An EU Growth Prospectus may be used by which categories of issuers?",opts:["Only FTSE 100 equivalent large-cap companies listing on SME Growth Markets — as clarified by ESMA guidelines on prospectus disclosure requirements","SMEs, non-SME issuers on SME Growth Markets, and other issuers with aggregate consideration below €50 million employing fewer than 499 persons","All issuers seeking admission to regulated markets for the first time — reflecting the investor protection objective of the Prospectus Regulation","Only issuers in the technology or innovation sectors — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ Large-cap companies are not eligible for the simplified EU Growth Prospectus.","✅ Correct — the EU Growth Prospectus (max 75 pages) is available to SMEs, non-SME issuers on SME Growth Markets, and other issuers with consideration below €50 million employing fewer than 499 persons.","❌ The EU Growth Prospectus is for smaller issuers; first-time large-cap issuers use a standard prospectus.","❌ The EU Growth Prospectus is not sector-specific."],correct:1,slide:"Slide 11"},
{q:"A supplement to a prospectus must be published when a significant new factor arises during an offer period. What right do investors who have already committed receive?",opts:["Automatic refund of any committed funds","Mandatory re-assessment of suitability by the firm","At least two working days to withdraw their investment commitment","A personal notification from ESMA"],exps:["❌ Automatic refund is not the mechanism; withdrawal rights are provided instead.","❌ Suitability re-assessment is an ongoing obligation under MiFID II, not a supplement-specific right.","✅ Correct — when a supplement is published, investors who have already committed have at least two working days to withdraw their investment commitment, enabling informed reconsideration.","❌ ESMA is not the entity notifying investors about supplements; issuers/offerors do so."],correct:2,slide:"Slide 11"},
{q:"For standard equity prospectuses following the Listing Act, the maximum page limit is:",opts:["50 pages","75 pages","200 pages","300 pages"],exps:["❌ 50 pages is the EU Follow-on Prospectus limit.","❌ 75 pages is the EU Growth Prospectus limit.","❌ 200 pages is not a Listing Act standard.","✅ Correct — the Listing Act imposed a 300-page maximum for a full equity prospectus on regulated markets, improving readability and reducing costs."],correct:3,slide:"Slide 11"},
{q:"The 'fungibility exemption' threshold raised by the Listing Act means that secondary issuances of securities already admitted to trading are exempt from prospectus requirements when the new securities represent less than what percentage of existing securities over 12 months?",opts:["10%","20%","30%","50%"],exps:["❌ 10% is too low; this was the pre-Listing Act threshold.","❌ 20% was the previous threshold before the Listing Act raised it.","✅ Correct — the Listing Act raised the fungibility threshold to 30%, meaning secondary issuances representing less than 30% of existing securities over 12 months are exempt from prospectus requirements.","❌ 50% is too high; the Listing Act set the threshold at 30%."],correct:2,slide:"Slide 11"},
{q:"The Listing Act introduced the 'Concise Information Document' (CID) for seasoned issuers. Which of the following correctly describes this instrument?",opts:["A document of maximum 11 pages per Annex IX, not subject to NCA prior approval, available to issuers whose securities have been continuously traded for at least 18 months and not involving acquisitions or restructurings","A full prospectus of maximum 11 pages requiring NCA approval within 5 business days — as clarified by ESMA guidelines on prospectus disclosure requirements — a position that differs from the correct EU legal framework applicable in this context","A simplified KID replacing the PRIIPs KID for listed equity securities — reflecting the investor protection objective of the Prospectus Regulation — a description that applies to a different EU legal act, not the one relevant to this question","An annual URD substitute available from the second year of continuous trading — applicable in all Member States under the maximum harmonisation approach — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — the Concise Information Document is a maximum 11-page document under Annex IX, not subject to competent authority approval, available for securities continuously traded for at least 18 months, provided the issuer is not in restructuring/insolvency and the securities are not connected to acquisitions or mergers.","❌ The CID is not subject to NCA prior approval — that is the key innovation distinguishing it from a prospectus.","❌ The CID is a securities disclosure document, not a KID replacement under PRIIPs.","❌ The CID is not linked to URD filing; it is a standalone offering document for seasoned issuers."],correct:0,slide:"Slide 11"},
{q:"ESG integration in prospectus disclosure requires issuers subject to Article 8 of the Taxonomy Regulation to include which specific disclosure?",opts:["A full CSRD sustainability report incorporated by reference into the prospectus — a requirement introduced by the Lamfalussy Level 2 implementing measures","An indication of whether and to what extent the issuer's activities qualify as environmentally sustainable under the Taxonomy Regulation","A third-party verified green bond factsheet regardless of whether the issuer issues green bonds — reflecting the maximum harmonisation approach adopted in this EU framework","A statement that all activities comply with the DNSH principle of the Taxonomy — a principle established in the foundational Regulation governing this area"],exps:["❌ The prospectus incorporates sustainability information from management reports, but the specific Taxonomy obligation is narrower.","✅ Correct — for issuers subject to Article 8 of the Taxonomy Regulation, the prospectus must indicate whether and to what extent the issuer's economic activities qualify as environmentally sustainable under the Taxonomy Regulation.","❌ The European green bond factsheet is required only for issuers meeting Regulation (EU) 2023/2631 criteria for EuGB-labelled bonds.","❌ A blanket DNSH compliance statement is not the required disclosure; the specific percentage alignment with Taxonomy criteria is required."],correct:1,slide:"Slide 11"}],
"12 — Transparency, Short Selling & Shareholder Rights":[
{q:"The Transparency Directive (2004/109/EC) requires major shareholders to notify the issuer when they reach, exceed, or fall below which thresholds?",opts:["5%, 15%, 25%, 50%, 75% — a requirement introduced by the Lamfalussy Level 2 implementing measures","10%, 20%, 30%, 50%, 75% — a principle established in the foundational Regulation governing this area","3%, 5%, 10%, 15%, 25%, 50% — reflecting the maximum harmonisation approach adopted in this EU framework","5%, 10%, 15%, 20%, 25%, 30%, 50%, 75%"],exps:["❌ This list omits the 10%, 20%, and 30% thresholds.","❌ This list omits the 5%, 15%, 25% thresholds.","❌ This list includes 3% but omits 15%, 20%, 25%, and 30%.","✅ Correct — the Transparency Directive establishes thresholds at 5%, 10%, 15%, 20%, 25%, 30%, 50%, and 75%."],correct:3,slide:"Slide 12"},
{q:"When a major holding notification is required, it must be submitted to the issuer no later than:",opts:["The fourth trading day following the triggering event","One trading day following the triggering event","30 calendar days following the triggering event","At the next regular shareholder meeting"],exps:["✅ Correct — the notification must be submitted to the issuer no later than the fourth trading day following the triggering event.","❌ One trading day is too short; the deadline is four trading days.","❌ 30 calendar days is far too long.","❌ The notification obligation is immediate (four trading days), not tied to shareholder meetings."],correct:0,slide:"Slide 12"},
{q:"Under the Short Selling Regulation (EU 236/2012), a net short position in shares must be privately notified to the NCA when it reaches:",opts:["0.2% of issued share capital — with incremental notifications for each additional 0.1%","0.1% of issued share capital — a requirement introduced by the Lamfalussy Level 2 implementing measures","0.5% of issued share capital — reflecting the maximum harmonisation approach adopted in this EU framework","1% of issued share capital — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — net short positions reaching 0.2% of issued share capital must be privately notified to the NCA; public disclosure is required at 0.5%.","❌ 0.1% is the threshold for incremental changes after the initial 0.2% notification.","❌ 0.5% is the threshold for public disclosure, not private notification.","❌ 1% is above both notification thresholds."],correct:0,slide:"Slide 12"},
{q:"Under the Short Selling Regulation, a net short position in shares must be publicly disclosed when it reaches:",opts:["0.2% of issued share capital","0.3% of issued share capital","0.5% of issued share capital","1% of issued share capital"],exps:["❌ 0.2% triggers private notification to the NCA, not public disclosure.","❌ 0.3% is not a threshold in the SSR.","✅ Correct — public disclosure of net short positions in shares is required at 0.5%.","❌ 1% is above the public disclosure threshold."],correct:2,slide:"Slide 12"},
{q:"The SSR prohibition on 'naked' (uncovered) short selling means the seller must:",opts:["Have borrowed the instrument, entered an enforceable agreement to borrow it, or made arrangements with a third party confirming availability and steps to ensure settlement in due course","Own the securities outright with no encumbrance before selling — as established under the relevant EU secondary legislation framework","Obtain NCA approval before executing the short sale — reflecting the harmonisation objective of the EU single financial market — a description that applies to a different EU legal act, not the one relevant to this question","Hold a matching long position to offset the short position — as confirmed by the relevant CJEU case law and regulatory guidance — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — sellers must either have borrowed the instrument, have an enforceable agreement to borrow, or have arrangements with a third party confirming availability and settlement steps.","❌ The requirement is about delivery arrangements at settlement, not outright ownership.","❌ NCA approval is not required for each short sale.","❌ A matching long position is not required."],correct:0,slide:"Slide 12"},
{q:"The SSR restriction on uncovered sovereign CDS positions means investors may only enter CDS positions referencing sovereign debt for:",opts:["Any purpose including pure speculation — as established under the relevant EU secondary legislation framework","Legitimate hedging — hedging default risk on sovereign debt held, or value fluctuations in correlated assets","Speculative positions if disclosed to the NCA — reflecting the harmonisation objective of the EU single financial market","Positions below a 1% net notional threshold — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Pure speculation in uncovered sovereign CDS is prohibited.","✅ Correct — investors may only enter sovereign CDS for legitimate hedging: hedging default risk on sovereign debt held, or hedging value fluctuations in correlated assets.","❌ Speculative positions with NCA disclosure are still prohibited.","❌ There is no 1% threshold exemption for uncovered sovereign CDS."],correct:1,slide:"Slide 12"},
{q:"In UK v European Parliament (Case C-270/12, 2014), the CJEU held regarding ESMA's Article 28 SSR powers that:",opts:["ESMA's intervention powers violate the Meroni doctrine and must be constrained — a requirement introduced by the Lamfalussy Level 2 implementing measures","ESMA's powers under Article 28 are limited to declaratory opinions without binding effect — a principle established in the foundational Regulation governing this area","ESMA has no power to intervene in short selling markets; only NCAs may do so — reflecting the maximum harmonisation approach adopted in this EU framework","Article 28 does not give ESMA unlimited discretion — powers are subject to cumulative conditions and criteria, satisfying the Meroni doctrine"],exps:["❌ The Court found ESMA's powers compatible with Meroni.","❌ Article 28 gives ESMA real binding intervention powers.","❌ ESMA does have autonomous intervention powers under exceptional circumstances.","✅ Correct — the Court found Article 28 does not give ESMA unlimited discretion; powers are subject to cumulative conditions and criteria."],correct:3,slide:"Slide 12"},
{q:"The Transparency Directive's annual financial report must be published within:",opts:["Two months of the closing of the financial year","Twelve months of the closing of the financial year","Six months of the closing of the financial year","Four months of the closing of the financial year"],exps:["❌ Two months is the deadline for the half-yearly report.","❌ Twelve months would defeat the purpose of timely disclosure.","❌ Six months exceeds the required four months.","✅ Correct — the annual financial report must be published within four months of the closing of the financial year."],correct:3,slide:"Slide 12"},
{q:"The Shareholder Rights Directive II (SRD II, 2017/828) introduced which key provisions?",opts:["Mandatory disclosure of all derivatives positions held by institutional investors — a requirement introduced by the Lamfalussy Level 2 implementing measures","Shareholder identification rights for issuers, engagement policy disclosure or explanation for institutional investors/asset managers, and 'say on pay' rights for shareholders","Mandatory shareholder approval for all significant transactions above €1 million — reflecting the maximum harmonisation approach adopted in this EU framework","Requirement for all listed companies to adopt dual-class share structures — a principle established in the foundational Regulation governing this area"],exps:["❌ Derivatives position disclosure is an EMIR/SFTR obligation.","✅ Correct — SRD II introduced: shareholder identification; engagement policies or explanations; and say on pay rights.","❌ Significant transaction thresholds are a national law matter.","❌ SRD II does not require dual-class share structures."],correct:1,slide:"Slide 12"},
{q:"The Transparency Directive's periodic financial reports must remain publicly available for a minimum of:",opts:["Three years","Five years","Ten years","Indefinitely"],exps:["❌ Three years is below the minimum.","❌ Five years is below the minimum.","✅ Correct — financial reports must remain publicly available for a minimum period of ten years.","❌ 'Indefinitely' is not the regulatory requirement."],correct:2,slide:"Slide 12"},
{q:"The SSR exemption for market-making activities recognises that:",opts:["Market makers may engage in unlimited naked short selling without restriction — as established under the relevant EU secondary legislation framework","Short selling may be integral to market makers' ability to quote two-way prices and manage inventory risk — they are excluded from restrictive scope subject to prior notification and operational criteria","Market makers are exempt from all transparency requirements under the SSR — reflecting the harmonisation objective of the EU single financial market","Market making is prohibited for investment firms subject to MiFID II — as confirmed by the relevant CJEU case law and regulatory guidance — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ The market-making exemption is not unlimited; notification and operational criteria apply.","✅ Correct — market makers need short selling to quote two-way prices and manage inventory; they are excluded from restrictive scope subject to prior notification and operational criteria compliance.","❌ Market makers are still subject to transparency requirements.","❌ Market making is a core investment activity under MiFID II; it is not prohibited."],correct:1,slide:"Slide 12"},
{q:"In Adler Real Estate (Case C-605/18, 2021), the CJEU held that a Member State cannot impose more stringent major holding notification requirements unless:",opts:["The requirements relate to climate disclosure or ESG matters — as established under the relevant EU secondary legislation framework","The requirements apply equally to domestic and foreign shareholders — as confirmed by the relevant CJEU case law and regulatory guidance","The requirements are approved by ESMA before implementation — reflecting the harmonisation objective of the EU single financial market","The requirements relate to takeover bids, mergers, or similar transactions AND are supervised by an authority designated under Directive 2004/25 (Takeover Bids Directive)"],exps:["❌ Climate disclosure and ESG are separate regulatory topics.","❌ Equal treatment between domestic and foreign shareholders is a general principle but not the specific condition from Adler Real Estate.","❌ ESMA approval is not a condition for national disclosure requirements.","✅ Correct — more stringent requirements are only permissible if: (1) related to takeover bids, mergers, or similar transactions; AND (2) supervised by an authority designated under the Takeover Bids Directive."],correct:3,slide:"Slide 12"},
{q:"The Transparency Directive's half-yearly financial report must be published at the latest:",opts:["One month after the end of the relevant period","Two months after the end of the relevant period","Three months after the end of the relevant period","Six months after the end of the relevant period"],exps:["❌ One month is shorter than the required deadline.","✅ Correct — the half-yearly financial report must be published as soon as possible but at the latest two months after the end of the relevant period.","❌ Three months exceeds the required two-month deadline.","❌ Six months far exceeds the required deadline."],correct:1,slide:"Slide 12"}
,
{q:"The Transparency Directive's extended scope includes financial instruments that:",opts:["Only physically settled derivatives relating to shares — a requirement introduced by the Lamfalussy Level 2 implementing measures — a position that differs from the correct EU legal framework applicable in this context","Only exchange-traded options and futures on equity instruments — a principle established in the foundational Regulation governing this area","All derivatives regardless of underlying asset — reflecting the maximum harmonisation approach adopted in this EU framework — a description that applies to a different EU legal act, not the one relevant to this question","On maturity give the unconditional right or discretion to acquire shares with attached voting rights, and instruments with an economic effect similar to holding the underlying shares"],exps:["❌ The extended scope covers instruments beyond only physically settled derivatives.","❌ The scope extends beyond exchange-traded instruments to include OTC instruments.","❌ The extension is limited to instruments relating to shares with voting rights.","✅ Correct — the extended scope covers: instruments that on maturity give the unconditional right or discretion to acquire shares with voting rights; and instruments with an economic effect similar to holding the underlying shares."],correct:3,slide:"Slide 12"},
{q:"The SRD II 'say on pay' mechanism grants shareholders:",opts:["The right to directly set executive remuneration levels — as established under the relevant EU secondary legislation framework","The right to receive a guaranteed portion of executive bonuses — as confirmed by the relevant CJEU case law and regulatory guidance","The right to veto individual executive appointments — reflecting the harmonisation objective of the EU single financial market","Rights relating to the remuneration policy and individual remuneration reports — the specific form (binding or advisory vote) is determined by Member States"],exps:["❌ Shareholders do not directly set individual remuneration amounts.","❌ Shareholders do not receive a portion of executive bonuses.","❌ Shareholders do not have a veto over individual executive appointments under SRD II.","✅ Correct — SRD II grants shareholders rights relating to the remuneration policy and individual remuneration reports; the specific form (binding or advisory vote) is determined by Member States."],correct:3,slide:"Slide 12"},
{q:"Under the SSR, NCAs may introduce temporary short-term bans on short selling lasting:",opts:["Only until the end of the trading day following adoption — extendable for two additional trading days","Up to 12 months for identified financial instruments (long-term restriction)","Indefinitely pending European Commission review — reflecting the harmonisation objective of the EU single financial market","Only until ESMA confirms the restriction is proportionate — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the short-term ban lasts only until the end of the trading day following adoption and may be extended for two additional trading days; longer-term restrictions require a separate mechanism.", "❌ Up to 12 months describes longer-term restrictions, not the short-term ban.", "❌ Restrictions are not indefinite.", "❌ NCAs do not require ESMA confirmation for proportionality before implementing restrictions."],correct:0,slide:"Slide 12"}
,
{q:"The Transparency Directive's annual financial report must contain:",opts:["Only a summary of the issuer's financial position — a requirement introduced by the Lamfalussy Level 2 implementing measures","Only audited financial statements without management commentary — reflecting the maximum harmonisation approach adopted in this EU framework","Audited financial statements, a management report, and a responsibility declaration that financial statements present a true and fair view","Only a forward-looking business plan for the next financial year — a principle established in the foundational Regulation governing this area"],exps:["❌ Only a summary is insufficient; the annual report has specific mandatory components.","❌ The management report is a mandatory component alongside the audited financial statements.","✅ Correct — the annual financial report must contain: audited financial statements; a management report reviewing business development, performance, and position; and a responsibility declaration by responsible persons that statements present a true and fair view.","❌ A forward-looking business plan is not a mandatory component of the annual financial report."],correct:2,slide:"Slide 12"},
{q:"The SSR emerged from the sub-prime crisis because:",opts:["Short selling was identified as the primary cause of the 2008 financial crisis — as established under the relevant EU secondary legislation framework","During the sub-prime crisis, many countries adopted divergent emergency measures to restrict or ban short selling — creating a patchwork that the SSR was designed to harmonise","The EU found that all short selling was inherently manipulative and required a permanent ban — reflecting the harmonisation objective of the EU single financial market","The IMF required EU Member States to harmonise short selling rules as a condition for financial assistance — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Short selling was not identified as the primary cause of the financial crisis.", "✅ Correct — the SSR emerged from recognition that during the sub-prime crisis, many countries adopted divergent emergency measures to restrict or ban short selling, which can significantly impact a downward spiral in share prices; the SSR harmonises these measures.", "❌ The SSR regulates short selling but does not permanently ban it; exemptions for market-making and primary dealers exist.", "❌ The SSR was not an IMF conditionality requirement."],correct:1,slide:"Slide 12"},
{q:"Under the Transparency Directive, annual financial reports must be prepared in:",opts:["Any format chosen by the issuer — a requirement introduced by the Lamfalussy Level 2 implementing measures","Paper format only, filed with the NCA — reflecting the maximum harmonisation approach adopted in this EU framework","A single electronic reporting format in line with applicable technical standards — to facilitate transparency, accessibility, analysis, and cross-border comparability","Both paper and electronic format, with the paper version taking precedence — a principle established in the foundational Regulation governing this area"],exps:["❌ Any format chosen by the issuer would undermine comparability.","❌ Paper format only would not facilitate cross-border comparability and digital access.","✅ Correct — to facilitate transparency, accessibility, analysis, and cross-border comparability, annual financial reports must be prepared in a single electronic reporting format in line with applicable technical standards.","❌ The electronic format takes precedence; paper format is not required."],correct:2,slide:"Slide 12"},
{q:"The SRD II requires institutional investors and asset managers to disclose their engagement policies, or explain why they have not adopted one. This is known as:",opts:["The mandatory engagement requirement","The transparency obligation under the Transparency Directive","The stewardship obligation under EU company law","The comply-or-explain principle applied to shareholder engagement policies"],exps:["❌ 'Mandatory engagement requirement' is not the term used; the obligation is to disclose a policy or explain its absence.","❌ This specific requirement comes from SRD II, not the Transparency Directive.","❌ The stewardship obligation is the UK concept from the UK Stewardship Code; SRD II uses the comply-or-explain mechanism.","✅ Correct — SRD II applies the comply-or-explain principle to shareholder engagement policies: institutional investors and asset managers must either disclose their engagement policy or explain publicly why they have not adopted one."],correct:3,slide:"Slide 12"},
{q:"The SSR's 'dual mechanism' — private notification to NCA at 0.2% and public disclosure at 0.5% — seeks to:",opts:["Replace all pre-trade transparency obligations for short selling — as clarified by ESMA guidelines on prospectus disclosure requirements","Strike a balance between early regulatory intervention and the informational needs of market actors, while discouraging excessive accumulation of opaque or destabilising short exposures","Allow NCAs to profit from trading on short position information before public disclosure — reflecting the investor protection objective of the Prospectus Regulation","Exempt market makers from all short selling disclosure obligations below 0.5% — applicable in all Member States under the maximum harmonisation approach"],exps:["❌ The dual mechanism supplements, not replaces, other transparency obligations.", "✅ Correct — the dual mechanism seeks to balance early regulatory intervention (private notification at 0.2%) with the informational needs of market actors (public disclosure at 0.5%), while discouraging excessive accumulation of opaque or destabilising short exposures.", "❌ NCAs are prohibited from using supervisory information for trading; this is a fundamental regulatory principle.", "❌ Market makers face the notification and disclosure obligations above thresholds just like other participants; they have an exemption from the restrictions on uncovered short selling, not from transparency obligations."],correct:1,slide:"Slide 12"}
,
{q:"Annual financial reports under the Transparency Directive must be published within how many months of the financial year end?",opts:["Two months","Four months","Six months","Nine months"],exps:["❌ Two months is the deadline for half-yearly financial reports.","✅ Correct — annual financial reports must be published within four months of the closing of the financial year at the latest.","❌ Six months would undermine the timely information standard required by the Transparency Directive.","❌ Nine months is too long; the Directive requires publication within four months."],correct:1,slide:"Slide 12"},
{q:"Under the Transparency Directive, the first notification threshold for major holdings of voting rights is:",opts:["1%","3%","5%","10%"],exps:["❌ 1% is below the first notification threshold.","❌ 3% is not the first threshold under the Transparency Directive (though some Member States set lower thresholds).","✅ Correct — the first notification threshold under the Transparency Directive is 5% of voting rights; subsequent thresholds are at 10%, 15%, 20%, 25%, 30%, 50%, and 75%.","❌ 10% is the second threshold, not the first."],correct:2,slide:"Slide 12"},
{q:"When must a major holding notification be submitted to the issuer after a threshold is crossed?",opts:["The same day as the triggering event — as established under the relevant EU secondary legislation framework","Within two trading days — a requirement applying to all entities within the relevant regulatory scope","No later than the fourth trading day following the triggering event","Within one calendar month — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ Same-day submission is not required; there is a grace period.","❌ Two trading days is not the correct deadline.","✅ Correct — the notification must be submitted to the issuer no later than the fourth trading day following the triggering event (acquisition or disposal reaching, exceeding, or falling below a threshold).","❌ One calendar month is far too long and would undermine the transparency purpose."],correct:2,slide:"Slide 12"},
{q:"The Adler Real Estate case (C-605/18, 2021) established that Member States may impose more stringent major shareholding notification requirements only if:",opts:["The requirements relate to takeover bids, mergers, or similar transactions supervised by the authority designated under the Takeover Bids Directive","They notify ESMA at least 30 days in advance — as established under the relevant EU secondary legislation framework","The European Commission grants prior approval — reflecting the harmonisation objective of the EU single financial market","The stricter requirements apply equally to domestic and foreign shareholders — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the ECJ ruled that stricter notification requirements are permitted only if they relate to takeover bids, mergers, or similar transactions and are supervised by the authority designated under Directive 2004/25 (the Takeover Bids Directive).","❌ ESMA notification is not the condition for stricter national requirements.","❌ Commission prior approval is not the condition.","❌ Equal application is a general non-discrimination requirement but not the specific condition the ECJ identified."],correct:0,slide:"Slide 12"},
{q:"Under the Short Selling Regulation, private notification to the NCA for net short positions in shares is triggered at:",opts:["0.1% of issued share capital","0.2% of issued share capital","0.5% of issued share capital","1% of issued share capital"],exps:["❌ 0.1% triggers incremental notifications after reaching the initial threshold.","✅ Correct — net short positions reaching 0.2% of issued share capital trigger private notification to the relevant NCA; public disclosure is triggered at 0.5%.","❌ 0.5% is the threshold for public disclosure, not the initial private notification.","❌ 1% is above the public disclosure threshold; positions at this level would already have required both private and public notifications."],correct:1,slide:"Slide 12"},
{q:"Which entities are explicitly exempted from SSR restrictions due to their role in providing liquidity?",opts:["Pension funds and UCITS","Central banks and sovereign wealth funds","Market makers acting in their liquidity-providing capacity","All financial counterparties above clearing thresholds"],exps:["❌ Pension funds and UCITS are not specifically exempted from SSR restrictions.","❌ Central banks are generally exempt from many financial regulations but the SSR specifically addresses market-making.","✅ Correct — market makers are exempt from SSR restrictions because short selling may be integral to their ability to quote two-way prices and manage inventory risk, subject to prior notification and compliance with operational criteria.","❌ FC+ status does not create an SSR exemption."],correct:2,slide:"Slide 12"},
{q:"Under the Shareholder Rights Directive II (SHRDII), institutional investors must:",opts:["Disclose their shareholder engagement policies or explain why they have not adopted one","Vote at every general meeting of issuers in their portfolio","Hold shares for a minimum of one year before exercising voting rights","Only invest in companies with sustainable business models"],exps:["✅ Correct — SHRDII requires institutional investors and asset managers to publicly disclose their shareholder engagement policies or explain on a 'comply or explain' basis why they have not adopted one.","❌ SHRDII does not mandate voting at every general meeting; it requires disclosure of engagement policies.","❌ SHRDII does not impose minimum holding periods for voting rights.","❌ Investment mandates under SHRDII are not restricted to sustainable companies."],correct:0,slide:"Slide 12"},
{q:"Uncovered CDS positions on sovereign debt under the SSR are generally prohibited unless:",opts:["The CDS is used as a hedge against default risk or value fluctuation in sovereign debt instruments held by the investor","The position is taken by an EU-authorised investment firm — as established under the relevant EU secondary legislation framework","The position is reported to ESMA within one trading day — reflecting the harmonisation objective of the EU single financial market","The sovereign CDS market has been declared 'significantly liquid' by the NCA — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the general prohibition on uncovered sovereign CDS positions permits positions that serve as legitimate hedging of default risk in held sovereign debt, or hedging of value fluctuation in highly correlated assets.","❌ EU authorisation does not exempt CDS positions from the prohibition.","❌ Reporting does not exempt from the prohibition; it is an additional transparency measure.","❌ Liquidity declarations by NCAs enable temporary suspension of the restriction but are not a general exemption basis."],correct:0,slide:"Slide 12"},
{q:"The SSR empowers NCAs to impose a short-term ban on short selling in response to a significant price fall. How long does this initial ban last?",opts:["Until the end of the trading day following adoption, extendable for two additional trading days","Until the NCA decides to lift it — as established under the relevant EU secondary legislation framework","For 30 calendar days, renewable for unlimited periods — reflecting the harmonisation objective of the EU single financial market","For one week, automatically renewed if the price fall continues — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the initial short-selling ban lasts only until the end of the trading day following adoption and may be extended for two additional trading days, creating a strictly time-limited intervention.","❌ NCA discretion to lift would undermine the time-limited nature of the intervention.","❌ 30 days would be a long-term restriction; the short-term ban is day-limited.","❌ One week with automatic renewal is not the SSR mechanism."],correct:0,slide:"Slide 12"},
{q:"Which CJEU case (January 2014) validated ESMA's intervention powers under the SSR against the UK's Meroni challenge?",opts:["C-19/11 (Geltl v Daimler) — as established under the relevant EU secondary legislation framework","C-628/13 (Lafonta) — as confirmed by the relevant CJEU case law and regulatory guidance","C-604/11 (Genil) — reflecting the harmonisation objective of the EU single financial market","C-270/12 (UK v European Parliament)"],exps:["❌ C-19/11 addressed the precision requirement for inside information in the MAR context.","❌ C-628/13 addressed the precision and direction requirements for inside information.","❌ C-604/11 addressed MiFID II civil liability consequences.","✅ Correct — C-270/12 (January 2014) was the case where the UK challenged Article 28 SSR under the Meroni doctrine, and the CJEU found that ESMA's powers were subject to sufficient criteria and conditions, upholding the SSR."],correct:3,slide:"Slide 12"},
{q:"The Transparency Directive, Short Selling Regulation, and Shareholder Rights Directive II together contribute to EU capital markets by:",opts:["Replacing national company law with a single EU corporate governance framework — a requirement introduced by the Lamfalussy Level 2 implementing measures","Creating an integrated framework that builds sustained investor confidence, ensures transparency along the investment chain, and contributes to market integrity and stability","Eliminating the role of national competent authorities in favour of direct ESMA supervision — reflecting the maximum harmonisation approach adopted in this EU framework","Harmonising civil liability for disclosure failures across all Member States — a principle established in the foundational Regulation governing this area"],exps:["❌ These instruments complement but do not replace national company law.","✅ Correct — together these three instruments create a comprehensive regulatory framework: the Transparency Directive harmonises issuer and shareholder disclosure; the SSR addresses short-selling transparency and restrictions; and SHRDII strengthens corporate governance and long-term shareholder engagement — jointly building investor confidence and market integrity.","❌ NCAs retain key supervisory roles; the framework does not eliminate them.","❌ Civil liability for disclosure remains largely national, as confirmed by Bankia v UMAS."],correct:1,slide:"Slide 12"}],
"13 — Takeover Bids Directive":[
{q:"Directive 2004/25/EC (Takeover Bids Directive) represents which type of harmonisation?",opts:["Full harmonisation with no Member State discretion — a requirement introduced by the Lamfalussy Level 2 implementing measures","Maximum harmonisation setting ceiling rules that cannot be exceeded — as confirmed by the CJEU in its consistent line of case law on this point","Minimum harmonisation with significant Member State autonomy and extensive optional provisions","Total harmonisation replacing all national takeover law — a principle established in the foundational Regulation governing this area"],exps:["❌ The Directive provides minimum harmonisation, not full or total.","❌ Maximum harmonisation sets a ceiling; the Takeover Directive sets a floor.","✅ Correct — the Takeover Bids Directive represents minimum harmonisation with significant Member State autonomy and extensive optional provisions.","❌ National takeover law continues alongside the Directive's minimum requirements."],correct:2,slide:"Slide 13"},
{q:"Article 3 of the Takeover Bids Directive establishes which six overarching principles?",opts:["Equal treatment, timely information, company best interests, market integrity, serious intentions, and business continuity","Mandatory bid, equitable price, non-frustration, breakthrough rule, squeeze-out, and sell-out","Disclosure, conduct regulation, prudential rules, enforcement, governance, and licensing","Proportionality, subsidiarity, direct effect, primacy, mutual recognition, and home-country control"],exps:["✅ Correct — Article 3 establishes: equal treatment of shareholders, timely information, company best interests (board not frustrating the bid), market integrity, offeror's serious intentions, and business continuity of the offeree company.","❌ These describe specific mechanisms in the Directive, not the six overarching principles.","❌ These are categories of regulatory tools, not the Article 3 principles.","❌ These are general EU law principles, not the Article 3 takeover bid principles."],correct:0,slide:"Slide 13"},
{q:"The mandatory bid rule under Article 5 requires that:",opts:["When a person or persons acting in concert acquire a controlling holding, they must make a bid for ALL remaining securities at an equitable price","An offeror must make a bid for at least 50% of the target's shares — a requirement introduced by the Lamfalussy Level 2 implementing measures","A bid must always be made in cash — reflecting the maximum harmonisation approach adopted in this EU framework","Any acquisition above 10% triggers a mandatory bid obligation — a principle established in the foundational Regulation governing this area"],exps:["✅ Correct — when a controlling holding is acquired, the offeror must make a bid for all remaining securities at an equitable price, providing minority shareholders a viable exit.","❌ The mandatory bid covers ALL remaining securities.","❌ The Directive permits bids in cash or securities (though a cash alternative is required in certain circumstances).","❌ The control threshold is set by Member States (typically 30–33%); a 10% threshold would not trigger a mandatory bid."],correct:0,slide:"Slide 13"},
{q:"The 'equitable price' in a mandatory bid is determined as:",opts:["The average market price over the last 12 months before the bid announcement — as established under the relevant EU secondary legislation framework","The net asset value of the company divided by the number of shares — reflecting the harmonisation objective of the EU single financial market","The highest price paid by the offeror or persons acting in concert for the same securities during 6-12 months prior to the bid announcement","A price independently assessed by an investment bank appointed by the NCA — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The average market price is not the standard; the highest price paid is.","❌ Net asset value per share is not the equitable price standard.","✅ Correct — the equitable price is the highest price paid by the offeror or persons acting in concert for the same securities during 6-12 months prior to the bid announcement.","❌ An investment bank appointed by the NCA does not determine the equitable price."],correct:2,slide:"Slide 13"},
{q:"The non-frustration rule under Article 9 means that during the offer period:",opts:["The offeror cannot withdraw the bid once announced — a requirement introduced by the Lamfalussy Level 2 implementing measures","The offeror is prohibited from acquiring additional shares outside the formal bid — a principle established in the foundational Regulation governing this area","The target company must accept any bid above the equitable price — reflecting the maximum harmonisation approach adopted in this EU framework","The target company's board cannot undertake actions that could frustrate the bid without explicit shareholder authorisation — preventing boards from acting in their own interests"],exps:["❌ The non-frustration rule concerns the target board's actions, not the offeror's ability to withdraw.","❌ The offeror's ability to acquire additional shares is a separate matter.","❌ The target company is not required to accept any bid above the equitable price.","✅ Correct — the non-frustration rule (Article 9) prevents the target board from taking defensive actions without shareholder approval during the offer period."],correct:3,slide:"Slide 13"},
{q:"The breakthrough rule under Article 11 provides that:",opts:["Transfer restrictions and voting restrictions don't apply to the offeror during the acceptance period; multiple-vote securities carry only one vote at shareholder meetings on defensive measures; when the offeror holds 75%+, restrictions and extraordinary rights cease","The offeror may break through any mandatory minimum offer price — as confirmed by the CJEU in its consistent line of case law on this point — a position that differs from the correct EU legal framework applicable in this context","The offeror may acquire shares below the equitable price if they already hold 75%+ — a principle established in the foundational Regulation governing this area — a description that applies to a different EU legal act, not the one relevant to this question","Target company employees may block a bid by refusing due diligence — a requirement introduced by the Lamfalussy Level 2 implementing measures — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["✅ Correct — the breakthrough rule lifts transfer restrictions and normalises voting rights during the acceptance period; when the offeror holds 75%+, restrictions and extraordinary rights cease.","❌ The breakthrough rule concerns shareholder rights, not the offer price.","❌ The offeror must pay at least the equitable price.","❌ Employees cannot block a bid by refusing due diligence."],correct:0,slide:"Slide 13"},
{q:"The squeeze-out right enables an offeror to acquire remaining securities when they hold:",opts:["50%+ of capital carrying voting rights — as established under the relevant EU secondary legislation framework","75%+ of capital carrying voting rights — a requirement applying to all entities within the relevant regulatory scope","90%+ of capital carrying voting rights and 90%+ of voting rights — the standard threshold; Member States may set up to 95%","100% of capital carrying voting rights — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ 50%+ triggers the mandatory bid obligation, not the squeeze-out right.","❌ 75%+ triggers the end of voting restrictions under the breakthrough rule, not the squeeze-out right.","✅ Correct — squeeze-out rights are triggered at 90%+ of capital and voting rights; Member States may set the threshold up to a maximum of 95%.","❌ 100% would render the squeeze-out unnecessary."],correct:2,slide:"Slide 13"},
{q:"The sell-out right under Article 16 is best described as:",opts:["The right of the offeror to sell its stake after winning a bid — a requirement introduced by the Lamfalussy Level 2 implementing measures","The right of minority shareholders to require the offeror to buy their securities at a fair price after the offeror has acquired 90%+ of capital and voting rights — the mirror image of squeeze-out","The right of the target company's board to sell the company without shareholder approval — reflecting the maximum harmonisation approach adopted in this EU framework","The right of the offeror to sell shares short during the offer period — a principle established in the foundational Regulation governing this area"],exps:["❌ The sell-out right belongs to minority shareholders, not the offeror.","✅ Correct — the sell-out right (Article 16) is the mirror image of the squeeze-out: minority shareholders may require the offeror to buy their securities at a fair price when the offeror holds 90%+.","❌ The board may not sell the company without shareholder approval under the non-frustration rule.","❌ Short selling by the offeror is governed by the SSR."],correct:1,slide:"Slide 13"},
{q:"The non-frustration rule and the breakthrough rule are described as 'optional' because:",opts:["Companies may choose not to comply based purely on commercial considerations — as established under the relevant EU secondary legislation framework","Both rules are purely advisory with no legal effect — reflecting the harmonisation objective of the EU single financial market","Member States may choose not to require companies to apply these rules, but must grant companies the reversible option to adopt them voluntarily — including a reciprocity exception","Only listed companies in Member States with a regulated market must apply them — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["❌ The optional nature is a Member State legislative choice, not a company commercial decision.","❌ These rules have legal effect in Member States that choose to apply them.","✅ Correct — Member States may choose not to require companies to apply Articles 9(2-3) and 11, but must grant companies the option to voluntarily adopt them; a reciprocity exception also applies.","❌ The optionality operates at Member State level."],correct:2,slide:"Slide 13"},
{q:"The reciprocity principle allows:",opts:["Bidders from third countries to benefit from EU takeover protections if their home jurisdiction provides equivalent protection","All EU companies to elect their preferred takeover regime from a menu of national options","Companies applying non-frustration and breakthrough rules to be exempted from these obligations when targeted by companies not applying the same provisions","The offeror to choose which Member State's takeover rules apply"],exps:["❌ The reciprocity principle concerns EU companies applying the rules when facing bidders from jurisdictions without the same rules.","❌ There is no menu of national options for EU companies.","✅ Correct — companies applying non-frustration and/or breakthrough rules may be exempted from these obligations when targeted by companies not applying the same provisions.","❌ The offeror cannot choose which Member State's rules apply."],correct:2,slide:"Slide 13"},
{q:"If the offeror purchased 5%+ of voting rights for cash during the relevant period, a cash alternative in the mandatory bid is:",opts:["Optional — the offeror may choose to offer securities instead","Optional only if the company is on a regulated market with high daily trading volume","Prohibited — the offer must be made entirely in securities","Mandatory — a cash alternative must be available when this condition is met"],exps:["❌ A cash alternative is mandatory, not optional, when this condition is met.","❌ Trading volume is not the determining factor; the 5%+ cash purchase is.","❌ The offer is not required to be made entirely in securities.","✅ Correct — if the offeror purchased 5%+ of voting rights for cash during the relevant period, a cash alternative is mandatory."],correct:3,slide:"Slide 13"},
{q:"The 2011 revision assessment of the Takeover Bids Directive concluded:",opts:["Major reforms were necessary and the Commission proposed a comprehensive revision — a requirement introduced by the Lamfalussy Level 2 implementing measures","No significant revision was deemed necessary — the Commission concluded the existing framework provided adequate regulation, with only minor amendments","The Directive should be merged with MiFID II — reflecting the maximum harmonisation approach adopted in this EU framework","The mandatory bid rule should be abolished — a principle established in the foundational Regulation governing this area"],exps:["❌ The 2011 review did not conclude that major reforms were necessary.","✅ Correct — no significant revision was deemed necessary; the Commission concluded the framework provided adequate regulation with only minor amendments not affecting foundational elements.","❌ The Directive was not merged with MiFID II.","❌ The mandatory bid rule was not proposed for abolition."],correct:1,slide:"Slide 13"},
{q:"'Persons acting in concert' refers to:",opts:["Institutional investors coordinating voting on ESG matters — as established under the relevant EU secondary legislation framework","Companies within the same corporate group regardless of any agreement — as confirmed by the relevant CJEU case law and regulatory guidance","Financial advisors and legal counsel working together on a transaction — reflecting the harmonisation objective of the EU single financial market","Parties cooperating under agreement to acquire control or frustrate a bid — their combined holdings are relevant for calculating whether the mandatory bid threshold has been triggered"],exps:["❌ Institutional investor coordination on ESG is a separate concept (SRD II).","❌ Corporate group companies may or may not be persons acting in concert depending on specific arrangements.","❌ Financial advisors and legal counsel are not persons acting in concert in this sense.","✅ Correct — persons acting in concert cooperate under agreement to acquire control or frustrate a bid; their combined holdings determine whether the mandatory bid threshold is triggered."],correct:3,slide:"Slide 13"}
,
{q:"The Takeover Bids Directive required the longest gestation period in EU capital markets legislation because:",opts:["The Commission lacked legal basis to regulate takeover bids until the Lisbon Treaty — a requirement introduced by the Lamfalussy Level 2 implementing measures","Profound differences between national legal systems and heated debates over fundamental assumptions — particularly over the non-frustration and breakthrough rules — required numerous compromises","Member States could not agree on a mandatory bid threshold — reflecting the maximum harmonisation approach adopted in this EU framework","The European Parliament rejected the proposal due to concerns about employee rights — a principle established in the foundational Regulation governing this area"],exps:["❌ The legal basis existed before the Lisbon Treaty.", "✅ Correct — profound differences between national legal systems and heated debates, particularly over the non-frustration and breakthrough rules, required numerous compromises.", "❌ The Directive deliberately left the control threshold to Member States.", "❌ The Parliament rejected an early draft over the non-frustration and breakthrough rules, not specifically employee rights."],correct:1,slide:"Slide 13"},
{q:"The offer document under Article 6 must contain:",opts:["Only the offer price and acceptance deadline — as confirmed by the CJEU in its consistent line of case law on this point — a position that differs from the correct EU legal framework applicable in this context","Only the target company's board opinion on the bid — a requirement introduced by the Lamfalussy Level 2 implementing measures — an interpretation that was considered but rejected by the EU legislator during the drafting process","Only financial information about the target company — a principle established in the foundational Regulation governing this area — a description that applies to a different EU legal act, not the one relevant to this question","Terms of the bid, identity of offeror, securities targeted, consideration offered, existing holdings of offeror and concert parties, all conditions to which the bid is subject, offeror's intentions for future business and employment, and details of bid financing arrangements"],exps:["❌ The offer document must contain comprehensive information.","❌ The board opinion is a separate disclosure requirement.","❌ The target's financial information is primarily in the board's opinion and target's own disclosures.","✅ Correct — Article 6 mandates comprehensive content: terms of bid, identity of offeror, securities targeted, consideration, existing holdings, all conditions, intentions for future business operations, plans regarding employment, and financing details."],correct:3,slide:"Slide 13"},
{q:"The 'serious intentions' principle (one of Article 3's six principles) requires:",opts:["The offeror to conduct due diligence for at least 30 days before announcing — a requirement introduced by the Lamfalussy Level 2 implementing measures","The offeror to announce bids only after ensuring ability to implement fully and securing all consideration offered","The offeror to obtain regulatory pre-approval before announcing the bid — reflecting the maximum harmonisation approach adopted in this EU framework","The offeror to consult with target company employees before announcing the bid — a principle established in the foundational Regulation governing this area"],exps:["❌ No minimum due diligence period before announcement is required.", "✅ Correct — the 'serious intentions' principle requires the offeror to announce bids only after ensuring ability to implement fully and securing all consideration offered.", "❌ Regulatory pre-approval is not required before announcing a bid.", "❌ Employee consultation is a separate requirement distinct from 'serious intentions'."],correct:1,slide:"Slide 13"}
,
{q:"The Takeover Bids Directive applies to bids for securities of companies governed by the law of a Member State, where those securities are:",opts:["Admitted to trading on a regulated market in one or more Member States","Traded anywhere in the world, including third-country exchanges","Privately held by fewer than 150 shareholders","Issued by entities with a market capitalisation above €1 billion"],exps:["✅ Correct — the Directive applies to bids for securities of companies governed by Member State law where those securities are admitted to trading on a regulated market in one or more Member States.","❌ The Directive applies specifically to securities admitted to trading on EU regulated markets.","❌ Privately held companies with fewer than 150 shareholders are outside the Directive's scope.","❌ There is no minimum market capitalisation threshold for application of the Directive."],correct:0,slide:"Slide 13"},
{q:"'Equal treatment' (the first Article 3 principle) means specifically that:",opts:["All shareholders must receive the same absolute euro amount per share regardless of the class of shares held — a requirement introduced by the Lamfalussy Level 2 implementing measures","All holders of the same class of securities receive equal treatment — no shareholder gets more favourable terms than another holder of the same class","All shareholders must receive cash consideration, not securities — reflecting the maximum harmonisation approach adopted in this EU framework","All shareholders of both the offeror and offeree must be treated equally — a principle established in the foundational Regulation governing this area"],exps:["❌ Equal treatment applies within the same class of securities; different classes may receive different treatment.", "✅ Correct — equal treatment means all holders of the same class of securities receive equal treatment; no shareholder gets more favourable terms than another holder of that same class.", "❌ Cash consideration is not the only permissible form of consideration; securities are also permitted.", "❌ Equal treatment applies to holders of the offeree company's securities, not to the offeror's shareholders."],correct:1,slide:"Slide 13"},
{q:"The 'company best interests' principle (Article 3, principle 3) requires the target company's board to:",opts:["Always recommend acceptance of any bid above the market price — a requirement introduced by the Lamfalussy Level 2 implementing measures — a position that differs from the correct EU legal framework applicable in this context","Act in the company's interest as a whole and not deny shareholders the opportunity to decide on the bid's merits — the board cannot use defensive measures to frustrate the bid without shareholder authorisation","Prioritise employee interests over shareholder interests when evaluating a bid — reflecting the maximum harmonisation approach adopted in this EU framework","Immediately accept any bid offering a premium above 20% of market price — a principle established in the foundational Regulation governing this area — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ The board is not required to recommend acceptance of any bid above market price.", "✅ Correct — the 'company best interests' principle requires the target board to act in the company's interest as a whole and not deny shareholders the opportunity to decide on the bid's merits.", "❌ The Directive recognises employee interests but does not require them to be prioritised over shareholder interests.", "❌ There is no automatic acceptance requirement at any premium threshold."],correct:1,slide:"Slide 13"},
{q:"The supervisory authority competent for a takeover bid is generally:",opts:["ESMA, as the EU-level supervisor for capital markets — as established under the relevant EU secondary legislation framework — a position that differs from the correct EU legal framework applicable in this context","The authority chosen by the offeror at the time the bid is announced — as confirmed by the relevant CJEU case law and regulatory guidance","The authority of the Member State where the offeror is incorporated — reflecting the harmonisation objective of the EU single financial market","The authority of the Member State where the offeree company has its registered office AND where its securities are admitted to trading — with complex rules for multi-jurisdictional listings"],exps:["❌ ESMA does not supervise individual takeover bids; national competent authorities do.","❌ The offeror cannot choose which supervisory authority applies.","❌ The offeror's home Member State authority is not the default competent authority; the offeree company's Member State determines competence.","✅ Correct — the competent authority is generally that of the Member State where the offeree company has its registered office and where its securities are admitted to trading, with complex rules applying for multi-jurisdictional listings."],correct:3,slide:"Slide 13"},
{q:"The 'market integrity' principle (Article 3, principle 4) in takeover bids requires:",opts:["All shares of the offeree company to be traded at a single price during the offer period","The offeror to disclose all price-sensitive information about its own company during the bid period","Avoiding creation of false markets — security pricing must reflect genuine market forces during the bid process","All transactions in the offeree company's securities to be suspended during the offer period"],exps:["❌ A single price requirement during the offer period is not what the market integrity principle requires.","❌ While the offeror has disclosure obligations, this is not specifically what the market integrity principle requires.","✅ Correct — the market integrity principle requires avoiding the creation of false markets: security pricing must reflect genuine market forces throughout the bid process.","❌ Suspending all trading in the offeree company's securities is not required; the market must continue to function normally."],correct:2,slide:"Slide 13"}
,
{q:"What information must be included in the offer document under Article 6 of the Takeover Bids Directive?",opts:["Only the offer price and acceptance deadline — a requirement introduced by the Lamfalussy Level 2 implementing measures — a position that differs from the correct EU legal framework applicable in this context","Offeror identity, securities targeted, consideration offered, conditions of the bid, offeror's intentions for future business, plans for employment, financing details, and governing law","A simplified two-page summary approved by ESMA — reflecting the maximum harmonisation approach adopted in this EU framework — a description that applies to a different EU legal act, not the one relevant to this question","Only the equitable price calculation methodology — a principle established in the foundational Regulation governing this area — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ The offer document contains far more than just price and deadline.","✅ Correct — Article 6 mandates comprehensive disclosure including offeror identity, securities targeted, consideration, conditions, intentions for the business, employment plans, financing details, and governing law — all necessary for informed shareholder decisions.","❌ The offer document is detailed; there is no ESMA-simplified version.","❌ Price methodology is included but is just one of many required elements."],correct:1,slide:"Slide 13"},
{q:"The mandatory bid rule under Article 5 of the Takeover Bids Directive is triggered when:",opts:["Any shareholder purchases shares in a public company — a requirement introduced by the Lamfalussy Level 2 implementing measures","A company is listed on a regulated market for the first time — reflecting the maximum harmonisation approach adopted in this EU framework","A person or persons acting in concert acquire a controlling holding, exceeding a threshold set by Member States (typically 30-33%)","ESMA declares a systemic risk event in the relevant equity market — a principle established in the foundational Regulation governing this area"],exps:["❌ Not every share purchase triggers the mandatory bid; only acquisition of control does.","❌ IPO listing does not trigger the mandatory bid rule.","✅ Correct — the mandatory bid rule is triggered when a person or persons acting in concert acquire a controlling holding (the threshold is left to Member States, typically set at 30-33% of voting rights), requiring a bid for all remaining securities at an equitable price.","❌ ESMA systemic risk declarations are unrelated to the mandatory bid rule."],correct:2,slide:"Slide 13"},
{q:"The equitable price in a mandatory bid is defined as:",opts:["The highest price paid by the offeror or persons acting in concert for the same class of securities in the 6-12 month period prior to the bid announcement","The average market price over the preceding 12 months — as established under the relevant EU secondary legislation framework","The NAV of the company's assets divided by the total number of shares — reflecting the harmonisation objective of the EU single financial market","A price determined by an independent valuer appointed by the supervisory authority — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — the equitable price is the highest price paid by the offeror or concert parties for the same securities during the 6-12 month reference period prior to the bid announcement, ensuring minority shareholders receive at least what controlling parties recently paid.","❌ The equitable price is based on the highest price paid, not an average.","❌ NAV-based pricing is not the statutory mechanism for equitable price under the Directive.","❌ Independent valuation may be used by supervisory authorities to adjust the price in exceptional cases, but the baseline is the highest price paid."],correct:0,slide:"Slide 13"},
{q:"Under Article 11 of the Takeover Bids Directive (Breakthrough Rule), what happens to multiple-vote shares at a shareholder meeting deciding on defensive measures during an offer period?",opts:["Multiple-vote shares carry their full voting weight","Multiple-vote shares carry only one vote at such meetings","Multiple-vote shares are automatically suspended for 6 months after the bid announcement","Multiple-vote shares are converted into ordinary shares permanently"],exps:["❌ The breakthrough rule specifically reduces the weight of multiple-vote shares in this context.","✅ Correct — under the breakthrough rule, voting restrictions do not apply at shareholder meetings deciding on defensive measures during the offer period, and multiple-vote securities carry only one vote.","❌ The suspension is not a general 6-month rule; the one-vote principle applies specifically at relevant meetings.","❌ The breakthrough rule does not permanently convert multiple-vote shares."],correct:1,slide:"Slide 13"},
{q:"The reciprocity exception in the Takeover Bids Directive allows:",opts:["All Member States to exempt all companies from the non-frustration and breakthrough rules — a requirement introduced by the Lamfalussy Level 2 implementing measures","The Commission to waive the mandatory bid rule for cross-border transactions — a principle established in the foundational Regulation governing this area","Supervisory authorities to grant exemptions based on employment protection grounds — reflecting the maximum harmonisation approach adopted in this EU framework","Companies applying the non-frustration and/or breakthrough rules to be exempted from those obligations when targeted by bidders not applying equivalent provisions"],exps:["❌ The reciprocity exception is targeted, not a general exemption for all companies.","❌ The Commission cannot waive the mandatory bid rule through reciprocity.","❌ Employment protection is not the basis for the reciprocity exception.","✅ Correct — the reciprocity exception allows companies voluntarily applying the non-frustration/breakthrough rules to be exempt from them when they become targets of companies not applying equivalent provisions, addressing competitive disadvantage."],correct:3,slide:"Slide 13"},
{q:"Article 9 of the Takeover Bids Directive (Non-Frustration Rule) prohibits which actions by the target board during the offer period without shareholder authorisation?",opts:["Seeking legal advice on the bid — a requirement introduced by the Lamfalussy Level 2 implementing measures","Soliciting alternative 'white knight' bids — as confirmed by the CJEU in its consistent line of case law on this point","Issuing shares, disposing of material assets, or substantially altering liabilities","Publishing the reasoned board opinion on the bid — a principle established in the foundational Regulation governing this area"],exps:["❌ Seeking legal advice is normal business activity and not prohibited.","❌ Seeking alternative bids is explicitly permitted under the non-frustration rule.","✅ Correct — Article 9 prohibits issuing shares, disposing of material assets, or substantially altering liabilities without shareholder approval, as these could frustrate the bid's development.","❌ Publishing the board's reasoned opinion is mandatory, not prohibited."],correct:2,slide:"Slide 13"},
{q:"Squeeze-out rights under the Takeover Bids Directive allow offerors who hold what percentage of capital and voting rights to compel remaining shareholders to sell?",opts:["50%","75%","90%","95%"],exps:["❌ 50% establishes simple majority; squeeze-out requires a much higher threshold.","❌ 75% is a common threshold for special resolutions, not squeeze-out under the Directive.","✅ Correct — Article 15 allows offerors holding at least 90% of capital carrying voting rights to exercise squeeze-out rights; Member States may set thresholds up to a maximum of 95%.","❌ 95% is the maximum threshold Member States may set; the minimum is 90%."],correct:2,slide:"Slide 13"},
{q:"'Persons acting in concert' under the Takeover Bids Directive are relevant because:",opts:["They are personally liable for the equitable price if the offeror defaults — a requirement introduced by the Lamfalussy Level 2 implementing measures","They must each individually file separate offer documents — reflecting the maximum harmonisation approach adopted in this EU framework","Their combined shareholdings are aggregated to determine whether the mandatory bid threshold has been crossed","They automatically obtain squeeze-out rights once identified — a principle established in the foundational Regulation governing this area"],exps:["❌ Personal liability for payment is not the main relevance of the concert definition.","❌ Persons acting in concert file collectively through the main offeror's offer document.","✅ Correct — persons acting in concert are relevant because their combined shareholdings are aggregated to determine whether the mandatory bid threshold has been crossed, preventing circumvention by coordinating parties.","❌ Concert status does not automatically confer squeeze-out rights."],correct:2,slide:"Slide 13"},
{q:"The sell-out right (Article 16 of the Takeover Bids Directive) provides minority shareholders with:",opts:["The right to sell at a price set by the supervisory authority irrespective of market conditions — a requirement introduced by the Lamfalussy Level 2 implementing measures","The right to block a squeeze-out unless a higher premium is offered — a principle established in the foundational Regulation governing this area","A mandatory conversion of their shares into cash at book value — reflecting the maximum harmonisation approach adopted in this EU framework","The right to require the offeror to acquire their shares at fair value once the same 90% threshold as squeeze-out has been reached"],exps:["❌ The sell-out price conditions mirror squeeze-out (equitable price), not a separately determined price.","❌ The sell-out right provides an exit, not a blocking mechanism.","❌ Sell-out is not at book value; it applies conditions equivalent to squeeze-out pricing.","✅ Correct — the sell-out right mirrors squeeze-out: at the same 90%+ threshold, minority shareholders may compel the offeror to purchase their shares at a fair price, ensuring an exit opportunity with symmetrical protection."],correct:3,slide:"Slide 13"},
{q:"A cash alternative in a takeover bid is mandatory when:",opts:["The offeror has purchased 5% or more of voting rights for cash during the relevant reference period","The bid is for more than 10% of the target company's shares — as established under the relevant EU secondary legislation framework","The target company is listed on more than one regulated market — reflecting the harmonisation objective of the EU single financial market","The bid is accompanied by a squeeze-out notice — as confirmed by the relevant CJEU case law and regulatory guidance"],exps:["✅ Correct — a cash alternative must be offered when the offeror has purchased 5% or more of voting rights for cash during the relevant reference period, ensuring recipients of non-liquid securities as consideration have a cash exit option.","❌ The threshold triggering mandatory cash alternative is based on prior cash purchases, not bid size.","❌ Multi-market listing does not automatically trigger the mandatory cash alternative.","❌ Squeeze-out notice does not trigger the mandatory cash alternative."],correct:0,slide:"Slide 13"},
{q:"The Takeover Bids Directive is best characterised as which type of achievement in EU harmonisation?",opts:["A fully harmonised maximum harmonisation instrument eliminating all national divergences — a requirement introduced by the Lamfalussy Level 2 implementing measures — a position that differs from the correct EU legal framework applicable in this context","A pivotal but incomplete step — establishing common principles for transparency, equal treatment and minority protection while leaving significant room for national variation through minimum harmonisation and extensive Member State options","A directive that was unnecessary given the existing single market framework — a principle established in the foundational Regulation governing this area — a description that applies to a different EU legal act, not the one relevant to this question","A complete failure that achieved no meaningful cross-border harmonisation — a requirement introduced by the Lamfalussy Level 2 implementing measures — an interpretation that was considered but rejected by the EU legislator during the drafting process"],exps:["❌ The Directive is minimum harmonisation with extensive Member State options — far from full harmonisation.","✅ Correct — the Takeover Bids Directive represents a pivotal yet incomplete achievement: it established the first EU-wide framework for takeover bids with common principles, but its minimum harmonisation approach and extensive options leave significant national variation, limiting its harmonisation objectives.","❌ The Directive was a notable achievement given the complexity and strong national interests involved, even if imperfect.","❌ While limited in harmonisation scope, the Directive did establish common principles on transparency, mandatory bids, and minority protection across the EU."],correct:1,slide:"Slide 13"},
{q:"Which of the following best describes the key achievements and persistent limitations of the Takeover Bids Directive?",opts:["Achievement: full harmonisation of squeeze-out thresholds. Limitation: no mandatory bid rule — a requirement introduced by the Lamfalussy Level 2 implementing measures","Achievement: complete harmonisation of board neutrality. Limitation: no employee consultation requirements — a principle established in the foundational Regulation governing this area","Achievement: binding breakthrough rule across all Member States. Limitation: no cross-border cooperation between supervisory authorities — reflecting the maximum harmonisation approach adopted in this EU framework","Achievement: mandatory bid rule and equitable price protecting minority shareholders; transparency standards. Limitation: significant Member State autonomy resulting in continued divergence on thresholds and optional provisions"],exps:["❌ Squeeze-out thresholds are not fully harmonised — Member States may set them between 90% and 95%.","❌ Board neutrality (non-frustration) is also optional for Member States; employee consultation is recognised but not a headline achievement.","❌ The breakthrough rule is optional for Member States and applies on a voluntary basis for companies.","✅ Correct — the Directive's key achievements are the mandatory bid rule, equitable price mechanisms, and transparency standards protecting minority shareholders. Its main limitation is the significant Member State autonomy through minimum harmonisation and optional provisions, resulting in continued fragmentation."],correct:3,slide:"Slide 13"}],
"14 — PRIIPs":[
