const TOPICS = {
"01 — EU Financial Markets Law & the Treaties":[
{q:"The TEU and TFEU are best described as:",opts:["Political declarations with no legally binding force","The constitutional foundations of the EU, defining its values, goals, and legal framework","Directives issued by the Commission to harmonise national financial laws","Secondary legislation adopted by Parliament and the Council"],exps:["❌ The TEU and TFEU are legally binding primary law.","✅ Correct — the TEU and TFEU are the constitutional foundations of the EU.","❌ Directives are secondary legislation; the Treaties are primary law.","❌ Secondary legislation includes Regulations and Directives; the Treaties are adopted by Member States."],correct:1,slide:"Slide 01"},
{q:"The ECSC (1951) covered which two industries?",opts:["Oil and gas","Coal and steel — key industries for military power","Banking and insurance","Automotive and aerospace"],exps:["❌ Oil and gas were not part of the ECSC.","✅ Correct — the ECSC covered coal and steel, two key industries for military power, binding European economies together after WWII.","❌ Banking and insurance were not covered by the ECSC.","❌ Automotive and aerospace were not covered by the ECSC."],correct:1,slide:"Slide 01"},
{q:"The Treaties of Rome (1957) founded which two bodies?",opts:["The EU and the ECB","The ECSC and Euratom","The European Economic Community and Euratom","The European Parliament and the European Commission"],exps:["❌ The EU was established by the Maastricht Treaty (1992).","❌ The ECSC was established by the 1951 Treaty of Paris.","✅ Correct — the Treaties of Rome (1957) founded the EEC and Euratom.","❌ These institutions were not created by the Treaties of Rome."],correct:2,slide:"Slide 01"},
{q:"The Maastricht Treaty (1992) formally established the EU and:",opts:["Founded the EEC and Euratom","Introduced the TFEU and EU Charter of Fundamental Rights","Introduced the three-pillar structure and laid foundations for the euro","Provided for the largest EU expansion with ten CEE countries"],exps:["❌ Founding the EEC and Euratom was the result of the Treaties of Rome (1957).","❌ Introducing the TFEU and Charter describes the Treaty of Lisbon (2009).","✅ Correct — the Maastricht Treaty (1992) introduced the three-pillar structure and laid foundations for the euro.","❌ The largest CEE expansion occurred in 2004."],correct:2,slide:"Slide 01"},
{q:"The euro was introduced as virtual currency in which year, and in physical form in which year?",opts:["1992 virtual; 1999 physical","1999 virtual; 2002 physical","2002 virtual; 2004 physical","1997 virtual; 2000 physical"],exps:["❌ 1992 is the year of Maastricht, not euro introduction.","✅ Correct — virtual in 1999, physical in 2002, with 11 countries initially adopting it.","❌ 2002 was when the euro became physical, not virtual.","❌ Neither 1997 nor 2000 are the correct dates."],correct:1,slide:"Slide 01"},
{q:"As of January 2026, the EU comprises how many Member States, with how many in the euro area?",opts:["27 Member States; 19 in euro area","27 Member States; 21 in euro area","28 Member States; 21 in euro area","27 Member States; all 27 in euro area"],exps:["❌ 19 was an earlier euro area figure.","✅ Correct — 27 Member States as of January 2026, with 21 in the euro area.","❌ The EU has 27 (not 28) Member States since Brexit.","❌ Not all 27 Member States have adopted the euro."],correct:1,slide:"Slide 01"},
{q:"The European Parliament is best described as:",opts:["The body that brings together Heads of State or Government to define political direction","The executive arm proposing legislation and acting as guardian of the Treaties","The only directly elected EU institution, sharing legislative power with the Council","The institution responsible for monetary policy and price stability"],exps:["❌ Bringing together Heads of State describes the European Council.","❌ Proposing legislation and guardian of Treaties describes the European Commission.","✅ Correct — the European Parliament is the only directly elected EU institution, with elections every five years.","❌ Monetary policy and price stability are the ECB's responsibility."],correct:2,slide:"Slide 01"},
{q:"The European Council is best described as:",opts:["Proposes legislation and manages policies and budget","Represents Member State governments sharing legislative and budgetary powers with Parliament","Brings together Heads of State or Government, defines general political direction but does NOT exercise legislative functions","Ensures EU law is interpreted consistently — direct effect and supremacy"],exps:["❌ Proposing legislation describes the European Commission.","❌ Representing Member State governments describes the Council of the EU.","✅ Correct — the European Council brings together Heads of State, defines political direction, but does not exercise legislative functions.","❌ Consistent interpretation and direct effect/supremacy are CJEU roles."],correct:2,slide:"Slide 01"},
{q:"Which two foundational doctrines has the CJEU used to shape EU legal order?",opts:["Mutual recognition and home-country control","Subsidiarity and proportionality","Direct effect and supremacy of EU law","Best execution and market transparency"],exps:["❌ Mutual recognition and home-country control are Single Market integration techniques.","❌ Subsidiarity and proportionality are general EU principles but not the foundational CJEU doctrines.","✅ Correct — the CJEU's foundational doctrines are direct effect and supremacy of EU law.","❌ Best execution and transparency are MiFID II concepts."],correct:2,slide:"Slide 01"},
{q:"The ECB's primary objective is:",opts:["Overseeing banking supervision through the SSM","Maintaining price stability in the euro area","Setting fiscal policy for euro area Member States","Managing the EU budget"],exps:["❌ Banking supervision through the SSM is important but not the primary objective.","✅ Correct — the ECB's primary objective is maintaining price stability.","❌ Fiscal policy remains a national competence.","❌ Managing the EU budget is the Commission and Court of Auditors' role."],correct:1,slide:"Slide 01"},
{q:"Which of the following is NOT among the core objectives of Article 3 TEU?",opts:["Promoting peace, EU values, and well-being of its peoples","Establishing an internal market with the four fundamental freedoms","Setting harmonised corporate tax rates across all Member States","Fighting social exclusion and promoting equality between women and men"],exps:["❌ Promoting peace and well-being IS a core Article 3 TEU objective.","❌ Establishing the internal market IS a core Article 3 TEU objective.","✅ Correct — harmonised corporate tax rates are NOT among Article 3 TEU objectives.","❌ Fighting social exclusion and promoting equality IS a core Article 3 TEU objective."],correct:2,slide:"Slide 01"},
{q:"The Free Movement of Capital (Article 63 TFEU) is distinctive because:",opts:["It applies only between Member States and not to third countries","It prohibits all restrictions on capital and payments between Member States AND with third countries — making it the broadest freedom","It requires prior ECB approval for large cross-border capital flows","It was fully liberalised by the Maastricht Treaty alone, without any prior Directive"],exps:["❌ Unlike the other freedoms, capital freedom also extends to third countries.","✅ Correct — Article 63 TFEU prohibits all restrictions on capital and payments between Member States AND with third countries, making it the broadest and least conditional freedom.","❌ No prior ECB approval is required; Article 63 TFEU is directly effective.","❌ Directive 88/361/EEC (1988) provided full liberalisation before Maastricht enshrined it in primary law."],correct:1,slide:"Slide 01"},
{q:"Council Directive 88/361/EEC (1988) is significant because:",opts:["It established the first framework for EU banking supervision","It provided for full liberalisation of capital movements among Member States","It introduced MiFID I, replacing the Investment Services Directive","It created the European System of Financial Supervision with three ESAs"],exps:["❌ Banking supervision was not addressed by this Directive.","✅ Correct — Directive 88/361/EEC (1988) provided for full liberalisation of capital movements among Member States, before Maastricht enshrined it in primary law.","❌ MiFID I was adopted in 2004.","❌ The ESFS and ESAs were created in 2010–2011."],correct:1,slide:"Slide 01"},
{q:"The key distinction between Freedom of Establishment (Art. 49 TFEU) and Freedom to Provide Services (Art. 56 TFEU) lies in:",opts:["The type of economic activity involved","The nationality of the service provider","Duration and presence: establishment involves a fixed establishment for an indefinite period; services are temporary in nature","Whether the activity is regulated by national or EU-level supervisors"],exps:["❌ Both freedoms cover a wide range of activities.","❌ Both apply to EU nationals and legal persons.","✅ Correct — the key distinction is duration and presence: establishment involves a fixed establishment for an indefinite period; services are temporary and lack permanent physical presence.","❌ Whether regulated nationally or at EU level does not determine which freedom applies."],correct:2,slide:"Slide 01"},
{q:"In Gebhard (C-55/94), the CJEU established which cumulative test for national measures restricting fundamental freedoms?",opts:["Measures must be proportionate — one condition only","Non-discriminatory, justified by imperative requirements in the general interest, suitable for achieving goals, and going no further than necessary","Measures require prior Commission approval before entering into force","Measures are valid if adopted through the ordinary legislative procedure"],exps:["❌ The Gebhard test has four cumulative conditions.","✅ Correct — national measures must be: non-discriminatory, justified by imperative requirements in the general interest, suitable for achieving their objective, and proportionate.","❌ No prior Commission approval is required.","❌ The Gebhard test is a judicial review standard, not a legislative procedure requirement."],correct:1,slide:"Slide 01"},
{q:"In Centros (C-212/97), the CJEU held that:",opts:["National measures hindering freedoms must satisfy the Gebhard proportionality test","Member States cannot hinder companies from exercising freedom to choose their place of incorporation; Danish refusal to register a UK company branch was invalidated","Restrictions on property ownership by non-nationals in border areas breach capital freedom","A Dutch ban on cold-calling for financial services was a justified restriction"],exps:["❌ The Gebhard test was established in Gebhard (C-55/94), not Centros.","✅ Correct — in Centros, the CJEU invalidated the Danish refusal to register a UK company branch, holding Member States cannot hinder companies' freedom to choose their place of incorporation.","❌ Property ownership restrictions were addressed in Commission v Greece.","❌ Cold-calling bans were addressed in Alpine Investments."],correct:1,slide:"Slide 01"},
{q:"In Alpine Investments (C-384/93), the CJEU held that:",opts:["Member States cannot restrict companies' freedom to choose their place of incorporation","A Dutch ban on cold-calling for financial services was a restriction on service provision, justified by consumer protection","Fiscal autonomy must not result in discrimination on cross-border capital flows","State special rights constitute restrictions on capital freedom unless proportionate"],exps:["❌ Freedom to choose place of incorporation was addressed in Centros.","✅ Correct — in Alpine Investments, the Dutch ban on cold-calling was a restriction on service provision, but justified by consumer protection in that case.","❌ Fiscal autonomy and capital flows were addressed in Verkooijen and Santander.","❌ State special rights and capital freedom were addressed in Commission v Portugal, France and Netherlands."],correct:1,slide:"Slide 01"},
{q:"Phase III of EU financial markets integration (1999–2007) included which landmark acts?",opts:["First and Second Banking Directives introducing home-country control","MiFID II/MiFIR and EMIR significantly expanding the regulatory framework","Market Abuse Directive, Prospectus Directive, Transparency Directive, and MiFID I (2004)","CRD IV/CRR implementing Basel III, and the SSM centralising banking supervision"],exps:["❌ First and Second Banking Directives belong to Phase II (1985–1999).","❌ MiFID II/MiFIR and EMIR belong to Phase IV (2007–2015).","✅ Correct — Phase III included the FSAP with 42 measures and landmark acts: Market Abuse Directive, Prospectus Directive, Transparency Directive, and MiFID I (2004).","❌ CRD IV/CRR and the SSM belong to Phase IV."],correct:2,slide:"Slide 01"},
{q:"The Single Supervisory Mechanism (SSM) centralised banking supervision in which institution and in which year?",opts:["ESMA, in 2010","EBA, in 2011","The ECB, in 2014","The European Commission, in 2015"],exps:["❌ ESMA covers capital markets, not banking supervision through the SSM.","❌ EBA covers banking regulation and standards but does not run the SSM.","✅ Correct — the SSM centralised banking supervision in the ECB in 2014.","❌ The European Commission does not conduct banking supervision."],correct:2,slide:"Slide 01"},
{q:"DORA (Digital Operational Resilience Act) addresses which regulatory need?",opts:["Digital asset trading and crypto-asset issuance","ICT risk management requirements for financial entities","Sustainable finance and ESG investment disclosure","Short selling and market manipulation prevention"],exps:["❌ Digital asset trading and crypto-assets are addressed by MiCAR.","✅ Correct — DORA (Digital Operational Resilience Act) established ICT risk management requirements for financial entities in Phase VI.","❌ Sustainable finance and ESG disclosure are addressed by SFDR, Taxonomy Regulation, and CSRD.","❌ Short selling regulation is a separate piece of EU legislation."],correct:1,slide:"Slide 01"}
],
"02 — EU Financial Regulation":[
{q:"The primary intellectual justification for financial regulation rests on the concept of:",opts:["Government failure","Market failure — situations where unregulated markets produce suboptimal outcomes","Regulatory failure — situations where existing rules are poorly enforced","Systemic failure — situations where entire financial systems collapse"],exps:["❌ Government failure is a different economic concept.","✅ Correct — the primary justification rests on market failure, where unregulated markets produce suboptimal outcomes.","❌ Regulatory failure is a consequence, not the primary justification.","❌ Systemic failure is one type of market failure, but market failure is more broadly the primary justification."],correct:1,slide:"Slide 02"},
{q:"Market failure alone is not sufficient justification for regulation. Two additional conditions are needed. Which are they?",opts:["The regulator must have sufficient expertise AND there must be an agreed international standard","The deviation from market optimum must be significant enough to warrant constraints on private autonomy AND any intervention must generate a net increase in social welfare","The regulated activity must cross international borders AND there must be a supranational body to enforce the rules","The intervention must be approved by a supranational body AND must not distort competition"],exps:["❌ Regulator expertise and international standards are not the two additional conditions.","✅ Correct — the two additional conditions are: (1) the deviation must be significant enough to warrant constraints on private autonomy; (2) the intervention must generate a net increase in social welfare.","❌ Cross-border nature and a supranational body are not the two conditions.","❌ Supranational approval and competition effects are not the two conditions."],correct:1,slide:"Slide 02"},
{q:"'Allocative Efficiency' is best described as:",opts:["Yielding the maximum possible output from a given set of scarce resources","Ensuring that resources are optimally distributed to activities and individuals who value them most","Capturing the economy's ability to innovate, invest, and adapt over time","Ensuring market prices reflect new information quickly and accurately"],exps:["❌ Maximum output from given resources describes Productive Efficiency.","✅ Correct — Allocative Efficiency means resources are optimally distributed to activities and individuals who value them most.","❌ The economy's ability to innovate and adapt describes Dynamic Efficiency.","❌ Prices reflecting new information quickly describes market efficiency."],correct:1,slide:"Slide 02"},
{q:"'Dynamic Efficiency' is best described as:",opts:["Yielding the maximum possible output from a given set of resources","Ensuring resources are optimally distributed to those who value them most","Capturing the economy's ability to innovate, invest, and adapt over time to sustain long-term growth","Ensuring no alternative allocation could make someone better off without making others worse off"],exps:["❌ Maximum output from given resources describes Productive Efficiency.","❌ Optimal distribution to those who value resources most describes Allocative Efficiency.","✅ Correct — Dynamic Efficiency captures the economy's ability to innovate, invest, and adapt over time.","❌ No alternative allocation making someone better off without making others worse off describes Pareto optimality."],correct:2,slide:"Slide 02"},
{q:"Pareto optimality has significant limitations because:",opts:["It is impossible to achieve due to market failures","An allocation may be Pareto efficient but result in a disproportionate distribution of resources — efficient does not mean socially desirable","It requires government intervention, undermining market efficiency","It can only be measured in markets with complete price transparency"],exps:["❌ The slides do not say Pareto optimality is impossible to achieve.","✅ Correct — an allocation can be Pareto efficient yet result in disproportionate distribution; efficient does not mean socially desirable.","❌ Pareto optimality does not require government intervention by definition.","❌ Measurement challenges are not the limitation identified."],correct:1,slide:"Slide 02"},
{q:"'Financial Stability' as a core goal of financial regulation involves:",opts:["Maximising GDP growth through deregulation","Addressing negative externalities and systemic risk through prudential regulation, especially after the 2008 financial crisis","Promoting full employment in the financial services sector","Harmonising national tax rates to prevent regulatory arbitrage"],exps:["❌ Deregulation contradicts the concept of prudential regulation.","✅ Correct — Financial Stability addresses negative externalities and systemic risk through prudential regulation.","❌ Full employment in financial services is not listed as a core goal.","❌ Harmonising tax rates is not a listed core goal."],correct:1,slide:"Slide 02"},
{q:"'Crime Prevention' as a core goal of financial regulation refers to:",opts:["Preventing fraud committed by retail investors against financial institutions","Fighting money laundering, terrorist financing, and tax evasion to prevent the financial system being used for socially harmful activities","Prosecuting insider dealers under criminal law rather than administrative sanctions","Preventing cybercrime and data theft from financial institutions"],exps:["❌ Fraud by retail investors is not what this core goal refers to.","✅ Correct — Crime Prevention means fighting money laundering, terrorist financing, and tax evasion.","❌ The choice between criminal and administrative sanctions is a different regulatory issue.","❌ Cybercrime prevention falls under Innovation Governance or operational risk."],correct:1,slide:"Slide 02"},
{q:"'Innovation Governance' as a core goal of financial regulation refers to:",opts:["Restricting all financial innovation to prevent systemic risk","Supporting fair and proper innovation while preventing risks from technological developments like crypto-assets and artificial intelligence","Requiring all new financial products to be pre-approved by ESMA","Banning high-frequency trading due to flash-crash risks"],exps:["❌ Restricting all innovation is not what Innovation Governance means.","✅ Correct — Innovation Governance means supporting fair and proper innovation while preventing risks from technological developments like crypto-assets and AI.","❌ ESMA pre-approval of all new products is not what Innovation Governance means.","❌ Banning HFT is not the approach; HFT is regulated but not banned."],correct:1,slide:"Slide 02"},
{q:"Adverse selection in finance is best illustrated by (Akerlof's 'Market for Lemons'):",opts:["Investors overreacting to short-term news due to behavioral biases","Sellers knowing product quality while buyers do not, leading to markets dominated by inferior offerings such as subprime mortgages or opaque funds","Excessive risk-taking because profits are privatised while losses are socialised","Regulators lacking information to assess risks of complex institutions"],exps:["❌ Overreacting to news describes a behavioral bias, not adverse selection.","✅ Correct — Akerlof's 1970 paper showed that inability to assess quality leads to market equilibrium dominated by inferior offerings.","❌ Privatising profits while socialising losses describes moral hazard.","❌ Regulator information gaps describe a supervisory challenge, not adverse selection."],correct:1,slide:"Slide 02"},
{q:"Financial markets are described as requiring stricter oversight than other markets because of:",opts:["Simple and transparent structure compared to product markets","Interconnectedness — the failure of one actor can destabilise the system through direct or indirect exposures — and high complexity, leverage amplification, and economic centrality","Exclusive use by sophisticated professional investors","No negative externalities unlike product markets"],exps:["❌ Financial markets are described as highly complex, not simple and transparent.","✅ Correct — interconnectedness, high complexity, leverage amplification, speed and velocity, and economic centrality all justify stricter oversight.","❌ Financial markets are used by a wide range of participants including retail investors.","❌ Financial markets do generate negative externalities — a key justification for regulation."],correct:1,slide:"Slide 02"},
{q:"'Disclosure' as a regulatory tool is based on the assumption that:",opts:["Markets work best with minimal information requirements","Markets function correctly if investors have sufficient information to assess risk and performance","All investors have professional expertise to analyse complex financial data","Regulators can verify all disclosed information for accuracy"],exps:["❌ Minimal information requirements contradict the disclosure logic.","✅ Correct — disclosure assumes markets can function correctly if investors have sufficient information to assess risk and performance.","❌ The limitations of disclosure include that retail investors often lack expertise to assess information.","❌ Regulator verification of accuracy is a separate issue."],correct:1,slide:"Slide 02"},
{q:"The EU's approach to financial regulation compared to the US is best characterised as:",opts:["More fragmented, with overlapping agencies and stronger reliance on enforcement and litigation","Favouring harmonisation, prescriptive rulemaking, and centralised oversight through bodies like ESMA, EBA, EIOPA, and the ECB","More principle-based with minimal prescriptive rules","More decentralised, leaving most regulation to national authorities"],exps:["❌ The fragmented, enforcement-based approach describes the US model.","✅ Correct — the EU favours harmonisation, prescriptive rulemaking, and centralised oversight through ESMA, EBA, EIOPA, and the ECB.","❌ A principle-based, minimal prescriptive approach is not how the EU's approach is characterised.","❌ The EU involves significant harmonisation; it is more centralised than the US."],correct:1,slide:"Slide 02"},
{q:"The EU's response to crypto-assets and digital finance is characterised by:",opts:["Full deregulation leaving crypto to self-regulation","A fragmented framework with agencies disagreeing on classification of digital assets","MiCAR establishing a uniform licensing regime, complemented by DORA for cybersecurity and incident reporting","Exclusively soft law with no binding regulation"],exps:["❌ The EU's response is comprehensive binding regulation.","❌ A fragmented framework with agency disagreements describes the US approach.","✅ Correct — the EU responded with MiCAR (uniform licensing regime) complemented by DORA (cybersecurity and incident reporting obligations).","❌ The EU's response is binding legislation, not exclusively soft law."],correct:2,slide:"Slide 02"},
{q:"The 'Twin Peaks' regulatory model is best described as:",opts:["Two identical regulators with overlapping mandates for redundancy","A goal-defined architecture with separate agencies for different objectives — one for consumer protection/market integrity and one for prudential regulation","A single comprehensive regulator combining all financial supervision functions","A model where national and EU-level supervisors share equal powers"],exps:["❌ The Twin Peaks model has agencies with different objectives.","✅ Correct — Twin Peaks is goal-defined: e.g., UK replaced the FSA with FCA (consumer protection/market integrity) and PRA (prudential regulation).","❌ A single comprehensive regulator describes the Unified Model.","❌ Shared national and EU powers describes the ESFS network."],correct:1,slide:"Slide 02"},
{q:"'Regulatory arbitrage' refers to:",opts:["Legitimate innovation that reduces the social costs of regulated activities","Firms restructuring activities to fall outside the scope of regulation or under less costly regulations, without necessarily reducing social costs","Regulators adjusting rules to accommodate market innovation","Investors using legal differences between jurisdictions to optimise returns"],exps:["❌ Genuine innovation reducing social costs is distinguished from regulatory arbitrage.","✅ Correct — regulatory arbitrage means firms restructure to fall outside regulation or under less costly rules, without necessarily reducing social costs.","❌ Regulators adjusting rules is not regulatory arbitrage.","❌ Investors exploiting legal differences is a related but distinct concept."],correct:1,slide:"Slide 02"},
{q:"Post-2008, macroprudential oversight introduced which tools?",opts:["Only capital adequacy ratios and stress testing requirements","Capital surcharges for systemic institutions (G-SIBs/D-SIBs), countercyclical capital buffers, LCR and NSFR, alongside resolution regimes like the BRRD","Only resolution regimes like the BRRD","Exclusively disclosure requirements under the Prospectus Regulation"],exps:["❌ Capital adequacy and stress testing are part of the toolkit but not the complete post-2008 list.","✅ Correct — macroprudential tools include capital surcharges, countercyclical buffers, LCR and NSFR, and resolution regimes.","❌ Resolution regimes are one element; the toolkit is broader.","❌ Disclosure requirements are a different category of regulatory tool."],correct:1,slide:"Slide 02"},
{q:"Disclosure has limitations as a regulatory tool because:",opts:["It is never effective and should be abandoned in favour of product bans","Excessive and/or too technical disclosure can be ineffective, as retail investors often lack expertise to assess risks even when information is complete","Disclosure requirements are too costly for firms to implement","Regulators cannot verify the accuracy of disclosed information"],exps:["❌ Disclosure has not been abandoned; it has evolved and been supplemented.","✅ Correct — excessive and/or too technical disclosure can be ineffective, especially for retail investors lacking expertise, leading to standardised disclosures like KIDs under PRIIPs.","❌ Cost to firms is not the primary limitation identified.","❌ Regulatory verification of accuracy is a separate issue."],correct:1,slide:"Slide 02"},
{q:"'Conduct regulation' in financial law addresses:",opts:["Rules preventing financial institutions from failing and spreading systemic risk","How market actors should operate and carry on their business, protecting users of financial products — reducing agency problems, conflicts of interest, and ensuring adequate services","Requirements for institutions to hold sufficient capital to absorb losses","Licensing rules ensuring only competent players can provide financial services"],exps:["❌ Preventing failure and systemic risk describes Prudential Regulation.","✅ Correct — Conduct Regulation addresses how market actors should operate, protecting users, reducing agency problems and conflicts of interest.","❌ Sufficient capital to absorb losses describes Prudential Rules.","❌ Licensing rules ensuring competent players describes the Licensing tool."],correct:1,slide:"Slide 02"},
{q:"One of the main challenges for regulators identified in the slides is that:",opts:["Regulated firms lack resources to comply with complex regulation","Large international financial institutions possess far greater resources dedicated to understanding and navigating the financial system than regulators do","Regulators are too politically independent and lack democratic accountability","International coordination bodies like the FSB have too much power over national regulators"],exps:["❌ The information asymmetry runs in the opposite direction.","✅ Correct — large international financial institutions have grown to the scale of nation-state financial systems and possess far greater resources than regulators.","❌ The slides advocate for political independence of regulators.","❌ The slides advocate for stronger international coordination through bodies like the FSB."],correct:1,slide:"Slide 02"},
{q:"The SFDR (Sustainable Finance Disclosure Regulation) mandates:",opts:["All EU companies to report on their environmental impact","Asset managers to report on sustainability risk integration","Credit institutions to hold green assets as minimum capital","Issuers to include ESG risk factors in their prospectuses"],exps:["❌ All EU companies' environmental impact reporting is addressed by the CSRD.","✅ Correct — the SFDR mandates asset managers to report on sustainability risk integration.","❌ Green asset requirements for credit institutions are a separate prudential concept.","❌ Prospectus requirements are governed by the Prospectus Regulation."],correct:1,slide:"Slide 02"},
{q:"The 'Institutional Model' of regulatory architecture uses:",opts:["A single comprehensive authority like the UK's former FSA","Separate regulators for banking, securities, and insurance — mirroring the financial sector's divisions — still reflected in the EU's EBA, ESMA, and EIOPA structure","Goal-defined agencies with separate authorities for different objectives","A fully integrated EU-level supervisor replacing all national authorities"],exps:["❌ A single comprehensive authority describes the Unified Model.","✅ Correct — the Institutional Model uses separate regulators for banking, securities, and insurance, still reflected in the EU's three ESA structure.","❌ Goal-defined agencies describe the Twin Peaks Model.","❌ A fully integrated EU-level supervisor is a different concept."],correct:1,slide:"Slide 02"}
],
"03 — Taxonomy of Legal Sources":[
{q:"At the peak of the hierarchy of EU legal sources are:",opts:["Regulations, Directives, and Decisions (Article 288 TFEU)","The TEU, TFEU and the EU Charter of Fundamental Rights","ESA Guidelines and Q&As","Level 2 delegated acts adopted by the Commission"],exps:["❌ These are secondary legislation, below the Treaties.","✅ Correct — the TEU, TFEU, and the EU Charter of Fundamental Rights (same legal value as Treaties since Lisbon) are at the peak.","❌ ESA guidelines are soft law, well below the Treaties.","❌ Level 2 acts are derived from the Treaties."],correct:1,slide:"Slide 03"},
{q:"The Treaty of Lisbon (2009) introduced:",opts:["The Treaty on European Union, renamed from the founding text, and the euro","The European Economic Community, launching the post-war integration project","The Treaty on the Functioning of the EU (TFEU) and brought the EU Charter of Fundamental Rights into force with the same legal value as the Treaties","The Lamfalussy process to speed up financial market regulation"],exps:["❌ Renaming the founding text and introducing the euro were outcomes of the Maastricht Treaty (1992).","❌ Founding the EEC was the result of the Treaty of Rome (1957).","✅ Correct — the Treaty of Lisbon introduced the TFEU and brought the EU Charter into force with the same legal value as the Treaties.","❌ The Lamfalussy process was designed in 2001, before the Treaty of Lisbon."],correct:2,slide:"Slide 03"},
{q:"The principle of subsidiarity means:",opts:["The Union always acts before Member States on matters covered by EU law","The Union acts only when objectives cannot be sufficiently achieved by Member States and can therefore be better achieved at Union level","EU action must not exceed what is necessary to achieve Treaty objectives","EU law is directly applicable in national legal systems"],exps:["❌ The Union does not always act first; subsidiarity limits Union action.","✅ Correct — subsidiarity means the Union acts only when objectives cannot sufficiently be achieved by Member States.","❌ Not exceeding what is necessary describes the principle of proportionality.","❌ Direct applicability in national systems describes direct effect."],correct:1,slide:"Slide 03"},
{q:"The principle of proportionality means:",opts:["The Union always acts to the full extent possible to achieve Treaty objectives","Union action shall not exceed what is necessary to achieve Treaty objectives","National measures restricting fundamental freedoms must be proportionate to a legitimate aim","EU law prevails over incompatible national legislation"],exps:["❌ Acting to the full extent possible is the opposite of proportionality.","✅ Correct — proportionality means Union action shall not exceed what is necessary to achieve Treaty objectives.","❌ Proportionality of national restrictions is a CJEU concept; this question asks about the EU principle of proportionality.","❌ EU law prevailing over national law describes primacy."],correct:1,slide:"Slide 03"},
{q:"A Regulation under Article 288 TFEU is best described as:",opts:["Binding on Member States as to result, leaving freedom in means and form","An act of general scope, binding in all its elements and directly applicable in the EU without national transposition","An act binding only on its specified addressees","A non-binding instrument subject to comply-or-explain"],exps:["❌ Binding as to result but leaving freedom of means describes a Directive.","✅ Correct — a Regulation is of general scope, binding in all its elements, and directly applicable without need for national implementing measures.","❌ Binding only on specified addressees describes a Decision.","❌ Comply-or-explain describes ESA guidelines (soft law)."],correct:1,slide:"Slide 03"},
{q:"A Directive under Article 288 TFEU is best described as:",opts:["Directly applicable in all Member States without national implementing measures","Binding only on its specified addressees","Binding on Member States as to the result to be achieved, leaving freedom as to form and methods of implementation","A non-binding instrument subject to a comply-or-explain obligation"],exps:["❌ Direct applicability without national implementation describes a Regulation.","❌ Binding only on specified addressees describes a Decision.","✅ Correct — a Directive is binding as to result but leaves national authorities freedom as to form and methods of implementation.","❌ Comply-or-explain is associated with ESA guidelines (soft law), not Directives."],correct:2,slide:"Slide 03"},
{q:"'Gold-plating' refers to:",opts:["The Commission adding requirements to a Directive after its adoption","Member States increasing regulation beyond minimum Directive requirements when transposing — though Directives may set limitations to prevent fragmentation","Maximum harmonisation clauses preventing national deviation","An obligation to implement Directives within a stricter timeline"],exps:["❌ Gold-plating is a Member State transposition practice.","✅ Correct — gold-plating means Member States increase regulation beyond Directive requirements when transposing.","❌ Maximum harmonisation clauses are the tool used to limit gold-plating.","❌ Implementation timelines are not related to gold-plating."],correct:1,slide:"Slide 03"},
{q:"The 'Frankovich principle' means:",opts:["EU law has direct effect and can be relied upon before national courts","State liability for compensation when individuals cannot enforce EU-conferred rights due to a failure to implement a Directive","Regulations are directly applicable without national transposition","National courts must interpret domestic law in conformity with EU Directives"],exps:["❌ Direct effect is a separate doctrine.","✅ Correct — Frankovich establishes State liability: when a Directive grants rights that cannot be enforced because the State failed to implement it, individuals can claim compensation.","❌ Direct applicability of Regulations is a feature of Article 288 TFEU.","❌ Interpreting national law in conformity with EU Directives is 'consistent interpretation' (indirect effect)."],correct:1,slide:"Slide 03"},
{q:"The Lamfalussy process was designed in 2001 primarily because:",opts:["The financial crisis of 2008 exposed major weaknesses requiring faster regulatory responses","The EU's traditional legislative process proved too lengthy and cumbersome for rapidly evolving financial markets","The Maastricht Treaty mandated a specific financial markets legislative procedure","The CJEU ruled that existing legislative procedures breached the principle of proportionality"],exps:["❌ The Lamfalussy process was designed in 2001, seven years before the financial crisis.","✅ Correct — the Lamfalussy process addressed the fact that the traditional legislative process was too slow for rapidly evolving financial markets.","❌ The Maastricht Treaty did not mandate this.","❌ The CJEU did not rule on this; it was a political decision."],correct:1,slide:"Slide 03"},
{q:"Under the Lamfalussy process, Level 1 consists of:",opts:["Delegated acts (RTS) and implementing acts (ITS) drafted by ESAs","Broad framework legislation containing basic principles approved through the ordinary legislative procedure","Guidelines, Q&As and opinions from ESAs to foster convergence","Commission monitoring with power to bring infringement proceedings"],exps:["❌ RTS and ITS describe Level 2.","✅ Correct — Level 1 consists of broad framework legislation containing basic principles approved through the ordinary legislative procedure involving Parliament, Council, and Commission.","❌ Guidelines, Q&As, and opinions describe Level 3.","❌ Commission monitoring and infringement proceedings describe Level 4."],correct:1,slide:"Slide 03"},
{q:"Under the Lamfalussy process, Level 2 consists of:",opts:["Broad framework legislation with basic principles","Delegated acts (RTS) and implementing acts (ITS) drafted by ESAs and adopted by the Commission","Guidelines, Q&As and opinions from ESAs for convergence","Commission monitoring and infringement proceedings"],exps:["❌ Broad framework legislation describes Level 1.","✅ Correct — Level 2 consists of RTS (substantive regulatory rules) and ITS (technical/procedural details) drafted by ESAs and adopted by the Commission.","❌ Guidelines, Q&As, and opinions describe Level 3.","❌ Commission monitoring describes Level 4."],correct:1,slide:"Slide 03"},
{q:"ESA Guidelines are subject to a 'comply or explain' rule, meaning national authorities must:",opts:["Comply with the guidelines or face infringement proceedings","Either comply with the guidelines or explain publicly why they have not done so","Comply with the guidelines; Q&As carry the same formal obligation","Comply or explain; Q&As and Opinions carry no such formal obligation"],exps:["❌ Guidelines are soft law; non-compliance does not directly trigger infringement proceedings.","❌ Partially correct but incomplete — Q&As and Opinions do NOT carry the same formal comply-or-explain obligation.","❌ Q&As and Opinions do NOT carry the same formal comply-or-explain obligation as Guidelines.","✅ Correct — national authorities must comply with ESA Guidelines or explain why they have not; Q&As and Opinions are informal tools with no formal comply-or-explain obligation."],correct:3,slide:"Slide 03"},
{q:"Soft law instruments (ESA Guidelines) are best described as:",opts:["Formally binding acts challengeable through annulment actions before the CJEU","Non-binding instruments that have absolutely no legal effects in practice","Not formally binding, but carrying significant compliance throughout the EU; validity may be reviewed indirectly through preliminary rulings","Secondary legislation with direct applicability equivalent to Regulations"],exps:["❌ Soft law instruments cannot be subject to direct annulment actions.","❌ The slides explicitly state they can have significant legal effects.","✅ Correct — not formally binding but carrying significant compliance; validity may be reviewed indirectly through preliminary rulings.","❌ Soft law instruments are not secondary legislation."],correct:2,slide:"Slide 03"},
{q:"In Cassis de Dijon (1979), the CJEU's ruling consolidated:",opts:["ESA powers and the legal status of soft law instruments","The Frankovich principle on State liability","Free movement of goods, laying foundations for single market development","Horizontal direct effect of Directives between private parties"],exps:["❌ ESA powers and soft law were addressed in Short Selling (2014) and FBF (2021).","❌ The Frankovich principle was established in Francovich and Bonifaci (1991).","✅ Correct — Cassis de Dijon (1979) consolidated free movement of goods, laying foundations for single market development.","❌ Horizontal direct effect of Directives is a separate doctrine."],correct:2,slide:"Slide 03"},
{q:"In the Short Selling case (2014), the CJEU addressed:",opts:["Free movement of capital and state special rights","ESA powers and legal status of soft law instruments","The Frankovich principle on State liability","The principle of subsidiarity in financial regulation"],exps:["❌ State special rights and capital freedom were addressed in Commission v Portugal, France and Netherlands.","✅ Correct — the Short Selling case (2014) addressed ESA powers and the legal status of soft law instruments, and also softened the Meroni doctrine.","❌ The Frankovich principle was established in Francovich and Bonifaci (1991).","❌ Subsidiarity was not the central issue in the Short Selling case."],correct:1,slide:"Slide 03"},
{q:"Preliminary ruling procedures under Article 267 TFEU serve which purpose?",opts:["They allow the Commission to bring infringement proceedings against Member States","They enable the CJEU to provide uniform interpretation of EU law when referred by national courts","They allow private parties to challenge EU secondary legislation directly","They enable ESAs to seek CJEU guidance on Level 2 technical standards"],exps:["❌ Infringement proceedings are brought under Article 258 TFEU.","✅ Correct — preliminary rulings allow national courts to refer questions to the CJEU, ensuring uniform interpretation.","❌ Private parties challenging EU acts use annulment actions under Article 263 TFEU.","❌ ESAs do not use preliminary rulings; this mechanism is for national courts."],correct:1,slide:"Slide 03"},
{q:"Unlike national legal systems, secondary EU legislation under Article 288 TFEU is notable because:",opts:["Regulations always take precedence over Directives","There is no formal hierarchy between the five types of acts — each serves specific policy needs","Directives always take precedence over Regulations in financial regulation","Decisions are always superior to Regulations and Directives in matters of enforcement"],exps:["❌ Unlike national legal systems, there is no formal hierarchy between the five types of secondary legislation.","✅ Correct — there is no formal hierarchy between the five types of acts provided for in Article 288 TFEU; each serves specific policy needs.","❌ Directives do not take precedence over Regulations.","❌ Decisions are not superior to Regulations and Directives."],correct:1,slide:"Slide 03"},
{q:"Curia (curia.europa.eu) provides which information for legal research?",opts:["Regulations, directives, decisions, and CJEU rulings (Eur-Lex function)","Judgments, Advocate General opinions, and a 'Case Law Search' function","Financial market rules, guidelines, and recommendations (ESMA function)","Banking rules, guidelines, and Q&As on credit institutions (EBA function)"],exps:["❌ Access to EU law is provided by Eur-Lex, not Curia.","✅ Correct — Curia is the CJEU website providing judgments, Advocate General opinions, and the 'Case Law Search' function.","❌ Financial market rules and recommendations are provided by ESMA.","❌ Banking rules and Q&As are provided by EBA."],correct:1,slide:"Slide 03"},
{q:"The FBF case (2021) further clarified:",opts:["The Frankovich principle on State liability for non-implementation of Directives","Soft law measures and their judicial review, continuing the evolution of the Meroni doctrine","Free movement of goods and the principle of mutual recognition","The scope of the transparency obligation under the Market Abuse Directive"],exps:["❌ The Frankovich principle was established in earlier case law.","✅ Correct — the FBF case (2021) further clarified soft law measures and their judicial review, showing doctrine evolving while core Meroni constraints remain valid.","❌ Free movement of goods was addressed in Cassis de Dijon (1979).","❌ The transparency obligation under MAD is a separate topic."],correct:1,slide:"Slide 03"},
{q:"The co-decision procedure in EU legislative process is best described as:",opts:["The Commission adopting legislation independently after consulting Parliament","Joint adoption by Parliament and Council operating on equal footing, with the Commission launching consultations and presenting legislative proposals","The Council adopting legislation with mere Commission approval","The Council adopting legislation by unanimity after a Parliamentary vote"],exps:["❌ The Commission cannot adopt legislation independently.","✅ Correct — the co-decision (ordinary legislative) procedure involves joint adoption by Parliament and Council on equal footing, with Commission proposals.","❌ The Council does not act with mere Commission approval; Parliament is equally involved.","❌ Unanimity in the Council is the exception, not the rule."],correct:1,slide:"Slide 03"}
],
"04 — Supervisory Architecture":[
{q:"The ESFS (European System of Financial Supervision) is centred around:",opts:["The ECB and the SSM only","Three ESAs, the ESRB, and national supervisors, creating an integrated supervisory network","ESMA alone with direct supervisory powers over all financial sectors","The European Commission and national competent authorities"],exps:["❌ The SSM is part of banking supervision, not the entire ESFS.","✅ Correct — the ESFS centres around the three ESAs, the ESRB, and national supervisors.","❌ ESMA is only one of the three ESAs.","❌ The Commission and NCAs are not the centrepiece."],correct:1,slide:"Slide 04"},
{q:"The Meroni doctrine (CJEU, 1956) established which fundamental limit on EU agencies?",opts:["Agencies may exercise any power delegated to them by the Commission or Council","Agencies could only exercise 'clearly defined executive powers' subject to judicial review, not regulatory powers implying wide discretion for economic policy","Agencies must obtain unanimous Council approval before exercising supervisory powers","Agencies cannot impose financial penalties without prior court authorisation"],exps:["❌ The Meroni doctrine restricts agency powers, not grants unlimited delegation.","✅ Correct — Meroni established that agencies could only exercise 'clearly defined executive powers' subject to judicial review, not powers implying wide discretion.","❌ Unanimous Council approval is not required under Meroni.","❌ Financial penalties without court authorisation is a different issue."],correct:1,slide:"Slide 04"},
{q:"The Short Selling case (2014) affected the Meroni doctrine by:",opts:["Confirming that the original 1956 Meroni doctrine applies unchanged to modern ESAs","Softening Meroni standards post-Lisbon, allowing a margin of discretion when expertise is required, subject to objective criteria and judicial review","Abolishing the Meroni doctrine entirely for financial regulation","Extending Meroni to cover all EU agencies, not just financial supervisors"],exps:["❌ The Short Selling case softened, not confirmed, the original Meroni standards.","✅ Correct — the CJEU softened Meroni standards, allowing ESAs a margin of discretion when expertise is required, subject to objective criteria and judicial review.","❌ The Meroni doctrine was not abolished; core constraints remain valid per Fundación Tatiana (2024).","❌ The case specifically concerned ESMA's powers."],correct:1,slide:"Slide 04"},
{q:"ESMA is headquartered in which city and operates under which founding Regulation?",opts:["Frankfurt; Regulation 1092/2010","Paris; Regulation 1095/2010","London; Regulation 1093/2010","Brussels; Regulation 1094/2010"],exps:["❌ Frankfurt is where the ECB and EIOPA are based; Regulation 1092/2010 established the ESRB.","✅ Correct — ESMA is headquartered in Paris since 2011 and operates under Regulation 1095/2010.","❌ ESMA relocated from London to Paris; Regulation 1093/2010 established EBA.","❌ ESMA is based in Paris; Regulation 1094/2010 established EIOPA."],correct:1,slide:"Slide 04"},
{q:"ESMA's Board of Supervisors comprises:",opts:["The Chair, Executive Director, and six elected management board members","27 NCA heads with ultimate decision-making power","Representatives from the Commission, ECB, and Member State finance ministers","The three ESA chairs meeting jointly on cross-sectoral issues"],exps:["❌ Those are management board members, not the Board of Supervisors.","✅ Correct — the Board of Supervisors comprises 27 NCA heads and holds ultimate decision-making power.","❌ The Board of Supervisors comprises NCA heads, not Commission or ECB representatives.","❌ The three ESA chairs meeting describes the Joint Committee function."],correct:1,slide:"Slide 04"},
{q:"ESMA's Article 17 power enables it to:",opts:["Prohibit or restrict financial activities threatening market integrity — product intervention","Direct national supervisors or market participants when Union law is breached, ensuring compliance across jurisdictions","Engage in binding mediation to settle disputes between NCAs","Act decisively during declared emergencies"],exps:["❌ Product intervention (prohibiting or restricting activities) is Article 9(5).","✅ Correct — Article 17 empowers ESMA to direct national supervisors or market participants when Union law is breached.","❌ Binding mediation is Article 19.","❌ Acting during declared emergencies is Article 18."],correct:1,slide:"Slide 04"},
{q:"ESMA's Article 18 power enables it to:",opts:["Direct national supervisors or market participants when Union law is breached","Prohibit or restrict financial activities threatening market integrity","Act decisively during declared emergencies, coordinating responses to market stress and systemic threats","Engage in binding mediation to settle disputes between NCAs"],exps:["❌ Directing supervisors when Union law is breached is Article 17.","❌ Product intervention is Article 9(5).","✅ Correct — Article 18 allows ESMA to act decisively during declared emergencies, coordinating responses to market stress.","❌ Binding mediation is Article 19."],correct:2,slide:"Slide 04"},
{q:"ESMA's Article 9(5) power is notable because:",opts:["It is the standard mechanism for infringement proceedings against Member States","It permits prohibiting or restricting financial activities threatening market integrity or stability — ESMA is the only ESA authority to have activated this power","It enables binding mediation between national supervisors","It allows ESMA to directly supervise all credit rating agencies"],exps:["❌ Infringement proceedings are launched by the Commission under Article 258 TFEU.","✅ Correct — Article 9(5) permits prohibiting or restricting financial activities threatening market integrity or stability; ESMA is the only ESA to have activated this product intervention power.","❌ Binding mediation is Article 19.","❌ Direct supervision of credit rating agencies is one of ESMA's direct supervisory functions but not Article 9(5)."],correct:1,slide:"Slide 04"},
{q:"The EBA was relocated from London to Paris in which year, under which Regulation?",opts:["2016; Regulation 1093/2010","2019; Regulation 1093/2010","2019; Regulation 2019/2175","2021; Regulation 1093/2010"],exps:["❌ 2016 is when the Brexit referendum occurred, not when EBA relocated.","✅ Correct — the EBA was relocated from London to Paris in 2019. It operates under Regulation 1093/2010.","❌ While the relocation occurred in 2019, the founding Regulation is 1093/2010.","❌ EBA relocated in 2019, not 2021."],correct:1,slide:"Slide 04"},
{q:"Under MiCAR, EBA's new mandate includes:",opts:["Direct supervision of all crypto-asset service providers in the EU","Direct supervision of significant ART and EMT issuers above significance thresholds — the first time EBA becomes a direct supervisor","Supervision of all utility token issuers across the EU","Supervision only of crypto-asset trading platforms registered under MiCAR"],exps:["❌ Crypto-asset service providers are supervised by NCAs and ESMA for significant ones.","✅ Correct — MiCAR grants EBA direct supervision of significant ART and EMT issuers, marking the first time EBA becomes a direct supervisor, mirroring ESMA's model.","❌ Utility token issuers are not under EBA's direct supervision.","❌ Trading platforms are subject to national or ESMA supervision, not EBA."],correct:1,slide:"Slide 04"},
{q:"EIOPA is headquartered in which city and covers which sectors?",opts:["Paris; banking and investment services","Frankfurt am Main; insurance, reinsurance, institutions for occupational retirement provision, and financial conglomerates","Brussels; capital markets and investment funds","Luxembourg; securities and derivatives markets"],exps:["❌ Paris is where ESMA and EBA are based.","✅ Correct — EIOPA is headquartered in Frankfurt am Main under Regulation 1094/2010 and covers insurance, reinsurance, IORPs, insurance intermediaries, and financial conglomerates.","❌ Capital markets and investment funds are ESMA's mandate.","❌ Luxembourg is where the CJEU is based."],correct:1,slide:"Slide 04"},
{q:"The Banking Union comprises which three pillars?",opts:["ESMA, EBA, and EIOPA","Single Supervisory Mechanism (SSM), Single Resolution Mechanism (SRM), and European Deposit Insurance Scheme (EDIS — proposed)","European Central Bank, European Stability Mechanism, and EDIS","SSM, ESRB, and SRM"],exps:["❌ ESMA, EBA, and EIOPA are the three ESAs, not the Banking Union pillars.","✅ Correct — the Banking Union pillars are the SSM, SRM, and EDIS (proposed).","❌ The European Stability Mechanism is not a Banking Union pillar.","❌ The ESRB is not a Banking Union pillar."],correct:1,slide:"Slide 04"},
{q:"The ESRB is responsible for:",opts:["Direct supervision of systemically important banks in the euro area","Macro-prudential oversight, detecting and mitigating systemic threats through risk warnings and recommendations","Developing technical standards for financial regulation across all sectors","Approving all Level 2 delegated acts in the financial sector"],exps:["❌ Direct supervision of systemically important banks is the SSM/ECB's role.","✅ Correct — the ESRB is responsible for macro-prudential oversight, established by Regulation 1092/2010, hosted by ECB but institutionally independent.","❌ Developing technical standards is done by the three ESAs.","❌ Approving Level 2 delegated acts is the Commission's role."],correct:1,slide:"Slide 04"},
{q:"The Board of Appeal shared by EBA, ESMA and EIOPA is best described as:",opts:["An optional alternative to judicial review","A mandatory intermediate layer before the General Court with full jurisdiction over ESA decisions, able to confirm, amend or replace contested measures","A purely advisory body with no power to modify ESA decisions","A political body composed of EU institutional representatives"],exps:["❌ The Board of Appeal is mandatory, not optional.","✅ Correct — it is a mandatory intermediate layer before the General Court, with full jurisdiction to confirm, amend, or replace ESA decisions.","❌ The Board of Appeal has real decisional power.","❌ It comprises experts in banking, insurance, or securities law with demonstrated expertise — not a political body."],correct:1,slide:"Slide 04"},
{q:"AMLA (European Anti-Money Laundering Authority) was established by which Regulation and is based where?",opts:["Regulation 1095/2010; Paris","Regulation 2024/1620; Frankfurt am Main","Regulation 1093/2010; Paris","Regulation 1092/2010; Frankfurt am Main"],exps:["❌ Regulation 1095/2010 established ESMA.","✅ Correct — AMLA was established by Regulation 2024/1620 and is based in Frankfurt am Main.","❌ Regulation 1093/2010 established EBA.","❌ Regulation 1092/2010 established the ESRB."],correct:1,slide:"Slide 04"},
{q:"The pre-2001 state of EU financial supervision was characterised by:",opts:["A centralised EU-level supervisory system with uniform procedures","Supervisory competence residing solely with national authorities, creating fragmented systems with differing procedures and enforcement powers","A network of ESAs coordinating with national supervisors","ESMA having direct supervisory powers over all capital market participants"],exps:["❌ There was no centralised EU supervisory system before 2001.","✅ Correct — before 2001, supervisory competence resided solely with national authorities, creating fragmented, differing systems.","❌ The ESA network was created in 2011.","❌ ESMA was established in 2011."],correct:1,slide:"Slide 04"},
{q:"The De Larosière group was significant because:",opts:["It proposed the Lamfalussy process for capital markets regulation in 2001","It recommended comprehensive supervisory upgrade across all financial sectors following the 2008 financial crisis, leading to the creation of the ESAs in 2011","It established AMLA as the EU's anti-money laundering authority","It drafted the first EU framework for crypto-assets"],exps:["❌ The Lamfalussy process was proposed by the Committee of Wise Men in 2001.","✅ Correct — the De Larosière group recommended a comprehensive supervisory upgrade following the 2008 financial crisis, leading to the three ESAs in 2011.","❌ AMLA was established by Regulation 2024/1620, not by the De Larosière group.","❌ The De Larosière group preceded MiCAR."],correct:1,slide:"Slide 04"},
{q:"The Joint Committee of ESAs serves which function?",opts:["It replaces the three individual ESA boards for all financial regulation","It is the central forum for cross-sectoral issues — anti-money laundering, PRIIPs, cloud outsourcing, securitisation — issuing common guidance across banking, capital markets, and insurance","It directly supervises significant financial institutions across all three sectors","It advises the Commission on all Level 1 legislative proposals"],exps:["❌ The Joint Committee supplements, does not replace, the individual ESA boards.","✅ Correct — the Joint Committee is the central forum for cross-sectoral issues, issuing common guidance on AML, PRIIPs, cloud outsourcing, securitisation.","❌ Direct supervision of significant institutions is done by individual ESAs and NCAs.","❌ The Joint Committee does not primarily advise on Level 1 legislative proposals."],correct:1,slide:"Slide 04"},
{q:"The future direction of EU financial supervision involves which trend?",opts:["Progressive decentralisation returning supervisory powers to national authorities","Progressive selective centralisation — transfer of direct supervisory powers to EU-level institutions for areas with significant cross-border externalities","Elimination of the three ESAs and replacement with a single unified supervisor","Reduction of ESMA's mandate to focus exclusively on capital markets"],exps:["❌ The trend is towards centralisation, not decentralisation.","✅ Correct — recent developments signal deepening integration with expanding direct supervisory powers for ESMA, EBA's crypto mandate, and enhanced cross-sectoral coordination.","❌ There are no proposals to eliminate the three ESAs.","❌ ESMA's mandate is expanding, not being reduced."],correct:1,slide:"Slide 04"},
{q:"ESMA's direct supervisory functions include which entities?",opts:["All investment firms and credit institutions in the EU","Trade repositories under EMIR and SFTR, credit rating agencies, EU administrators of critical benchmarks, significant crypto-asset service providers under MiCAR, and DLT market infrastructures","All regulated markets and multilateral trading facilities in the EU","All investment funds and their managers across the EU"],exps:["❌ All investment firms and credit institutions are supervised by national authorities (and the ECB for significant banks).","✅ Correct — ESMA directly supervises trade repositories, credit rating agencies, EU critical benchmark administrators, significant CASPs under MiCAR, and DLT market infrastructures.","❌ Regulated markets and MTFs are supervised by national competent authorities.","❌ Investment funds and their managers are supervised by national authorities."],correct:1,slide:"Slide 04"}
],
"05 — Savings & Investments Union":[
{q:"The three critical problems caused by fragmentation of EU capital markets are:",opts:["Lack of supervisory convergence, absence of soft law, and insufficient ESA powers","Inflated cost of capital, discouraged cross-border investment, and enforcement asymmetries between Member States","Excessive gold-plating, insufficient mutual recognition, and absence of a passporting regime","Over-regulation of retail investors, lack of financial literacy, and inadequate pension systems"],exps:["❌ Supervisory convergence and ESA powers are separate issues.","✅ Correct — the three critical problems are: inflated cost of capital (duplicated disclosures deter equity market access), discouraged investment (different regimes depress cross-border allocation), and enforcement asymmetries (creating regulatory arbitrage).","❌ These are related concepts but not the three specific critical fragmentation problems identified.","❌ Retail investor issues and pension systems are discussed separately."],correct:1,slide:"Slide 05"},
{q:"The aspiration to create 'an area without internal frontiers' first appeared in which treaty and is now codified where?",opts:["The Maastricht Treaty (1992); Article 63 TFEU","The Treaty of Rome (1957); Article 26 TFEU","The Treaty of Lisbon (2009); Article 49 TFEU","The Treaty of Amsterdam (1997); Article 56 TFEU"],exps:["❌ While Article 63 TFEU governs capital freedom, the aspiration for an area without internal frontiers first appeared in the Treaty of Rome (1957).","✅ Correct — the aspiration first appeared in the Treaty of Rome (1957) and is now codified in Article 26 TFEU.","❌ The Treaty of Lisbon introduced the TFEU; Article 49 covers freedom of establishment.","❌ The Treaty of Amsterdam is not the source of this aspiration."],correct:1,slide:"Slide 05"},
{q:"The Gebhard proportionality test, as applied to measures derogating from fundamental freedoms, requires that measures:",opts:["Be approved by the European Commission and notified to ESMA before entering into force","Pursue legitimate objectives, apply without discrimination, be suitable for achieving goals, and go no further than necessary — four cumulative conditions","Be adopted through the ordinary legislative procedure and subject to a parliamentary vote","Be consistent with mutual recognition and home-country control principles"],exps:["❌ The Gebhard test is a judicial proportionality standard; it does not require prior Commission approval.","✅ Correct — the four-part Gebhard test: legitimate objectives, non-discrimination, suitable for achieving goals, and going no further than necessary.","❌ The Gebhard test applies to national measures reviewed by courts.","❌ Mutual recognition and home-country control are integration techniques, not the Gebhard test."],correct:1,slide:"Slide 05"},
{q:"'Negative integration' as an EU capital markets integration technique is best described as:",opts:["Directives establishing common standards but allowing Member States to impose additional requirements","Treaty freedoms enforced through Court of Justice review under non-discrimination and proportionality principles — proved insufficient to overcome deeply rooted national divergences","Directives and Regulations applying uniformly, leaving little room for gold-plating","The passporting regime enabling single authorisation for cross-border services"],exps:["❌ Directives allowing additional requirements describes 'Mutual Recognition' (1980s–1990s).","✅ Correct — negative integration means Treaty freedoms enforced through CJEU review; it proved insufficient to overcome national divergences in company, property, and contract laws.","❌ Uniform application leaving little room for gold-plating describes 'Maximum Harmonisation' (post-2008).","❌ The passporting regime is a product of positive integration through legislation."],correct:1,slide:"Slide 05"},
{q:"The passporting regime is best described as:",opts:["A system requiring firms to obtain separate licences in each Member State where they wish to operate","A principle establishing that once an undertaking is licensed in its home Member State, it may carry on the same activity throughout the EU without needing further licences","A supervisory mechanism giving host country authorities primary responsibility for ongoing prudential oversight","A mutual recognition agreement applying only to banking institutions"],exps:["❌ Requiring separate licences in each Member State is precisely what the passporting regime eliminates.","✅ Correct — the passporting regime means once an undertaking is licensed in its home Member State (satisfying common requirements once), it may carry on the same activity throughout the EU without further licences.","❌ Primary responsibility for ongoing prudential oversight lies with the home country authority.","❌ The passporting regime applies broadly across financial services, not only banking."],correct:1,slide:"Slide 05"},
{q:"Under the passporting regime, how long does a firm wait before beginning cross-border operations after notifying its home supervisor?",opts:["30 calendar days, then host authority must approve or reject","10 working days from the supervisor forwarding the notification dossier to host authorities — no separate permit required","Until the host authority issues a formal acknowledgment — no fixed deadline","6 months during which the host authority conducts a full suitability assessment"],exps:["❌ The timeframe is 10 working days, not 30 calendar days.","✅ Correct — firms inform home supervisors; the supervisor forwards a notification dossier to host authorities. Within 10 working days, the firm may begin operations — no separate permit required.","❌ There is a fixed 10-working-day deadline.","❌ A 6-month suitability assessment contradicts the passporting regime's efficiency purpose."],correct:1,slide:"Slide 05"},
{q:"Under the supervisory division of labour in the passporting regime, which is a function of the HOST country authority?",opts:["Conducting full-scope prudential and conduct supervision of the passporting firm","Investigating breaches regardless of where in the Union they occur","Imposing sanctions on the passporting undertaking","Enforcing general law applicable to all market participants and reacting to immediate threats to financial stability or investor protection"],exps:["❌ Full-scope prudential and conduct supervision is the HOME country authority's role.","❌ Investigating breaches regardless of location is the HOME country authority's role.","❌ Imposing sanctions on the undertaking is the HOME country authority's role.","✅ Correct — the host country enforces general law applicable to all market participants and reacts to immediate threats, in cooperation with the home supervisor."],correct:3,slide:"Slide 05"},
{q:"The Capital Markets Union (CMU) was announced in which year and by whom?",opts:["In 2008 by the ECB in response to the global financial crisis","In 2015 as a flagship European Commission project","In 2020 by the European Parliament as part of the COVID-19 recovery package","In 2017 as part of the Lamfalussy process reform"],exps:["❌ The CMU was a 2015 Commission project, not a 2008 ECB initiative.","✅ Correct — the CMU was announced in 2015 as a flagship European Commission project seeking to establish a genuine single market for capital.","❌ While the 2020 Action Plan was launched amid COVID-19 recovery, the CMU itself began in 2015.","❌ The CMU is a Commission initiative, not a Lamfalussy process reform."],correct:1,slide:"Slide 05"},
{q:"The 2020 CMU Action Plan is notable because, by re-instating several 2015 and 2017 objectives, it:",opts:["Confirmed the full success of previous CMU action plans","Confirmed partial failure of previous efforts, prompting the Savings and Investments Union project","Replaced the passporting regime with a new system of direct EU-level authorisation","Eliminated the need for Member State implementation by converting all CMU measures into Regulations"],exps:["❌ Re-instating previous objectives indicates those objectives had not been achieved.","✅ Correct — by re-instating several 2015 and 2017 objectives, the 2020 Action Plan confirmed partial failure of previous efforts, prompting the evolution toward the Savings and Investments Union.","❌ The 2020 Action Plan did not replace the passporting regime.","❌ Converting all measures into Regulations was not a specific outcome of the 2020 Action Plan."],correct:1,slide:"Slide 05"},
{q:"According to the slides, what percentage of banked citizens in ten surveyed countries had invested in financial products?",opts:["About 50%, indicating strong retail investor participation","Just over a quarter (28%), indicating disappointingly low retail investor involvement","Nearly three-quarters (72%), showing Europe's high saving rate translating into investment","About 40%, with most investing in government bonds"],exps:["❌ 50% would indicate moderate participation; the figure is much lower.","✅ Correct — just over a quarter (28%) of banked citizens had invested in financial products, with another 25% either actively looking to invest or interested.","❌ 72% is not the retail investor participation rate cited.","❌ 40% is not the figure cited; the slides report 28%."],correct:1,slide:"Slide 05"},
{q:"The 2023 Retail Investment Package adopted by the Commission consists of:",opts:["A new standalone Directive on retail investor protection and a Regulation establishing a European retail investor label","An amending Directive revising MiFID II, IDD, UCITS Directive, AIFMD, and Solvency II; an amending Regulation revising the PRIIPs Regulation; and ongoing financial literacy initiatives","A Regulation directly applicable in all Member States replacing MiFID II and PRIIPs entirely","A soft law package of ESA guidelines and Q&As addressed to national supervisors"],exps:["❌ The 2023 package does not create a standalone Directive or retail investor label.","✅ Correct — the 2023 Retail Investment Package consists of: an amending Directive revising MiFID II, IDD, UCITS, AIFMD, and Solvency II; an amending Regulation revising PRIIPs; and ongoing financial literacy initiatives.","❌ The package amends MiFID II and PRIIPs but does not replace them entirely.","❌ The 2023 Retail Investment Package is legislative (Directive and Regulation), not soft law."],correct:1,slide:"Slide 05"},
{q:"The SIU was named in 2025 to replace the CMU. According to the slides, how much household wealth remains in low-yield deposits?",opts:["More than €1 trillion, with €800 billion potentially redirectable","More than €10 trillion, with €8 trillion potentially redirectable if European savers' asset mix converged with US peers","Approximately €5 trillion, equally distributed across euro-area Member States","More than €20 trillion, mostly held by institutional investors"],exps:["❌ The slides report a much larger figure of more than €10 trillion.","✅ Correct — more than €10 trillion of household wealth remains in low-yield deposits; economists estimate €8 trillion could be redirected if European savers' asset mix converged with US peers.","❌ €5 trillion equally distributed is not the figure cited.","❌ The slides report €10+ trillion, not €20 trillion."],correct:1,slide:"Slide 05"},
{q:"Which of the following correctly describes Pillar 1 ('Citizens and Savings') of the four SIU pillars?",opts:["Addressing capital shortage for start-ups and scale-ups by clarifying prudential incentives for insurers and pension funds","Building trust, literacy, and attractive entry points through European savings and investment accounts, tax recommendations, reinforced Retail Investment Strategy, and Union-wide financial literacy targets","Targeting market-structure barriers through trading and post-trading legislative packages and removal of gold-plating in fund distribution","Pursuing balance between national competence and Union-level convergence, with ESMA receiving stronger supervisory powers"],exps:["❌ Addressing capital shortage for start-ups describes Pillar 2 (Investments and Financing).","✅ Correct — Pillar 1 (Citizens and Savings) builds trust, literacy, and attractive entry points through European savings accounts, tax recommendations, reinforced Retail Investment Strategy, and financial literacy targets.","❌ Targeting market-structure barriers describes Pillar 3 (Integration and Scale).","❌ Pursuing balance between national and EU-level competence describes Pillar 4 (Efficient Supervision)."],correct:1,slide:"Slide 05"},
{q:"The SIU–EMU relationship is best described as:",opts:["Competitive: the SIU aims to replace EMU as the primary framework for economic integration","Mutually reinforcing: EMU removes exchange-rate risk and enlarges markets for securities; SIU builds legal frameworks enabling cross-border capital flows; together they enhance resilience","Irrelevant: EMU governs monetary policy while SIU governs fiscal policy with no interaction","Hierarchical: EMU is subordinate to the SIU"],exps:["❌ The SIU does not seek to replace EMU; they are complementary and mutually reinforcing.","✅ Correct — the relationship is mutually reinforcing: EMU removes exchange-rate risk; SIU builds legal and supervisory frameworks; resulting capital flows smooth shocks and strengthen monetary union resilience.","❌ The slides describe a circular, symbiotic relationship between EMU and SIU.","❌ The slides describe EMU and SIU as complementary equals in a virtuous cycle."],correct:1,slide:"Slide 05"},
{q:"Between 2013 and 2023, US venture capital funds raised how much more capital than European counterparts?",opts:["Twice as much","Three times as much","Five times as much","Seven times as much"],exps:["❌ The gap is significantly larger than twice.","❌ Three times is not the figure cited.","❌ Five times is not the figure cited.","✅ Correct — between 2013 and 2023, US venture capital funds raised seven times more capital than European counterparts."],correct:3,slide:"Slide 05"},
{q:"'Maximum Harmonisation' as an integration technique (post-2008) differs from 'Mutual Recognition' (1980s–1990s) because:",opts:["Maximum Harmonisation requires full uniform rules; Mutual Recognition allowed Member States to impose additional requirements","Mutual Recognition established common standards but allowed Member States to impose additional requirements; Maximum Harmonisation applies uniformly, leaving little room for gold-plating and converting segmented regimes into one European market","Maximum Harmonisation was the first technique used, later replaced by Mutual Recognition after the financial crisis","Both techniques are identical; the distinction is purely terminological"],exps:["❌ This reverses the descriptions.","✅ Correct — Mutual Recognition allowed additional national requirements (leading to fragmentation); Maximum Harmonisation applies uniformly, converting nationally segmented regimes into one European market.","❌ The chronological order is reversed: Mutual Recognition preceded Maximum Harmonisation.","❌ The two techniques are substantively different."],correct:1,slide:"Slide 05"},
{q:"The 'critical success factor' for the SIU identified in the slides is:",opts:["The development of a digital euro to replace fragmented national payment systems","Achieving full tax harmonisation across all EU Member States","Sustained political commitment within the Union's overarching capital markets agenda — success depends on sustained political will and legislative courage","The creation of a single EU sovereign bond to deepen capital markets"],exps:["❌ The digital euro is a separate monetary initiative.","❌ Full tax harmonisation is a persistent challenge not identified as the critical success factor.","✅ Correct — the SIU may prove decisive only if it succeeds in anchoring strong political commitment; whether reforms fill Europe's chronic equity gaps depends on sustained political will and legislative courage.","❌ A single EU sovereign bond is not identified as the critical success factor."],correct:2,slide:"Slide 05"},
{q:"The four SIU pillars work as:",opts:["Competing initiatives where Member States may choose which to implement","Mutually reinforcing components to create deep, liquid, and resilient capital markets","Sequential steps where each pillar must be completed before the next begins","Optional enhancements to the existing CMU framework with no binding force"],exps:["❌ The four pillars are not competing; they are complementary.","✅ Correct — the four pillars (Citizens and Savings; Investments and Financing; Integration and Scale; Efficient Supervision) work as mutually reinforcing components.","❌ The pillars are not sequential; they are pursued simultaneously.","❌ The SIU pillars are the core strategic framework, not optional enhancements."],correct:1,slide:"Slide 05"}
]
,
"06 — MiFID II":[
{q:"MiFID II became applicable in which year?",opts:["2014","2016","2018","2020"],exps:["❌ 2014 is when MiFID II was adopted, not when it became applicable.","❌ 2016 is not when MiFID II became applicable.","✅ Correct — MiFID II became applicable in January 2018.","❌ 2020 is not when MiFID II became applicable."],correct:2,slide:"Slide 06"},
