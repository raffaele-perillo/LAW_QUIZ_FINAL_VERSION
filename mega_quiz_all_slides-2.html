{q:"Article 43 IFR explicitly excludes from 'liquid assets' the following:",opts:["Government bonds with remaining maturity over 1 year", "Client money and financial instruments, even if held in the investment firm's name", "Fixed assets and real estate owned by the investment firm", "Receivables from other group entities"],exps:["❌ Government bonds with short maturity would generally qualify as liquid assets.", "✅ Correct — Article 43 IFR explicitly excludes client money and financial instruments from the liquid assets calculation, even if held in the investment firm's name.", "❌ Fixed assets and real estate are not the specific exclusion cited.", "❌ Group receivables are not the specific exclusion cited."],correct:1,slide:"Slide 09"},
{q:"Consolidated supervision under IFD applies to:",opts:["Only Class 1 investment firms that must seek credit institution authorisation", "Holding companies and financial subsidiaries within investment firm groups, ensuring group-level capital adequacy and risk management", "Only cross-border groups with subsidiaries in more than three Member States", "All investment firms regardless of whether they belong to a group"],exps:["❌ Consolidated supervision applies beyond Class 1 firms.", "✅ Correct — consolidated supervision applies to holding companies and financial subsidiaries, ensuring group-level capital adequacy and risk management.", "❌ Consolidated supervision applies to all qualifying investment firm groups.", "❌ Consolidated supervision applies to groups, not all individual investment firms."],correct:1,slide:"Slide 09"}
],
"10 — EMIR, CSDR and SFTR":[
{q:"EMIR (2012), CSDR (2014), and SFTR (2015) all emerged from:",opts:["The 2015 Capital Markets Union initiative","The G20 commitments and the 2008 financial crisis, translating commitments into binding EU law to secure post-trading processes from clearing through settlement","The Lamfalussy process level 3 convergence initiatives","The ECB's 2010 review of Target2-Securities infrastructure"],exps:["❌ The CMU initiative came later (2015); the three regulations emerged from the financial crisis.","✅ Correct — all three regulations emerged from the 2008 financial crisis, translating G20 commitments into binding EU law to secure post-trading processes.","❌ Lamfalussy level 3 involves ESA soft law; EMIR, CSDR, and SFTR are Level 1 legislation.","❌ Target2-Securities is separate ECB infrastructure; the three regulations are distinct."],correct:1,slide:"Slide 10"},
{q:"The 2009 G20 commitment regarding OTC derivatives required that:",opts:["All derivatives trading be moved from OTC to exchange-based trading immediately","All standardised OTC derivatives be cleared through CCPs, reported to trade repositories, and traded on organised platforms where appropriate","All derivative contracts be governed by ISDA Master Agreements","OTC derivatives markets be abolished and replaced by regulated markets only"],exps:["❌ Not all derivatives were moved to exchange trading; clearing and reporting were the primary mandates.","✅ Correct — the G20 committed that all standardised OTC derivatives be cleared through CCPs, reported to trade repositories, and traded on organised platforms where appropriate.","❌ ISDA Master Agreements existed before 2009; they were not mandated by G20.","❌ OTC derivatives markets were not abolished; they were reformed with new requirements."],correct:1,slide:"Slide 10"},
{q:"The CCP 'default waterfall' under EMIR must meet which standard?",opts:["Cover 1 standard — sufficient resources to cover the default of the largest clearing member","Cover 2 standard — sufficient resources to cover the simultaneous default of the two clearing members with the largest exposures","Cover 3 standard — sufficient for the simultaneous default of the three largest clearing members","Cover All standard — sufficient for the default of all clearing members simultaneously"],exps:["❌ Cover 1 is below the EMIR requirement.","✅ Correct — the Cover 2 standard requires CCPs to hold sufficient financial resources to cover the simultaneous default of the two clearing members with the largest exposures.","❌ Cover 3 exceeds the EMIR minimum requirement.","❌ Cover All is not the EMIR standard."],correct:1,slide:"Slide 10"},
{q:"The EMIR default waterfall applies resources in which order?",opts:["Mutualized default fund first, then CCP's own resources, then defaulter's margin","Defaulter's initial margin and default fund contribution first, then CCP's own 'skin-in-the-game' resources, then mutualized default fund from non-defaulting members","CCP's own resources first, then defaulter's margin, then mutualized default fund","Non-defaulting members' contributions first, then defaulter's margin, then CCP's own resources"],exps:["❌ The defaulter's resources are applied first, not the mutualized fund.","✅ Correct — the waterfall starts with the defaulter's initial margin and default fund contribution, then CCP's own 'skin-in-the-game' dedicated resources, then the mutualized default fund from non-defaulting members.","❌ CCP's own resources are not applied first.","❌ Non-defaulting members' contributions are applied after the defaulter's resources and CCP's own resources."],correct:1,slide:"Slide 10"},
{q:"EMIR 3.0 (effective December 24, 2024) introduced the Active Account Obligation, which requires:",opts:["All EU derivatives clearing to move exclusively to EU CCPs immediately","Financial counterparties above clearing threshold (FC+) and NFC+ entities above EUR 3 billion in specified IR OTC derivatives to maintain permanently functional active accounts with EU CCPs and clear at least five trades annually per subcategory","All clearing to cease at UK CCPs from January 1, 2025","Investment firms to convert all OTC derivatives to exchange-traded instruments"],exps:["❌ The active account obligation does not require exclusive EU CCP clearing immediately.","✅ Correct — FC+ and qualifying NFC+ entities must maintain permanently functional active accounts with EU CCPs and clear at least five trades annually per subcategory.","❌ UK CCPs continue under time-limited equivalence until June 30, 2028.","❌ EMIR 3.0 does not require conversion of OTC derivatives to exchange-traded instruments."],correct:1,slide:"Slide 10"},
{q:"CSDR harmonised securities settlement by requiring transactions in transferable securities executed on trading venues to settle no later than:",opts:["T+1 (one business day after trade date)","T+2 (two business days after trade date)","T+3 (three business days after trade date)","T+5 (five business days after trade date)"],exps:["❌ T+1 is the target being discussed for future reform but not yet the CSDR standard.","✅ Correct — CSDR requires transactions in transferable securities to settle no later than T+2.","❌ T+3 was the pre-CSDR standard in many jurisdictions; CSDR reduced it to T+2.","❌ T+5 is not the CSDR standard."],correct:1,slide:"Slide 10"},
{q:"A Central Securities Depository (CSD) must provide at least which core services?",opts:["Securities settlement only","Settlement service (operating a securities settlement system) PLUS at least one of: notary service (initial recording in book-entry form) or central maintenance service (maintaining securities accounts at top-tier level)","Only the notary service of recording new security issuances","Only custody services for investors' securities"],exps:["❌ CSDs must provide settlement and at least one of the other two core services.","✅ Correct — a CSD must operate a securities settlement system AND provide at least one of two additional core functions: notary service or central maintenance.","❌ The notary service alone does not constitute a CSD.","❌ Custody is an ancillary service; the core services are settlement, notary, and central maintenance."],correct:1,slide:"Slide 10"},
{q:"SFTR (Securities Financing Transactions Regulation, 2015) was adopted in response to:",opts:["The need to regulate crypto-asset financing transactions","FSB recommendations addressing risks in the shadow banking sector — SFTs contributed to excessive leverage, pro-cyclicality, and systemic interconnectedness before and during the financial crisis","The European Commission's CMU initiative requiring greater transparency in securities lending","The ESRB's concerns about sovereign debt repo markets"],exps:["❌ SFTR was not adopted for crypto-asset financing.","✅ Correct — SFTR responds to FSB recommendations addressing shadow banking risks; SFTs contributed to excessive leverage, pro-cyclicality, and systemic interconnectedness during the crisis.","❌ While CMU transparency is a broader objective, SFTR specifically responds to FSB shadow banking recommendations.","❌ SFTR covers all SFT types, not specifically sovereign debt repos."],correct:1,slide:"Slide 10"},
{q:"Under SFTR, which types of securities financing transactions must be reported?",opts:["Only repurchase transactions (repos)","Only securities lending and borrowing transactions","Repurchase transactions, securities lending/borrowing, buy-sell back/sell-buy back, and margin lending — all new SFTs and lifecycle events must be reported within one working day","Only transactions above €100 million notional value"],exps:["❌ SFTR covers all SFT types, not only repos.","❌ SFTR covers all SFT types, not only securities lending.","✅ Correct — SFTR covers repurchase transactions, securities lending/borrowing, buy-sell back/sell-buy back, and margin lending; all new SFTs and lifecycle events must be reported to trade repositories within one working day.","❌ There is no €100 million notional threshold for SFTR reporting."],correct:2,slide:"Slide 10"},
{q:"Under SFTR, collateral reuse requires which conditions?",opts:["No conditions — reuse is freely permitted without restriction","Prior written information to the collateral provider about risks and consequences, AND prior express written consent from the collateral provider, AND financial instruments transferred from the collateral provider's account","Only written consent from the collateral provider, with no other conditions","Approval from the relevant NCA and notification to ESMA"],exps:["❌ Collateral reuse is subject to specific conditions under SFTR.","✅ Correct — three conditions: (1) prior written information to collateral provider about risks; (2) prior express written consent (evidenced by signature); (3) financial instruments transferred from collateral provider's account.","❌ Written consent alone is insufficient; prior written information is also required.","❌ NCA approval is not required for collateral reuse."],correct:1,slide:"Slide 10"},
{q:"EMIR counterparties are classified as Financial Counterparties (FC) and Non-Financial Counterparties (NFC). FC+ and NFC+ designation depends on:",opts:["Whether the counterparty is registered in an EU Member State","Whether OTC derivatives positions exceed clearing thresholds — FC+ and NFC+ are subject to the clearing obligation","Whether the counterparty is supervised by a national central bank","Whether the counterparty holds more than €1 billion in total derivatives exposure"],exps:["❌ EU registration alone does not determine FC+/NFC+ status.","✅ Correct — FC+ and NFC+ are designated based on whether OTC derivatives positions exceed clearing thresholds; these entities are subject to the clearing obligation.","❌ National central bank supervision does not determine clearing threshold status.","❌ A specific €1 billion threshold is not the universal EMIR clearing threshold."],correct:1,slide:"Slide 10"},
{q:"CCP authorisation under Article 17 EMIR requires which consultation process?",opts:["Only the home competent authority reviews and approves without external consultation","The home competent authority consults the college (including ESMA, NCAs, and ESCB members) — authorisation is refused if two-thirds of college members (excluding home authority) reach a joint negative opinion","ESMA directly grants CCP authorisation after consulting the ECB","The Commission approves CCP authorisation based on the home NCA's recommendation"],exps:["❌ External consultation through a college of supervisors is required.","✅ Correct — the home competent authority consults the college; authorisation is refused if two-thirds of college members (excluding home authority) reach a joint negative opinion.","❌ ESMA does not directly grant CCP authorisation (except for third-country Tier 2 CCPs under direct supervision).","❌ The Commission is not involved in CCP authorisation under Article 17 EMIR."],correct:1,slide:"Slide 10"},
{q:"The settlement discipline regime under CSDR includes which mechanisms?",opts:["Mandatory settlement within T+1 and criminal penalties for settlement failures","Cash penalties for settlement fails and mandatory buy-in processes for persistent failures","Only voluntary buy-in processes as agreed between parties","Only cash penalties with no mandatory buy-in requirement"],exps:["❌ The CSDR standard is T+2, not T+1, and penalties are administrative rather than criminal.","✅ Correct — CSDR settlement discipline includes cash penalties for settlement fails and mandatory buy-in processes for persistent failures.","❌ Buy-in processes are mandatory, not voluntary.","❌ CSDR includes both cash penalties AND mandatory buy-in processes."],correct:1,slide:"Slide 10"},
{q:"All data reported under SFTR must be retained for a minimum of:",opts:["One year","Three years","Five years","Ten years"],exps:["❌ One year is below the SFTR minimum retention period.","❌ Three years is below the SFTR minimum retention period.","✅ Correct — all SFTR data must be retained for a minimum of five years. A Legal Entity Identifier (LEI) is required for all legal entities involved in SFT reporting.","❌ Ten years is the CSDR data retention requirement for CSDs, not SFTR."],correct:2,slide:"Slide 10"},
{q:"The CSDR book-entry requirement means:",opts:["All financial instruments must be held in physical certificate form and stored in registered vaults","Securities admitted to trading or traded on venues must be represented in book-entry form through immobilisation or dematerialised issuance","Securities must be held exclusively by authorised custodians with minimum €1 billion capital","Only government bonds are required to be held in book-entry form"],exps:["❌ Physical certificate form is the opposite of the book-entry requirement.","✅ Correct — CSDR requires securities admitted to trading or traded on venues to be represented in book-entry form through immobilisation or dematerialised issuance.","❌ The €1 billion capital requirement for custodians is not what the book-entry requirement means.","❌ The book-entry requirement applies to all securities admitted to trading, not only government bonds."],correct:1,slide:"Slide 10"}
,
{q:"The EMIR reporting obligation requires reporting all derivatives transactions to trade repositories within:",opts:["One hour of execution", "One business day after the transaction", "One week of execution", "One month, in consolidated monthly reports"],exps:["❌ One hour is too short; the EMIR reporting deadline is one business day.", "✅ Correct — all derivatives transactions (OTC and exchange-traded) must be reported to registered trade repositories within one business day after the transaction.", "❌ One week is far too long.", "❌ Monthly consolidated reports are insufficient."],correct:1,slide:"Slide 10"},
{q:"Under EMIR, variation margin is exchanged daily to:",opts:["Build up a buffer against future potential exposure during close-out periods", "Reflect current exposure from market value changes in outstanding contracts", "Satisfy the Cover 2 standard for CCPs", "Fund the CCP's default fund contributions"],exps:["❌ Building a buffer against future potential exposure describes initial margin.", "✅ Correct — variation margin is exchanged daily to reflect current exposure from market value changes in outstanding contracts.", "❌ The Cover 2 standard is a CCP capital requirement.", "❌ Default fund contributions are a separate CCP risk management tool."],correct:1,slide:"Slide 10"},
{q:"CCP board independence under EMIR requires:",opts:["The entire board must be independent from clearing members", "At least one-third of management body members must be independent", "At least 50% of management body members must be independent", "Board members must be approved by ESMA before appointment"],exps:["❌ Full board independence is not required.", "✅ Correct — EMIR requires at least one-third of management body members to be independent.", "❌ 50% is above the EMIR requirement.", "❌ ESMA approval of board members is not required."],correct:1,slide:"Slide 10"},
{q:"Under SFTR, UCITS and AIFMs must inform investors in periodic reports about:",opts:["Avoiding all use of SFTs to protect retail investors", "Use of SFTs and total return swaps, and identify such use in pre-contractual documents", "SFT usage on a weekly basis reported to ESMA", "Obtaining NCA approval before engaging in any SFT"],exps:["❌ SFT use is permitted; SFTR requires disclosure, not prohibition.", "✅ Correct — UCITS and AIFMs must inform investors in periodic reports about use of SFTs and total return swaps, and identify such use in pre-contractual documents.", "❌ Weekly reporting to ESMA is not an SFTR obligation for investment funds.", "❌ NCA approval is not required before engaging in SFTs."],correct:1,slide:"Slide 10"},
{q:"The active account obligation under EMIR 3.0 requires FC+ entities to clear at least how many trades annually per subcategory at EU CCPs?",opts:["One trade per year", "Five trades annually per subcategory per class of derivatives in active accounts (with scaled requirements for low-frequency traders)", "Ten trades per quarter", "Twenty trades per year"],exps:["❌ One trade per year is below the minimum activity requirement.", "✅ Correct — FC+ entities must clear at least five trades annually per subcategory per class of derivatives in active accounts, with scaled requirements for low-frequency traders.", "❌ Ten trades per quarter is above the minimum annual requirement.", "❌ Twenty trades per year is above the minimum requirement."],correct:1,slide:"Slide 10"},
{q:"Under CSDR, the 'book-entry requirement' means securities admitted to trading must be represented:",opts:["In physical certificate form stored in registered vaults", "In book-entry form through immobilisation or dematerialised issuance", "Exclusively in dematerialised form — physical certificates are permanently prohibited", "In any form agreed between the issuer and the CSD"],exps:["❌ Physical certificate form is the opposite of the book-entry requirement.", "✅ Correct — CSDR requires securities admitted to trading or traded on venues to be represented in book-entry form through immobilisation or dematerialised issuance.", "❌ CSDR allows both immobilisation and dematerialised issuance.", "❌ The book-entry requirement is mandated by law."],correct:1,slide:"Slide 10"}
]
,
"11 — Prospectus Regulation":[
{q:"The Prospectus Regulation (EU 2017/1129) applies when:",opts:["Any financial instrument is created by a company","Transferable securities are offered to the public OR admitted to trading on EU regulated markets","Any financial product is sold to retail investors regardless of listing","Securities are issued exclusively to professional investors"],exps:["❌ Mere creation of an instrument does not trigger the Prospectus Regulation.","✅ Correct — the Regulation applies to transferable securities offered to the public OR admitted to trading on EU regulated markets.","❌ Not all retail sales trigger prospectus obligations; exemptions exist.","❌ Offers exclusively to professional investors are among the exemptions."],correct:1,slide:"Slide 11"},
{q:"The 'dual trigger' in the Prospectus Regulation means:",opts:["Both the issuer and the offeror must sign the prospectus","The prospectus obligation is triggered by EITHER an offer to the public OR admission to trading on a regulated market — whichever occurs first","The prospectus must be approved by both the home NCA and ESMA","The prospectus must be published in both English and the local language"],exps:["❌ The dual trigger concerns triggering events, not signatories.","✅ Correct — the obligation attaches to whichever trigger occurs first: offer to the public OR admission to trading on a regulated market.","❌ Only the home NCA approves; ESMA maintains a searchable storage mechanism but does not approve.","❌ Language requirements are separate from the dual trigger concept."],correct:1,slide:"Slide 11"},
{q:"The Listing Act (effective June 2026) introduced a general EU-wide exemption for offers with total consideration under:",opts:["€1 million per offeror over 12 months","€5 million per offeror over 12 months","EUR 12 million per offeror/issuer over 12 months — Member States may lower to €5 million for single-Member State offers","€50 million for all issuers regardless of size"],exps:["❌ €1 million was the previous minimum in the original Regulation.","❌ €5 million is the national option for single-Member State offers; the general EU threshold is €12 million.","✅ Correct — the Listing Act introduced a general exemption for offers under EUR 12 million per offeror/issuer over 12 months; Member States may lower to €5 million for offers limited to one Member State.","❌ €50 million is the EU Growth Prospectus threshold, not the general exemption."],correct:2,slide:"Slide 11"},
{q:"The passport mechanism under the Prospectus Regulation enables:",opts:["Third-country issuers to access EU markets without any prospectus","Once the home NCA approves the prospectus, it is automatically recognised throughout the EU — host authorities cannot conduct additional substantive review","Issuers to market securities in one additional Member State without re-approval","The Commission to approve all prospectuses centrally"],exps:["❌ Third-country issuers must comply with equivalence requirements.","✅ Correct — once the home NCA approves, the prospectus is recognised throughout the EU; host authorities may only enforce language rules and local advertising standards.","❌ The passport enables EU-wide access, not just one additional Member State.","❌ The Commission does not approve individual prospectuses."],correct:1,slide:"Slide 11"},
{q:"The EU Growth Prospectus is available to which issuers and what is its maximum page length?",opts:["Any EU issuer regardless of size; maximum 300 pages","SMEs, non-SME issuers on SME Growth Markets, and issuers with aggregate consideration below EUR 50 million employing fewer than 499 persons; maximum 75 pages","Only credit institutions and investment firms; maximum 100 pages","Only issuers with at least 18 months trading history; maximum 50 pages"],exps:["❌ Any EU issuer regardless of size applies to the full prospectus, not the EU Growth Prospectus.","✅ Correct — available for SMEs, non-SME issuers on SME Growth Markets, and issuers with aggregate consideration below EUR 50 million and fewer than 499 employees; maximum 75 pages.","❌ The EU Growth Prospectus is not limited to credit institutions and investment firms.","❌ The 18-month trading history requirement applies to the EU Follow-on Prospectus."],correct:1,slide:"Slide 11"},
{q:"The EU Follow-on Prospectus requires at least how many months of trading history, with what maximum page length?",opts:["6 months; maximum 100 pages","12 months; maximum 75 pages","18 months; maximum 50 pages — with only one year of financial information required and a 7-day approval period","24 months; maximum 30 pages"],exps:["❌ 6 months is below the threshold; 100 pages is the EU Growth Prospectus maximum.","❌ 12 months is below the threshold.","✅ Correct — the EU Follow-on Prospectus requires at least 18 months of continuous trading on a regulated market or SME Growth Market; maximum 50 pages, one year of financial information, 7-day approval period.","❌ 24 months is above the required threshold."],correct:2,slide:"Slide 11"},
{q:"The maximum length of a full equity prospectus on regulated markets (as set by the Listing Act) is:",opts:["100 pages","200 pages","300 pages","500 pages"],exps:["❌ 100 pages is not the full equity prospectus limit.","❌ 200 pages is not the limit set by the Listing Act.","✅ Correct — the Listing Act set a maximum of 300 pages for a full equity prospectus on regulated markets.","❌ 500 pages exceeds the Listing Act limit."],correct:2,slide:"Slide 11"},
{q:"The Universal Registration Document (URD) allows frequent issuers to:",opts:["File a prospectus without any NCA review from the first year of use","Describe their organisation and business annually; after the first two years the URD may be filed without prior approval; when launching offers, issuers add only a securities note and summary to compose a complete prospectus rapidly","Replace both the securities note and summary with a single document","Access the EU passport without home NCA approval"],exps:["❌ During the first two financial years, the URD must be approved by the home NCA.","✅ Correct — the URD enables rapid market access: approved for the first two years, then filed without prior approval; issuers add only a securities note and summary to compose a complete prospectus.","❌ The URD is one component; a securities note and summary are still required.","❌ Passporting requires NCA approval; the URD streamlines but does not bypass it."],correct:1,slide:"Slide 11"},
{q:"The prospectus summary's maximum length is:",opts:["3 A4 pages","5 A4 pages","7 A4 pages","10 A4 pages"],exps:["❌ 3 A4 pages is the maximum length of the KID (PRIIPs), not the prospectus summary.","❌ 5 A4 pages is not the limit.","✅ Correct — the prospectus summary is limited to a maximum of 7 A4 pages when printed.","❌ 10 A4 pages exceeds the limit."],correct:2,slide:"Slide 11"},
{q:"In Kolassa v Barclays (2015), the CJEU established that:",opts:["Issuers are not liable for prospectus errors if they have obtained NCA approval","Jurisdiction under Brussels I Regulation can lie with investor's home courts if objective connecting factors exist, even when the issuer is established abroad — expanding cross-border investor access to remedies","Only institutional investors can bring prospectus liability claims","Prospectus liability is fully harmonised at EU level with uniform remedies"],exps:["❌ NCA approval examines completeness and consistency, not material accuracy; it does not shield issuers from liability.","✅ Correct — in Kolassa, the CJEU established that jurisdiction can lie with the investor's home courts if objective connecting factors exist.","❌ Kolassa did not limit claims to institutional investors.","❌ Bankia v UMAS (2021) confirmed civil liability is NOT fully harmonised."],correct:1,slide:"Slide 11"},
{q:"Competent authority approval of a prospectus examines only:",opts:["Material accuracy of all statements","Completeness, consistency, and comprehensibility — material accuracy remains the issuer's responsibility (clarified by the Listing Act)","Whether the issuer meets minimum size and track record requirements","Whether the offer price is fair compared to intrinsic value"],exps:["❌ Material accuracy is the issuer's responsibility.","✅ Correct — the Listing Act clarified that competent authority approval examines only completeness, consistency, and comprehensibility — material accuracy remains with the issuer.","❌ Minimum size requirements are not how NCA approval is framed.","❌ NCAs do not assess whether the offer price is fair."],correct:1,slide:"Slide 11"},
{q:"A supplement to the prospectus is required when:",opts:["Only at the end of the offering period to confirm final terms","A significant new factor arises, a material mistake is discovered, or an inaccuracy is identified during the offer period or before admission — investors who have already committed receive at least two working days to withdraw","Only when the issuer voluntarily decides to update the prospectus","Never; updated information is always incorporated by reference"],exps:["❌ A supplement must be published during the offer period when specific triggers arise.","✅ Correct — supplements are required for significant new factors, material mistakes, or inaccuracies; investors who have already committed receive at least two working days to withdraw.","❌ Supplements are mandatory in specific circumstances, not purely voluntary.","❌ A supplement is distinct from incorporation by reference."],correct:1,slide:"Slide 11"},
{q:"Which instruments are excluded from the prospectus obligation?",opts:["Transferable securities admitted to trading on regulated markets","Money market instruments under 12 months, collective investment units (open-end), securities issued by Member States, and central bank shares","Bonds issued by credit institutions in the EU","Shares admitted to trading on SME Growth Markets"],exps:["❌ Transferable securities admitted to regulated markets are within scope.","✅ Correct — excluded instruments include money market instruments under 12 months, collective investment units (open-end), securities issued by Member States, and central bank shares.","❌ Bonds issued by credit institutions are generally within scope.","❌ Shares admitted to SME Growth Markets may be within scope."],correct:1,slide:"Slide 11"},
{q:"The 'fungibility threshold' raised by the Listing Act to 30% means:",opts:["Securities of a different class from those already admitted are exempt from prospectus requirements","No prospectus is required for securities fungible with those already admitted and representing less than 30% of existing securities over 12 months","Any secondary offering of previously listed securities is automatically exempt","Securities offered exclusively to existing shareholders are always exempt"],exps:["❌ The fungibility threshold applies to securities of the same class.","✅ Correct — the Listing Act raised the fungibility threshold to 30%; no prospectus is required for securities fungible with those already admitted representing less than 30% of existing securities over 12 months.","❌ Not all secondary offerings are exempt; the percentage threshold applies.","❌ Offers to existing shareholders benefit from a different exemption (fewer than 150 natural or legal persons)."],correct:1,slide:"Slide 11"},
{q:"In Bankia v UMAS (2021), the CJEU confirmed that:",opts:["Article 6 of the Prospectus Directive fully harmonises civil liability across the EU","Article 6 requires civil liability systems but does not fully harmonise them — national legislatures retain discretion over remedies, procedures, and limitation periods, provided investor protection is effective","Issuers bear no civil liability for prospectus errors if errors are immaterial","The Commission has exclusive competence to harmonise prospectus civil liability"],exps:["❌ Bankia confirmed the opposite — civil liability is NOT fully harmonised.","✅ Correct — Bankia confirmed Article 6 requires civil liability but does not fully harmonise it; national legislatures retain discretion provided investor protection is effective.","❌ All prospectus errors can give rise to civil liability; materiality thresholds vary by national law.","❌ The Commission does not have exclusive competence to harmonise civil liability."],correct:1,slide:"Slide 11"}
,
{q:"The exemption for 'fewer than 150 natural or legal persons per Member State, excluding qualified investors' reflects:",opts:["Pre-IPO placements to a small group of early investors", "The limited scale scenario: offers to fewer than 150 non-professional persons per Member State pose limited systemic risk", "Rights issues to existing shareholders only", "Private placements to a single institutional investor"],exps:["❌ Pre-IPO placements are typically covered by the qualified investors exemption.", "✅ Correct — this exemption reflects the limited scale scenario: offers to fewer than 150 natural or legal persons per Member State (excluding qualified investors) pose limited systemic risk.", "❌ Rights issues to existing shareholders may benefit from a different exemption.", "❌ A single institutional investor would be covered by the qualified investors exemption."],correct:1,slide:"Slide 11"},
{q:"The Prospectus Regulation requires the prospectus to remain publicly accessible for a minimum of:",opts:["Three years", "Five years", "Ten years", "Twenty years"],exps:["❌ Three years is below the minimum.", "❌ Five years is below the minimum.", "✅ Correct — the prospectus must remain publicly accessible for 10 years upon approval and is uploaded to ESMA's publicly searchable storage mechanism.", "❌ Twenty years is above the required period."],correct:2,slide:"Slide 11"},
{q:"The home State NCA has how long to review a standard prospectus submission?",opts:["5 business days for all submissions", "10 business days for standard submissions; 20 business days for first-time issuers; 5 business days for frequent issuers with a URD — each request for additional information restarts a 5-day review period", "30 calendar days for all submissions", "Only 3 business days for frequent issuers with a URD"],exps:["❌ 5 business days applies to reviews after additional information requests, not the initial standard submission.", "✅ Correct — 10 business days for standard submissions; 20 business days for first-time issuers; 5 business days for frequent issuers with a URD; each request for additional information restarts a 5-day review period.", "❌ 30 calendar days is not the standard review period.", "❌ 3 business days is not the URD frequent issuer review period; it is 5 business days."],correct:1,slide:"Slide 11"},
{q:"Risk factors in a prospectus must be:",opts:["Standard boilerplate warnings applicable to all investments in the asset class", "Specific to the issuer or securities, classified by probability of occurrence and severity of impact — generic disclaimers and boilerplate lists are prohibited", "Only listed if they represent a probability of occurrence above 50%", "Approved by the NCA as accurate before the prospectus is published"],exps:["❌ Standard boilerplate warnings are explicitly prohibited.", "✅ Correct — risk factors must be specific to the issuer or securities, classified by probability of occurrence and severity of impact; generic disclaimers and boilerplate lists are prohibited.", "❌ There is no 50% probability threshold.", "❌ The NCA examines completeness and comprehensibility but does not approve risk factors as 'accurate'."],correct:1,slide:"Slide 11"},
{q:"The 'base prospectus' option under the Prospectus Regulation is available to:",opts:["Any issuer seeking to simplify a large volume of equity offerings", "Non-equity issuers who may draw up a base prospectus with generic information, with tranche-specific data supplied later in 'final terms' published on the designated website", "Only sovereign issuers making frequent debt offerings", "Only UCITS management companies issuing units in collective investment undertakings"],exps:["❌ The base prospectus option is for non-equity issuers, not equity issuers.", "✅ Correct — for non-equity securities, issuers may elect to draw up a base prospectus containing generic information, with tranche-specific data supplied later in 'final terms'.", "❌ While sovereigns may use base prospectuses, the option is available to all non-equity issuers.", "❌ UCITS units are excluded from the Prospectus Regulation."],correct:1,slide:"Slide 11"}
],
"12 — Transparency, Short Selling & Shareholder Rights":[
{q:"The Transparency Directive (2004/109/EC) requires major shareholders to notify the issuer when they reach, exceed, or fall below which thresholds?",opts:["5%, 15%, 25%, 50%, 75%","5%, 10%, 15%, 20%, 25%, 30%, 50%, 75%","3%, 5%, 10%, 15%, 25%, 50%","10%, 20%, 30%, 50%, 75%"],exps:["❌ This list omits the 10%, 20%, and 30% thresholds.","✅ Correct — the Transparency Directive establishes thresholds at 5%, 10%, 15%, 20%, 25%, 30%, 50%, and 75%.","❌ This list includes 3% but omits 15%, 20%, 25%, and 30%.","❌ This list omits the 5%, 15%, 25% thresholds."],correct:1,slide:"Slide 12"},
{q:"When a major holding notification is required, it must be submitted to the issuer no later than:",opts:["One trading day following the triggering event","The fourth trading day following the triggering event","30 calendar days following the triggering event","At the next regular shareholder meeting"],exps:["❌ One trading day is too short; the deadline is four trading days.","✅ Correct — the notification must be submitted to the issuer no later than the fourth trading day following the triggering event.","❌ 30 calendar days is far too long.","❌ The notification obligation is immediate (four trading days), not tied to shareholder meetings."],correct:1,slide:"Slide 12"},
{q:"Under the Short Selling Regulation (EU 236/2012), a net short position in shares must be privately notified to the NCA when it reaches:",opts:["0.1% of issued share capital","0.2% of issued share capital — with incremental notifications for each additional 0.1%","0.5% of issued share capital","1% of issued share capital"],exps:["❌ 0.1% is the threshold for incremental changes after the initial 0.2% notification.","✅ Correct — net short positions reaching 0.2% of issued share capital must be privately notified to the NCA; public disclosure is required at 0.5%.","❌ 0.5% is the threshold for public disclosure, not private notification.","❌ 1% is above both notification thresholds."],correct:1,slide:"Slide 12"},
{q:"Under the Short Selling Regulation, a net short position in shares must be publicly disclosed when it reaches:",opts:["0.2% of issued share capital","0.3% of issued share capital","0.5% of issued share capital","1% of issued share capital"],exps:["❌ 0.2% triggers private notification to the NCA, not public disclosure.","❌ 0.3% is not a threshold in the SSR.","✅ Correct — public disclosure of net short positions in shares is required at 0.5%.","❌ 1% is above the public disclosure threshold."],correct:2,slide:"Slide 12"},
{q:"The SSR prohibition on 'naked' (uncovered) short selling means the seller must:",opts:["Own the securities outright with no encumbrance before selling","Have borrowed the instrument, entered an enforceable agreement to borrow it, or made arrangements with a third party confirming availability and steps to ensure settlement in due course","Obtain NCA approval before executing the short sale","Hold a matching long position to offset the short position"],exps:["❌ The requirement is about delivery arrangements at settlement, not outright ownership.","✅ Correct — sellers must either have borrowed the instrument, have an enforceable agreement to borrow, or have arrangements with a third party confirming availability and settlement steps.","❌ NCA approval is not required for each short sale.","❌ A matching long position is not required."],correct:1,slide:"Slide 12"},
{q:"The SSR restriction on uncovered sovereign CDS positions means investors may only enter CDS positions referencing sovereign debt for:",opts:["Any purpose including pure speculation","Legitimate hedging — hedging default risk on sovereign debt held, or value fluctuations in correlated assets","Speculative positions if disclosed to the NCA","Positions below a 1% net notional threshold"],exps:["❌ Pure speculation in uncovered sovereign CDS is prohibited.","✅ Correct — investors may only enter sovereign CDS for legitimate hedging: hedging default risk on sovereign debt held, or hedging value fluctuations in correlated assets.","❌ Speculative positions with NCA disclosure are still prohibited.","❌ There is no 1% threshold exemption for uncovered sovereign CDS."],correct:1,slide:"Slide 12"},
{q:"In UK v European Parliament (Case C-270/12, 2014), the CJEU held regarding ESMA's Article 28 SSR powers that:",opts:["ESMA's intervention powers violate the Meroni doctrine and must be constrained","Article 28 does not give ESMA unlimited discretion — powers are subject to cumulative conditions and criteria, satisfying the Meroni doctrine","ESMA has no power to intervene in short selling markets; only NCAs may do so","ESMA's powers under Article 28 are limited to declaratory opinions without binding effect"],exps:["❌ The Court found ESMA's powers compatible with Meroni.","✅ Correct — the Court found Article 28 does not give ESMA unlimited discretion; powers are subject to cumulative conditions and criteria.","❌ ESMA does have autonomous intervention powers under exceptional circumstances.","❌ Article 28 gives ESMA real binding intervention powers."],correct:1,slide:"Slide 12"},
{q:"The Transparency Directive's annual financial report must be published within:",opts:["Two months of the closing of the financial year","Four months of the closing of the financial year","Six months of the closing of the financial year","Twelve months of the closing of the financial year"],exps:["❌ Two months is the deadline for the half-yearly report.","✅ Correct — the annual financial report must be published within four months of the closing of the financial year.","❌ Six months exceeds the required four months.","❌ Twelve months would defeat the purpose of timely disclosure."],correct:1,slide:"Slide 12"},
{q:"The Shareholder Rights Directive II (SRD II, 2017/828) introduced which key provisions?",opts:["Mandatory disclosure of all derivatives positions held by institutional investors","Shareholder identification rights for issuers, engagement policy disclosure or explanation for institutional investors/asset managers, and 'say on pay' rights for shareholders","Mandatory shareholder approval for all significant transactions above €1 million","Requirement for all listed companies to adopt dual-class share structures"],exps:["❌ Derivatives position disclosure is an EMIR/SFTR obligation.","✅ Correct — SRD II introduced: shareholder identification; engagement policies or explanations; and say on pay rights.","❌ Significant transaction thresholds are a national law matter.","❌ SRD II does not require dual-class share structures."],correct:1,slide:"Slide 12"},
{q:"The Transparency Directive's periodic financial reports must remain publicly available for a minimum of:",opts:["Three years","Five years","Ten years","Indefinitely"],exps:["❌ Three years is below the minimum.","❌ Five years is below the minimum.","✅ Correct — financial reports must remain publicly available for a minimum period of ten years.","❌ 'Indefinitely' is not the regulatory requirement."],correct:2,slide:"Slide 12"},
{q:"The SSR exemption for market-making activities recognises that:",opts:["Market makers may engage in unlimited naked short selling without restriction","Short selling may be integral to market makers' ability to quote two-way prices and manage inventory risk — they are excluded from restrictive scope subject to prior notification and operational criteria","Market makers are exempt from all transparency requirements under the SSR","Market making is prohibited for investment firms subject to MiFID II"],exps:["❌ The market-making exemption is not unlimited; notification and operational criteria apply.","✅ Correct — market makers need short selling to quote two-way prices and manage inventory; they are excluded from restrictive scope subject to prior notification and operational criteria compliance.","❌ Market makers are still subject to transparency requirements.","❌ Market making is a core investment activity under MiFID II; it is not prohibited."],correct:1,slide:"Slide 12"},
{q:"In Adler Real Estate (Case C-605/18, 2021), the CJEU held that a Member State cannot impose more stringent major holding notification requirements unless:",opts:["The requirements relate to climate disclosure or ESG matters","The requirements relate to takeover bids, mergers, or similar transactions AND are supervised by an authority designated under Directive 2004/25 (Takeover Bids Directive)","The requirements are approved by ESMA before implementation","The requirements apply equally to domestic and foreign shareholders"],exps:["❌ Climate disclosure and ESG are separate regulatory topics.","✅ Correct — more stringent requirements are only permissible if: (1) related to takeover bids, mergers, or similar transactions; AND (2) supervised by an authority designated under the Takeover Bids Directive.","❌ ESMA approval is not a condition for national disclosure requirements.","❌ Equal treatment between domestic and foreign shareholders is a general principle but not the specific condition from Adler Real Estate."],correct:1,slide:"Slide 12"},
{q:"The Transparency Directive's half-yearly financial report must be published at the latest:",opts:["One month after the end of the relevant period","Two months after the end of the relevant period","Three months after the end of the relevant period","Six months after the end of the relevant period"],exps:["❌ One month is shorter than the required deadline.","✅ Correct — the half-yearly financial report must be published as soon as possible but at the latest two months after the end of the relevant period.","❌ Three months exceeds the required two-month deadline.","❌ Six months far exceeds the required deadline."],correct:1,slide:"Slide 12"}
,
{q:"The Transparency Directive's extended scope includes financial instruments that:",opts:["Only physically settled derivatives relating to shares", "On maturity give the unconditional right or discretion to acquire shares with attached voting rights, and instruments with an economic effect similar to holding the underlying shares", "All derivatives regardless of underlying asset", "Only exchange-traded options and futures on equity instruments"],exps:["❌ The extended scope covers instruments beyond only physically settled derivatives.", "✅ Correct — the extended scope covers: instruments that on maturity give the unconditional right or discretion to acquire shares with voting rights; and instruments with an economic effect similar to holding the underlying shares.", "❌ The extension is limited to instruments relating to shares with voting rights.", "❌ The scope extends beyond exchange-traded instruments to include OTC instruments."],correct:1,slide:"Slide 12"},
{q:"The SRD II 'say on pay' mechanism grants shareholders:",opts:["The right to directly set executive remuneration levels", "Rights relating to the remuneration policy and individual remuneration reports — the specific form (binding or advisory vote) is determined by Member States", "The right to veto individual executive appointments", "The right to receive a guaranteed portion of executive bonuses"],exps:["❌ Shareholders do not directly set individual remuneration amounts.", "✅ Correct — SRD II grants shareholders rights relating to the remuneration policy and individual remuneration reports; the specific form (binding or advisory vote) is determined by Member States.", "❌ Shareholders do not have a veto over individual executive appointments under SRD II.", "❌ Shareholders do not receive a portion of executive bonuses."],correct:1,slide:"Slide 12"},
{q:"Under the SSR, NCAs may introduce temporary short-term bans on short selling lasting:",opts:["Only until the end of the trading day following adoption — extendable for two additional trading days", "Up to 12 months for identified financial instruments (long-term restriction)", "Indefinitely pending European Commission review", "Only until ESMA confirms the restriction is proportionate"],exps:["✅ Correct — the short-term ban lasts only until the end of the trading day following adoption and may be extended for two additional trading days; longer-term restrictions require a separate mechanism.", "❌ Up to 12 months describes longer-term restrictions, not the short-term ban.", "❌ Restrictions are not indefinite.", "❌ NCAs do not require ESMA confirmation for proportionality before implementing restrictions."],correct:0,slide:"Slide 12"}
],
"13 — Takeover Bids Directive":[
{q:"Directive 2004/25/EC (Takeover Bids Directive) represents which type of harmonisation?",opts:["Full harmonisation with no Member State discretion","Maximum harmonisation setting ceiling rules that cannot be exceeded","Minimum harmonisation with significant Member State autonomy and extensive optional provisions","Total harmonisation replacing all national takeover law"],exps:["❌ The Directive provides minimum harmonisation, not full or total.","❌ Maximum harmonisation sets a ceiling; the Takeover Directive sets a floor.","✅ Correct — the Takeover Bids Directive represents minimum harmonisation with significant Member State autonomy and extensive optional provisions.","❌ National takeover law continues alongside the Directive's minimum requirements."],correct:2,slide:"Slide 13"},
{q:"Article 3 of the Takeover Bids Directive establishes which six overarching principles?",opts:["Equal treatment, timely information, company best interests, market integrity, serious intentions, and business continuity","Mandatory bid, equitable price, non-frustration, breakthrough rule, squeeze-out, and sell-out","Disclosure, conduct regulation, prudential rules, enforcement, governance, and licensing","Proportionality, subsidiarity, direct effect, primacy, mutual recognition, and home-country control"],exps:["✅ Correct — Article 3 establishes: equal treatment of shareholders, timely information, company best interests (board not frustrating the bid), market integrity, offeror's serious intentions, and business continuity of the offeree company.","❌ These describe specific mechanisms in the Directive, not the six overarching principles.","❌ These are categories of regulatory tools, not the Article 3 principles.","❌ These are general EU law principles, not the Article 3 takeover bid principles."],correct:0,slide:"Slide 13"},
{q:"The mandatory bid rule under Article 5 requires that:",opts:["An offeror must make a bid for at least 50% of the target's shares","When a person or persons acting in concert acquire a controlling holding, they must make a bid for ALL remaining securities at an equitable price","A bid must always be made in cash","Any acquisition above 10% triggers a mandatory bid obligation"],exps:["❌ The mandatory bid covers ALL remaining securities.","✅ Correct — when a controlling holding is acquired, the offeror must make a bid for all remaining securities at an equitable price, providing minority shareholders a viable exit.","❌ The Directive permits bids in cash or securities (though a cash alternative is required in certain circumstances).","❌ The control threshold is set by Member States (typically 30–33%); a 10% threshold would not trigger a mandatory bid."],correct:1,slide:"Slide 13"},
{q:"The 'equitable price' in a mandatory bid is determined as:",opts:["The average market price over the last 12 months before the bid announcement","The highest price paid by the offeror or persons acting in concert for the same securities during 6-12 months prior to the bid announcement","The net asset value of the company divided by the number of shares","A price independently assessed by an investment bank appointed by the NCA"],exps:["❌ The average market price is not the standard; the highest price paid is.","✅ Correct — the equitable price is the highest price paid by the offeror or persons acting in concert for the same securities during 6-12 months prior to the bid announcement.","❌ Net asset value per share is not the equitable price standard.","❌ An investment bank appointed by the NCA does not determine the equitable price."],correct:1,slide:"Slide 13"},
{q:"The non-frustration rule under Article 9 means that during the offer period:",opts:["The offeror cannot withdraw the bid once announced","The target company's board cannot undertake actions that could frustrate the bid without explicit shareholder authorisation — preventing boards from acting in their own interests","The target company must accept any bid above the equitable price","The offeror is prohibited from acquiring additional shares outside the formal bid"],exps:["❌ The non-frustration rule concerns the target board's actions, not the offeror's ability to withdraw.","✅ Correct — the non-frustration rule (Article 9) prevents the target board from taking defensive actions without shareholder approval during the offer period.","❌ The target company is not required to accept any bid above the equitable price.","❌ The offeror's ability to acquire additional shares is a separate matter."],correct:1,slide:"Slide 13"},
{q:"The breakthrough rule under Article 11 provides that:",opts:["The offeror may break through any mandatory minimum offer price","Transfer restrictions and voting restrictions don't apply to the offeror during the acceptance period; multiple-vote securities carry only one vote at shareholder meetings on defensive measures; when the offeror holds 75%+, restrictions and extraordinary rights cease","The offeror may acquire shares below the equitable price if they already hold 75%+","Target company employees may block a bid by refusing due diligence"],exps:["❌ The breakthrough rule concerns shareholder rights, not the offer price.","✅ Correct — the breakthrough rule lifts transfer restrictions and normalises voting rights during the acceptance period; when the offeror holds 75%+, restrictions and extraordinary rights cease.","❌ The offeror must pay at least the equitable price.","❌ Employees cannot block a bid by refusing due diligence."],correct:1,slide:"Slide 13"},
{q:"The squeeze-out right enables an offeror to acquire remaining securities when they hold:",opts:["50%+ of capital carrying voting rights","75%+ of capital carrying voting rights","90%+ of capital carrying voting rights and 90%+ of voting rights — the standard threshold; Member States may set up to 95%","100% of capital carrying voting rights"],exps:["❌ 50%+ triggers the mandatory bid obligation, not the squeeze-out right.","❌ 75%+ triggers the end of voting restrictions under the breakthrough rule, not the squeeze-out right.","✅ Correct — squeeze-out rights are triggered at 90%+ of capital and voting rights; Member States may set the threshold up to a maximum of 95%.","❌ 100% would render the squeeze-out unnecessary."],correct:2,slide:"Slide 13"},
{q:"The sell-out right under Article 16 is best described as:",opts:["The right of the offeror to sell its stake after winning a bid","The right of minority shareholders to require the offeror to buy their securities at a fair price after the offeror has acquired 90%+ of capital and voting rights — the mirror image of squeeze-out","The right of the target company's board to sell the company without shareholder approval","The right of the offeror to sell shares short during the offer period"],exps:["❌ The sell-out right belongs to minority shareholders, not the offeror.","✅ Correct — the sell-out right (Article 16) is the mirror image of the squeeze-out: minority shareholders may require the offeror to buy their securities at a fair price when the offeror holds 90%+.","❌ The board may not sell the company without shareholder approval under the non-frustration rule.","❌ Short selling by the offeror is governed by the SSR."],correct:1,slide:"Slide 13"},
{q:"The non-frustration rule and the breakthrough rule are described as 'optional' because:",opts:["Companies may choose not to comply based purely on commercial considerations","Member States may choose not to require companies to apply these rules, but must grant companies the reversible option to adopt them voluntarily — including a reciprocity exception","Both rules are purely advisory with no legal effect","Only listed companies in Member States with a regulated market must apply them"],exps:["❌ The optional nature is a Member State legislative choice, not a company commercial decision.","✅ Correct — Member States may choose not to require companies to apply Articles 9(2-3) and 11, but must grant companies the option to voluntarily adopt them; a reciprocity exception also applies.","❌ These rules have legal effect in Member States that choose to apply them.","❌ The optionality operates at Member State level."],correct:1,slide:"Slide 13"},
{q:"The reciprocity principle allows:",opts:["Bidders from third countries to benefit from EU takeover protections if their home jurisdiction provides equivalent protection","Companies applying non-frustration and breakthrough rules to be exempted from these obligations when targeted by companies not applying the same provisions","All EU companies to elect their preferred takeover regime from a menu of national options","The offeror to choose which Member State's takeover rules apply"],exps:["❌ The reciprocity principle concerns EU companies applying the rules when facing bidders from jurisdictions without the same rules.","✅ Correct — companies applying non-frustration and/or breakthrough rules may be exempted from these obligations when targeted by companies not applying the same provisions.","❌ There is no menu of national options for EU companies.","❌ The offeror cannot choose which Member State's rules apply."],correct:1,slide:"Slide 13"},
{q:"If the offeror purchased 5%+ of voting rights for cash during the relevant period, a cash alternative in the mandatory bid is:",opts:["Optional — the offeror may choose to offer securities instead","Mandatory — a cash alternative must be available when this condition is met","Prohibited — the offer must be made entirely in securities","Optional only if the company is on a regulated market with high daily trading volume"],exps:["❌ A cash alternative is mandatory, not optional, when this condition is met.","✅ Correct — if the offeror purchased 5%+ of voting rights for cash during the relevant period, a cash alternative is mandatory.","❌ The offer is not required to be made entirely in securities.","❌ Trading volume is not the determining factor; the 5%+ cash purchase is."],correct:1,slide:"Slide 13"},
{q:"The 2011 revision assessment of the Takeover Bids Directive concluded:",opts:["Major reforms were necessary and the Commission proposed a comprehensive revision","No significant revision was deemed necessary — the Commission concluded the existing framework provided adequate regulation, with only minor amendments","The Directive should be merged with MiFID II","The mandatory bid rule should be abolished"],exps:["❌ The 2011 review did not conclude that major reforms were necessary.","✅ Correct — no significant revision was deemed necessary; the Commission concluded the framework provided adequate regulation with only minor amendments not affecting foundational elements.","❌ The Directive was not merged with MiFID II.","❌ The mandatory bid rule was not proposed for abolition."],correct:1,slide:"Slide 13"},
{q:"'Persons acting in concert' refers to:",opts:["Institutional investors coordinating voting on ESG matters","Parties cooperating under agreement to acquire control or frustrate a bid — their combined holdings are relevant for calculating whether the mandatory bid threshold has been triggered","Financial advisors and legal counsel working together on a transaction","Companies within the same corporate group regardless of any agreement"],exps:["❌ Institutional investor coordination on ESG is a separate concept (SRD II).","✅ Correct — persons acting in concert cooperate under agreement to acquire control or frustrate a bid; their combined holdings determine whether the mandatory bid threshold is triggered.","❌ Financial advisors and legal counsel are not persons acting in concert in this sense.","❌ Corporate group companies may or may not be persons acting in concert depending on specific arrangements."],correct:1,slide:"Slide 13"}
,
{q:"The Takeover Bids Directive required the longest gestation period in EU capital markets legislation because:",opts:["The Commission lacked legal basis to regulate takeover bids until the Lisbon Treaty", "Profound differences between national legal systems and heated debates over fundamental assumptions — particularly over the non-frustration and breakthrough rules — required numerous compromises", "Member States could not agree on a mandatory bid threshold", "The European Parliament rejected the proposal due to concerns about employee rights"],exps:["❌ The legal basis existed before the Lisbon Treaty.", "✅ Correct — profound differences between national legal systems and heated debates, particularly over the non-frustration and breakthrough rules, required numerous compromises.", "❌ The Directive deliberately left the control threshold to Member States.", "❌ The Parliament rejected an early draft over the non-frustration and breakthrough rules, not specifically employee rights."],correct:1,slide:"Slide 13"},
{q:"The offer document under Article 6 must contain:",opts:["Only the offer price and acceptance deadline", "Terms of the bid, identity of offeror, securities targeted, consideration offered, existing holdings of offeror and concert parties, all conditions to which the bid is subject, offeror's intentions for future business and employment, and details of bid financing arrangements", "Only financial information about the target company", "Only the target company's board opinion on the bid"],exps:["❌ The offer document must contain comprehensive information.", "✅ Correct — Article 6 mandates comprehensive content: terms of bid, identity of offeror, securities targeted, consideration, existing holdings, all conditions, intentions for future business operations, plans regarding employment, and financing details.", "❌ The target's financial information is primarily in the board's opinion and target's own disclosures.", "❌ The board opinion is a separate disclosure requirement."],correct:1,slide:"Slide 13"},
{q:"The 'serious intentions' principle (one of Article 3's six principles) requires:",opts:["The offeror to conduct due diligence for at least 30 days before announcing", "The offeror to announce bids only after ensuring ability to implement fully and securing all consideration offered", "The offeror to obtain regulatory pre-approval before announcing the bid", "The offeror to consult with target company employees before announcing the bid"],exps:["❌ No minimum due diligence period before announcement is required.", "✅ Correct — the 'serious intentions' principle requires the offeror to announce bids only after ensuring ability to implement fully and securing all consideration offered.", "❌ Regulatory pre-approval is not required before announcing a bid.", "❌ Employee consultation is a separate requirement distinct from 'serious intentions'."],correct:1,slide:"Slide 13"}
],
"14 — PRIIPs":[
{q:"The PRIIPs Regulation (EU 1286/2014) supplements the Prospectus Regulation by providing:",opts:["General disclosure requirements for all financial products","Specific disclosure requirements for packaged retail investment and insurance-based investment products — which due to complexity and opacity require additional layers of transparency","Requirements only for structured equity products offered to retail investors","Requirements only for life insurance products with investment components"],exps:["❌ The PRIIPs Regulation has a specific scope focused on packaged products.","✅ Correct — the PRIIPs Regulation provides specific disclosure requirements for packaged retail investment and insurance-based investment products, which due to complexity and opacity require additional transparency.","❌ The scope extends beyond structured equity products.","❌ The scope extends beyond life insurance products."],correct:1,slide:"Slide 14"},
{q:"The Key Information Document (KID) must be prepared and published by:",opts:["The NCA responsible for supervising the PRIIP","The entity responsible for issuing the PRIIP (manufacturer) — prior to the PRIIP's availability to retail investors","The distributor of the PRIIP at the point of sale","ESMA for standardised retail products"],exps:["❌ The NCA does not prepare the KID.","✅ Correct — the manufacturer must prepare the KID and publish it on its website prior to the PRIIP's availability to retail investors.","❌ The distributor must provide the KID to investors but does not prepare it (unless also acting as manufacturer).","❌ ESMA does not prepare KIDs for individual products."],correct:1,slide:"Slide 14"},
{q:"The KID must be no longer than:",opts:["One A4 page","Two A4 pages","Three A4 pages","Five A4 pages"],exps:["❌ One A4 page is insufficient for the required content.","❌ Two A4 pages is not the regulatory maximum.","✅ Correct — the KID must be a short, concise document of no more than three A4 pages when printed.","❌ Five A4 pages exceeds the regulatory maximum."],correct:2,slide:"Slide 14"},
{q:"The KID contains how many defined sections?",opts:["Four sections","Five sections","Seven sections","Ten sections"],exps:["❌ Four sections is below the number required.","❌ Five sections is below the number required.","✅ Correct — the KID contains seven sections: (1) What is this product? (2) Risks and potential rewards? (3) Costs? (4) How long must I hold it? (5) Guarantee/compensation schemes? (6) Means of redress? (7) Other relevant information.","❌ Ten sections exceeds the number defined."],correct:2,slide:"Slide 14"},
{q:"Post-contract delivery of the KID under Article 13 is permitted only when:",opts:["The distributor chooses convenience over pre-contractual delivery","The retail client decided on own initiative to use distance communication, delivery was not possible in good time before contract conclusion, the client was informed of this and agreed to post-contract delivery rather than postponing","Only when the NCA grants an emergency waiver","Only for professional clients and eligible counterparties"],exps:["❌ Distributor convenience is not a permitted reason for post-contract delivery.","✅ Correct — Article 13 permits post-contract delivery only when: client contacted seller on own initiative via distance communication, delivery not possible before conclusion, client informed and agreed to post-contract delivery.","❌ NCA emergency waivers are not the mechanism.","❌ The PRIIPs Regulation applies to retail investors, not professional clients."],correct:1,slide:"Slide 14"},
{q:"EIOPA's role under the PRIIPs Regulation includes:",opts:["Preparing and distributing KIDs to retail investors directly","Monitoring insurance-based PRIIPs and having the power to temporarily prohibit or restrict their marketing, distribution, or sale","Approving all PRIIPs before they can be offered to retail investors","Standardising the KID format for all PRIIP types independently"],exps:["❌ EIOPA does not prepare or distribute KIDs to retail investors.","✅ Correct — EIOPA monitors insurance-based PRIIPs marketed in the Union and can temporarily prohibit or restrict marketing, distribution, or sale of certain PRIIPs or financial activities.","❌ NCAs approve individual products where relevant; EIOPA does not approve all PRIIPs.","❌ The KID RTS are developed jointly through the Joint Committee of ESAs."],correct:1,slide:"Slide 14"},
{q:"Product intervention by EIOPA or national authorities is best described as:",opts:["The primary regulatory tool used routinely for all PRIIPs","A measure of last resort, subject to conditions of residuality, proportionality, publication, and advance notice of at least one month to EIOPA and other authorities (except urgency)","A voluntary tool that authorities use at their discretion without conditions","A tool exclusively available to ESMA for equity-linked PRIIPs"],exps:["❌ Product intervention is a last resort, not a routine tool.","✅ Correct — product intervention is a last resort only when other measures are insufficient; it must be proportionate, published on the authority's website, and notified at least one month in advance (except urgency).","❌ Specific conditions apply; product intervention is not purely discretionary.","❌ ESMA has product intervention powers for MiFID II products; EIOPA has them for insurance-based PRIIPs."],correct:1,slide:"Slide 14"},
{q:"The distinction between 'manufacturers' and 'distributors' of PRIIPs is important because:",opts:["Only manufacturers are subject to any obligations under the PRIIPs Regulation","Manufacturers prepare and publish the KID; distributors must provide it to retail investors in a timely manner before they are bound by any contract — the same entity can be both manufacturer and distributor","Distributors prepare the KID; manufacturers only review it","Only distributors face civil liability for KID content"],exps:["❌ Both manufacturers and distributors have obligations.","✅ Correct — manufacturers prepare and publish the KID; distributors provide it before the client is bound by any contract; the same entity can be both manufacturer and distributor.","❌ Manufacturers, not distributors, prepare the KID.","❌ Primary civil liability for KID content rests with the manufacturer."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation applies to which category of investors?",opts:["All investors including professional clients and eligible counterparties","Retail investors as defined under MiFID II or the Insurance Distribution Directive — the PRIIPs regime does not apply to professional clients","Only investors below a certain asset threshold","Only investors who lack relevant investment experience"],exps:["❌ The PRIIPs Regulation is specifically for retail investors.","✅ Correct — the KID is delivered only when a PRIIP is marketed to 'retail investors' as defined under MiFID II or the IDD; the PRIIPs regime does not apply to professional clients.","❌ There is no specific asset threshold in the PRIIPs Regulation.","❌ The definition refers to MiFID II retail client status."],correct:1,slide:"Slide 14"},
{q:"Multi-option PRIIPs (offering multiple investment options) must:",opts:["Produce a single KID covering all options generically","Either divide disclosure into several KIDs (one per option) OR produce a single KID with generic disclosure plus specific technical annexes for each option","Only disclose the top three investment options by performance","Have each option approved separately by the NCA"],exps:["❌ A single KID without option-specific detail is insufficient.","✅ Correct — for multi-option PRIIPs, manufacturers must either produce separate KIDs per option OR produce a single KID with generic PRIIP disclosure plus specific technical annexes for each option.","❌ Disclosure of only the top three options would not meet RTS requirements.","❌ Separate NCA approval per option is not required."],correct:1,slide:"Slide 14"}
,
{q:"When a product falls within both the PRIIPs Regulation and the Prospectus Regulation:",opts:["The PRIIPs Regulation takes precedence and replaces the prospectus summary", "Manufacturers may need to prepare both a prospectus summary AND a PRIIPs KID — though when a KID exists, the prospectus summary can be modelled on and rely on the KID content", "Only the Prospectus Regulation applies as it is more comprehensive", "The NCA determines which single document is required"],exps:["❌ The PRIIPs Regulation does not replace the prospectus summary.", "✅ Correct — when a product falls within both Regulations, manufacturers may need to prepare both; however, the Prospectus Regulation acknowledges that when a KID exists, the prospectus summary can be modelled on and rely on the KID content.", "❌ Both Regulations may apply simultaneously.", "❌ The NCA does not determine which single document is required."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs KID must be provided to retail investors:",opts:["Within 24 hours after the contract is concluded", "Well before the retail investor is bound by any contract or offer relating to the PRIIP — 'in good time' before conclusion", "Within 30 days following the contract conclusion", "Only if the retail investor specifically requests it"],exps:["❌ The KID must be provided before the contract is concluded.", "✅ Correct — the KID must be provided 'in good time' before the retail investor is bound by any contract or offer relating to the PRIIP.", "❌ Providing the KID within 30 days after contract conclusion is only permitted in the limited post-contract delivery conditions of Article 13.", "❌ KID delivery is proactive and mandatory, not dependent on client request."],correct:1,slide:"Slide 14"},
{q:"The PRIIPs Regulation defines 'manufacturers' to also include:",opts:["Only original creators of PRIIPs who issue them for the first time", "The originator/creator who issues the PRIIP AND persons who make changes to an existing PRIIP — including changing its risk and return profile or the costs associated with investment", "Only investment firms authorised under MiFID II", "Only insurance undertakings regulated under Solvency II"],exps:["❌ The definition of manufacturer extends beyond original creators.", "✅ Correct — the Regulation defines a manufacturer as the originator/creator who issues the PRIIP, AND also as 'a person who makes changes to an existing PRIIP, including changing its risk and return profile or the costs associated with investment'.", "❌ Manufacturers include entities beyond MiFID II investment firms.", "❌ Manufacturers include entities beyond insurance undertakings."],correct:1,slide:"Slide 14"}
],
"15 — Market Abuse Regulation":[
{q:"The three pillars of the Market Abuse Regulation (MAR, 2014) are:",opts:["Disclosure, conduct regulation, and prudential rules","Prohibition of insider dealing, prohibition of market manipulation, and mandatory disclosure obligations for issuers","Licensing, conduct of business, and enforcement","Transparency, short selling, and shareholder rights"],exps:["❌ These are categories of regulatory tools, not the three MAR pillars.","✅ Correct — the three pillars are: (1) prohibition of insider dealing; (2) prohibition of market manipulation; (3) mandatory disclosure obligations for issuers.","❌ Licensing, conduct, and enforcement are regulatory tools.","❌ Transparency, short selling, and shareholder rights are covered by separate legislation."],correct:1,slide:"Slide 15"},
{q:"Article 7 MAR defines inside information as information that is:",opts:["Any material non-public information that any person in the company possesses","Precise, non-public, relating to one or more issuers or financial instruments, and which, if made public, would be likely to have a significant effect on prices","Any information that causes a measurable price movement when published","Confidential information labelled as such by the issuer in a written communication to the NCA"],exps:["❌ This description is too broad; the Article 7 definition requires all four elements.","✅ Correct — inside information must be: precise, non-public, relating to issuers or financial instruments, and likely to have a significant effect on prices if made public.","❌ Actual measurable price movement is not required.","❌ Labelling information as confidential is not part of the Article 7 definition."],correct:1,slide:"Slide 15"},
{q:"In Geltl v Daimler (C-19/11), the CJEU held that for the precision requirement:",opts:["Only final corporate decisions qualify; intermediate steps in protracted processes do not","A 'realistic prospect' of occurrence suffices — intermediate steps may constitute inside information if they meet the statutory criteria","Information must be certain to occur before it qualifies as precise","Precision requires the information to be disclosed in writing to the NCA"],exps:["❌ Intermediate steps in protracted processes can constitute inside information.","✅ Correct — in Geltl v Daimler, a 'realistic prospect' of occurrence suffices; expected price impact doesn't influence whether information is precise.","❌ Certainty is not required; a realistic prospect suffices.","❌ Written disclosure to the NCA is not part of the precision requirement."],correct:1,slide:"Slide 15"},
{q:"Article 17(1) MAR requires issuers to disclose inside information:",opts:["Once per year with annual financial statements","As soon as possible after inside information directly concerns that issuer","Only upon formal written request from the NCA","After pre-clearing the disclosure with ESMA"],exps:["❌ Annual disclosure would defeat the purpose of preventing insider dealing.","✅ Correct — Article 17(1) MAR requires issuers to inform the public as soon as possible of inside information which directly concerns that issuer.","❌ Issuers have a proactive obligation; no formal NCA request is required.","❌ Pre-clearing with ESMA is not required."],correct:1,slide:"Slide 15"},
{q:"Article 17(4) MAR allows delay of disclosure when which three cumulative conditions are met?",opts:["Information concerns a merger, the acquirer requests confidentiality, and the transaction completes within 6 months","Immediate disclosure would prejudice the issuer's legitimate interests, the delay would not mislead the public, and the issuer ensures ongoing confidentiality","The NCA has been informed, delay is limited to 30 days, and information concerns only internal reorganisation","The information is already known to major shareholders, trading is suspended, and a supplement will be published"],exps:["❌ Mergers and acquisitions are not specifically the three conditions.","✅ Correct — the three cumulative conditions are: (1) immediate disclosure would prejudice legitimate interests; (2) the delay would not mislead the public; (3) the issuer ensures ongoing confidentiality.","❌ A 30-day limit and NCA pre-notification are not the three statutory conditions.","❌ These are not the statutory conditions."],correct:1,slide:"Slide 15"},
{q:"'Market soundings' under Article 11 MAR allow selective disclosure of inside information for:",opts:["Complying with employee communication obligations","Assessing potential investor interest and conditions for possible transactions — e.g., gauging investor appetite before a capital raise — under strict procedural requirements","Providing inside information to analysts for research reports","Sharing information with major shareholders ahead of general meetings"],exps:["❌ Employee communication is governed by labour law, not Article 11 MAR.","✅ Correct — market soundings allow selective disclosure to gauge investor interest and conditions for possible transactions, under strict procedural requirements.","❌ Providing inside information to analysts without Article 11 procedures would be unlawful disclosure.","❌ Sharing with major shareholders without Article 11 procedures would be unlawful selective disclosure."],correct:1,slide:"Slide 15"},
{q:"The insider dealing prohibition under Article 8(1) MAR requires which two elements?",opts:["Knowledge AND actual price impact upon trading","Possession of inside information AND use of that information to acquire or dispose of financial instruments to which it relates","Working at the issuer AND trading in the issuer's securities","Senior management status AND deliberate intent to deceive the market"],exps:["❌ Actual price impact upon trading is not required.","✅ Correct — insider dealing requires: (1) possession of inside information; AND (2) use of that information by acquiring or disposing of financial instruments to which it relates.","❌ Working at the issuer is one way to be a primary insider but is not required.","❌ Senior management status and deliberate deceptive intent are not the two required elements."],correct:1,slide:"Slide 15"},
