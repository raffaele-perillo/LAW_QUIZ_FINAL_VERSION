{q:"The ne bis in idem debate in MAR enforcement was triggered by:",opts:["MiFID II provisions on administrative and criminal sanctions","Grande Stevens v. Italy (ECtHR, 2014): imposition of both administrative AND criminal sanctions for the same misleading-the-market conduct violated Article 4 of Protocol No. 7 ECHR","The Geltl v Daimler case on precision requirement","The Short Selling case on ESMA's intervention powers"],exps:["❌ MiFID II sanctions provisions are related but not the trigger.","✅ Correct — Grande Stevens v. Italy (ECtHR, 2014) held that imposing both administrative and criminal sanctions for the same misleading-the-market conduct violated the ne bis in idem principle.","❌ Geltl v Daimler addressed the precision requirement.","❌ The Short Selling case addressed ESMA's powers under the Meroni doctrine."],correct:1,slide:"Slide 15"},
{q:"Safe harbours for share buy-backs (Article 5 MAR) require:",opts:["ESMA approval and limitation to 10% of issued shares","Full details disclosed before trading; trades reported and disclosed; price/volume limits respected; carried out for capital reduction, debt obligations, or employee programs","Completion within 30 calendar days and price not exceeding 5% premium over market","No other market transactions in the preceding 90 days"],exps:["❌ ESMA approval is not required for the buy-back safe harbour.","✅ Correct — Article 5 MAR safe harbour for buy-backs requires: full details disclosed before trading; trades reported and disclosed; price/volume limits respected; carried out for capital reduction, debt obligations, or employee programs.","❌ A 30-day completion and 5% premium are not the safe harbour conditions.","❌ A 90-day moratorium is not a MAR safe harbour condition."],correct:1,slide:"Slide 15"},
{q:"'Benchmark manipulation' was added to MAR as a prohibited form of market manipulation after:",opts:["The WorldCom and Enron accounting scandals","The LIBOR and EURIBOR scandals of 2012","The flash crash of 2010","The subprime mortgage crisis and Lehman Brothers collapse"],exps:["❌ WorldCom and Enron were accounting scandals, not benchmark manipulation.","✅ Correct — benchmark manipulation was added to MAR after the LIBOR and EURIBOR scandals of 2012.","❌ The flash crash prompted algorithmic trading rules.","❌ The subprime crisis prompted post-trade infrastructure reform (EMIR)."],correct:1,slide:"Slide 15"},
{q:"'Tippee liability' under Article 8(3) MAR establishes that:",opts:["Primary insiders are liable for all profits of all tippees down the chain","A person who receives a recommendation to trade is liable where they know or ought to know the recommendation is based on inside information — reflecting EU's market-based approach (not the US fiduciary-based model)","Only primary insiders who directly benefit financially from tipping are liable","Tippee liability applies only to professional investors with fiduciary duties"],exps:["❌ While tippers are liable, Article 8(3) specifically establishes tippee liability.","✅ Correct — Article 8(3) MAR establishes tippee liability where the recipient knows or ought to know the recommendation is based on inside information; reflecting EU's market-based approach.","❌ Financial benefit to the tipper is the US fiduciary test; EU MAR uses a market-based approach.","❌ Tippee liability applies regardless of fiduciary duties."],correct:1,slide:"Slide 15"}
,
{q:"The 'Efficient Capital Markets Hypothesis' (ECMH) underpins MAR because:",opts:["It proves all investors always act rationally", "Its central claim that efficient markets reflect available material information in prices justifies regulatory intervention against any asymmetry in access to material information", "It demonstrates that insider dealing does not affect market prices", "It provides the mathematical framework for calculating insider trading profits"],exps:["❌ The ECMH assumes rational behaviour as a theoretical model.", "✅ Correct — the ECMH's central claim that efficient markets reflect available material information justifies MAR's intervention against information asymmetry through the insider dealing and manipulation prohibitions.", "❌ Insider dealing distorts prices precisely because inside information has value.", "❌ The ECMH is a theoretical framework, not a calculation methodology."],correct:1,slide:"Slide 15"},
{q:"'Permitted selective disclosure' under MAR must be interpreted:",opts:["Broadly to allow free flow of information for legitimate business purposes", "Narrowly — disclosure must be strictly necessary for professional activity, not merely useful or convenient; if the recipient lacks a confidentiality obligation, the issuer must restore informational parity with the market", "Broadly to allow analysts to receive management briefings before earnings announcements", "Without restriction if both parties are regulated financial entities"],exps:["❌ Permitted selective disclosure is interpreted narrowly.", "✅ Correct — disclosure must be strictly necessary for professional activity; if the recipient lacks a confidentiality obligation, the issuer must restore informational parity (simultaneous disclosure if intentional; prompt disclosure if unintentional).", "❌ Management briefings to analysts are not automatically permitted.", "❌ The status of both parties as regulated entities does not exempt them from MAR's selective disclosure rules."],correct:1,slide:"Slide 15"},
{q:"Article 8(2) MAR specifically added which previously uncovered prohibited conduct?",opts:["Tipping inside information to third parties", "Cancelling or amending orders placed before the person came to possess inside information — explicitly added by MAR to close a loophole", "Using inside information through derivatives rather than direct share purchases", "Communicating inside information to a person who is also an insider"],exps:["❌ Tipping inside information was already prohibited.", "✅ Correct — MAR explicitly added the cancellation or amendment of orders placed before possessing inside information, closing a loophole where traders would cancel pending orders upon receiving inside information.", "❌ Using inside information through derivatives was already prohibited.", "❌ Communicating inside information is addressed by the unlawful disclosure prohibition."],correct:1,slide:"Slide 15"},
{q:"'Algorithmic manipulation' as a specific form of market manipulation under Article 12(2) MAR includes:",opts:["Any use of algorithms for trading, which is inherently manipulative", "Orders via electronic means (including HFT) that disrupt trading systems, obscure genuine orders, or create false signals about supply, demand, or price — including spoofing, layering, and quote stuffing", "Only spoofing strategies where orders are placed and immediately cancelled", "Only layering strategies where multiple orders are placed at different price levels"],exps:["❌ Algorithmic trading per se is not inherently manipulative; only specific manipulative techniques are prohibited.", "✅ Correct — Article 12(2) MAR lists algorithmic manipulation as orders via electronic means (including HFT) that disrupt trading systems, obscure genuine orders, or create false signals.", "❌ Algorithmic manipulation covers more than only spoofing.", "❌ Algorithmic manipulation covers more than only layering."],correct:1,slide:"Slide 15"}
],
"16 — Sustainable Finance & ESG":[
{q:"The EU Taxonomy Regulation identifies how many environmental objectives?",opts:["Two","Four","Six","Eight"],exps:["❌ Two is too few.","❌ Four is not the correct number.","✅ Correct — six environmental objectives: climate change mitigation, climate change adaptation, sustainable use of water and marine resources, transition to circular economy, pollution prevention and control, and protection of biodiversity and ecosystems.","❌ Eight is too many."],correct:2,slide:"Slide 16"},
{q:"For an activity to qualify as environmentally sustainable under the Taxonomy Regulation, it must cumulatively satisfy:",opts:["ESMA certification, minimum capital thresholds, disclosure to investors, and Paris Agreement alignment","Substantial contribution to at least one environmental objective, Do No Significant Harm (DNSH) to other objectives, compliance with minimum social and governance safeguards, and meeting relevant technical screening criteria","Audit by an EU-registered external reviewer, listing on an EU trading venue, an ESG rating, and NCA approval","SFDR Article 9 alignment, ESMA endorsement, CSRD reporting, and CSDDD due diligence compliance"],exps:["❌ ESMA certification and capital thresholds are not Taxonomy requirements.","✅ Correct — the four cumulative requirements are: (1) substantial contribution to at least one of six environmental objectives; (2) DNSH to other objectives; (3) minimum social and governance safeguards; (4) relevant technical screening criteria.","❌ External reviewer audits and ESG ratings are not the four Taxonomy requirements.","❌ SFDR alignment and ESMA endorsement are not Taxonomy requirements."],correct:1,slide:"Slide 16"},
{q:"The CSRD entered into force on which date?",opts:["January 1, 2021","5 January 2023","March 1, 2022","June 30, 2024"],exps:["❌ January 1, 2021 is not when the CSRD entered into force.","✅ Correct — the CSRD entered into force on 5 January 2023.","❌ March 1, 2022 is not when the CSRD entered into force.","❌ June 30, 2024 is not when the CSRD entered into force."],correct:1,slide:"Slide 16"},
{q:"The 'dual materiality principle' under CSRD means:",opts:["Companies must report under both CSRD and SFDR simultaneously","Financial materiality (how sustainability issues affect the company — outside-in) AND impact materiality (how the company's activities impact people and environment — inside-out)","Both quantitative and qualitative sustainability data must be reported","Sustainability reports must be audited by two independent auditors"],exps:["❌ Dual materiality relates to the scope of reporting, not two regulatory frameworks.","✅ Correct — dual materiality means reporting on both financial materiality (outside-in) AND impact materiality (inside-out).","❌ Quantitative and qualitative reporting is not what 'dual materiality' means.","❌ Dual auditors is not what dual materiality means."],correct:1,slide:"Slide 16"},
{q:"CSRD 'Wave 1' (reporting for FY 2024) applies to:",opts:["All listed companies in the EU regardless of size","Large public-interest entities with more than 500 employees (previously subject to NFRD)","All large undertakings including non-listed companies above 250 employees","Only banks and insurance companies above €1 billion in assets"],exps:["❌ Wave 1 is limited to entities with over 500 employees previously subject to NFRD.","✅ Correct — Wave 1 (reporting for FY 2024) applies to large public-interest entities with more than 500 employees.","❌ All large undertakings above 250 employees are Wave 2 (reporting for FY 2027).","❌ Banks and insurance companies specifically are not the only Wave 1 entities."],correct:1,slide:"Slide 16"},
{q:"The Stop-the-Clock Directive delayed CSRD implementation by:",opts:["Stopping all CSRD Wave 1 reporting requirements","Delaying Waves 2 and 3 by two years (Wave 2: 2028; Wave 3: 2029)","Indefinitely postponing all CSRD requirements","Delaying only Wave 3 by one year"],exps:["❌ Wave 1 was not affected.","✅ Correct — the Stop-the-Clock Directive delayed Waves 2 and 3 by two years.","❌ The Directive does not indefinitely postpone all CSRD requirements.","❌ Both Waves 2 and 3 were delayed by two years."],correct:1,slide:"Slide 16"},
{q:"The SFDR distinguishes Article 8 products from Article 9 products because:",opts:["Article 8 products are more expensive for investors","Article 8 products promote environmental/social characteristics; Article 9 products have sustainable investment as their specific objective — both face different disclosure requirements","Article 8 products are available to retail investors; Article 9 products only for professional investors","Article 8 products are regulated by ESMA; Article 9 products by national authorities"],exps:["❌ Cost is not the distinction.","✅ Correct — Article 8 products promote E/S characteristics; Article 9 products have sustainable investment as their objective; both face specific disclosure requirements.","❌ Both can be available to retail investors.","❌ Both are regulated under the SFDR framework."],correct:1,slide:"Slide 16"},
{q:"The CSDDD maximum pecuniary sanction is:",opts:["1% of net worldwide turnover","5% of net worldwide turnover","€10 million fixed fine","€100 million or 2% of global turnover, whichever is higher"],exps:["❌ 1% is below the CSDDD maximum.","✅ Correct — pecuniary sanctions under the CSDDD can reach up to 5% of net worldwide turnover.","❌ A fixed fine of €10 million is not the CSDDD maximum.","❌ The CSDDD uses 5% of net worldwide turnover, not a €100 million/2% formula."],correct:1,slide:"Slide 16"},
{q:"The ESG Ratings Regulation (EU 2024/3005) requires EU-established ESG rating providers to obtain authorisation from:",opts:["The national competent authority of their home Member State","ESMA — and they must maintain independence and impartiality, use rigorous methodologies, manage conflicts of interest, and are prohibited from combining ratings with certain advisory and financial services","EBA — as ESG ratings are considered equivalent to credit ratings","The European Commission — as ESG ratings affect EU sustainable finance policy"],exps:["❌ EU-established ESG rating providers must obtain authorisation from ESMA, not national authorities.","✅ Correct — EU-established providers must obtain ESMA authorisation and comply with independence, methodology, and conflict of interest requirements.","❌ EBA covers banking; ESG rating providers are supervised by ESMA.","❌ The Commission sets policy; ESMA grants authorisation."],correct:1,slide:"Slide 16"},
{q:"The European Green Bond Standard (Regulation EU 2023/2631) requires proceeds to be:",opts:["Certified as green by ESMA before issuance","Fully allocated to environmentally sustainable economic activities under the Taxonomy Regulation before maturity","Used for at least 50% renewable energy projects","Invested exclusively in EU Member State infrastructure projects"],exps:["❌ ESMA does not certify proceeds as green before issuance.","✅ Correct — European green bond proceeds must be fully allocated to environmentally sustainable economic activities under the Taxonomy Regulation before maturity.","❌ A 50% renewable energy minimum is not the EuGB Standard requirement.","❌ EU Member State infrastructure is not the only eligible use."],correct:1,slide:"Slide 16"},
{q:"The three fundamental pillars of the European sustainable finance architecture are:",opts:["SFDR, Taxonomy Regulation, and CSRD","Taxonomy (common language for sustainable activities), mandatory reporting/disclosure, and implementation tools (benchmarks, standards, codes of conduct)","ESG ratings, green bonds, and climate transition plans","Article 8 products, Article 9 products, and the DNSH principle"],exps:["❌ SFDR, Taxonomy, and CSRD are specific legislative instruments, not the three fundamental pillars.","✅ Correct — the three pillars are: (1) the taxonomy as a common language; (2) mandatory reporting/disclosure; (3) implementation tools such as benchmarks, standards, and codes of conduct.","❌ ESG ratings, green bonds, and climate transition plans are instruments, not the three foundational pillars.","❌ Article 8/9 products and DNSH are elements of specific regulations."],correct:1,slide:"Slide 16"},
{q:"The Omnibus Directive proposal narrows mandatory CSRD reporting to:",opts:["All listed companies regardless of size","Large undertakings with more than 1,000 employees","All companies with more than €50 million in turnover","Only companies with more than 5,000 employees"],exps:["❌ The Omnibus Directive narrows scope significantly.","✅ Correct — the Omnibus Directive proposal limits mandatory CSRD reporting to large undertakings with more than 1,000 employees.","❌ The €50 million turnover threshold is not the Omnibus Directive criterion.","❌ The threshold is 1,000 employees, not 5,000."],correct:1,slide:"Slide 16"}
,
{q:"The three obstacles to sustainable finance identified in the EU Action Plan (2018) are:",opts:["Insufficient capital, inadequate regulation, and lack of consumer demand", "Fragmented standards (absence of unified taxonomy), data complexity (collecting and analysing sustainability data), and regulatory integration challenges", "Greenwashing risk, inadequate penalties, and lack of international coordination", "Short-termism, insufficient ESG research, and inadequate sustainable bond markets"],exps:["❌ Insufficient capital and consumer demand are not the three obstacles identified.", "✅ Correct — the three obstacles are: (1) fragmented standards and absence of a common taxonomy; (2) data complexity; (3) regulatory integration challenges.", "❌ Greenwashing risk is a result of fragmented standards, not itself one of the three main obstacles.", "❌ Short-termism and insufficient research are related issues but not the three obstacles identified."],correct:1,slide:"Slide 16"},
{q:"The Taxonomy Regulation's Article 8 disclosure obligation requires CSRD-subject companies to:",opts:["Only disclose whether they have a sustainability strategy", "Report the percentage of their turnover and capital/operating expenditure attributable to taxonomy-aligned (sustainable) activities", "Obtain third-party certification of taxonomy alignment before disclosure", "Disclose only when 100% of their activities are taxonomy-aligned"],exps:["❌ A general sustainability strategy disclosure is insufficient.", "✅ Correct — Article 8 requires CSRD-subject entities to report the percentage of turnover and capital/operating expenditure on taxonomy-aligned activities.", "❌ Third-party certification is not required for taxonomy alignment disclosure.", "❌ Disclosure is required regardless of the alignment percentage; even 0% alignment must be disclosed."],correct:1,slide:"Slide 16"},
{q:"The SFDR requires financial market participants to disclose policies on:",opts:["Their own carbon footprint and net-zero plans", "Integration of sustainability risks, whether and how principal adverse impacts (PAIs) are considered, and how remuneration policies align with sustainability risk integration", "Only product-level ESG ratings from EU-registered ESG rating agencies", "Only information about Article 9 sustainable investment products"],exps:["❌ Own carbon footprint disclosure is addressed by CSRD, not SFDR.", "✅ Correct — SFDR requires financial market participants to disclose: policies on integrating sustainability risks; whether and how PAIs are considered; and how remuneration policies align with sustainability risk integration.", "❌ SFDR does not require disclosure of ESG ratings from registered agencies.", "❌ SFDR disclosure requirements apply to all financial market participants."],correct:1,slide:"Slide 16"},
{q:"The CSDDD's complaints mechanisms must:",opts:["Be exclusively internal mechanisms accessible only to employees", "Establish accessible channels for complaints and notifications accessible to persons potentially affected by companies' adverse human rights and environmental impacts", "Be maintained only during CSDDD compliance audits", "Be limited to environmental complaints and not extend to human rights issues"],exps:["❌ Complaints mechanisms must be accessible to external affected persons, not only employees.", "✅ Correct — complaints mechanisms must establish accessible channels for complaints and notifications accessible to persons potentially affected by companies' adverse human rights and environmental impacts.", "❌ Complaints mechanisms are ongoing, not only active during audits.", "❌ The CSDDD covers both human rights and environmental adverse impacts."],correct:1,slide:"Slide 16"}
],
"17 — Benchmarks & Credit Ratings":[
{q:"The LIBOR scandal involved which key systemic flaw?",opts:["LIBOR was administered by a government body with excessive regulatory power","LIBOR was administered by the British Bankers' Association — representing the very banks whose inputs determined the benchmark — creating a structural conflict of interest","LIBOR was administered by the ECB without oversight from national authorities","LIBOR was only used in the UK and not relevant to EU regulation"],exps:["❌ LIBOR was administered by a private industry body, not a government body.","✅ Correct — LIBOR was administered by the BBA representing the very banks whose inputs determined it, creating a clear structural conflict of interest.","❌ LIBOR was not administered by the ECB.","❌ LIBOR was used across the global financial system."],correct:1,slide:"Slide 17"},
{q:"The Benchmarks Regulation (EU 2016/1011) was adopted on:",opts:["January 1, 2018 (entry into force)","June 29, 2016","March 15, 2019","December 31, 2021"],exps:["❌ January 1, 2018 is when the Regulation entered into force, not when it was adopted.","✅ Correct — the Benchmarks Regulation was adopted on June 29, 2016; it entered into force on January 1, 2018.","❌ March 15, 2019 is not the adoption date.","❌ December 31, 2021 is not the adoption date."],correct:1,slide:"Slide 17"},
{q:"The only identified EU critical benchmark under the Benchmarks Regulation is:",opts:["LIBOR, administered by ICE Benchmark Administration under UK FCA oversight","EURIBOR, administered by the European Money Markets Institute (EMMI) under ESMA supervision since January 1, 2022","SOFR, administered by the New York Federal Reserve","SONIA, administered by the Bank of England"],exps:["❌ LIBOR is a UK benchmark no longer in EU critical benchmark scope.","✅ Correct — EURIBOR is currently the only identified EU critical benchmark, administered by EMMI under ESMA supervision since January 1, 2022.","❌ SOFR is a US benchmark, not an EU critical benchmark.","❌ SONIA is a UK benchmark, not an EU critical benchmark."],correct:1,slide:"Slide 17"},
{q:"Benchmark administrators require registration (not full authorisation) when:",opts:["The administrator provides only critical benchmarks subject to the most demanding requirements","The administrator is already supervised as a credit institution or investment firm, or provides only non-critical benchmarks","The administrator is headquartered outside the EU but provides benchmarks used in EU markets","The administrator provides benchmarks exclusively to professional investors"],exps:["❌ Critical benchmarks are subject to authorisation, not registration.","✅ Correct — registration (with less extensive assessment) is sufficient if the administrator is already supervised (e.g., credit institution, investment firm) or provides only non-critical benchmarks.","❌ Third-country administrators need recognition, endorsement, or equivalence.","❌ The investor base does not determine the authorisation/registration distinction."],correct:1,slide:"Slide 17"},
{q:"The Credit Rating Agencies Regulation (1060/2009) was enacted on:",opts:["June 29, 2016","September 16, 2009","January 1, 2015","March 20, 2012"],exps:["❌ June 29, 2016 is the Benchmarks Regulation adoption date.","✅ Correct — the CRA Regulation was enacted on September 16, 2009.","❌ January 1, 2015 is not the CRA Regulation enactment date.","❌ March 20, 2012 is not the CRA Regulation enactment date."],correct:1,slide:"Slide 17"},
{q:"A credit rating is defined as:",opts:["A mathematical model predicting probability of default","An opinion on the creditworthiness of an entity, debt, or financial instrument, issued using an established and defined ranking system of rating categories","A regulatory assessment of a financial institution's capital adequacy","A market consensus view on the fair value of a financial instrument"],exps:["❌ Mathematical models may underpin ratings, but a credit rating is an opinion.","✅ Correct — a credit rating is an opinion on the creditworthiness of an entity, debt, financial obligation, or instrument, issued using an established and defined ranking system.","❌ Capital adequacy assessments are conducted by supervisors.","❌ Fair value assessments are financial analyses; credit ratings concern creditworthiness."],correct:1,slide:"Slide 17"},
{q:"The CRA Regulation's 'mitigate over-reliance' requirement means:",opts:["All CRA ratings must be approved by a second independent CRA before use","Financial institutions must make their own credit risk assessment and not solely or mechanistically rely on credit ratings; ESAs and ESRB are prohibited from referencing ratings in guidelines/recommendations if this could trigger sole or mechanistic reliance","CRA ratings are purely advisory with no regulatory effect","All regulatory uses of credit ratings must be phased out within five years"],exps:["❌ A second CRA approval requirement is not part of the over-reliance mitigation regime.","✅ Correct — financial institutions must make own credit risk assessments; ESAs and ESRB cannot reference ratings in guidelines/recommendations if this could trigger sole or mechanistic reliance.","❌ CRA ratings do have regulatory effects.","❌ There is no five-year phase-out of all regulatory uses of ratings."],correct:1,slide:"Slide 17"},
{q:"The board independence requirement for CRA administrative or supervisory boards means:",opts:["All board members must be independent of the CRA and its shareholders","At least one-third of board members (minimum two) must be independent, not involved in rating activities, with compensation untied to business performance","The majority must be representatives of the European Commission","All board members must have at least 10 years of experience in financial regulation"],exps:["❌ Not all board members must be independent.","✅ Correct — at least one-third of board members (minimum two) must be independent, not involved in rating activities, with compensation untied to business performance.","❌ Commission representatives are not required on CRA boards.","❌ While experience is required, a specific 10-year requirement is not mandated."],correct:1,slide:"Slide 17"},
{q:"Third-country benchmarks may be used in the EU through which mechanisms?",opts:["Third-country benchmarks may be used without any assessment if the administrator voluntarily complies with EU standards","Recognition by ESMA, OR endorsement by an EU-authorised administrator or supervised entity, OR equivalence decision by the Commission","Third-country benchmarks require joint approval from the Commission and ESMA","Third-country benchmarks may be used only by professional investors"],exps:["❌ Third-country benchmark access is not freely permitted based on voluntary compliance alone.","✅ Correct — third-country benchmarks may be used in the EU through: (1) recognition by ESMA; (2) endorsement by an EU-authorised administrator; or (3) equivalence decision by the Commission.","❌ Joint Commission and ESMA approval is not the mechanism.","❌ Third-country benchmarks are not limited to professional investors if properly recognised."],correct:1,slide:"Slide 17"},
{q:"The Benchmarks Regulation adopted a 'market-based approach' rather than converting benchmarks into public undertakings because:",opts:["EU state aid rules prohibited benchmark administration by public bodies","Converting to public undertakings would reduce benchmark quality","To avoid political interference — private sector institutions continue producing benchmarks, balanced by significant obligations and responsibilities","Constitutional prohibitions prevent public bodies from financial market activities in most Member States"],exps:["❌ State aid rules are not the primary reason.","❌ Quality reduction is not the primary reason cited.","✅ Correct — the Regulation rejected public undertakings to avoid political interference; private sector institutions continue producing benchmarks, balanced by significant obligations.","❌ Constitutional prohibitions are not the reason; it was a deliberate policy decision."],correct:2,slide:"Slide 17"},
{q:"CRA independence under Article 6 of the CRA Regulation applies to:",opts:["Only the CRA's rating analysts and not management","The CRA itself, its shareholders, managers, analysts, employees, and any person linked by control — all must be free from conflicts affecting rating issuance","Only independent board members of the CRA","Only the CRA's relationships with issuers that are also shareholders"],exps:["❌ Article 6 applies broadly, not only to analysts.","✅ Correct — Article 6 requires the CRA itself, its shareholders, managers, analysts, employees, and any person linked by control to be free from any conflicts or business relationships affecting rating issuance.","❌ Article 6 applies beyond independent board members.","❌ Article 6 applies to all business relationships."],correct:1,slide:"Slide 17"},
{q:"The market-based approach to benchmark regulation allows private sector institutions to continue producing benchmarks, balanced by:",opts:["Voluntary self-regulation through industry codes only","Significant obligations and responsibilities including governance requirements, conflict of interest management, input data integrity standards, and ESMA/NCA supervisory oversight","Only disclosure requirements to market participants","No obligations — the market-based approach means minimal regulation"],exps:["❌ The Benchmarks Regulation imposes binding obligations, not merely voluntary self-regulation.","✅ Correct — private sector administrators are balanced by significant obligations: governance requirements, conflict of interest management, input data integrity standards, and supervisory oversight by ESMA or NCAs.","❌ Disclosure requirements are one element; the framework imposes much more.","❌ The market-based approach involves significant regulation; the term means avoiding public administration, not minimal regulation."],correct:1,slide:"Slide 17"}
,
{q:"A 'critical benchmark' under the Benchmarks Regulation is one whose failure would:",opts:["Affect at least one financial product with a notional value above €1 trillion", "Have significant adverse impacts on market integrity, financial stability, consumers, the real economy, or financing of households and businesses in one or more Member States", "Affect transactions referencing it in more than 10 Member States simultaneously", "Cause the withdrawal of more than five large financial institutions from the market"],exps:["❌ The €1 trillion notional value test is a quantitative element but not the sole definition.", "✅ Correct — a critical benchmark is one whose failure would have significant adverse impacts on market integrity, financial stability, consumers, the real economy, or financing of households and businesses in one or more Member States.", "❌ The number of affected Member States is one element but not the complete definition.", "❌ The number of withdrawing institutions is not the benchmark criticality definition."],correct:1,slide:"Slide 17"},
{q:"The Benchmarks Regulation requires administrators to maintain a permanent Oversight Committee that:",opts:["Is appointed by the NCA with a majority of independent members", "Reviews methodology, oversees changes, and handles oversight functions — as part of the broader governance framework including clear organisational structure, control procedures, accounting systems, and transparency publication requirements", "Is composed jointly with ESMA representatives", "Is composed exclusively of contributors to the benchmark"],exps:["❌ The Oversight Committee is maintained by the administrator, not appointed by the NCA.", "✅ Correct — benchmark administrators must maintain a permanent Oversight Committee to review methodology, oversee changes, and handle oversight functions, alongside governance requirements.", "❌ ESMA representatives are not required on the Oversight Committee.", "❌ The Oversight Committee is not composed exclusively of contributors."],correct:1,slide:"Slide 17"},
{q:"The CRA Regulation defines a 'Credit Rating Agency' as:",opts:["Any entity that publishes opinions on creditworthiness, including financial media and investment banks", "A legal person whose professional activities include issuing credit ratings on a professional basis — applying to ratings disclosed publicly or distributed by subscription", "Any entity that uses credit ratings in investment decisions", "Only the three major global rating agencies (Moody's, S&P, and Fitch)"],exps:["❌ Financial media and investment banks are not CRAs simply by publishing creditworthiness opinions.", "✅ Correct — a CRA is a legal person whose professional activities include issuing credit ratings on a professional basis; the Regulation applies to ratings disclosed publicly or distributed by subscription.", "❌ Entities using credit ratings are not CRAs.", "❌ The CRA Regulation applies to all CRAs meeting the definition."],correct:1,slide:"Slide 17"},
{q:"Input data integrity under the Benchmarks Regulation requires administrators to:",opts:["Only accept data submitted by regulated financial institutions", "Implement systems and controls to ensure input data integrity, identify and report conduct suggesting manipulation, and ensure reliable and representative contributor data unaffected by conflicts of interest", "Obtain NCA pre-approval of all input data before benchmark determination", "Publish all raw input data from contributors before benchmark calculation"],exps:["❌ Input data may come from various sources; the regulation focuses on integrity.", "✅ Correct — input data integrity requirements include: systems and controls ensuring data integrity; detection and reporting of conduct suggesting manipulation; and ensuring reliable contributor data unaffected by conflicts of interest.", "❌ NCA pre-approval of each input is not required.", "❌ Publishing raw input data before calculation is not required."],correct:1,slide:"Slide 17"}
],
"18 — MiCAR, DORA & DLTR":[
{q:"MiCAR (Regulation EU 2023/1114) became fully applicable on:",opts:["January 1, 2023","June 2023 (adoption date)","30 December 2024","January 17, 2025"],exps:["❌ January 1, 2023 is not the full applicability date.","❌ June 2023 is when MiCAR was adopted, not when it became fully applicable.","✅ Correct — MiCAR became fully applicable on 30 December 2024.","❌ January 17, 2025 is when DORA became applicable, not MiCAR."],correct:2,slide:"Slide 18"},
{q:"MiCAR defines a 'crypto-asset' as:",opts:["Any digital currency issued by a central bank as legal tender","A digital representation of value or rights that can be transferred and stored electronically, using distributed-ledger or similar technology — 'similar technology' future-proofs the perimeter","Any investment in blockchain-based projects regardless of the underlying technology","A financial instrument as defined under Section C of Annex I to MiFID II"],exps:["❌ Central bank digital currencies (CBDCs) are explicitly outside MiCAR's scope.","✅ Correct — MiCAR defines a crypto-asset as a digital representation of value or rights that can be transferred and stored electronically, using distributed-ledger or similar technology.","❌ The definition is specifically tied to distributed-ledger or similar technology.","❌ MiFID II financial instruments are explicitly outside MiCAR's scope."],correct:1,slide:"Slide 18"},
{q:"MiCAR's taxonomy classifies crypto-assets into which four categories?",opts:["Bitcoin, Ethereum, stablecoins, and utility tokens","Asset-Referenced Tokens (ARTs), E-Money Tokens (EMTs), Utility Tokens, and Other Crypto-Assets","Securities tokens, payment tokens, utility tokens, and non-fungible tokens","Currency tokens, commodity tokens, equity tokens, and debt tokens"],exps:["❌ Bitcoin and Ethereum are specific crypto-assets; MiCAR classifies by type.","✅ Correct — MiCAR classifies crypto-assets into ARTs (value tracks a basket), EMTs (linked one-to-one to a single fiat currency), Utility Tokens (grant access to goods/services), and Other Crypto-Assets.","❌ Non-fungible tokens are largely excluded from MiCAR's scope.","❌ Currency/commodity/equity/debt tokens are not the MiCAR taxonomy."],correct:1,slide:"Slide 18"},
{q:"Under MiCAR, which instruments are explicitly OUTSIDE its scope?",opts:["All utility tokens regardless of whether traded on a platform","MiFID II financial instruments, bank and structured deposits, funds, securitisations (unless qualifying as EMTs), insurance/pension products, and the forthcoming digital euro","All NFTs regardless of structure","All ARTs issued by non-EU entities"],exps:["❌ Utility tokens may be within MiCAR scope if admission to trading is sought.","✅ Correct — outside MiCAR scope: MiFID financial instruments, bank/structured deposits, UCITS/AIFs, securitisation positions (unless qualifying as EMTs), insurance/pension products, and the forthcoming digital euro.","❌ NFTs with fungible characteristics may fall under MiCAR.","❌ Non-EU issued ARTs marketed in the EU still fall within MiCAR."],correct:1,slide:"Slide 18"},
{q:"Issuing an ART under MiCAR is a reserved activity that can only be conducted by:",opts:["Any legal person established in the EU with minimum capital of €350,000","A MiCAR-licensed entity OR a credit institution that satisfies Article 17 conditions — effectively making ART issuance a reserved activity","Only central banks or other public authorities","Only investment firms already licensed under MiFID II"],exps:["❌ Minimum capital alone does not permit ART issuance; specific authorisation is required.","✅ Correct — ART issuance is reserved to either a MiCAR-licensed legal person established in the EU or a credit institution satisfying the Article 17 conditions.","❌ ARTs are private sector instruments; central banks are not the issuers.","❌ MiFID II investment firms may be CASPs but ART issuance requires a separate MiCAR licence or credit institution status."],correct:1,slide:"Slide 18"},
{q:"An ART becomes 'significant' and supervision migrates to EBA when it surpasses at least three thresholds including:",opts:["€100M in reserve assets and 1M daily transactions","10M+ holders, €5B+ in reserve assets, or 2.5M daily transactions — among other thresholds","€1B in reserve assets and 500K daily transactions","5M holders and €10B in reserve assets"],exps:["❌ €100M and 1M daily transactions are not the cited thresholds.","✅ Correct — significant ART thresholds include 10M+ holders, €5B+ reserve assets, or 2.5M daily transactions (among other criteria); supervisory responsibility migrates to EBA.","❌ €1B and 500K daily transactions are not the cited thresholds.","❌ 5M holders and €10B are not the specific thresholds cited."],correct:1,slide:"Slide 18"},
{q:"MiCAR contains no passport or equivalence provisions for third-country firms. This means:",opts:["Third-country firms may freely offer services in the EU without authorisation","Service providers from third countries must establish in the Union and submit to EU supervision — the only exception is the reverse-solicitation clause","Third-country firms may offer services after registering with ESMA","Third-country firms may offer services after obtaining a Commission equivalence decision"],exps:["❌ Third-country firms cannot freely offer services without authorisation.","✅ Correct — MiCAR has no passport or equivalence for third-country firms; they must establish in the Union, with the only exception being reverse solicitation by a Union client acting on own initiative.","❌ Registration with ESMA is not the mechanism; full establishment and authorisation are required.","❌ No equivalence decision pathway exists under MiCAR for third-country service providers."],correct:1,slide:"Slide 18"},
{q:"The DLT Pilot Regulation (EU 2022/858) establishes:",opts:["A permanent framework replacing traditional securities settlement systems with DLT","A time-limited regulatory sandbox allowing market operators and CSDs to experiment with DLT for trading and settlement of traditional securities while remaining under EU law","A mandatory transition programme for all EU trading venues to adopt DLT by 2030","A full authorisation regime for blockchain-based settlement systems replacing CSDR"],exps:["❌ The DLT Pilot is temporary, not a permanent replacement framework.","✅ Correct — the DLT Pilot Regulation establishes a time-limited regulatory sandbox allowing market operators and CSDs to experiment with DLT while remaining under the protective umbrella of Union law.","❌ The DLT Pilot is voluntary, not a mandatory transition programme.","❌ The DLT Pilot is a sandbox, not a full authorisation regime."],correct:1,slide:"Slide 18"},
{q:"DORA (Digital Operational Resilience Act, EU 2022/2554) became applicable on:",opts:["December 30, 2024","January 17, 2025","June 1, 2023","January 1, 2022"],exps:["❌ December 30, 2024 is when MiCAR became fully applicable.","✅ Correct — DORA became applicable on January 17, 2025.","❌ June 1, 2023 is not when DORA became applicable.","❌ January 1, 2022 is not when DORA became applicable."],correct:1,slide:"Slide 18"},
{q:"DORA covers which key pillars of digital operational resilience?",opts:["Only cybersecurity incident reporting for banks and payment institutions","ICT-risk governance, incident management, resilience testing, third-party risk management, and critical ICT provider oversight by ESAs — binding the entire financial ecosystem","Only penetration testing requirements for systemically important financial institutions","Only business continuity planning for insurance undertakings"],exps:["❌ DORA is much broader; it applies across the financial ecosystem.","✅ Correct — DORA covers: ICT-risk governance, incident management, resilience testing (from basic vulnerability assessments to full threat-led penetration tests), third-party risk, and critical ICT provider oversight by ESAs.","❌ Penetration testing is one element of DORA's resilience testing pillar.","❌ DORA applies to the entire financial ecosystem, not only insurance."],correct:1,slide:"Slide 18"},
{q:"The DLT Pilot Regulation creates which three types of DLT market infrastructure?",opts:["DLT-RM, DLT-MTF, DLT-OTF","DLT-MTF (multilateral trading facility recording issuance, trading and ownership on-chain), DLT-SS (securities settlement system performing notary/settlement/custody on-chain), and DLT-TSS (hybrid combining both in one legal entity)","DLT-CCP, DLT-CSD, and DLT-TR","DLT-AIF, DLT-UCITS, and DLT-MMF"],exps:["❌ DLT-RM and DLT-OTF are not the DLT Pilot categories.","✅ Correct — the DLT Pilot creates DLT-MTF, DLT-SS, and DLT-TSS (a hybrid combining both trading and settlement in one legal entity).","❌ DLT-CCP, DLT-CSD, and DLT-TR are not the three DLT Pilot categories.","❌ DLT-AIF, DLT-UCITS, and DLT-MMF are not DLT Pilot infrastructure categories."],correct:1,slide:"Slide 18"},
{q:"The 'Brussels Effect' in MiCAR refers to:",opts:["The decision to locate ESMA's crypto-asset department in Brussels","The EU positioning itself as the first large jurisdiction with a uniform rulebook for crypto-asset markets — potentially influencing global regulatory standards","The requirement that all crypto-assets be registered with the Belgian FSMA","The Brussels Convention applying to crypto-asset disputes"],exps:["❌ The Brussels Effect refers to the regulatory impact of EU standards, not a physical location.","✅ Correct — MiCAR positions the EU as the first large jurisdiction with a uniform rulebook for crypto-asset markets, potentially influencing global regulatory standards (the 'Brussels Effect').","❌ The Belgian FSMA is not the EU-level supervisor for crypto-assets.","❌ The Brussels Convention is a private international law instrument."],correct:1,slide:"Slide 18"},
{q:"The NFT exclusion under MiCAR Article 2(3) provides that:",opts:["All NFTs are unconditionally excluded from MiCAR regardless of their characteristics","Crypto-assets that are unique and non-fungible are excluded — but fractional interests in supposedly unique tokens are fungible, and issuing a large series suggests fungibility","NFTs are regulated as utility tokens under MiCAR if they grant access to digital goods","NFTs are classified as ARTs if their value tracks the performance of a basket of digital assets"],exps:["❌ The exclusion is conditional; fungibility of NFTs may bring them within MiCAR.","✅ Correct — Article 2(3) excludes unique and non-fungible crypto-assets, but fractional interests are fungible; issuing a large series suggests fungibility; a unique identifier alone is insufficient.","❌ Genuinely unique and non-fungible NFTs are excluded from MiCAR regardless of whether they grant access to goods.","❌ NFTs do not become ARTs by tracking a basket."],correct:1,slide:"Slide 18"}
,
{q:"The MiCAR/MiFID frontier creates ambiguity because:",opts:["MiCAR and MiFID have identical definitions of financial instruments", "Terms such as 'negotiability' and 'class of securities' in MiFID sit uneasily with programmable tokens — whether a token is a financial instrument (MiFID) or a crypto-asset (MiCAR) has major consequences for disclosure, conduct rules, and supervisory competence", "MiCAR explicitly defers to MiFID for all classification questions", "The Commission has not yet adopted guidelines clarifying the MiFID/MiCAR boundary"],exps:["❌ MiCAR and MiFID use different definitions.", "✅ Correct — the ambiguity stems from MiFID terms like 'negotiability' and 'class of securities' sitting uneasily with programmable tokens; classification as financial instrument (MiFID) or crypto-asset (MiCAR) has major regulatory consequences.", "❌ MiCAR does not defer to MiFID for classification; it establishes its own taxonomy.", "❌ ESMA has issued Guidelines (ESMA75-453128700-1323) on qualifying crypto-assets as financial instruments."],correct:1,slide:"Slide 18"},
{q:"Under MiCAR, the utility token exemption from the white-paper requirement applies when:",opts:["The utility token is listed on a recognised EU crypto-asset trading platform", "The token only unlocks an existing good or service — the exemption disappears if the offeror announces or subsequently seeks admission to trading on a crypto-asset trading platform", "The token is used exclusively by professional investors", "The token's market capitalisation remains below €1 million"],exps:["❌ Being listed on a platform removes the exemption.", "✅ Correct — if a utility token only unlocks an already existing good or service, its public offer is exempt from the white-paper requirement; the exemption disappears if the offeror announces or seeks admission to trading.", "❌ Investor category is not the basis for this exemption.", "❌ Market capitalisation is not the basis for this exemption."],correct:1,slide:"Slide 18"},
{q:"MiCAR's two regulatory tracks are:",opts:["A national track for small issuers and an EU track for large issuers", "Issuers/offerors (disclosure-based: white paper, 20 working days notice, no prior approval, civil liability for signatories) AND CASPs (full authorisation: licence procedure, own-fund requirements, organisational standards, conduct duties, EU passport once licensed)", "A public track for retail investors and a private track for professional investor placements", "A technology track for DeFi protocols and a traditional track for centralised crypto exchanges"],exps:["❌ The two tracks are not based on issuer size.", "✅ Correct — MiCAR has two tracks: issuers/offerors (disclosure-based requirements) and CASPs (full authorisation requirements including licence, own funds, organisational standards, conduct duties, EU passport).", "❌ The two tracks are not based on investor type.", "❌ DeFi protocols are largely out of scope."],correct:1,slide:"Slide 18"},
{q:"DORA's 'third-party risk' pillar requires financial entities to include in ICT contracts:",opts:["Mandatory transfer of all software source code to the financial entity", "Detailed contract provisions on availability, data integrity, access, audit rights, and exit strategies", "Only a general confidentiality clause and service level agreement", "Provisions requiring the ICT provider to be established in an EU Member State"],exps:["❌ Transfer of software source code is not a standard DORA requirement.", "✅ Correct — DORA requires detailed contract provisions covering availability, data integrity, access, audit rights, and exit strategies when financial entities rely on third-party ICT providers.", "❌ A general confidentiality clause and SLA alone are insufficient for DORA compliance.", "❌ DORA does not require ICT providers to be established in the EU."],correct:1,slide:"Slide 18"}
]
,
"19 — Crowdfunding":[
{q:"Regulation (EU) 2020/1503 on European crowdfunding service providers became fully applicable on:",opts:["January 1, 2020","November 21, 2021","June 30, 2022","January 1, 2023"],exps:["❌ January 1, 2020 is not the correct date.","✅ Correct — Regulation (EU) 2020/1503 became fully applicable across all Member States on November 21, 2021.","❌ June 30, 2022 is not the correct date.","❌ January 1, 2023 is not the correct date."],correct:1,slide:"Slide 19"},
{q:"The Crowdfunding Regulation was adopted as part of which EU initiative?",opts:["The post-2008 financial crisis regulatory reform package","The Capital Markets Union (CMU) Action Plan","The Digital Finance Package alongside MiCAR and DORA","The Retail Investment Package alongside the 2023 MiFID II amendments"],exps:["❌ The post-crisis reform package focused on banking, derivatives, and market infrastructure.","✅ Correct — the Crowdfunding Regulation was adopted as part of the Capital Markets Union Action Plan, introducing a unified legal regime and European passport for crowdfunding service providers.","❌ The Digital Finance Package addressed crypto-assets (MiCAR) and ICT risk (DORA); crowdfunding is separate.","❌ The 2023 Retail Investment Package addressed MiFID II, PRIIPs, and financial literacy."],correct:1,slide:"Slide 19"},
{q:"Under Article 3(1) of the Crowdfunding Regulation, only which entities may be authorised to provide crowdfunding services?",opts:["Natural persons with relevant financial qualifications","Legal persons established in the EU — natural persons and third-country entities are excluded from the authorisation regime","Any entity registered with ESMA regardless of establishment location","Only credit institutions and investment firms already licensed under MiFID II"],exps:["❌ Natural persons are excluded from authorisation as crowdfunding service providers.","✅ Correct — only legal persons established in the EU may be authorised; natural persons and entities established in third countries are excluded.","❌ ESMA registration alone is not the mechanism; national competent authority authorisation is required.","❌ The Crowdfunding Regulation creates a separate authorisation regime for crowdfunding; MiFID II licensing is not required."],correct:1,slide:"Slide 19"},
{q:"The Crowdfunding Regulation covers which two primary types of crowdfunding services?",opts:["Donation-based and reward-based crowdfunding","Lending-based crowdfunding (facilitation of loan agreements between investors and project owners) and investment-based crowdfunding (placement of securities or crowdfunding instruments without firm underwriting commitment)","Peer-to-peer personal lending and corporate bond issuance","Real estate crowdfunding and equity crowdfunding for listed companies"],exps:["❌ Donation-based and reward-based crowdfunding are outside the scope of this Regulation.","✅ Correct — the Regulation covers lending-based crowdfunding (facilitating loan agreements) and investment-based crowdfunding (placement of securities or crowdfunding instruments without firm underwriting commitment).","❌ Peer-to-peer personal lending is excluded from the Regulation's scope.","❌ Real estate crowdfunding may be within scope but only for unlisted, non-consumer projects; listed company bond issuance is covered by other regimes."],correct:1,slide:"Slide 19"},
{q:"The Crowdfunding Regulation's quantitative threshold under Article 1(2)(c) limits its application to offers that do not exceed:",opts:["€1 million over 12 months","€5 million over 12 months — exceeding this may trigger the Prospectus Regulation","€10 million over 12 months","€50 million over 12 months"],exps:["❌ €1 million is the original general Prospectus Regulation exemption threshold, not the Crowdfunding Regulation threshold.","✅ Correct — the Crowdfunding Regulation applies only to offers not exceeding EUR 5 million over 12 months; exceeding this threshold may trigger the Prospectus Regulation.","❌ €10 million is not the Crowdfunding Regulation threshold.","❌ €50 million is the EU Growth Prospectus consideration threshold."],correct:1,slide:"Slide 19"},
{q:"The three key players in the crowdfunding ecosystem are:",opts:["Regulator, platform operator, and investor","Project owner (seeking funds), investors (providing financing), and crowdfunding service provider (operating the platform and facilitating matching)","Manufacturer, distributor, and retail client","Issuer, underwriter, and market maker"],exps:["❌ The regulator is not one of the three operational players in the crowdfunding ecosystem.","✅ Correct — the three players are: project owner (seeking funds), investors (providing financing via the platform), and crowdfunding service provider (the intermediary operating the platform and facilitating matching).","❌ Manufacturer, distributor, and retail client describes the PRIIPs framework.","❌ Issuer, underwriter, and market maker describes traditional capital markets, not crowdfunding."],correct:1,slide:"Slide 19"},
{q:"The minimum capital requirement for crowdfunding service providers is:",opts:["€100,000 or one quarter of fixed overheads, whichever is higher","€25,000 or one quarter of fixed overheads for the preceding year, whichever is higher — may be satisfied through own funds, PI insurance, or a combination","€500,000 — equivalent to a small investment firm","€1,000,000 — equivalent to a credit institution"],exps:["❌ €100,000 is not the Crowdfunding Regulation minimum capital requirement.","✅ Correct — the minimum capital requirement is €25,000 or one quarter of fixed overheads for the preceding year, whichever is higher; may be satisfied through own funds, professional indemnity insurance, or a combination.","❌ €500,000 is not the crowdfunding minimum capital requirement.","❌ €1,000,000 is not the crowdfunding minimum capital requirement."],correct:1,slide:"Slide 19"},
{q:"The Key Investment Information Sheet (KIIS) under the Crowdfunding Regulation is:",opts:["Prepared by the crowdfunding service provider based on their own due diligence","The primary disclosure instrument prepared by the project owner (with provider verification) containing comprehensive information on the offer — and crowdfunding offers within scope are expressly exempted from the Prospectus Regulation's prospectus obligation","Prepared by ESMA as a standardised document for all crowdfunding projects","Equivalent to the KID under the PRIIPs Regulation and may substitute for it"],exps:["❌ The KIIS is primarily the project owner's responsibility, with provider verification.","✅ Correct — the KIIS is prepared by the project owner, verified by the provider; crowdfunding offers within scope are expressly exempted from the Prospectus Regulation's prospectus obligation.","❌ ESMA does not prepare individual KIISs.","❌ The KIIS and the KID are distinct instruments serving different purposes."],correct:1,slide:"Slide 19"},
{q:"The investor classification under the Crowdfunding Regulation distinguishes between:",opts:["Retail clients and professional clients as defined under MiFID II — identical to MiFID II classification","Sophisticated investors (capable of fully understanding risks and bearing losses) and unsophisticated investors (all others — subject to entry knowledge test and 4-day cooling-off period)","Qualified investors and non-qualified investors as defined under the Prospectus Regulation","Eligible counterparties and retail clients as defined under MiFID II"],exps:["❌ The Crowdfunding Regulation creates its own investor classification, distinct from MiFID II.","✅ Correct — the Crowdfunding Regulation distinguishes sophisticated investors (who fully understand risks) from unsophisticated investors (all others), with the latter subject to an entry knowledge test and a 4-day cooling-off period.","❌ Qualified/non-qualified investors are a Prospectus Regulation concept; the Crowdfunding Regulation uses its own classification.","❌ Eligible counterparties/retail clients is MiFID II terminology; the Crowdfunding Regulation creates its own categories."],correct:1,slide:"Slide 19"},
{q:"Unsophisticated investors benefit from a cooling-off period of:",opts:["1 day","2 days","4 days — allowing withdrawal of the investment commitment without penalty after submission of offer or expression of interest","7 days"],exps:["❌ 1 day is below the Crowdfunding Regulation cooling-off period.","❌ 2 days is below the Crowdfunding Regulation cooling-off period.","✅ Correct — unsophisticated investors benefit from a 4-day cooling-off period, permitting withdrawal of the investment commitment without penalty.","❌ 7 days exceeds the cooling-off period specified in the Crowdfunding Regulation."],correct:2,slide:"Slide 19"},
{q:"For unsophisticated investors investing amounts exceeding EUR 1,000 or 5% of net worth, the Crowdfunding Regulation requires:",opts:["Automatic rejection of the investment order","A risk warning, explicit consent, and demonstration of understanding that the investment may result in total loss of the amount invested","A mandatory 30-day waiting period before the investment can be confirmed","Approval from the national competent authority before the investment proceeds"],exps:["❌ Automatic rejection is not the required response; additional protective steps are required.","✅ Correct — for amounts exceeding EUR 1,000 or 5% of net worth, the provider must issue a risk warning, obtain explicit consent, and confirm the investor demonstrates understanding that the investment may result in total loss.","❌ A 30-day waiting period is not required; the cooling-off period is 4 days.","❌ NCA approval for individual investments is not required."],correct:1,slide:"Slide 19"},
{q:"The maximum administrative fine for crowdfunding service providers under the Crowdfunding Regulation is:",opts:["€100,000 or 1% of annual turnover, whichever is higher","€500,000 or 5% of annual turnover, whichever is higher — and where economic benefit exceeds these amounts, fines may reach twice the benefit gained","€1,000,000 fixed fine regardless of turnover","€50,000 or 0.5% of annual turnover, whichever is higher"],exps:["❌ €100,000 and 1% are below the regulatory maximum.","✅ Correct — administrative fines may reach €500,000 or 5% of annual turnover, whichever is higher; where economic benefit exceeds these amounts, fines may reach twice the benefit gained.","❌ €1,000,000 fixed fine is not the correct structure.","❌ €50,000 and 0.5% are below the regulatory maximum."],correct:1,slide:"Slide 19"},
{q:"Crowdfunding service providers are prohibited from:",opts:["Operating both lending-based and investment-based crowdfunding on the same platform","Offering or accepting remuneration, rebates, or non-monetary benefits in exchange for directing investor orders toward particular crowdfunding offers — and from participating in offers on their own platform","Providing crowdfunding services in more than three Member States","Offering crowdfunding services to non-EU investors"],exps:["❌ Providers may operate both types of crowdfunding on the same platform.","✅ Correct — providers cannot offer or accept inducements directing investors to particular offers, and cannot participate in offers on their own platform (conflicts of interest management under Articles 3(3) and 8).","❌ The European passport allows cross-border services throughout the EU without limit.","❌ The Regulation does not prohibit serving non-EU investors; it regulates EU-established providers."],correct:1,slide:"Slide 19"},
{q:"The entry knowledge test for unsophisticated investors assesses:",opts:["Only the investor's financial wealth and ability to bear losses","Sophistication level, experience, investment objectives, financial situation, and risk understanding — if insufficient, the provider must issue a warning but may still grant access","Only whether the investor has previously invested in crowdfunding projects","Only whether the investor holds a professional financial qualification"],exps:["❌ The knowledge test covers more than financial wealth.","✅ Correct — the entry knowledge test assesses sophistication level, experience, investment objectives, financial situation, and risk understanding; if the test indicates insufficient understanding, the provider must warn the investor but may still grant access.","❌ Previous crowdfunding investment history alone is insufficient.","❌ Professional financial qualifications alone are not what the test assesses."],correct:1,slide:"Slide 19"},

const LABELS = ['A','B','C','D'];
let selectedTopic = 'ALL';
let selectedMode = 10;
let sessionQ = [], cur = 0, score = 0, answered = false, wrongs = [];
let sessions = 0, bestScore = null;

function buildTopics() {
  const grid = document.getElementById('topic-grid');
  const allBtn = document.createElement('div');
  allBtn.className = 'topic-btn active';
  allBtn.innerHTML = '<div class="tb-num">ALL</div><div class="tb-name">All Topics Mixed</div>';
  allBtn.onclick = () => selectTopic(allBtn, 'ALL');
  grid.appendChild(allBtn);
  Object.keys(TOPICS).forEach(key => {
    const btn = document.createElement('div');
    btn.className = 'topic-btn';
    const parts = key.split(' — ');
    btn.innerHTML = '<div class="tb-num">'+parts[0]+'</div><div class="tb-name">'+(parts[1]||'')+'</div>';
    btn.onclick = () => selectTopic(btn, key);
    grid.appendChild(btn);
  });
  const total = Object.values(TOPICS).reduce((s,v)=>s+v.length,0);
  document.getElementById('stat-total').textContent = total;
}

function selectTopic(el, topic) {
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedTopic = topic;
}

function selectMode(el, n) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedMode = n;
}

function getPool() {
  if (selectedTopic === 'ALL') return Object.values(TOPICS).flat();
  return TOPICS[selectedTopic] || [];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = getPool();
  if (!pool.length) return;
  sessionQ = shuffle(pool).slice(0, Math.min(selectedMode, pool.length));
  cur = 0; score = 0; answered = false; wrongs = [];
  show('quiz-card'); hide('home-card'); hide('score-card');
  renderQ();
}

function renderQ() {
  const q = sessionQ[cur];
  const pct = Math.round((cur/sessionQ.length)*100);
  document.getElementById('q-num').textContent = 'Question '+(cur+1)+' of '+sessionQ.length;
  document.getElementById('q-score').textContent = '✅ '+score+' correct';
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('q-topic').textContent = q.slide ? '📖 '+q.slide : '';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('next-wrap').style.display = 'none';
  document.getElementById('next-btn').textContent = (cur+1<sessionQ.length) ? 'Next question →' : 'See results →';
  document.getElementById('opts').innerHTML = q.opts.map((o,i) =>
    '<button class="ob" id="ob'+i+'" onclick="answer('+i+')">'
        +'<span class="ol">'+LABELS[i]+'.</span>'
        +'<div style="flex:1"><div>'+o+'</div><div class="opt-exp" id="exp'+i+'"></div></div>'
        +'</button>'
  ).join('');
  answered = false;
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const q = sessionQ[cur];
  for (let i=0; i<q.opts.length; i++) {
    const b = document.getElementById('ob'+i);
    const e = document.getElementById('exp'+i);
    b.disabled = true;
    e.textContent = q.exps[i];
    if (i===q.correct) b.classList.add(idx===q.correct?'correct':'reveal');
    else if (i===idx && idx!==q.correct) b.classList.add('wrong');
    else b.classList.add('neutral');
  }
  if (idx===q.correct) score++;
  else wrongs.push(cur);
  document.getElementById('q-score').textContent = '✅ '+score+' correct';
  document.getElementById('next-wrap').style.display = 'block';
}

function nextQ() {
  cur++;
  if (cur>=sessionQ.length) showScore();
  else renderQ();
}

function showScore() {
  hide('quiz-card'); show('score-card');
  sessions++;
  const pct = Math.round(score/sessionQ.length*100);
  if (bestScore===null || pct>bestScore) bestScore = pct;
  document.getElementById('stat-done').textContent = sessions;
  document.getElementById('stat-best').textContent = bestScore+'%';
  const msg = pct>=80 ? '🎯 Excellent! You are ready for the exam.'
             : pct>=60 ? '📚 Good result — review the topics you missed.'
             : '💪 Keep studying and try again!';
  document.getElementById('score-big').textContent = score+'/'+sessionQ.length;
  document.getElementById('score-pct').textContent = pct+'% correct';
  document.getElementById('score-msg').textContent = msg;
  document.getElementById('miss-section').innerHTML = wrongs.length>0
    ? '<div class="miss-title">📌 Topics to review:</div>'+wrongs.map(i=>'<div class="miss-item">'+sessionQ[i].q+'</div>').join('')
    : '<p style="color:#388e3c;font-size:14px">🎉 Perfect score! No topics to review.</p>';
}

function retryQuiz() { startQuiz(); }
function goHome() { hide('quiz-card'); hide('score-card'); show('home-card'); }
function show(id) { document.getElementById(id).style.display='block'; }
function hide(id) { document.getElementById(id).style.display='none'; }

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', buildTopics);
} else {
  buildTopics();
}
</script>
</body>
</html>
